<title>ASHFALL OUTPOST</title>
<!--
ASHFALL OUTPOST - single-file turn-based colony survival game.

ASSUMPTIONS MADE (per spec instruction not to ask questions):
- Turn resolution order (fixed, documented, executed in endTurn()):
    1. turn counter increments
    2. ashstorm check/damage (every 8 turns, severity scales with turn)
    3. production chains (in fixed building-index order; chains: sifter ash->soil,
       greenhouse soil+water->food, mine ->ore, forge ore+power->metal,
       workshop metal+power->parts, condenser ->water, vent tap ->power, scavenge ->parts/scrip)
    4. colonist needs (1 food + 1 water each; water x1.5 on storm turns)
    5. morale/fatigue update, departures, new arrivals
    6. event deck draw (45% chance, weighted, cooldowns)
    7. caravan timer + price drift
    8. end-condition check
- One worker slot per production building. Buildings without a job are passive.
- A free Command Post (housing 6) is pre-placed near map center; shelters add 4 housing each.
- Colonists at 0 morale refuse work for one full turn (visible warning), then leave if
  morale is still 0 - recoverable by feeding/festival/clinic.
- Storm damage: each building may lose HP. HP<50 = half output ("damaged"),
  HP<=0 = disabled. Repair costs 2 parts + 1 metal AND one idle colonist's labor (+20 fatigue).
- Caravan arrives every 6 turns and stays 2 turns. Prices = base x global drift (random walk)
  x local scarcity (your stockpile vs cap). Buy pays a markup, sell takes a cut;
  Barter Networks research narrows both.
- Win is evaluated at the end of turn 60 (pop>=12 and no food/water shortage that turn).
  Failing the check still shows a scored summary; "Continue (sandbox)" lets you keep playing.
- Fractional resources are allowed internally, displayed to 1 decimal.
- Seed editable in header; "New Game" restarts from that seed. All randomness flows through
  one mulberry32 stream stored in state (rngState), so save/load preserves determinism.
  Math.random is never used.
- Dev benchmark runs a fresh headless game from the seed field using a fixed greedy policy
  (build list, auto-assign, first-affordable research, auto-pick event option 1) for 200 turns.
- No TODOs: all 13 numbered systems are implemented.
-->

<script>
"use strict";
/* ============================ RNG (mulberry32) ============================ */
function mkRng(seedObj){          // seedObj: {s:uint32} mutated in place
  return function(){
    let t = seedObj.s = (seedObj.s + 0x6D2B79F5) | 0;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let S = null;                                     // the single game-state object
function rnd(){ return mkRng({get s(){return S.rngState;},set s(v){S.rngState=v;}})(); }
// simpler direct version (same math, avoids getter overhead):
function R(){
  let t = S.rngState = (S.rngState + 0x6D2B79F5) | 0;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function Ri(n){ return Math.floor(R() * n); }

/* ============================ STATIC DATA ============================ */

/* ============================ EVENTS ============================ */

      apply:s=>{s.colonists.forEach(c=>c.morale=clamp(c.morale-10,0,100));logMsg(s,"The coughing continues. Morale sinks.");}}
   ]},
  {id:"thieves", n:"Scrip Runners", w:2,
   text:"Armed scavengers demand tribute to leave your stores alone.",
   choices:[
     {label:"Pay 20 scrip",
      apply:s=>{spend(s,{scrip:Math.min(20,s.res.scrip)});logMsg(s,"The runners take their cut and vanish.");}},

        s.res.metal-=lm;s.res.parts-=lp;

const EVENT_COOLDOWN = 6;

/* ============================ STATE / NEW GAME ============================ */
function genMap(seed){
  const ro = {s:(seed|0)^0x9E3779B9};
  const r = mkRng(ro);
  const g = [];
  for(let i=0;i<64;i++) g.push("ash");
  // rock patches
  for(let k=0;k<4;k++){
    const cx=Math.floor(r()*8), cy=Math.floor(r()*8);
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const x=cx+dx,y=cy+dy;
      if(x>=0&&x<8&&y>=0&&y<8&&r()<0.7) g[y*8+x]="rock";
    }
  }
  // water blobs
  for(let k=0;k<2;k++){
    const cx=Math.floor(r()*8), cy=Math.floor(r()*8);
    for(let dy=0;dy<=1;dy++)for(let dx=0;dx<=1;dx++){
      const x=cx+dx,y=cy+dy;
      if(x>=0&&x<8&&y>=0&&y<8&&r()<0.85) g[y*8+x]="water";
    }
  }
  // vents (2-3) and ruins (3-4)
  let vents=0;
  while(vents<2+Math.floor(r()*2)){
    const i=Math.floor(r()*64);
    if(g[i]!=="water"){g[i]="vent";vents++;}
  }
  let ruins=0;
  while(ruins<3+Math.floor(r()*2)){
    const i=Math.floor(r()*64);
    if(g[i]==="ash"||g[i]==="rock"){g[i]="ruins";ruins++;}
  }
  return g;
}
function addColonist(s){
  const job = JOBS[Math.floor(colonistRnd(s)*JOBS.length)];
  const idx = s.nameIdx++;
  let name = NAMES[idx % NAMES.length];
  if(idx >= NAMES.length) name += " " + (Math.floor(idx/NAMES.length)+1);
  s.colonists.push({id:s.nextId++, name, job,
    skill:1+Math.floor(colonistRnd(s)*2), xp:0, fatigue:0, morale:70, b:null, quit:0});
}
function colonistRnd(s){ // uses the game rng stream via S-swap safety
  const old=S; S=s; const v=R(); S=old; return v;
}
function newGame(seed, headless){
  const s = {
    v:1, seed:seed|0, rngState:((seed|0)+0x1234)|0, turn:1,
    map: genMap(seed|0),
    builds: [], colonists: [], nextId:1, nameIdx:0,
    res: {food:30,water:30,soil:6,ore:0,metal:30,power:6,parts:6,scrip:40},
    research: [], cds:{},           // event cooldowns id->turns
    drift: {food:1,water:1,metal:1,parts:1,ore:1},
    caravan: null, caravanTimer:5,
    lastStorm:0, stormActive:false, shortage:false,
    log: [], pending:null, over:null, sandbox:false,
    headless: !!headless, sel:-1, tab:"map"
  };
  // place HQ on first buildable tile scanning from center outward
  const order=[27,28,35,36,26,29,34,37,19,20,43,44,18,21,42,45];
  let hqAt = order.find(i=>s.map[i]==="ash"||s.map[i]==="rock");
  if(hqAt===undefined) hqAt = s.map.findIndex(t=>t==="ash"||t==="rock");
  s.builds.push({t:"hq", i:hqAt, hp:100});
  for(let k=0;k<5;k++) addColonist(s);
  logMsg(s,"The outpost wakes under grey skies. Survive to turn 60 with 12 people fed and watered.");
  return s;
}
function logMsg(s,msg,warn){ s.log.push({t:s.turn,m:msg,w:!!warn}); if(s.log.length>400)s.log.shift(); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function has(s,id){ return s.research.includes(id); }
function caps(s){
  const m = has(s,"depots") ? 1.5 : 1;
  const o={}; for(const k of RES) o[k]=Math.floor(BASE_CAP[k]*m); return o;
}
function addRes(s,k,amt){
  const cap = caps(s)[k];
  const before = s.res[k];
  s.res[k] = clamp(before+amt, 0, cap);
  const lost = (before+amt) - s.res[k];
  if(amt>0 && lost>0.05) logMsg(s,`Storage full: ${lost.toFixed(1)} ${k} lost to overflow.`,true);
  return lost;
}
function canAfford(s,cost){ return Object.keys(cost).every(k=>s.res[k]>=cost[k]); }
function spend(s,cost){ for(const k in cost) s.res[k]=Math.max(0,s.res[k]-cost[k]); }
function housing(s){ return s.builds.reduce((a,b)=>a+(BD[b.t].housing||0),0); }
function adjTiles(i){
  const x=i%8,y=Math.floor(i/8),out=[];
  for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=x+dx,ny=y+dy;
    if(nx>=0&&nx<8&&ny>=0&&ny<8)out.push(ny*8+nx);
  }
  return out;
}
function adjCount(s,i,terr){ return adjTiles(i).filter(j=>s.map[j]===terr).length; }
function buildingAt(s,i){ return s.builds.find(b=>b.i===i); }
function workerOf(s,bi){ return s.colonists.find(c=>c.b===bi); }
function wallCount(s){ return s.builds.filter(b=>b.t==="wall"&&b.hp>0).length; }

/* build attempt: returns null on success or an error string */
function tryBuild(s,i,type){
  const d=BD[type];
  if(!d||d.nobuild) return "Cannot build that.";
  if(buildingAt(s,i)) return "Tile is occupied.";
  if(!d.terr.includes(s.map[i])) return `${d.n} requires: ${d.terr.join(" or ")}.`;
  if(d.req && !has(s,d.req)) return `Requires research: ${RESEARCH.find(r=>r.id===d.req).n}.`;
  if(!canAfford(s,d.cost)) return "Not enough resources.";
  spend(s,d.cost);
  s.builds.push({t:type,i,hp:100});
  logMsg(s,`Built ${d.n} at (${i%8+1},${Math.floor(i/8)+1}).`);
  return null;
}
function tryResearch(s,id){
  const node=RESEARCH.find(r=>r.id===id);
  if(!node) return "Unknown research.";
  if(has(s,id)) return "Already researched.";
  if(!node.req.every(r=>has(s,r))) return "Prerequisites not met.";
  if(!canAfford(s,node.cost)) return "Cannot afford it.";
  spend(s,node.cost);
  s.research.push(id);
  logMsg(s,`Research complete: ${node.n}. ${node.desc}`);
  return null;
}
function tryRepair(s,b){
  if(b.hp>=100) return "Not damaged.";
  if(!canAfford(s,{parts:2,metal:1})) return "Repair needs 2 parts + 1 metal.";
  const idle=s.colonists.filter(c=>c.b===null&&c.morale>0).sort((a,b2)=>a.fatigue-b2.fatigue)[0];
  if(!idle) return "Repair needs an idle colonist for labor.";
  spend(s,{parts:2,metal:1});
  idle.fatigue=clamp(idle.fatigue+20,0,100);
  b.hp=100;
  logMsg(s,`${idle.name} repairs the ${BD[b.t].n} (2 parts, 1 metal).`);
  return null;
}

/* ============================ PRODUCTION ============================ */
function workerMult(s,c,d){
  // Skill only counts when the colonist's job matches the building's job.
  const sk = (c.job===d.job) ? c.skill : 1;
  let m = 0.6 + 0.2*sk;                 // skill 1 → 0.8x … skill 5 → 1.6x
  let parts=[`skill ${sk} ×${(0.6+0.2*sk).toFixed(1)}`];
  if(c.morale<=0){ return {m:0,parts:["morale 0: refuses to work"]}; }
  if(c.morale<40){ m*=0.7; parts.push("low morale ×0.7"); }
  if(c.fatigue>=80){ m*=0.5; parts.push("exhausted ×0.5"); }
  return {m,parts};
}
function production(s){
  // fixed chain order so intermediates flow within one turn:
  const order=["sifter","condenser","ventTap","mine","greenhouse","forge","workshop","scav"];
  for(const type of order){
    for(let bi=0;bi<s.builds.length;bi++){
      const b=s.builds[bi];
      if(b.t!==type) continue;
      const d=BD[type];
      b.note = "";
      if(b.hp<=0){ b.note="DISABLED (repair needed)"; continue; }
      const c=workerOf(s,bi);
      if(!c){ b.note="no worker assigned"; continue; }
      const wm=workerMult(s,c,d);
      if(wm.m===0){ b.note=wm.parts.join("; "); logMsg(s,`${c.name} refuses to work at the ${d.n} (morale 0).`,true); continue; }
      let m=wm.m; const parts=[...wm.parts];
      if(b.hp<50){ m*=0.5; parts.push("damaged ×0.5"); }
      let made=null;
      if(type==="sifter"){ made={soil:3*m}; parts.unshift("base 3 soil"); }
      else if(type==="condenser"){
        const a=adjCount(s,b.i,"water");
        let out=3*(1+0.5*a)*(has(s,"filters")?1.25:1)*m;
        if(a)parts.push(`+${a*50}% adj water`); if(has(s,"filters"))parts.push("+25% Ash Filters");
        made={water:out}; parts.unshift("base 3 water");
      }
      else if(type==="ventTap"){
        let out=5*(has(s,"turbine")?1.5:1)*m;
        if(has(s,"turbine"))parts.push("+50% Turbine Tap");
        made={power:out}; parts.unshift("base 5 power");
      }
      else if(type==="mine"){
        let out=4*(has(s,"bore")?1.25:1)*m;
        if(has(s,"bore"))parts.push("+25% Deep Bore");
        made={ore:out}; parts.unshift("base 4 ore");
      }
      else if(type==="greenhouse"){
        const wNeed=has(s,"drip")?1:2;
        if(s.res.soil<2||s.res.water<wNeed){ b.note=`idle: needs 2 soil + ${wNeed} water`; continue; }
        spend(s,{soil:2,water:wNeed});
        const a=adjCount(s,b.i,"water");
        let out=4*(has(s,"drip")?1.25:1)*(1+0.25*a)*m;
        if(a)parts.push(`+${a*25}% adj water`); if(has(s,"drip"))parts.push("+25% Drip Irrigation");
        made={food:out}; parts.unshift(`base 4 food (ate 2 soil, ${wNeed} water)`);
      }
      else if(type==="forge"){
        const pNeed=has(s,"heatx")?1:2;
        if(s.res.ore<3||s.res.power<pNeed){ b.note=`idle: needs 3 ore + ${pNeed} power`; continue; }
        spend(s,{ore:3,power:pNeed});
        const a=adjCount(s,b.i,"vent");
        let out=3*(1+0.5*a)*m;
        if(a)parts.push(`+${a*50}% adj vent`);
        made={metal:out}; parts.unshift(`base 3 metal (ate 3 ore, ${pNeed} power)`);
      }
      else if(type==="workshop"){
        if(s.res.metal<2||s.res.power<1){ b.note="idle: needs 2 metal + 1 power"; continue; }
        spend(s,{metal:2,power:1});
        made={parts:1.5*m}; parts.unshift("base 1.5 parts (ate 2 metal, 1 power)");
      }
      else if(type==="scav"){
        made={parts:0.6*m, scrip:3*m}; parts.unshift("base 0.6 parts + 3 scrip");
      }
      if(made){
        let outs=[];
        for(const k in made){ const v=Math.round(made[k]*10)/10; addRes(s,k,v); outs.push(`${v} ${k}`); }
        b.note=`+${outs.join(", ")} — ${parts.join(", ")}`;
        // skill growth: only when working the matching job
        if(c.job===d.job){
          c.xp++;
          if(c.skill<5 && c.xp>=c.skill*4){ c.xp=0; c.skill++;
            logMsg(s,`${c.name} improves: ${c.job} skill ${c.skill}.`); }
        }
      }
    }
  }
}
/* ============================ NEEDS / MORALE ============================ */
function needsPhase(s){
  const pop=s.colonists.length;
  const wMult=s.stormActive?1.5:1;
  const foodNeed=pop, waterNeed=Math.round(pop*wMult*10)/10;
  const foodShort=Math.max(0,foodNeed-s.res.food), waterShort=Math.max(0,waterNeed-s.res.water);
  s.res.food=Math.max(0,s.res.food-foodNeed);
  s.res.water=Math.max(0,s.res.water-waterNeed);
  s.shortage=(foodShort>0||waterShort>0);
  if(foodShort>0)logMsg(s,`FOOD SHORTAGE: ${foodShort.toFixed(1)} meals missing. Morale falls.`,true);
  if(waterShort>0)logMsg(s,`WATER SHORTAGE: ${waterShort.toFixed(1)} rations missing${s.stormActive?" (storm doubles thirst)":""}. Morale falls.`,true);
  const crowded=pop>housing(s);
  if(crowded)logMsg(s,`Overcrowded: ${pop} people, housing for ${housing(s)}. Morale suffers.`,true);
  const clinicOk=s.builds.some(b=>b.t==="clinic"&&b.hp>0);
  const leavers=[];
  for(const c of s.colonists){
    // fatigue
    if(c.b!==null&&c.morale>0)c.fatigue=clamp(c.fatigue+12,0,100);
    else c.fatigue=clamp(c.fatigue-25,0,100);
    if(clinicOk)c.fatigue=clamp(c.fatigue-10,0,100);
    // morale
    let dm=0;
    if(foodShort>0)dm-=12;
    if(waterShort>0)dm-=10;
    if(crowded)dm-=4;
    if(dm===0){ dm=2+(has(s,"medbay")?2:0)+(clinicOk?3:0); }
    c.morale=clamp(c.morale+dm,0,100);
    if(c.morale<=0){
      c.quit++;
      if(c.quit===1)logMsg(s,`${c.name} is at breaking point (morale 0) — refuses all work. Feed and rest them or they will leave next turn.`,true);
      else leavers.push(c);
    } else c.quit=0;
  }
  for(const c of leavers){
    s.colonists=s.colonists.filter(x=>x!==c);
    logMsg(s,`${c.name} packs up and walks into the ash. (Left after two turns at zero morale.)`,true);
  }
  // arrivals
  if(s.colonists.length>0){
    const avg=s.colonists.reduce((a,c)=>a+c.morale,0)/s.colonists.length;
    if(avg>=65&&s.res.food>s.colonists.length&&housing(s)>s.colonists.length&&R()<0.25){
      addColonist(s);
      logMsg(s,`${s.colonists[s.colonists.length-1].name} arrives, drawn by word of a thriving outpost. (+1 colonist)`);
    }
  }
}
/* ============================ STORM ============================ */
function stormPhase(s){
  s.stormActive=(s.turn%8===0);
  if(!s.stormActive)return;
  s.lastStorm=s.turn;
  const sev=1+Math.floor(s.turn/20);
  let mit=(has(s,"shield")?0.3:0)+Math.min(wallCount(s),3)*0.15;
  mit=Math.min(mit,0.75);
  let hit=0;
  for(const b of s.builds){
    if(b.t==="hq")continue;
    if(R()<0.5){
      const dmg=Math.round((15+R()*25)*sev*(1-mit));
      if(dmg>0){b.hp=clamp(b.hp-dmg,0,100);hit++;}
    }
  }
  logMsg(s,`ASHSTORM (severity ${sev})! ${hit} building${hit===1?"":"s"} damaged`+
    (mit>0?` — mitigation reduced damage ${Math.round(mit*100)}%`:"")+
    `. Thirst spikes this turn (water ×1.5).`,true);
}
/* ============================ EVENTS PHASE ============================ */
function eventsPhase(s){
  for(const id in s.cds){ if(s.cds[id]>0)s.cds[id]--; }
  if(R()>=0.45)return;
  const pool=EVENTS.filter(e=>!(s.cds[e.id]>0));
  if(!pool.length)return;
  const total=pool.reduce((a,e)=>a+e.w,0);
  let roll=R()*total, ev=pool[0];
  for(const e of pool){ roll-=e.w; if(roll<=0){ev=e;break;} }
  s.cds[ev.id]=EVENT_COOLDOWN;
  if(ev.choices){
    if(s.headless){ ev.choices[0].apply(s); }
    else { s.pending={id:ev.id}; logMsg(s,`EVENT: ${ev.n} — decision required.`,true); }
  } else {
    ev.apply(s);
  }
}
function resolveEvent(choiceIdx){
  if(!S.pending)return;
  const ev=EVENTS.find(e=>e.id===S.pending.id);
  S.pending=null;
  ev.choices[choiceIdx].apply(S);
  checkEnd(S);
  render();
}
/* ============================ TRADE ============================ */
function priceOf(s,g,side){
  const cap=caps(s)[g];
  const scarcity=clamp(1.6 - s.res[g]/cap, 0.5, 1.5);   // low stock → higher local price
  let p=BASE_PRICE[g]*s.drift[g]*scarcity;
  const margin=has(s,"barter")?0.1:0;                    // barter narrows the spread
  if(side==="buy") p*=(1.25-margin);
  else p*=(0.8+margin);
  return Math.max(1,Math.round(p*10)/10);
}
function caravanPhase(s){
  for(const g of TRADE_GOODS){
    s.drift[g]=clamp(s.drift[g]*(0.96+R()*0.08)+(R()-0.5)*0.06,0.6,1.6);
  }
  if(s.caravan){
    s.caravan.stays--;
    if(s.caravan.stays<=0){ s.caravan=null; logMsg(s,"The caravan packs up and rolls east."); }
  } else {
    s.caravanTimer--;
    if(s.caravanTimer<=0){
      s.caravanTimer=6;
      const inv={};
      for(const g of TRADE_GOODS)inv[g]=Math.floor(4+R()*14);
      s.caravan={inv,scrip:Math.floor(60+R()*60),stays:2};
      logMsg(s,"A trade caravan arrives! It will stay 2 turns. (Trade tab)");
    }
  }
}
function tradeDeal(s,g,qty,buying){
  const cv=s.caravan; if(!cv)return "No caravan.";
  const p=priceOf(s,g,buying?"buy":"sell");
  if(buying){
    qty=Math.min(qty,cv.inv[g]);
    if(qty<=0)return "Caravan is out of that.";
    const cost=Math.round(p*qty*10)/10;
    if(s.res.scrip<cost)return `Need ${cost} scrip.`;
    const spare=caps(s)[g]-s.res[g];
    qty=Math.min(qty,Math.floor(spare));
    if(qty<=0)return "Your storage is full.";
    spend(s,{scrip:Math.round(p*qty*10)/10});
    s.res[g]+=qty; cv.inv[g]-=qty; cv.scrip+=Math.round(p*qty);
    logMsg(s,`Bought ${qty} ${g} for ${Math.round(p*qty*10)/10} scrip.`);
  } else {
    qty=Math.min(qty,Math.floor(s.res[g]));
    if(qty<=0)return "You have none to sell.";
    const pay=Math.round(p*qty*10)/10;
    if(cv.scrip<pay)return "Caravan can't afford that.";
    s.res[g]-=qty; cv.inv[g]+=qty; cv.scrip-=pay;
    addRes(s,"scrip",pay);
    logMsg(s,`Sold ${qty} ${g} for ${pay} scrip.`);
  }
  return null;
}
/* ============================ END CONDITIONS ============================ */
function score(s){
  const stockVal=RES.reduce((a,k)=>a+s.res[k]*(BASE_PRICE[k]||1),0);
  return Math.round(s.colonists.length*25 + s.research.length*20 +
    Math.min(s.turn,60)*3 + stockVal/10);
}
function checkEnd(s){
  if(s.over)return;
  if(s.colonists.length===0){
    s.over={win:false,final:true,reason:"The last colonist is gone. Ash reclaims the outpost."};
    return;
  }
  if(s.turn>=60&&!s.sandbox){
    if(s.colonists.length>=12&&!s.shortage){
      s.over={win:true,final:false,reason:"Turn 60: "+s.colonists.length+" colonists, fed and watered. The outpost endures — a beacon in the ashfall."};
    } else {
      s.over={win:false,final:false,reason:"Turn 60 reached, but the outpost falls short (need 12+ colonists with no food/water shortage). It survives, diminished."};
    }
  }
}
/* ============================ END TURN ============================ */
function endTurn(){
  if(!S||S.pending||(S.over&&S.over.final))return;
  if(S.over&&!S.sandbox)return;
  runTurn(S);
  if(!S.headless)render();
}
function runTurn(s){
  s.turn++;
  stormPhase(s);      // 2. storm
  production(s);      // 3. production chains
  needsPhase(s);      // 4-5. needs, morale, departures, arrivals
  eventsPhase(s);     // 6. events
  caravanPhase(s);    // 7. trade drift + caravan
  checkEnd(s);        // 8. end conditions
}

/* ============================ GREEDY POLICY (benchmark + tests) ============================ */
function greedyTurn(s){
  // repairs
  for(const b of s.builds){ if(b.hp<50) tryRepair(s,b); }
  // builds
  const wish=[["condenser",2],["sifter",2],["greenhouse",2],["shelter",3],["mine",2],
    ["ventTap",1],["forge",1],["scav",1],["workshop",1],["wall",2],["clinic",1]];
  for(const[type,target]of wish){
    const count=s.builds.filter(b=>b.t===type).length;
    if(count>=target)continue;
    const d=BD[type];
    if(d.req&&!has(s,d.req))continue;
    if(!canAfford(s,d.cost))continue;
    for(let i=0;i<64;i++){
      if(buildingAt(s,i))continue;
      if(!d.terr.includes(s.map[i]))continue;
      if(tryBuild(s,i,type)===null)break;
    }
  }
  // research: first affordable available
  for(const node of RESEARCH){
    if(has(s,node.id))continue;
    if(!node.req.every(r=>has(s,r)))continue;
    if(canAfford(s,node.cost)){ tryResearch(s,node.id); break; }
  }
  // rest the exhausted
  for(const c of s.colonists){ if(c.fatigue>=90)c.b=null; }
  // assign idle colonists to empty working buildings (match job, best skill first)
  for(let bi=0;bi<s.builds.length;bi++){
    const b=s.builds[bi], d=BD[b.t];
    if(!d.job||b.hp<=0)continue;
    if(workerOf(s,bi))continue;
    const idle=s.colonists.filter(c=>c.b===null&&c.morale>0&&c.fatigue<80);
    if(!idle.length)continue;
    idle.sort((a,c2)=>{
      const am=(a.job===d.job)?a.skill+10:a.skill;
      const cm=(c2.job===d.job)?c2.skill+10:c2.skill;
      return cm-am;
    });
    idle[0].b=bi;
  }
  // trade: sell surplus, buy food/water if short
  if(s.caravan){
    for(const g of["metal","ore","parts"]){
      const cap=caps(s)[g];
      if(s.res[g]>cap*0.8) tradeDeal(s,g,Math.floor(s.res[g]-cap*0.6),false);
    }
    for(const g of["food","water"]){
      if(s.res[g]<s.colonists.length*2) tradeDeal(s,g,5,true);
    }
  }
  runTurn(s);
}
/* ============================ HASH / SAVE ============================ */
function stateHash(s){
  const str=JSON.stringify(stripUi(s));
  let h=5381;
  for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;
  return (h>>>0).toString(16).padStart(8,"0");
}
function stripUi(s){ const c=JSON.parse(JSON.stringify(s)); delete c.sel; delete c.tab; delete c.headless; return c; }
function exportSave(){ return JSON.stringify(stripUi(S)); }
function importSave(txt){
  let o;
  try{ o=JSON.parse(txt); }catch(e){ return "Invalid JSON: "+e.message; }
  const need=["v","seed","rngState","turn","map","builds","colonists","res","research","log"];
  for(const k of need)if(!(k in o))return "Not a valid save: missing field '"+k+"'.";
  if(!Array.isArray(o.map)||o.map.length!==64)return "Not a valid save: map must be 64 tiles.";
  if(!Array.isArray(o.colonists))return "Not a valid save: colonists must be a list.";
  for(const k of RES)if(typeof o.res[k]!=="number"||o.res[k]<0)return "Not a valid save: bad resource '"+k+"'.";
  o.sel=-1;o.tab="map";o.headless=false;o.pending=o.pending||null;
  S=o;
  logMsg(S,"Save loaded.");
  render();
  return null;
}

/* ============================ RENDER ============================ */
const $=id=>document.getElementById(id);
function fmt(v){ return (Math.round(v*10)/10).toString(); }
function render(){
  if(!S||S.headless)return;
  $("hturn").textContent=Math.min(S.turn,999);
  // resource bar
  const cp=caps(S);
  $("resbar").innerHTML=RES.map(k=>{
    const v=S.res[k],low=(k==="food"||k==="water")&&v<S.colonists.length*2;
    return `<span title="${k}: ${fmt(v)} stored, cap ${cp[k]}${k==="soil"?" (made by Ash Sifters, eaten by Greenhouses)":""}${k==="ore"?" (from Mines, smelted at the Forge)":""}. Overflow past the cap is lost.">${RES_ICON[k]} <b class="${low?"low":""}">${fmt(v)}</b><small>/${cp[k]}</small></span>`;
  }).join("")+
  `<span title="Colonists / housing. Overcrowding drains morale.">👥 <b>${S.colonists.length}</b>/${housing(S)}</span>`+
  `<span title="Next ashstorm hits on turn ${Math.ceil((S.turn+1)/8)*8} (every 8 turns, worse over time).">🌪 in <b>${(8-(S.turn%8))%8||8}</b></span>`+
  `<span title="${S.caravan?"Caravan is here for "+S.caravan.stays+" more turn(s)":"Caravan arrives in "+S.caravanTimer+" turn(s)"}">🐫 <b>${S.caravan?"HERE":S.caravanTimer}</b></span>`;
  renderMap(); renderPeople(); renderResearch(); renderTrade(); renderLog(); renderModal();
  $("endturn").disabled=!!S.pending||!!(S.over&&(S.over.final||!S.sandbox));
}
function renderMap(){
  const g=$("grid");
  g.innerHTML="";
  for(let i=0;i<64;i++){
    const t=S.map[i],b=buildingAt(S,i);
    const d=document.createElement("div");
    d.className=`tile t-${t}${S.sel===i?" sel":""}`;
    let tip=`(${i%8+1},${Math.floor(i/8)+1}) ${TERR[t].name}`;
    let inner=`<span class="tch">${TERR[t].ch}</span>`;
    if(b){
      const def=BD[b.t];
      inner=`<span class="bch">${def.ab}</span>`;
      tip+=` — ${def.n} (HP ${b.hp})`;
      const w=workerOf(S,S.builds.indexOf(b));
      if(w){inner+=`<span class="wk">●</span>`;tip+=`, worked by ${w.name}`;}
      else if(def.job){tip+=", NO WORKER";}
      if(b.hp<=0){inner+=`<span class="dmg">✖</span>`;tip+=" — DISABLED";}
      else if(b.hp<50){inner+=`<span class="dmg">!</span>`;tip+=" — damaged (half output)";}
      if(b.note)tip+=`\nLast turn: ${b.note}`;
    }
    d.title=tip;
    d.innerHTML=inner;
    d.onclick=()=>{S.sel=i;render();};
    g.appendChild(d);
  }
  $("mapstatus").textContent=S.over?"":
    (S.stormActive?"An ashstorm raged this turn.":"");
  renderTileInfo();
}
function renderTileInfo(){
  const box=$("tileinfo");
  if(S.sel<0){box.innerHTML="Click a tile to inspect or build. Buildings need a worker (People tab) and matching terrain.";return;}
  const i=S.sel,t=S.map[i],b=buildingAt(S,i);
  let h=`<b>(${i%8+1},${Math.floor(i/8)+1}) ${TERR[t].name}</b><br>`;
  if(b){
    const bi=S.builds.indexOf(b),def=BD[b.t],w=workerOf(S,bi);
    h+=`<b>${def.n}</b> — HP ${b.hp}${b.hp<=0?" <b class='low'>DISABLED</b>":b.hp<50?" <b class='low'>damaged (½ output)</b>":""}<br>
        <span class="hint">${def.desc}</span><br>
        Worker: ${w?`${w.name} (${w.job} ${w.skill})`:(def.job?`<b class="low">none</b> — assign a ${def.job} in the People tab`:"not needed (passive)")}<br>
        ${b.note?`Last turn: <span class="hint">${b.note}</span><br>`:""}`;
    if(b.hp<100)h+=`<button id="btnrepair" title="Costs 2 parts + 1 metal and one idle colonist's labor (+20 fatigue)">Repair (2⚙ 1🔩 + idle labor)</button> `;
    if(b.t!=="hq")h+=`<button id="btndemo" title="Tear it down. Refunds half the metal.">Demolish</button>`;
    box.innerHTML=h;
    const br=$("btnrepair");
    if(br)br.onclick=()=>{const e=tryRepair(S,b);if(e)logMsg(S,e,true);render();};
    const bd=$("btndemo");
    if(bd)bd.onclick=()=>{
      const refund=Math.floor((BD[b.t].cost.metal||0)/2);
      S.colonists.forEach(c=>{if(c.b===S.builds.indexOf(b))c.b=null;});
      // re-map worker indices after removal
      const removed=S.builds.indexOf(b);
      S.colonists.forEach(c=>{if(c.b!==null&&c.b>removed)c.b--;});
      S.builds.splice(removed,1);
      addRes(S,"metal",refund);
      logMsg(S,`Demolished ${BD[b.t].n}, salvaged ${refund} metal.`);
      render();
    };
    return;
  }
  h+=`<span class="hint">Empty. Build here:</span>`;
  box.innerHTML=h;
  for(const type in BD){
    const d=BD[type];
    if(d.nobuild)continue;
    const terrOk=d.terr.includes(t);
    const resOk=!d.req||has(S,d.req);
    const costTxt=Object.entries(d.cost).map(([k,v])=>`${v}${RES_ICON[k]}`).join(" ")||"free";
    let bonus="";
    if(type==="condenser"){const a=adjCount(S,i,"water");if(a)bonus=`+${a*50}% adjacency (water)`;}
    if(type==="greenhouse"){const a=adjCount(S,i,"water");if(a)bonus=`+${a*25}% adjacency (water)`;}
    if(type==="forge"){const a=adjCount(S,i,"vent");if(a)bonus=`+${a*50}% adjacency (vent)`;}
    const why=!terrOk?` — needs ${d.terr.join("/")}`:!resOk?` — needs ${RESEARCH.find(r=>r.id===d.req).n} research`:!canAfford(S,d.cost)?" — can't afford":"";
    const btn=document.createElement("button");
    btn.className="bbtn";
    btn.disabled=!terrOk||!resOk||!canAfford(S,d.cost);
    btn.title=d.desc+(bonus?"\nOn this tile: "+bonus:"");
    btn.innerHTML=`<b>${d.n}</b> — ${costTxt}${bonus?` <b>[${bonus}]</b>`:""}<span class="hint">${why}</span>`;
    btn.onclick=()=>{const e=tryBuild(S,i,type);if(e)logMsg(S,e,true);render();};
    box.appendChild(btn);
  }
}
function bar(v,inv){
  const pct=clamp(v,0,100);
  const cls=inv?(pct>70?"crit":pct>40?"warn":""):(pct<30?"crit":pct<55?"warn":"");
  return `<span class="bar"><i class="${cls}" style="width:${pct}%"></i></span> ${Math.round(v)}`;
}
function renderPeople(){
  const box=$("peoplebox");

  <th title="Rises +12/turn assigned, falls -25/turn resting. 80+ halves output.">Fatigue</th>

      const mine=c.b===bi;

  box.innerHTML=h;
  box.querySelectorAll("select").forEach(sel=>{
    sel.onchange=()=>{
      const c=S.colonists[+sel.dataset.ci];

/* ============================ TESTS ============================ */
function runTests(){
  const out=[];let pass=0,fail=0;
  function T(name,fn){
    try{
      const r=fn();
      if(r===true||r===undefined){out.push("✔ PASS  "+name);pass++;}
      else{out.push("✘ FAIL  "+name+(typeof r==="string"?" — "+r:""));fail++;}
    }catch(e){out.push("✘ FAIL  "+name+" — threw: "+e.message);fail++;}
  }
  const saved=S;
  try{
    T("PRNG determinism: same seed → same 10-number sequence",()=>{
      const a=newGame(42,true),b=newGame(42,true);
      const seq=st=>{const old=S;S=st;const v=[...Array(10)].map(()=>R());S=old;return v;};
      return JSON.stringify(seq(a))===JSON.stringify(seq(b))||"sequences differ";
    });
    T("Map generation deterministic for a seed",()=>
      JSON.stringify(genMap(1337))===JSON.stringify(genMap(1337))||"maps differ");
    T("Maps differ across seeds",()=>
      JSON.stringify(genMap(1))!==JSON.stringify(genMap(2))||"identical maps for different seeds");
    const sim=newGame(1337,true);
    S=sim;for(let t=0;t<25;t++)greedyTurn(sim);S=saved;
    T("No negative resources after 25 greedy turns",()=>
      RES.every(k=>sim.res[k]>=0)||"negative: "+RES.filter(k=>sim.res[k]<0).join(","));
    T("Storage caps respected after 25 greedy turns",()=>{
      const cp=caps(sim);
      return RES.every(k=>sim.res[k]<=cp[k]+1e-9)||"over cap: "+RES.filter(k=>sim.res[k]>cp[k]).join(",");
    });
    T("Colonist assignments valid (existing building, no double-booking)",()=>{
      const seen=new Set();
      for(const c of sim.colonists){
        if(c.b===null)continue;
        if(c.b<0||c.b>=sim.builds.length)return "bad index "+c.b;
        if(seen.has(c.b))return "two workers share building "+c.b;
        seen.add(c.b);
      }
      return true;
    });
    T("Roster count consistent (each colonist unique id)",()=>{
      const ids=new Set(sim.colonists.map(c=>c.id));
      return ids.size===sim.colonists.length||"duplicate ids";
    });
    T("Colonist stats in range (skill 1-5, fatigue/morale 0-100)",()=>
      sim.colonists.every(c=>c.skill>=1&&c.skill<=5&&c.fatigue>=0&&c.fatigue<=100&&
        c.morale>=0&&c.morale<=100)||"out-of-range stat");
    T("Research prerequisite enforced",()=>{
      const s2=newGame(7,true);s2.res.scrip=999;s2.res.parts=999;
      const e=tryResearch(s2,"shield");
      if(e===null)return "shield bought without salvage";
      tryResearch(s2,"salvage");
      return tryResearch(s2,"shield")===null||"shield refused after prereq met";
    });
    T("Research cost deducted and marked done",()=>{
      const s2=newGame(7,true);s2.res.scrip=100;s2.res.parts=10;
      tryResearch(s2,"filters");
      return s2.res.scrip===75&&s2.res.parts===8&&has(s2,"filters")||"cost/flag wrong";
    });
    T("Terrain requirement enforced (mine on ash rejected)",()=>{
      const s2=newGame(7,true);s2.res.metal=99;
      const i=s2.map.findIndex((t,j)=>t==="ash"&&!buildingAt(s2,j));
      return tryBuild(s2,i,"mine")!==null||"mine built on ash";
    });
    T("Build cost enforced (no metal → rejected)",()=>{
      const s2=newGame(7,true);s2.res.metal=0;
      const i=s2.map.findIndex((t,j)=>t==="ash"&&!buildingAt(s2,j));
      return tryBuild(s2,i,"sifter")!==null||"built for free";
    });
    T("Overflow is clamped to cap and logged",()=>{
      const s2=newGame(7,true);
      const n0=s2.log.length;
      addRes(s2,"water",9999);
      return s2.res.water===caps(s2).water&&s2.log.length>n0&&
        s2.log[s2.log.length-1].m.includes("overflow")||"no clamp or no log";
    });
    T("Storms fire on schedule and can damage buildings",()=>{
      const s2=newGame(1337,true);
      S=s2;for(let t=0;t<9;t++)greedyTurn(s2);S=saved;
      return s2.lastStorm===8&&s2.turn>=9||"lastStorm="+s2.lastStorm;
    });
    T("Starvation drains morale and colonists eventually leave",()=>{
      const s2=newGame(9,true);
      s2.res.food=0;s2.res.water=0;
      const n0=s2.colonists.length;
      S=s2;
      for(let t=0;t<14;t++){s2.colonists.forEach(c=>c.b=null);runTurn(s2);s2.res.food=0;s2.res.water=0;}
      S=saved;
      return s2.colonists.length<n0||"nobody left after 14 starving turns";
    });
    T("Event cooldowns set after firing",()=>{
      const s2=newGame(1337,true);
      S=s2;for(let t=0;t<10;t++)runTurn(s2);S=saved;
      const fired=Object.keys(s2.cds);
      return fired.length>0&&fired.every(id=>s2.cds[id]<=EVENT_COOLDOWN)||"no events fired in 10 turns";
    });
    T("Trade: buying moves goods and scrip both ways",()=>{
      const s2=newGame(7,true);
      s2.caravan={inv:{food:10,water:10,metal:10,parts:10,ore:10},scrip:100,stays:2};
      const sc0=s2.res.scrip,m0=s2.res.metal;
      const e=tradeDeal(s2,"metal",1,true);
      return e===null&&s2.res.metal===m0+1&&s2.res.scrip<sc0&&s2.caravan.inv.metal===9||"trade state wrong: "+e;
    });
    T("Save/load round-trips to an identical state hash",()=>{
      const s2=newGame(1337,true);
      S=s2;for(let t=0;t<12;t++)greedyTurn(s2);S=saved;
      const h1=stateHash(s2);
      const back=JSON.parse(JSON.stringify(stripUi(s2)));
      return stateHash(back)===h1||"hash mismatch after round trip";
    });
    T("Bad save input rejected with clear error",()=>{
      const keep=S;S=newGame(3,true);
      const e1=importSave("not json{");
      const e2=importSave('{"hello":1}');
      const s3=S;S=keep;
      return typeof e1==="string"&&typeof e2==="string"&&s3.turn===1||"bad input accepted";
    });
    T("Benchmark determinism: 30-turn greedy hash repeats",()=>{
      const run=()=>{const s2=newGame(555,true);S=s2;for(let t=0;t<30;t++)greedyTurn(s2);S=saved;return stateHash(s2);};
      const h1=run(),h2=run();
      return h1===h2||h1+" != "+h2;
    });
    T("Research measurably changes production (Ash Filters vs none)",()=>{
      const mk=withF=>{
        const s2=newGame(77,true);
        if(withF)s2.research.push("filters");
        const i=s2.map.findIndex((t,j)=>(t==="ash"||t==="rock")&&!buildingAt(s2,j)&&adjCount(s2,j,"water")===0);
        s2.res.metal=99;tryBuild(s2,i,"condenser");
        s2.colonists[0].b=s2.builds.length-1;s2.colonists[0].job="Engineer";s2.colonists[0].skill=3;s2.colonists[0].morale=80;s2.colonists[0].fatigue=0;
        s2.res.water=0;
        S=s2;production(s2);S=saved;
        return s2.res.water;
      };
      const a=mk(false),b=mk(true);
      return b>a||`filters ${b} not > base ${a}`;
    });
  } finally { S=saved; }
  $("devout").textContent=`TESTS: ${pass} passed, ${fail} failed\n\n`+out.join("\n");
}
/* ============================ BENCHMARK ============================ */
function runBench(){
  const seed=parseInt($("seed").value)||1337;
  const t0=[];
  function once(){
    const s=newGame(seed,true);
    const saved=S;S=s;
    for(let t=0;t<200;t++){
      if(s.colonists.length===0)break;
      greedyTurn(s);
    }
    S=saved;
    return s;
  }
  const s1=once(),s2=once();
  const h1=stateHash(s1),h2=stateHash(s2);
  $("devout").textContent=
`BENCHMARK — 200 greedy turns from seed ${seed}
State hash (run 1): ${h1}
State hash (run 2): ${h2}  ${h1===h2?"✔ deterministic":"✘ NON-DETERMINISTIC (bug!)"}

Final turn:        ${s1.turn}
Population:        ${s1.colonists.length}
Buildings:         ${s1.builds.length}
Research done:     ${s1.research.length}/${RESEARCH.length}
Outcome:           ${s1.over?(s1.over.win?"WIN at 60":"did not meet win check"):"still running"}
Score:             ${score(s1)}
Stockpiles:        ${RES.map(k=>k+" "+fmt(s1.res[k])).join(", ")}`;
}

  if(e.code==="Space"){e.preventDefault();endTurn();}
  const tabs=["map","people","research","trade","log"];
  if(e.key>="1"&&e.key<="5")switchTab(tabs[+e.key-1]);
});
start(1337);
</script>
