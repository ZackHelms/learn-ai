<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASHFALL OUTPOST</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Courier New", monospace;
      background: #1a1a1a;
      color: #e0e0e0;
      line-height: 1.4;
      overflow: hidden;
    }
    #game {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    .header {
      background: #2a2a2a;
      border-bottom: 2px solid #555;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header h1 { font-size: 18px; letter-spacing: 2px; }
    .header-stats {
      display: flex;
      gap: 16px;
      font-size: 13px;
      flex-wrap: wrap;
    }
    .stat-item { display: flex; gap: 4px; align-items: center; }
    .stat-label { color: #999; }
    .stat-value { color: #0f0; font-weight: bold; }
    .tabs {
      display: flex;
      gap: 2px;
      background: #1a1a1a;
      padding: 4px;
      border-bottom: 2px solid #555;
      flex-wrap: wrap;
    }
    .tab {
      padding: 6px 12px;
      background: #2a2a2a;
      border: 1px solid #444;
      cursor: pointer;
      font-size: 12px;
      color: #999;
      user-select: none;
    }
    .tab.active {
      background: #0f0;
      color: #000;
      font-weight: bold;
    }
    .tab:hover { background: #333; }
    .tab.active:hover { background: #0f0; }
    .content {
      flex: 1;
      overflow: auto;
      padding: 12px;
      display: none;
    }
    .content.active { display: block; }
    .footer {
      background: #2a2a2a;
      border-top: 2px solid #555;
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      font-size: 12px;
    }
    .btn {
      padding: 6px 12px;
      background: #0f0;
      color: #000;
      border: none;
      cursor: pointer;
      font-family: "Courier New", monospace;
      font-weight: bold;
      user-select: none;
      border: 1px solid #0a0;
    }
    .btn:hover { background: #0d0; }
    .btn:active { background: #0c0; }
    .btn.disabled { background: #555; color: #999; cursor: not-allowed; }
    .grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 2px;
      max-width: 600px;
      margin: 0 auto;
    }
    .tile {
      aspect-ratio: 1;
      border: 1px solid #444;
      padding: 4px;
      cursor: pointer;
      position: relative;
      background: #222;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 11px;
      user-select: none;
    }
    .tile:hover { border-color: #0f0; background: #2a2a2a; }
    .tile-terrain { color: #888; font-size: 10px; }
    .tile-building { color: #0f0; font-weight: bold; }
    .tile-data { color: #999; font-size: 9px; }
    .tile-tooltip {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: #000;
      border: 1px solid #0f0;
      padding: 4px 8px;
      margin-bottom: 4px;
      white-space: nowrap;
      font-size: 10px;
      color: #0f0;
      pointer-events: none;
      display: none;
      z-index: 1000;
    }
    .tile:hover .tile-tooltip { display: block; }
    .panel {
      display: grid;
      gap: 8px;
    }
    .resource-row {
      display: grid;
      grid-template-columns: 80px 1fr 60px;
      gap: 8px;
      align-items: center;
      padding: 4px;
      background: #2a2a2a;
      border: 1px solid #444;
    }
    .resource-label { color: #999; font-size: 12px; }
    .resource-bar {
      background: #1a1a1a;
      border: 1px solid #444;
      height: 16px;
      position: relative;
      overflow: hidden;
    }
    .resource-fill {
      height: 100%;
      background: #0f0;
      transition: width 0.1s;
    }
    .resource-amount { text-align: right; font-size: 11px; color: #0f0; }
    .person-item {
      background: #2a2a2a;
      border: 1px solid #444;
      padding: 6px;
      font-size: 11px;
    }
    .person-header { color: #0f0; font-weight: bold; }
    .person-stat { color: #999; margin-top: 2px; }
    .person-job {
      margin-top: 4px;
      padding: 4px;
      background: #1a1a1a;
      border: 1px solid #444;
      color: #ccc;
    }
    .research-node {
      background: #2a2a2a;
      border: 1px solid #444;
      padding: 6px;
      margin-bottom: 6px;
      font-size: 11px;
      cursor: pointer;
    }
    .research-node.locked { opacity: 0.6; }
    .research-node.done { border-color: #0f0; background: #1a3a1a; }
    .research-node.available { border-color: #ff0; }
    .research-title { color: #0f0; font-weight: bold; }
    .research-desc { color: #999; margin-top: 2px; }
    .research-cost { color: #666; margin-top: 2px; font-size: 10px; }
    .event-item {
      background: #2a2a2a;
      border: 1px solid #555;
      padding: 6px;
      margin-bottom: 4px;
      font-size: 11px;
      color: #ccc;
    }
    .event-turn { color: #999; }
    .event-text { color: #0f0; margin-top: 2px; }
    .event-choice { display: flex; gap: 4px; margin-top: 2px; }
    .event-choice button { padding: 2px 6px; font-size: 10px; }
    .tooltip-info { color: #666; font-size: 10px; margin-top: 2px; }
    .trade-item {
      background: #2a2a2a;
      border: 1px solid #444;
      padding: 6px;
      margin-bottom: 4px;
      font-size: 11px;
      display: grid;
      grid-template-columns: 80px 1fr 60px 60px;
      gap: 8px;
      align-items: center;
    }
    .trade-name { color: #0f0; }
    .trade-price { text-align: right; color: #ff0; }
    .trade-qty { text-align: center; }
    .trade-btn { padding: 2px 6px; font-size: 10px; }
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #1a1a1a;
      border: 2px solid #0f0;
      padding: 16px;
      max-width: 500px;
      max-height: 80vh;
      overflow: auto;
      color: #e0e0e0;
    }
    .modal-title { font-size: 16px; font-weight: bold; color: #0f0; margin-bottom: 8px; }
    .modal-text { margin-bottom: 8px; line-height: 1.5; }
    .modal-buttons { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .hidden { display: none; }
    @media (max-width: 600px) {
      .header { font-size: 12px; padding: 6px; }
      .header h1 { font-size: 14px; }
      .header-stats { font-size: 10px; gap: 8px; }
      .tab { padding: 4px 8px; font-size: 10px; }
      .grid { gap: 1px; }
      .tile { font-size: 9px; padding: 2px; }
      .resource-row { grid-template-columns: 60px 1fr 50px; font-size: 10px; }
      .footer { font-size: 10px; padding: 6px; }
      .btn { padding: 4px 8px; font-size: 10px; }
    }
  </style>
</head>
<body>
<div id="game">
  <div class="header">
    <h1>ASHFALL OUTPOST</h1>
    <div class="header-stats" id="headerStats"></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="content active" id="mapPanel"></div>
  <div class="content" id="peoplePanel"></div>
  <div class="content" id="researchPanel"></div>
  <div class="content" id="tradePanel"></div>
  <div class="content" id="logPanel"></div>
  <div class="content" id="devPanel"></div>
  <div class="footer">
    <button class="btn" id="endTurnBtn">End Turn [SPACE]</button>
    <input type="text" id="seedInput" placeholder="Seed (1337)" style="padding: 6px; background: #2a2a2a; border: 1px solid #444; color: #0f0; font-family: monospace; width: 120px;">

</div>

  <div class="modal-content">

</div>

      <button class="btn" id="endGameRestartBtn">New Game</button>
    </div>
  </div>
</div>

<script>
/*
ASSUMPTIONS:
- Seeded PRNG using Mulberry32; default seed 1337
- 8x8 grid with 5 terrain types (ash, rock, water, vent, ruins)
- 12 building types with resource production chains
- 8 colonists with 4 skill types (farmer, engineer, miner, scientist)
- Resources: food, water, metal, power, parts, scrip
- Win: turn 60+, pop >= 12, adequate storage
- Lose: pop <= 0
- Ashstorms scale with turn, damage buildings, spike water consumption
- Events: 10+ types with 2-3 choice outcomes
- Trade: caravan arrives every ~8 turns, prices drift
- Research: 12 nodes with prerequisites and unlocks
- Save/Load via JSON text serialization
- No external resources, no localStorage, all state in memory
*/

// ============ MULBERRY32 PRNG ============
function mulberry32(a) {
  return function() {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}

// ============ GAME STATE ============
const BUILDINGS = {
  storage: { name: 'Storage', terrain: [], cost: { parts: 10 }, produces: [], stores: Infinity },
  greenhouse: { name: 'Greenhouse', terrain: ['ash'], cost: { parts: 15, scrip: 5 }, produces: ['food'], stores: 50, consume: ['water'] },
  condenser: { name: 'Condenser', terrain: ['water'], cost: { parts: 12, scrip: 5 }, produces: ['water'], stores: 100 },
  forge: { name: 'Forge', terrain: ['vent'], cost: { parts: 20, scrip: 10 }, produces: ['metal'], stores: 80, consume: ['ore'] },
  mine: { name: 'Mine', terrain: ['rock'], cost: { parts: 15, scrip: 5 }, produces: ['ore'], stores: 80 },
  reactor: { name: 'Reactor', terrain: ['vent'], cost: { parts: 30, scrip: 20, metal: 10 }, produces: ['power'], stores: 100, consume: ['metal'] },
  lab: { name: 'Lab', terrain: ['ruins'], cost: { parts: 25, scrip: 15 }, produces: ['research'], stores: 50 },
  wall: { name: 'Wall', terrain: [], cost: { parts: 8 }, produces: [], stores: 0, mitigation: 0.25 },
  rain_collector: { name: 'Rain Collector', terrain: [], cost: { parts: 12, scrip: 5 }, produces: ['water'], stores: 60 },
  farm_plot: { name: 'Farm Plot', terrain: ['ash', 'rock'], cost: { parts: 10 }, produces: ['food'], stores: 40, consume: ['water'] },
  trade_post: { name: 'Trade Post', terrain: [], cost: { parts: 20, scrip: 10 }, produces: [], stores: 100 },
  shelter: { name: 'Shelter', terrain: [], cost: { parts: 8 }, produces: [], stores: 0, morale_bonus: 0.1 }
};

const TERRAIN_TYPES = {
  ash: { name: 'Ash Flat', char: '░', color: '#888' },
  rock: { name: 'Rock', char: '▓', color: '#666' },
  water: { name: 'Water', char: '≈', color: '#00f' },
  vent: { name: 'Vent', char: '◊', color: '#f0f' },
  ruins: { name: 'Ruins', char: '▲', color: '#666' }
};

const RESEARCH_TREE = [
  { id: 'soil_enrichment', name: 'Soil Enrichment', desc: 'Ashto Soil 25% faster', prereq: [], cost: { scrip: 10, parts: 5 }, unlock: [] },
  { id: 'water_capture', name: 'Water Capture', desc: 'Condenser +20% output', prereq: [], cost: { scrip: 15, parts: 8 }, unlock: [] },
  { id: 'metallurgy', name: 'Metallurgy', desc: 'Forge +15% output', prereq: [], cost: { scrip: 20, parts: 12 }, unlock: [] },
  { id: 'reinforced_walls', name: 'Reinforced Walls', desc: 'Ashstorm damage -40%', prereq: [], cost: { scrip: 30, parts: 20 }, unlock: [] },
  { id: 'advanced_farming', name: 'Advanced Farming', desc: 'Farm plots +25% output', prereq: ['soil_enrichment'], cost: { scrip: 25, parts: 15 }, unlock: [] },
  { id: 'renewable_power', name: 'Renewable Power', desc: 'Power consumption -30%', prereq: ['water_capture'], cost: { scrip: 35, parts: 25 }, unlock: [] },
  { id: 'specialization', name: 'Specialization', desc: 'Colonist skills +50% effective', prereq: [], cost: { scrip: 40, parts: 30 }, unlock: [] },
  { id: 'storm_shelter', name: 'Storm Shelter', desc: 'Ashstorm water spike -60%', prereq: ['reinforced_walls'], cost: { scrip: 50, parts: 40 }, unlock: [] },
  { id: 'ore_extraction', name: 'Ore Extraction', desc: 'Mine +20% output', prereq: [], cost: { scrip: 18, parts: 12 }, unlock: [] },
  { id: 'biotech', name: 'Biotech', desc: 'Colonist morale recovery +25%', prereq: ['soil_enrichment', 'specialization'], cost: { scrip: 45, parts: 35 }, unlock: [] },
  { id: 'energy_storage', name: 'Energy Storage', desc: 'Power storage +50%', prereq: ['renewable_power'], cost: { scrip: 30, parts: 25 }, unlock: [] },
  { id: 'advanced_trading', name: 'Advanced Trading', desc: 'Trade margins +15%', prereq: [], cost: { scrip: 20, parts: 12 }, unlock: [] }
];

const EVENTS_DECK = [
  {
    id: 'ashstorm_early',
    name: 'Ashstorm Warning',
    text: 'A massive ashstorm is building on the horizon. Prepare defenses?',
    choices: [
      { text: 'Reinforce buildings', effect: (g) => { g.nextStormSeverity = Math.min(2, g.nextStormSeverity - 0.3); g.log('Spent resources reinforcing buildings.'); } },
      { text: 'Evacuate to shelter', effect: (g) => { g.resources.food -= 30; g.resources.water -= 20; g.log('Sheltered colonists, consumed reserves.'); } },
      { text: 'Continue normally', effect: (g) => { g.log('Ignored warning.'); } }
    ]
  },
  {
    id: 'ore_deposit',
    name: 'Rich Ore Deposit',
    text: 'Miners discover a rich ore deposit nearby. Mine harder?',
    choices: [
      { text: 'Exploit heavily', effect: (g) => { g.resources.ore = Math.min(g.resources.ore + 40, g.caps.ore); g.log('Mined ore deposit.'); } },
      { text: 'Pace extraction', effect: (g) => { g.resources.ore = Math.min(g.resources.ore + 20, g.caps.ore); g.log('Sustainably extracted ore.'); } }
    ]
  },
  {
    id: 'colonist_arrives',
    name: 'Survivor Arrives',
    text: 'A survivor stumbles into the outpost. Recruit them?',
    choices: [
      { text: 'Yes', effect: (g) => { if (g.population.length < 20) { g.population.push(generateColonist(g.rng)); g.log('New colonist joined.'); } } },
      { text: 'No', effect: (g) => { g.log('Turned away the survivor.'); } }
    ]
  },
  {
    id: 'water_contamination',
    name: 'Water Contamination',
    text: 'Condenser malfunction—water is contaminated. Handle it?',
    choices: [
      { text: 'Purify (costs water)', effect: (g) => { g.resources.water = Math.max(0, g.resources.water - 30); g.log('Purified water supply at cost.'); } },
      { text: 'Evacuate (lose morale)', effect: (g) => { g.population.forEach(p => p.morale = Math.max(0, p.morale - 15)); g.log('Evacuated, morale hit.'); } }
    ]
  },
  {
    id: 'parts_shortage',
    name: 'Parts Shortage',
    text: 'Supply line reports no spare parts available. Build faster?',
    choices: [
      { text: 'Pay premium', effect: (g) => { g.resources.scrip = Math.max(0, g.resources.scrip - 40); g.resources.parts = Math.min(g.resources.parts + 20, g.caps.parts); g.log('Bought parts at high cost.'); } },
      { text: 'Salvage ruins', effect: (g) => { g.resources.parts = Math.min(g.resources.parts + 10, g.caps.parts); g.log('Salvaged parts from ruins.'); } }
    ]
  },
  {
    id: 'morale_crisis',
    name: 'Morale Crisis',
    text: 'Colonists are unhappy. Boost morale?',
    choices: [
      { text: 'Celebrate', effect: (g) => { g.resources.food = Math.max(0, g.resources.food - 20); g.population.forEach(p => p.morale = Math.min(100, p.morale + 20)); g.log('Celebration boosted morale.'); } },
      { text: 'Ignore', effect: (g) => { g.log('Ignored morale problem.'); } }
    ]
  },
  {
    id: 'cold_spell',
    name: 'Cold Spell',
    text: 'Temperature plummets. Activate heaters?',
    choices: [
      { text: 'Activate', effect: (g) => { g.resources.power = Math.max(0, g.resources.power - 50); g.population.forEach(p => p.fatigue = Math.max(0, p.fatigue - 10)); g.log('Heated shelters.'); } },
      { text: 'Endure', effect: (g) => { g.population.forEach(p => { p.fatigue = Math.min(100, p.fatigue + 20); p.morale = Math.max(0, p.morale - 10); }); g.log('Colonists suffered from cold.'); } }
    ]
  },
  {
    id: 'food_windfall',
    name: 'Food Windfall',
    text: 'Greenhouse harvests better than expected.',
    choices: [
      { text: 'Accept', effect: (g) => { g.resources.food = Math.min(g.resources.food + 30, g.caps.food); g.log('Received food bonus.'); } }
    ]
  },
  {
    id: 'equipment_failure',
    name: 'Equipment Failure',
    text: 'A critical machine breaks down. Repair it?',
    choices: [
      { text: 'Repair immediately', effect: (g) => { g.resources.parts = Math.max(0, g.resources.parts - 30); g.log('Repaired machine quickly.'); } },
      { text: 'Repair slowly', effect: (g) => { g.resources.parts = Math.max(0, g.resources.parts - 15); g.slowRepairTimer = 3; g.log('Began slow repair.'); } }
    ]
  },
  {
    id: 'trade_opportunity',
    name: 'Trade Opportunity',
    text: 'Caravan leader offers special prices today only.',
    choices: [
      { text: 'Accept', effect: (g) => { g.tradeMultiplier = 1.2; g.log('Accepted trade bonus.'); } },
      { text: 'Decline', effect: (g) => { g.log('Declined trade bonus.'); } }
    ]
  }
];

class Game {
  constructor(seed = 1337) {
    this.seed = seed;
    this.rng = mulberry32(seed);
    this.turn = 0;
    this.won = false;
    this.lost = false;
    this.finalScore = 0;

    // Terrain map
    this.terrain = this.generateTerrain();

    // Resources
    this.resources = { food: 50, water: 50, ore: 20, metal: 20, power: 50, parts: 30, scrip: 100 };
    this.caps = { food: 150, water: 150, ore: 120, metal: 120, power: 150, parts: 200, scrip: 500 };

    // Buildings
    this.buildings = Array(64).fill(null);

    // Population
    this.population = [generateColonist(this.rng), generateColonist(this.rng)];

    // Research
    this.research = {};
    RESEARCH_TREE.forEach(n => this.research[n.id] = false);

    // Events
    this.eventLog = [];
    this.eventCooldown = {};
    this.currentEvent = null;
    this.eventCallback = null;

    // Trade
    this.caravanTimer = 0;
    this.tradeMultiplier = 1.0;
    this.caravan = null;

    // Hazard
    this.stormTimer = 0;
    this.stormInterval = 12;
    this.nextStormSeverity = 1;

    // Building assignments
    this.buildingAssignments = {};
    Object.keys(BUILDINGS).forEach(k => this.buildingAssignments[k] = []);

    this.log('Game started. Ready your outpost!');
  }

  generateTerrain() {
    const terrain = [];
    for (let i = 0; i < 64; i++) {
      const r = this.rng();
      if (r < 0.35) terrain.push('ash');
      else if (r < 0.6) terrain.push('rock');
      else if (r < 0.75) terrain.push('water');
      else if (r < 0.85) terrain.push('vent');
      else terrain.push('ruins');
    }
    return terrain;
  }

  getTile(x, y) { return this.buildings[y * 8 + x]; }
  setTile(x, y, building) { this.buildings[y * 8 + x] = building; }
  getTerrain(x, y) { return this.terrain[y * 8 + x]; }

  isValidBuild(x, y, buildingName) {
    if (this.getTile(x, y)) return false;
    const building = BUILDINGS[buildingName];
    if (!building) return false;
    const terrain = this.getTerrain(x, y);
    if (building.terrain.length > 0 && !building.terrain.includes(terrain)) return false;
    return true;
  }

  canAfford(cost) {
    for (const res in cost) {
      if ((this.resources[res] || 0) < cost[res]) return false;
    }
    return true;
  }

  spend(cost) {
    for (const res in cost) {
      this.resources[res] = Math.max(0, this.resources[res] - cost[res]);
    }
  }

  build(x, y, buildingName) {
    if (!this.isValidBuild(x, y, buildingName)) return false;
    const building = BUILDINGS[buildingName];
    if (!this.canAfford(building.cost)) return false;
    this.spend(building.cost);
    this.setTile(x, y, buildingName);
    this.log(`Built ${building.name} at (${x},${y}).`);
    return true;
  }

  research_upgrade(techId) {
    const tech = RESEARCH_TREE.find(t => t.id === techId);
    if (!tech || this.research[techId]) return false;
    if (tech.prereq && tech.prereq.some(p => !this.research[p])) return false;
    if (!this.canAfford(tech.cost)) return false;
    this.spend(tech.cost);
    this.research[techId] = true;
    this.log(`Researched: ${tech.name}.`);
    return true;
  }

  endTurn() {
    if (this.won || this.lost) return;
    this.turn++;

    // Step 1: Consume food and water
    this.population.forEach(p => {
      this.resources.food = Math.max(0, this.resources.food - 1);
      this.resources.water = Math.max(0, this.resources.water - 1);
    });

    // Step 2: Check starvation
    if (this.resources.food <= 0) {
      this.population.forEach(p => { p.morale = Math.max(0, p.morale - 30); });
      this.log('Not enough food! Morale plummeted.');
    }
    if (this.resources.water <= 0) {
      this.population.forEach(p => { p.morale = Math.max(0, p.morale - 30); p.fatigue = Math.min(100, p.fatigue + 20); });
      this.log('Severe water shortage! Morale and fatigue hit.');
    }

    // Step 3: Production
    this.produceResources();

    // Step 4: Colonist morale & fatigue
    this.population.forEach(p => {
      if (p.morale <= 0) {
        if (this.rng() < 0.5) this.population = this.population.filter(x => x !== p);
        p.morale = 0;
      } else {
        p.morale = Math.min(100, p.morale + 5);
      }
      p.fatigue = Math.max(0, p.fatigue - 3);
    });

    // Step 5: Ashstorm check
    this.stormTimer++;
    if (this.stormTimer >= this.stormInterval) {
      this.triggerAshstorm();
      this.stormTimer = 0;
      this.nextStormSeverity = 1;
    }

    // Step 6: Caravan timer
    this.caravanTimer++;
    if (this.caravanTimer >= 8) {
      this.triggerCaravan();
      this.caravanTimer = 0;
    }

    // Step 7: Random event
    if (this.rng() < 0.2) {
      this.fireRandomEvent();
    }

    // Step 8: Check win/lose
    if (this.population.length === 0) {
      this.lost = true;
      this.log('All colonists have left. Game over.');
    } else if (this.turn >= 60 && this.population.length >= 12 && this.resources.food >= 50 && this.resources.water >= 50) {
      this.won = true;
      this.computeScore();
      this.log('Victory! Outpost is sustainable!');
    }
  }

  produceResources() {
    for (let i = 0; i < 64; i++) {
      const building = this.buildings[i];
      if (!building) continue;
      const buildDef = BUILDINGS[building];
      if (!buildDef.produces) continue;

      const x = i % 8, y = Math.floor(i / 8);
      let skillBonus = 1.0;
      const assigned = this.buildingAssignments[building] || [];
      if (assigned.length > 0) {
        const avgSkill = assigned.reduce((s, p) => s + (p.skill || 1), 0) / assigned.length;
        skillBonus = 0.5 + (avgSkill / 5) * 0.5;
      }

      if (this.research['specialization']) skillBonus *= 1.5;

      let output = skillBonus * (buildDef.output || 10);
      if (building === 'greenhouse' && this.research['soil_enrichment']) output *= 1.25;
      if (building === 'greenhouse' && this.research['advanced_farming']) output *= 1.25;
      if (building === 'condenser' && this.research['water_capture']) output *= 1.2;
      if (building === 'forge' && this.research['metallurgy']) output *= 1.15;
      if (building === 'mine' && this.research['ore_extraction']) output *= 1.2;

      // Adjacency bonuses
      let adjBonus = 1.0;
      if (building === 'condenser' && this.getTerrain(x, y) === 'water') adjBonus = 1.15;
      if (building === 'forge' && this.getTerrain(x, y) === 'vent') adjBonus = 1.15;
      output *= adjBonus;

      buildDef.produces.forEach(resource => {
        let toAdd = output;
        if (buildDef.consume) {
          buildDef.consume.forEach(consumed => {
            const consume = output * 0.4;
            this.resources[consumed] = Math.max(0, this.resources[consumed] - consume);
          });
        }
        if (resource === 'research') {
          this.resources.scrip = Math.min(this.resources.scrip + toAdd, this.caps.scrip);
        } else {
          this.resources[resource] = Math.min(this.resources[resource] + toAdd, this.caps[resource]);
        }
      });
    }
  }

  triggerAshstorm() {
    const severity = Math.min(3, this.nextStormSeverity * (1 + this.turn / 100));
    let totalDamage = severity * 20;
    let waterSpike = severity * 40;

    if (this.research['reinforced_walls']) totalDamage *= 0.6;
    if (this.research['storm_shelter']) waterSpike *= 0.4;

    // Count walls and shelters
    let wallCount = this.buildings.filter(b => b === 'wall').length;
    let shelterCount = this.buildings.filter(b => b === 'shelter').length;
    totalDamage *= Math.max(0.2, 1 - (wallCount + shelterCount) * 0.08);

    for (let i = 0; i < 64; i++) {
      if (!this.buildings[i] || Math.random() < (severity / 3)) continue;
      this.buildings[i] = null;
    }

    this.resources.water = Math.max(0, this.resources.water - waterSpike);
    this.population.forEach(p => p.morale = Math.max(0, p.morale - totalDamage / 10));
    this.log(`Ashstorm (severity ${severity.toFixed(1)}) devastated the outpost.`);
  }

  triggerCaravan() {
    const goods = [
      { name: 'Food', resource: 'food', basePrice: 2, qty: 20 },
      { name: 'Water', resource: 'water', basePrice: 1.5, qty: 30 },
      { name: 'Metal', resource: 'metal', basePrice: 5, qty: 10 },
      { name: 'Parts', resource: 'parts', basePrice: 8, qty: 15 }
    ];
    this.caravan = goods.map(g => ({
      ...g,
      price: Math.max(1, g.basePrice * (0.8 + this.rng() * 0.6) * this.tradeMultiplier)
    }));
    this.log('Caravan arrived! Use Trade tab.');
    this.tradeMultiplier = 1.0;
  }

  fireRandomEvent() {
    const available = EVENTS_DECK.filter(e => !this.eventCooldown[e.id]);
    if (available.length === 0) {
      this.eventCooldown = {};
      return;
    }
    this.currentEvent = available[Math.floor(this.rng() * available.length)];
    this.eventCooldown[this.currentEvent.id] = true;
  }

  resolveEventChoice(choiceIdx) {
    if (!this.currentEvent) return;
    this.currentEvent.choices[choiceIdx].effect(this);
    this.currentEvent = null;
  }

  log(msg) {
    this.eventLog.push({ turn: this.turn, msg });
  }

  computeScore() {
    this.finalScore = this.population.length * 50 + this.research ? Object.values(this.research).filter(Boolean).length * 20 : 0;
    this.finalScore += this.turn * 2;
    this.finalScore += Object.values(this.resources).reduce((s, v) => s + Math.floor(v / 10), 0);
  }

  serialize() {
    return JSON.stringify({
      seed: this.seed,
      turn: this.turn,
      resources: this.resources,
      terrain: this.terrain,
      buildings: this.buildings,
      population: this.population,
      research: this.research,
      buildingAssignments: this.buildingAssignments,
      stormInterval: this.stormInterval,
      stormTimer: this.stormTimer,
      nextStormSeverity: this.nextStormSeverity,
      caravanTimer: this.caravanTimer,
      caravan: this.caravan,
      eventLog: this.eventLog,
      eventCooldown: this.eventCooldown,
      won: this.won,
      lost: this.lost,
      finalScore: this.finalScore
    });
  }

  static deserialize(json) {
    const data = JSON.parse(json);
    const game = new Game(data.seed);
    game.turn = data.turn;
    game.resources = data.resources;
    game.terrain = data.terrain;
    game.buildings = data.buildings;
    game.population = data.population;
    game.research = data.research;
    game.buildingAssignments = data.buildingAssignments;
    game.stormInterval = data.stormInterval;
    game.stormTimer = data.stormTimer;
    game.nextStormSeverity = data.nextStormSeverity;
    game.caravanTimer = data.caravanTimer;
    game.caravan = data.caravan;
    game.eventLog = data.eventLog;
    game.eventCooldown = data.eventCooldown;
    game.won = data.won;
    game.lost = data.lost;
    game.finalScore = data.finalScore;
    return game;
  }
}

function generateColonist(rng) {
  const skills = ['farmer', 'engineer', 'miner', 'scientist'];
  const skill = skills[Math.floor(rng() * 4)];
  const names = ['Alex', 'Blake', 'Casey', 'Dana', 'Ellis', 'Finn', 'Gray', 'Hunter', 'Ivy', 'Jazz'];
  return {
    name: names[Math.floor(rng() * names.length)],
    skill: Math.floor(rng() * 5) + 1,
    fatigue: Math.floor(rng() * 50),
    morale: 80 + Math.floor(rng() * 20)
  };
}

function openBuildModal(x, y) {
  const terrain = gameState.getTerrain(x, y);
  if (gameState.getTile(x, y)) return;

  const validBuildings = Object.keys(BUILDINGS).filter(b => gameState.isValidBuild(x, y, b));
  let html = `<div style="font-size: 12px;">Terrain: ${TERRAIN_TYPES[terrain].name}</div>`;
  html += '<div style="margin-top: 8px;">';
  validBuildings.forEach(b => {
    const def = BUILDINGS[b];
    const canAfford = gameState.canAfford(def.cost);
    const costStr = Object.entries(def.cost).map(([r, a]) => `${r} ${a}`).join(', ');
    html += `<div style="padding: 4px; background: ${canAfford ? '#1a3a1a' : '#3a1a1a'}; margin-bottom: 4px; cursor: pointer;" onclick="selectedBuilding='${b}'; updateBuildModal();">
      <div style="color: #0f0;">${def.name}</div>
      <div style="color: #666; font-size: 10px;">Cost: ${costStr}</div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('buildModalBody').innerHTML = html;
  document.getElementById('buildModalTitle').textContent = `Build at (${x}, ${y})`;
  document.getElementById('buildModal').classList.add('active');
  selectedBuildTile = { x, y };
  selectedBuilding = validBuildings[0] || '';
}

function updateBuildModal() {
  if (selectedBuilding) {
    const def = BUILDINGS[selectedBuilding];
    const costStr = Object.entries(def.cost).map(([r, a]) => `${r} ${a}`).join(', ');
    const confirmBtn = document.getElementById('buildConfirmBtn');
    const canAfford = gameState.canAfford(def.cost);
    confirmBtn.textContent = canAfford ? 'Build' : 'Cannot afford';
    confirmBtn.classList.toggle('disabled', !canAfford);
  }
}

function closeBuildModal() {
  document.getElementById('buildModal').classList.remove('active');
  selectedBuilding = '';
  selectedBuildTile = null;
}

  activeTab = tab;
  document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));

function buyTrade(idx) {
  if (!gameState.caravan) return;
  const item = gameState.caravan[idx];
  const cost = Math.ceil(item.price);
  if (gameState.resources.scrip >= cost && item.qty > 0) {
    gameState.resources.scrip -= cost;
    gameState.resources[item.resource] = Math.min(gameState.resources[item.resource] + 1, gameState.caps[item.resource]);
    item.qty--;
    gameState.log(`Bought 1 ${item.name} for ${cost} scrip.`);
    render();
  }
}

function sellTrade(idx) {
  if (!gameState.caravan) return;
  const item = gameState.caravan[idx];
  const offer = Math.ceil(item.price * 0.7);
  if (gameState.resources[item.resource] >= 1) {
    gameState.resources[item.resource]--;
    gameState.resources.scrip = Math.min(gameState.resources.scrip + offer, gameState.caps.scrip);
    item.qty++;
    gameState.log(`Sold 1 ${item.name} for ${offer} scrip.`);
    render();
  }
}

function runTests() {
  const results = [];

  // Test 1: No negative resources
  let pass = true;
  for (const res in gameState.resources) {
    if (gameState.resources[res] < 0) pass = false;
  }
  results.push(`✓ No negative resources: ${pass ? 'PASS' : 'FAIL'}`);

  // Test 2: Resources within caps
  pass = true;
  for (const res in gameState.caps) {
    if (gameState.resources[res] > gameState.caps[res]) pass = false;
  }
  results.push(`✓ Resources within caps: ${pass ? 'PASS' : 'FAIL'}`);

  // Test 3: Population count matches roster
  pass = gameState.population.length >= 1;
  results.push(`✓ Population has colonists: ${pass ? 'PASS' : 'FAIL'}`);

  // Test 4: All research prereqs respected
  pass = true;
  for (const tech of RESEARCH_TREE) {
    if (gameState.research[tech.id] && tech.prereq) {
      if (tech.prereq.some(p => !gameState.research[p])) pass = false;
    }
  }
  results.push(`✓ Research prereqs enforced: ${pass ? 'PASS' : 'FAIL'}`);

  // Test 5: Turn counter non-negative
  results.push(`✓ Turn >= 0: ${gameState.turn >= 0 ? 'PASS' : 'FAIL'}`);

  // Test 6: Buildings within grid
  pass = gameState.buildings.length === 64;
  results.push(`✓ Grid is 64 tiles: ${pass ? 'PASS' : 'FAIL'}`);

  // Test 7: Terrain within grid
  pass = gameState.terrain.length === 64;
  results.push(`✓ Terrain is 64 tiles: ${pass ? 'PASS' : 'FAIL'}`);

  // Test 8: Save/Load round-trip
  try {
    const before = gameState.serialize();
    const loaded = Game.deserialize(before);
    const after = loaded.serialize();
    pass = before === after;
    results.push(`✓ Save/Load round-trip: ${pass ? 'PASS' : 'FAIL'}`);
  } catch (e) {
    results.push(`✓ Save/Load round-trip: FAIL (${e.message})`);
  }

  // Test 9: Colonist morale 0-100
  pass = gameState.population.every(p => p.morale >= 0 && p.morale <= 100);
  results.push(`✓ Colonist morale in range: ${pass ? 'PASS' : 'FAIL'}`);

  // Test 10: Colonist fatigue 0-100
  pass = gameState.population.every(p => p.fatigue >= 0 && p.fatigue <= 100);
  results.push(`✓ Colonist fatigue in range: ${pass ? 'PASS' : 'FAIL'}`);

  // Test 11: Skill levels 1-5
  pass = gameState.population.every(p => p.skill >= 1 && p.skill <= 5);
  results.push(`✓ Colonist skills 1-5: ${pass ? 'PASS' : 'FAIL'}`);

  // Test 12: Event log has entries
  pass = gameState.eventLog.length > 0;
  results.push(`✓ Event log populated: ${pass ? 'PASS' : 'FAIL'}`);

  // Test 13: Reproducible from seed
  const g2 = new Game(gameState.seed);
  for (let i = 0; i < 5; i++) g2.endTurn();
  const g3 = new Game(gameState.seed);
  for (let i = 0; i < 5; i++) g3.endTurn();
  pass = g2.serialize() === g3.serialize();
  results.push(`✓ Seeded RNG is deterministic: ${pass ? 'PASS' : 'FAIL'}`);

  // Test 14: Can build if resources available
  const testGame = new Game(9999);
  testGame.resources.parts = 100;
  const built = testGame.build(0, 0, 'storage');
  pass = built && testGame.getTile(0, 0) === 'storage';
  results.push(`✓ Building placement works: ${pass ? 'PASS' : 'FAIL'}`);

  // Test 15: Event system fires
  pass = gameState.eventLog.length > 0;
  results.push(`✓ Events were logged: ${pass ? 'PASS' : 'FAIL'}`);

  const output = results.join('\n');
  document.getElementById('devOutput').textContent = output;
}

function runBenchmark() {
  const output = [];
  const benchGame = new Game(gameState.seed);
  const startTime = Date.now();

  for (let turn = 0; turn < 200; turn++) {
    benchGame.endTurn();
    if (benchGame.won || benchGame.lost) break;
  }

  const elapsed = Date.now() - startTime;
  const hash = Math.abs(benchGame.serialize().split('').reduce((a, c) => ((a << 5) - a) + c.charCodeAt(0), 0)).toString(16);

  output.push(`Benchmark completed in ${elapsed}ms`);
  output.push(`Final turn: ${benchGame.turn}`);
  output.push(`Population: ${benchGame.population.length}`);
  output.push(`Food: ${Math.floor(benchGame.resources.food)}`);
  output.push(`State hash: ${hash}`);

  document.getElementById('devOutput').textContent = output.join('\n');
}

  });

  document.getElementById('buildConfirmBtn').addEventListener('click', () => {
    if (selectedBuildTile && selectedBuilding) {
      const success = gameState.build(selectedBuildTile.x, selectedBuildTile.y, selectedBuilding);
      closeBuildModal();
      render();
    }
  });

  document.getElementById('buildCancelBtn').addEventListener('click', closeBuildModal);

  document.getElementById('endGameRestartBtn').addEventListener('click', () => {
    gameState = new Game(1337);
    activeTab = 'map';
    render();
  });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      gameState.endTurn();
      render();
    }
    if (e.key >= '1' && e.key <= '6') {
      const tabs = ['map', 'people', 'research', 'trade', 'log', 'dev'];
      switchTab(tabs[parseInt(e.key) - 1]);
    }
  });

  render();
});
</script>
</body>
</html>
