/* ---- log -------------------------------------------------------------- */
var LOG_FILTERS = [['all','ALL'],['event','EVENTS'],['storm','STORMS'],['trade','TRADE'],['bad','PROBLEMS']];
function viewLog(){
  var S = G, h = [];
  h.push('<div class="card"><div class="spread"><h2>Log</h2><div class="row tightgap">');
  for(var f=0;f<LOG_FILTERS.length;f++){
    h.push('<button class="sm '+(UI.logFilter===LOG_FILTERS[f][0]?'on':'')+'" data-act="logfilter" data-k="'+LOG_FILTERS[f][0]+'">'+LOG_FILTERS[f][1]+'</button>');
  }
  h.push('</div></div><small class="muted">Newest first. '+S.log.length+' entries held (oldest are dropped past '+MAX_LOG+').</small></div>');
  h.push('<div class="log">');
  var shown = 0;
  for(var i=S.log.length-1;i>=0;i--){
    var e = S.log[i];
    if(UI.logFilter!=='all' && e.k !== UI.logFilter) continue;
    shown++;
    h.push('<div class="logline k-'+esc(e.k)+'"><span class="tn">T'+e.t+'</span><span>'+esc(e.m)+'</span></div>');
  }
  if(!shown) h.push('<div class="logline"><span class="tn">--</span><span>Nothing matches that filter yet.</span></div>');
  h.push('</div>');
  return h.join('');
}

/* ---- dev -------------------------------------------------------------- */
function viewDev(){
  var S = G, h = [];
  h.push('<div class="card"><h2>Verification</h2>');
  h.push('<div class="row">');
  h.push('<button data-act="tests"'+tip('Runs the invariant suite against fresh states derived from the current seed. It never touches your live game.')+'>RUN TESTS</button>');
  h.push('<button data-act="bench"'+tip('Headless 200-turn simulation from the current seed using the built-in greedy policy, run twice. Same seed must give the same hash both times.')+'>RUN BENCHMARK</button>');
  h.push('<button data-act="clearout">CLEAR</button>');
  h.push('</div>');
  h.push('<small class="muted">Current state hash: <b>'+hashState(S)+'</b> (FNV-1a over canonical, key-sorted, 4dp-rounded JSON).</small>');
  if(UI.devOut) h.push('<pre class="out">'+UI.devOut+'</pre>');
  h.push('</div>');

  h.push('<div class="card"><h2>Save / Load</h2>');
  h.push('<p class="muted" style="font-size:12px">No storage is used anywhere in this file. Copy the text out to keep a save; paste it back and press Load. The last 150 log lines travel with the save.</p>');
  h.push('<div class="row"><button data-act="dump">WRITE SAVE TO BOX</button><button data-act="load">LOAD FROM BOX</button><button data-act="copy">SELECT ALL</button></div>');
  h.push('<textarea id="savebox" spellcheck="false" placeholder="Press WRITE SAVE TO BOX, or paste a save here and press LOAD FROM BOX."></textarea>');
  h.push('<div id="savemsg"></div>');
  h.push('</div>');

  h.push('<div class="card"><h2>Turn resolution order</h2><ol style="margin:0;padding-left:20px;font-size:12px">');
  for(var i=0;i<STEPS.length;i++) h.push('<li>'+esc(STEPS[i][0])+'</li>');
  h.push('</ol><small class="muted">Every turn runs exactly these steps in exactly this order. A choice event parks the turn after step 10 until you answer, then the rest of the steps run.</small></div>');
  return h.join('');
}
function fmtTests(r){
  var out = [];
  out.push('TESTS  '+r.pass+' passed, '+r.fail+' failed, '+r.results.length+' assertions\n');
  for(var i=0;i<r.results.length;i++){
    var t = r.results[i];
    out.push('<span class="'+(t.ok?'pass':'fail')+'">'+(t.ok?'PASS':'FAIL')+'</span>  '+
             esc(t.name)+(t.detail?'\n        '+esc(t.detail):''));
  }
  return out.join('\n');
}
function fmtBench(a,b){
  var o = [];
  o.push('BENCHMARK  seed '+a.seed+', '+a.turns+' turns, greedy built-in policy, sandbox mode (no turn-60 ending)');
  o.push('');
  o.push('  run 1 hash   '+a.hash+'   ('+fmt(a.ms,1)+' ms)');
  o.push('  run 2 hash   '+b.hash+'   ('+fmt(b.ms,1)+' ms)');
  o.push('  <span class="'+(a.hash===b.hash?'pass':'fail')+'">'+(a.hash===b.hash?'IDENTICAL - the simulation is reproducible':'MISMATCH - determinism broken')+'</span>');
  o.push('');
  o.push('  turns simulated   '+a.turns+(a.over?'  (ended: '+a.over+')':''));
  o.push('  population        '+a.pop+'   housing '+a.housing+'   avg skill '+fmt(a.avgSkill,2));
  o.push('  jobs              '+keysOf(a.jobs).map(function(j){ return JOBS[j].short+' '+a.jobs[j]; }).join('  '));
  o.push('  buildings         '+a.buildings+'   built over the run '+a.stats.builds);
  o.push('  research done     '+a.research+' / '+RESEARCH.length+'   ['+a.researchList.join(', ')+']');
  o.push('  storms survived   '+a.stats.storms+'   events fired '+a.stats.events+' (choices '+a.stats.choices+')');
  o.push('  migrants/leavers  '+a.stats.migrants+' / '+a.stats.departures);
  o.push('  lost to overflow  '+fmt(a.stats.overflowLost,1));
  o.push('  stockpiles        '+RESOURCES.map(function(r){ return RES_NAME[r].toLowerCase()+' '+fmt(a.res[r],0); }).join(', '));
  o.push('  score             '+a.score.total+'  (pop '+a.score.population+', research '+a.score.research+
         ', stock '+a.score.stockpiles+', survival '+a.score.survival+', victory '+a.score.victory+')');
  return o.join('\n');
}

/* ---- modal / summary --------------------------------------------------- */
function renderModal(){
  var S = G, m = $('modal');
  if(S.pending){
    var e = eventById(S.pending.id), h = [];
    h.push('<div class="box"><div class="spread"><h2>'+esc(S.pending.name)+'</h2><span class="tag acc">TURN '+S.turn+'</span></div>');
    h.push('<p>'+esc(S.pending.text)+'</p>');
    for(var i=0;i<e.choices.length;i++){
      h.push('<button class="choice" data-act="choice" data-idx="'+i+'"><b>'+esc(e.choices[i].label)+'</b>'+
             '<small>'+esc(e.choices[i].tip)+'</small></button>');
    }
    h.push('<small class="muted">The rest of the turn resolves once you choose.</small></div>');
    m.innerHTML = h.join('');
    m.hidden = false;
    return;
  }
  if(S.over && !UI.overSeen){
    var s = S.score || computeScore(S);
    var title = S.over==='win' ? 'THE OUTPOST HOLDS' : (S.over==='lose' ? 'ASHFALL OUTPOST IS DEAD' : 'SIXTY TURNS, AND SHORT OF THE BAR');
    var blurb = S.over==='win'
      ? 'Turn '+WIN_TURN+' with '+S.colonists.length+' colonists fed, watered and willing. You built something that survives the mountain.'
      : (S.over==='lose'
        ? 'The last colonist walked out at turn '+S.turn+'. Ash does not negotiate.'
        : 'The outpost is still standing at turn '+WIN_TURN+' with '+S.colonists.length+' colonists, but the win needed '+WIN_POP+' colonists with every need met on the final turn.');
    var h2 = [];
    h2.push('<div class="box"><h2>'+title+'</h2><p>'+esc(blurb)+'</p>');
    h2.push('<div class="kv"><span>Population x40</span><b>'+s.population+'</b></div>');
    h2.push('<div class="kv"><span>Research completed x25</span><b>'+s.research+'</b></div>');
    h2.push('<div class="kv"><span>Stockpiles /8</span><b>'+s.stockpiles+'</b></div>');
    h2.push('<div class="kv"><span>Turns survived x3</span><b>'+s.survival+'</b></div>');
    h2.push('<div class="kv"><span>Victory bonus</span><b>'+s.victory+'</b></div>');
    h2.push('<hr><div class="kv"><span><b>FINAL SCORE</b></span><b style="font-size:18px;color:var(--acc)">'+s.total+'</b></div>');
    h2.push('<div class="kv"><span>Storms survived</span><b>'+S.stats.storms+'</b></div>');
    h2.push('<div class="kv"><span>Events resolved</span><b>'+S.stats.events+'</b></div>');
    h2.push('<div class="kv"><span>State hash</span><b>'+hashState(S)+'</b></div>');
    h2.push('<div class="row" style="margin-top:8px"><button class="primary" data-act="newgame">NEW GAME</button>'+
            '<button data-act="closeover">LOOK AROUND</button></div></div>');
    m.innerHTML = h2.join('');
    m.hidden = false;
    return;
  }
  m.hidden = true;
  m.innerHTML = '';
}

/* ---- render ----------------------------------------------------------- */
function render(){
  hideTip();
  renderHeader();
  renderTabs();
  var p = $('panel'), html = '';
  if(UI.tab === 'map') html = viewMap();
  else if(UI.tab === 'people') html = viewPeople();
  else if(UI.tab === 'research') html = viewResearch();
  else if(UI.tab === 'trade') html = viewTrade();

}
function say(msg){ UI.msg = msg; }

/* ---- tooltips ---------------------------------------------------------- */
function findTipTarget(el){
  while(el && el.getAttribute){
    if(el.getAttribute('data-tip')) return el;
    el = el.parentNode;
  }
  return null;
}
function showTip(el, x, y){
  var t = $('tip');
  t.textContent = el.getAttribute('data-tip');
  t.hidden = false;
  var r = t.getBoundingClientRect();
  var vw = window.innerWidth, vh = window.innerHeight;
  var left = clamp(x + 12, 4, Math.max(4, vw - r.width - 4));
  var top = y + 16 + r.height > vh ? Math.max(4, y - r.height - 12) : y + 16;
  t.style.left = left+'px';
  t.style.top = top+'px';
}
function hideTip(){ var t = $('tip'); if(t){ t.hidden = true; } }

/* ---- actions ----------------------------------------------------------- */
function findAct(el){
  while(el && el.getAttribute){
    if(el.getAttribute('data-act')) return el;
    el = el.parentNode;
  }
  return null;
}
function endTurn(){
  if(G.over) return;
  UI.msg = '';
  runTurn(G);
  render();
}
function newGame(seed){
  G = newState(seed);
  UI.sel = -1; UI.overSeen = false; UI.msg = ''; UI.devOut = '';
  render();
}
function doAct(act, el){
  var S = G, r;
  if(act === 'endturn'){ endTurn(); return; }
  if(act === 'tab'){ UI.tab = el.getAttribute('data-tab'); render(); return; }
  if(act === 'tile'){ UI.sel = parseInt(el.getAttribute('data-i'),10); render(); return; }
  if(act === 'build'){
    r = buildAt(S, parseInt(el.getAttribute('data-i'),10), el.getAttribute('data-type'));
    say(r.msg); render(); return;
  }
  if(act === 'demolish'){ r = demolish(S, parseInt(el.getAttribute('data-i'),10)); say(r.msg); render(); return; }
  if(act === 'repair'){ r = repairTile(S, parseInt(el.getAttribute('data-i'),10)); say(r.msg); render(); return; }
  if(act === 'rest'){ r = assignColonist(S, parseInt(el.getAttribute('data-cid'),10), null); say(r.msg); render(); return; }
  if(act === 'autoassign'){ say(autoAssign(S)+' colonist(s) put to work.'); render(); return; }
  if(act === 'restall'){ say(restAll(S)+' colonist(s) stood down.'); render(); return; }
  if(act === 'research'){ r = startResearch(S, el.getAttribute('data-id')); say(r.msg); render(); return; }
  if(act === 'cancelresearch'){ r = cancelResearch(S); say(r.msg); render(); return; }
  if(act === 'qty'){ UI.qty = parseInt(el.getAttribute('data-q'),10); render(); return; }
  if(act === 'buy'){ r = tradeBuy(S, el.getAttribute('data-g'), UI.qty); say(r.msg); render(); return; }
  if(act === 'sell'){ r = tradeSell(S, el.getAttribute('data-g'), UI.qty); say(r.msg); render(); return; }
  if(act === 'logfilter'){ UI.logFilter = el.getAttribute('data-k'); render(); return; }
  if(act === 'choice'){
    applyChoice(S, parseInt(el.getAttribute('data-idx'),10));
    runTurn(S);
    render(); return;
  }
  if(act === 'newgame'){
    var box = $('seedin');
    var v = box ? parseInt(box.value,10) : G.seed;
    if(isNaN(v)) v = DEFAULT_SEED;
    newGame(v); return;
  }
  if(act === 'summary'){ UI.overSeen = false; render(); return; }
  if(act === 'closeover'){ UI.overSeen = true; render(); return; }
  if(act === 'tests'){
    UI.devOut = 'running...'; render();
    var res = runTests(S);
    UI.devOut = fmtTests(res);
    render(); return;
  }
  if(act === 'bench'){
    UI.devOut = 'running 2 x 200 turns...'; render();
    var a = benchmark(S.seed, 200), b = benchmark(S.seed, 200);
    UI.devOut = fmtBench(a,b);
    render(); return;
  }
  if(act === 'clearout'){ UI.devOut = ''; render(); return; }
  if(act === 'dump'){
    $('savebox').value = serialize(S);
    $('savemsg').innerHTML = '<small class="pass">Wrote '+serialize(S).length+' characters. Hash '+hashState(S)+'. Select all and copy.</small>';
    return;
  }
  if(act === 'copy'){ var t = $('savebox'); t.focus(); t.select(); return; }
  if(act === 'load'){
    var txt = $('savebox').value;
    if(!txt || !txt.replace(/\s/g,'')){ $('savemsg').innerHTML = '<small class="fail">Nothing in the box to load.</small>'; return; }
    var out = loadFromText(txt);
    if(!out.ok){ $('savemsg').innerHTML = '<small class="fail">LOAD FAILED: '+esc(out.msg)+'</small>'; return; }
    G = out.state;
    UI.sel = -1; UI.overSeen = false;
    say('Save loaded: turn '+G.turn+', '+G.colonists.length+' colonists, hash '+hashState(G)+'.');
    render();
    if($('savemsg')) $('savemsg').innerHTML = '<small class="pass">Loaded. Hash '+hashState(G)+'.</small>';
    return;
  }
}

/* ---- boot -------------------------------------------------------------- */
function boot(){
  G = newState(DEFAULT_SEED);
  render();
  document.addEventListener('click', function(ev){
    var el = findAct(ev.target);
    if(!el || el.tagName === 'SELECT') return;
    if(el.disabled) return;
    ev.preventDefault();
    doAct(el.getAttribute('data-act'), el);
  });
  document.addEventListener('change', function(ev){
    var el = findAct(ev.target);
    if(!el) return;
    var act = el.getAttribute('data-act');
    if(act === 'assign'){
      var v = parseInt(el.value,10);
      var r = assignColonist(G, parseInt(el.getAttribute('data-cid'),10), v < 0 ? null : v);
      say(r.msg); render();
    } else if(act === 'assignsel'){
      if(el.value === '') return;
      var r2 = assignColonist(G, parseInt(el.value,10), parseInt(el.getAttribute('data-i'),10));
      say(r2.msg); render();
    } else if(act === 'retrain'){
      if(el.value === '') return;
      var r3 = retrain(G, parseInt(el.getAttribute('data-cid'),10), el.value);
      say(r3.msg); render();
    }
  });
  document.addEventListener('mouseover', function(ev){
    var el = findTipTarget(ev.target);
    if(el) showTip(el, ev.clientX, ev.clientY); else hideTip();
  });
  document.addEventListener('mouseout', function(ev){
    if(!findTipTarget(ev.relatedTarget)) hideTip();
  });
  document.addEventListener('touchstart', function(ev){
    var el = findTipTarget(ev.target);
    if(!el){ hideTip(); return; }
    var t = ev.touches[0];
    showTip(el, t.clientX, t.clientY);
    window.setTimeout(hideTip, 4000);
  }, {passive:true});
  document.addEventListener('scroll', hideTip, true);
  document.addEventListener('keydown', function(ev){
    var tag = (ev.target && ev.target.tagName) || '';
    if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if(ev.key === ' ' || ev.code === 'Space'){ ev.preventDefault(); if(!G.pending) endTurn(); return; }
    var idx = '123456'.indexOf(ev.key);
    if(idx >= 0){ UI.tab = TABS[idx][0]; render(); }
  });
}
var ROOT = (typeof window !== 'undefined') ? window : globalThis;
ROOT.ASHFALL = {
  newState:newState, runTurn:runTurn, runTests:runTests, benchmark:benchmark,
  hashState:hashState, serialize:serialize, loadFromText:loadFromText,
  greedyTurn:greedyTurn, policyChoice:policyChoice, packState:packState, canon:canon
};
if(typeof document !== 'undefined' && typeof window !== 'undefined'){
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
}
</script>
</body>
