<title>ASHFALL OUTPOST</title>
<!--
================================================================================
ASHFALL OUTPOST - a single-file turn-based survival management game.

ASSUMPTIONS MADE (no clarifying questions were asked, per the brief):

 A1. "Resources: food, water, metal, power, parts, scrip" are the *headline*
     resources. Real production chains need intermediates, so ash, ore and soil
     are also tracked as first-class resources with their own storage caps.
 A2. POWER is a stored resource with a cap (not a pure per-turn flow). Surplus
     power banks up to the cap; anything past the cap is lost and logged, same
     as every other resource.
 A3. The chains asked for are implemented as:
        ash   - (Composter: ash + water)   -> soil
        soil  - (Greenhouse: soil + water) -> food   [consumes water]
        ore   - (Forge: ore + power)       -> metal  [consumes power]
        metal - (Workshop: metal + power)  -> parts
     "ash -> soil -> food at the greenhouse (consumes water)" is read as the
     whole agricultural chain, split across two buildings so the player has a
     real bottleneck to manage.
 A4. Adjacency uses the 4 orthogonal neighbours of a tile (not diagonals).
     Storm Baffle coverage uses Chebyshev radius 2 (a 5x5 box) because it is
     shielding, not a pipe.
 A5. A colonist with no assignment is RESTING. There is no third state.
 A6. Research is bought with scrip+parts UP FRONT, then needs lab labour to
     finish. That is deliberate: it forces research to compete with production
     for people, which is what makes the systems interact.
 A7. "Critical needs met" for the win check means: on the final turn, food and
     water demand were both fully met, and no colonist is at zero morale.
 A8. Reaching turn 60 alive but under the win bar is an ENDING, not a loss.
     The only loss is population 0. Both show the scored summary screen.
 A9. Choice events pause the turn mid-resolution. The remaining turn steps run
     after the player picks. The headless benchmark uses a fixed policy choice
     so it never blocks, which is what keeps its hash reproducible.
 A10. Randomness is a mulberry32 PRNG whose 32-bit state lives inside the game
     state object, so a save/load restores the exact future, and the benchmark
     is byte-for-byte repeatable. The engine never uses the built-in random.
 A11. No storage of any kind is used. Save/load is copy-paste JSON only.
 A12. Tooltips are shown on hover (mouse) and on tap (touch); every number in
     the UI that has a derivation carries one.
 A13. Colonists can be RETRAINED between the four jobs for scrip, losing all
     skill. Without it a bad job mix is unrecoverable, because you cannot
     choose what a migrant arrives as - and with it, scrip income becomes a
     strategic resource rather than just a research tax.
 A14. Migration is automatic but demanding: a spare bunk, both needs met, real
     stockpiles AND a positive net food and water balance last turn. Growth
     tracks genuine surplus instead of pushing you over the edge.
 A15. A Research Lab ticks over slowly with nobody in it. Crewing it roughly
     triples the rate. Without the passive trickle, a colony that is fully
     committed to food and water can never start the research that would free
     up the labour, which is a dead end rather than a difficulty.

TURN RESOLUTION ORDER (fixed, and printed in the Dev panel):
   1  advance turn counter
   2  hazard: ashstorm resolves (damage, ashfall, water-spike flag, morale)
   3  validate assignments (destroyed/disabled buildings, refusing colonists)
   4  production: power -> extraction -> processing chains, in building order
   5  storage clamp / overflow report
   6  consumption: food and water (storm spike applies here)
   7  morale, fatigue, skill growth
   8  research completion check
   9  market drift, caravan arrival/departure
  10  event deck (may pause for a player choice)
  11  migration and departures
  12  end-condition check
================================================================================
-->
<style>
:root{
  --bg:#100e0d; --panel:#1a1715; --panel2:#221e1a; --panel3:#2b2622;
  --line:#3b332c; --line2:#544a3f;
  --ink:#ece4d6; --dim:#a2968492; --dim2:#a29684;
  --acc:#e2913f; --acc2:#79b3a7; --bad:#d4593f; --good:#8fbf6a; --warn:#e0c04a;
  --shadow:0 2px 0 #0007;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(120% 60% at 50% 0%, #241f1b 0%, var(--bg) 60%) fixed;
  color:var(--ink);
  font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;
  -webkit-text-size-adjust:100%;
}
#app{max-width:1000px;margin:0 auto;padding:8px 8px 56px}
h1,h2,h3{margin:0 0 6px;font-weight:700;letter-spacing:.06em}
h1{font-size:15px;color:var(--acc)}
h2{font-size:13px;color:var(--acc);text-transform:uppercase}
h3{font-size:12px;color:var(--dim2);text-transform:uppercase}
p{margin:0 0 8px}
small{font-size:11px;color:var(--dim2)}
hr{border:0;border-top:1px solid var(--line);margin:10px 0}
button,select,input,textarea{font:inherit;color:inherit}
button{
  background:var(--panel3);border:1px solid var(--line2);border-radius:3px;
  padding:5px 9px;cursor:pointer;box-shadow:var(--shadow);
}
button:hover:not(:disabled){background:#3a322b;border-color:var(--acc)}
button:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
button.primary{background:#6a3f16;border-color:var(--acc);color:#ffe9cf;font-weight:700}
button.primary:hover:not(:disabled){background:#84501c}
button.sm{padding:2px 6px;font-size:11px}
button.on{background:#4a3a1a;border-color:var(--acc);color:#ffe6c6}
select,input[type=text],input[type=number],textarea{
  background:#0d0b0a;border:1px solid var(--line2);border-radius:3px;padding:4px 6px;
}
textarea{width:100%;min-height:110px;font-size:11px;line-height:1.35;resize:vertical}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px;margin:0 0 8px}
.card.tight{padding:6px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row.tightgap{gap:3px}
.spread{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.muted{color:var(--dim2)}
.mono{font-variant-numeric:tabular-nums}
.tag{
  display:inline-block;border:1px solid var(--line2);border-radius:3px;
  padding:0 4px;font-size:10px;letter-spacing:.06em;background:#0e0c0b;white-space:nowrap
}
.tag.ok{border-color:#4d6b38;color:var(--good)}
.tag.warnt{border-color:#6b5b22;color:var(--warn)}
.tag.badt{border-color:#6b3226;color:var(--bad)}
.tag.info{border-color:#2f5a53;color:var(--acc2)}
.tag.acc{border-color:#7a4d1c;color:var(--acc)}

/* header */
#hdr{position:sticky;top:0;z-index:30;background:linear-gradient(#171412,#171412 78%,#17141200);padding:6px 0 8px}
.brand{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.brand .sub{font-size:11px;color:var(--dim2)}
.resbar{display:flex;gap:4px;overflow-x:auto;padding:2px 0;scrollbar-width:thin}
.res{
  display:flex;flex-direction:column;align-items:flex-start;gap:0;
  border:1px solid var(--line);border-radius:3px;background:var(--panel2);
  padding:2px 6px;min-width:72px;cursor:help
}
.res b{font-size:12px;font-variant-numeric:tabular-nums}
.res span{font-size:9px;letter-spacing:.08em;color:var(--dim2)}
.res .delta{font-size:9px}
.res.low{border-color:#6b3226}
.res.full{border-color:#6b5b22}
.bar{height:3px;background:#0d0b0a;border-radius:2px;overflow:hidden;width:100%;margin-top:2px}
.bar i{display:block;height:100%;background:var(--acc2)}
.bar i.hot{background:var(--bad)} .bar i.mid{background:var(--warn)} .bar i.good{background:var(--good)}

/* tabs */
#tabs{display:flex;gap:3px;flex-wrap:wrap;margin:6px 0 8px}
#tabs button{flex:1 1 auto;min-width:64px;text-align:center;padding:6px 4px;font-size:12px}
#tabs button .k{font-size:9px;color:var(--dim2)}
#tabs button.on .k{color:#e5c39a}

/* map */
.mapwrap{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;max-width:520px;margin:0 auto 8px}
.tile{
  position:relative;aspect-ratio:1/1;border:1px solid var(--line2);border-radius:3px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0;font-size:clamp(8px,2.3vw,12px);line-height:1.05;cursor:pointer;overflow:hidden;
}
.tile .t{font-size:9px;opacity:.75;position:absolute;top:1px;left:2px}
.tile .b{font-weight:700;letter-spacing:.02em}
.tile .w{font-size:9px;opacity:.85}
.tile .dmg{position:absolute;top:1px;right:2px;font-size:10px;color:var(--bad);font-weight:700}
.tile.sel{outline:2px solid var(--acc);outline-offset:-2px}
.t-ash{background:#2a2521;color:#cdbfae}
.t-rock{background:#38332e;color:#e0d6c8}
.t-water{background:#1d3a3d;color:#a6d8dd}
.t-vent{background:#4a2a1c;color:#ffc79a}
.t-ruins{background:#2e2a35;color:#cfc4dd}
.tile.built{border-color:var(--acc);border-style:solid}
.tile.built.hurt{border-color:var(--bad);border-style:dashed}
.legend{display:flex;gap:6px;flex-wrap:wrap;font-size:10px;color:var(--dim2);justify-content:center}

.plist{display:flex;flex-direction:column;gap:5px}
.pitem{border:1px solid var(--line);border-radius:3px;background:var(--panel2);padding:6px}
.pitem.dis{opacity:.55}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:11px;padding:1px 0}
.kv b{font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr;gap:6px}
@media(min-width:660px){ .grid2{grid-template-columns:1fr 1fr} }
.cols{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:760px){ .cols.map{grid-template-columns:minmax(0,520px) 1fr} }

/* log */
.log{max-height:64vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.logline{display:flex;gap:6px;padding:2px 4px;border-left:2px solid var(--line2);background:#15120f;font-size:12px}
.logline .tn{color:var(--dim2);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.logline.k-good{border-left-color:var(--good)}
.logline.k-bad{border-left-color:var(--bad)}
.logline.k-warn{border-left-color:var(--warn)}
.logline.k-storm{border-left-color:#b06bd4}
.logline.k-event{border-left-color:var(--acc)}
.logline.k-trade{border-left-color:var(--acc2)}

/* tooltip */
.tip{
  position:fixed;z-index:100;max-width:min(340px,92vw);background:#0b0908;border:1px solid var(--acc);
  border-radius:4px;padding:7px 9px;font-size:11px;line-height:1.4;white-space:pre-wrap;
  box-shadow:0 6px 20px #000a;pointer-events:none
}
.tip[hidden]{display:none}
[data-tip]{cursor:help}

/* modal */
.modal{position:fixed;inset:0;z-index:90;background:#000b;display:flex;align-items:center;justify-content:center;padding:12px}
.modal[hidden]{display:none}
.modal .box{background:var(--panel);border:1px solid var(--acc);border-radius:5px;max-width:520px;width:100%;padding:12px;max-height:88vh;overflow:auto}
.choice{display:block;width:100%;text-align:left;margin:0 0 6px;padding:8px}
.choice b{color:var(--acc)}
.choice small{display:block;color:var(--dim2);margin-top:2px}

pre.out{background:#0b0908;border:1px solid var(--line);border-radius:3px;padding:8px;font-size:11px;line-height:1.35;max-height:52vh;overflow:auto;white-space:pre-wrap}
.pass{color:var(--good)} .fail{color:var(--bad)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:380px){
  body{font-size:13px}
  #app{padding:6px 6px 56px}
  .res{min-width:64px}
}
</style>
</head>

  <header id="hdr"></header>

function eventById(id){ for(var i=0;i<EVENTS.length;i++){ if(EVENTS[i].id===id) return EVENTS[i]; } return null; }
/* ============================================================================
   SECTION 2 - PRNG, HELPERS, STATE CONSTRUCTION
   The PRNG state is a plain 32-bit integer held inside the game state, so the
   whole future of a game is a pure function of (state). The engine contains no
   call to the built-in random source anywhere - the Dev tests prove it by
   scanning this document's own source.
   ========================================================================== */
function rng(S){
  S.rngState = (S.rngState + 0x6D2B79F5) | 0;
  var t = S.rngState;
  t = Math.imul(t ^ (t >>> 15), 1 | t);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rint(S,a,b){ return a + Math.floor(rng(S)*(b-a+1)); }
function pick(S,arr){ return arr[Math.floor(rng(S)*arr.length)]; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function fmt(n,d){ d = (d===undefined)?1:d; var p=Math.pow(10,d); var v=Math.round(n*p)/p; return v.toFixed(d); }
function fmt1(n){ return fmt(n,1); }
function round4(n){ return Math.round(n*10000)/10000; }
function keysOf(o){ var k=[]; for(var x in o){ if(Object.prototype.hasOwnProperty.call(o,x)) k.push(x); } return k; }

function neighbors(i){
  var x = i % MAP_W, y = Math.floor(i / MAP_W), out = [];
  if(y>0) out.push(i-MAP_W);
  if(x>0) out.push(i-1);
  if(x<MAP_W-1) out.push(i+1);
  if(y<MAP_H-1) out.push(i+MAP_W);
  return out;
}
function tileName(t){ return '('+(t.x+1)+','+(t.y+1)+')'; }
function eachColonist(S,fn){ for(var i=0;i<S.colonists.length;i++) fn(S.colonists[i]); }
function workersOf(S,idx){ var o=[]; for(var i=0;i<S.colonists.length;i++){ if(S.colonists[i].assign===idx) o.push(S.colonists[i]); } return o; }
function builtTiles(S){ var o=[]; for(var i=0;i<TILES;i++){ if(S.map[i].b) o.push(S.map[i]); } return o; }
function unassignTile(S,idx){ eachColonist(S,function(c){ if(c.assign===idx) c.assign=null; }); }

/* ---- map generation: cluster growth from the seeded PRNG -------------- */
function genMap(S){
  var t = [], i;
  for(i=0;i<TILES;i++) t.push({i:i, x:i%MAP_W, y:Math.floor(i/MAP_W), terrain:'ash', b:null});
  function paint(kind, per, clusters){
    for(var c=0;c<clusters;c++){
      var open = [Math.floor(rng(S)*TILES)], placed = 0, guard = 0;
      while(placed<per && open.length && guard++<200){
        var k = open.splice(Math.floor(rng(S)*open.length),1)[0];
        if(t[k].terrain!=='ash') continue;
        t[k].terrain = kind; placed++;
        var ns = neighbors(k);
        for(var n=0;n<ns.length;n++){ if(t[ns[n]].terrain==='ash') open.push(ns[n]); }
      }
    }
  }
  paint('water',4,2); paint('rock',5,2); paint('vent',2,2); paint('ruins',3,2);
  /* guarantee a survivable start: minimum counts, and a clear centre tile */
  var mins = {water:2, rock:3, vent:2, ruins:2};
  for(var kind in mins){
    var have = 0;
    for(i=0;i<TILES;i++) if(t[i].terrain===kind) have++;
    var guard2 = 0;
    while(have<mins[kind] && guard2++<400){
      var k2 = Math.floor(rng(S)*TILES);
      if(t[k2].terrain==='ash' && k2!==27 && k2!==28){ t[k2].terrain=kind; have++; }
    }
  }
  t[27].terrain = 'ash';   /* the two starting shelters always have ground to stand on */
  t[28].terrain = 'ash';
  return t;
}

/* ---- colonists -------------------------------------------------------- */
function makeName(S){
  for(var tries=0; tries<40; tries++){
    var n = pick(S,FIRST_NAMES)+' '+pick(S,LAST_NAMES);
    var dup = false;
    for(var i=0;i<S.colonists.length;i++){ if(S.colonists[i].name===n) dup = true; }
    if(!dup) return n;
  }
  return 'Survivor '+(S.nextId+1);
}
function addColonist(S, job, skill){
  var c = {
    id: S.nextId++,
    name: '',
    job: job || JOB_IDS[rint(S,0,JOB_IDS.length-1)],
    skill: skill || rint(S,1,3),
    xp: 0,
    fatigue: rint(S,0,15),
    morale: 68 + rint(S,0,10),
    assign: null,
    zeroTurns: 0
  };
  c.name = makeName(S);
  S.colonists.push(c);
  return c;
}

function newState(seed){
  var S = {
    version: SAVE_VERSION,
    seed: seed|0,
    rngState: seed|0,
    turn: 0,
    over: null,              /* null | 'win' | 'ended' | 'lose' */
    score: null,
    res: {food:110, water:110, metal:95, power:30, parts:30, scrip:60, ash:40, ore:25, soil:30},
    nextId: 1,
    colonists: [],
    map: null,
    research: {done:[], active:null, progress:0},
    market: {drift:{}, nextCaravan:5, caravan:null},
    events: {cd:{}, lastFired:null},
    storm: {severity:0, activeThisTurn:false, next:STORM_INTERVAL},
    log: [],
    pending: null,           /* a paused choice event */
    resumeStep: 0,
    eventTarget: -1,
    repairsLeft: 0,
    overflow: {},
    needs: {foodRatio:1, waterRatio:1, foodNeed:0, waterNeed:0},
    flow: {in:{}, out:{}},   /* per-turn totals, for tooltips */
    stats: {storms:0, events:0, choices:0, migrants:0, departures:0, builds:0, overflowLost:0},
    mods: null, caps: null, housing: 0
  };
  S.map = genMap(S);
  for(var g=0; g<TRADE_GOODS.length; g++) S.market.drift[TRADE_GOODS[g]] = 0.9 + rng(S)*0.3;
  /* Starting crew. Weighted towards water and food, because that is what kills
     you first. The single Engineer is your only repair crew until you train
     another, which is exactly the tension the retraining cost is there for. */
  addColonist(S,'botanist',2); addColonist(S,'botanist',2); addColonist(S,'steward',2);
  addColonist(S,'steward',1);  addColonist(S,'gatherer',2); addColonist(S,'engineer',2);
  S.map[27].b = {type:'shelter', integrity:100, strained:false, report:null};
  S.map[28].b = {type:'shelter', integrity:100, strained:false, report:null};
  refresh(S);
  S.repairsLeft = repairCapacity(S);
  logMsg(S,'Turn 0. Six survivors, one shelter, and a mountain that will not stop exhaling.','info');
  logMsg(S,'Seed '+S.seed+'. Press End Turn (or Space) when the crew is assigned.','info');
  return S;
}

/* ---- derived values: research mods, caps, housing --------------------- */
function recomputeMods(S){
  var m = {out:{}, inp:{}, capAdd:{}, unlocked:{}, stormDmg:1, stormWater:1, stormMorale:1,
           foodUse:1, fatigueGain:1, restMult:1, tradeMargin:1, caravanFreq:0, caravanStock:1};
  for(var i=0;i<S.research.done.length;i++){
    var node = researchById(S.research.done[i]); if(!node) continue;
    var e = node.eff || {};
    if(e.out) for(var k in e.out) m.out[k] = (m.out[k]||1)*e.out[k];
    if(e.inp) for(var k2 in e.inp) m.inp[k2] = (m.inp[k2]||1)*e.inp[k2];
    if(e.capAdd) for(var k3 in e.capAdd) m.capAdd[k3] = (m.capAdd[k3]||0)+e.capAdd[k3];
    if(e.unlock) for(var u=0;u<e.unlock.length;u++) m.unlocked[e.unlock[u]] = true;
    if(e.stormDmg) m.stormDmg *= e.stormDmg;
    if(e.stormWater) m.stormWater *= e.stormWater;
    if(e.stormMorale) m.stormMorale *= e.stormMorale;
    if(e.foodUse) m.foodUse *= e.foodUse;
    if(e.fatigueGain) m.fatigueGain *= e.fatigueGain;
    if(e.restMult) m.restMult *= e.restMult;
    if(e.tradeMargin) m.tradeMargin *= e.tradeMargin;
    if(e.caravanFreq) m.caravanFreq += e.caravanFreq;
    if(e.caravanStock) m.caravanStock *= e.caravanStock;
  }
  S.mods = m;
}
function computeCaps(S){
  var caps = {};
  for(var i=0;i<RESOURCES.length;i++){ var r = RESOURCES[i]; caps[r] = BASE_CAP[r] + (S.mods.capAdd[r]||0); }
  var housing = 0;
  for(var t=0;t<TILES;t++){
    var b = S.map[t].b; if(!b) continue;
    var d = BUILDINGS[b.type];
    if(d.housing) housing += d.housing;
    if(d.capAdd && b.integrity >= 25){ for(var k in d.capAdd) caps[k] += d.capAdd[k]; }
  }
  S.caps = caps; S.housing = housing;
}
function refresh(S){ recomputeMods(S); computeCaps(S); }
function capOf(S,r){ return S.caps[r]; }

/* ---- resource plumbing ------------------------------------------------ */
function addRes(S, r, amt){
  if(amt<=0) return 0;
  var cap = S.caps[r];
  var before = S.res[r];
  var after = before + amt;
  S.flow.out[r] = (S.flow.out[r]||0) + amt;
  if(after > cap){
    var lost = after - cap;
    S.res[r] = cap;
    S.overflow[r] = (S.overflow[r]||0) + lost;
    return lost;
  }
  S.res[r] = after;
  return 0;
}
function takeRes(S, r, amt){
  var got = Math.min(S.res[r], amt);
  S.res[r] -= got;
  S.flow.in[r] = (S.flow.in[r]||0) + got;
  return got;
}
function canAfford(S, cost){
  for(var k in cost){ if(S.res[k] < cost[k]) return false; }
  return true;
}
function payCost(S, cost){ for(var k in cost) S.res[k] -= cost[k]; }
function costText(cost){
  var out = [];
  for(var k in cost) out.push(fmt(cost[k],0)+' '+RES_NAME[k].toLowerCase());
  return out.join(', ');
}

function logMsg(S, text, kind){
  S.log.push({t:S.turn, m:text, k:kind||'info'});
  if(S.log.length > MAX_LOG) S.log.splice(0, S.log.length - MAX_LOG);
}

/* ---- colonist effectiveness ------------------------------------------- */
function skillMult(sk){ return 0.5 + 0.15*sk; }                 /* 1 -> 0.65   5 -> 1.25 */
function moraleMult(mo){ return 0.4 + 0.6*(mo/100); }           /* 0 -> 0.40 100 -> 1.00 */
function fatigueMult(f){ return f<=60 ? 1 : Math.max(0.5, 1 - (f-60)/110); }
function eff(c){ return skillMult(c.skill) * moraleMult(c.morale) * fatigueMult(c.fatigue); }
function effText(c){
  return c.name+'\n  skill '+c.skill+'  x'+fmt(skillMult(c.skill),2)+
         '\n  morale '+fmt(c.morale,0)+'  x'+fmt(moraleMult(c.morale),2)+
         '\n  fatigue '+fmt(c.fatigue,0)+'  x'+fmt(fatigueMult(c.fatigue),2)+
         '\n  = effort '+fmt(eff(c),2);
}
function refusesWork(c){ return c.morale <= 0 && c.zeroTurns >= 1; }
function repairCapacity(S){
  var n = 0;
  eachColonist(S,function(c){ if(c.job==='engineer') n++; });
  return n;
}
/* ============================================================================
   SECTION 3 - SIMULATION. The twelve turn steps, in fixed order.
   ========================================================================== */

/* ---- building throughput --------------------------------------------- */
function adjBonus(S, tile){
  var d = BUILDINGS[tile.b.type], add = {}, lines = [];
  var list = d.adj || [];
  var ns = neighbors(tile.i);
  for(var a=0;a<list.length;a++){
    var e = list[a], count = 0;
    for(var n=0;n<ns.length;n++){ if(S.map[ns[n]].terrain === e.terrain) count++; }
    if(!count) continue;
    var used = e.flat ? 1 : Math.min(count, e.max);
    var amt = used * e.per;
    add[e.res] = (add[e.res]||0) + amt;
    lines.push('+'+fmt(amt,2)+' '+resLabel(e.res)+' per effort from '+used+' adjacent '+e.label+(used>1?'s':''));
  }
  return {add:add, lines:lines};
}
function resLabel(r){ return r==='research' ? 'research' : RES_NAME[r].toLowerCase(); }
/* Projected adjacency for a building type on an empty tile (used by the build menu). */
function previewAdj(S, idx, type){
  var d = BUILDINGS[type], list = d.adj||[], ns = neighbors(idx), lines = [];
  for(var a=0;a<list.length;a++){
    var e = list[a], count = 0;
    for(var n=0;n<ns.length;n++){ if(S.map[ns[n]].terrain === e.terrain) count++; }
    if(!count){ lines.push('no adjacent '+e.label+' (+0 '+resLabel(e.res)+')'); continue; }
    var used = e.flat ? 1 : Math.min(count, e.max);
    lines.push('+'+fmt(used*e.per,2)+' '+resLabel(e.res)+' per effort ('+used+' '+e.label+(used>1?'s':'')+' counted'+(count>used?', '+count+' present, cap '+e.max:'')+')');
  }
  return lines;
}
function damageTile(S, tile, amt){
  if(!tile.b) return;
  var before = tile.b.integrity;
  tile.b.integrity = clamp(before - amt, 0, 100);
  if(before >= 25 && tile.b.integrity < 25){
    logMsg(S, BUILDINGS[tile.b.type].name+' at '+tileName(tile)+' is DISABLED (integrity '+fmt(tile.b.integrity,0)+'%).','bad');
  }
  computeCaps(S);
}
function runBuilding(S, tile){
  var b = tile.b, d = BUILDINGS[b.type];
  var rep = {lines:[], head:'', ok:false};
  b.report = rep;
  var hasIO = (d.out && keysOf(d.out).length>0) || (d.inp && keysOf(d.inp).length>0) || !!d.passive;
  var crew = workersOf(S, tile.i);
  var W = 0, i, k;
  for(i=0;i<crew.length;i++) W += eff(crew[i]);
  if(b.type === 'messhall'){
    rep.head = crew.length ? 'Staffed. Serves meals during the consumption step.' : 'Unstaffed - no meals served.';
    rep.ok = crew.length > 0;
    return;
  }
  if(!hasIO){ rep.head = 'Passive structure. No crew, no throughput.'; rep.ok = true; return; }
  var integ = b.integrity >= 25 ? b.integrity/100 : 0;
  if(integ <= 0){ rep.head = 'DISABLED at '+fmt(b.integrity,0)+'% integrity - produces nothing until repaired.'; return; }
  /* passive throughput runs whether or not anyone is on shift */
  var passiveBits = [];
  if(d.passive){
    for(k in d.passive){
      var pAmt = d.passive[k] * integ * (S.mods.out[b.type] || 1);
      if(pAmt <= 0) continue;
      if(k === 'research') addResearch(S, pAmt); else addRes(S, k, pAmt);
      passiveBits.push(fmt(pAmt,1)+' '+resLabel(k));
      rep.lines.push('unattended: '+fmt(d.passive[k],2)+' '+resLabel(k)+
        (integ!==1?' x integrity '+fmt(integ*100,0)+'%':'')+' = '+fmt(pAmt,2));
      rep.ok = true;
    }
  }
  if(d.slots > 0 && W <= 0){
    rep.head = passiveBits.length ? (passiveBits.join(', ')+' per turn, unattended - crew it to go faster.')
                                  : 'No crew assigned - idle.';
    return;
  }
  var outMul = S.mods.out[b.type] || 1;
  var inpMul = S.mods.inp[b.type] || 1;
  var ab = adjBonus(S, tile);
  var need = {}, inp = d.inp || {};
  for(k in inp) need[k] = inp[k] * W * integ * inpMul;
  var scale = 1, limit = null;
  for(k in need){
    if(need[k] <= 0) continue;
    if(S.res[k] < need[k]){
      var r = need[k] > 0 ? S.res[k]/need[k] : 1;
      if(r < scale){ scale = r; limit = k; }
    }
  }
  if(scale < 0.001){
    rep.head = 'Starved of '+RES_NAME[limit].toLowerCase()+' - no output this turn.';
    return;
  }
  for(k in need){ if(need[k]>0) takeRes(S, k, need[k]*scale); }
  var outs = d.out || {}, headBits = [];
  for(k in outs){
    var per = outs[k] + (ab.add[k]||0);
    var amount = per * W * integ * outMul * scale;
    if(amount <= 0) continue;
    var lostTxt = '';
    if(k === 'research'){ addResearch(S, amount); }
    else {
      var lost = addRes(S, k, amount);
      if(lost > 0) lostTxt = '  [' + fmt(lost,1) + ' lost to full storage]';
    }
    headBits.push(fmt(amount,1)+' '+resLabel(k));
    rep.lines.push(
      cap1(resLabel(k))+': (base '+fmt(outs[k],2)+(ab.add[k]?' + adj '+fmt(ab.add[k],2):'')+')'+
      ' x crew '+fmt(W,2)+
      (outMul!==1?' x research '+fmt(outMul,2):'')+
      (integ!==1?' x integrity '+fmt(integ*100,0)+'%':'')+
      (scale!==1?' x supply '+fmt(scale*100,0)+'%':'')+
      ' = '+fmt(amount,2)+lostTxt);
  }
  for(k in need){
    if(need[k]<=0) continue;
    rep.lines.push('uses '+fmt(need[k]*scale,2)+' '+resLabel(k)+
      (inpMul!==1?' (research '+fmt(inpMul,2)+'x)':''));
  }
  for(i=0;i<ab.lines.length;i++) rep.lines.push('adjacency: '+ab.lines[i]);
  for(i=0;i<crew.length;i++) rep.lines.push('crew: '+crew[i].name+' effort '+fmt(eff(crew[i]),2));
  if(scale < 1) rep.lines.push('THROTTLED to '+fmt(scale*100,0)+'% - short of '+resLabel(limit)+'.');
  rep.head = headBits.length ? headBits.join(', ')+' per turn' : 'Running.';
  rep.ok = headBits.length > 0;
}
function addResearch(S, amt){
  if(S.research.active) S.research.progress += amt;
  else S.research.idleLab = (S.research.idleLab||0) + amt;
}
function cap1(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function staffedTiles(S, type){
  var o = [];
  for(var i=0;i<TILES;i++){
    var t = S.map[i];
    if(t.b && t.b.type===type && t.b.integrity>=25 && workersOf(S,i).length>0) o.push(t);
  }
  return o;
}
function countBuilt(S, type){
  var n = 0;
  for(var i=0;i<TILES;i++){ if(S.map[i].b && S.map[i].b.type===type && S.map[i].b.integrity>=25) n++; }
  return n;
}
function cisternMit(S){
  var m = Math.pow(0.9, countBuilt(S,'cistern'));
  return Math.max(0.7, m);
}
function baffleMit(S, tile){
  var m = 1;
  for(var i=0;i<TILES;i++){
    var t = S.map[i];
    if(!t.b || t.b.type!=='baffle' || t.b.integrity<25) continue;
    if(Math.max(Math.abs(t.x-tile.x), Math.abs(t.y-tile.y)) <= 2) m *= 0.75;
  }
  return Math.max(0.4, m);
}

/* ---- STEP 1: advance -------------------------------------------------- */
function stepAdvance(S){
  S.turn++;
  S.overflow = {};
  S.flow = {in:{}, out:{}};
  S.prevRes = {};
  for(var i=0;i<RESOURCES.length;i++) S.prevRes[RESOURCES[i]] = S.res[RESOURCES[i]];
  S.research.idleLab = 0;
  S.repairsLeft = repairCapacity(S);
  refresh(S);
}
/* ---- STEP 2: hazard --------------------------------------------------- */
function stepHazard(S){
  S.storm.activeThisTurn = false;
  if(S.turn % STORM_INTERVAL !== 0) return;
  var sev = 1 + Math.floor(S.turn/24) + (rng(S) < 0.3 ? 1 : 0);
  S.storm.activeThisTurn = true;
  S.storm.severity = sev;
  S.stats.storms++;
  logMsg(S,'ASHSTORM, severity '+sev+'. The sky comes down.','storm');
  var built = builtTiles(S), hit = 0, worst = 0;
  for(var i=0;i<built.length;i++){
    var t = built[i];
    var raw = rint(S,5,13) * sev;
    var mit = baffleMit(S,t) * S.mods.stormDmg;
    var dmg = raw * mit * (t.b.strained ? 2 : 1);
    if(t.b.strained) t.b.strained = false;
    dmg = Math.round(dmg);
    if(dmg > 0){ damageTile(S,t,dmg); hit++; if(dmg>worst) worst = dmg; }
  }
  var ash = 6*sev;
  addRes(S,'ash',ash);
  var mo = Math.round(4*sev*S.mods.stormMorale);
  eachColonist(S,function(c){ c.morale = clamp(c.morale - mo, 0, 100); });
  logMsg(S,'Storm damage to '+hit+' building(s), worst '+worst+'%. +'+ash+' ash, -'+mo+' morale, and water demand spikes.','storm');
}
/* ---- STEP 3: validate assignments ------------------------------------- */
function stepValidate(S){
  var used = {};
  for(var i=0;i<S.colonists.length;i++){
    var c = S.colonists[i];
    if(c.assign === null) continue;
    var t = S.map[c.assign];
    if(!t || !t.b){ c.assign = null; continue; }
    var d = BUILDINGS[t.b.type];
    if(!d.job || d.slots<=0){ c.assign = null; continue; }
    if(d.job !== c.job){
      logMsg(S,c.name+' is a '+JOBS[c.job].name+' and cannot work the '+d.name+'. Sent to rest.','warn');
      c.assign = null; continue;
    }
    if(refusesWork(c)){
      logMsg(S,c.name+' refuses to work - a second straight turn at zero morale.','bad');
      c.assign = null; continue;
    }
    used[c.assign] = (used[c.assign]||0) + 1;
    if(used[c.assign] > d.slots){
      logMsg(S,d.name+' at '+tileName(t)+' is over capacity; '+c.name+' stood down.','warn');
      c.assign = null;
      used[t.i]--;
    }
  }
}
/* ---- STEP 4: production ----------------------------------------------- */
function stepProduction(S){
  for(var o=0;o<BUILD_ORDER.length;o++){
    var type = BUILD_ORDER[o];
    for(var i=0;i<TILES;i++){
      var t = S.map[i];
      if(t.b && t.b.type === type) runBuilding(S,t);
    }
  }
  /* passive structures still get a report for the tooltip */
  for(var j=0;j<TILES;j++){
    var tt = S.map[j];
    if(tt.b && !tt.b.report) runBuilding(S,tt);
  }
}
/* ---- STEP 5: overflow ------------------------------------------------- */
function stepOverflow(S){
  var bits = [];
  for(var r in S.overflow){
    if(S.overflow[r] > 0.05){ bits.push(fmt(S.overflow[r],1)+' '+resLabel(r)); S.stats.overflowLost += S.overflow[r]; }
  }
  if(bits.length) logMsg(S,'Storage full: lost '+bits.join(', ')+'. Build Depots or Cisterns.','warn');
}
/* ---- STEP 6: consumption ---------------------------------------------- */
function stepConsume(S){
  var pop = S.colonists.length;
  var foodNeed = pop * FOOD_PER_HEAD * S.mods.foodUse;
  var waterMul = 1;
  if(S.storm.activeThisTurn){
    var spike = 0.6 * S.storm.severity;
    waterMul = 1 + spike * cisternMit(S) * S.mods.stormWater;
  }
  var waterNeed = pop * WATER_PER_HEAD * waterMul;
  var gotF = takeRes(S,'food',foodNeed);
  var gotW = takeRes(S,'water',waterNeed);
  var fr = foodNeed > 0 ? gotF/foodNeed : 1;
  var wr = waterNeed > 0 ? gotW/waterNeed : 1;
  var messActive = false, messExtra = 0;
  if(staffedTiles(S,'messhall').length > 0 && fr >= 1){
    messExtra = pop * 0.3;
    if(S.res.food >= messExtra){ takeRes(S,'food',messExtra); messActive = true; }
  }
  S.needs = {foodRatio:fr, waterRatio:wr, foodNeed:foodNeed, waterNeed:waterNeed,
             waterMul:waterMul, messActive:messActive, messExtra:messActive?messExtra:0};
  if(fr < 0.999) logMsg(S,'FOOD SHORTAGE: only '+fmt(fr*100,0)+'% of the ration met ('+fmt(gotF,1)+' of '+fmt(foodNeed,1)+').','bad');
  if(wr < 0.999) logMsg(S,'WATER SHORTAGE: only '+fmt(wr*100,0)+'% of demand met ('+fmt(gotW,1)+' of '+fmt(waterNeed,1)+').','bad');
  if(S.storm.activeThisTurn) logMsg(S,'Storm water demand x'+fmt(waterMul,2)+' this turn.','storm');
}
/* ---- STEP 7: morale, fatigue, skill ----------------------------------- */
var XP_NEED = [8,18,34,60];
function stepPeople(S){
  var pop = S.colonists.length;
  var n = S.needs;
  for(var i=0;i<S.colonists.length;i++){
    var c = S.colonists[i];
    var d = 0, why = [];
    if(n.foodRatio >= 0.999){ d += 3; why.push('fed +3'); }
    else { var p = (1-n.foodRatio)*15; d -= p; why.push('hungry -'+fmt(p,1)); }
    if(n.waterRatio >= 0.999){ d += 3; why.push('watered +3'); }
    else { var p2 = (1-n.waterRatio)*15; d -= p2; why.push('thirsty -'+fmt(p2,1)); }
    if(pop > S.housing){ d -= 5; why.push('crowded -5'); }
    if(n.messActive){ d += 5; why.push('mess hall +5'); }
    if(c.assign === null){
      d += 4; why.push('rested +4');
      c.fatigue = clamp(c.fatigue - 22*S.mods.restMult, 0, 100);
    } else {
      c.fatigue = clamp(c.fatigue + 8*S.mods.fatigueGain, 0, 100);
      var t = S.map[c.assign];
      if(t && t.b && t.b.report && t.b.report.ok){
        c.xp += 1;
        if(c.skill < 5 && c.xp >= XP_NEED[c.skill-1]){
          c.xp = 0; c.skill++;
          logMsg(S,c.name+' is now skill '+c.skill+' as a '+JOBS[c.job].name+'.','good');
        }
      }
    }
    if(c.fatigue > 80){ d -= 3; why.push('exhausted -3'); }
    c.morale = clamp(c.morale + d, 0, 100);
    c.lastMorale = why.join(', ');
    if(c.morale <= 0) c.zeroTurns++; else c.zeroTurns = 0;
  }
}
/* ---- STEP 8: research completion -------------------------------------- */
function stepResearch(S){
  if(!S.research.active) return;
  var node = researchById(S.research.active);
  if(!node) { S.research.active = null; return; }
  if(S.research.progress >= node.effort){
    S.research.done.push(node.id);
    S.research.active = null;
    S.research.progress = 0;
    refresh(S);
    logMsg(S,'RESEARCH COMPLETE: '+node.name+'. '+node.text,'good');
  }
}
/* ---- STEP 9: market drift and caravans -------------------------------- */
function stepMarket(S){
  for(var g=0; g<TRADE_GOODS.length; g++){
    var k = TRADE_GOODS[g];
    S.market.drift[k] = clamp(S.market.drift[k] * (1 + (rng(S)-0.5)*0.12), 0.55, 1.8);
  }
  if(S.market.caravan){
    S.market.caravan.turnsLeft--;
    if(S.market.caravan.turnsLeft <= 0){
      S.market.caravan = null;
      logMsg(S,'The caravan packs up and rolls out.','trade');
    }
    return;
  }
  if(S.turn >= S.market.nextCaravan){
    var stock = {}, any = 0;
    for(var i=0;i<TRADE_GOODS.length;i++){
      var good = TRADE_GOODS[i];
      var q = rng(S) < 0.25 ? 0 : Math.round(rint(S,6,26) * S.mods.caravanStock);
      stock[good] = q; any += q;
    }
    if(any === 0) stock.food = 10;
    S.market.caravan = {stock:stock, scrip:rint(S,90,220), turnsLeft:3};
    var gap = Math.max(4, rint(S,6,9) + S.mods.caravanFreq);
    S.market.nextCaravan = S.turn + 3 + gap;
    logMsg(S,'A caravan rolls in with '+fmt(S.market.caravan.scrip,0)+' scrip to spend. Three turns before it leaves.','trade');
  }
}
/* ---- STEP 10: events -------------------------------------------------- */
function stepEvents(S){
  if(S.storm.activeThisTurn) return;      /* the storm IS the event this turn */
  if(S.turn < 2) return;
  if(rng(S) > 0.42) return;
  var deck = [], total = 0;
  for(var i=0;i<EVENTS.length;i++){
    var e = EVENTS[i];
    if((S.events.cd[e.id]||0) > S.turn) continue;
    if(e.min && S.turn < e.min) continue;
    if(e.need && !e.need(S)) continue;
    deck.push(e); total += e.weight;
  }
  if(!deck.length) return;
  var roll = rng(S)*total, acc = 0, chosen = deck[deck.length-1];
  for(var j=0;j<deck.length;j++){ acc += deck[j].weight; if(roll < acc){ chosen = deck[j]; break; } }
  S.events.cd[chosen.id] = S.turn + chosen.cd;
  S.events.lastFired = chosen.id;
  S.stats.events++;
  if(chosen.prep) chosen.prep(S);
  var body = chosen.text(S);
  if(chosen.choices){
    S.pending = {id:chosen.id, name:chosen.name, text:body};
    logMsg(S,'EVENT: '+chosen.name+' - '+body,'event');
  } else {
    var result = chosen.apply(S);
    logMsg(S,'EVENT: '+chosen.name+' - '+body+' '+result,'event');
  }
}
function applyChoice(S, idx){
  if(!S.pending) return;
  var e = eventById(S.pending.id);
  var ch = e.choices[clamp(idx,0,e.choices.length-1)];
  var result = ch.apply(S);
  logMsg(S,'  -> '+ch.label+': '+result,'event');
  S.pending = null;
  S.stats.choices++;
  refresh(S);
}
/* ---- STEP 11: migration and departures -------------------------------- */
function stepPopulation(S){
  /* At most one colonist leaves per turn, and only after four straight turns at
     zero morale. A bad patch is survivable if you fix it; ignoring it is not. */
  var worst = -1, worstIdx = -1;
  for(var i=0;i<S.colonists.length;i++){
    if(S.colonists[i].zeroTurns >= 4 && S.colonists[i].zeroTurns > worst){
      worst = S.colonists[i].zeroTurns; worstIdx = i;
    }
  }
  if(worstIdx >= 0){
    var gone = S.colonists.splice(worstIdx,1)[0];
    S.stats.departures++;
    logMsg(S,gone.name+' walked out into the ash. Four turns at zero morale was three too many.','bad');
  }
  if(!S.colonists.length) return;
  var sum = 0;
  eachColonist(S,function(c){ sum += c.morale; });
  var avg = sum / S.colonists.length;
  S.avgMorale = avg;
  /* Nobody signs on at an outpost that is visibly running dry: arrivals need a
     spare bunk, met needs, a real stockpile and a non-negative water balance. */
  var netWater = (S.flow.out.water||0) - (S.flow.in.water||0);
  var netFood = (S.flow.out.food||0) - (S.flow.in.food||0);
  if(S.colonists.length < S.housing && avg >= 56 && S.res.food >= 40 && S.res.water >= 40 &&
     S.needs.foodRatio >= 0.999 && S.needs.waterRatio >= 0.999 && netWater >= 1 && netFood >= 1){
    if(rng(S) < 0.22){
      /* word gets around about which outpost is hiring: half of all arrivals
         turn up already trained for whatever you are short of */
      var want = rng(S) < 0.65 ? jobNeed(S) : null;
      var c2 = addColonist(S, want, rint(S,1,3));
      S.stats.migrants++;
      logMsg(S,c2.name+' arrives looking for a bunk and work. ('+JOBS[c2.job].name+', skill '+c2.skill+')','good');
    }
  }
}
/* ---- STEP 12: end conditions ------------------------------------------ */
function computeScore(S){
  var stock = 0;
  for(var i=0;i<RESOURCES.length;i++){
    var r = RESOURCES[i];
    stock += S.res[r] * (r==='scrip' ? 0.4 : (r==='parts' ? 1.4 : 1));
  }
  var parts = {
    population: S.colonists.length * 40,
    research: S.research.done.length * 25,
    stockpiles: Math.round(stock/8),
    survival: S.turn * 3,
    victory: S.over === 'win' ? 250 : 0
  };
  var total = 0;
  for(var k in parts) total += parts[k];
  parts.total = total;
  return parts;
}
function stepEnd(S){
  if(S.colonists.length === 0){
    S.over = 'lose';
    S.score = computeScore(S);
    logMsg(S,'The last colonist is gone. ASHFALL OUTPOST is dead at turn '+S.turn+'.','bad');
    return;
  }
  if(S.sandbox) return;   /* benchmark mode: run past turn 60 to stress the economy */
  if(S.turn >= WIN_TURN){
    var needsMet = S.needs.foodRatio >= 0.999 && S.needs.waterRatio >= 0.999;
    var zero = false;
    eachColonist(S,function(c){ if(c.morale <= 0) zero = true; });
    var pop = S.colonists.length;
    if(pop >= WIN_POP && needsMet && !zero){
      S.over = 'win';
      logMsg(S,'TURN '+WIN_TURN+': '+pop+' colonists, fed and watered. The outpost holds. YOU WIN.','good');
    } else {
      S.over = 'ended';
      logMsg(S,'TURN '+WIN_TURN+': the outpost survives with '+pop+' colonists, but the win bar ('+WIN_POP+
        ' colonists, all needs met) was not cleared.','warn');
    }
    S.score = computeScore(S);
    return;
  }
  if((S.turn+1) % STORM_INTERVAL === 0){
    logMsg(S,'The barometer is falling. ASHSTORM EXPECTED NEXT TURN - repair what matters and bank water.','warn');
  }
}

var STEPS = [
  ['1 advance turn', stepAdvance],
  ['2 hazard (ashstorm)', stepHazard],
  ['3 validate assignments', stepValidate],
  ['4 production and chains', stepProduction],
  ['5 storage overflow', stepOverflow],
  ['6 consumption', stepConsume],
  ['7 morale, fatigue, skill', stepPeople],
  ['8 research completion', stepResearch],
  ['9 market drift and caravans', stepMarket],
  ['10 event deck', stepEvents],
  ['11 migration and departures', stepPopulation],
  ['12 end conditions', stepEnd]
];
/* Runs the turn. If a choice event fires and no autoChoice policy is supplied,
   the turn parks at S.resumeStep until the player answers. */
function runTurn(S, autoChoice){
  if(S.over) return {blocked:false, over:true};
  var i = S.resumeStep || 0;
  for(; i<STEPS.length; i++){
    STEPS[i][1](S);
    if(S.pending){
      if(autoChoice){ applyChoice(S, autoChoice(S, S.pending)); }
      else { S.resumeStep = i+1; return {blocked:true, over:false}; }
    }
  }
  S.resumeStep = 0;
  return {blocked:false, over:!!S.over};
}
/* ============================================================================
   SECTION 4 - PLAYER ACTIONS (all pure state mutations, all reusable by the
   headless benchmark policy)
   ========================================================================== */
function isUnlocked(S, type){
  var d = BUILDINGS[type];
  return !d.needs || S.mods.unlocked[type] === true;
}
function buildBlocker(S, idx, type){
  var t = S.map[idx], d = BUILDINGS[type];
  if(!t) return 'No such tile.';
  if(t.b) return 'Tile already holds a '+BUILDINGS[t.b.type].name+'.';
  if(d.terrain.indexOf(t.terrain) < 0) return 'Needs '+d.terrain.map(function(x){ return TERRAIN[x].name; }).join(' / ')+' - this is '+TERRAIN[t.terrain].name+'.';
  if(!isUnlocked(S,type)) return 'Locked: research '+researchById(d.needs).name+'.';
  if(!canAfford(S,d.cost)) return 'Cannot afford '+costText(d.cost)+'.';
  return null;
}
function buildAt(S, idx, type){
  var blocked = buildBlocker(S,idx,type);
  if(blocked) return {ok:false, msg:blocked};
  var d = BUILDINGS[type];
  payCost(S,d.cost);
  S.map[idx].b = {type:type, integrity:100, strained:false, report:null};
  S.stats.builds++;
  refresh(S);
  logMsg(S,'Built '+d.name+' at '+tileName(S.map[idx])+' for '+costText(d.cost)+'.','good');
  return {ok:true, msg:'Built '+d.name+'.'};
}
function demolish(S, idx){
  var t = S.map[idx];
  if(!t.b) return {ok:false, msg:'Nothing there.'};
  var d = BUILDINGS[t.b.type], refund = {};
  for(var k in d.cost){ refund[k] = Math.floor(d.cost[k]*0.5); }
  unassignTile(S,idx);
  t.b = null;
  for(var r in refund) addRes(S,r,refund[r]);
  refresh(S);
  logMsg(S,'Demolished '+d.name+' at '+tileName(t)+'. Salvaged '+costText(refund)+'.','warn');
  return {ok:true, msg:'Demolished.'};
}
function assignColonist(S, id, idx){
  var c = null;
  for(var i=0;i<S.colonists.length;i++){ if(S.colonists[i].id===id) c = S.colonists[i]; }
  if(!c) return {ok:false, msg:'No such colonist.'};
  if(idx === null || idx === undefined || idx < 0){ c.assign = null; return {ok:true, msg:c.name+' is resting.'}; }
  var t = S.map[idx];
  if(!t || !t.b) return {ok:false, msg:'No building there.'};
  var d = BUILDINGS[t.b.type];
  if(!d.job || d.slots<=0) return {ok:false, msg:d.name+' takes no crew.'};
  if(d.job !== c.job) return {ok:false, msg:d.name+' needs a '+JOBS[d.job].name+'; '+c.name+' is a '+JOBS[c.job].name+'.'};
  if(refusesWork(c)) return {ok:false, msg:c.name+' is at zero morale and refuses to work.'};
  var crew = workersOf(S,idx).filter(function(x){ return x.id !== c.id; });
  if(crew.length >= d.slots) return {ok:false, msg:d.name+' is full ('+d.slots+' slots).'};
  c.assign = idx;
  return {ok:true, msg:c.name+' assigned to '+d.name+' '+tileName(t)+'.'};
}
/* A building whose every output already sits at storage cap is not worth
   crewing - the entire shift would go straight into the overflow log. */
function outputsFull(S, type){
  var d = BUILDINGS[type], any = false;
  for(var k in (d.out||{})){
    if(k === 'research') return !S.research.active;
    any = true;
    if(S.res[k] < S.caps[k]*0.98) return false;
  }
  return any;
}
/* How badly the colony wants what this building makes, right now. Scarcity of
   the output (1 - stock/cap) times how much it matters times the rate. This is
   what makes AUTO-ASSIGN adaptive: gatherers move to the Salvage Yard when
   metal runs low and back to the Ash Collector when the composters go hungry. */
var RES_WEIGHT = {food:3.0, water:3.2, power:1.6, metal:2.0, parts:2.0, scrip:0.8,
                  ash:1.2, ore:1.0, soil:1.5, research:1.3};
function buildingNeedScore(S, type){
  var d = BUILDINGS[type], score = 0, n = 0, k;
  for(k in (d.out||{})){
    n++;
    var scarcity = (k === 'research')
      ? (S.research.active ? 1 : 0)
      : (1 - clamp(S.res[k]/S.caps[k], 0, 1));
    score += (RES_WEIGHT[k]||1) * scarcity * d.out[k];
  }
  if(type === 'messhall') return S.needs.foodRatio >= 0.999 && S.res.food > 40 ? 1.2 : 0;
  return n ? score : 0;
}
function autoAssign(S){
  var moved = 0, guard = 0;
  while(guard++ < 120){
    var bestTile = -1, bestScore = 0.05, bestCol = null;
    for(var j=0;j<TILES;j++){
      var t = S.map[j];
      if(!t.b || t.b.integrity < 25) continue;
      var d = BUILDINGS[t.b.type];
      if(!d.job || !d.slots) continue;
      if(workersOf(S,j).length >= d.slots) continue;
      var sc = buildingNeedScore(S, t.b.type);
      if(sc <= 0.05) continue;
      var ab = adjBonus(S,t);
      for(var k in ab.add) sc += 0.15 * ab.add[k];
      sc *= (t.b.integrity/100);
      var cand = null;
      for(var i=0;i<S.colonists.length;i++){
        var c = S.colonists[i];
        if(c.assign !== null || c.job !== d.job || c.morale <= 0 || c.fatigue >= 80) continue;
        if(!cand || c.skill > cand.skill) cand = c;
      }
      if(!cand) continue;
      if(sc > bestScore){ bestScore = sc; bestTile = j; bestCol = cand; }
    }
    if(bestTile < 0) break;
    bestCol.assign = bestTile; moved++;
  }
  return moved;
}
/* Which job the colony is actually short of right now: pressure first (is anyone
   thirsty? hungry?), then whatever has open slots. Used by the greedy policy,
   by migrant arrivals, and shown to the player on the People tab. */
function jobNeed(S){
  var open = {}, i, j;
  for(i=0;i<JOB_IDS.length;i++) open[JOB_IDS[i]] = 0;
  for(i=0;i<TILES;i++){
    var t = S.map[i];
    if(!t.b || t.b.integrity < 25) continue;
    var d = BUILDINGS[t.b.type];
    if(!d.job || !d.slots) continue;
    if(outputsFull(S, t.b.type)) continue;
    open[d.job] += Math.max(0, d.slots - workersOf(S,i).length);
  }
  var order = [];
  if(S.needs.waterRatio < 0.999 || S.res.water < 35) order.push('steward');
  if(S.needs.foodRatio < 0.999 || S.res.food < 35) order.push('botanist');
  if(S.res.parts < 10 || S.res.metal < 15) order.push('gatherer');
  if(S.res.power < 15) order.push('engineer');
  order.push('botanist','steward','gatherer','engineer');
  for(j=0;j<order.length;j++){ if(open[order[j]] > 0) return order[j]; }
  return null;
}
/* Retraining: the only way to fix a job mix that does not match your buildings.
   It is deliberately expensive - you lose every point of skill they had. */
function retrain(S, id, job){
  var c = null;
  for(var i=0;i<S.colonists.length;i++){ if(S.colonists[i].id === id) c = S.colonists[i]; }
  if(!c) return {ok:false, msg:'No such colonist.'};
  if(!JOBS[job]) return {ok:false, msg:'No such job.'};
  if(c.job === job) return {ok:false, msg:c.name+' already works as a '+JOBS[job].name+'.'};
  if(S.res.scrip < RETRAIN_COST) return {ok:false, msg:'Retraining costs '+RETRAIN_COST+' scrip; you have '+fmt(S.res.scrip,0)+'.'};
  S.res.scrip -= RETRAIN_COST;
  var was = JOBS[c.job].name, wasSkill = c.skill;
  c.job = job; c.skill = 1; c.xp = 0; c.assign = null;
  c.fatigue = clamp(c.fatigue + 10, 0, 100);
  c.morale = clamp(c.morale - 3, 0, 100);
  logMsg(S,c.name+' retrained from '+was+' (skill '+wasSkill+') to '+JOBS[job].name+' at skill 1, for '+RETRAIN_COST+' scrip.','warn');
  return {ok:true, msg:c.name+' is now a '+JOBS[job].name+' at skill 1.'};
}
function restAll(S){
  var n = 0;
  eachColonist(S,function(c){ if(c.assign!==null){ c.assign = null; n++; } });
  return n;
}
function repairCost(tile){ return Math.max(1, Math.ceil((100 - tile.b.integrity)/20)); }
function repairTile(S, idx){
  var t = S.map[idx];
  if(!t.b) return {ok:false, msg:'Nothing to repair.'};
  if(t.b.integrity >= 100) return {ok:false, msg:'Already at 100%.'};
  if(S.repairsLeft <= 0) return {ok:false, msg:'No repair crews left this turn (1 per Engineer).'};
  var cost = repairCost(t);
  if(S.res.parts < cost) return {ok:false, msg:'Needs '+cost+' parts, you have '+fmt(S.res.parts,1)+'.'};
  var best = null;
  eachColonist(S,function(c){ if(c.job==='engineer' && (!best || c.fatigue < best.fatigue)) best = c; });
  if(!best) return {ok:false, msg:'No Engineer in the colony.'};
  S.res.parts -= cost;
  t.b.integrity = 100;
  t.b.strained = false;
  S.repairsLeft--;
  best.fatigue = clamp(best.fatigue + 8, 0, 100);
  computeCaps(S);
  logMsg(S,best.name+' repaired the '+BUILDINGS[t.b.type].name+' at '+tileName(t)+' for '+cost+' parts (+8 fatigue).','good');
  return {ok:true, msg:'Repaired for '+cost+' parts.'};
}
function researchState(S, node){
  if(S.research.done.indexOf(node.id) >= 0) return 'done';
  if(S.research.active === node.id) return 'active';
  for(var i=0;i<node.pre.length;i++){ if(S.research.done.indexOf(node.pre[i]) < 0) return 'locked'; }
  return 'ready';
}
function startResearch(S, id){
  var node = researchById(id);
  if(!node) return {ok:false, msg:'Unknown node.'};
  var st = researchState(S,node);
  if(st === 'done') return {ok:false, msg:'Already researched.'};
  if(st === 'active') return {ok:false, msg:'Already in progress.'};
  if(st === 'locked'){
    var miss = node.pre.filter(function(p){ return S.research.done.indexOf(p) < 0; })
                       .map(function(p){ return researchById(p).name; });
    return {ok:false, msg:'Prerequisite not met: '+miss.join(', ')+'.'};
  }
  if(S.research.active) return {ok:false, msg:'Finish '+researchById(S.research.active).name+' first.'};
  if(!canAfford(S,node.cost)) return {ok:false, msg:'Needs '+costText(node.cost)+'.'};
  payCost(S,node.cost);
  S.research.active = id;
  S.research.progress = 0;
  logMsg(S,'Research started: '+node.name+' ('+costText(node.cost)+', '+node.effort+' lab-effort). Staff a Research Lab to finish it.','info');
  return {ok:true, msg:'Started '+node.name+'.'};
}
function cancelResearch(S){
  if(!S.research.active) return {ok:false, msg:'Nothing active.'};
  var node = researchById(S.research.active);
  var back = {};
  for(var k in node.cost) back[k] = Math.floor(node.cost[k]*0.5);
  for(var r in back) addRes(S,r,back[r]);
  S.research.active = null; S.research.progress = 0;
  logMsg(S,'Research on '+node.name+' abandoned. Half the outlay recovered: '+costText(back)+'.','warn');
  return {ok:true, msg:'Cancelled.'};
}
function labEffort(S){
  var e = 0;
  for(var i=0;i<TILES;i++){
    var t = S.map[i];
    if(!t.b || t.b.type !== 'lab' || t.b.integrity < 25) continue;
    var integ = t.b.integrity/100;
    e += (BUILDINGS.lab.passive.research||0) * integ;
    var crew = workersOf(S,i), W = 0;
    for(var c=0;c<crew.length;c++) W += eff(crew[c]);
    if(W > 0){
      var ab = adjBonus(S,t);
      e += (BUILDINGS.lab.out.research + (ab.add.research||0)) * W * integ;
    }
  }
  return e;
}

/* ---- trade ------------------------------------------------------------ */
function stockRatio(S,g){ return clamp(S.res[g]/S.caps[g], 0, 1); }
function hasTradePost(S){ return staffedTiles(S,'tradepost').length > 0; }
function priceBuy(S,g){
  var base = BASE_PRICE[g] * S.market.drift[g];
  var demand = 1 + 0.45*(1 - stockRatio(S,g));
  var post = hasTradePost(S) ? 0.94 : 1;
  return Math.max(0.5, Math.round(base*demand*S.mods.tradeMargin*post*10)/10);
}
function priceSell(S,g){
  var base = BASE_PRICE[g] * S.market.drift[g];
  var glut = 0.62 - 0.18*stockRatio(S,g);
  var post = hasTradePost(S) ? 1.06 : 1;
  return Math.max(0.2, Math.round(base*glut/S.mods.tradeMargin*post*10)/10);
}
function priceWhy(S,g,side){
  var sr = stockRatio(S,g);
  var lines = ['base '+fmt(BASE_PRICE[g],2)+' scrip',
               'global drift x'+fmt(S.market.drift[g],2)+' (random walk, drifts every turn)'];
  if(side==='buy') lines.push('your stock '+fmt(sr*100,0)+'% of cap -> demand x'+fmt(1+0.45*(1-sr),2)+' (they charge more when you are short)');
  else lines.push('your stock '+fmt(sr*100,0)+'% of cap -> glut x'+fmt(0.62-0.18*sr,2)+' (they pay less when you are sitting on plenty)');
  if(S.mods.tradeMargin !== 1) lines.push('Caravan Contracts x'+fmt(side==='buy'?S.mods.tradeMargin:1/S.mods.tradeMargin,2));
  if(hasTradePost(S)) lines.push('staffed Trade Post '+(side==='buy'?'x0.94':'x1.06'));
  lines.push('= '+fmt(side==='buy'?priceBuy(S,g):priceSell(S,g),2)+' scrip each');
  return lines.join('\n');
}
function tradeBuy(S, g, qty){
  var car = S.market.caravan;
  if(!car) return {ok:false, msg:'No caravan here.'};
  var price = priceBuy(S,g);
  var space = Math.floor(S.caps[g] - S.res[g]);
  var affordable = Math.floor(S.res.scrip / price);
  var q = Math.min(qty, car.stock[g]||0, space, affordable);
  if(q <= 0){
    if((car.stock[g]||0) <= 0) return {ok:false, msg:'The caravan has no '+resLabel(g)+' left.'};
    if(space <= 0) return {ok:false, msg:'No storage space for more '+resLabel(g)+'.'};
    return {ok:false, msg:'Not enough scrip ('+fmt(price,1)+' each).'};
  }
  var cost = Math.ceil(price*q);
  if(cost > S.res.scrip) cost = Math.floor(S.res.scrip);
  S.res.scrip -= cost;
  car.scrip += cost;
  car.stock[g] -= q;
  addRes(S,g,q);
  logMsg(S,'Bought '+q+' '+resLabel(g)+' for '+cost+' scrip ('+fmt(price,1)+' each).','trade');
  return {ok:true, msg:'Bought '+q+' '+resLabel(g)+'.'};
}
function tradeSell(S, g, qty){
  var car = S.market.caravan;
  if(!car) return {ok:false, msg:'No caravan here.'};
  var price = priceSell(S,g);
  var affordable = price > 0 ? Math.floor(car.scrip / price) : 0;
  var q = Math.min(qty, Math.floor(S.res[g]), affordable);
  if(q <= 0){
    if(Math.floor(S.res[g]) <= 0) return {ok:false, msg:'You have no '+resLabel(g)+' to sell.'};
    return {ok:false, msg:'The caravan is out of scrip.'};
  }
  var pay = Math.floor(price*q);
  if(pay > car.scrip) pay = Math.floor(car.scrip);
  S.res[g] -= q;
  car.scrip -= pay;
  car.stock[g] = (car.stock[g]||0) + q;
  addRes(S,'scrip',pay);
  logMsg(S,'Sold '+q+' '+resLabel(g)+' for '+pay+' scrip ('+fmt(price,1)+' each).','trade');
  return {ok:true, msg:'Sold '+q+' '+resLabel(g)+'.'};
}
/* ============================================================================
   SECTION 5 - CANONICAL SERIALISATION, STATE HASH, SAVE / LOAD
   packState() strips everything derived (mods, caps, per-turn reports) so that
   pack -> JSON -> parse -> unpack -> pack is a fixed point, which is what makes
   the save/load round-trip hash test meaningful.

   It deliberately does NOT round: JSON round-trips doubles exactly, and an
   earlier version that rounded to 4dp restored a state whose hash matched but
   whose FUTURE diverged, because the market drift walk amplified the lost bits.
   Rounding belongs in canon() - the hash view - and nowhere else.
   ========================================================================== */
function packState(S){
  var o = {
    version: SAVE_VERSION,
    seed: S.seed, rngState: S.rngState, turn: S.turn,
    over: S.over, score: S.score, nextId: S.nextId,
    res: {}, colonists: [], map: [],
    research: {done: S.research.done.slice(), active: S.research.active,
               progress: S.research.active ? S.research.progress : 0},
    stats: {storms:S.stats.storms, events:S.stats.events, choices:S.stats.choices,
            migrants:S.stats.migrants, departures:S.stats.departures, builds:S.stats.builds,
            overflowLost:S.stats.overflowLost},
    market: {drift:{}, nextCaravan:S.market.nextCaravan, caravan:null},
    events: {cd:{}, lastFired:S.events.lastFired},
    storm: {severity:S.storm.severity, activeThisTurn:S.storm.activeThisTurn, next:S.storm.next},
    needs: {foodRatio:S.needs.foodRatio, waterRatio:S.needs.waterRatio,
            foodNeed:S.needs.foodNeed, waterNeed:S.needs.waterNeed,
            waterMul:S.needs.waterMul||1, messActive:!!S.needs.messActive,
            messExtra:S.needs.messExtra||0},
    pending: S.pending ? {id:S.pending.id, name:S.pending.name, text:S.pending.text} : null,
    resumeStep: S.resumeStep, eventTarget: S.eventTarget, repairsLeft: S.repairsLeft,
    log: S.log.slice(-150)
  };
  for(var i=0;i<RESOURCES.length;i++){ var r = RESOURCES[i]; o.res[r] = S.res[r]; }
  for(var c=0;c<S.colonists.length;c++){
    var k = S.colonists[c];
    o.colonists.push({id:k.id, name:k.name, job:k.job, skill:k.skill, xp:k.xp,
      fatigue:k.fatigue, morale:k.morale, assign:(k.assign===null?-1:k.assign), zeroTurns:k.zeroTurns});
  }
  for(var t=0;t<TILES;t++){
    var tile = S.map[t];
    o.map.push({t:tile.terrain, b: tile.b ? {y:tile.b.type, i:tile.b.integrity, s:!!tile.b.strained} : null});
  }
  for(var g=0;g<TRADE_GOODS.length;g++) o.market.drift[TRADE_GOODS[g]] = S.market.drift[TRADE_GOODS[g]];
  if(S.market.caravan){
    var cs = {};
    for(var q=0;q<TRADE_GOODS.length;q++) cs[TRADE_GOODS[q]] = S.market.caravan.stock[TRADE_GOODS[q]]||0;
    o.market.caravan = {stock:cs, scrip:S.market.caravan.scrip, turnsLeft:S.market.caravan.turnsLeft};
  }
  var ids = keysOf(S.events.cd).sort();
  for(var e=0;e<ids.length;e++){ if(S.events.cd[ids[e]] > S.turn) o.events.cd[ids[e]] = S.events.cd[ids[e]]; }
  return o;
}
function canon(v){
  if(v === null || v === undefined) return 'null';
  var t = typeof v;
  if(t === 'number') return isFinite(v) ? String(round4(v)) : '0';
  if(t === 'boolean') return v ? 'true' : 'false';
  if(t === 'string') return JSON.stringify(v);
  if(Object.prototype.toString.call(v) === '[object Array]'){
    var a = [];
    for(var i=0;i<v.length;i++) a.push(canon(v[i]));
    return '['+a.join(',')+']';
  }
  var ks = keysOf(v).sort(), o = [];
  for(var j=0;j<ks.length;j++){
    if(v[ks[j]] === undefined) continue;
    o.push(JSON.stringify(ks[j])+':'+canon(v[ks[j]]));
  }
  return '{'+o.join(',')+'}';
}
function fnv1a(str){
  var h = 0x811c9dc5;
  for(var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return ('00000000' + ((h>>>0).toString(16))).slice(-8);

    var back = loadFromText(txt);
    ok('Save/load round-trips to an identical state hash',
       back.ok && hashState(back.state) === h1, back.ok ? (h1+' -> '+hashState(back.state)) : back.msg);
    var same = back.ok && canon(packState(back.state)) === canon(packState(S));
    ok('Save/load round-trips byte-for-byte in canonical form', same, same ? 'canonical forms match' : 'canonical forms differ');
    ok('Bad JSON is rejected with a clear message', loadFromText('{not json').ok === false, loadFromText('{not json').msg);
    var badv = JSON.parse(txt); badv.version = 999;
    ok('A save from another version is rejected', loadFromText(JSON.stringify(badv)).ok === false,
       loadFromText(JSON.stringify(badv)).msg);
    var badb = JSON.parse(txt); badb.map[0] = {t:'ash', b:{y:'deathray', i:100, s:false}};
    ok('A save with an unknown building is rejected', loadFromText(JSON.stringify(badb)).ok === false,
       loadFromText(JSON.stringify(badb)).msg);
    var badr = JSON.parse(txt); badr.res.food = -5;
    ok('A save with a negative resource is rejected', loadFromText(JSON.stringify(badr)).ok === false,
       loadFromText(JSON.stringify(badr)).msg);
  });

  /* 13-16 building rules */
  tryIt('building', function(){
    var S = newState(seed);
    S.res.metal = 500; S.res.parts = 200;
    var waterTile = -1, ashTile = -1;
    for(var i=0;i<TILES;i++){
      if(S.map[i].terrain === 'water' && waterTile < 0) waterTile = i;
      if(S.map[i].terrain === 'ash' && !S.map[i].b && ashTile < 0) ashTile = i;
    }
    ok('Terrain requirements are enforced', buildAt(S, waterTile, 'mine').ok === false,
       buildBlocker(S, waterTile, 'mine'));
    ok('Occupied tiles are rejected', buildAt(S, 27, 'shelter').ok === false, buildBlocker(S,27,'shelter'));
    ok('Research-locked buildings cannot be built', buildAt(S, ashTile, 'burner').ok === false,
       buildBlocker(S, ashTile, 'burner'));
    var m0 = S.res.metal, p0 = S.res.parts;
    var built = buildAt(S, ashTile, 'collector');
    ok('Building deducts exactly its listed cost',
       built.ok && S.res.metal === m0 - BUILDINGS.collector.cost.metal && S.res.parts === p0,
       'metal '+m0+' -> '+S.res.metal);
    /* adjacency arithmetic on a real tile */
    var cand = -1, count = 0;
    for(var j=0;j<TILES;j++){
      if(S.map[j].b || BUILDINGS.condenser.terrain.indexOf(S.map[j].terrain) < 0) continue;
      var ns = neighbors(j), n = 0;
      for(var k=0;k<ns.length;k++){ if(S.map[ns[k]].terrain === 'water') n++; }
      if(n > count){ count = n; cand = j; }
    }
    if(cand < 0){
      ok('Condenser adjacency bonus matches the published formula', true, 'no waterside tile on this map - skipped');
    } else {
      buildAt(S, cand, 'condenser');
      var ab = adjBonus(S, S.map[cand]);
      var expect = Math.min(count,4) * 1.5;
      ok('Condenser adjacency bonus matches the published formula (1.5 per melt pool, cap 4)',
         Math.abs((ab.add.water||0) - expect) < 1e-9,
         count+' pools -> +'+fmt(ab.add.water||0,2)+' water per effort (expected '+fmt(expect,2)+')');
    }
  });

  /* 17-18 damage and repair */
  tryIt('damage', function(){
    var S = newState(seed);
    S.res.metal = 500; S.res.parts = 200;
    var ashTile = -1;
    for(var i=0;i<TILES;i++){ if(S.map[i].terrain === 'ash' && !S.map[i].b){ ashTile = i; break; } }
    buildAt(S, ashTile, 'collector');
    var gath = null;
    eachColonist(S,function(c){ if(!gath && c.job === 'gatherer') gath = c; });
    gath.assign = ashTile;
    S.map[ashTile].b.integrity = 10;
    var ash0 = S.res.ash;
    stepProduction(S);
    ok('A building below 25% integrity produces nothing',
       Math.abs(S.res.ash - ash0) < 1e-9 && S.map[ashTile].b.report.ok === false, S.map[ashTile].b.report.head);
    S.map[ashTile].b.integrity = 100;
    stepProduction(S);
    ok('The same building produces once repaired', S.res.ash > ash0, S.map[ashTile].b.report.head);
    S.map[ashTile].b.integrity = 40;
    S.repairsLeft = 1; S.res.parts = 50;
    var p0 = S.res.parts;
    var rep = repairTile(S, ashTile);
    ok('Repair costs parts, restores integrity and consumes a crew charge',
       rep.ok && S.map[ashTile].b.integrity === 100 && S.res.parts === p0 - 3 && S.repairsLeft === 0,
       'parts '+p0+' -> '+fmt(S.res.parts,0)+', repairs left '+S.repairsLeft);
    var rep2 = repairTile(S, ashTile);
    ok('Repairing an undamaged building is refused', rep2.ok === false, rep2.msg);
  });

  /* 20 zero morale */
  tryIt('morale-refusal', function(){
    var S = newState(seed);
    S.res.metal = 500; S.res.parts = 200;
    var ashTile = -1;
    for(var i=0;i<TILES;i++){ if(S.map[i].terrain === 'ash' && !S.map[i].b){ ashTile = i; break; } }
    buildAt(S, ashTile, 'collector');
    var gath = null;
    eachColonist(S,function(c){ if(!gath && c.job === 'gatherer') gath = c; });
    gath.assign = ashTile; gath.morale = 0; gath.zeroTurns = 0;
    stepValidate(S);
    ok('Hitting zero morale gets one turn of grace, not an instant walkout',
       gath.assign === ashTile, gath.name+' still on shift on the first zero turn');
    gath.zeroTurns = 1;
    stepValidate(S);
    ok('A second straight turn at zero morale and the colonist downs tools',
       gath.assign === null, gath.name+' unassigned');
    ok('Assigning a refusing colonist is rejected with a reason',
       assignColonist(S, gath.id, ashTile).ok === false, assignColonist(S, gath.id, ashTile).msg);
    gath.morale = 40; gath.zeroTurns = 0;
    ok('Morale recovery makes them employable again',
       assignColonist(S, gath.id, ashTile).ok === true, 'back on the roster at morale 40');
  });

  /* 21 loss condition */
  tryIt('loss', function(){
    var S = newState(seed);
    S.colonists = [];
    runTurn(S, policyChoice);
    ok('Population zero ends the game as a loss', S.over === 'lose', 'over="'+S.over+'", score '+(S.score?S.score.total:'-'));
  });

  /* 22 event choices actually change state */
  tryIt('event-choice', function(){
    var S = newState(seed);
    S.res.food = 100;
    S.pending = {id:'festival', name:'A Reason to Gather', text:''};
    var f0 = S.res.food, m0 = S.colonists[0].morale;
    applyChoice(S, 0);
    ok('An event choice mutates state, not just the log',
       S.res.food === f0 - 12 && S.colonists[0].morale > m0 && S.pending === null,
       'food '+f0+' -> '+fmt(S.res.food,0)+', morale '+fmt(m0,0)+' -> '+fmt(S.colonists[0].morale,0));
    var S2 = newState(seed);
    S2.res.food = 100;
    S2.pending = {id:'festival', name:'A Reason to Gather', text:''};
    var mm = S2.colonists[0].morale;
    applyChoice(S2, 2);
    ok('Different choices give genuinely different outcomes',
       S2.res.food === 100 && S2.colonists[0].morale < mm,
       'choice 3 kept the food and cost '+fmt(mm - S2.colonists[0].morale,0)+' morale');
  });

  /* 23 trade limits */
  tryIt('trade', function(){
    var S = newState(seed);
    S.res.scrip = 500; S.res.food = 0;
    S.market.caravan = {stock:{food:5, water:0, metal:0, parts:0, ash:0, ore:0, soil:0}, scrip:100, turnsLeft:3};
    tradeBuy(S,'food',999);
    ok('You cannot buy more than the caravan carries',
       S.res.food === 5 && S.market.caravan.stock.food === 0, 'bought 5 of 5, scrip left '+fmt(S.res.scrip,0));
    ok('Scrip never goes negative through trade', S.res.scrip >= 0, 'scrip '+fmt(S.res.scrip,0));
    var noStock = tradeBuy(S,'metal',5);
    ok('Buying an out-of-stock good is refused', noStock.ok === false, noStock.msg);
    S.res.ash = 40;
    var s0 = S.res.scrip, car0 = S.market.caravan.scrip;
    tradeSell(S,'ash',10);
    ok('Selling moves goods to the caravan and scrip to you',
       S.res.ash === 30 && S.res.scrip > s0 && S.market.caravan.scrip < car0 && S.market.caravan.stock.ash === 10,
       'ash 40 -> 30, scrip '+fmt(s0,0)+' -> '+fmt(S.res.scrip,0));
  });

  /* 24 benchmark reproducibility */
  tryIt('benchmark', function(){
    var a = benchmark(seed, 12), b = benchmark(seed, 12), c = benchmark(seed+7, 12);
    ok('Benchmark from the same seed produces an identical hash', a.hash === b.hash, a.hash+' == '+b.hash);
    ok('Benchmark from a different seed produces a different hash', a.hash !== c.hash,
       'seed '+seed+' '+a.hash+' vs seed '+(seed+7)+' '+c.hash);
  });

  /* 25 win condition reachable */
  tryIt('win', function(){
    var S = newState(seed);
    S.turn = WIN_TURN - 1;
    while(S.colonists.length < WIN_POP) addColonist(S,'gatherer',2);
    eachColonist(S,function(c){ c.morale = 70; c.fatigue = 0; c.assign = null; });
    S.res.food = 200; S.res.water = 200;
    runTurn(S, policyChoice);
    ok('Turn 60 with population and needs met is a win',
       S.over === 'win', 'over="'+S.over+'", pop '+S.colonists.length+', score '+(S.score?S.score.total:'-'));
    var S2 = newState(seed);
    S2.turn = WIN_TURN - 1;
    S2.res.food = 200; S2.res.water = 200;
    eachColonist(S2,function(c){ c.assign = null; });
    runTurn(S2, policyChoice);
    ok('Turn 60 under the population bar is an ending, not a win',
       S2.over === 'ended', 'over="'+S2.over+'" with '+S2.colonists.length+' colonists');
  });

  var pass = 0, fail = 0;
  for(var i=0;i<results.length;i++){ if(results[i].ok) pass++; else fail++; }
  return {results:results, pass:pass, fail:fail};
}

function tileTip(S,i){
  var t = S.map[i], out = [];
  out.push(tileName(t)+' '+TERRAIN[t.terrain].name+' ['+TERRAIN[t.terrain].code+']');
  out.push(TERRAIN[t.terrain].desc);
  var ns = neighbors(i), counts = {};
  for(var n=0;n<ns.length;n++){ var k = S.map[ns[n]].terrain; counts[k] = (counts[k]||0)+1; }
  var cl = [];
  for(var c in counts) cl.push(counts[c]+'x '+TERRAIN[c].name);
  out.push('neighbours: '+(cl.join(', ')||'none'));
  if(t.b){
    var d = BUILDINGS[t.b.type];
    out.push('');
    out.push(d.name+'  integrity '+fmt(t.b.integrity,0)+'%'+(t.b.strained?'  [STRAINED: double storm damage]':''));
    if(t.b.report){
      out.push(t.b.report.head);
      for(var l=0;l<t.b.report.lines.length;l++) out.push('  '+t.b.report.lines[l]);
    } else out.push('  no throughput recorded yet - end a turn.');
  } else {
    out.push('');
    out.push('Empty. Select it to build.');
  }
  return out.join('\n');
}

        (blocked ? '\n\nBLOCKED: '+blocked : '');
      h.push('<div class="pitem'+(blocked?' dis':'')+'"'+tip(tipTxt)+'>');
      h.push('<div class="spread"><b>'+esc(bd.name)+'</b><span class="tag">'+esc(costText(bd.cost))+'</span></div>');
      h.push('<div class="muted" style="font-size:11px">'+esc(pv.length?pv.join(' | '):'no adjacency bonus here')+'</div>');
      h.push('<div class="row" style="margin-top:4px"><button class="sm" data-act="build" data-i="'+UI.sel+'" data-type="'+type+'"'+(blocked?' disabled':'')+'>BUILD</button>');
      if(blocked) h.push('<small class="muted">'+esc(blocked)+'</small>');
      h.push('</div></div>');
    }
    h.push('</div>');
  }
  h.push('</div>');
  return h.join('');
}

/* ---- people ----------------------------------------------------------- */
function viewPeople(){
  var S = G, h = [];
  var idle = 0, sumM = 0, sumF = 0;
  eachColonist(S,function(c){ if(c.assign===null) idle++; sumM += c.morale; sumF += c.fatigue; });
  var pop = S.colonists.length;
  h.push('<div class="card"><div class="spread"><h2>Roster '+pop+'</h2><div class="row tightgap">');
  h.push('<button data-act="autoassign"'+tip('Fill every open slot with idle colonists of the right job, in roster order. Skips anyone over 80 fatigue.')+'>AUTO-ASSIGN</button>');
  h.push('<button data-act="restall"'+tip('Stand everyone down. Nobody produces; everyone recovers fatigue and a little morale.')+'>REST ALL</button>');
  h.push('</div></div>');
  h.push('<div class="kv"><span'+tip('Housing comes from Shelters (4 each). Population above housing costs everyone 6 morale per turn, and migrants stop arriving.')+
    '>Housing</span><b>'+pop+' / '+S.housing+(pop>S.housing?' <span class="tag badt">CROWDED</span>':'')+'</b></div>');
  h.push('<div class="kv"><span'+tip('Each colonist eats '+fmt(FOOD_PER_HEAD,1)+' food and drinks '+fmt(WATER_PER_HEAD,1)+' water per turn'+
    (S.mods.foodUse!==1?', food modified x'+fmt(S.mods.foodUse,2)+' by research':'')+
    '.\nLast turn demand was '+fmt(S.needs.foodNeed,1)+' food and '+fmt(S.needs.waterNeed,1)+' water'+
    (S.needs.waterMul>1?' (storm water x'+fmt(S.needs.waterMul,2)+')':'')+'.')+
    '>Upkeep per turn</span><b>'+fmt(pop*FOOD_PER_HEAD*S.mods.foodUse,1)+' food, '+fmt(pop*WATER_PER_HEAD,1)+' water</b></div>');
  h.push('<div class="kv"><span>Last turn needs met</span><b>'+
    '<span class="tag '+(S.needs.foodRatio>=0.999?'ok':'badt')+'">FOOD '+fmt(S.needs.foodRatio*100,0)+'%</span> '+
    '<span class="tag '+(S.needs.waterRatio>=0.999?'ok':'badt')+'">WATER '+fmt(S.needs.waterRatio*100,0)+'%</span></b></div>');
  h.push('<div class="kv"><span>Idle</span><b>'+idle+'</b></div>');
  h.push('<div class="kv"><span>Average morale / fatigue</span><b>'+(pop?fmt(sumM/pop,0):'-')+' / '+(pop?fmt(sumF/pop,0):'-')+'</b></div>');
  var need = jobNeed(S);
  h.push('<div class="kv"><span'+tip('Read off what is actually short - thirst first, then hunger, then materials - and which crew slots are standing empty.\nAbout two in three new arrivals turn up already trained for this, and it is what you should be retraining towards.')+
    '>Colony most needs</span><b>'+(need ? '<span class="tag acc">'+JOBS[need].short+'</span> '+esc(JOBS[need].name)
                                          : 'nothing - every useful slot is filled')+'</b></div>');
  h.push('</div>');

  h.push('<div class="plist">');
  for(var i=0;i<S.colonists.length;i++){
    var c = S.colonists[i];
    var where = c.assign===null ? 'RESTING' : (BUILDINGS[S.map[c.assign].b.type].name+' '+tileName(S.map[c.assign]));
    h.push('<div class="pitem">');
    h.push('<div class="spread"><b'+tip(effText(c))+'>'+esc(c.name)+'</b>'+
      '<span class="row tightgap"><span class="tag acc">'+JOBS[c.job].short+'</span>'+
      '<span class="tag"'+tip('Skill '+c.skill+' of 5 -> output x'+fmt(skillMult(c.skill),2)+'.\nProgress to next: '+c.xp+' / '+(c.skill<5?XP_NEED[c.skill-1]:'-')+' turns of productive work.')+
      '>SKILL '+c.skill+'/5</span>'+
      (refusesWork(c)?'<span class="tag badt">REFUSING</span>':(c.morale<=0?'<span class="tag warnt">AT ZERO</span>':''))+
      (c.zeroTurns>0?'<span class="tag badt">LEAVING IN '+(4-c.zeroTurns)+'</span>':'')+
      '</span></div>');
    h.push('<div class="kv"><span'+tip('Morale drives output: x'+fmt(moraleMult(c.morale),2)+' right now.\nLast turn: '+(c.lastMorale||'no change recorded')+
      '\nOne turn of grace at zero, then they refuse to work. Four straight turns at zero and they walk out.')+
      '>Morale '+fmt(c.morale,0)+'</span><b style="min-width:90px">'+bar(c.morale,pctClass(c.morale))+'</b></div>');
    h.push('<div class="kv"><span'+tip('Fatigue drives output: x'+fmt(fatigueMult(c.fatigue),2)+' right now (no penalty below 60).\nAssigned: +'+fmt(8*S.mods.fatigueGain,1)+'/turn. Resting: -'+fmt(22*S.mods.restMult,1)+'/turn.')+
      '>Fatigue '+fmt(c.fatigue,0)+'</span><b style="min-width:90px">'+bar(c.fatigue,pctClass(c.fatigue,true))+'</b></div>');
    h.push('<div class="row" style="margin-top:4px"><select data-act="assign" data-cid="'+c.id+'" class="grow">');
    h.push('<option value="-1"'+(c.assign===null?' selected':'')+'>-- rest --</option>');
    for(var j=0;j<TILES;j++){
      var t = S.map[j];
      if(!t.b) continue;
      var d = BUILDINGS[t.b.type];
      if(!d.job || d.job !== c.job) continue;
      var used = workersOf(S,j).length;
      var full = used >= d.slots && c.assign !== j;
      h.push('<option value="'+j+'"'+(c.assign===j?' selected':'')+(full?' disabled':'')+'>'+
             esc(d.name)+' '+tileName(t)+' - '+used+'/'+d.slots+(t.b.integrity<25?' [DISABLED]':(t.b.integrity<100?' [damaged]':''))+'</option>');
    }
    h.push('</select><span class="tag">'+esc(where)+'</span></div>');
    h.push('<div class="row" style="margin-top:4px"><select data-act="retrain" data-cid="'+c.id+'" class="grow"'+
      tip('Retraining costs '+RETRAIN_COST+' scrip and drops them to skill 1 in the new job. It is how you fix a crew that does not match the buildings you have - and the only reason it is not free.')+'>');
    h.push('<option value="">retrain ('+RETRAIN_COST+' scrip, resets skill)...</option>');
    for(var q=0;q<JOB_IDS.length;q++){
      if(JOB_IDS[q] === c.job) continue;
      h.push('<option value="'+JOB_IDS[q]+'"'+(S.res.scrip < RETRAIN_COST?' disabled':'')+'>to '+esc(JOBS[JOB_IDS[q]].name)+' - '+esc(JOBS[JOB_IDS[q]].desc)+'</option>');
    }
    h.push('</select></div>');
    h.push('</div>');
  }
  h.push('</div>');
  return h.join('');
}

/* ---- research --------------------------------------------------------- */
function viewResearch(){
  var S = G, h = [];
  var effort = labEffort(S);
  h.push('<div class="card"><h2>Research</h2>');
  if(S.research.active){
    var node = researchById(S.research.active);
    var pct = clamp(S.research.progress/node.effort*100,0,100);
    var eta = effort > 0.01 ? Math.ceil((node.effort - S.research.progress)/effort) : null;
    h.push('<div class="spread"><b>'+esc(node.name)+'</b><span class="tag acc">IN PROGRESS</span></div>');
    h.push('<div class="kv"><span'+tip('Progress comes only from staffed Research Labs.\nLab output = (2.00 base + ruins adjacency) x crew effort x integrity.\nRight now your labs make '+fmt(effort,2)+' progress per turn.')+
      '>Progress</span><b>'+fmt(S.research.progress,1)+' / '+node.effort+'</b></div>');
    h.push(bar(pct,'good'));
    h.push('<div class="kv"><span>Lab effort this turn</span><b>'+fmt(effort,2)+'/turn '+(eta===null?'<span class="tag badt">NO LAB CREW</span>':'(~'+eta+' turns)')+'</b></div>');
    h.push('<p class="muted" style="font-size:12px">'+esc(node.text)+'</p>');
    h.push('<button data-act="cancelresearch"'+tip('Abandon it and recover half the scrip and parts you paid, rounded down.')+'>ABANDON (half refund)</button>');
  } else {
    h.push('<p class="muted">No active node. Pick one below: you pay scrip and parts up front, then your Research Labs grind out the effort.</p>');
    h.push('<div class="kv"><span>Lab effort available</span><b>'+fmt(effort,2)+'/turn</b></div>');
    if(effort <= 0) h.push('<p><span class="tag warnt">NO LAB</span> <small>Build a Research Lab and crew it with a Steward, or nothing will ever finish.</small></p>');
  }
  h.push('<div class="kv"><span>Completed</span><b>'+S.research.done.length+' / '+RESEARCH.length+'</b></div>');
  h.push('</div>');

  h.push('<div class="grid2">');
  for(var i=0;i<RESEARCH.length;i++){
    var n = RESEARCH[i], st = researchState(S,n);
    var badge = st==='done' ? '<span class="tag ok">DONE</span>' :
                st==='active' ? '<span class="tag acc">ACTIVE</span>' :
                st==='ready' ? '<span class="tag info">AVAILABLE</span>' : '<span class="tag badt">LOCKED</span>';
    var pre = n.pre.length ? n.pre.map(function(p){ return researchById(p).name; }).join(' + ') : 'none';
    var afford = canAfford(S,n.cost);
    h.push('<div class="pitem'+(st==='locked'?' dis':'')+'"'+
      tip(n.name+'\n'+n.text+'\ncost: '+costText(n.cost)+'\nlab effort: '+n.effort+
          '\nprerequisites: '+pre+'\nstatus: '+st.toUpperCase())+'>');
    h.push('<div class="spread"><b>'+esc(n.name)+'</b>'+badge+'</div>');
    h.push('<div class="muted" style="font-size:11px">'+esc(n.text)+'</div>');
    h.push('<div class="kv"><span>cost</span><b>'+esc(costText(n.cost))+' &middot; '+n.effort+' effort</b></div>');
    h.push('<div class="kv"><span>needs</span><b>'+esc(pre)+'</b></div>');
    if(st==='ready'){
      h.push('<button class="sm" data-act="research" data-id="'+n.id+'"'+(afford&&!S.research.active?'':' disabled')+'>'+
        (S.research.active?'BUSY':(afford?'START':'CANNOT AFFORD'))+'</button>');
    }
    h.push('</div>');
  }
  h.push('</div>');
  return h.join('');
}

    h.push('<div class="row" style="margin-top:4px">');

      '>BUY '+UI.qty+' @ '+fmt(pb,1)+'</button>');
    h.push('<button class="sm" data-act="sell" data-g="'+g+'"'+(car?'':' disabled')+tip(priceWhy(S,g,'sell'))+

    h.push('<span class="tag"'+tip('Global supply and demand drifts every turn by up to +/-6%, and events can shove it hard. This multiplies the base price of '+fmt(BASE_PRICE[g],2)+'.')+
      '>drift x'+fmt(S.market.drift[g],2)+'</span>');
    h.push('</div></div>');

  return h.join('');
