/* ============================================================================
   9. TESTS + BENCHMARK
   ========================================================================== */
function runTests(){
  const out=[]; let pass=0, fail=0;
  function ok(name, cond, detail){
    if(cond){ pass++; out.push("PASS  "+name); }
    else { fail++; out.push("FAIL  "+name+(detail?"  — "+detail:"")); }
  }
  // 1 - PRNG determinism
  const r1=mulberry32(1337), r2=mulberry32(1337);
  let same=true; for(let i=0;i<50;i++) if(r1.next()!==r2.next()) same=false;
  ok("1. PRNG is deterministic for a fixed seed", same);
  // 2 - different seeds diverge
  const r3=mulberry32(99); ok("2. Different seeds give different streams", mulberry32(1337).next()!==r3.next());
  // 3 - map size / terrain validity
  const g = newGame(4242, true);
  ok("3. Map is exactly 64 tiles", g.tiles.length===64, "got "+g.tiles.length);
  ok("4. All terrain values are known", g.tiles.every(t=>!!TERRAIN[t.terr]));
  // 5 - map gen reproducible
  ok("5. Map generation is reproducible from seed",
     JSON.stringify(genMap(777))===JSON.stringify(genMap(777)));
  // 6 - terrain requirement enforced
  const water = g.tiles.find(t=>t.terr==="water");
  ok("6. Buildings are rejected on illegal terrain", !!canBuild(g,water,"digger"),
     "expected an error string for a digger on water");
  // 7 - research prereq enforced
  const g2 = newGame(1337, true); g2.res.scrip=9999; g2.res.parts=999;
  const preErr = buyResearch(g2,"hydroponics");
  ok("7. Research prerequisites are enforced", preErr==="Prerequisites not met.", String(preErr));
  ok("8. Research succeeds once prereqs are met",
     buyResearch(g2,"ashSifting")===null && buyResearch(g2,"hydroponics")===null);
  // 9 - research measurably changes production
  const a = newGame(2024, true), b = newGame(2024, true);
  [a,b].forEach(st=>{
    st.res.metal=200; st.res.parts=200;
    const target = st.tiles.find(x=>x.terr==="ash"&&!x.b);
    build(st,target.i,"greenhouse");
    st.res.soil=200; st.res.water=200;
    assign(st, st.colonists[0].id, target.i);
    st._t = target.i;
  });
  b.research.hydroponics = true;
  const pa = tilePreview(a, a.tiles[a._t]).out.food, pb = tilePreview(b, b.tiles[b._t]).out.food;
  ok("9. Hydroponics measurably raises greenhouse food output", pb > pa*1.30, fmt(pa)+" -> "+fmt(pb));
  // 10 - adjacency bonus math
  const g3 = newGame(31337, true);
  const cand = g3.tiles.find(t=>(t.terr==="ash"||t.terr==="rock") && adjCount(g3,t,"water")>0);
  if(cand){
    g3.res.metal=200; build(g3,cand.i,"condenser");
    const expect = adjCount(g3,cand.i!==undefined?g3.tiles[cand.i]:cand,"water")*0.35;
    ok("10. Condenser adjacency bonus matches 0.35 per water neighbour",
       Math.abs(tileAdjBonus(g3,g3.tiles[cand.i])-expect)<1e-9, fmt(tileAdjBonus(g3,g3.tiles[cand.i])));
  } else ok("10. Condenser adjacency bonus matches 0.35 per water neighbour", true, "no candidate tile on this seed");
  // 11-14 - long simulation invariants
  const sim = runHeadless(1337, 80);
  ok("11. No resource ever goes negative", RES.every(k=>sim.res[k]>=0),
     RES.map(k=>k+"="+fmt(sim.res[k])).join(" "));
  const simCaps = caps(sim);
  ok("12. Storage caps are respected", RES.every(k=>sim.res[k]<=simCaps[k]+1e-6),
     RES.filter(k=>sim.res[k]>simCaps[k]+1e-6).join(",")||"ok");
  const rosterIds = sim.colonists.map(c=>c.id);
  const tileWorkers = sim.tiles.flatMap(t=>t.workers);
  ok("13. Every assigned worker id exists in the roster", tileWorkers.every(id=>rosterIds.indexOf(id)>=0));
  ok("14. Colonist.at agrees with tile.workers both ways",
     sim.colonists.every(c=> c.at===null ? !tileWorkers.includes(c.id)
        : sim.tiles[c.at].workers.indexOf(c.id)>=0) &&
     tileWorkers.every(id=>{ const c=sim.colonists.find(x=>x.id===id); return c && c.at!==null && sim.tiles[c.at].workers.includes(id); }));
  ok("15. No worker is assigned to an empty or overfull tile",
     sim.tiles.every(t=> t.workers.length===0 || (t.b && t.workers.length<=BUILD[t.b].slots)));
  ok("16. Morale and fatigue stay inside 0..100",
     sim.colonists.every(c=>c.morale>=0&&c.morale<=100&&c.fatigue>=0&&c.fatigue<=100));
  ok("17. Skill stays inside 1..5", sim.colonists.every(c=>c.skill>=1&&c.skill<=5));
  ok("18. Damage levels stay inside 0..3", sim.tiles.every(t=>t.dmg>=0&&t.dmg<=3&&(t.b||t.dmg===0)));
  // 19 - save/load round trip
  const round = deserialize(serialize(sim));
  ok("19. Save/load round-trips to an identical state hash",
     hashState(round)===hashState(sim), hashState(round)+" vs "+hashState(sim));
  // 20 - load validation rejects garbage
  let threw=false; try{ deserialize("{not json"); }catch(e){ threw=true; }
  let threw2=false; try{ deserialize('{"version":3}'); }catch(e){ threw2=true; }
  ok("20. Load rejects malformed input with an error", threw && threw2);
  // 21 - headless determinism
  ok("21. Two headless runs from one seed produce one hash",
     hashState(runHeadless(555,40))===hashState(runHeadless(555,40)));
  // 22 - overflow is logged and counted
  const g4 = newGame(1337,true); g4.res.food = BASE_CAP.food; addRes(g4,"food",50);
  ok("22. Overflow above the cap is discarded and counted",
     g4.res.food===caps(g4).food && g4.stats.overflowLost>0);
  // 23 - trade cannot go negative on scrip
  const g5 = newGame(1337,true); g5.res.scrip=0; S_TMP(g5, ()=>spawnCaravan(g5));
  const buyErr = doBuy(g5,"parts",5);
  ok("23. Buying without scrip fails cleanly", typeof buyErr==="string" && g5.res.scrip===0, String(buyErr));
  // 24 - build cost actually charged
  const g6 = newGame(1337,true); const before=g6.res.metal;
  const spot = g6.tiles.find(t=>t.terr==="ash"&&!t.b); build(g6,spot.i,"digger");
  ok("24. Building charges its full cost", Math.abs((before-g6.res.metal)-BUILD.digger.cost.metal)<1e-9);
  // 25 - morale 0 colonist produces nothing
  const g7 = newGame(1337,true); const spot7=g7.tiles.find(t=>t.terr==="ash"&&!t.b);
  g7.res.metal=100; build(g7,spot7.i,"digger"); assign(g7,g7.colonists[0].id,spot7.i);
  g7.colonists[0].morale=0;
  ok("25. A colonist at zero morale contributes no output", tileWorkerPower(g7,g7.tiles[spot7.i])===0);

  return {text:out.join("\n"), pass, fail};
}

function runBenchmark(){
  const t0 = Date.now();
  const st = runHeadless(S.seed, 200);
  const h = hashState(st);
  const sc = score(st);
  const lines = [
    "BENCHMARK — 200 headless turns, fixed greedy policy",
    "seed:                "+S.seed,
    "final state hash:    "+h,
    "turns simulated:     "+(st.turn-1),
    "population:          "+st.colonists.length,
    "avg morale:          "+fmt(avgMorale(st)),
    "buildings:           "+st.tiles.filter(t=>t.b).length+"  (damaged: "+st.tiles.filter(t=>t.b&&t.dmg>0).length+")",
    "research completed:  "+researchCount(st)+" / "+RESEARCH_KEYS.length+"  ["+Object.keys(st.research).join(", ")+"]",
    "resources:           "+RES.map(k=>k+"="+fmt(st.res[k])).join("  "),
    "storms survived:     "+st.stats.stormsSurvived,
    "events fired:        "+st.stats.eventsFired,
    "colonists lost:      "+st.stats.colonistsLost,
    "overflow wasted:     "+fmt(st.stats.overflowLost),
    "score total:         "+sc.total,
    "wall clock:          "+(Date.now()-t0)+" ms",
    "",
    "Run this twice with the same seed: the hash above must be identical."
  ];
  return lines.join("\n");
}

/* ============================================================================
   10. EVENT WIRING
   ========================================================================== */
function setTab(t){ UI.tab=t; render(); }

document.addEventListener("click", e=>{
  const tabBtn = e.target.closest("[data-tab]");
  if(tabBtn){ setTab(tabBtn.dataset.tab); return; }

  const tile = e.target.closest("[data-tile]");
  if(tile){ UI.sel = +tile.dataset.tile; render(); return; }

  const b = e.target.closest("[data-act]");
  if(!b || b.disabled) return;
  const act = b.dataset.act;
  let err = null;

  if(act==="build")      err = build(S, +b.dataset.i, b.dataset.b);
  else if(act==="demolish") err = demolish(S, +b.dataset.i);
  else if(act==="repair")   err = repair(S, +b.dataset.i);
  else if(act==="unassign"){ unassign(S, +b.dataset.c); }
  else if(act==="assignSel"){
    const sel = $("#assignSel"); if(sel) err = assign(S, +sel.value, +b.dataset.i);
  }
  else if(act==="assignPerson"){
    const sel = $("#pa"+b.dataset.c); if(sel) err = assign(S, +b.dataset.c, +sel.value);
  }
  else if(act==="research") err = buyResearch(S, b.dataset.r);
  else if(act==="buy" || act==="sell"){
    const q = Math.max(1, Math.min(999, parseInt(($("#qty")||{}).value,10)||1));
    UI.buyQty = q;
    err = act==="buy" ? doBuy(S,b.dataset.g,q) : doSell(S,b.dataset.g,q);
  }
  else if(act==="choice"){ resolveChoice(S, +b.dataset.k); }
  else if(act==="export"){ $("#savebox").value = serialize(S); $("#saveMsg").textContent="Exported "+serialize(S).length+" characters. Select all and copy."; $("#saveMsg").className="tiny good"; render_keepSave(); return; }
  else if(act==="copy"){ const ta=$("#savebox"); ta.focus(); ta.select(); return; }
  else if(act==="import"){
    const txt = $("#savebox").value.trim();
    try{
      const o = deserialize(txt);
      S = o; UI.sel=null; render();
      const m=$("#saveMsg"); if(m){ m.textContent="Save loaded: turn "+S.turn+", "+S.colonists.length+" colonists."; m.className="tiny good"; }
    }catch(ex){
      const m=$("#saveMsg"); if(m){ m.textContent="LOAD FAILED — "+ex.message; m.className="tiny bad"; }
    }
    return;
  }
  else if(act==="newgame"){
    const sIn = $("#seedIn");
    const seed = Math.abs(parseInt((sIn&&sIn.value)||"1337",10)||1337)>>>0;
    S = newGame(seed); UI.sel=null; UI.tab="map"; render(); return;
  }
  else if(act==="tests"){
    const r = runTests();
    $("#devout").textContent = r.text+"\n\n"+r.pass+" passed, "+r.fail+" failed, "+(r.pass+r.fail)+" assertions total.";
    return;
  }
  else if(act==="bench"){ $("#devout").textContent = runBenchmark(); return; }
  else if(act==="hash"){ $("#devout").textContent = "Live state hash: "+hashState(S); return; }

  if(err){ flash(err); }
  render();
});

/* export/import shouldn't wipe the textarea the user is reading */
function render_keepSave(){
  const val = $("#savebox") ? $("#savebox").value : null;
  const msg = $("#saveMsg") ? $("#saveMsg").textContent : null;
  const cls = $("#saveMsg") ? $("#saveMsg").className : null;
  render();
  if(val!==null && $("#savebox")) $("#savebox").value = val;
  if(msg!==null && $("#saveMsg")){ $("#saveMsg").textContent = msg; $("#saveMsg").className = cls; }
}

function flash(msg){
  const t = $("#tip");
  t.textContent = msg;
  t.style.display="block";
  t.style.left = "50%"; t.style.top = "70px"; t.style.transform="translateX(-50%)";
  clearTimeout(flash._h);
  flash._h = setTimeout(()=>{ t.style.display="none"; t.style.transform=""; }, 2200);
}

/* ---------- tooltips ---------- */
const tipEl = () => $("#tip");
function showTip(text, x, y){
  const t = tipEl();
  t.textContent = text;
  t.style.display = "block";
  t.style.transform = "";
  const r = t.getBoundingClientRect();
  let left = x+14, top = y+16;
  if(left + r.width > window.innerWidth-6) left = Math.max(6, window.innerWidth - r.width - 6);
  if(top + r.height > window.innerHeight-6) top = Math.max(6, y - r.height - 12);
  t.style.left = left+"px"; t.style.top = top+"px";
}
function hideTip(){ tipEl().style.display="none"; }
document.addEventListener("mouseover", e=>{
  const el = e.target.closest("[data-tip]");
  if(el) showTip(el.dataset.tip, e.clientX, e.clientY); else hideTip();
});
document.addEventListener("mousemove", e=>{
  const el = e.target.closest("[data-tip]");
  if(el) showTip(el.dataset.tip, e.clientX, e.clientY);
});
document.addEventListener("mouseout", e=>{ if(!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest("[data-tip]")) hideTip(); });
/* touch: long-ish press shows the tooltip without blocking the tap */
document.addEventListener("touchstart", e=>{
  const el = e.target.closest("[data-tip]");
  if(el){ const t=e.touches[0]; showTip(el.dataset.tip, t.clientX, t.clientY);
    clearTimeout(showTip._h); showTip._h = setTimeout(hideTip, 4000); }
  else hideTip();
}, {passive:true});

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e=>{
  const tag = (e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="select") return;
  if(e.code==="Space"){ e.preventDefault(); endTurn(); return; }
  const n = parseInt(e.key,10);
  if(n>=1 && n<=TABS.length){ setTab(TABS[n-1][0]); return; }
  if(e.key==="Escape") hideTip();
});
$("#endBtn").addEventListener("click", endTurn);

/* ---------- boot ---------- */
S = newGame(1337);
render();
</script>
