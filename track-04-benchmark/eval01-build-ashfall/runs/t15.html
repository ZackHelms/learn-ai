function renderResBar(){
  const caps = capsAll(S), m = computeMods(S);
  const html = RESOURCES.map(r=>{
    const v = S.res[r.id], cap = caps[r.id], d = S.lastDelta[r.id] || 0;
    const ratio = v / Math.max(1,cap);
    const cls = (r.core && ratio < 0.12) ? ' low' : (ratio > 0.985 ? ' full' : '');
    const capSrc = [];
    capSrc.push('base ' + r.base);
    for(const bid of BLD_IDS){
      const n = countBuilt(S,bid);
      if(!n) continue;
      const def = BLD[bid];
      let add = 0;
      for(const i of builtIdx(S,bid)){
        if(def.store && def.store[r.id]) add += def.store[r.id];
        const a = adjInfo(S,i,bid);
        if(a.store[r.id]) add += a.store[r.id];
      }
      if(add) capSrc.push(n + 'x ' + def.name + ' +' + add);
    }
    if(m.capMult !== 1) capSrc.push('research x' + fmt2(m.capMult));
    const tip = r.name + ' - ' + r.desc +
      '\nStored ' + fmt(v) + ' / ' + cap +
      '\nLast turn: ' + sgn(d) +
      '\nCap sources: ' + capSrc.join(', ') +
      (r.id === 'food' ? '\nUpkeep: 1.0 per colonist per turn = ' + fmt(S.colonists.length) : '') +
      (r.id === 'water' ? '\nUpkeep: 1.1 per colonist per turn = ' + fmt(S.colonists.length*1.1) + ' (x' + fmt2(S.storm.waterMult) + ' during an ashstorm)' : '');
    return '<span class="chip'+cls+'" data-tip="'+esc(tip)+'"><b>'+r.code+'</b>'+
      '<span class="v">'+fmt(v)+'</span><span class="d">/'+cap+' '+sgn(d)+'</span>'+
      (cls===' low'?'<span class="d">!</span>':'')+(cls===' full'?'<span class="d">FULL</span>':'')+'</span>';
  }).join('');
  document.getElementById('resbar').innerHTML = html;
}
function renderTabs(){
  document.getElementById('tabs').innerHTML = TABS.map((t,i)=>
    '<button class="tab-btn" role="tab" aria-selected="'+(UI.tab===t.id)+'" data-act="tab" data-tab="'+t.id+'">'+
    t.name+' <span class="k">'+(i+1)+'</span></button>').join('');
}

/* --------------------------------------------------------------- map tab */
function renderMap(){
  const m = computeMods(S);
  let g = '';
  for(let i=0;i<MAP_N;i++){
    const t = S.map[i], ter = TERRAIN[t.terr];
    const def = t.b ? BLD[t.b] : null;
    const w = t.b ? workersAt(S,i).length : 0;
    let cls = 'tile t-'+t.terr + (UI.sel===i?' sel':'');
    let hz = '';
    if(t.b){
      if(t.integrity < 25){ cls += ' off'; hz = '✖'; }
      else if(t.integrity < 100){ cls += ' dmg'; hz = t.repairing ? '↻' : '!'; }
    }
    const label = tileName(i)+' '+ter.name+(def?', '+def.name:', empty');
    g += '<button class="'+cls+'" data-act="seltile" data-i="'+i+'" aria-label="'+esc(label)+'" data-tip="'+esc(tileTip(S,i,m))+'">'+
      '<span class="terr">'+ter.glyph+'</span>'+
      (def ? '<span class="code">'+def.code+'</span>' : '')+
      (def && def.slots ? '<span class="st">'+w+'/'+def.slots+'</span>' : '')+
      (hz ? '<span class="hz">'+hz+'</span>' : '')+
      '</button>';
  }
  const legend = TERR_IDS.map(t=>'<span data-tip="'+esc(TERRAIN[t].desc)+'">'+TERRAIN[t].glyph+' '+TERRAIN[t].name+'</span>').join('')
    + '<span data-tip="A damaged building is marked with ! and produces less. Under 25% integrity it is marked ✖ and produces nothing.">! damaged &nbsp; ✖ offline &nbsp; ↻ repairing</span>';
  return '<div class="cols"><div>'+
    '<h2>OUTPOST MAP</h2>'+
    '<div id="grid">'+g+'</div>'+
    '<div class="legend">'+legend+'</div>'+
    '</div><div>'+renderTilePanel(m)+'</div></div>';
}
function renderTilePanel(m){
  if(UI.sel < 0) return '<div class="card"><h2>NO TILE SELECTED</h2><p class="muted">Click a tile on the map to inspect it, build on it, or crew it. Hover or tap anything for the numbers behind it.</p>'+
    '<p class="tiny muted">Seed <b>'+S.seed+'</b> - change the seed, save, load, test and benchmark on the <b>Dev</b> tab (key 6).</p>'+
    '<h3>Turn resolution order</h3><ol class="tiny muted" style="padding-left:18px;margin:0">'+
    TURN_PHASES.map(p=>'<li>'+esc(p.replace(/^\d+\.\s*/,''))+'</li>').join('')+'</ol></div>';
  const i = UI.sel, t = S.map[i], ter = TERRAIN[t.terr];
  let h = '<div class="card"><div class="between"><h2>'+tileName(i)+' - '+ter.name+'</h2>'+
    '<span class="pill" data-tip="'+esc(ter.desc)+'">'+ter.glyph+' '+ter.name+'</span></div>';
  if(t.b){
    const def = BLD[t.b], p = projectProduction(S,i,m);
    h += '<div class="between"><b>'+def.name+'</b>'+
      '<span class="pill '+(t.integrity>=70?'done':t.integrity>=25?'warn':'bad')+'" data-tip="Integrity scales output below 70%. Under 25% the building is offline.">'+
      (t.integrity>=100?'INTACT':(t.integrity<25?'OFFLINE ':'DAMAGED ')+Math.round(t.integrity)+'%')+'</span></div>';
    h += '<div class="tiny muted">'+esc(def.desc)+'</div><hr>';
    if(def.adj) h += '<div class="tiny" data-tip="Adjacency is counted over the 4 orthogonal neighbours.">Adjacency: '+esc(def.adj.text)+
      ' &rarr; <b>'+p.adj.count+' matched</b>'+(p.adj.pct?' = +'+Math.round(p.adj.pct*100)+'% output':'')+
      (p.adj.beds?' = +'+p.adj.beds+' beds':'')+(p.adj.powerCut?' = -'+Math.round(p.adj.powerCut*100)+'% power draw':'')+'</div>';
    if(def.prod){
      h += '<div class="tiny" data-tip="Inputs scale with crew effort and integrity. Outputs also scale with adjacency and research, which is why upgrades are real yield gains.">'+
        'Projected this turn: <b>'+esc(flowText(p))+'</b>'+
        (p.rate<=0?' <span class="pill bad">NO CREW</span>':'')+
        (t.repairing?' <span class="pill warn">UNDER REPAIR</span>':'')+'</div>';
      h += '<div class="tiny muted">crew effort '+fmt2(p.rate)+' x integrity '+fmt2(p.iF)+
        (p.adj.pct?' x adjacency '+fmt2(1+p.adj.pct):'')+(p.resMult!==1?' x research '+fmt2(p.resMult):'')+'</div>';
    }
    if(def.slots){
      h += '<hr><h3>Crew ('+workersAt(S,i).length+'/'+def.slots+' &middot; '+JOBS[def.job].name+' post)</h3>';
      const ws = workersAt(S,i);
      h += ws.length ? ws.map(c=>'<div class="between tiny"><span data-tip="'+esc(colonistTip(c,t.b))+'">'+esc(c.name)+
          ' <span class="pill">'+JOBS[c.job].short+' '+fmt(c.skill)+'</span> effort '+fmt2(workerEff(S,c,t.b))+'</span>'+
          '<button class="btn tiny" data-act="unassign" data-id="'+c.id+'">Rest</button></div>').join('')
        : '<div class="tiny muted">Nobody is working here.</div>';
      const free = S.colonists.filter(c=>c.at !== i);
      if(ws.length < def.slots && free.length){
        h += '<div class="row tiny" style="margin-top:4px">'+free.slice(0,14).map(c=>
          '<button class="btn tiny" data-act="assign" data-id="'+c.id+'" data-i="'+i+'" data-tip="'+esc(colonistTip(c,t.b))+
          '">+ '+esc(c.name.split(' ')[0])+' <span class="muted">'+JOBS[c.job].short+fmt(c.skill)+'</span></button>').join('')+'</div>';
      }
    }
    h += '<hr><div class="row">';
    if(t.integrity < 100 && !t.repairing)
      h += '<button class="btn sm" data-act="repair" data-i="'+i+'" data-tip="Repair costs '+repairCostOf(S,i)+' Parts up front. While repairing, the building produces nothing and its crew work on the fix (10 + 16 x crew effort integrity per turn).">Repair ('+repairCostOf(S,i)+' Parts)</button>';
    if(t.repairing) h += '<span class="pill warn">REPAIR BOOKED</span>';
    h += '<button class="btn sm" data-act="demolish" data-i="'+i+'" data-tip="Refunds 50% of the metal cost, rounded down. Crew are sent to rest.">Demolish</button>';
    h += '</div></div>';
  } else {
    h += '<div class="tiny muted">'+esc(ter.desc)+'</div></div>';
    h += '<div class="card"><h2>BUILD HERE</h2>'+renderBuildMenu(i, m)+'</div>';
  }
  return h;
}
function renderBuildMenu(i, m){
  return '<div class="grid2">' + BLD_IDS.map(bid=>{
    const def = BLD[bid], why = buildReason(S, i, bid, m), a = adjInfo(S, i, bid);
    const tip = def.name+'\n'+def.desc+'\nCost: '+costText(def.cost)+
      '\nTerrain: '+def.terr.map(x=>TERRAIN[x].name).join(' / ')+
      (def.slots?'\nCrew: '+def.slots+' '+JOBS[def.job].name:'\nNeeds no crew')+
      (def.tech?'\nUnlocked by: '+RES_NODE[def.tech].name:'')+
      (def.adj?'\nAdjacency: '+def.adj.text+'\nHere: '+a.count+' matched'+(a.pct?' = +'+Math.round(a.pct*100)+'% output':''):'')+
      (why?'\n\nBLOCKED: '+why:'\n\nReady to build.');
    return '<div class="node'+(why?' lock':' avail')+'" data-tip="'+esc(tip)+'">'+
      '<div class="between"><b>'+def.code+' '+def.name+'</b>'+(why?'<span class="pill lock">X</span>':'<span class="pill avail">OK</span>')+'</div>'+
      '<div class="tiny muted">'+costText(def.cost)+(def.slots?' &middot; '+def.slots+' '+JOBS[def.job].short:'')+'</div>'+
      (a.count && def.adj ? '<div class="tiny">here: +'+(a.pct?Math.round(a.pct*100)+'% output':a.beds?a.beds+' beds':a.count+' matched')+'</div>' : '')+
      (why ? '<div class="tiny muted">'+esc(why)+'</div>'
           : '<button class="btn sm" data-act="build" data-i="'+i+'" data-b="'+bid+'">Build</button>')+
      '</div>';
  }).join('') + '</div>';
}
function colonistTip(c, bid){
  const rows = effBreakdown(S, c, bid);
  const eff = workerEff(S, c, bid);
  return c.name+' - '+JOBS[c.job].name+' skill '+fmt(c.skill)+
    '\nMorale '+Math.round(c.morale)+' / Fatigue '+Math.round(c.fatigue)+
    '\nEffort here = '+rows.map(r=>r[0]+' x'+fmt2(r[1])).join(' ')+
    '\n= '+fmt2(eff)+' worker-units'+
    (c.at>=0 ? '\nWorking at '+tileName(c.at)+' ('+BLD[S.map[c.at].b].name+')' : '\nResting: -18 fatigue per turn, +1 morale')+
    '\nSkill grows '+(bid && BLD[bid] && BLD[bid].job===c.job?'+0.055':'+0.028')+' per productive turn (cap 5).';
}

/* ------------------------------------------------------------ people tab */
function moraleWord(v){ return v < 1 ? 'BROKEN' : v < 20 ? 'REFUSING' : v < 45 ? 'Unhappy' : v < 70 ? 'Steady' : 'Content'; }
function fatigueWord(v){ return v > 90 ? 'COLLAPSING' : v > 75 ? 'Exhausted' : v > 45 ? 'Tired' : 'Fresh'; }
function renderPeople(){
  const beds = bedsTotal(S), pop = S.colonists.length;
  let h = '<div class="between"><h2>ROSTER - '+pop+' colonists, '+beds+' beds</h2><div class="row">'+
    '<button class="btn sm" data-act="autoassign" data-tip="Runs the built-in greedy policy: everyone under 78 fatigue is placed by job match and skill, in the priority order Condenser, Ashworks, Compost, Greenhouse, Vent Tap, Mine, Salvage, Forge, Workshop, Lab, Trade Post.">Auto-Assign</button>'+
    '<button class="btn sm" data-act="restall" data-tip="Unassigns everyone. Resting recovers 18 fatigue per turn (more with Field Medicine) and gives +1 morale.">Rest All</button></div></div>';
  if(pop > beds) h += '<div class="card"><span class="pill bad">OVERCROWDED</span> '+(pop-beds)+
    ' colonists have no bed: every colonist loses '+fmt(1.5+1.2*(pop-beds))+' morale per turn until you build more Shelters.</div>';
  if(!pop) return h + '<div class="card">The outpost is empty.</div>';
  h += '<div class="card" style="overflow-x:auto"><table><thead><tr><th>Name</th><th>Job</th><th>Skill</th><th>Morale</th><th>Fatigue</th><th>Posted to</th><th></th></tr></thead><tbody>';
  S.colonists.slice().sort((a,b)=>a.id-b.id).forEach(c=>{
    const bid = c.at >= 0 ? S.map[c.at].b : null;
    const opts = ['<option value="-1"'+(c.at<0?' selected':'')+'>Resting</option>'];
    for(let i=0;i<MAP_N;i++){
      const t = S.map[i];
      if(!t.b || !BLD[t.b].slots) continue;
      const full = workersAt(S,i).filter(x=>x.id!==c.id).length >= BLD[t.b].slots;
      if(full && c.at !== i) continue;
      opts.push('<option value="'+i+'"'+(c.at===i?' selected':'')+'>'+tileName(i)+' '+BLD[t.b].name+
        ' ('+workersAt(S,i).length+'/'+BLD[t.b].slots+')</option>');
    }
    h += '<tr>'+
      '<td data-tip="'+esc(colonistTip(c,bid))+'">'+esc(c.name)+'</td>'+
      '<td data-tip="'+esc(JOBS[c.job].name+' - '+JOBS[c.job].desc+'\nWorking outside their job halves their effort.')+'">'+JOBS[c.job].short+'</td>'+
      '<td data-tip="Skill '+fmt2(c.skill)+' of 5. Effort multiplier = 0.5 + 0.25 x skill = x'+fmt2(0.5+0.25*c.skill)+'.\nGrows with productive turns, faster in a matching job.">'+fmt(c.skill)+'</td>'+
      '<td data-tip="'+esc('Morale '+Math.round(c.morale)+' - '+moraleWord(c.morale)+
        '\nEffort multiplier x'+fmt2(0.45+0.55*c.morale/100)+
        '\nLast turn: '+(c.md==null?'no turn resolved yet':sgn(c.md)+' from '+c.mw)+
        '\nUnder 20: refuses to work. Two turns at 0: leaves.\nFed + watered = +3/turn, plenty in store = +2, resting = +1.')+'">'+
        bar(c.morale, Math.round(c.morale)+' '+moraleWord(c.morale), 'morale')+'</td>'+
      '<td data-tip="'+esc('Fatigue '+Math.round(c.fatigue)+' - '+fatigueWord(c.fatigue)+'\nEffort multiplier x'+fmt2(1-0.4*c.fatigue/100)+'\n+9 per turn worked, -18 per turn rested. At 98 they collapse and are sent to rest.')+'">'+
        bar(c.fatigue, Math.round(c.fatigue)+' '+fatigueWord(c.fatigue), 'fatigue')+'</td>'+
      '<td><select data-act="post" data-id="'+c.id+'">'+opts.join('')+'</select></td>'+
      '<td><button class="btn tiny" data-act="retrain" data-id="'+c.id+'" data-tip="Retrain to the next job in the rotation. Costs 1 skill level (minimum 1) and 10 morale - use it to fix a badly-shaped roster.">Retrain</button></td>'+
      '</tr>';
  });
  return h + '</tbody></table></div>';
}

/* ---------------------------------------------------------- research tab */
function renderResearch(){
  const m = computeMods(S);
  const disc = labDiscount(S), bonus = S.researchDiscount || 0;
  let h = '<div class="between"><h2>RESEARCH - '+S.research.length+'/'+RESEARCH.length+' complete</h2>'+
    '<span class="tiny muted" data-tip="A built Lab unlocks tier 2. A Lab with a working scholar unlocks tier 3 and discounts every node.\nDiscount = 9% per staffed Lab (+3% per adjacent Ruins), capped at 45%.">Lab discount '+
    Math.round(disc*100)+'%'+(bonus?' +'+Math.round(bonus*100)+'% one-off':'')+'</span></div>';
  if(S.researchedThisTurn) h += '<div class="card tiny">One node per turn. The next can be started after you end this turn.</div>';
  for(const tier of [1,2,3]){
    const need = tier===1 ? 'no requirement' : tier===2 ? 'needs a built Lab' : 'needs a Lab with a working scholar';
    h += '<h3>Tier '+tier+' <span class="muted">('+need+')</span></h3><div class="grid2">';
    RESEARCH.filter(n=>n.tier===tier).forEach(n=>{
      const st = researchState(S, n.id, m);
      const c = researchCost(S, n.id);
      const missing = n.req.filter(r=>!S.research.includes(r)).map(r=>RES_NODE[r].name);
      const tip = n.name+'\n'+n.effect+
        '\nCost: '+n.cost.scrip+' Scrip'+(n.cost.parts?' + '+n.cost.parts+' Parts':'')+
        (c.disc>0?'\nWith discount: '+c.scrip+' Scrip'+(c.parts?' + '+c.parts+' Parts':''):'')+
        '\nPrerequisites: '+(n.req.length?n.req.map(r=>RES_NODE[r].name).join(', '):'none')+
        (missing.length?'\nStill missing: '+missing.join(', '):'')+
        (st==='locked'&&!missing.length?'\nBlocked by the tier '+tier+' Lab requirement.':'');
      const mark = st==='done'?'&#10003; DONE':st==='available'?'&#9656; AVAILABLE':'&#10007; LOCKED';
      h += '<div class="node '+st.replace('available','avail')+'" data-tip="'+esc(tip)+'">'+
        '<div class="between"><b>'+esc(n.name)+'</b><span class="pill '+(st==='done'?'done':st==='available'?'avail':'lock')+'">'+mark+'</span></div>'+
        '<div class="tiny">'+esc(n.effect)+'</div>'+
        '<div class="tiny muted">'+c.scrip+' Scrip'+(c.parts?' + '+c.parts+' Parts':'')+(c.disc>0?' (-'+Math.round(c.disc*100)+'%)':'')+'</div>'+
        (n.req.length?'<div class="tiny muted">after: '+n.req.map(r=>esc(RES_NODE[r].name)).join(', ')+'</div>':'')+
        (st==='available'?'<button class="btn sm" data-act="research" data-id="'+n.id+'">Research</button>':'')+
        '</div>';
    });
    h += '</div>';
  }
  return h;
}

/* ------------------------------------------------------------- trade tab */
function renderTrade(){
  const m = computeMods(S), caps = capsAll(S);
  const margin = marginOf(S, m);
  let h = '<div class="between"><h2>TRADE</h2><span class="tiny muted" data-tip="Sell price = buy price x margin. Trade Charter and a staffed Trade Post improve it.">margin '+Math.round(margin*100)+'%</span></div>';
  if(!S.caravan.active){
    const inT = (m.caravanEvery - (S.turn % m.caravanEvery)) || m.caravanEvery;
    h += '<div class="card">No caravan is here. The next one is due in <b>'+inT+'</b> turn'+(inT===1?'':'s')+
      '.<div class="tiny muted">Caravans arrive every '+m.caravanEvery+' turns and stay 2 turns. Trade Posts and the Caravan Rumour event make them bigger.</div></div>';
  } else {
    h += '<div class="card"><div class="between"><b>Caravan in the yard</b><span class="pill avail">leaves in '+S.caravan.left+'</span></div>'+
      '<div class="tiny">It carries <b>'+fmt(S.caravan.scrip)+' Scrip</b> and will not buy beyond that.</div>'+
      '<div class="row" style="margin-top:5px"><button class="btn sm" data-act="hire" data-tip="A caravan hand joins the roster (skill 2-3, random job). Price rises with your population: 42 + 7 x pop. Two per visit.">Hire a hand ('+hireCost(S)+' Scrip)</button>'+
      '<span class="tiny muted">'+(2 - S.caravan.hires)+' available this visit</span></div></div>';
  }
  h += '<div class="card" style="overflow-x:auto"><table><thead><tr><th>Good</th><th>You</th><th>Buy</th><th>Sell</th><th>Market</th>'+
    (S.caravan.active?'<th>Theirs</th><th>Qty</th><th>Deal</th>':'')+'</tr></thead><tbody>';
  TRADE_IDS.forEach(r=>{
    const p = priceOf(S,r), sp = sellPriceOf(S,r), idx = S.market.index[r];
    const ratio = S.res[r]/Math.max(1,caps[r]);
    const q = UI.qty[r] || 1;
    const arrow = idx > 1.08 ? '&#9650; high' : idx < 0.92 ? '&#9660; low' : '&#9644; flat';
    const tip = RES_BY[r].name+'\nBuy '+fmt2(p)+' Scrip each, sell '+fmt2(sp)+
      '\nBase '+fmt2(BASE_PRICE[r])+' x global index '+fmt2(idx)+' x scarcity '+fmt2(0.72+0.56*(1-ratio))+
      '\nScarcity comes from your own store: '+fmt(S.res[r])+'/'+caps[r]+' - the emptier you are, the more they charge.'+
      '\nThe global index drifts every turn and reverts slowly toward 1.00.';
    h += '<tr data-tip="'+esc(tip)+'"><td>'+RES_BY[r].name+'</td>'+
      '<td>'+fmt(S.res[r])+'</td><td>'+fmt2(p)+'</td><td>'+fmt2(sp)+'</td>'+
      '<td>'+fmt2(idx)+' '+arrow+'</td>';
    if(S.caravan.active){
      h += '<td>'+(S.caravan.stock[r]||0)+'</td>'+
        '<td class="row"><button class="btn tiny" data-act="qty" data-r="'+r+'" data-d="-5" data-tip="minus 5">&laquo;</button>'+
        '<button class="btn tiny" data-act="qty" data-r="'+r+'" data-d="-1" data-tip="minus 1">&minus;</button>'+
        '<b>'+q+'</b>'+
        '<button class="btn tiny" data-act="qty" data-r="'+r+'" data-d="1" data-tip="plus 1">+</button>'+
        '<button class="btn tiny" data-act="qty" data-r="'+r+'" data-d="5" data-tip="plus 5">&raquo;</button></td>'+
        '<td class="row"><button class="btn tiny" data-act="buy" data-r="'+r+'" data-tip="Buy '+q+' for '+fmt(p*q)+' Scrip">Buy</button>'+
        '<button class="btn tiny" data-act="sell" data-r="'+r+'" data-tip="Sell '+q+' for '+fmt(sp*q)+' Scrip">Sell</button></td>';
    }
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

      '<h2>EVENT &middot; '+esc(p.name)+'</h2><p>'+esc(p.text)+'</p>'+
      p.options.map(o=>'<button class="choice" data-act="choice" data-i="'+o.i+'"'+(o.ok?'':' disabled')+'>'+
        '<b>'+esc(o.label)+'</b><span>'+esc(o.tip)+(o.ok?'':' [unavailable right now]')+'</span></button>').join('')+
      '<div class="tiny muted">The turn finishes once you answer.</div></div></div>';
    return;
  }
  if(S.over && !UI.hideSummary){
    const sc = scoreOf(S);
    el.innerHTML = '<div class="overlay"><div class="modal" role="dialog" aria-modal="true">'+
      '<h2>'+(S.won?'VICTORY':'RUN OVER')+' &middot; TURN '+S.turn+'</h2>'+
      '<p>'+esc(S.ending)+'</p>'+
      '<table><thead><tr><th>Component</th><th>Value</th><th>x</th><th>Points</th></tr></thead><tbody>'+
      sc.rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+Math.round(r[1]*r[2])+'</td></tr>').join('')+
      '<tr><td><b>FINAL SCORE</b></td><td></td><td></td><td><b>'+sc.total+'</b></td></tr>'+
      '</tbody></table>'+
      '<div class="row" style="margin-top:8px">'+
      '<button class="btn primary" data-act="newgame">New Game (seed '+esc(UI.seedText)+')</button>'+
      '<button class="btn" data-act="rerollseed">New Game (next seed)</button>'+
      '<button class="btn" data-act="closesummary">Look around</button></div></div></div>';
    return;
  }
  el.innerHTML = '';
}

function render(){
  renderStatus();
  renderResBar();
  renderTabs();
  const panel = document.getElementById('panel');
  panel.innerHTML =
    UI.tab === 'map' ? renderMap() :
    UI.tab === 'people' ? renderPeople() :
    UI.tab === 'research' ? renderResearch() :
    UI.tab === 'trade' ? renderTrade() :
    UI.tab === 'log' ? renderLog() : renderDev();
  renderOverlay();
  if(UI.toast){
    const t = document.createElement('div');
    t.className = 'tiny';
    t.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:12px;background:#2a2119;border:1px solid var(--warn);padding:5px 9px;border-radius:3px;z-index:95';
    t.textContent = UI.toast;
    document.body.appendChild(t);
    const msg = UI.toast;
    setTimeout(()=>{ if(t.parentNode) t.parentNode.removeChild(t); if(UI.toast === msg) UI.toast = ''; }, 2200);
    UI.toast = '';
  }
}
function toast(msg){ UI.toast = msg; }

/* ------------------------------------------------------------- actions */
function doEndTurn(){
  if(S.pending){ toast('Answer the event first.'); return; }
  if(S.over){ toast('The run is over - start a new game from the Dev tab.'); return; }
  const r = endTurn(S, {});
  if(!r.ok) toast(r.why);
  UI.hideSummary = false;
}
function startNewGame(seed){
  S = newGame(seed);
  UI.sel = -1;
  UI.hideSummary = false;
  UI.loadMsg = '';
  UI.seedText = String(seed);
}
function handle(act, ds){
  switch(act){
    case 'tab': UI.tab = ds.tab; break;
    case 'endturn': doEndTurn(); break;
    case 'seltile': UI.sel = (UI.sel === +ds.i ? -1 : +ds.i); break;
    case 'build': { const r = buildAt(S, +ds.i, ds.b); if(!r.ok) toast(r.why); break; }
    case 'demolish': { const r = demolishAt(S, +ds.i); if(!r.ok) toast(r.why); break; }
    case 'repair': { const r = startRepair(S, +ds.i); if(!r.ok) toast(r.why); break; }
    case 'assign': { const r = assign(S, +ds.id, +ds.i); if(!r.ok) toast(r.why); break; }
    case 'unassign': assign(S, +ds.id, -1); break;
    case 'autoassign': { const n = greedyAssign(S); toast(n + ' colonists posted by the greedy policy.'); break; }
    case 'restall': S.colonists.forEach(c=>{ c.at = -1; }); toast('Everyone stood down to rest.'); break;
    case 'retrain': {
      const c = S.colonists.find(x=>x.id === +ds.id);
      if(c){
        c.job = JOB_IDS[(JOB_IDS.indexOf(c.job) + 1) % JOB_IDS.length];
        c.skill = Math.max(1, c.skill - 1);
        c.morale = clamp(c.morale - 10, 0, 100);
        addLog(S,'info', c.name + ' retrained as a ' + JOBS[c.job].name + ' (-1 skill, -10 morale).');
      }
      break;
    }
    case 'research': { const r = doResearch(S, ds.id); if(!r.ok) toast(r.why); break; }
    case 'qty': { const r = ds.r; UI.qty[r] = clamp((UI.qty[r]||1) + (+ds.d), 1, 999); break; }
    case 'buy': { const r = tradeBuy(S, ds.r, UI.qty[ds.r]||1); if(!r.ok) toast(r.why); break; }
    case 'sell': { const r = tradeSell(S, ds.r, UI.qty[ds.r]||1); if(!r.ok) toast(r.why); break; }
    case 'hire': { const r = tradeHire(S); if(!r.ok) toast(r.why); break; }
    case 'choice': {
      const r = applyChoice(S, +ds.i);
      if(!r.ok){ toast(r.why); break; }
      finishTurn(S, {});
      break;
    }
    case 'newgame': {
      const n = parseInt(UI.seedText, 10);
      startNewGame(isFinite(n) && n > 0 ? n : 1337);
      break;
    }
    case 'rerollseed': startNewGame((S.seed + 1) >>> 0); break;
    case 'closesummary': UI.hideSummary = true; break;
    case 'save':
      UI.saveText = serialize(S);
      UI.loadMsg = 'OK: save written to the box (' + UI.saveText.length + ' characters, hash ' + stateHash(S) + '). Select it and copy it out.';
      break;
    case 'clearbox': UI.saveText = ''; UI.loadMsg = ''; break;
    case 'load':
      try {
        const loaded = deserialize(UI.saveText);
        S = loaded;
        UI.sel = -1;
        UI.seedText = String(S.seed);
        UI.hideSummary = false;
        UI.loadMsg = 'OK: loaded turn ' + S.turn + ', ' + S.colonists.length + ' colonists, hash ' + stateHash(S) + '.';
      } catch(err){
        UI.loadMsg = '! Load failed: ' + err.message + '. Your current game is untouched.';
      }
      break;
    case 'tests': {
      const r = runTests(S);
      const lines = r.rows.map(x=>(x.ok ? '<span class="ok">PASS</span> ' : '<span class="fail">FAIL</span> ') +
        esc(x.name) + (x.note ? '  <span class="fail">&larr; ' + esc(x.note) + '</span>' : ''));
      UI.devOut = '<b>' + r.pass + ' passed, ' + r.fail + ' failed, ' + (r.pass + r.fail) + ' assertions.</b>\n' + lines.join('\n');
      break;
    }
    case 'bench': {
      const seed = parseInt(UI.seedText, 10);
      const b = runBenchmark(isFinite(seed) && seed > 0 ? seed : S.seed, 200);
      UI.devOut =
        '<b>BENCHMARK - 200 turns, greedy policy, seed ' + (isFinite(seed) && seed > 0 ? seed : S.seed) + '</b>\n' +
        'final state hash : <b>' + b.hash + '</b>\n' +
        'second identical run : ' + b.hash2 + '  ' +
        (b.hash === b.hash2 ? '<span class="ok">MATCH (deterministic)</span>' : '<span class="fail">MISMATCH</span>') + '\n' +
        'turns simulated  : ' + b.turns + '\n' +
        'population       : ' + b.pop + ' (peak ' + b.peakPop + ')\n' +
        'research done    : ' + b.research + '/' + RESEARCH.length + '\n' +
        'buildings        : ' + b.buildings + '\n' +
        'storms weathered : ' + b.storms + '\n' +
        'events fired     : ' + b.events + '\n' +
        'arrivals / departures : ' + b.arrivals + ' / ' + b.departures + '\n' +
        'turns with a shortage : ' + b.shortTurns + '\n' +
        'resources lost to overflow : ' + fmt(b.overflow) + '\n' +
        'avg morale / skill : ' + fmt(b.morale) + ' / ' + fmt2(b.skill) + '\n' +
        'stock            : ' + RES_IDS.map(r=>r + ' ' + fmt(b.res[r])).join(', ') + '\n' +
        'score            : ' + b.score;
      break;
    }
  }
  render();
}

/* ------------------------------------------------------------- tooltips */
function showTip(el, x, y){
  const tip = document.getElementById('tip');
  const txt = el.getAttribute('data-tip');
  if(!txt) return;
  tip.textContent = txt;
  tip.style.display = 'block';
  const r = tip.getBoundingClientRect();
  let left = x + 14, top = y + 16;
  if(left + r.width > window.innerWidth - 6) left = Math.max(4, window.innerWidth - r.width - 6);
  if(top + r.height > window.innerHeight - 6) top = Math.max(4, y - r.height - 12);
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}
function hideTip(){ document.getElementById('tip').style.display = 'none'; }

/* ----------------------------------------------------------------- init */
function initUI(){
  const near = (e, sel)=> (e.target && e.target.closest) ? e.target.closest(sel) : null;
  document.addEventListener('click', e=>{
    const el = near(e, '[data-act]');
    if(!el) return;
    const act = el.getAttribute('data-act');
    if(act === 'seedin' || act === 'savebox') return;
    if(el.disabled) return;
    e.preventDefault();
    hideTip();
    handle(act, el.dataset);
  });
  document.addEventListener('change', e=>{
    const el = near(e, '[data-act]');
    if(!el) return;
    const act = el.getAttribute('data-act');
    if(act === 'post'){
      const r = assign(S, +el.dataset.id, parseInt(el.value, 10));
      if(!r.ok) toast(r.why);
      render();
    }
  });
  document.addEventListener('input', e=>{
    const el = near(e, '[data-act]');
    if(!el) return;
    const act = el.getAttribute('data-act');
    if(act === 'seedin') UI.seedText = el.value;
    if(act === 'savebox') UI.saveText = el.value;
  });
  document.addEventListener('mousemove', e=>{
    const el = near(e, '[data-tip]');
    if(el) showTip(el, e.clientX, e.clientY); else hideTip();
  });
  document.addEventListener('mouseleave', hideTip);
  document.addEventListener('touchstart', e=>{
    const el = near(e, '[data-tip]');
    if(!el){ hideTip(); return; }
    const t = e.touches[0];
    showTip(el, t.clientX, t.clientY);
    clearTimeout(showTip._t);
    showTip._t = setTimeout(hideTip, 4000);
  }, {passive:true});
  document.addEventListener('keydown', e=>{
    const tag = (e.target.tagName || '').toLowerCase();
    if(tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if(e.key === ' ' || e.code === 'Space'){
      e.preventDefault();
      if(!S.pending) doEndTurn();
      render();
      return;
    }
    const n = parseInt(e.key, 10);
    if(n >= 1 && n <= TABS.length){
      UI.tab = TABS[n-1].id;
      render();
    }
    if(e.key === 'Escape'){ hideTip(); UI.hideSummary = true; render(); }
  });
  render();
}

/* headless access for verification harnesses; harmless in the browser */
globalThis.ASHFALL = {
  VERSION, newGame, endTurn, greedyTurn, greedyAssign, greedyBuild, runTests, runBenchmark,
  serialize, deserialize, stateHash, computeMods, scoreOf, BLD, RESEARCH, EVENTS, TURN_PHASES,
  get state(){ return S; }
};

if(typeof document !== 'undefined' && document.getElementById && document.getElementById('panel')) initUI();
</script>
