<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASHFALL OUTPOST</title>
<style>
:root{
  --bg:#12100e; --panel:#1b1815; --panel2:#221e19; --line:#3a352c; --line2:#544a38;
  --ink:#e9e2d5; --dim:#a2988a; --gold:#d9a441; --warn:#e07a3c; --bad:#d1524a; --good:#7fae5a; --cool:#5f97b5;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0 0 6px 0;font-weight:700;letter-spacing:.06em}
h2{font-size:14px;color:var(--gold)}
h3{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em}
#app{max-width:1180px;margin:0 auto;padding:6px}
header#top{position:sticky;top:0;z-index:20;background:linear-gradient(#12100e,#12100e 70%,rgba(18,16,14,.92));padding-bottom:4px;border-bottom:1px solid var(--line)}
.titlerow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.brand{font-size:15px;font-weight:700;letter-spacing:.18em;color:var(--gold)}
.brand small{display:block;font-size:10px;letter-spacing:.08em;color:var(--dim);font-weight:400}
.spacer{flex:1 1 auto}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:3px;padding:5px 9px;cursor:pointer}
.btn:hover:not(:disabled){background:#2f2820;border-color:var(--gold)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:#4a3a17;border-color:var(--gold);font-weight:700}
.btn.sm{padding:2px 6px;font-size:11px}
.btn.tiny{padding:0 5px;font-size:11px;line-height:17px}
input[type=text],input[type=number],textarea,select{
  background:#0d0c0a;color:var(--ink);border:1px solid var(--line2);border-radius:3px;padding:3px 5px;font:inherit
}
input[type=text]{width:82px}
textarea{width:100%;min-height:96px;font-size:11px;line-height:1.3}
.resbar{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.chip{display:flex;align-items:baseline;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:2px 6px;cursor:help}
.chip b{font-weight:700}
.chip .v{color:var(--gold)}
.chip .d{font-size:10px;color:var(--dim)}
.chip.low{border-color:var(--bad)}
.chip.full{border-color:var(--cool)}
nav.tabs{display:flex;gap:3px;overflow-x:auto;margin-top:4px;scrollbar-width:thin}
.tab-btn{background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:3px 3px 0 0;padding:5px 10px;cursor:pointer;white-space:nowrap}
.tab-btn[aria-selected=true]{background:#3a2f1c;border-color:var(--line2);color:#fff;font-weight:700;box-shadow:inset 0 -2px 0 var(--gold)}
.tab-btn .k{font-size:10px;color:var(--dim)}
main{border:1px solid var(--line);border-radius:0 3px 3px 3px;background:var(--panel);padding:8px;min-height:60vh}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media(min-width:760px){.cols{grid-template-columns:minmax(320px,420px) minmax(0,1fr)}}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:7px;margin-bottom:8px}
.muted{color:var(--dim)}
.tiny{font-size:11px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.between{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap}
hr{border:0;border-top:1px solid var(--line);margin:6px 0}
/* ---- map ---- */
#grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;max-width:440px;margin:0 auto}
.tile{position:relative;aspect-ratio:1/1;background:#191612;border:1px solid var(--line);border-radius:2px;cursor:pointer;padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.tile:hover{border-color:var(--gold)}
.tile.sel{border-color:#fff;box-shadow:0 0 0 1px #fff inset}
.tile.t-ash{background:#1f1b16}
.tile.t-rock{background:#26241f}
.tile.t-water{background:#16232b}
.tile.t-vent{background:#2c1d16}
.tile.t-ruins{background:#221c22}
.tile .terr{position:absolute;top:0;left:2px;font-size:9px;color:#8b8172;opacity:.9}
.tile .code{font-size:12px;font-weight:700;letter-spacing:-.02em}
.tile .st{position:absolute;bottom:-1px;right:2px;font-size:9px;color:var(--dim)}
.tile .hz{position:absolute;bottom:-1px;left:2px;font-size:9px}
.tile.dmg{border-style:dashed;border-color:var(--warn)}
.tile.off{border-color:var(--bad);border-style:dashed}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:11px;color:var(--dim);margin-top:6px;justify-content:center}
/* ---- lists ---- */
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{text-align:left;padding:3px 4px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:400;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.bar{position:relative;height:9px;background:#0d0c0a;border:1px solid var(--line);border-radius:2px;overflow:hidden;min-width:52px}
.bar i{display:block;height:100%}
.bar b{position:absolute;inset:0;font-size:9px;line-height:9px;text-align:center;font-weight:400;color:#fff;text-shadow:0 0 2px #000}
.pill{display:inline-block;border:1px solid var(--line2);border-radius:8px;padding:0 5px;font-size:10px;letter-spacing:.04em}
.pill.done{border-color:var(--good);color:var(--good)}
.pill.avail{border-color:var(--gold);color:var(--gold)}
.pill.lock{border-color:var(--line2);color:var(--dim)}
.pill.bad{border-color:var(--bad);color:var(--bad)}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.log{max-height:62vh;overflow:auto;font-size:12px}
.log div{padding:2px 3px;border-bottom:1px solid #221f1a;display:flex;gap:5px;align-items:flex-start}
.log .t{color:var(--dim);min-width:34px;text-align:right}
.log .k{min-width:12px;text-align:center}
.k-good{color:var(--good)} .k-bad{color:var(--bad)} .k-warn{color:var(--warn)} .k-info{color:var(--cool)} .k-turn{color:var(--gold);font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.node{border:1px solid var(--line);border-radius:3px;padding:6px;background:#1d1a15}
.node.avail{border-color:var(--gold)}
.node.done{border-color:var(--good);opacity:.85}
.node.lock{opacity:.62}
/* ---- overlays ---- */
#tip{position:fixed;z-index:90;max-width:290px;background:#0b0a09;border:1px solid var(--line2);border-radius:3px;padding:5px 7px;font-size:11px;line-height:1.4;white-space:pre-wrap;pointer-events:none;display:none;box-shadow:0 4px 14px rgba(0,0,0,.6)}
#tip b{color:var(--gold)}
.overlay{position:fixed;inset:0;background:rgba(8,7,6,.82);z-index:80;display:flex;align-items:center;justify-content:center;padding:10px}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:4px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:12px}
.choice{display:block;width:100%;text-align:left;margin:5px 0;padding:7px 9px;background:var(--panel2);border:1px solid var(--line2);border-radius:3px;cursor:pointer}
.choice:hover{border-color:var(--gold);background:#2f2820}
.choice b{color:var(--gold)}
.choice span{display:block;font-size:11px;color:var(--dim);margin-top:2px}
pre{white-space:pre-wrap;font-size:11px;line-height:1.35;background:#0d0c0a;border:1px solid var(--line);border-radius:3px;padding:6px;max-height:52vh;overflow:auto;margin:6px 0}
.ok{color:var(--good)} .fail{color:var(--bad)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:420px){
  #app{padding:4px}
  .brand{font-size:13px}
  .tile .code{font-size:11px}
  th,td{padding:2px 3px;font-size:11px}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="titlerow">
      <div class="brand">ASHFALL OUTPOST<small>turn-based survival under the ashfall</small></div>
      <div class="spacer"></div>
      <div id="statusline" class="row tiny"></div>
      <button class="btn primary" data-act="endturn" id="endBtn">End Turn <span class="muted">[Space]</span></button>
    </div>
    <div class="resbar" id="resbar"></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </header>
  <main id="panel" role="tabpanel"></main>
  <div class="tiny muted" style="padding:6px 2px">Keys: <b>Space</b> end turn &middot; <b>1-6</b> switch tabs &middot; hover or tap any number for its breakdown.</div>
</div>
<div id="tip" role="tooltip"></div>
<div id="overlay"></div>
<script>
"use strict";
/* ===========================================================================
   ASHFALL OUTPOST - single file, no external resources, no browser storage.

   ASSUMPTIONS (made without asking, per the brief):
   1.  "Resources" are the six headline goods (food, water, metal, power, parts,
       scrip) plus three intermediate goods that make the chains real: ash, ore
       and soil. All nine have storage caps and can overflow.
   2.  Power is a stored battery charge, not an instantaneous rating. Generators
       fill it, processors drain it, and a brownout scales processing down
       proportionally instead of hard-failing.
   3.  Building is instant once the cost is paid; there is no construction time.
       Demolition refunds 50% of the metal cost, rounded down.
   4.  Research is bought outright with scrip+parts (one node per turn). Tier 2
       nodes need a built Lab; tier 3 nodes need a Lab with a working scholar.
   5.  A colonist "leaves" (walks into the ash) after two consecutive turns at
       zero morale. Below 20 morale they refuse to work but stay and recover.
   6.  Win/lose is evaluated at turn 60: population >= 12, no shortage that turn,
       food and water in store and average morale >= 45. Population 0 is an
       immediate loss. Reaching turn 60 without meeting the bar ends the run as
       a scored failure rather than dragging on.
   7.  Save/load is copy-paste JSON in a textarea (Dev tab). Nothing is written
       to localStorage/sessionStorage/IndexedDB/cookies - state lives in memory.
   8.  Tooltips use a custom panel so they work on hover AND on tap.
   9.  The benchmark uses the same greedy policy as the "Auto-Assign" button plus
       a fixed build/trade/research plan, and ignores the turn-60 ending so it
       can run the full 200 turns.
   10. Determinism: one mulberry32 stream lives in the save (S.rngState); the map
       uses a second stream seeded from the same seed. Math.random is never used
       anywhere (the test suite asserts this by trapping it).
   =========================================================================== */

const VERSION = 'ashfall-1';
const MAP_W = 8, MAP_H = 8, MAP_N = MAP_W * MAP_H;
const WIN_TURN = 60, WIN_POP = 12, WIN_MORALE = 45;

/* ---------------------------------------------------------------- utility */
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const sum = (a)=> a.reduce((x,y)=>x+y,0);
function fmt(n){
  if(!isFinite(n)) return '0';
  const r = Math.round(n*10)/10;
  return Math.abs(r) >= 100 ? String(Math.round(r)) : String(r);
}
function fmt2(n){ return (Math.round(n*100)/100).toFixed(2); }
function sgn(n){ return (n>0?'+':'') + fmt(n); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ------------------------------------------------------------------- rng */
/* mulberry32; the stream state is a plain int32 so it survives JSON round-trip */
function rng(S){
  S.rngState = (S.rngState + 0x6D2B79F5) | 0;
  let t = S.rngState;
  t = Math.imul(t ^ (t >>> 15), 1 | t);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rngInt(S,n){ return Math.floor(rng(S)*n); }
function rngRange(S,a,b){ return a + rng(S)*(b-a); }
function rngPick(S,arr){ return arr[rngInt(S,arr.length)]; }
function makeStream(seed){ return { rngState: seed|0 }; }   // standalone stream

/* --------------------------------------------------------------- hashing */
function stableStringify(v){
  if(v === undefined) return 'null';
  if(v === null || typeof v !== 'object') return JSON.stringify(v);
  if(Array.isArray(v)) return '[' + v.map(stableStringify).join(',') + ']';
  const ks = Object.keys(v).sort();
  return '{' + ks.map(k => JSON.stringify(k)+':'+stableStringify(v[k])).join(',') + '}';
}
function fnv1a(str){
  let h = 0x811c9dc5;
  for(let i=0;i<str.length;i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return ('00000000' + h.toString(16)).slice(-8);
}
const r6 = (n)=> Math.round(n*1e6)/1e6;
/* canonical projection of the whole simulation state -> 8 hex chars */
function stateHash(S){
  const o = {
    v:VERSION, seed:S.seed, rng:S.rngState, turn:S.turn, over:S.over?1:0, won:S.won?1:0,
    res: Object.keys(S.res).sort().map(k=>[k, r6(S.res[k])]),
    map: S.map.map(t=>[t.terr, t.b||'', t.b?r6(t.integrity):0, t.repairing?1:0]),
    col: S.colonists.map(c=>[c.id,c.name,c.job,r6(c.skill),r6(c.fatigue),r6(c.morale),c.at,c.zeroT]),
    pop: S.pop,
    tech: S.research.slice().sort(),
    mk: Object.keys(S.market.index).sort().map(k=>[k, r6(S.market.index[k])]),
    cv: [S.caravan.active?1:0, S.caravan.left, r6(S.caravan.scrip), S.caravan.boost,
         Object.keys(S.caravan.stock).sort().map(k=>[k, r6(S.caravan.stock[k])])],
    st: [S.storm.next, S.storm.count, S.storm.lastSev, S.storm.activeThisTurn?1:0],
    ev: Object.keys(S.evCd).sort().map(k=>[k,S.evCd[k]]),
    stats: Object.keys(S.stats).sort().map(k=>[k, r6(S.stats[k])]),
    logN: S.log.length
  };
  return fnv1a(stableStringify(o));
}

/* ------------------------------------------------------------- resources */
const RESOURCES = [
  {id:'food',  name:'Food',  code:'FOO', base:60,  core:true,  desc:'Eaten every turn. Running out starves the outpost.'},
  {id:'water', name:'Water', code:'WAT', base:60,  core:true,  desc:'Drunk every turn and burned by the greenhouse line. Ashstorms spike demand.'},
  {id:'metal', name:'Metal', code:'MET', base:80,  core:true,  desc:'Construction material. Smelted from ore at the Forge.'},
  {id:'power', name:'Power', code:'PWR', base:40,  core:true,  desc:'Stored charge. Generators fill it, Forge and Workshop drain it.'},
  {id:'parts', name:'Parts', code:'PRT', base:40,  core:true,  desc:'Machined goods. Needed for advanced buildings, research and repairs.'},
  {id:'scrip', name:'Scrip', code:'SCR', base:300, core:true,  desc:'Trade currency. Buys research, caravan goods and new hands.'},
  {id:'ash',   name:'Ash',   code:'ASH', base:60,  core:false, desc:'Raw ashfall. Feeds the Compost line.'},
  {id:'ore',   name:'Ore',   code:'ORE', base:60,  core:false, desc:'Rough rock. Feeds the Forge.'},
  {id:'soil',  name:'Soil',  code:'SOI', base:40,  core:false, desc:'Composted ash. Feeds the Greenhouse.'}
];
const RES_IDS = RESOURCES.map(r=>r.id);
const RES_BY = {}; RESOURCES.forEach(r=>RES_BY[r.id]=r);

/* --------------------------------------------------------------- terrain */
const TERRAIN = {
  ash:   {name:'Ash Flat',  glyph:'░', buildable:true,  desc:'Deep grey drift. Most things can stand on it.'},
  rock:  {name:'Rock',      glyph:'▲', buildable:true,  desc:'Exposed basalt. Mines and stable footings.'},
  water: {name:'Meltwater', glyph:'≈', buildable:false, desc:'Cannot be built on. Boosts anything adjacent that handles water.'},
  vent:  {name:'Vent',      glyph:'∿', buildable:true,  desc:'Hot gas fissure. Vent Taps sit here; Forges love being next door.'},
  ruins: {name:'Ruins',     glyph:'▩', buildable:true,  desc:'Pre-eruption wreckage. Salvage Yards and Workshops thrive here.'}
};
const TERR_IDS = Object.keys(TERRAIN);

/* ------------------------------------------------------------------ jobs */
const JOBS = {
  labor:   {name:'Labor',   short:'LAB', desc:'Ashworks, Mine, Salvage Yard.'},
  tech:    {name:'Tech',    short:'TEC', desc:'Forge, Workshop, Vent Tap, and repair crews.'},
  grower:  {name:'Grower',  short:'GRO', desc:'Condenser, Compost, Greenhouse.'},
  scholar: {name:'Scholar', short:'SCH', desc:'Lab and Trade Post.'}
};
const JOB_IDS = Object.keys(JOBS);

/* ------------------------------------------------------------- buildings */
/* prod.in / prod.out are per unit of worker effort ("rate").
   Inputs scale with rate * integrity.
   Outputs scale with rate * integrity * (1 + adjacency%) * research multiplier.
   That is why research and adjacency are true yield improvements, not just
   bigger throughput. */
const BLD = {
  shelter:{name:'Shelter', code:'Sh', cost:{metal:8}, terr:['ash','rock','ruins'], slots:0,
    beds:4, cat:'none',
    adj:{terr:'rock', beds:1, max:2, text:'+1 bed per adjacent Rock (max 2)'},
    desc:'Bunks. Colonists without a bed lose morale every turn.'},
  cistern:{name:'Cistern', code:'Ci', cost:{metal:7}, terr:['ash','rock'], slots:0, cat:'none',
    store:{water:60},
    adj:{terr:'water', store:{water:30}, max:1, text:'+30 Water storage if adjacent to Meltwater'},
    desc:'Raises the Water storage cap so condenser output is not thrown away.'},
  silo:{name:'Silo', code:'Si', cost:{metal:9}, terr:['ash','rock'], slots:0, cat:'none',
    store:{food:50, ash:40, soil:30, ore:40},
    adj:{terr:'rock', store:{food:15}, max:2, text:'+15 Food storage per adjacent Rock (max 2)'},
    desc:'Raises Food / Ash / Soil / Ore storage caps.'},
  condenser:{name:'Condenser', code:'Cn', cost:{metal:10}, terr:['ash','rock'], slots:2, job:'grower',
    cat:'extract', prod:{out:{water:3.4}},
    adj:{terr:'water', pct:0.40, max:2, text:'+40% output per adjacent Meltwater (max 2)'},
    desc:'Wrings drinkable water out of ash-heavy air.'},
  ashworks:{name:'Ashworks', code:'Aw', cost:{metal:6}, terr:['ash'], slots:2, job:'labor',
    cat:'extract', prod:{out:{ash:4.5}},
    adj:{terr:'ash', pct:0.12, max:3, text:'+12% output per adjacent Ash Flat (max 3)'},
    desc:'Scrapes and sifts raw ashfall. Head of the food chain.'},
  mine:{name:'Mine', code:'Mn', cost:{metal:12}, terr:['rock'], slots:2, job:'labor',
    cat:'extract', prod:{out:{ore:3.0}},
    adj:{terr:'rock', pct:0.20, max:3, text:'+20% output per adjacent Rock (max 3)'},
    desc:'Breaks ore out of the basalt. Head of the metal chain.'},
  salvage:{name:'Salvage Yard', code:'Sv', cost:{metal:6}, terr:['ruins'], slots:2, job:'labor',
    cat:'extract', prod:{out:{parts:0.45, scrip:1.4, metal:0.55}},
    adj:{terr:'ruins', pct:0.20, max:3, text:'+20% output per adjacent Ruins (max 3)'},
    desc:'Strips the old town for parts, scrap and tradeables. The early parts supply.'},
  compost:{name:'Compost Vats', code:'Cp', cost:{metal:6}, terr:['ash','ruins'], slots:1, job:'grower',
    cat:'process', prod:{in:{ash:2.8, water:0.7}, out:{soil:2.1}},
    adj:{terr:'ash', pct:0.20, max:2, text:'+20% output per adjacent Ash Flat (max 2)'},
    desc:'Ash + water -> soil. The link the greenhouse cannot live without.'},
  greenhouse:{name:'Greenhouse', code:'Gh', cost:{metal:12, parts:2}, terr:['ash','rock'], slots:2, job:'grower',
    cat:'process', prod:{in:{soil:1.6, water:1.6}, out:{food:2.4}},
    adj:{terr:'water', pct:0.30, max:2, text:'+30% output per adjacent Meltwater (max 2)'},
    desc:'Soil + water -> food under sealed sheeting.'},
  forge:{name:'Forge', code:'Fg', cost:{metal:14, parts:2}, terr:['rock','ash'], slots:2, job:'tech',
    cat:'process', prod:{in:{ore:2.5, power:2.5}, out:{metal:1.8}},
    adj:{terr:'vent', pct:0.50, powerCut:0.30, max:2, text:'+50% output and -30% power draw per adjacent Vent (max 2)'},
    desc:'Ore + power -> metal. Sits next to a vent if you plan ahead.'},
  workshop:{name:'Workshop', code:'Wk', cost:{metal:16, parts:4}, terr:['ash','rock','ruins'], slots:2, job:'tech',
    cat:'process', tech:'machining', prod:{in:{metal:1.6, power:2.0}, out:{parts:1.2}},
    adj:{terr:'ruins', pct:0.25, max:2, text:'+25% output per adjacent Ruins (max 2)'},
    desc:'Metal + power -> parts. Unlocked by Machining.'},
  venttap:{name:'Vent Tap', code:'Vt', cost:{metal:12, parts:3}, terr:['vent'], slots:1, job:'tech',
    cat:'power', tech:'venttap', prod:{out:{power:5.0}}, store:{power:10},
    adj:{terr:'rock', pct:0.15, max:2, text:'+15% output per adjacent Rock (max 2)'},
    desc:'Turbine over a gas fissure. Unlocked by Vent Tapping. +10 Power storage.'},
  solar:{name:'Ash Panel', code:'So', cost:{metal:8}, terr:['ash','rock','ruins'], slots:0,
    cat:'power', passive:true, prod:{out:{power:2.0}},
    adj:{terr:'ash', pct:0.10, max:2, text:'+10% output per adjacent Ash Flat (max 2)'},
    desc:'Unstaffed trickle of power. Output halves on ashstorm turns.'},
  windbreak:{name:'Windbreak', code:'Wb', cost:{metal:5}, terr:['ash','rock','ruins','vent'], slots:0, cat:'none',
    shieldAdj:0.35,
    adj:{terr:'rock', shield:0.05, max:2, text:'+5 percentage points of shielding per adjacent Rock (max 2)'},
    desc:'Baffle wall. Cuts ashstorm damage to the 4 buildings beside it by 35%.'},
  bunker:{name:'Storm Bunker', code:'Bk', cost:{metal:20, parts:8}, terr:['rock','ash'], slots:0, cat:'none',
    tech:'bunkerframes', shieldAll:0.22,
    adj:{terr:'rock', shieldAllBonus:0.04, max:2, text:'+4 percentage points of outpost-wide shielding per adjacent Rock (max 2)'},
    desc:'Hardened core. Cuts ashstorm damage across the whole outpost by 22%.'},
  lab:{name:'Lab', code:'Lb', cost:{metal:14, parts:6}, terr:['ash','rock','ruins'], slots:2, job:'scholar',

function moraleAll(S, d, why){
  const m = computeMods(S);
  const dd = d < 0 ? d * m.moraleLossMult : d;
  S.colonists.forEach(c=> c.morale = clamp(c.morale + dd, 0, 100));
  return dd;
}
function fatigueAll(S, d, onlyWorking){
  S.colonists.forEach(c=>{ if(!onlyWorking || c.at >= 0) c.fatigue = clamp(c.fatigue + d, 0, 100); });
}
function pickColonist(S){
  if(!S.colonists.length) return null;
  return S.colonists[rngInt(S, S.colonists.length)];

function genMap(seed){
  const st = makeStream((seed ^ 0x5f356495) | 0);
  const tiles = [];
  for(let i=0;i<MAP_N;i++){
    const r = rng(st);
    let terr;
    if(r < 0.10) terr = 'water';
    else if(r < 0.17) terr = 'vent';
    else if(r < 0.29) terr = 'ruins';
    else if(r < 0.54) terr = 'rock';
    else terr = 'ash';
    tiles.push({terr:terr, b:null, integrity:100, repairing:false});
  }
  // guarantee a playable map: at least 3 water, 2 vent, 3 ruins, 8 rock, 12 ash
  const need = {water:3, vent:2, ruins:3, rock:8, ash:12};
  for(const t of TERR_IDS){
    let have = tiles.filter(x=>x.terr===t).length;
    let guard = 0;
    while(have < need[t] && guard++ < 400){
      const i = rngInt(st, MAP_N);
      const cur = tiles[i].terr;
      if(cur === t) continue;
      if(tiles.filter(x=>x.terr===cur).length <= need[cur]) continue;
      tiles[i].terr = t; have++;
    }
  }
  return tiles;
}
function xyOf(i){ return {x:i%MAP_W, y:Math.floor(i/MAP_W)}; }
function neighbours(i){
  const {x,y} = xyOf(i), out = [];
  if(y>0) out.push(i-MAP_W);
  if(y<MAP_H-1) out.push(i+MAP_W);
  if(x>0) out.push(i-1);
  if(x<MAP_W-1) out.push(i+1);
  return out;
}

function newGame(seed){
  seed = (seed>>>0) || 1;
  const S = {
    v:VERSION, seed:seed, rngState:seed|0, turn:0,
    over:false, won:false, ending:'',
    res:{food:40, water:40, metal:45, power:12, parts:12, scrip:45, ash:10, ore:6, soil:8},
    map:genMap(seed),
    colonists:[], pop:0, nextId:1,
    research:[], researchedThisTurn:false, researchDiscount:0,
    market:{index:{}},
    caravan:{active:false, left:0, stock:{}, scrip:0, boost:0, hires:0},
    storm:{next:7, interval:7, count:0, lastSev:0, activeThisTurn:false, waterMult:1},
    evCd:{}, pending:null,
    lastDelta:{}, shortage:{food:false, water:false},
    stats:{storms:0, arrivals:0, departures:0, events:0, overflow:0, repairs:0, built:0},
    log:[]
  };
  RES_IDS.forEach(r=>{ S.market.index[r] = 1; S.lastDelta[r] = 0; });

  // opening shelter on the most central buildable tile (deterministic)
  let best = -1, bestD = 1e9;
  for(let i=0;i<MAP_N;i++){
    if(!TERRAIN[S.map[i].terr].buildable) continue;
    if(!BLD.shelter.terr.includes(S.map[i].terr)) continue;
    const {x,y} = xyOf(i);
    const d = Math.abs(x-3.5) + Math.abs(y-3.5);
    if(d < bestD){ bestD = d; best = i; }
  }
  if(best >= 0){ S.map[best].b = 'shelter'; S.map[best].integrity = 100; }

  const startJobs = ['labor','grower','tech','grower','scholar'];
  for(let i=0;i<5;i++) addColonist(S, {job:startJobs[i], skill: 1 + rngInt(S,3), morale:70, silent:true});

  addLog(S,'turn','Turn 0 - the ash has been falling for eleven days.');
  addLog(S,'info','Five survivors, one shelter, and whatever the drift will give up. Build, assign, and end the turn.');
  addLog(S,'info','Seed '+seed+'. Win by turn '+WIN_TURN+' with '+WIN_POP+' fed, watered, willing colonists.');
  return S;
}

function addColonist(S, o){
  o = o || {};
  const first = rngPick(S, FIRST_NAMES), last = rngPick(S, LAST_NAMES);
  let name = first + ' ' + last, n = 2;
  while(S.colonists.some(c=>c.name===name)){ name = first + ' ' + last + ' ' + n; n++; }
  const c = {
    id: S.nextId++,
    name: name,
    job: o.job || rngPick(S, JOB_IDS),
    skill: o.skill != null ? o.skill : (1 + rngInt(S,3)),
    fatigue: o.fatigue != null ? o.fatigue : 0,
    morale: o.morale != null ? o.morale : 65,
    at: -1,
    zeroT: 0
  };
  S.colonists.push(c);
  S.pop = S.colonists.length;
  S.stats.arrivals++;
  if(!o.silent) addLog(S,'good', name+' joined the outpost ('+JOBS[c.job].name+', skill '+c.skill+').');
  return c;
}
function removeColonist(S, c, why){
  const i = S.colonists.indexOf(c);
  if(i < 0) return;
  S.colonists.splice(i,1);
  S.pop = S.colonists.length;
  S.stats.departures++;
  addLog(S,'bad', c.name + ' is gone - ' + why + '. Population ' + S.pop + '.');
}

/* ------------------------------------------------------------- inspectors */
function countBuilt(S, id){ let n=0; for(const t of S.map) if(t.b===id) n++; return n; }
function countAnyBuilt(S){ let n=0; for(const t of S.map) if(t.b) n++; return n; }
function countTerr(S, terr){ let n=0; for(const t of S.map) if(t.terr===terr) n++; return n; }
function builtIdx(S, id){ const out=[]; for(let i=0;i<MAP_N;i++) if(S.map[i].b===id) out.push(i); return out; }
function randomBuilt(S){
  const all = []; for(let i=0;i<MAP_N;i++) if(S.map[i].b) all.push(i);
  if(!all.length) return -1;
  return all[rngInt(S, all.length)];
}
function workersAt(S, idx){ return S.colonists.filter(c=>c.at === idx); }
function bedsTotal(S){
  let beds = 0;
  for(let i=0;i<MAP_N;i++){
    if(S.map[i].b !== 'shelter') continue;
    const a = adjInfo(S,i,'shelter');
    beds += (BLD.shelter.beds + a.beds) * integrityFactor(S.map[i]);
  }
  return Math.floor(beds);
}
function avgMorale(S){ return S.colonists.length ? sum(S.colonists.map(c=>c.morale)) / S.colonists.length : 0; }
function avgSkill(S){ return S.colonists.length ? sum(S.colonists.map(c=>c.skill)) / S.colonists.length : 0; }

/* ------------------------------------------------------------ derived mods */
function computeMods(S){
  const m = {
    out:{}, powerCost:{},
    stormDmg:1, stormWater:1, capMult:1, restMult:1, moraleLossMult:1,
    margin:0.68, caravanEvery:7, repairCost:1, medicine:false,
    unlocked:{}
  };
  BLD_IDS.forEach(b=>{ m.out[b] = 1; m.powerCost[b] = 1; });
  S.research.forEach(id=>{ const n = RES_NODE[id]; if(n) n.mod(m); });
  return m;
}
function labDiscount(S){
  let d = 0;
  for(const i of builtIdx(S,'lab')){
    const t = S.map[i];
    const a = adjInfo(S,i,'lab');
    const rate = rateAt(S,i);
    if(rate <= 0) continue;
    d += (BLD.lab.labDiscount + a.lab) * Math.min(1.5, rate) * integrityFactor(t);
  }
  return clamp(d, 0, 0.45);
}
function labStaffed(S){
  for(const i of builtIdx(S,'lab')) if(rateAt(S,i) > 0) return true;
  return false;
}

/* --------------------------------------------------------------- adjacency */
function adjInfo(S, idx, bid){
  const def = BLD[bid];
  const out = {count:0, pct:0, beds:0, store:{}, powerCut:0, shield:0, shieldAll:0, lab:0,
               text: def.adj ? def.adj.text : 'No adjacency bonus.'};
  if(!def.adj) return out;
  const a = def.adj;
  let n = 0;
  for(const j of neighbours(idx)) if(S.map[j].terr === a.terr) n++;
  n = Math.min(n, a.max || 4);
  out.count = n;
  if(a.pct) out.pct = a.pct * n;
  if(a.beds) out.beds = a.beds * n;
  if(a.powerCut) out.powerCut = Math.min(0.75, a.powerCut * n);
  if(a.shield) out.shield = a.shield * n;
  if(a.shieldAllBonus) out.shieldAll = a.shieldAllBonus * n;
  if(a.labBonus) out.lab = a.labBonus * n;
  if(a.store){ for(const k in a.store) out.store[k] = a.store[k] * n; }
  return out;
}

/* -------------------------------------------------------------- integrity */
function integrityFactor(tile){
  if(!tile.b) return 0;
  const g = tile.integrity;
  if(g >= 70) return 1;
  if(g < 25) return 0;              // offline until repaired
  return g / 70;
}
function damageBuilding(S, idx, amt){
  const t = S.map[idx];
  if(!t.b) return 0;
  t.integrity = clamp(t.integrity - amt, 0, 100);
  return amt;
}

/* ------------------------------------------------------------ worker maths */
function workerEff(S, c, bid){
  if(c.morale < 20) return 0;                                  // refusing to work
  const def = bid ? BLD[bid] : null;
  const skillF  = 0.5 + 0.25 * c.skill;                        // 0.75 .. 1.75
  const moraleF = 0.45 + 0.55 * (c.morale / 100);              // 0.45 .. 1.00
  const fatF    = 1 - 0.4 * (c.fatigue / 100);                 // 1.00 .. 0.60
  const jobF    = (def && def.job && def.job !== c.job) ? 0.5 : 1;
  return skillF * moraleF * fatF * jobF;
}
function effBreakdown(S, c, bid){
  const def = bid ? BLD[bid] : null;
  const rows = [
    ['skill '+fmt(c.skill), 0.5 + 0.25*c.skill],
    ['morale '+Math.round(c.morale), 0.45 + 0.55*(c.morale/100)],
    ['fatigue '+Math.round(c.fatigue), 1 - 0.4*(c.fatigue/100)]
  ];
  if(def && def.job) rows.push([def.job === c.job ? 'job match' : 'wrong job ('+JOBS[c.job].short+' in '+JOBS[def.job].short+' post)',
                                def.job === c.job ? 1 : 0.5]);
  if(c.morale < 20) rows.push(['REFUSING (morale under 20)', 0]);
  return rows;
}
function rateAt(S, idx){
  const t = S.map[idx];
  if(!t.b) return 0;
  const def = BLD[t.b];
  if(def.passive) return 1;
  return sum(workersAt(S,idx).map(c=>workerEff(S,c,t.b)));
}

/* --------------------------------------------------------------- resources */
let OVERFLOW = {};                        // per-turn transient, never serialised
function capOf(S, res, m){
  m = m || computeMods(S);
  let cap = RES_BY[res].base;
  for(let i=0;i<MAP_N;i++){
    const t = S.map[i];
    if(!t.b) continue;
    const def = BLD[t.b];
    if(def.store && def.store[res]) cap += def.store[res];
    const a = adjInfo(S,i,t.b);
    if(a.store[res]) cap += a.store[res];
  }
  return Math.floor(cap * m.capMult);
}
function capsAll(S){
  const m = computeMods(S), out = {};
  RES_IDS.forEach(r=>out[r] = capOf(S,r,m));
  return out;
}
/* returns the amount LOST to overflow */
function gain(S, res, amt, src){
  if(amt <= 0) return 0;
  const cap = capOf(S, res);
  const room = Math.max(0, cap - S.res[res]);
  const put = Math.min(room, amt);
  S.res[res] = S.res[res] + put;
  const lost = amt - put;
  if(lost > 0.001){
    OVERFLOW[res] = (OVERFLOW[res] || 0) + lost;
    S.stats.overflow += lost;
  }
  return lost;
}
function take(S, res, amt){
  const got = Math.min(S.res[res], Math.max(0, amt));
  S.res[res] = Math.max(0, S.res[res] - got);
  return got;
}
function canAfford(S, cost){
  for(const k in cost) if(S.res[k] < cost[k] - 1e-9) return false;
  return true;
}
function payCost(S, cost){
  for(const k in cost) S.res[k] = Math.max(0, S.res[k] - cost[k]);
}
function costText(cost){
  return Object.keys(cost).map(k=>fmt(cost[k])+' '+RES_BY[k].name).join(', ') || 'free';
}

/* --------------------------------------------------------------------- log */
function addLog(S, kind, msg){
  S.log.push({t:S.turn, k:kind, m:msg});
  if(S.log.length > 600) S.log.splice(0, S.log.length - 600);
}

/* ==========================================================================
   PLAYER ACTIONS
   ========================================================================== */
function buildReason(S, idx, bid, m){
  m = m || computeMods(S);
  const t = S.map[idx], def = BLD[bid];
  if(t.b) return 'Tile already holds a '+BLD[t.b].name;
  if(!TERRAIN[t.terr].buildable) return 'Cannot build on '+TERRAIN[t.terr].name;
  if(!def.terr.includes(t.terr)) return 'Needs '+def.terr.map(x=>TERRAIN[x].name).join(' or ');
  if(def.tech && !m.unlocked[bid]) return 'Locked - research '+RES_NODE[def.tech].name;
  if(!canAfford(S, def.cost)) return 'Cannot afford '+costText(def.cost);
  return null;
}
function buildAt(S, idx, bid){
  const why = buildReason(S, idx, bid);
  if(why) return {ok:false, why:why};
  payCost(S, BLD[bid].cost);
  S.map[idx].b = bid;
  S.map[idx].integrity = 100;
  S.map[idx].repairing = false;
  S.stats.built++;
  const a = adjInfo(S, idx, bid);
  addLog(S,'good','Built '+BLD[bid].name+' at '+tileName(idx)+' for '+costText(BLD[bid].cost)+
    (a.count ? ' (adjacency: '+a.count+'x '+TERRAIN[BLD[bid].adj.terr].name+')' : ''));
  return {ok:true};
}
function demolishAt(S, idx){
  const t = S.map[idx];
  if(!t.b) return {ok:false, why:'Nothing here to demolish'};
  const def = BLD[t.b];
  const refund = Math.floor((def.cost.metal || 0) * 0.5);
  S.colonists.forEach(c=>{ if(c.at === idx) c.at = -1; });
  gain(S,'metal',refund,'demolition');
  addLog(S,'warn','Demolished '+def.name+' at '+tileName(idx)+' (+'+refund+' Metal salvaged).');
  t.b = null; t.integrity = 100; t.repairing = false;
  // losing a store shrinks the cap: spill anything that no longer fits
  const caps = capsAll(S), spilled = [];
  RES_IDS.forEach(r=>{
    if(S.res[r] > caps[r]){
      spilled.push(fmt(S.res[r] - caps[r]) + ' ' + RES_BY[r].name);
      S.res[r] = caps[r];
    }
  });
  if(spilled.length) addLog(S,'warn','The lost storage spilled '+spilled.join(', ')+' into the ash.');
  return {ok:true};
}
function repairCostOf(S, idx, m){
  m = m || computeMods(S);
  const t = S.map[idx];
  if(!t.b) return 0;
  return Math.max(1, Math.ceil(((100 - t.integrity) / 28) * m.repairCost));
}
function startRepair(S, idx){
  const t = S.map[idx];
  if(!t.b) return {ok:false, why:'Nothing here'};
  if(t.integrity >= 100) return {ok:false, why:'Already intact'};
  if(t.repairing) return {ok:false, why:'Already being repaired'};
  const cost = repairCostOf(S, idx);
  if(S.res.parts < cost) return {ok:false, why:'Needs '+cost+' Parts'};
  take(S,'parts',cost);
  t.repairing = true;
  addLog(S,'info','Repair crew booked for the '+BLD[t.b].name+' at '+tileName(idx)+
    ' ('+cost+' Parts). It produces nothing while under repair.');
  return {ok:true};
}
function assign(S, colonistId, idx){
  const c = S.colonists.find(x=>x.id === colonistId);
  if(!c) return {ok:false, why:'No such colonist'};
  if(idx < 0){ c.at = -1; return {ok:true}; }
  const t = S.map[idx];
  if(!t.b) return {ok:false, why:'No building there'};
  const def = BLD[t.b];
  if(!def.slots) return {ok:false, why:def.name+' needs no crew'};
  if(workersAt(S,idx).filter(x=>x.id!==c.id).length >= def.slots) return {ok:false, why:def.name+' is fully crewed'};
  c.at = idx;
  return {ok:true};
}
function tileName(idx){ const {x,y} = xyOf(idx); return String.fromCharCode(65+x) + (y+1); }

function researchState(S, id, m){
  m = m || computeMods(S);
  const n = RES_NODE[id];
  if(S.research.includes(id)) return 'done';
  for(const r of n.req) if(!S.research.includes(r)) return 'locked';
  if(n.tier >= 2 && countBuilt(S,'lab') === 0) return 'locked';
  if(n.tier >= 3 && !labStaffed(S)) return 'locked';
  return 'available';
}
function researchCost(S, id){
  const n = RES_NODE[id];
  const disc = clamp(labDiscount(S) + (S.researchDiscount || 0), 0, 0.8);
  return {
    scrip: Math.ceil(n.cost.scrip * (1 - disc)),
    parts: Math.ceil((n.cost.parts || 0) * (1 - disc)),
    disc: disc
  };
}
function doResearch(S, id){
  const n = RES_NODE[id];
  if(!n) return {ok:false, why:'Unknown node'};
  const st = researchState(S, id);
  if(st === 'done') return {ok:false, why:'Already researched'};
  if(st === 'locked'){
    const missing = n.req.filter(r=>!S.research.includes(r)).map(r=>RES_NODE[r].name);
    if(missing.length) return {ok:false, why:'Prerequisite missing: '+missing.join(', ')};
    if(n.tier >= 3 && !labStaffed(S)) return {ok:false, why:'Tier 3 needs a Lab with a working scholar'};
    return {ok:false, why:'Tier 2 needs a built Lab'};
  }
  if(S.researchedThisTurn) return {ok:false, why:'Only one node can be started per turn'};
  const c = researchCost(S, id);
  if(S.res.scrip < c.scrip || S.res.parts < c.parts)
    return {ok:false, why:'Costs '+c.scrip+' Scrip and '+c.parts+' Parts'};
  take(S,'scrip',c.scrip); take(S,'parts',c.parts);
  S.research.push(id);
  S.researchedThisTurn = true;
  S.researchDiscount = 0;
  addLog(S,'good','Research complete: '+n.name+' ('+c.scrip+' Scrip, '+c.parts+' Parts). '+n.effect);
  return {ok:true};
}

/* ==========================================================================
   TRADE
   ========================================================================== */
const BASE_PRICE = {food:3.0, water:2.2, metal:2.0, parts:6.5, ash:0.5, ore:1.1, soil:1.5, power:1.4, scrip:1};
const TRADE_IDS = ['food','water','metal','parts','ash','ore','soil'];
function marginOf(S, m){
  m = m || computeMods(S);
  let bonus = 0;
  for(const i of builtIdx(S,'tradepost')) bonus += 0.03 * Math.min(1.6, rateAt(S,i)) * integrityFactor(S.map[i]);
  return clamp(m.margin + Math.min(0.12, bonus), 0.4, 0.92);
}
function priceOf(S, res){
  const cap = capOf(S,res);
  const ratio = clamp(S.res[res] / Math.max(1,cap), 0, 1);
  return Math.max(0.1, BASE_PRICE[res] * S.market.index[res] * (0.72 + 0.56 * (1 - ratio)));
}
function sellPriceOf(S, res){ return priceOf(S,res) * marginOf(S); }
function caravanArrive(S, m){
  const boost = 1 + (S.caravan.boost > 0 ? 0.8 : 0) + 0.5 * Math.min(2, countBuilt(S,'tradepost'));
  const stock = {};
  const spread = {food:26, water:26, metal:22, parts:12, ash:20, ore:18, soil:14};
  TRADE_IDS.forEach(r=>{ stock[r] = Math.round(rngRange(S, spread[r]*0.35, spread[r]) * boost); });
  S.caravan.active = true;
  S.caravan.left = 2;
  S.caravan.stock = stock;
  S.caravan.scrip = Math.round(rngRange(S, 70, 150) * boost);
  S.caravan.hires = 0;
  if(S.caravan.boost > 0) S.caravan.boost = 0;
  addLog(S,'info','A caravan rolls in with '+S.caravan.scrip+' Scrip and '+
    TRADE_IDS.filter(r=>stock[r]>0).map(r=>stock[r]+' '+RES_BY[r].name).join(', ')+'. It leaves in 2 turns.');
}
function tradeBuy(S, res, qty){
  if(!S.caravan.active) return {ok:false, why:'No caravan here'};
  qty = Math.floor(qty);
  if(qty <= 0) return {ok:false, why:'Nothing to buy'};
  if((S.caravan.stock[res] || 0) < qty) return {ok:false, why:'Caravan only has '+(S.caravan.stock[res]||0)};
  const cost = priceOf(S,res) * qty;
  if(S.res.scrip < cost) return {ok:false, why:'Needs '+fmt(cost)+' Scrip'};
  take(S,'scrip',cost);
  S.caravan.scrip += cost;
  S.caravan.stock[res] -= qty;
  const lost = gain(S,res,qty,'trade');
  addLog(S,'info','Bought '+qty+' '+RES_BY[res].name+' for '+fmt(cost)+' Scrip'+(lost>0?' ('+fmt(lost)+' overflowed and was lost)':'')+'.');
  return {ok:true};
}
function tradeSell(S, res, qty){
  if(!S.caravan.active) return {ok:false, why:'No caravan here'};
  qty = Math.floor(qty);
  if(qty <= 0) return {ok:false, why:'Nothing to sell'};
  if(S.res[res] < qty) return {ok:false, why:'You only have '+Math.floor(S.res[res])};
  const rev = sellPriceOf(S,res) * qty;
  if(S.caravan.scrip < rev) return {ok:false, why:'Caravan only carries '+fmt(S.caravan.scrip)+' Scrip'};
  take(S,res,qty);
  S.caravan.scrip -= rev;
  S.caravan.stock[res] = (S.caravan.stock[res]||0) + qty;
  const lost = gain(S,'scrip',rev,'trade');
  addLog(S,'info','Sold '+qty+' '+RES_BY[res].name+' for '+fmt(rev)+' Scrip'+
    (lost>0?' - but '+fmt(lost)+' Scrip would not fit in the strongbox and was lost':'')+'.');
  return {ok:true};
}
function hireCost(S){ return Math.round(42 + 7 * S.colonists.length); }
function tradeHire(S){
  if(!S.caravan.active) return {ok:false, why:'No caravan here'};
  if(S.caravan.hires >= 2) return {ok:false, why:'No more hands for hire this visit'};
  const cost = hireCost(S);
  if(S.res.scrip < cost) return {ok:false, why:'Needs '+cost+' Scrip'};
  take(S,'scrip',cost);
  S.caravan.hires++;
  S.caravan.scrip += cost;
  const c = addColonist(S, {skill: 2 + rngInt(S,2), morale:60});
  addLog(S,'good','Hired '+c.name+' off the caravan for '+cost+' Scrip.');
  return {ok:true};
}

/* ==========================================================================
   TURN RESOLUTION (order documented in TURN_PHASES)
   ========================================================================== */
function runProduction(S, idx, m, produced, shortNotes){
  const t = S.map[idx], def = BLD[t.b];
  if(!def.prod) return;
  if(t.repairing) return;
  const iF = integrityFactor(t);
  if(iF <= 0) return;
  const rate = rateAt(S, idx);
  if(rate <= 0) return;
  const a = adjInfo(S, idx, t.b);
  const inScale = rate * iF;
  let outScale = rate * iF * (1 + a.pct) * m.out[t.b];
  if(t.b === 'solar' && S.storm.activeThisTurn) outScale *= 0.5;

  const ins = def.prod.in || {};
  const powerMult = m.powerCost[t.b] * (1 - a.powerCut);
  let f = 1;
  let limiter = null;
  for(const k in ins){
    const need = ins[k] * inScale * (k === 'power' ? powerMult : 1);
    if(need > 1e-9){
      const ratio = S.res[k] / need;
      if(ratio < f){ f = ratio; limiter = k; }
    }
  }
  f = clamp(f, 0, 1);
  if(f < 0.995 && limiter) shortNotes[t.b] = {res:limiter, f:f};
  if(f <= 0) return;
  for(const k in ins) take(S, k, ins[k] * inScale * (k === 'power' ? powerMult : 1) * f);
  const outs = def.prod.out || {};
  for(const k in outs) gain(S, k, outs[k] * outScale * f, def.name);
  produced[idx] = true;
}

function doStorm(S, m){
  S.storm.activeThisTurn = true;
  S.storm.count++;
  S.stats.storms++;
  const sev = clamp(1 + Math.floor(S.turn / 16) + (rng(S) < 0.35 ? 1 : 0), 1, 5);
  S.storm.lastSev = sev;
  S.storm.next = S.turn + S.storm.interval;

  let globalShield = 0;
  for(const i of builtIdx(S,'bunker')){
    if(integrityFactor(S.map[i]) <= 0) continue;
    globalShield += BLD.bunker.shieldAll + adjInfo(S,i,'bunker').shieldAll;
  }
  globalShield = Math.min(0.5, globalShield);

  let hit = 0, worstName = '', worst = 101;
  for(let i=0;i<MAP_N;i++){
    const t = S.map[i];
    if(!t.b) continue;
    let local = 0;
    for(const j of neighbours(i)){
      if(S.map[j].b === 'windbreak' && integrityFactor(S.map[j]) > 0)
        local += BLD.windbreak.shieldAdj + adjInfo(S,j,'windbreak').shield;
    }
    const shield = clamp(local + globalShield, 0, 0.85);
    const dmg = (8 + 8*sev) * rngRange(S, 0.6, 1.4) * (1 - shield) * m.stormDmg;
    if(dmg > 0.5){
      damageBuilding(S, i, dmg);
      hit++;
      if(t.integrity < worst){ worst = t.integrity; worstName = BLD[t.b].name; }
    }
  }
  S.storm.waterMult = 1 + 0.5 * sev * m.stormWater;
  moraleAll(S, -(2 + sev));
  addLog(S,'bad','ASHSTORM severity '+sev+'/5 - '+hit+' buildings scoured'+
    (worstName ? ', worst hit '+worstName+' at '+Math.round(worst)+'% integrity' : '')+
    '. Water demand x'+fmt2(S.storm.waterMult)+' this turn. Morale -'+(2+sev)+'.');
}

function endTurn(S, opts){
  opts = opts || {};
  if(S.pending) return {ok:false, why:'Answer the event first'};
  if(S.over && !opts.sandbox) return {ok:false, why:'The run is over'};

  const before = {}; RES_IDS.forEach(r=>before[r] = S.res[r]);
  const m = computeMods(S);   // OVERFLOW is cleared at phase 8, so waste from
                              // the player's own build/trade actions is logged too

  /* 1. upkeep */
  S.turn++;
  S.researchedThisTurn = false;
  S.storm.activeThisTurn = false;
  S.storm.waterMult = 1;
  for(const k in S.evCd){ S.evCd[k]--; if(S.evCd[k] <= 0) delete S.evCd[k]; }
  addLog(S,'turn','--- Turn '+S.turn+' ---');

  /* 2. ashstorm */
  if(S.turn >= S.storm.next) doStorm(S, m);

  /* 3. repairs (a building being repaired produces nothing this turn, even if
        the repair finishes - its crew spent the turn with spanners) */
  const busy = {};
  for(let i=0;i<MAP_N;i++){
    const t = S.map[i];
    if(!t.b || !t.repairing) continue;
    busy[i] = true;
    const crew = sum(workersAt(S,i).map(c=>workerEff(S,c,'forge')));   // tech-rated effort
    const prog = 10 + 16 * crew;
    t.integrity = clamp(t.integrity + prog, 0, 100);
    if(t.integrity >= 100){
      t.repairing = false;
      S.stats.repairs++;
      addLog(S,'good','Repairs finished on the '+BLD[t.b].name+' at '+tileName(i)+' (back to 100%).');
    } else {
      addLog(S,'info','Repair progress on the '+BLD[t.b].name+' at '+tileName(i)+': '+
        Math.round(t.integrity)+'%'+(crew<=0?' - no crew assigned, hands-only pace':'')+'.');
    }
  }

  /* 4-7. production, in the fixed order below */
  const produced = {}, shortNotes = {};
  const order = [['power',['venttap','solar']],
                 ['extract',['ashworks','mine','condenser','salvage']],
                 ['process',['compost','greenhouse','forge','workshop']],
                 ['scrip',['tradepost']]];
  for(const [, ids] of order){
    for(const bid of ids){
      for(const i of builtIdx(S, bid)){
        if(busy[i]) continue;
        runProduction(S, i, m, produced, shortNotes);
      }
    }
  }
  for(const bid in shortNotes){
    const n = shortNotes[bid];
    addLog(S,'warn', BLD[bid].name+' ran at '+Math.round(n.f*100)+'% - short of '+RES_BY[n.res].name+'.');
  }

  /* 8. storage overflow */
  const ovKeys = Object.keys(OVERFLOW).filter(k=>OVERFLOW[k] > 0.05);
  if(ovKeys.length){
    addLog(S,'warn','Storage full - lost '+ovKeys.map(k=>fmt(OVERFLOW[k])+' '+RES_BY[k].name).join(', ')+
      '. Build Cisterns/Silos or research Cold Storage.');
  }
  OVERFLOW = {};

  /* 9. consumption */
  const pop = S.colonists.length;
  const needFood = pop * 1.0;
  const needWater = pop * 1.1 * S.storm.waterMult;
  const gotFood = take(S,'food',needFood);
  const gotWater = take(S,'water',needWater);
  const shortF = needFood > 0 ? clamp(1 - gotFood/needFood, 0, 1) : 0;
  const shortW = needWater > 0 ? clamp(1 - gotWater/needWater, 0, 1) : 0;
  S.shortage.food = shortF > 0.001;
  S.shortage.water = shortW > 0.001;
  if(pop > 0){
    addLog(S, (shortF||shortW) ? 'bad' : 'info',
      'Consumed '+fmt(gotFood)+'/'+fmt(needFood)+' Food and '+fmt(gotWater)+'/'+fmt(needWater)+' Water for '+pop+' colonists.'+
      (shortF ? ' FOOD SHORT by '+Math.round(shortF*100)+'%.' : '')+
      (shortW ? ' WATER SHORT by '+Math.round(shortW*100)+'%.' : ''));
  }

  /* 10. needs: morale, fatigue, skill */
  const beds = bedsTotal(S);
  const crowd = Math.max(0, pop - beds);
  const plenty = S.res.food > pop*3 && S.res.water > pop*3;
  S.colonists.forEach(c=>{
    let d = 0;
    const why = [];
    if(shortF > 0){ const v = 4 + 15*shortF; d -= v; why.push('hunger -'+fmt(v)); }
    if(shortW > 0){ const v = 4 + 17*shortW; d -= v; why.push('thirst -'+fmt(v)); }
    if(crowd > 0){ const v = 1.5 + 1.2*crowd; d -= v; why.push('no bed for '+crowd+' -'+fmt(v)); }
    if(c.fatigue > 75){ d -= 2; why.push('exhausted -2'); }
    if(S.storm.activeThisTurn){ d -= 1; why.push('ashstorm -1'); }
    if(shortF === 0 && shortW === 0){ d += 3; why.push('fed and watered +3'); }
    if(plenty){ d += 2; why.push('full stores +2'); }
    if(c.at < 0){ d += 1; why.push('rested +1'); }
    if(d < 0 && m.moraleLossMult !== 1){ why.push('Field Medicine x'+fmt2(m.moraleLossMult)); }
    if(d < 0) d *= m.moraleLossMult;
    c.morale = clamp(c.morale + d, 0, 100);
    c.md = Math.round(d*10)/10;
    c.mw = why.join(', ') || 'nothing moved it';

    if(c.at >= 0){
      c.fatigue = clamp(c.fatigue + 9, 0, 100);
      const def = BLD[S.map[c.at].b] || null;
      if(produced[c.at]) c.skill = clamp(c.skill + (def && def.job === c.job ? 0.055 : 0.028), 1, 5);
      if(c.fatigue >= 98){
        c.at = -1;
        addLog(S,'warn', c.name+' collapsed at the post and was sent to rest.');
      }
    } else {
      c.fatigue = clamp(c.fatigue - 18 * m.restMult, 0, 100);
    }
  });

  /* 11. migration */
  const leaving = [];
  S.colonists.forEach(c=>{
    if(c.morale <= 0.001){
      c.zeroT++;
      if(c.zeroT >= 2) leaving.push(c);
      else addLog(S,'warn', c.name+' is at zero morale and talking about walking out. Fix food, water or beds now.');
    } else c.zeroT = 0;
  });
  leaving.forEach(c=>removeColonist(S,c,'walked into the ash after two turns at zero morale'));
  if(S.turn % 4 === 0 && pop > 0 && avgMorale(S) >= 58 && S.res.food >= 20 && S.res.water >= 20 && bedsTotal(S) > S.colonists.length){
    const c = addColonist(S, {morale:65, silent:true});
    addLog(S,'good','Word of a fed, housed outpost travelled: '+c.name+' walked in and stayed ('+
      JOBS[c.job].name+', skill '+c.skill+'). Population '+S.colonists.length+'.');
  }

  /* 12. market */
  RES_IDS.forEach(r=>{
    let v = S.market.index[r];
    v *= 1 + (rng(S) - 0.5) * 0.12;
    v += (1 - v) * 0.03;
    S.market.index[r] = clamp(v, 0.55, 1.85);
  });
  if(S.caravan.active){
    S.caravan.left--;
    if(S.caravan.left <= 0){
      S.caravan.active = false;
      S.caravan.stock = {};
      S.caravan.scrip = 0;
      addLog(S,'info','The caravan packs up and rolls out into the grey.');
    }
  } else if(S.turn % m.caravanEvery === 0){
    caravanArrive(S, m);
  }

  /* 13. events */
  if(S.turn >= 2 && rng(S) < 0.45) drawEvent(S, opts);

  /* 14. resolution happens in finishTurn (after any pending choice) */
  RES_IDS.forEach(r=>S.lastDelta[r] = S.res[r] - before[r]);

  if(S.pending && opts.sandbox){
    const pick = opts.choose ? opts.choose(S, S.pending) : 0;
    if(!applyChoice(S, pick).ok){
      // never let a headless run stall on an unanswerable event
      const alt = S.pending.options.findIndex(o=>o.ok);
      if(alt < 0 || !applyChoice(S, alt).ok){
        addLog(S,'info','No response to '+S.pending.name+' was possible; the moment passed.');
        S.pending = null;
      }
    }
  }
  if(!S.pending) finishTurn(S, opts);
  return {ok:true};
}

function finishTurn(S, opts){
  opts = opts || {};
  if(opts.sandbox) return;
  checkEnd(S);
}

/* ------------------------------------------------------------------ events */
function eligibleEvents(S){
  return EVENTS.filter(e=>{
    if(S.evCd[e.id]) return false;
    if(S.turn < (e.min||0)) return false;
    if(e.cond && !e.cond(S)) return false;
    return true;
  });
}
function drawEvent(S, opts){
  const pool = eligibleEvents(S);
  if(!pool.length) return;
  const total = sum(pool.map(e=>e.w));
  let roll = rng(S) * total, chosen = pool[pool.length-1];
  for(const e of pool){ roll -= e.w; if(roll <= 0){ chosen = e; break; } }
  S.evCd[chosen.id] = chosen.cd;
  S.stats.events++;
  if(chosen.choices){
    const opts2 = chosen.choices.map((c,i)=>({i:i, label:c.label, tip:c.tip, ok: c.cond ? !!c.cond(S) : true}));
    S.pending = {id:chosen.id, name:chosen.name, text:chosen.text, options:opts2};
    addLog(S,'warn','EVENT: '+chosen.name+' - a decision is waiting.');
  } else {
    addLog(S,'warn','EVENT: '+chosen.name);
    addLog(S,'info', chosen.apply(S));
  }
}
function applyChoice(S, i){
  if(!S.pending) return {ok:false, why:'Nothing pending'};
  const ev = EV_BY[S.pending.id];
  const opt = S.pending.options[i] || S.pending.options.find(o=>o.ok) || S.pending.options[0];
  if(!opt.ok) return {ok:false, why:'That option is not available'};
  const res = ev.choices[opt.i].apply(S);
  S.pending = null;
  addLog(S,'info', res);
  return {ok:true};
}

/* -------------------------------------------------------- end conditions */
function needsMet(S){
  return !S.shortage.food && !S.shortage.water &&
         S.res.food > 0 && S.res.water > 0 && avgMorale(S) >= WIN_MORALE;
}
function checkEnd(S){
  if(S.over) return;
  if(S.colonists.length === 0){
    S.over = true; S.won = false;
    S.ending = 'The last colonist is gone. The ash takes the rest.';
    addLog(S,'bad','DEFEAT - population reached zero on turn '+S.turn+'.');
    return;
  }
  if(S.turn >= WIN_TURN){
    S.over = true;
    if(S.colonists.length >= WIN_POP && needsMet(S)){
      S.won = true;
      S.ending = 'Turn '+WIN_TURN+': '+S.colonists.length+' colonists, fed and watered, morale holding. The outpost is a town now.';
      addLog(S,'good','VICTORY - the outpost survived the ashfall.');
    } else {
      S.won = false;
      const miss = [];
      if(S.colonists.length < WIN_POP) miss.push('population '+S.colonists.length+'/'+WIN_POP);
      if(S.shortage.food) miss.push('food shortage on the final turn');
      if(S.shortage.water) miss.push('water shortage on the final turn');
      if(avgMorale(S) < WIN_MORALE) miss.push('average morale '+Math.round(avgMorale(S))+'/'+WIN_MORALE);
      S.ending = 'Turn '+WIN_TURN+' came and the charter lapsed: '+miss.join(', ')+'.';
      addLog(S,'bad','RUN OVER - the outpost held on but missed the charter: '+miss.join(', ')+'.');
    }
  }
}
function scoreOf(S){
  const stock = ['food','water','metal','parts','ash','ore','soil'].reduce((a,k)=>a+S.res[k],0);
  const rows = [
    ['Population',        S.colonists.length,                 40],
    ['Research completed',S.research.length,                  35],
    ['Turns survived',    S.turn,                             8],
    ['Buildings standing',countAnyBuilt(S),                   10],
    ['Stockpiles',        Math.round(stock),                  0.5],
    ['Scrip',             Math.round(S.res.scrip),            0.4],
    ['Average morale',    Math.round(avgMorale(S)),           2],
    ['Average skill',     Math.round(avgSkill(S)*100)/100,    30],
    ['Storms weathered',  S.storm.count,                      12],
    ['Victory bonus',     S.won ? 1 : 0,                      600]
  ];
  const total = Math.max(0, Math.round(rows.reduce((a,r)=>a + r[1]*r[2], 0)));
  return {rows:rows, total:total};
}

/* ==========================================================================
   SAVE / LOAD  (plain JSON text - no browser storage anywhere)
   ========================================================================== */
function serialize(S){ return JSON.stringify(S); }
function isNum(n){ return typeof n === 'number' && isFinite(n); }
function deserialize(text){
  let o;
  if(typeof text !== 'string' || !text.trim()) throw new Error('the box is empty - paste a save first');
  try { o = JSON.parse(text); }
  catch(e){ throw new Error('not valid JSON (' + e.message + ')'); }
  if(!o || typeof o !== 'object' || Array.isArray(o)) throw new Error('the top level must be a JSON object');
  if(o.v !== VERSION) throw new Error('save version "' + o.v + '" does not match this build ("' + VERSION + '")');
  const req = ['seed','rngState','turn','res','map','colonists','research','market','caravan','storm','evCd','log','stats'];
  for(const k of req) if(!(k in o)) throw new Error('missing field: ' + k);
  if(!isNum(o.seed) || !isNum(o.rngState) || !isNum(o.turn) || o.turn < 0) throw new Error('seed/rngState/turn must be numbers');
  if(!o.res || typeof o.res !== 'object') throw new Error('res must be an object');
  for(const r of RES_IDS){
    if(!isNum(o.res[r])) throw new Error('res.' + r + ' must be a number');
    if(o.res[r] < 0) throw new Error('res.' + r + ' is negative (' + o.res[r] + ')');
  }
  if(!Array.isArray(o.map) || o.map.length !== MAP_N) throw new Error('map must be an array of ' + MAP_N + ' tiles');
  o.map.forEach((t,i)=>{
    if(!t || typeof t !== 'object') throw new Error('map tile ' + i + ' is not an object');
    if(!TERRAIN[t.terr]) throw new Error('map tile ' + i + ' has unknown terrain "' + t.terr + '"');
    if(t.b != null && !BLD[t.b]) throw new Error('map tile ' + i + ' has unknown building "' + t.b + '"');
    if(!isNum(t.integrity) || t.integrity < 0 || t.integrity > 100) throw new Error('map tile ' + i + ' integrity out of range');
    t.repairing = !!t.repairing;
    if(t.b == null) t.b = null;
  });
  if(!Array.isArray(o.colonists)) throw new Error('colonists must be an array');
  o.colonists.forEach((c,i)=>{
    if(!c || typeof c !== 'object') throw new Error('colonist ' + i + ' is not an object');
    if(typeof c.name !== 'string' || !c.name) throw new Error('colonist ' + i + ' has no name');
    if(!JOBS[c.job]) throw new Error('colonist ' + c.name + ' has unknown job "' + c.job + '"');
    if(!isNum(c.skill) || c.skill < 1 || c.skill > 5) throw new Error('colonist ' + c.name + ' skill out of range 1-5');
    if(!isNum(c.fatigue) || c.fatigue < 0 || c.fatigue > 100) throw new Error('colonist ' + c.name + ' fatigue out of range');
    if(!isNum(c.morale) || c.morale < 0 || c.morale > 100) throw new Error('colonist ' + c.name + ' morale out of range');
    if(!isNum(c.at) || c.at < -1 || c.at >= MAP_N) throw new Error('colonist ' + c.name + ' is assigned to a tile that does not exist');
    if(c.at >= 0 && !o.map[c.at].b) throw new Error('colonist ' + c.name + ' is assigned to an empty tile');
    if(!isNum(c.id)) c.id = i + 1;
    if(!isNum(c.zeroT)) c.zeroT = 0;
  });
  if(!Array.isArray(o.research)) throw new Error('research must be an array');
  for(const id of o.research) if(!RES_NODE[id]) throw new Error('unknown research node "' + id + '"');
  if(!o.market || typeof o.market !== 'object' || !o.market.index) throw new Error('market.index missing');
  RES_IDS.forEach(r=>{ if(!isNum(o.market.index[r])) o.market.index[r] = 1; });
  if(!o.storm || !isNum(o.storm.next)) throw new Error('storm block is malformed');
  if(!o.caravan || typeof o.caravan !== 'object') throw new Error('caravan block is malformed');
  if(!Array.isArray(o.log)) throw new Error('log must be an array');
  // defaults for anything optional
  o.pop = o.colonists.length;
  o.nextId = isNum(o.nextId) ? o.nextId : (o.colonists.reduce((a,c)=>Math.max(a,c.id),0) + 1);
  o.pending = o.pending || null;
  o.lastDelta = o.lastDelta || {};
  RES_IDS.forEach(r=>{ if(!isNum(o.lastDelta[r])) o.lastDelta[r] = 0; });
  o.shortage = o.shortage || {food:false, water:false};
  o.evCd = o.evCd || {};
  o.researchDiscount = isNum(o.researchDiscount) ? o.researchDiscount : 0;
  o.researchedThisTurn = !!o.researchedThisTurn;
  o.over = !!o.over; o.won = !!o.won; o.ending = o.ending || '';
  o.stats = Object.assign({storms:0,arrivals:0,departures:0,events:0,overflow:0,repairs:0,built:0}, o.stats||{});
  o.caravan.stock = o.caravan.stock || {};
  o.caravan.scrip = isNum(o.caravan.scrip) ? o.caravan.scrip : 0;
  o.caravan.left = isNum(o.caravan.left) ? o.caravan.left : 0;
  o.caravan.boost = isNum(o.caravan.boost) ? o.caravan.boost : 0;
  o.caravan.hires = isNum(o.caravan.hires) ? o.caravan.hires : 0;
  o.caravan.active = !!o.caravan.active;
  o.storm.interval = isNum(o.storm.interval) ? o.storm.interval : 7;
  o.storm.count = isNum(o.storm.count) ? o.storm.count : 0;
  o.storm.lastSev = isNum(o.storm.lastSev) ? o.storm.lastSev : 0;
  o.storm.waterMult = isNum(o.storm.waterMult) ? o.storm.waterMult : 1;
  o.storm.activeThisTurn = !!o.storm.activeThisTurn;
  // restore pending event choice availability (functions are not serialised)
  if(o.pending){
    const ev = EV_BY[o.pending.id];
    if(!ev || !ev.choices) o.pending = null;
    else o.pending.options = ev.choices.map((c,i)=>({i:i, label:c.label, tip:c.tip, ok: c.cond ? !!c.cond(o) : true}));
  }
  return o;
}

/* ==========================================================================
   GREEDY POLICY (shared by the Auto-Assign button and the benchmark)
   ========================================================================== */
function greedyAssign(S){
  S.colonists.forEach(c=>{ c.at = -1; });
  const prio = ['condenser','ashworks','compost','greenhouse','venttap','mine','salvage','forge','workshop','lab','tradepost'];
  const slots = [];
  for(const bid of prio){
    for(const i of builtIdx(S,bid)){
      if(integrityFactor(S.map[i]) <= 0) continue;
      for(let s=0;s<BLD[bid].slots;s++) slots.push({i:i, job:BLD[bid].job});
    }
  }
  const pool = S.colonists.filter(c=>c.fatigue < 78 && c.morale >= 20).slice().sort((a,b)=>a.id-b.id);
  for(const slot of slots){
    if(!pool.length) break;
    let bi = 0, bs = -1e9;
    for(let k=0;k<pool.length;k++){
      const c = pool[k];
      const sc = (c.job === slot.job ? 100 : 0) + c.skill*5 - c.fatigue*0.1 - c.id*0.001;
      if(sc > bs){ bs = sc; bi = k; }
    }
    pool.splice(bi,1)[0].at = slot.i;
  }
  return S.colonists.filter(c=>c.at >= 0).length;
}
function bestSpot(S, bid, m){
  let best = -1, bs = -1e9;
  for(let i=0;i<MAP_N;i++){
    if(buildReason(S,i,bid,m)) continue;
    const sc = adjInfo(S,i,bid).count * 10 - i * 0.001;
    if(sc > bs){ bs = sc; best = i; }
  }
  return best;
}
function greedyBuild(S, budget){
  const m = computeMods(S);
  const pop = Math.max(1, S.colonists.length);
  const c = (id)=>countBuilt(S,id);
  const want = [];
  if(bedsTotal(S) <= pop) want.push('shelter');
  if(c('ashworks') < 1) want.push('ashworks');
  if(c('condenser') < 1) want.push('condenser');
  if(c('compost') < 1) want.push('compost');
  if(c('greenhouse') < 1) want.push('greenhouse');
  if(c('salvage') < 1) want.push('salvage');
  if(c('cistern') < 1) want.push('cistern');
  if(c('mine') < 1) want.push('mine');
  if(c('silo') < 1) want.push('silo');
  if(c('solar') < 1) want.push('solar');
  if(c('forge') < 1) want.push('forge');
  if(c('lab') < 1) want.push('lab');
  if(c('condenser') < 2) want.push('condenser');
  if(c('greenhouse') < 2) want.push('greenhouse');
  if(c('windbreak') < 2) want.push('windbreak');
  if(c('venttap') < 1) want.push('venttap');
  if(c('tradepost') < 1) want.push('tradepost');
  if(c('ashworks') < 2) want.push('ashworks');
  if(c('workshop') < 1) want.push('workshop');
  if(c('greenhouse') < Math.ceil(pop/3)) want.push('greenhouse');
  if(c('condenser') < Math.ceil(pop/4)) want.push('condenser');
  if(c('shelter') < Math.ceil(pop/4)+1) want.push('shelter');
  if(c('bunker') < 1) want.push('bunker');
  if(c('compost') < 2) want.push('compost');
  if(c('windbreak') < 5) want.push('windbreak');
  let made = 0;
  for(const bid of want){
    if(made >= (budget||2)) break;
    const spot = bestSpot(S, bid, m);
    if(spot >= 0 && !buildReason(S, spot, bid, m)){ buildAt(S, spot, bid); made++; }
  }
  return made;
}
function greedyRepair(S){
  const dmg = [];
  for(let i=0;i<MAP_N;i++){
    const t = S.map[i];
    if(t.b && !t.repairing && t.integrity < 78) dmg.push(i);
  }
  dmg.sort((a,b)=> (S.map[a].integrity - S.map[b].integrity) || (a-b));
  let n = 0;
  for(const i of dmg){ if(startRepair(S,i).ok) n++; else break; }
  return n;
}
function greedyResearch(S){
  if(S.researchedThisTurn) return null;
  for(const n of RESEARCH){
    if(researchState(S, n.id) !== 'available') continue;
    const cost = researchCost(S, n.id);
    if(S.res.scrip >= cost.scrip + 12 && S.res.parts >= cost.parts){
      if(doResearch(S, n.id).ok) return n.id;
    }
  }
  return null;
}
function greedyTrade(S){
  if(!S.caravan.active) return;
  const caps = capsAll(S);
  for(const r of ['ash','ore','soil','metal']){
    const surplus = Math.floor(S.res[r] - caps[r]*0.72);
    if(surplus > 3) tradeSell(S, r, Math.min(surplus, 25));
  }
  for(const r of ['food','water']){
    if(S.res[r] < caps[r]*0.30 && S.res.scrip > 55){
      const want = Math.min(Math.floor((caps[r]*0.6 - S.res[r])), S.caravan.stock[r]||0,
                            Math.floor((S.res.scrip - 40) / Math.max(0.2, priceOf(S,r))));
      if(want > 0) tradeBuy(S, r, want);
    }
  }
  if(S.res.parts < 10 && S.res.scrip > 70 && (S.caravan.stock.parts||0) > 0){
    const want = Math.min(6, S.caravan.stock.parts, Math.floor((S.res.scrip - 50)/Math.max(0.2, priceOf(S,'parts'))));
    if(want > 0) tradeBuy(S, 'parts', want);
  }
  if(S.colonists.length < 16 && S.res.scrip > hireCost(S) + 60) tradeHire(S);
}
const BENCH_CHOICE = {ashbloom:1, refugees:0, cavein:0, cache:1, engineer:0, sickness:0, rumour:0};
function greedyChoice(S, pending){
  const want = BENCH_CHOICE[pending.id];
  const opts = pending.options;
  if(want != null && opts[want] && opts[want].ok) return want;
  for(let i=0;i<opts.length;i++) if(opts[i].ok) return i;
  return 0;
}
function greedyTurn(S){
  greedyRepair(S);
  greedyBuild(S, 2);
  greedyResearch(S);
  greedyTrade(S);
  greedyAssign(S);
  return endTurn(S, {sandbox:true, choose:greedyChoice});
}

/* ==========================================================================
   DEV: TESTS + BENCHMARK
   ========================================================================== */
function runTests(liveState){
  const out = [];
  let pass = 0, fail = 0;
  const T = (name, fn)=>{
    let ok = false, note = '';
    try { const r = fn(); ok = r === true || r === undefined; if(typeof r === 'string'){ ok = false; note = r; } }
    catch(e){ ok = false; note = e.message; }
    if(ok) pass++; else fail++;
    out.push({ok:ok, name:name, note:note});
  };

  // shared 30-turn greedy simulation, with Math.random trapped
  const realRandom = Math.random;
  let randomCalls = 0;
  Math.random = function(){ randomCalls++; return 0.5; };
  let A;
  try {
    A = newGame(1337);
    for(let i=0;i<30;i++) greedyTurn(A);
  } finally { Math.random = realRandom; }

  T('1. Math.random is never called during simulation', ()=> randomCalls === 0 || ('called '+randomCalls+' times'));
  T('2. No resource is ever negative after 30 turns', ()=>{
    for(const r of RES_IDS) if(A.res[r] < -1e-9) return r+' = '+A.res[r];
    return true;
  });
  T('3. Storage caps are respected for every resource', ()=>{
    const caps = capsAll(A);
    for(const r of RES_IDS) if(A.res[r] > caps[r] + 1e-6) return r+' '+fmt(A.res[r])+' > cap '+caps[r];
    return true;
  });
  T('4. Colonist count matches the roster', ()=> A.pop === A.colonists.length || (A.pop+' vs '+A.colonists.length));
  T('5. Colonist ids are unique', ()=>{
    const s = new Set(A.colonists.map(c=>c.id));
    return s.size === A.colonists.length || 'duplicate ids';
  });
  T('6. Morale and fatigue stay inside 0..100, skill inside 1..5', ()=>{
    for(const c of A.colonists){
      if(c.morale < 0 || c.morale > 100) return c.name+' morale '+c.morale;
      if(c.fatigue < 0 || c.fatigue > 100) return c.name+' fatigue '+c.fatigue;
      if(c.skill < 1 || c.skill > 5) return c.name+' skill '+c.skill;
    }
    return true;
  });
  T('7. Every assignment points at a real building with free slots', ()=>{
    for(let i=0;i<MAP_N;i++){
      const n = workersAt(A,i).length;
      if(n === 0) continue;
      if(!A.map[i].b) return 'workers on empty tile '+tileName(i);
      if(n > BLD[A.map[i].b].slots) return BLD[A.map[i].b].name+' has '+n+' of '+BLD[A.map[i].b].slots+' slots filled';
    }
    return true;
  });

function runBenchmark(seed, turns){
  turns = turns || 200;
  const run = ()=>{
    const S = newGame(seed);
    let starved = 0, peakPop = 0;
    for(let i=0;i<turns;i++){
      greedyTurn(S);
      if(S.shortage.food || S.shortage.water) starved++;
      peakPop = Math.max(peakPop, S.colonists.length);
      if(S.colonists.length === 0) break;
    }
    return {S:S, starved:starved, peakPop:peakPop};
  };
  const a = run(), b = run();
  const S = a.S;
  const sc = scoreOf(S);
  return {
    hash: stateHash(S),
    hash2: stateHash(b.S),
    turns: S.turn,
    pop: S.colonists.length,
    peakPop: a.peakPop,
    research: S.research.length,
    buildings: countAnyBuilt(S),
    storms: S.storm.count,
    events: S.stats.events,
    arrivals: S.stats.arrivals,
    departures: S.stats.departures,
    shortTurns: a.starved,
    overflow: S.stats.overflow,
    morale: avgMorale(S),
    skill: avgSkill(S),
    score: sc.total,
    res: Object.assign({}, S.res)
  };
}

/* projected production for a tile, without touching state */
function projectProduction(S, idx, m){
  const t = S.map[idx];
  if(!t.b) return null;
  const def = BLD[t.b];
  m = m || computeMods(S);
  const iF = integrityFactor(t);
  const rate = rateAt(S, idx);
  const a = adjInfo(S, idx, t.b);
  let outScale = rate * iF * (1 + a.pct) * m.out[t.b];
  if(t.b === 'solar' && S.storm.activeThisTurn) outScale *= 0.5;
  const inScale = rate * iF;
  const powerMult = m.powerCost[t.b] * (1 - a.powerCut);
  const ins = {}, outs = {};
  if(def.prod){
    for(const k in (def.prod.in||{})) ins[k] = def.prod.in[k] * inScale * (k==='power'?powerMult:1);
    for(const k in (def.prod.out||{})) outs[k] = def.prod.out[k] * outScale;
  }
  return {rate:rate, iF:iF, adj:a, ins:ins, outs:outs, resMult:m.out[t.b], repairing:t.repairing};
}
function flowText(o){
  const inp = Object.keys(o.ins).map(k=>'-'+fmt(o.ins[k])+' '+RES_BY[k].name);
  const outp = Object.keys(o.outs).map(k=>'+'+fmt(o.outs[k])+' '+RES_BY[k].name);
  if(!inp.length && !outp.length) return 'no flow';
  return (inp.length ? inp.join(', ')+' -> ' : '') + (outp.join(', ') || 'nothing');
}
function tileTip(S, i, m){
  const t = S.map[i], ter = TERRAIN[t.terr];
  const L = [tileName(i)+' - '+ter.name, ter.desc];
  if(t.b){
    const def = BLD[t.b];
    const p = projectProduction(S, i, m);
    L.push('');
    L.push(def.name+'  ['+def.code+']');
    L.push(def.desc);
    L.push('Integrity ' + Math.round(t.integrity) + '%' +
      (t.integrity >= 70 ? ' (full output)' : (t.integrity < 25 ? ' - OFFLINE until repaired' : ' - output x'+fmt2(p.iF))));
    if(t.repairing) L.push('UNDER REPAIR - produces nothing this turn.');
    if(def.slots) L.push('Crew ' + workersAt(S,i).length + '/' + def.slots + ' (' + JOBS[def.job].name + ' post) - effort ' + fmt2(p.rate));
    if(def.adj) L.push('Adjacency: ' + def.adj.text + ' -> ' + p.adj.count + ' matched' +
      (p.adj.pct ? ' (+' + Math.round(p.adj.pct*100) + '% output)' : ''));
    if(p.resMult !== 1) L.push('Research multiplier: x' + fmt2(p.resMult));
    if(def.prod) L.push('This turn: ' + flowText(p));
    if(def.beds) L.push('Beds: ' + (def.beds + p.adj.beds));
    if(def.store) L.push('Storage: ' + Object.keys(def.store).map(k=>'+'+(def.store[k] + (p.adj.store[k]||0))+' '+RES_BY[k].name).join(', '));
    if(def.shieldAdj) L.push('Shields the 4 neighbouring buildings: -' + Math.round((def.shieldAdj + p.adj.shield)*100) + '% storm damage');
    if(def.shieldAll) L.push('Shields the whole outpost: -' + Math.round((def.shieldAll + p.adj.shieldAll)*100) + '% storm damage');
    if(def.labDiscount) L.push('Research discount when staffed: up to -' + Math.round((def.labDiscount + p.adj.lab)*100) + '%');
  } else {
    L.push('');
    L.push(ter.buildable ? 'Empty - click to build here.' : 'Cannot be built on.');
    const buildable = BLD_IDS.filter(b=>!buildReason(S,i,b,m));
    if(buildable.length) L.push('Buildable now: ' + buildable.map(b=>BLD[b].name).join(', '));
  }
  return L.join('\n');
}

            : kind === 'fatigue' ? (w > 75 ? 'var(--bad)' : w > 45 ? 'var(--warn)' : 'var(--cool)')
            : 'var(--gold)';
  return '<span class="bar"><i style="width:'+w+'%;background:'+col+'"></i><b>'+esc(label)+'</b></span>';
}
