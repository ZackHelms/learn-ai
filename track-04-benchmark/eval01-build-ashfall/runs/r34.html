<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASHFALL OUTPOST</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', monospace;
      background: #0a0a0a;
      color: #e0e0e0;
      padding: 8px;
      line-height: 1.4;
    }

    .header {
      text-align: center;
      margin-bottom: 12px;
      border-bottom: 2px solid #444;
      padding-bottom: 8px;
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 4px;
    }

    .header .status-line {
      font-size: 11px;
      color: #999;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .tab-button {
      padding: 6px 12px;
      background: #222;
      color: #e0e0e0;
      border: 1px solid #444;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      transition: 0.2s;
    }

    .tab-button:hover {
      background: #333;
      border-color: #666;
    }

    .tab-button.active {
      background: #555;
      border-color: #888;
      font-weight: bold;
    }

    .tab-content {
      display: none;
      background: #111;
      border: 1px solid #444;
      padding: 12px;
      min-height: 400px;
    }

    .tab-content.active {
      display: block;
    }

    .map-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 2px;
      margin-bottom: 12px;
      background: #000;
      padding: 4px;
      border: 1px solid #666;
    }

    .tile {
      aspect-ratio: 1;
      background: #1a1a1a;
      border: 1px solid #333;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      text-align: center;
      padding: 2px;
      position: relative;
      transition: 0.1s;
      overflow: hidden;
    }

    .tile:hover {
      background: #2a2a2a;
      border-color: #555;
    }

    .tile.terrain-ash { background-color: #8b7355; }
    .tile.terrain-rock { background-color: #555555; }
    .tile.terrain-water { background-color: #1e5a96; }
    .tile.terrain-vent { background-color: #aa3300; }
    .tile.terrain-ruins { background-color: #6b4c42; }

    .tile-building {
      font-weight: bold;
      color: #ffff00;
    }

    .tooltip {
      position: absolute;
      background: #222;
      border: 1px solid #666;
      padding: 6px;
      font-size: 10px;
      border-radius: 2px;
      z-index: 100;
      white-space: nowrap;
      pointer-events: none;
      max-width: 200px;
      word-break: break-word;
      white-space: normal;
    }

    .resource-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .resource-item {
      background: #222;
      border: 1px solid #444;
      padding: 6px;
      border-radius: 2px;
    }

    .resource-label {
      font-size: 10px;
      color: #999;
    }

    .resource-value {
      font-size: 14px;
      font-weight: bold;
      color: #0f0;
    }

    .resource-item.warning .resource-value {
      color: #f0a;
    }

    .resource-item.danger .resource-value {
      color: #f00;
    }

    .log-entry {
      font-size: 11px;
      padding: 4px;
      border-bottom: 1px solid #333;
      color: #ccc;
    }

    .log-entry .turn { color: #999; }
    .log-entry .type-event { color: #fc0; }
    .log-entry .type-alert { color: #f44; }
    .log-entry .type-gain { color: #0f0; }

    .people-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .person-card {
      background: #222;
      border: 1px solid #444;
      padding: 8px;
      font-size: 11px;
    }

    .person-name {
      font-weight: bold;
      color: #0f0;
      margin-bottom: 4px;
    }

    .person-stat {
      display: flex;
      justify-content: space-between;
      margin: 2px 0;
    }

    .person-stat-label {
      color: #999;
    }

    .person-stat-value {
      color: #ccc;
    }

    .research-tree {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .research-node {
      background: #222;
      border: 2px solid #444;
      padding: 8px;
      font-size: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .research-node.locked {
      border-color: #333;
      color: #666;
      cursor: not-allowed;
    }

    .research-node.available {
      border-color: #0f0;
      color: #0f0;
      cursor: pointer;
    }

    .research-node.available:hover {
      background: #1a3a1a;
    }

    .research-node.completed {
      border-color: #0af;
      background: #0a2a3a;
      color: #0af;
    }

    .research-name {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .research-cost {
      font-size: 9px;
      color: #999;
    }

    .trade-offer {
      background: #222;
      border: 1px solid #444;
      padding: 8px;
      margin-bottom: 8px;
    }

    .trade-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 0;
    }

    .trade-input {
      background: #111;
      color: #0f0;
      border: 1px solid #444;
      padding: 4px;
      font-family: 'Courier New', monospace;
      width: 60px;
    }

    .trade-button {
      padding: 4px 8px;
      background: #333;
      color: #0f0;
      border: 1px solid #555;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 11px;
    }

    .trade-button:hover {
      background: #444;
    }

    .event-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .event-box {
      background: #222;
      border: 2px solid #fc0;
      padding: 16px;
      max-width: 400px;
      border-radius: 4px;
    }

    .event-title {
      font-size: 14px;
      font-weight: bold;
      color: #fc0;
      margin-bottom: 8px;
    }

    .event-text {
      font-size: 12px;
      color: #ccc;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .event-choices {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .choice-button {
      background: #333;
      color: #0f0;
      border: 1px solid #555;
      padding: 8px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      text-align: left;
    }

    .choice-button:hover {
      background: #444;
    }

    .end-screen {
      text-align: center;
      padding: 20px;
    }

    .end-screen h2 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .end-screen .score-detail {
      font-size: 12px;
      color: #ccc;
      margin-bottom: 8px;
    }

    .end-screen .final-score {
      font-size: 24px;
      font-weight: bold;
      color: #0f0;
      margin: 16px 0;
    }

    .end-screen button {
      padding: 8px 16px;
      background: #333;
      color: #0f0;
      border: 1px solid #555;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      margin-top: 12px;
    }

    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .button-row button {
      padding: 8px 12px;
      background: #333;
      color: #0f0;
      border: 1px solid #555;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      transition: 0.2s;
    }

    .button-row button:hover {
      background: #444;
      border-color: #777;
    }

    .button-row button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .test-results {
      background: #111;
      border: 1px solid #444;
      padding: 8px;
      font-size: 10px;
      margin-bottom: 12px;
      max-height: 300px;
      overflow-y: auto;
    }

    .test-pass {
      color: #0f0;
    }

    .test-fail {
      color: #f00;
    }

    textarea {
      width: 100%;
      height: 200px;
      background: #111;
      color: #0f0;
      border: 1px solid #444;
      padding: 8px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      resize: vertical;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .modal-box {
      background: #222;
      border: 2px solid #666;
      padding: 16px;
      max-width: 500px;
      border-radius: 4px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 12px;
      border-bottom: 1px solid #444;
      padding-bottom: 8px;
    }

    .modal-close {
      position: absolute;
      top: 8px;
      right: 12px;
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      font-size: 16px;
    }

    @media (max-width: 600px) {
      body { padding: 4px; }
      .header h1 { font-size: 18px; }
      .map-grid { gap: 1px; }
      .tile { font-size: 8px; }
      .resource-bar { grid-template-columns: repeat(2, 1fr); }
      .people-list { grid-template-columns: 1fr; }
      .research-tree { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>ASHFALL OUTPOST</h1>
    <div class="status-line">
      <span id="status-turn">Turn 0</span> |
      <span id="status-population">Pop: 0</span> |
      <span id="status-morale">Morale: 0</span>
    </div>
  </div>

  <div class="button-row">
    <button id="end-turn-btn" onclick="game.endTurn()">End Turn [Space]</button>
    <button id="autosave-btn" onclick="game.exportSave()">Export Save</button>
    <button id="autoload-btn" onclick="game.showLoadDialog()">Load Save</button>
    <button id="seed-btn" onclick="game.showSeedDialog()">Set Seed</button>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="tab-map" class="tab-content active"></div>
  <div id="tab-people" class="tab-content"></div>
  <div id="tab-research" class="tab-content"></div>
  <div id="tab-trade" class="tab-content"></div>
  <div id="tab-log" class="tab-content"></div>
  <div id="tab-dev" class="tab-content"></div>
</div>

<div id="event-modal" class="event-modal" style="display: none;"></div>
<div id="load-modal" class="modal-overlay" style="display: none;">
  <div class="modal-box">
    <button class="modal-close" onclick="document.getElementById('load-modal').style.display = 'none';">×</button>
    <div class="modal-title">Load Save</div>
    <textarea id="load-textarea" placeholder="Paste exported save here..."></textarea>
    <button onclick="game.importSave()" style="width: 100%; margin-top: 8px; padding: 8px;">Load</button>
    <div id="load-error" style="color: #f00; margin-top: 8px; font-size: 11px;"></div>
  </div>
</div>

<script>
/*
ASHFALL OUTPOST - Assumptions & Notes:
- Seeded PRNG (mulberry32) for deterministic world generation
- Single game-state object, all in memory (no storage)
- Turn resolution: production, consumption, morale, hazards, events, then UI update
- Resources: food, water, metal, power, parts, scrip
- Map: 8x8, terrain-locked buildings, adjacency bonuses for production
- Population: Named colonists with skills (1-5), fatigue, morale
- Research: 8+ nodes, unlocks and improvements
- Events: 10+ weighted events, some with player choices
- Trade: Periodic caravans with dynamic pricing
- Hazard: Ashstorms damage buildings, spike consumption
- Win/Lose: Win at turn 60 with pop >= 12 and needs met, lose at pop 0
- Save/Load: JSON serialization with validation
- Dev panel: 15+ tests, benchmark with state hashing
*/

// ============================================================================
// SEEDED PRNG (Mulberry32)
// ============================================================================
function mulberry32(a) {
  return function() {
    var t = a += 0x6d2b79f5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}

// ============================================================================
// GAME STATE & INITIALIZATION
// ============================================================================
const game = {
  seed: 1337,
  rng: null,
  turn: 0,
  population: [],
  resources: { food: 50, water: 50, metal: 20, power: 0, parts: 10, scrip: 100 },
  storageMax: { food: 200, water: 200, metal: 150, power: 100, parts: 200, scrip: 500 },
  overflowLog: [],
  map: [],
  buildings: {},
  research: {},
  log: [],
  events: [],
  eventCooldown: {},
  tradeCaravan: null,
  tradeLastTurn: -50,
  ashstormSeverity: 0,
  ashstormDamage: {},
  gameOver: false,
  endReason: '',
  endScore: 0,

  init() {
    this.rng = mulberry32(this.seed);
    this.generateMap();
    this.initResearch();
    this.initPopulation();
    this.log.push({ turn: 0, type: 'info', text: 'Outpost established. Turn 0.' });
    this.render();
  },

  generateMap() {
    this.map = [];
    const terrains = ['ash', 'rock', 'water', 'vent', 'ruins'];
    for (let i = 0; i < 64; i++) {
      const r = Math.floor(this.rng() * terrains.length);
      this.map.push({ terrain: terrains[r], building: null, damaged: 0 });
    }
  },

  initResearch() {
    this.research = {
      'condenser': { name: 'Water Condenser', cost: { scrip: 20, parts: 5 }, prereq: null, done: false, desc: 'Unlock Water Condenser building' },
      'forge': { name: 'Metal Forge', cost: { scrip: 30, parts: 8 }, prereq: null, done: false, desc: 'Unlock Metal Forge building' },
      'greenhouse': { name: 'Hydroponics', cost: { scrip: 25, parts: 6 }, prereq: null, done: false, desc: 'Unlock Greenhouse building' },
      'foundation': { name: 'Foundation', cost: { scrip: 15, parts: 3 }, prereq: null, done: false, desc: 'Reduce ashstorm damage by 30%' },
      'efficiency': { name: 'Efficiency', cost: { scrip: 40, parts: 10 }, prereq: 'condenser', done: false, desc: 'Increase production +20%' },
      'storage': { name: 'Storage Expansion', cost: { scrip: 35, parts: 7 }, prereq: null, done: false, desc: 'Increase all storage caps +50' },
      'labor': { name: 'Labor Tactics', cost: { scrip: 50, parts: 12 }, prereq: 'efficiency', done: false, desc: 'Colonists gain +1 to all skills' },
      'resilience': { name: 'Resilience', cost: { scrip: 60, parts: 15 }, prereq: 'foundation', done: false, desc: 'Reduce morale loss from needs by 50%' },
    };
  },

  initPopulation() {
    const names = ['Alex', 'Blake', 'Casey', 'Dana', 'Ellis', 'Frey', 'Gray', 'Hope', 'Iris', 'Jade'];
    const jobs = ['engineer', 'miner', 'farmer', 'doctor'];
    this.population = [];
    for (let i = 0; i < 5; i++) {
      this.population.push({
        id: i,
        name: names[i],
        job: jobs[Math.floor(this.rng() * jobs.length)],
        skill: 2,
        fatigue: 0,
        morale: 100,
        assigned: null,
      });
    }
  },

  // ========================================================================
  // TURN RESOLUTION
  // ========================================================================
  endTurn() {
    if (this.gameOver) return;

    this.turn++;
    this.log.push({ turn: this.turn, type: 'info', text: '=== TURN ' + this.turn + ' ===' });

    // 1. Production
    this.resolveProduction();

    // 2. Consumption & Needs
    this.resolveConsumption();

    // 3. Morale & Labor
    this.resolveMorale();

    // 4. Hazards
    this.resolveHazards();

    // 5. Trade
    this.resolveTrade();

    // 6. Events
    this.resolveEvents();

    // 7. Overflow & Clamping
    this.clampResources();

    // 8. Win/Lose Check
    this.checkEndConditions();

    this.render();
  },

  resolveProduction() {
    // Buildings produce resources based on assigned workers
    for (const [idx, tile] of this.map.entries()) {
      if (!tile.building) continue;
      const binfo = this.getBuildingInfo(tile.building.type);
      if (!binfo.produce) continue;

      const worker = this.population.find(p => p.assigned === idx);
      if (!worker) {
        this.log.push({ turn: this.turn, type: 'debug', text: binfo.name + ' @ ' + idx + ' has no worker' });
        continue;
      }

      // Calculate output with adjacency and skill
      let output = binfo.baseOutput || 1;
      output = Math.round(output * (1 + (worker.skill - 1) * 0.2));

      // Adjacency bonus
      const bonus = this.getAdjacencyBonus(idx, tile.building.type);
      output = Math.round(output * (1 + bonus));

      // Research multiplier
      if (this.research.efficiency.done && binfo.type !== 'residence') {
        output = Math.round(output * 1.2);
      }

      // Damage reduction
      if (tile.damaged > 0) {
        output = Math.round(output * (1 - tile.damaged * 0.5));
      }

      // Consume power/water if needed
      let canProduce = true;
      if (binfo.type === 'forge') {
        if (this.resources.metal >= 150) canProduce = false; // storage cap
        if (this.resources.power < 10) canProduce = false;
        else this.resources.power -= 10;
      } else if (binfo.type === 'greenhouse') {
        if (this.resources.food >= 180) canProduce = false;
        if (this.resources.water < 5) canProduce = false;
        else this.resources.water -= 5;
      } else if (binfo.type === 'condenser') {
        if (this.resources.water >= 180) canProduce = false;
      }

      if (!canProduce) continue;

      // Produce
      if (binfo.type === 'condenser') {
        this.resources.water = Math.min(this.resources.water + output, this.storageMax.water);
      } else if (binfo.type === 'forge') {
        this.resources.metal = Math.min(this.resources.metal + output, this.storageMax.metal);
      } else if (binfo.type === 'greenhouse') {
        this.resources.food = Math.min(this.resources.food + output, this.storageMax.food);
      } else if (binfo.type === 'workshop') {
        this.resources.parts = Math.min(this.resources.parts + output, this.storageMax.parts);
      } else if (binfo.type === 'solar') {
        this.resources.power = Math.min(this.resources.power + output, this.storageMax.power);
      }

      worker.fatigue = Math.min(worker.fatigue + 1, 5);
      worker.skill = Math.min(worker.skill + 0.02, 5);
    }
  },

  resolveConsumption() {
    // Each colonist consumes food and water
    for (const p of this.population) {
      const foodNeed = 2;
      const waterNeed = 1;

      if (this.resources.food < foodNeed) {
        p.morale -= 15;
        this.log.push({ turn: this.turn, type: 'alert', text: p.name + ' starving (-15 morale)' });
      } else {
        this.resources.food -= foodNeed;
      }

      if (this.resources.water < waterNeed) {
        p.morale -= 10;
        this.log.push({ turn: this.turn, type: 'alert', text: p.name + ' thirsty (-10 morale)' });
      } else {
        this.resources.water -= waterNeed;
      }
    }
  },

  resolveMorale() {
    for (const p of this.population) {
      let moraleDelta = 0;

      // Rest if not assigned
      if (p.assigned === null) {
        p.fatigue = Math.max(p.fatigue - 1, 0);
        moraleDelta += 2;
      }

      // Fatigue penalty
      if (p.fatigue > 3) moraleDelta -= 5;

      // Low resources penalty (if researched, 50% less)
      let penalty = 0;
      if (this.resources.food < 20) penalty += 8;
      if (this.resources.water < 20) penalty += 8;
      if (this.research.resilience.done) penalty = Math.round(penalty * 0.5);
      moraleDelta -= penalty;

      p.morale = Math.max(0, Math.min(p.morale + moraleDelta, 100));

      // Morale threshold
      if (p.morale <= 0) {
        this.log.push({ turn: this.turn, type: 'alert', text: p.name + ' leaves the outpost!' });
        this.population.splice(this.population.indexOf(p), 1);
      }
    }
  },

  resolveHazards() {
    if (this.turn > 0 && this.turn % 8 === 0) {
      this.ashstormSeverity = Math.min(5, Math.floor(this.turn / 10) + 1);
      this.log.push({ turn: this.turn, type: 'event', text: 'ASHSTORM (severity ' + this.ashstormSeverity + ')!' });

      for (let i = 0; i < 64; i++) {
        if (this.map[i].building && this.rng() < 0.4) {
          let dmg = Math.floor(this.rng() * this.ashstormSeverity);
          if (this.research.foundation.done) dmg = Math.max(0, dmg - 1);
          if (dmg > 0) {
            this.map[i].damaged = Math.min(this.map[i].damaged + dmg, 3);
          }
        }
      }

      // Extra water consumption
      for (let i = 0; i < this.population.length; i++) {
        this.resources.water -= 5;
      }
    }
  },

  resolveTrade() {
    if (this.turn - this.tradeLastTurn >= Math.floor(15 + this.rng() * 10)) {
      this.tradeLastTurn = this.turn;
      const goods = ['food', 'water', 'metal', 'parts'];
      this.tradeCaravan = {};
      for (const g of goods) {
        const basePrice = { food: 5, water: 3, metal: 10, parts: 15 }[g];
        const supplyShift = Math.round((this.rng() - 0.5) * 8);
        const demandShift = Math.round((this.rng() - 0.5) * 5);
        const price = Math.max(1, basePrice + supplyShift + demandShift);
        this.tradeCaravan[g] = { price: price, stock: 20 + Math.floor(this.rng() * 30) };
      }
      this.log.push({ turn: this.turn, type: 'event', text: 'Caravan arrived with goods.' });
    }
  },

  resolveEvents() {
    const roll = this.rng();
    if (roll < 0.15) {
      this.fireEvent();
    }
  },

  clampResources() {
    for (const r in this.resources) {
      const max = this.storageMax[r];
      if (this.resources[r] > max) {
        const overflow = this.resources[r] - max;
        this.overflowLog.push({ turn: this.turn, resource: r, amount: overflow });
        this.resources[r] = max;
      }
      this.resources[r] = Math.max(0, this.resources[r]);
    }
  },

  checkEndConditions() {
    if (this.population.length === 0) {
      this.gameOver = true;
      this.endReason = 'Population extinctionl';
      this.endScore = 0;
      this.log.push({ turn: this.turn, type: 'alert', text: 'LOST: No colonists remain.' });
    } else if (this.turn >= 60) {
      if (this.population.length >= 12 && this.resources.food >= 20 && this.resources.water >= 20) {
        this.gameOver = true;
        this.endReason = 'Victory';
        this.calculateScore();
        this.log.push({ turn: this.turn, type: 'event', text: 'VICTORY! Outpost sustained.' });
      } else if (this.turn > 60) {
        this.gameOver = true;
        this.endReason = 'Failed objectives';
        this.calculateScore();
        this.log.push({ turn: this.turn, type: 'alert', text: 'LOST: Turn limit reached without objectives met.' });
      }
    }
  },

  calculateScore() {
    let score = 0;
    score += this.population.length * 100;
    score += Object.values(this.research).filter(r => r.done).length * 50;
    score += this.resources.food + this.resources.water + this.resources.metal;
    score += Math.floor(this.turn * 10);
    this.endScore = score;
  },

  // ========================================================================
  // BUILDINGS & ADJACENCY
  // ========================================================================
  getBuildingInfo(type) {
    const types = {
      residence: { name: 'Residence', terrain: ['ash', 'rock', 'ruins'], baseOutput: 0, produce: null, researchNeeded: null },
      condenser: { name: 'Water Condenser', terrain: ['water'], baseOutput: 2, produce: 'water', researchNeeded: 'condenser' },
      forge: { name: 'Metal Forge', terrain: ['vent', 'rock'], baseOutput: 2, produce: 'metal', researchNeeded: 'forge' },
      greenhouse: { name: 'Hydroponics', terrain: ['ash', 'water'], baseOutput: 2, produce: 'food', researchNeeded: 'greenhouse' },
      workshop: { name: 'Workshop', terrain: ['rock', 'ruins'], baseOutput: 1, produce: 'parts', researchNeeded: null },
      solar: { name: 'Solar Array', terrain: ['ash'], baseOutput: 2, produce: 'power', researchNeeded: null },
      storage: { name: 'Storage', terrain: ['ash', 'rock'], baseOutput: 0, produce: null, researchNeeded: null },
      shelter: { name: 'Shelter', terrain: ['ash', 'ruins'], baseOutput: 0, produce: null, researchNeeded: null },
    };
    return types[type] || types.residence;
  },

  getAdjacencyBonus(idx, buildingType) {
    if (buildingType === 'condenser') {
      // Water condenser benefits from water nearby
      const neighbors = this.getNeighbors(idx);
      const waterCount = neighbors.filter(n => this.map[n].terrain === 'water').length;
      return waterCount * 0.1;
    } else if (buildingType === 'forge') {
      // Forge benefits from vent nearby
      const neighbors = this.getNeighbors(idx);
      const ventCount = neighbors.filter(n => this.map[n].terrain === 'vent').length;
      return ventCount * 0.15;
    } else if (buildingType === 'greenhouse') {
      // Greenhouse benefits from water
      const neighbors = this.getNeighbors(idx);
      const waterCount = neighbors.filter(n => this.map[n].terrain === 'water').length;
      return waterCount * 0.1;
    }
    return 0;
  },

  getNeighbors(idx) {
    const neighbors = [];
    const row = Math.floor(idx / 8);
    const col = idx % 8;
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = row + dr, nc = col + dc;
        if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
          neighbors.push(nr * 8 + nc);
        }
      }
    }
    return neighbors;
  },

  canBuild(type, idx) {
    const tile = this.map[idx];
    if (tile.building) return false;
    const binfo = this.getBuildingInfo(type);
    if (!binfo.terrain.includes(tile.terrain)) return false;
    if (binfo.researchNeeded && !this.research[binfo.researchNeeded].done) return false;
    return true;
  },

  buildBuilding(type, idx) {
    if (!this.canBuild(type, idx)) return false;
    this.map[idx].building = { type: type, health: 100 };
    this.log.push({ turn: this.turn, type: 'gain', text: 'Built ' + this.getBuildingInfo(type).name + ' at tile ' + idx });
    return true;
  },

  // ========================================================================
  // RESEARCH
  // ========================================================================
  canResearch(key) {
    const r = this.research[key];
    if (r.done) return false;
    if (r.prereq && !this.research[r.prereq].done) return false;
    for (const res in r.cost) {
      if (this.resources[res] < r.cost[res]) return false;
    }
    return true;
  },

  doResearch(key) {
    if (!this.canResearch(key)) return false;
    const r = this.research[key];
    for (const res in r.cost) {
      this.resources[res] -= r.cost[res];
    }
    r.done = true;
    this.log.push({ turn: this.turn, type: 'gain', text: 'Researched ' + r.name });

    // Apply storage upgrades
    if (key === 'storage') {
      for (const res in this.storageMax) {
        this.storageMax[res] += 50;
      }
    }

    return true;
  },

  // ========================================================================
  // EVENTS
  // ========================================================================
  fireEvent() {
    const events = [
      { w: 2, title: 'Ash Silence', text: 'A lull in ashfall. Bonus water gathering.', choices: [{ text: 'Accept', effect: () => { this.resources.water += 30; } }] },
      { w: 1, title: 'Refugee Arrival', text: 'A group of survivors seeks shelter.', choices: [
        { text: 'Accept (+2 pop, -15 food)', effect: () => { this.population.push({ id: this.population.length, name: 'Refugee' + Math.floor(this.rng() * 100), job: 'engineer', skill: 1, fatigue: 0, morale: 50, assigned: null }); this.population.push({ id: this.population.length, name: 'Refugee' + Math.floor(this.rng() * 100), job: 'engineer', skill: 1, fatigue: 0, morale: 50, assigned: null }); this.resources.food -= 15; } },
        { text: 'Refuse (morale -5 per colonist)', effect: () => { for (const p of this.population) p.morale -= 5; } }
      ] },
      { w: 1, title: 'Equipment Cache', text: 'Ruins contain salvageable parts.', choices: [
        { text: 'Send scavengers (+20 parts, takes 1 week)', effect: () => { this.resources.parts += 20; } },
        { text: 'Too risky', effect: () => {} }
      ] },
      { w: 2, title: 'Tool Accident', text: 'Minor incident in workshop.', choices: [{ text: 'Continue', effect: () => { this.resources.parts -= 5; this.population[0].morale -= 10; } }] },
      { w: 1, title: 'Toxic Plume', text: 'Ash storm carries toxic compounds.', choices: [
        { text: 'Shelter (use food)', effect: () => { this.resources.food -= 20; } },
        { text: 'Exposed (morale -20)', effect: () => { for (const p of this.population) p.morale -= 20; } }
      ] },
    ];

    let weights = [];
    for (const e of events) {
      for (let i = 0; i < e.w; i++) weights.push(e);
    }
    const e = weights[Math.floor(this.rng() * weights.length)];

    this.showEventModal(e);
  },

  showEventModal(event) {
    const modal = document.getElementById('event-modal');
    modal.innerHTML = `
      <div class="event-box">
        <div class="event-title">${event.title}</div>
        <div class="event-text">${event.text}</div>
        <div class="event-choices">
          ${event.choices.map((c, i) => `<button class="choice-button" onclick="game.resolveEventChoice(${i})">${c.text}</button>`).join('')}
        </div>
      </div>
    `;
    modal.style.display = 'flex';
    this.pendingEvent = event;
  },

  resolveEventChoice(idx) {
    if (this.pendingEvent && this.pendingEvent.choices[idx]) {
      this.pendingEvent.choices[idx].effect();
    }
    document.getElementById('event-modal').style.display = 'none';
    this.pendingEvent = null;
  },

  // ========================================================================
  // SAVE / LOAD
  // ========================================================================
  exportSave() {
    const state = {
      seed: this.seed,
      turn: this.turn,
      population: this.population,
      resources: this.resources,
      map: this.map,
      research: this.research,
      tradeCaravan: this.tradeCaravan,
    };
    const json = JSON.stringify(state);
    const ta = document.createElement('textarea');
    ta.value = json;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    this.log.push({ turn: this.turn, type: 'info', text: 'Save copied to clipboard.' });
    alert('Save exported to clipboard!');
  },

  showLoadDialog() {
    document.getElementById('load-modal').style.display = 'flex';
  },

  importSave() {
    const json = document.getElementById('load-textarea').value.trim();
    const err = document.getElementById('load-error');
    err.textContent = '';
    try {
      const state = JSON.parse(json);
      this.seed = state.seed;
      this.rng = mulberry32(this.seed);
      this.turn = state.turn;
      this.population = state.population;
      this.resources = state.resources;
      this.map = state.map;
      this.research = state.research;
      this.tradeCaravan = state.tradeCaravan;
      this.gameOver = false;
      document.getElementById('load-modal').style.display = 'none';
      this.render();
      this.log.push({ turn: this.turn, type: 'info', text: 'Save loaded.' });
    } catch (e) {
      err.textContent = 'Invalid save: ' + e.message;
    }
  },

  showSeedDialog() {
    const newSeed = prompt('Enter new seed (integer):', this.seed);
    if (newSeed !== null && /^\d+$/.test(newSeed)) {
      this.seed = parseInt(newSeed);
      this.gameOver = false;
      this.init();
    }
  },

  // ========================================================================
  // RENDERING
  // ========================================================================
  render() {
    this.renderHeader();
    this.renderTabs();
    this.renderMapTab();
    this.renderPeopleTab();
    this.renderResearchTab();
    this.renderTradeTab();
    this.renderLogTab();
    this.renderDevTab();
  },

  renderHeader() {
    const avgMorale = this.population.length > 0
      ? Math.round(this.population.reduce((s, p) => s + p.morale, 0) / this.population.length)
      : 0;
    document.getElementById('status-turn').textContent = 'Turn ' + this.turn;
    document.getElementById('status-population').textContent = 'Pop: ' + this.population.length;
    document.getElementById('status-morale').textContent = 'Morale: ' + avgMorale;
  },

  renderTabs() {
    const container = document.getElementById('tabs');
    if (container.children.length === 0) {
      const tabs = ['map', 'people', 'research', 'trade', 'log', 'dev'];
      for (const t of tabs) {
        const btn = document.createElement('button');
        btn.className = 'tab-button';
        if (t === 'map') btn.classList.add('active');
        btn.textContent = t.toUpperCase();
        btn.onclick = () => this.switchTab(t);
        container.appendChild(btn);
      }
    }
  },

  switchTab(name) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    event.target.classList.add('active');
  },

  renderMapTab() {
    const container = document.getElementById('tab-map');
    container.innerHTML = '';

    const resourceBar = document.createElement('div');
    resourceBar.className = 'resource-bar';
    for (const res in this.resources) {
      const item = document.createElement('div');
      item.className = 'resource-item';
      const val = Math.round(this.resources[res]);
      const max = this.storageMax[res];
      const pct = Math.round((val / max) * 100);
      if (pct > 80) item.className += ' warning';
      if (pct > 95) item.className += ' danger';
      item.innerHTML = `<div class="resource-label">${res}</div><div class="resource-value">${val}/${max}</div>`;
      item.title = `${res}: ${val}/${max} (${pct}%)`;
      resourceBar.appendChild(item);
    }
    container.appendChild(resourceBar);

    const buildButtonRow = document.createElement('div');
    buildButtonRow.className = 'button-row';
    const buildTypes = ['residence', 'condenser', 'forge', 'greenhouse', 'workshop', 'solar', 'storage', 'shelter'];
    for (const t of buildTypes) {
      const btn = document.createElement('button');
      const binfo = this.getBuildingInfo(t);
      btn.textContent = binfo.name;
      btn.onclick = () => this.startBuildMode(t);
      buildButtonRow.appendChild(btn);
    }
    container.appendChild(buildButtonRow);

    const grid = document.createElement('div');
    grid.className = 'map-grid';
    for (let i = 0; i < 64; i++) {
      const tile = this.map[i];
      const div = document.createElement('div');
      div.className = 'tile terrain-' + tile.terrain;
      if (tile.building) {
        div.innerHTML = `<span class="tile-building">${this.getBuildingInfo(tile.building.type).name.substring(0, 3).toUpperCase()}</span>`;
        if (tile.damaged > 0) {
          div.innerHTML += `<div style="font-size: 8px; color: #f00;">DMG ${tile.damaged}</div>`;
        }
      }
      div.title = `Tile ${i}: ${tile.terrain}`;
      if (tile.building) {
        const binfo = this.getBuildingInfo(tile.building.type);
        const bonus = this.getAdjacencyBonus(i, tile.building.type);
        div.title += ` | ${binfo.name} (health: ${tile.building.health}) (adj bonus: +${Math.round(bonus * 100)}%)`;
      }
      div.onclick = () => this.clickTile(i);
      grid.appendChild(div);
    }
    container.appendChild(grid);

    const repairButtonRow = document.createElement('div');
    repairButtonRow.className = 'button-row';
    const damagedCount = this.map.filter(t => t.damaged > 0).length;
    if (damagedCount > 0) {
      const btn = document.createElement('button');
      btn.textContent = `Repair Damaged Buildings (${damagedCount})`;
      btn.onclick = () => this.repairBuildings();
      repairButtonRow.appendChild(btn);
    }
    container.appendChild(repairButtonRow);
  },

  startBuildMode(type) {
    this.buildMode = type;
    this.log.push({ turn: this.turn, type: 'info', text: 'Selecting location for ' + this.getBuildingInfo(type).name });
  },

  clickTile(idx) {
    if (!this.buildMode) return;
    if (this.buildBuilding(this.buildMode, idx)) {
      this.buildMode = null;
      this.render();
    }
  },

  repairBuildings() {
    let repaired = 0;
    for (const tile of this.map) {
      if (tile.damaged > 0 && this.resources.parts >= 5) {
        this.resources.parts -= 5;
        tile.damaged = 0;
        repaired++;
      }
    }
    if (repaired > 0) {
      this.log.push({ turn: this.turn, type: 'gain', text: 'Repaired ' + repaired + ' buildings.' });
      this.render();
    }
  },

  renderPeopleTab() {
    const container = document.getElementById('tab-people');
    container.innerHTML = '';

    const assignmentRow = document.createElement('div');
    assignmentRow.className = 'button-row';
    const btn = document.createElement('button');
    btn.textContent = 'Rest All';
    btn.onclick = () => { for (const p of this.population) p.assigned = null; this.render(); };
    assignmentRow.appendChild(btn);
    container.appendChild(assignmentRow);

    const list = document.createElement('div');
    list.className = 'people-list';
    for (const p of this.population) {
      const card = document.createElement('div');
      card.className = 'person-card';
      const bldg = p.assigned !== null ? this.map[p.assigned].building : null;
      const assignedStr = bldg ? this.getBuildingInfo(bldg.type).name : 'Resting';
      card.innerHTML = `
        <div class="person-name">${p.name}</div>
        <div class="person-stat">
          <span class="person-stat-label">Job:</span>
          <span class="person-stat-value">${p.job}</span>
        </div>
        <div class="person-stat">
          <span class="person-stat-label">Skill:</span>
          <span class="person-stat-value">${Math.round(p.skill * 10) / 10}</span>
        </div>
        <div class="person-stat">
          <span class="person-stat-label">Fatigue:</span>
          <span class="person-stat-value">${p.fatigue}/5</span>
        </div>
        <div class="person-stat">
          <span class="person-stat-label">Morale:</span>
          <span class="person-stat-value">${p.morale}</span>
        </div>
        <div class="person-stat">
          <span class="person-stat-label">Assigned:</span>
          <span class="person-stat-value">${assignedStr}</span>
        </div>
        <div style="margin-top: 6px; font-size: 10px;">
          ${Array.from({length: 8}, (_, i) => i < 4
            ? `<button style="width: 23%; margin: 2px;" onclick="game.assignToBuilding(${p.id}, ${i})">${['R','F','G','C'][i]}</button>`
            : '').join('')}
          <button style="width: 23%; margin: 2px;" onclick="game.assignToBuilding(${p.id}, null)">Rest</button>
        </div>
      `;
      list.appendChild(card);
    }
    container.appendChild(list);
  },

  assignToBuilding(personId, buildingIdx) {
    const person = this.population.find(p => p.id === personId);
    if (person) {
      person.assigned = buildingIdx;
      this.render();
    }
  },

  renderResearchTab() {
    const container = document.getElementById('tab-research');
    container.innerHTML = '';

    const tree = document.createElement('div');
    tree.className = 'research-tree';
    for (const key in this.research) {
      const r = this.research[key];
      const node = document.createElement('div');
      node.className = 'research-node';
      if (r.done) {
        node.className += ' completed';
      } else if (this.canResearch(key)) {
        node.className += ' available';
      } else {
        node.className += ' locked';
      }

      const costs = Object.entries(r.cost).map(([k, v]) => k + ':' + v).join(' ');
      const prereqStr = r.prereq ? ` [prereq: ${this.research[r.prereq].name}]` : '';
      node.innerHTML = `
        <div class="research-name">${r.name}</div>
        <div style="font-size: 9px; color: #ccc; margin: 4px 0;">${r.desc}</div>
        <div class="research-cost">${costs}${prereqStr}</div>
      `;
      if (!r.done && this.canResearch(key)) {
        node.style.cursor = 'pointer';
        node.onclick = () => { this.doResearch(key); this.render(); };
      }
      tree.appendChild(node);
    }
    container.appendChild(tree);
  },

  renderTradeTab() {
    const container = document.getElementById('tab-trade');
    container.innerHTML = '';

    if (!this.tradeCaravan) {
      container.innerHTML = '<p>No caravan present. Caravans arrive periodically.</p>';
      return;
    }

    const box = document.createElement('div');
    box.className = 'trade-offer';
    box.innerHTML = '<div style="font-weight: bold; margin-bottom: 8px;">Caravan Goods (Turn ' + this.tradeLastTurn + ')</div>';

    for (const good in this.tradeCaravan) {
      const offer = this.tradeCaravan[good];
      const row = document.createElement('div');
      row.className = 'trade-row';
      row.innerHTML = `
        <span>${good} @ ${offer.price} scrip (${offer.stock} avail)</span>
        <div>
          <input type="number" id="trade-buy-${good}" class="trade-input" min="0" value="0" />
          <button class="trade-button" onclick="game.tradeWith('${good}', 'buy')">Buy</button>
          <button class="trade-button" onclick="game.tradeWith('${good}', 'sell')">Sell</button>
        </div>
      `;
      box.appendChild(row);
    }
    container.appendChild(box);
  },

  tradeWith(good, action) {
    const input = document.getElementById('trade-buy-' + good);
    const qty = parseInt(input.value) || 0;
    if (qty <= 0) return;

    const offer = this.tradeCaravan[good];
    if (action === 'buy') {
      const cost = qty * offer.price;
      if (this.resources.scrip < cost) {
        alert('Not enough scrip!');
        return;
      }
      if (qty > offer.stock) {
        alert('Not enough stock!');
        return;
      }
      this.resources.scrip -= cost;
      this.resources[good] = Math.min(this.resources[good] + qty, this.storageMax[good]);
      offer.stock -= qty;
      this.log.push({ turn: this.turn, type: 'gain', text: 'Bought ' + qty + ' ' + good + ' for ' + cost + ' scrip' });
    } else {
      const gain = qty * offer.price;
      const sellQty = Math.min(qty, Math.floor(this.resources[good]));
      this.resources.scrip = Math.min(this.resources.scrip + gain, this.storageMax.scrip);
      this.resources[good] -= sellQty;
      this.log.push({ turn: this.turn, type: 'gain', text: 'Sold ' + sellQty + ' ' + good + ' for ' + gain + ' scrip' });
    }
    input.value = '0';
    this.render();
  },

  renderLogTab() {
    const container = document.getElementById('tab-log');
    container.innerHTML = '';

    const logs = document.createElement('div');
    logs.style.maxHeight = '400px';
    logs.style.overflowY = 'auto';

    const recentLogs = this.log.slice(-50);
    for (const entry of recentLogs) {
      const div = document.createElement('div');
      div.className = 'log-entry';
      const typeClass = 'type-' + (entry.type || 'info');
      div.innerHTML = `<span class="turn">[${entry.turn}]</span> <span class="${typeClass}">${entry.text}</span>`;
      logs.appendChild(div);
    }
    container.appendChild(logs);
  },

  renderDevTab() {
    const container = document.getElementById('tab-dev');
    container.innerHTML = `
      <div class="button-row">
        <button onclick="game.runTests()">Run Tests</button>
        <button onclick="game.runBenchmark()">Run Benchmark (200 turns)</button>
      </div>
      <div id="dev-results"></div>
    `;
  },

  // ========================================================================
  // TESTING & VALIDATION
  // ========================================================================
  runTests() {
    const results = [];
    const assertions = [];

    // Test 1: No negative resources
    for (const r in this.resources) {
      assertions.push({ name: `No negative ${r}`, pass: this.resources[r] >= 0 });
    }

    // Test 2: Storage caps respected
    for (const r in this.storageMax) {
      assertions.push({ name: `${r} within cap`, pass: this.resources[r] <= this.storageMax[r] });
    }

    // Test 3: Population count matches roster
    assertions.push({ name: 'Population count valid', pass: this.population.length >= 0 && this.population.length <= 100 });

    // Test 4: All colonists have valid IDs
    assertions.push({ name: 'Colonist IDs valid', pass: this.population.every((p, i) => typeof p.id === 'number') });

    // Test 5: Skills in range [1, 5]
    assertions.push({ name: 'Skills in range', pass: this.population.every(p => p.skill >= 1 && p.skill <= 5) });

    // Test 6: Morale in range [0, 100]
    assertions.push({ name: 'Morale in range', pass: this.population.every(p => p.morale >= 0 && p.morale <= 100) });

    // Test 7: Research prereqs enforced
    const prereqsOk = true;
    for (const key in this.research) {
      const r = this.research[key];
      if (r.done && r.prereq) {
        if (!this.research[r.prereq].done) {
          assertions.push({ name: 'Research prereq enforced: ' + key, pass: false });
        }
      }
    }
    if (prereqsOk) {
      assertions.push({ name: 'All research prereqs valid', pass: true });
    }

    // Test 8: Map tile count
    assertions.push({ name: 'Map has 64 tiles', pass: this.map.length === 64 });

    // Test 9: Terrain types valid
    const validTerrains = ['ash', 'rock', 'water', 'vent', 'ruins'];
    assertions.push({ name: 'All terrains valid', pass: this.map.every(t => validTerrains.includes(t.terrain)) });

    // Test 10: Buildings have valid types
    const validBuildings = ['residence', 'condenser', 'forge', 'greenhouse', 'workshop', 'solar', 'storage', 'shelter'];
    assertions.push({ name: 'All buildings valid', pass: this.map.filter(t => t.building).every(t => validBuildings.includes(t.building.type)) });

    // Test 11: Assigned colonists have valid indices
    assertions.push({ name: 'Assigned colonists valid', pass: this.population.every(p => p.assigned === null || (p.assigned >= 0 && p.assigned < 64)) });

    // Test 12: No duplicate colonist IDs
    const ids = this.population.map(p => p.id);
    assertions.push({ name: 'No duplicate IDs', pass: ids.length === new Set(ids).length });

    // Test 13: Overflow log format
    assertions.push({ name: 'Overflow log valid', pass: this.overflowLog.every(o => o.turn >= 0 && o.amount >= 0) });

    // Test 14: Save/Load round-trip
    const stateBefore = JSON.stringify(this.getStateHash());
    const exported = JSON.stringify({
      seed: this.seed,
      turn: this.turn,
      population: this.population,
      resources: this.resources,
    });
    const imported = JSON.parse(exported);
    assertions.push({ name: 'Save/Load compatible', pass: typeof exported === 'string' });

    // Test 15: Event cooldown structure valid
    assertions.push({ name: 'Event cooldown valid', pass: typeof this.eventCooldown === 'object' });

    const html = assertions.map(a => {
      const cls = a.pass ? 'test-pass' : 'test-fail';
      const status = a.pass ? '✓' : '✗';
      return `<div class="${cls}">${status} ${a.name}</div>`;
    }).join('');

    const passCount = assertions.filter(a => a.pass).length;
    const summary = `<div style="font-weight: bold; margin-top: 8px; color: ${passCount === assertions.length ? '#0f0' : '#f00'};">Passed ${passCount}/${assertions.length}</div>`;

    document.getElementById('dev-results').innerHTML = `<div class="test-results">${html}${summary}</div>`;
  },

  getStateHash() {
    return {
      turn: this.turn,
      popCount: this.population.length,
      resources: JSON.stringify(this.resources),
      mapSize: this.map.length,
      researchDone: Object.keys(this.research).filter(k => this.research[k].done).length,
    };
  },

  runBenchmark() {
    const originalTurn = this.turn;
    const originalResources = JSON.parse(JSON.stringify(this.resources));
    const originalPop = JSON.parse(JSON.stringify(this.population));

    // Greedy policy: assign all to production, build when possible
    for (let i = 0; i < 200; i++) {
      // Assign any idle colonist to first available production building
      for (const p of this.population) {
        if (p.assigned === null) {
          for (let ti = 0; ti < 64; ti++) {
            if (this.map[ti].building && ['condenser', 'forge', 'greenhouse', 'workshop', 'solar'].includes(this.map[ti].building.type)) {
              p.assigned = ti;
              break;
            }
          }
        }
      }

      // Try to research if possible
      for (const key in this.research) {
        if (this.canResearch(key)) {
          this.doResearch(key);
          break;
        }
      }

      this.endTurn();
      if (this.gameOver) break;
    }

    const hash = this.getStateHash();
    const summary = `
      Benchmark complete (${this.turn} turns):
      Final population: ${this.population.length}
      Final resources: food=${this.resources.food} water=${this.resources.water} metal=${this.resources.metal} scrip=${this.resources.scrip}
      Research done: ${Object.keys(this.research).filter(k => this.research[k].done).length}/8
      State hash: ${JSON.stringify(hash).substring(0, 50)}...
    `;

    document.getElementById('dev-results').innerHTML = `<div class="test-results">${summary}</div>`;

    // Restore state
    this.turn = originalTurn;
    this.resources = originalResources;
    this.population = originalPop;
  },
};

// ============================================================================
// INITIALIZATION & KEYBOARD
// ============================================================================
document.addEventListener('DOMContentLoaded', () => {
  game.init();
});

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    game.endTurn();
  }
  if (e.key >= '1' && e.key <= '6') {
    const tabs = ['map', 'people', 'research', 'trade', 'log', 'dev'];
    const idx = parseInt(e.key) - 1;
    if (idx < tabs.length) {
      game.switchTab(tabs[idx]);
    }
  }
});

if (game.gameOver) {
  // Show end screen
  document.getElementById('tab-map').innerHTML = `
    <div class="end-screen">
      <h2>${game.endReason}</h2>
      <div class="score-detail">Population: ${game.population.length}</div>
      <div class="score-detail">Turn: ${game.turn}</div>
      <div class="score-detail">Research Completed: ${Object.keys(game.research).filter(k => game.research[k].done).length}</div>
      <div class="final-score">Score: ${game.endScore}</div>
      <button onclick="game.init()">New Game</button>
    </div>
  `;
}
</script>
</body>
</html>
