  p.appendChild(el("h2", null, S.caravan ? "Caravan In Camp — leaves in " + S.caravan.turnsLeft + " turn(s)" : "No Caravan"));
  const sp = spreadOf(S);
  p.appendChild(el("div","small muted",
    "Scrip: " + Math.floor(S.res.scrip) + " · Spread: " + pct(sp) +
    " (base 30%" + (has(S,"logistics") ? ", Logistics -25%" : "") + ", staffed Trade Posts -25% each up to two)."));
  if (!S.caravan){
    p.appendChild(el("div","small","The next caravan is expected in about " + S.caravanIn + " turn(s). Prices below are still shown so you can plan."));
  } else {
    p.appendChild(el("div","small","They are short on <b>" + RMAP[S.caravan.wants].n + "</b> and pay 25% over the sell price for it."));
  }
  const t = el("table");
  t.innerHTML = "<thead><tr><th>Resource</th><th>You</th><th>Buy @</th><th>Sell @</th><th>Stock</th><th>Actions</th></tr></thead>";
  const tb = el("tbody");
  TRADABLE.forEach((k, ix) => {
    const pi = priceInfo(S, k);
    const tr = el("tr", ix % 2 ? "alt" : "");
    const nm = el("td", null, RMAP[k].g + " " + RMAP[k].n);
    nm.dataset.tip = "<b>" + RMAP[k].n + " pricing</b><br>base " + pi.base +
      "<br>× global demand " + r2(pi.glob) + " <span class='ln'>(drifts every turn)</span>" +
      "<br>× your stock modifier " + r2(pi.stockMod) + " <span class='ln'>(store " + pct(pi.fill) + " full; fuller = they pay less)</span>" +
      "<br>= mid " + r2(pi.mid) + ", spread ±" + pct(pi.spread) +
      "<br>Buy " + r2(pi.buy) + " · Sell " + r2(pi.sell) +
      (S.caravan && S.caravan.wants === k ? "<br><b>Caravan pays +25% for this.</b>" : "");
    tr.appendChild(nm);
    tr.appendChild(el("td","mono", String(Math.floor(S.res[k]))));
    tr.appendChild(el("td","mono", r2(pi.buy)));
    tr.appendChild(el("td","mono", r2(pi.sell * (S.caravan && S.caravan.wants === k ? 1.25 : 1))));
    tr.appendChild(el("td","mono", S.caravan ? String(S.caravan.inv[k] || 0) : "—"));
    const act = el("td"); const r = el("div","row");
    [1,10].forEach(q => {
      const bb = el("button", null, "Buy " + q);
      bb.disabled = !S.caravan || !(S.caravan.inv[k] >= 1);
      bb.dataset.tip = "Costs about " + Math.round(pi.buy * Math.min(q, S.caravan ? (S.caravan.inv[k]||0) : 0)) + " scrip.";
      bb.onclick = () => { const e = tradeBuy(S, k, q); if (e) toast(e); render(); };
      r.appendChild(bb);
    });
    [1,10].forEach(q => {
      const sb = el("button", null, "Sell " + q);
      sb.disabled = !S.caravan || S.res[k] < 1;
      sb.dataset.tip = "Earns about " + Math.round(pi.sell * (S.caravan && S.caravan.wants===k?1.25:1) * Math.min(q, Math.floor(S.res[k]))) + " scrip.";
      sb.onclick = () => { const e = tradeSell(S, k, q); if (e) toast(e); render(); };
      r.appendChild(sb);
    });
    const sa = el("button", null, "Sell surplus");
    sa.dataset.tip = "Sells everything above half of your storage cap for " + RMAP[k].n + ".";
    sa.disabled = !S.caravan || S.res[k] <= capOf(S,k)/2;
    sa.onclick = () => { const e = tradeSell(S, k, Math.floor(S.res[k] - capOf(S,k)/2)); if (e) toast(e); render(); };
    r.appendChild(sa);
    act.appendChild(r); tr.appendChild(act);
    tb.appendChild(tr);
  });
  t.appendChild(tb); p.appendChild(t);
  P.appendChild(p);

  const q = el("div","panel");
  q.appendChild(el("h2", null, "Global Market Drift"));
  q.appendChild(el("div","small muted","Every turn each commodity's global demand wanders by up to ±0.06, bounded to 0.60–1.70. Hold and sell into a spike."));
  RKEYS.filter(k => k !== "scrip").forEach(k => {
    const row = el("div","row sp"); row.style.marginTop = "3px";
    row.appendChild(el("span","small", RMAP[k].n));
    const m = el("div","meter"); m.style.flex = "1"; m.style.maxWidth = "220px";
    const i = el("i"); i.style.width = ((S.market[k] - 0.6) / 1.1 * 100) + "%";
    i.className = S.market[k] > 1.2 ? "g" : S.market[k] < 0.85 ? "b" : "w";
    m.appendChild(i); row.appendChild(m);
    const v = el("span","small mono", r2(S.market[k]) + (S.market[k] > 1.2 ? " HIGH" : S.market[k] < 0.85 ? " LOW" : " mid"));
    row.appendChild(v);
    row.dataset.tip = "<b>" + RMAP[k].n + "</b> global demand " + r2(S.market[k]) +
      "<br><span class='ln'>1.00 is normal. Above 1.20 is a sellers' market, below 0.85 is a glut.</span>";
    q.appendChild(row);
  });
  P.appendChild(q);
}

/* ---- LOG TAB ---- */
function renderLog(){
  const P = $("tab-log"); P.innerHTML = "";
  const p = el("div","panel");
  p.appendChild(el("h2", null, "Outpost Log"));
  p.appendChild(el("div","small muted",
    "Turn resolution order: 1 ashstorm → 2 production (raw producers, then converters) → 3 storage overflow → " +
    "4 needs → 5 morale & fatigue → 6 market drift & caravan → 7 event → 8 arrivals → 9 end checks."));
  const box = el("div"); box.id = "logbox";
  const rows = S.log.slice().reverse();
  rows.forEach(e => {
    const d = el("div","le k-" + (e.k || "sys"));
    d.appendChild(el("div","t","T" + e.t));
    d.appendChild(el("div", null, e.x));
    box.appendChild(d);
  });
  if (!rows.length) box.appendChild(el("div","muted small","Nothing logged yet."));
  p.appendChild(box);
  P.appendChild(p);

  const st = el("div","panel");
  st.appendChild(el("h2", null, "Record"));
  const s = S.stats;
  const items = [
    ["Turns survived", S.turn],
    ["Storms weathered", s.storms],
    ["Turns short of food", s.shortF],
    ["Turns short of water", s.shortW],
    ["Colonists arrived", s.born],
    ["Colonists lost", s.left],
    ["Repairs made", s.repairs],
    ["Resources lost to overflow", Math.round(s.overflow)],
    ["Scrip moved in trade", Math.round(s.traded)],
    ["Research completed", TKEYS.filter(k=>has(S,k)).length + " / " + TKEYS.length],
    ["Buildings standing", Object.keys(S.b).length]
  ];
  const t = el("table"); const tb = el("tbody");
  items.forEach(([n,v], ix) => {
    const tr = el("tr", ix%2?"alt":"");
    tr.appendChild(el("td", null, n)); tr.appendChild(el("td","mono", String(v)));
    tb.appendChild(tr);
  });
  t.appendChild(tb); st.appendChild(t);
  P.appendChild(st);
}

/* ---- DEV TAB ---- */
function renderDev(){
  const P = $("tab-dev"); P.innerHTML = "";

  const sp = el("div","panel");
  sp.appendChild(el("h2", null, "Seed & New Game"));
  const r = el("div","row");
  const inp = el("input"); inp.type = "number"; inp.value = S.seed; inp.style.width = "120px"; inp.id = "seedin";
  inp.dataset.tip = "Any 32-bit integer. The same seed always produces the same map, storms, events and market.";
  r.appendChild(el("span","small","Seed:")); r.appendChild(inp);
  const b = el("button","primary","Start new game");
  b.onclick = () => {
    const v = parseInt($("seedin").value, 10);
    if (!isFinite(v)){ toast("Seed must be a whole number."); return; }
    S = newGame(v | 0); SEL = -1; BUILDPICK = null; render();
  };
  r.appendChild(b);
  sp.appendChild(r);
  P.appendChild(sp);

  const svp = el("div","panel");
  svp.appendChild(el("h2", null, "Save / Load (copy & paste — no browser storage used)"));
  const ta = el("textarea"); ta.id = "savebox"; ta.rows = 6; ta.spellcheck = false;
  ta.placeholder = "Press “Write save here”, then select all and copy. To load, paste a save into this box and press “Load from box”.";
  svp.appendChild(ta);
  const rr = el("div","row"); rr.style.marginTop = "6px";
  const bs = el("button", null, "Write save here");
  bs.onclick = () => { $("savebox").value = saveText(S); $("saveinfo").textContent =
    "Wrote " + $("savebox").value.length + " characters. State hash " + stateHash(S) + "."; };
  const bl = el("button","primary","Load from box");
  bl.onclick = () => {
    const txt = $("savebox").value.trim();
    if (!txt){ $("saveinfo").innerHTML = "<span class='no'>Nothing to load — the box is empty.</span>"; return; }
    try {
      const NS = loadText(txt);
      S = NS; SEL = -1; BUILDPICK = null;
      $("saveinfo").innerHTML = "<span class='ok'>Loaded. Turn " + S.turn + ", " + pop(S) + " colonists, hash " + stateHash(S) + ".</span>";
      render();
    } catch(e){
      $("saveinfo").innerHTML = "<span class='no'>Load failed: " + esc(e.message) + "</span>";
    }
  };
  const bc = el("button", null, "Verify round-trip");
  bc.dataset.tip = "Serialises the live game, parses it back, and compares canonical state hashes.";
  bc.onclick = () => {
    const h1 = stateHash(S);
    try {
      const h2 = stateHash(loadText(saveText(S)));
      $("saveinfo").innerHTML = h1 === h2
        ? "<span class='ok'>Round-trip identical: " + h1 + "</span>"
        : "<span class='no'>MISMATCH " + h1 + " vs " + h2 + "</span>";
    } catch(e){ $("saveinfo").innerHTML = "<span class='no'>" + esc(e.message) + "</span>"; }
  };
  rr.appendChild(bs); rr.appendChild(bl); rr.appendChild(bc);
  svp.appendChild(rr);
  svp.appendChild(el("div","small", "")).id = "saveinfo";
  P.appendChild(svp);

  const tp = el("div","panel");
  tp.appendChild(el("h2", null, "Verification"));
  const tr2 = el("div","row");
  const bt = el("button","primary","Run Tests");
  bt.onclick = () => { lastTests = runTests(); render(); };
  const bb = el("button","primary","Run Benchmark");
  bb.dataset.tip = "Simulates 200 turns headlessly from the current seed with a fixed greedy policy, then prints a canonical state hash. Two runs on the same seed must print the same hash.";
  bb.onclick = () => {
    const t0 = performance.now();
    const A = runBenchmark(S.seed, 200);
    const t1 = performance.now();
    const B = runBenchmark(S.seed, 200);
    lastBench = {
      hashA: stateHash(A), hashB: stateHash(B), ms: Math.round(t1 - t0),
      turn: A.turn, pop: pop(A), housing: housing(A),
      tech: TKEYS.filter(k => has(A,k)).length,
      bld: Object.keys(A.b).length,
      res: RKEYS.map(k => k + " " + Math.round(A.res[k])).join(", "),
      storms: A.stats.storms, left: A.stats.left, born: A.stats.born,
      shortF: A.stats.shortF, shortW: A.stats.shortW,
      score: scoreOf(A).total
    };
    render();
  };
  tr2.appendChild(bt); tr2.appendChild(bb);
  tp.appendChild(tr2);

  if (lastTests){
    const pass = lastTests.filter(t => t.pass).length;
    const h = el("h3", null, "Tests: " + pass + " / " + lastTests.length + " passed");
    h.style.color = pass === lastTests.length ? "var(--good)" : "var(--bad)";
    tp.appendChild(h);
    const tt = el("table"); const tb = el("tbody");
    lastTests.forEach((t, ix) => {
      const tr = el("tr", ix%2?"alt":"");
      const st = el("td"); st.innerHTML = t.pass ? "<span class='ok'>PASS</span>" : "<span class='no'>FAIL</span>";
      st.style.width = "52px";
      tr.appendChild(st);
      tr.appendChild(el("td", null, t.name));
      tr.appendChild(el("td","small muted", t.detail));
      tb.appendChild(tr);
    });
    tt.appendChild(tb); tp.appendChild(tt);
  } else tp.appendChild(el("div","small muted","No test run yet."));

  if (lastBench){
    const L = lastBench;
    tp.appendChild(el("h3", null, "Benchmark — 200 turns, seed " + S.seed));
    const d = el("div","small");
    d.innerHTML =
      "Run A hash: <b>" + L.hashA + "</b><br>" +
      "Run B hash: <b>" + L.hashB + "</b><br>" +
      (L.hashA === L.hashB ? "<span class='ok'>DETERMINISTIC — identical hashes.</span>"
                           : "<span class='no'>NON-DETERMINISTIC — hashes differ.</span>") +
      "<br>Elapsed (one run): " + L.ms + " ms" +
      "<br>Final turn " + L.turn + " · population " + L.pop + "/" + L.housing + " beds · buildings " + L.bld +
      "<br>Research " + L.tech + "/" + TKEYS.length + " · storms " + L.storms +
      " · arrivals " + L.born + " · departures " + L.left +
      "<br>Shortage turns: food " + L.shortF + ", water " + L.shortW +
      "<br>Resources: " + esc(L.res) +
      "<br>Greedy-policy score: " + L.score;
    tp.appendChild(d);
  } else tp.appendChild(el("div","small muted","No benchmark run yet."));
  P.appendChild(tp);

  const dbg = el("div","panel");
  dbg.appendChild(el("h2", null, "Live State"));
  dbg.appendChild(el("div","small mono","hash " + stateHash(S) + " · rng cursor " + S.rngState +
    " · buildings " + Object.keys(S.b).length + " · log entries " + S.log.length));
  P.appendChild(dbg);
}

/* ---- modal / events / end screen ---- */
function openModal(html, buttons){
  const m = $("modal"); m.innerHTML = html;
  (buttons || []).forEach(b => {
    const btn = el("button","choice" + (b.primary ? " primary" : ""), b.t);
    if (b.tip) btn.dataset.tip = b.tip;
    btn.onclick = b.fn;
    m.appendChild(btn);
  });
  $("veil").classList.add("on");
}
function closeModal(){ $("veil").classList.remove("on"); }

function showPending(){
  const e = EVENTS.find(x => x.id === S.pending);
  if (!e) return;
  openModal("<h2>" + esc(e.title) + "</h2><div class='small'>" + esc(e.text) + "</div>",
    e.choices.map((c, ix) => ({t: c.t, primary: ix === 0, fn: () => {
      const msg = resolvePending(S, ix);
      closeModal();
      openModal("<h2>" + esc(e.title) + "</h2><div class='small'>" + esc(msg) + "</div>",
        [{t:"Continue", primary:true, fn: () => { closeModal(); afterEvent(); }}]);
      render();
    }})));
}
function afterEvent(){ render(); if (S.over) showEnd(); }

function showEnd(){
  const sc = S.over.score || scoreOf(S);
  let rows = sc.parts.map(p => "<tr><td>" + esc(p.n) + "</td><td class='mono' style='text-align:right'>" + p.v + "</td></tr>").join("");
  const grade = sc.total >= 3000 ? "EXEMPLARY" : sc.total >= 2000 ? "SOUND" : sc.total >= 1200 ? "MARGINAL" : sc.total >= 500 ? "PRECARIOUS" : "FAILED";
  openModal(
    "<h2>" + (S.over.win ? "OUTPOST HOLDS" : "OUTPOST LOST") + "</h2>" +
    "<div class='small'>" + esc(S.over.reason) + "</div>" +
    "<h3 style='color:var(--ink2)'>Final assessment</h3>" +
    "<table><tbody>" + rows +
    "<tr><td><b>TOTAL</b></td><td class='mono' style='text-align:right'><b>" + sc.total + "</b></td></tr>" +
    "</tbody></table>" +
    "<div class='small' style='margin-top:8px'>Charter grade: <b>" + grade + "</b><br>" +
    "Turn " + S.turn + " · population " + pop(S) + " · research " + TKEYS.filter(k=>has(S,k)).length + "/" + TKEYS.length +
    " · storms weathered " + S.stats.storms + "</div>",
    [
      {t:"New game, same seed (" + S.seed + ")", primary:true, fn: () => { S = newGame(S.seed); SEL=-1; BUILDPICK=null; closeModal(); render(); }},
      {t:"New game, next seed (" + (S.seed + 1) + ")", fn: () => { S = newGame(S.seed + 1); SEL=-1; BUILDPICK=null; closeModal(); render(); }},
      {t:"Close and inspect the wreckage", fn: closeModal}
    ]);
}

let toastT = null;
function toast(msg){
  let t = $("toastbox");
  if (!t){
    t = el("div"); t.id = "toastbox";
    t.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:58px;z-index:70;" +
      "background:#2a1a12;border:1px solid var(--hot);border-radius:6px;padding:7px 12px;font-size:12px;max-width:92vw;text-align:center";
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.display = "block";
  clearTimeout(toastT); toastT = setTimeout(() => t.style.display = "none", 2600);
}

/* ---- end turn ---- */
function endTurn(){
  if (S.over){ showEnd(); return; }
  if (S.pending){ showPending(); return; }
  resolveTurn(S, false);
  render();
  if (S.pending) showPending();
  else if (S.over) showEnd();
}

/* ---- master render ---- */
function render(){
  renderHeader();
  renderTabs();
  if (TAB === "map") renderMap();
  else if (TAB === "people") renderPeople();
  else if (TAB === "research") renderResearch();
  else if (TAB === "trade") renderTrade();
  else if (TAB === "log") renderLog();
  else if (TAB === "dev") renderDev();
  $("btn-end").disabled = false;
  $("btn-end").innerHTML = S.over ? "SHOW RESULT" : "END TURN <span class='hint'>[space]</span>";
  const warn = [];
  const cons = consumption(S);
  if (S.res.food < cons.food) warn.push("food");
  if (S.res.water < cons.water) warn.push("water");
  $("tagline").textContent = S.over
    ? (S.over.win ? "the charter is satisfied" : "the outpost is finished")
    : warn.length ? "WARNING: not enough " + warn.join(" or ") + " for next turn"
    : "the sky has not been blue for eleven months";
}

$("btn-end").onclick = endTurn;
$("btn-rest").onclick = () => {
  let n = 0;
  S.people.forEach(c => { if (c.fatigue > 70 && c.at >= 0){ unassign(S,c); n++; } });
  toast(n ? n + " exhausted colonist(s) sent to rest." : "Nobody is exhausted enough to pull off shift.");
  render();
};
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea,select")) return;
  if (e.code === "Space"){ e.preventDefault(); if ($("veil").classList.contains("on")) return; endTurn(); }
  const t = TABS.find(x => x.key === e.key);
  if (t){ TAB = t.k; render(); }
  if (e.key === "Escape" && $("veil").classList.contains("on") && !S.pending) closeModal();
});
$("veil").onclick = e => { if (e.target.id === "veil" && !S.pending) closeModal(); };

render();
</script>
</body>
</html>
