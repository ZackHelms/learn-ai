<body>
<script>
/*
ASHFALL OUTPOST - Complete Web Game
=====================================
ASSUMPTIONS:
- Seeded PRNG (Mulberry32) ensures deterministic gameplay
- Single game state object manages all systems
- No external resources; all inline
- All state in memory only
- 8x8 procedurally-generated map with terrain and adjacency bonuses
- 6 core resources with production chains
- Individual colonists with skills, fatigue, morale
- Research tree unlocks buildings and improves production
- Event deck with weighted choices (at least 4 choice events)
- Periodic caravan with dynamic pricing
- Ashstorms every N turns with increasing severity
- Win: turn 60 with 12+ population and core needs met
- Lose: population hits 0
- Dev panel with 15+ assertions and deterministic benchmark
*/

// ============================================================================
// SEEDED PRNG (Mulberry32)
// ============================================================================
function mulberry32(seed) {
    return function() {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

// ============================================================================
// GAME STATE
// ============================================================================
let gameState = null;

function initGame(seed = 1337) {
    const rng = mulberry32(seed);

    gameState = {
        seed: seed,
        rng: rng,
        turn: 0,
        population: 3,
        colonists: [],

        // Resources: food, water, metal, power, parts, scrip
        resources: {
            food: 50,
            water: 50,
            metal: 20,
            power: 0,
            parts: 10,
            scrip: 100
        },

        resourceCaps: {
            food: 500,
            water: 500,
            metal: 200,
            power: 150,
            parts: 100,
            scrip: 500
        },

        // 8x8 Map
        map: [],
        buildings: {},

        // Research
        research: {},
        researchDone: new Set(),

        // Events
        eventLog: [],
        recentEvents: new Set(),

        // Trade
        tradeActive: false,
        tradeInventory: {},
        tradePrices: {},
        globalSupply: { food: 1000, water: 1000, metal: 500, parts: 100 },

        // Hazards
        ashstormSchedule: 5,
        ashstormSeverity: 1,
        damageQueue: {},
    };

    // Initialize colonists with starting job distribution
    gameState.colonists = [
        { name: 'Alex', job: 'farmer', skill: 2, fatigue: 0, morale: 100 },
        { name: 'Sam', job: 'engineer', skill: 2, fatigue: 0, morale: 100 },
        { name: 'Jordan', job: 'researcher', skill: 1, fatigue: 0, morale: 100 }
    ];

    // Generate map from seed
    generateMap();

    // Initialize research
    initResearch();

    // Initialize trade
    gameState.tradeActive = false;
    updateTradeprices();

    return gameState;
}

// ============================================================================
// MAP GENERATION
// ============================================================================
const TERRAIN_TYPES = {
    'ash-flat': { symbol: '·', color: '#3a3a3a', buildable: true, buildableTypes: ['greenhouse', 'storehouse', 'barracks'] },
    'rock': { symbol: '◊', color: '#2a2a2a', buildable: true, buildableTypes: ['forge', 'watchtower'] },
    'water': { symbol: '~', color: '#1a3a4a', buildable: true, buildableTypes: ['condenser', 'dock'] },
    'vent': { symbol: '▲', color: '#4a1a1a', buildable: true, buildableTypes: ['geothermal', 'smelter'] },
    'ruins': { symbol: '§', color: '#2a2a1a', buildable: true, buildableTypes: ['scavenger'] }
};

function generateMap() {
    const map = [];
    for (let y = 0; y < 8; y++) {
        for (let x = 0; x < 8; x++) {
            const rand = gameState.rng();
            let terrain = 'ash-flat';
            if (rand < 0.15) terrain = 'rock';
            else if (rand < 0.25) terrain = 'water';
            else if (rand < 0.32) terrain = 'vent';
            else if (rand < 0.40) terrain = 'ruins';

            const key = `${x},${y}`;
            map.push({ x, y, terrain, key });
            gameState.buildings[key] = null;
        }
    }
    gameState.map = map;
}

function getTile(x, y) {
    return gameState.map.find(t => t.x === x && t.y === y);
}

function getTileAdjacencies(x, y) {
    const adj = [];
    for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
            if (dx === 0 && dy === 0) continue;
            const nx = x + dx, ny = y + dy;
            if (nx >= 0 && nx < 8 && ny >= 0 && ny < 8) {
                const t = getTile(nx, ny);
                if (t && gameState.buildings[t.key]) adj.push(gameState.buildings[t.key]);
            }
        }
    }
    return adj;
}

// ============================================================================
// BUILDINGS
// ============================================================================
const BUILDINGS = {
    greenhouse: {
        name: 'Greenhouse',
        terrain: ['ash-flat'],
        icon: '🌱',
        input: { water: 3 },
        output: { food: 5 },
        power: 0,
        jobs: { farmer: 1 },
        tooltipBonus: 'Needs water. Produces food.',
        adjacencyBonus: null
    },
    forge: {
        name: 'Forge',
        terrain: ['rock'],
        icon: '⚒',
        input: { metal: 2 },
        output: { metal: 3 },
        power: 2,
        jobs: { engineer: 1 },
        tooltipBonus: 'Needs power, ore. Smelt to metal.',
        adjacencyBonus: null
    },
    condenser: {
        name: 'Condenser',
        terrain: ['water'],
        icon: '💧',
        input: { power: 1 },
        output: { water: 4 },
        power: 0,
        jobs: null,
        tooltipBonus: 'Needs power. Pulls water. Bonus next to water.',
        adjacencyBonus: { type: 'water', bonus: 2 }
    },
    geothermal: {
        name: 'Geothermal',
        terrain: ['vent'],
        icon: '⚡',
        input: {},
        output: { power: 4 },
        power: 0,
        jobs: { engineer: 1 },
        tooltipBonus: 'Produces power from heat.',
        adjacencyBonus: null
    },
    storehouse: {
        name: 'Storehouse',
        terrain: ['ash-flat'],
        icon: '📦',
        input: {},
        output: {},
        power: 0,
        jobs: null,
        tooltipBonus: 'Storage. +50 cap all resources.',
        adjacencyBonus: null
    },
    barracks: {
        name: 'Barracks',
        terrain: ['ash-flat'],
        icon: '🛖',
        input: { food: 2 },
        output: {},
        power: 0,
        jobs: { soldier: 1 },
        tooltipBonus: 'Garrison. Morale, ashstorm defense.',
        adjacencyBonus: null
    },
    dock: {
        name: 'Dock',
        terrain: ['water'],
        icon: '⛴',
        input: {},
        output: {},
        power: 0,
        jobs: null,
        tooltipBonus: 'Trade node. Lower caravan prices.',
        adjacencyBonus: null
    },
    watchtower: {
        name: 'Watchtower',
        terrain: ['rock'],
        icon: '🔭',
        input: {},
        output: {},
        power: 1,
        jobs: { soldier: 1 },
        tooltipBonus: 'Ashstorm warning. Reduced damage.',
        adjacencyBonus: null
    },
    lab: {
        name: 'Lab',
        terrain: ['ash-flat', 'rock'],
        icon: '🔬',
        input: { parts: 1 },
        output: { scrip: 2 },
        power: 2,
        jobs: { researcher: 1 },
        tooltipBonus: 'Needs power, parts. Generates scrip.',
        adjacencyBonus: null
    },
    scavenger: {
        name: 'Scavenger',
        terrain: ['ruins'],
        icon: '🎯',
        input: {},
        output: { parts: 2, metal: 1 },
        power: 0,
        jobs: { scavenger: 1 },
        tooltipBonus: 'Salvage from ruins.',
        adjacencyBonus: null
    }
};

function buildBuilding(x, y, buildingType) {
    const tile = getTile(x, y);
    if (!tile) return false;

    const building = BUILDINGS[buildingType];
    if (!building || !building.terrain.includes(tile.terrain)) return false;

    const key = tile.key;
    if (gameState.buildings[key]) return false;

    gameState.buildings[key] = {
        type: buildingType,
        x, y,
        health: 100,
        damaged: false,
        workers: [],
        production: 0
    };
    return true;
}

// ============================================================================
// RESEARCH
// ============================================================================
const RESEARCH_TREE = [
    {
        id: 'mining',
        name: 'Mining',
        desc: 'Ore extraction from rock',
        cost: { scrip: 20, parts: 5 },
        prereq: null,
        unlock: { buildings: ['ore-mine'] }
    },
    {
        id: 'smelting-adv',
        name: 'Advanced Smelting',
        desc: 'Forge efficiency +30%',
        cost: { scrip: 30, parts: 8 },
        prereq: 'mining',
        unlock: null
    },
    {
        id: 'hydroponics',
        name: 'Hydroponics',
        desc: 'Greenhouse yield +40%',
        cost: { scrip: 25, parts: 6 },
        prereq: null,
        unlock: null
    },
    {
        id: 'power-storage',
        name: 'Power Storage',
        desc: 'Power capacity +100',
        cost: { scrip: 40, parts: 10 },
        prereq: null,
        unlock: null
    },
    {
        id: 'ashfilter',
        name: 'Ash Filter',
        desc: 'Ashstorm damage -50%',
        cost: { scrip: 50, parts: 15 },
        prereq: null,
        unlock: null
    },
    {
        id: 'morale-boost',
        name: 'Morale Programs',
        desc: 'Worker morale +20%',
        cost: { scrip: 20, parts: 5 },
        prereq: null,
        unlock: null
    },
    {
        id: 'trade-hub',
        name: 'Trade Hub',
        desc: 'Caravan prices -20%',
        cost: { scrip: 35, parts: 10 },
        prereq: null,
        unlock: null
    },
    {
        id: 'industry',
        name: 'Industrialization',
        desc: 'All production +15%',
        cost: { scrip: 60, parts: 20 },
        prereq: 'smelting-adv',
        unlock: null
    }
];

function initResearch() {
    gameState.research = {};
    RESEARCH_TREE.forEach(node => {
        gameState.research[node.id] = { ...node, available: node.prereq === null };
    });
}

function researchAvailable(id) {
    const node = gameState.research[id];
    if (!node || gameState.researchDone.has(id)) return false;
    if (node.prereq && !gameState.researchDone.has(node.prereq)) return false;
    return gameState.resources.scrip >= node.cost.scrip && gameState.resources.parts >= node.cost.parts;
}

function doResearch(id) {
    const node = gameState.research[id];
    if (!researchAvailable(id)) return false;

    gameState.resources.scrip -= node.cost.scrip;
    gameState.resources.parts -= node.cost.parts;
    gameState.researchDone.add(id);

    // Update available techs
    RESEARCH_TREE.forEach(r => {
        if (r.prereq === id) gameState.research[r.id].available = true;
    });

    // Update resource caps and bonuses
    if (id === 'power-storage') gameState.resourceCaps.power += 100;

    addLog(`Research complete: ${node.name}`);
    return true;
}

// ============================================================================
// PRODUCTION & CONSUMPTION
// ============================================================================
function updateStorageCaps() {
    gameState.resourceCaps.food = 500 + (gameState.map.filter(t => gameState.buildings[t.key]?.type === 'storehouse').length * 50);
    gameState.resourceCaps.water = gameState.resourceCaps.food;
    gameState.resourceCaps.metal = 200 + (gameState.map.filter(t => gameState.buildings[t.key]?.type === 'storehouse').length * 50);
}

function resolveProduction() {
    // Calculate production from all buildings
    const changes = { food: 0, water: 0, metal: 0, power: 0, parts: 0, scrip: 0 };

    gameState.map.forEach(tile => {
        const b = gameState.buildings[tile.key];
        if (!b) return;

        const building = BUILDINGS[b.type];
        if (!building) return;

        // Check if we have enough workers
        let workersAvailable = 0;
        if (building.jobs) {
            const jobTypes = Object.keys(building.jobs);
            jobTypes.forEach(jobType => {
                workersAvailable += b.workers.filter(w => gameState.colonists[w]?.job === jobType).length;
            });
        }

        if (workersAvailable === 0 && building.jobs) return;

        // Check inputs
        let canProduce = true;
        Object.keys(building.input).forEach(res => {
            if (gameState.resources[res] < building.input[res]) canProduce = false;
        });

        if (!canProduce) return;

        // Check power requirement
        if (building.power && gameState.resources.power < building.power) return;

        // Consume inputs
        Object.keys(building.input).forEach(res => {
            changes[res] -= building.input[res];
        });

        // Consume power
        if (building.power) changes.power -= building.power;

        // Apply skill bonus
        let skillBonus = 1;
        if (building.jobs && b.workers.length > 0) {
            const skillSum = b.workers.reduce((sum, w) => sum + (gameState.colonists[w]?.skill || 1), 0);
            skillBonus = 1 + (skillSum * 0.05);
        }

        // Apply adjacency bonus
        let adjacencyMult = 1;
        if (building.adjacencyBonus) {
            const adjacencies = getTileAdjacencies(tile.x, tile.y);
            const bonusCount = adjacencies.filter(adj => adj.type === building.adjacencyBonus.type).length;
            if (bonusCount > 0) {
                adjacencyMult = 1 + (bonusCount * 0.15);
            }
        }

        // Apply research bonuses
        let researchBonus = 1;
        if (gameState.researchDone.has('industry')) researchBonus *= 1.15;
        if (b.type === 'forge' && gameState.researchDone.has('smelting-adv')) researchBonus *= 1.3;
        if (b.type === 'greenhouse' && gameState.researchDone.has('hydroponics')) researchBonus *= 1.4;

        // Apply production
        Object.keys(building.output).forEach(res => {
            let output = building.output[res] * skillBonus * adjacencyMult * researchBonus;
            changes[res] += Math.floor(output);
        });
    });

    return changes;
}

function updateResources() {
    const changes = resolveProduction();

    // Update resources
    Object.keys(changes).forEach(res => {
        gameState.resources[res] += changes[res];

        // Enforce caps
        if (gameState.resources[res] > gameState.resourceCaps[res]) {
            const overflow = gameState.resources[res] - gameState.resourceCaps[res];
            gameState.resources[res] = gameState.resourceCaps[res];
            if (overflow > 0) addLog(`${res} overflow by ${overflow}`);
        }

        // Enforce floor
        if (gameState.resources[res] < 0) gameState.resources[res] = 0;
    });

    return changes;
}

// ============================================================================
// COLONIST MANAGEMENT
// ============================================================================
function updateColonists() {
    const colonistCount = gameState.colonists.length;

    // Consumption
    const foodNeed = colonistCount * 1;
    const waterNeed = colonistCount * 1;

    if (gameState.resources.food >= foodNeed) {
        gameState.resources.food -= foodNeed;
    } else {
        addLog(`Food shortage! Need ${foodNeed}, have ${gameState.resources.food}`);
        gameState.colonists.forEach(c => c.morale = Math.max(0, c.morale - 15));
        gameState.resources.food = 0;
    }

    if (gameState.resources.water >= waterNeed) {
        gameState.resources.water -= waterNeed;
    } else {
        addLog(`Water shortage! Need ${waterNeed}, have ${gameState.resources.water}`);
        gameState.colonists.forEach(c => c.morale = Math.max(0, c.morale - 15));
        gameState.resources.water = 0;
    }

    // Morale effects
    gameState.colonists.forEach((c, i) => {
        // Fatigue recovery
        if (c.fatigue > 0) {
            c.fatigue = Math.max(0, c.fatigue - 5);
            c.morale = Math.min(100, c.morale + 3);
        }

        // Morale drift
        if (c.morale < 50) c.morale = Math.max(0, c.morale - 2);
        if (c.morale >= 80) c.morale = Math.min(100, c.morale + 1);

        // At zero morale, colonist leaves
        if (c.morale <= 0) {
            addLog(`${c.name} abandoned the outpost`);
            gameState.colonists.splice(i, 1);
            gameState.population--;
        }
    });
}

function assignColonist(colonistIdx, buildingKey) {
    const building = gameState.buildings[buildingKey];
    if (!building) return false;

    const bType = BUILDINGS[building.type];
    if (!bType.jobs) return false;

    const colonist = gameState.colonists[colonistIdx];
    if (!colonist) return false;

    // Remove from previous assignment
    Object.values(gameState.buildings).forEach(b => {
        if (b) b.workers = b.workers.filter(w => w !== colonistIdx);
    });

    // Add to new assignment
    if (!building.workers.includes(colonistIdx)) {
        building.workers.push(colonistIdx);
        colonist.fatigue = Math.min(100, colonist.fatigue + 10);
    }

    return true;
}

function fireEvent() {
    if (gameState.rng() > 0.35) return; // 35% chance per turn

    let event = EVENTS[Math.floor(gameState.rng() * EVENTS.length)];

    // Avoid repeats recently
    let attempts = 0;
    while (gameState.recentEvents.has(event.id) && attempts < 3) {
        event = EVENTS[Math.floor(gameState.rng() * EVENTS.length)];
        attempts++;
    }

    gameState.recentEvents.add(event.id);
    if (gameState.recentEvents.size > 4) {
        const first = gameState.recentEvents.values().next().value;
        gameState.recentEvents.delete(first);
    }

    showEventModal(event);
    return event;
}

function resolveEvent(event, choiceIdx) {
    const choice = event.choices[choiceIdx];
    choice.effect(gameState);
    addLog(`Event: ${event.name} -> "${choice.text}"`);
}

function updateTradeprices() {
    gameState.tradePrices = {
        food: 2 + Math.floor(gameState.globalSupply.food / 200),
        water: 1 + Math.floor(gameState.globalSupply.water / 300),
        metal: 4 + Math.floor(gameState.globalSupply.metal / 100),
        parts: 8 + Math.floor(gameState.globalSupply.parts / 20)
    };

    // Add some randomness
    Object.keys(gameState.tradePrices).forEach(res => {
        const variance = Math.floor(gameState.rng() * 3) - 1;
        gameState.tradePrices[res] = Math.max(1, gameState.tradePrices[res] + variance);
    });
}

function startTrade() {
    gameState.tradeActive = true;
    updateTradeprices();
    gameState.tradeInventory = {
        food: 30 + Math.floor(gameState.rng() * 40),
        water: 20 + Math.floor(gameState.rng() * 30),
        metal: 15 + Math.floor(gameState.rng() * 25),
        parts: 5 + Math.floor(gameState.rng() * 10)
    };
    addLog('Caravan arrived!');
}

function endTrade() {
    gameState.tradeActive = false;
    addLog('Caravan departed');
}

function tradeResource(resource, buy, quantity) {
    if (!gameState.tradeActive) return false;
    if (!gameState.tradeInventory[resource] || gameState.tradeInventory[resource] < quantity) return false;

    const cost = gameState.tradePrices[resource] * quantity;

    if (buy) {
        if (gameState.resources.scrip < cost) return false;
        gameState.resources.scrip -= cost;
        gameState.resources[resource] = Math.min(gameState.resourceCaps[resource], gameState.resources[resource] + quantity);
        gameState.tradeInventory[resource] -= quantity;
        gameState.globalSupply[resource] -= quantity;
    } else {
        gameState.resources.scrip += cost;
        gameState.resources[resource] -= quantity;
        gameState.tradeInventory[resource] += quantity;
        gameState.globalSupply[resource] += quantity;
    }

    return true;
}

// ============================================================================
// ASHSTORM HAZARD
// ============================================================================
function checkAshstorm() {
    gameState.ashstormSchedule--;

    if (gameState.ashstormSchedule <= 0) {
        triggerAshstorm();
        gameState.ashstormSchedule = 5 + Math.floor(gameState.turn / 10);
        gameState.ashstormSeverity = 1 + Math.floor(gameState.turn / 20);
    }
}

function triggerAshstorm() {
    let severity = gameState.ashstormSeverity;

    // Reduce by research
    if (gameState.researchDone.has('ashfilter')) severity *= 0.5;

    // Reduce by watchtowers
    const watchtowers = gameState.map.filter(t => gameState.buildings[t.key]?.type === 'watchtower').length;
    severity *= (1 - watchtowers * 0.1);

    // Damage buildings
    gameState.map.forEach(tile => {
        const b = gameState.buildings[tile.key];
        if (b && gameState.rng() < 0.3) {
            b.health = Math.max(20, b.health - Math.floor(severity * 15));
            if (b.health < 100) b.damaged = true;
        }
    });

    // Spike water consumption
    gameState.resources.water = Math.max(0, gameState.resources.water - 20);

    // Morale hit
    gameState.colonists.forEach(c => c.morale = Math.max(0, c.morale - 10));

    addLog(`Ashstorm! Severity: ${severity.toFixed(1)}`);
}

function repairBuilding(key) {
    const b = gameState.buildings[key];
    if (!b || b.health >= 100) return false;

    const repairCost = Math.ceil((100 - b.health) / 10);
    if (gameState.resources.parts < repairCost) return false;

    gameState.resources.parts -= repairCost;
    b.health = 100;
    b.damaged = false;
    addLog(`Repaired ${BUILDINGS[b.type].name}`);
    return true;
}

// ============================================================================
// TURN RESOLUTION
// ============================================================================
function endTurn() {
    gameState.turn++;

    // 1. Production
    const changes = updateResources();

    // 2. Consumption & morale
    updateColonists();

    // 3. Check hazards
    checkAshstorm();

    // 4. Fire random event
    fireEvent();

    // 5. Trade
    if (gameState.turn > 0 && gameState.turn % 7 === 0) {
        if (!gameState.tradeActive) startTrade();
        else endTrade();
    }

    // Update UI
    render();
}

function addLog(msg) {
    gameState.eventLog.push({ turn: gameState.turn, msg });
    if (gameState.eventLog.length > 100) gameState.eventLog.shift();
}

// ============================================================================
function checkEndConditions() {
    if (gameState.population <= 0) return 'lose';
    if (gameState.turn >= 60 && gameState.population >= 12 && gameState.resources.food >= 30 && gameState.resources.water >= 30) return 'win';
    return null;
}

function calculateScore() {
    let score = gameState.turn * 10;
    score += gameState.population * 100;
    score += gameState.researchDone.size * 50;
    score += gameState.resources.scrip;
    return Math.floor(score);
}

// ============================================================================
// SERIALIZATION
// ============================================================================
function serializeGame() {
    const serialized = {
        seed: gameState.seed,
        turn: gameState.turn,
        population: gameState.population,
        colonists: gameState.colonists,
        resources: gameState.resources,
        resourceCaps: gameState.resourceCaps,
        buildings: gameState.buildings,
        researchDone: Array.from(gameState.researchDone),
        eventLog: gameState.eventLog,
        recentEvents: Array.from(gameState.recentEvents),
        tradeActive: gameState.tradeActive,
        tradeInventory: gameState.tradeInventory,
        tradePrices: gameState.tradePrices,
        globalSupply: gameState.globalSupply,
        ashstormSchedule: gameState.ashstormSchedule,
        ashstormSeverity: gameState.ashstormSeverity
    };
    return JSON.stringify(serialized);
}

function deserializeGame(jsonStr) {
    try {
        const data = JSON.parse(jsonStr);
        gameState = initGame(data.seed);
        gameState.turn = data.turn;
        gameState.population = data.population;
        gameState.colonists = data.colonists;
        gameState.resources = data.resources;
        gameState.resourceCaps = data.resourceCaps;
        gameState.buildings = data.buildings;
        gameState.researchDone = new Set(data.researchDone);
        gameState.eventLog = data.eventLog;
        gameState.recentEvents = new Set(data.recentEvents);
        gameState.tradeActive = data.tradeActive;
        gameState.tradeInventory = data.tradeInventory;
        gameState.tradePrices = data.tradePrices;
        gameState.globalSupply = data.globalSupply;
        gameState.ashstormSchedule = data.ashstormSchedule;
        gameState.ashstormSeverity = data.ashstormSeverity;
        return true;
    } catch (e) {
        alert(`Load failed: ${e.message}`);
        return false;
    }
}

function gameStateHash() {
    const str = serializeGame();
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
        const char = str.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
    }
    return hash.toString(16);
}

// ============================================================================
// VERIFICATION / TESTING
// ============================================================================
function runTests() {
    const results = [];
    let passed = 0, failed = 0;

    function assert(name, condition) {
        if (condition) {
            results.push(`✓ ${name}`);
            passed++;
        } else {
            results.push(`✗ ${name}`);
            failed++;
        }
    }

    // Save current state
    const savedState = serializeGame();

    // Test 1: Resources never negative
    assert('Resources non-negative',
        Object.values(gameState.resources).every(r => r >= 0));

    // Test 2: Resources respect caps
    assert('Resources respect caps',
        Object.keys(gameState.resources).every(r => gameState.resources[r] <= gameState.resourceCaps[r]));

    // Test 3: Population matches colonists
    assert('Population == colonist count',
        gameState.population === gameState.colonists.length);

    // Test 4: No colonists with invalid jobs
    const validJobs = ['farmer', 'engineer', 'researcher', 'soldier', 'scavenger'];
    assert('All colonists have valid jobs',
        gameState.colonists.every(c => validJobs.includes(c.job)));

    // Test 5: Colonist stats in range
    assert('Colonist stats in range',
        gameState.colonists.every(c => c.skill >= 1 && c.skill <= 5 && c.fatigue >= 0 && c.fatigue <= 100 && c.morale >= 0 && c.morale <= 100));

    // Test 6: Research prereqs respected
    assert('Research prereqs enforced',
        Array.from(gameState.researchDone).every(id => {
            const node = gameState.research[id];
            return !node.prereq || gameState.researchDone.has(node.prereq);
        }));

    // Test 7: Buildings on valid terrain
    assert('Buildings on valid terrain',
        gameState.map.every(tile => {
            const b = gameState.buildings[tile.key];
            if (!b) return true;
            const bType = BUILDINGS[b.type];
            return bType && bType.terrain.includes(tile.terrain);
        }));

    // Test 8: Map is 8x8
    assert('Map is 8x8', gameState.map.length === 64);

    // Test 9: All buildings exist only once per tile
    const buildingCount = gameState.map.filter(t => gameState.buildings[t.key] !== null).length;
    assert('One building per tile max', buildingCount <= 64);

    // Test 10: Worker assignments valid
    assert('Worker assignments valid',
        gameState.map.every(tile => {
            const b = gameState.buildings[tile.key];
            if (!b) return true;
            return b.workers.every(w => w >= 0 && w < gameState.colonists.length);
        }));

    // Test 11: Seed produces deterministic map
    const rng1 = mulberry32(1337);
    const rng2 = mulberry32(1337);
    const a = Array.from({length: 100}, () => rng1());
    const b = Array.from({length: 100}, () => rng2());
    assert('PRNG is deterministic', a.every((v, i) => v === b[i]));

    // Test 12: Save/Load round-trip
    const hash1 = gameStateHash();
    const serialized = serializeGame();
    const hash2Before = gameStateHash();
    deserializeGame(serialized);
    const hash2After = gameStateHash();
    assert('Save/Load preserves state', hash1 === hash2Before && hash2Before === hash2After);

    // Test 13: Turn advances properly
    const startTurn = gameState.turn;
    endTurn();
    assert('Turn increments', gameState.turn === startTurn + 1);

    // Test 14: Building construction
    const emptyTile = gameState.map.find(t => gameState.buildings[t.key] === null && t.terrain === 'ash-flat');
    if (emptyTile) {
        buildBuilding(emptyTile.x, emptyTile.y, 'greenhouse');
        assert('Building construction works', gameState.buildings[emptyTile.key] !== null);
    } else {
        assert('Building construction works', true);
    }

    // Test 15: Event log records events
    const logLength = gameState.eventLog.length;
    addLog('Test event');
    assert('Event log works', gameState.eventLog.length > logLength);

    // Restore state
    deserializeGame(savedState);

    return { passed, failed, results };
}

function runBenchmark() {
    const startSeed = gameState.seed;
    const savedState = serializeGame();

    // Reinit with seed
    initGame(startSeed);

    // Greedy policy: build randomly, assign workers, research when possible
    for (let turn = 0; turn < 200; turn++) {
        // Build something randomly
        const emptyTiles = gameState.map.filter(t => gameState.buildings[t.key] === null);
        if (emptyTiles.length > 0 && gameState.rng() < 0.3) {
            const tile = emptyTiles[Math.floor(gameState.rng() * emptyTiles.length)];
            const buildingTypes = Object.keys(BUILDINGS);
            const bType = buildingTypes[Math.floor(gameState.rng() * buildingTypes.length)];
            buildBuilding(tile.x, tile.y, bType);
        }

        // Assign colonists
        gameState.colonists.forEach((c, i) => {
            if (gameState.rng() < 0.5) {
                const buildings = gameState.map.filter(t => gameState.buildings[t.key] !== null);
                if (buildings.length > 0) {
                    const b = gameState.buildings[buildings[Math.floor(gameState.rng() * buildings.length)].key];
                    assignColonist(i, gameState.map.find(t => gameState.buildings[t.key] === b)?.key);
                }
            }
        });

        // Research
        const availableResearch = Object.keys(gameState.research).filter(id => researchAvailable(id));
        if (availableResearch.length > 0 && gameState.rng() < 0.4) {
            doResearch(availableResearch[0]);
        }

        // End turn
        endTurn();
    }

    const hash = gameStateHash();
    const stats = {
        finalTurn: gameState.turn,
        finalPopulation: gameState.population,
        finalResearchCount: gameState.researchDone.size,
        resourceSnapshot: { ...gameState.resources },
        hash: hash
    };

    // Restore
    deserializeGame(savedState);

    return stats;
}

            </div>
        </div>`;
        html += `<div class="colonist-bar">
            <div class="bar-item">
                <span>Morale</span>
                <div class="bar-fill" style="width: ${c.morale}%; background: #44ff44;"></div>
                <span>${c.morale}</span>
            </div>
        </div>`;

        // Building assignment
        html += `<select class="select" onchange="assignColonist(${i}, this.value); render();">
            <option value="">Unassigned</option>`;

        gameState.map.forEach(tile => {
            const b = gameState.buildings[tile.key];
            if (b) {
                const building = BUILDINGS[b.type];
                const isAssigned = b.workers.includes(i);
                html += `<option value="${tile.key}" ${isAssigned ? 'selected' : ''}>${building.name} (${tile.x},${tile.y})</option>`;
            }
        });

        html += `</select>`;
        html += `</div>`;
    });

    html += `</div>`;
    return html;
}

function renderResourcesPanel() {
    let html = `<div class="panel active">`;

    Object.keys(gameState.resources).forEach(res => {
        const val = gameState.resources[res];
        const cap = gameState.resourceCaps[res];
        const pct = Math.floor((val / cap) * 100);

        html += `<div class="resource-row">
            <div style="text-transform: uppercase; font-weight: bold;">${res}</div>
            <div class="resource-bar">
                <div class="resource-fill" style="width: ${pct}%"></div>
            </div>
            <div style="text-align: right;">${val}/${cap}</div>
        </div>`;
    });

    html += `</div>`;
    return html;
}

function renderResearchPanel() {
    let html = `<div class="panel active">`;

    Object.values(gameState.research).forEach(node => {
        const isDone = gameState.researchDone.has(node.id);
        const isAvailable = researchAvailable(node.id);

        let className = 'tech-node';
        if (isDone) className += ' tech-done';
        else if (isAvailable) className += ' tech-available';
        else className += ' tech-locked';

        html += `<div class="${className}">`;
        html += `<div style="font-weight: bold;">${node.name}</div>`;
        html += `<div style="font-size: 10px; margin-bottom: 6px;">${node.desc}</div>`;

        if (!isDone) {
            html += `<div style="font-size: 10px; margin-bottom: 6px;">Cost: ${node.cost.scrip} scrip, ${node.cost.parts} parts</div>`;
            if (node.prereq) {
                html += `<div style="font-size: 10px; margin-bottom: 6px;">Requires: ${gameState.research[node.prereq].name}</div>`;
            }

            if (isAvailable) {
                html += `<button class="button" onclick="doResearch('${node.id}'); render();">Research</button>`;
            }
        } else {
            html += `<div style="font-size: 10px; color: #44ff44;">✓ COMPLETE</div>`;
        }

        html += `</div>`;
    });

    html += `</div>`;
    return html;
}

function renderLogPanel() {
    let html = `<div class="panel active">`;

    // Trade panel
    if (gameState.tradeActive) {
        html += `<div style="background: #1a2a1a; border: 1px solid #33aa33; padding: 8px; margin-bottom: 8px;">`;
        html += `<div style="font-weight: bold; color: #44ff44; margin-bottom: 6px;">CARAVAN AT DOCK</div>`;

        Object.keys(gameState.tradeInventory).forEach(res => {
            const qty = gameState.tradeInventory[res];
            const price = gameState.tradePrices[res];
            html += `<div class="trade-item">
                <span>${res}</span>
                <span>${qty} @ ${price} scrip</span>
                <div class="trade-actions">
                    <button class="button" style="flex: 1; padding: 3px;" onclick="tradeResource('${res}', true, 1); render();">BUY</button>
                    <button class="button secondary" style="flex: 1; padding: 3px;" onclick="tradeResource('${res}', false, 1); render();">SELL</button>
                </div>
            </div>`;
        });

        html += `<button class="button secondary" onclick="endTrade(); render();" style="width: 100%;">End Trade</button>`;
        html += `</div>`;
    }

    // Event log
    html += `<div style="margin-bottom: 8px; font-size: 11px; font-weight: bold;">EVENT LOG</div>`;

    [...gameState.eventLog].reverse().forEach(entry => {
        html += `<div class="event-item">
            <div class="event-turn">Turn ${entry.turn}</div>
            <div>${entry.msg}</div>
        </div>`;
    });

    html += `</div>`;
    return html;
}

function renderDevPanel() {
    let html = `<div class="panel active">`;
    html += `<div style="margin-bottom: 12px;">
        <button class="button" onclick="runTestsUI();">Run Tests (15+)</button>
        <button class="button" onclick="runBenchmarkUI();">Run Benchmark</button>
    </div>`;

    html += `<div style="margin-bottom: 12px;">
        <label style="display: block; margin-bottom: 6px;">Seed:</label>
        <input type="number" id="seedInput" value="${gameState.seed}" style="padding: 4px; background: #111; border: 1px solid #333; color: #e0e0e0; width: 100%; font-family: monospace;">
        <button class="button" onclick="changeNewSeed();" style="margin-top: 4px;">New Game with Seed</button>
    </div>`;

    html += `<div style="margin-bottom: 12px;">
        <label style="display: block; margin-bottom: 6px;">Save Game:</label>
        <textarea id="saveData"></textarea>
        <button class="button" onclick="copySave();" style="margin-top: 4px;">Copy Save</button>
    </div>`;

    html += `<div style="margin-bottom: 12px;">
        <label style="display: block; margin-bottom: 6px;">Load Game:</label>
        <textarea id="loadData" placeholder="Paste save data here..."></textarea>
        <button class="button" onclick="loadSave();" style="margin-top: 4px;">Load</button>
    </div>`;

    html += `<div id="testResults"></div>`;
    html += `</div>`;
    return html;
}

function renderEventModal(event) {
    let html = `<div class="modal show">
        <div class="modal-content">
            <h2>${event.name}</h2>
            <div class="modal-text">${event.desc}</div>
            <div class="modal-choices">`;

    event.choices.forEach((choice, idx) => {
        html += `<button class="button" onclick="resolveEvent(${JSON.stringify(event).replace(/"/g, '&quot;')}, ${idx}); closeEventModal(); render();">${choice.text}</button>`;
    });

    html += `</div>
        </div>
    </div>`;
    return html;
}

function renderEndScreen(result) {
    let html = `<div class="container" style="text-align: center; padding-top: 40px;">
        <div style="font-size: 32px; color: ${result === 'win' ? '#44ff44' : '#ff4444'}; font-weight: bold; margin-bottom: 20px;">
            ${result === 'win' ? 'VICTORY' : 'DEFEAT'}
        </div>
        <div style="font-size: 14px; margin-bottom: 30px;">
            <div>Turn: ${gameState.turn}</div>
            <div>Population: ${gameState.population}</div>
            <div>Research Completed: ${gameState.researchDone.size}</div>
            <div style="margin-top: 10px;">Score: ${calculateScore()}</div>
        </div>
        <button class="button" onclick="location.reload();">Play Again</button>
    </div>`;
    return html;
}

// ============================================================================
// EVENT HANDLERS
// ============================================================================
function selectTile(x, y) {
    state.selectedTile = { x, y };
    render();
}

function runTestsUI() {
    const result = runTests();
    const resultsDiv = document.getElementById('testResults');
    if (resultsDiv) {
        let html = `<div class="test-results">`;
        html += `<div style="margin-bottom: 8px;"><span class="test-pass">PASSED: ${result.passed}</span> / <span class="test-fail">FAILED: ${result.failed}</span></div>`;
        html += result.results.map(r => `<div>${r}</div>`).join('');
        html += `</div>`;
        resultsDiv.innerHTML = html;
    }
    render();
}

function runBenchmarkUI() {
    const stats = runBenchmark();
    const resultsDiv = document.getElementById('testResults');
    if (resultsDiv) {
        let html = `<div class="test-results">`;
        html += `Benchmark Complete (200 turns)\n`;
        html += `Final Turn: ${stats.finalTurn}\n`;
        html += `Final Population: ${stats.finalPopulation}\n`;
        html += `Research Nodes Unlocked: ${stats.finalResearchCount}\n`;
        html += `State Hash: ${stats.hash}\n`;
        html += `Resources:\n`;
        Object.entries(stats.resourceSnapshot).forEach(([res, val]) => {
            html += `  ${res}: ${val}\n`;
        });
        html += `</div>`;
        resultsDiv.innerHTML = html;
    }
    render();
}

function changeNewSeed() {
    const seedInput = document.getElementById('seedInput');
    const seed = parseInt(seedInput.value) || 1337;
    initGame(seed);
    render();
}

function copySave() {
    const saveData = serializeGame();
    const textarea = document.getElementById('saveData');
    textarea.value = saveData;
    textarea.select();
    document.execCommand('copy');
    alert('Save copied to clipboard');
}

function loadSave() {
    const textarea = document.getElementById('loadData');
    if (deserializeGame(textarea.value)) {
        render();
    }
}

// ============================================================================
// INITIALIZATION & KEYBOARD
// ============================================================================
document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        e.preventDefault();
        endTurn();
        render();
    }
    if (e.key === '1') switchTab('map');
    if (e.key === '2') switchTab('people');
    if (e.key === '3') switchTab('resources');
    if (e.key === '4') switchTab('research');
    if (e.key === '5') switchTab('log');
});

window.addEventListener('load', () => {
    initGame(1337);
    render();
});
</script>
<div id="container"></div>
</body>
</html>
