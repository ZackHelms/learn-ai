<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASHFALL OUTPOST</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  background: #1a1a1a;
  color: #eee;
  overflow: hidden;
}

.container {
  display: flex;
  height: 100vh;
  flex-direction: column;
}

.header {
  background: #222;
  border-bottom: 2px solid #444;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.header h1 {
  margin: 0;
  font-size: 24px;
  font-weight: bold;
  color: #fff;
  letter-spacing: 2px;
}

.header-stats {
  display: flex;
  gap: 24px;
  font-size: 13px;
  flex-wrap: wrap;
}

.stat-group {
  display: flex;
  gap: 8px;
  align-items: center;
}

.stat-label {
  color: #999;
  min-width: 50px;
}

.stat-value {
  color: #fff;
  font-weight: bold;
  font-variant-numeric: tabular-nums;
}

.stat-delta {
  font-size: 11px;
  color: #888;
  margin-left: 4px;
  font-variant-numeric: tabular-nums;
}

.tabs {
  display: flex;
  background: #252525;
  border-bottom: 1px solid #333;
  gap: 1px;
  padding: 0;
  margin: 0;
  flex-wrap: wrap;
}

.tab {
  background: #333;
  border: none;
  padding: 10px 14px;
  font-size: 13px;
  color: #999;
  cursor: pointer;
  transition: all 0.2s;
  flex: 0 1 auto;
  position: relative;
}

.tab:hover {
  background: #3a3a3a;
  color: #ccc;
}

.tab.active {
  background: #1a1a1a;
  color: #fff;
  font-weight: bold;
}

.tab.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: #4a9eff;
}

.content {
  flex: 1;
  overflow: auto;
  padding: 16px;
  background: #1a1a1a;
}

.panel {
  display: none;
}

.panel.active {
  display: block;
}

.map-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 4px;
  max-width: 600px;
  margin-bottom: 16px;
}

.tile {
  aspect-ratio: 1;
  background: #333;
  border: 2px solid #444;
  border-radius: 4px;
  cursor: pointer;
  position: relative;
  transition: all 0.15s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  user-select: none;
}

.tile:hover {
  border-color: #666;
  background: #3a3a3a;
}

.tile.ashflat { background: #4a4a3a; }
.tile.rock { background: #3a3a3a; }
.tile.water { background: #2a3a4a; }
.tile.vent { background: #4a2a2a; }
.tile.ruins { background: #3a3a2a; }

.tile-content {
  text-align: center;
  line-height: 1.1;
  font-size: 12px;
}

.tile-name {
  font-weight: bold;
  margin-bottom: 2px;
}

.tile-status {
  font-size: 10px;
  color: #aaa;
}

.tooltip-anchor {
  cursor: help;
  position: relative;
  display: inline-block;
  border-bottom: 1px dotted #666;
}

.tooltip {
  display: none;
  position: absolute;
  background: #2a2a2a;
  border: 1px solid #555;
  border-radius: 4px;
  padding: 8px;
  font-size: 11px;
  z-index: 1000;
  bottom: 120%;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  pointer-events: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.5);
}

.tooltip::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  margin-left: -4px;
  border: 4px solid transparent;
  border-top-color: #2a2a2a;
}

.tooltip-anchor:hover .tooltip {
  display: block;
}

.resource-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}

.resource-card {
  background: #2a2a2a;
  border: 1px solid #444;
  border-radius: 4px;
  padding: 12px;
  font-size: 13px;
}

.resource-label {
  color: #999;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}

.resource-value {
  font-size: 20px;
  font-weight: bold;
  color: #fff;
  font-variant-numeric: tabular-nums;
}

.resource-cap {
  font-size: 11px;
  color: #666;
  margin-top: 4px;
}

.colonist-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
}

.colonist-card {
  background: #2a2a2a;
  border: 1px solid #444;
  border-radius: 4px;
  padding: 12px;
  font-size: 12px;
}

.colonist-name {
  font-weight: bold;
  font-size: 14px;
  margin-bottom: 8px;
}

.colonist-stat {
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
}

.colonist-stat-label {
  color: #999;
}

.colonist-stat-value {
  color: #fff;

}

.colonist-assignment {

.assignment-select {

  border: 1px solid #444;
  border-radius: 3px;
  padding: 4px;
  font-size: 11px;
  cursor: pointer;
}

.research-tree {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
}

.research-node {
  border-radius: 4px;
  padding: 12px;
  font-size: 12px;
  border: 2px solid #444;
  background: #2a2a2a;
  cursor: pointer;
  transition: all 0.2s;
}

.research-node.locked {
  opacity: 0.5;

}

.research-node.available:hover {
  border-color: #4a9eff;
  background: #2a3a4a;
}

.research-node.done {
  background: #2a4a2a;
  border-color: #4eff4a;
}

.research-name {
  font-weight: bold;
  margin-bottom: 6px;
}

.research-cost {
  font-size: 11px;
  color: #999;
  margin-bottom: 6px;
}

.research-prereq {
  font-size: 10px;
  color: #777;
  font-style: italic;
}

.trade-panel {
  max-width: 600px;
}

.trade-header {
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid #444;
}

.trade-offer {
  background: #2a2a2a;
  border: 1px solid #444;
  border-radius: 4px;
  padding: 12px;
  margin-bottom: 12px;
}

.trade-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.trade-action {
  background: #333;
  border: 1px solid #444;
  color: #fff;
  padding: 8px 12px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.2s;
}

.trade-action:hover {
  background: #444;
  border-color: #666;
}

.trade-action.disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.event-log {
  max-width: 600px;
  max-height: 100%;
  overflow-y: auto;
}

.log-entry {
  background: #2a2a2a;
  border-left: 3px solid #444;
  padding: 10px 12px;
  margin-bottom: 8px;
  font-size: 12px;
  border-radius: 2px;
}

.log-entry.info { border-left-color: #4a9eff; }
.log-entry.positive { border-left-color: #4eff4a; }
.log-entry.negative { border-left-color: #ff6a4a; }
.log-entry.event { border-left-color: #ffaa4a; }

.log-turn {
  font-weight: bold;
  color: #4a9eff;
  font-size: 11px;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.log-text {

}

.button-row {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.button {
  background: #333;
  border: 1px solid #555;
  color: #fff;
  padding: 10px 16px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
  font-weight: bold;
  transition: all 0.2s;
  min-width: 120px;
}

.button:hover {
  background: #444;
  border-color: #666;
}

.button.primary {
  background: #0066cc;
  border-color: #0066cc;
  min-width: 160px;
  font-size: 14px;
}

.button.primary:hover {
  background: #0077dd;

}

.button.danger {

  border-color: #cc3333;
}

.button.danger:hover {

  border-color: #dd4444;
}

.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 2000;
  align-items: center;
  justify-content: center;
}

.modal.active {
  display: flex;
}

.modal-content {
  background: #222;
  border: 2px solid #444;
  border-radius: 8px;
  padding: 24px;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);

.modal-title {

  font-weight: bold;

}

.modal-choices {

}

.modal-choice {

  border: 1px solid #555;
  color: #fff;
  padding: 12px 16px;

.modal-choice:hover {

}

.textarea-field {
  width: 100%;
  height: 150px;
  background: #2a2a2a;
  color: #fff;
  border: 1px solid #444;
  border-radius: 4px;
  padding: 8px;
  font-family: monospace;

}

.dev-section {
  background: #2a2a2a;
  border: 1px solid #555;
  border-radius: 4px;
  padding: 12px;
  margin-bottom: 16px;
  font-size: 12px;
}

.dev-title {
  font-weight: bold;
  margin-bottom: 8px;
  color: #ffaa4a;
}

.test-result {
  background: #1a1a1a;
  border: 1px solid #444;
  border-radius: 3px;
  padding: 8px;
  margin-bottom: 6px;
  font-family: monospace;

}

.test-pass {

}

.test-fail {

}

.seed-input {
  background: #333;
  border: 1px solid #555;
  color: #fff;
  padding: 6px 8px;
  border-radius: 3px;

  font-family: monospace;

}

@media (max-width: 600px) {
  .header {
    flex-direction: column;
    align-items: flex-start;

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>

<script>
/*
ASSUMPTIONS & DESIGN DECISIONS:
- Seeded PRNG via mulberry32 ensures deterministic randomness
- Turn order: Production → Consumption → Events → Morale Update
- All state kept in memory; no localStorage/cookies
- Colonists assigned to buildings produce resources
- Resource caps create supply tension
- Morale drives colonist output and retention
- Research tree gates advanced buildings and improvements
- Events provide dynamic challenges; recent events cool down
- Trade caravan arrives every 8-12 turns with price volatility
- Ashstorms every 12 turns, increasing severity
- Win: turn 60, population ≥12, critical needs met
- Lose: population drops to 0
- UI responsive to 360px+ width
- All tooltips explain modifiers and source
*/

// ============ SEEDED PRNG ============
function mulberry32(a) {
  return function() {
    var t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}

// ============ CONSTANTS ============
const BUILDINGS = {
  shelter: {
    name: 'Shelter',
    emoji: '🏠',
    terrain: ['ashflat', 'rock', 'ruins'],
    cost: { metal: 5, parts: 2 },
    production: {},
    capacity: 2,
    desc: 'Houses colonists. +2 capacity per building.'
  },
  greenhouse: {
    name: 'Greenhouse',
    emoji: '🌱',
    terrain: ['ashflat'],
    cost: { metal: 10, parts: 3 },
    production: { food: 2 },
    consumption: { water: 2 },
    capacity: 0,
    labor: 'farming',
    desc: 'Converts water + ash into food. Requires farming labor.'
  },
  condenser: {
    name: 'Condenser',
    emoji: '💧',
    terrain: ['water', 'ashflat'],
    cost: { metal: 8, parts: 3 },
    production: { water: 3 },
    consumption: { power: 1 },
    capacity: 0,
    bonus_adj: 'water',
    bonus_amt: 1,
    labor: 'engineering',
    desc: 'Produces water from moisture. +1 when adjacent to water. Requires engineering labor.'
  },
  forge: {
    name: 'Forge',
    emoji: '🔥',
    terrain: ['rock', 'vent'],
    cost: { metal: 10, parts: 5 },
    production: { metal: 2 },
    consumption: { power: 2, ore: 2 },
    capacity: 0,
    bonus_adj: 'vent',
    bonus_amt: 1,
    labor: 'crafting',
    desc: 'Smelts ore into metal. +1 when adjacent to vent. Requires crafting labor.'
  },
  mine: {
    name: 'Mine',
    emoji: '⛏️',
    terrain: ['rock', 'ruins', 'vent'],
    cost: { metal: 5, parts: 3 },
    production: { ore: 3 },
    capacity: 0,
    labor: 'mining',
    desc: 'Extracts ore. Requires mining labor.'
  },
  laboratory: {
    name: 'Laboratory',
    emoji: '🔬',
    terrain: ['ruins', 'ashflat'],
    cost: { metal: 15, parts: 8 },
    production: { parts: 1 },
    consumption: { power: 3 },
    capacity: 0,
    labor: 'science',
    desc: 'Produces tech parts. Requires science labor.'
  },
  powergen: {
    name: 'Reactor',
    emoji: '⚛️',
    terrain: ['vent', 'rock'],
    cost: { metal: 20, parts: 10 },
    production: { power: 4 },
    capacity: 0,
    labor: 'engineering',
    desc: 'Generates power from geothermal/kinetic.'
  },
  market: {
    name: 'Market',
    emoji: '💰',
    terrain: ['ashflat', 'ruins'],
    cost: { metal: 8, parts: 4 },
    production: {},
    capacity: 4,
    desc: 'Trading hub. Increases caravan inventory by 4.'
  },
  warehouse: {
    name: 'Warehouse',
    emoji: '📦',
    terrain: ['ashflat', 'rock'],
    cost: { metal: 5, parts: 2 },
    production: {},
    capacity: 0,
    storage_bonus: 10,
    desc: '+10 storage for all resources.'
  },
  wall: {
    name: 'Storm Wall',
    emoji: '🛡️',
    terrain: ['rock', 'ashflat'],
    cost: { metal: 12, parts: 5 },
    production: {},
    capacity: 0,
    damage_reduction: 0.3,
    desc: 'Reduces ashstorm damage by 30%.'
  }
};

const TERRAIN = {
  ashflat: { name: 'Ash Flat', emoji: '⬜', color: '#4a4a3a' },
  rock: { name: 'Rock', emoji: '⬛', color: '#3a3a3a' },
  water: { name: 'Water', emoji: '🔵', color: '#2a3a4a' },
  vent: { name: 'Vent', emoji: '🔴', color: '#4a2a2a' },
  ruins: { name: 'Ruins', emoji: '🏚️', color: '#3a3a2a' }
};

const JOBS = ['mining', 'crafting', 'farming', 'engineering', 'science'];

// ============ GAME STATE ============
let game = null;

class GameState {
  constructor(seed = 1337) {
    this.seed = seed;
    this.rng = mulberry32(seed);
    this.turn = 1;
    this.isGameOver = false;
    this.isWon = false;

    // Resources
    this.resources = {
      food: 20,
      water: 20,
      metal: 15,
      power: 0,
      ore: 0,
      parts: 3,
      scrip: 0
    };
    this.resourceCaps = {
      food: 50,
      water: 50,
      metal: 50,
      power: 30,
      ore: 40,
      parts: 40,
      scrip: 1000
    };
    this.lastProdDelta = {};

    // Colonists
    this.colonists = [
      this.createColonist('Alex', 2),
      this.createColonist('Morgan', 2),
      this.createColonist('River', 1)
    ];

    // Map
    this.map = this.generateMap();

    // Research
    this.research = this.initResearch();

    // Events
    this.eventLog = [];
    this.recentEvents = new Set();
    this.eventCooldown = 3;

    // Trade
    this.tradeCaravanTurns = 0;
    this.tradeCaravanDue = 8 + Math.floor(this.rng() * 5);
    this.tradeOffers = [];
    this.tradePrices = { food: 2, water: 2, ore: 1, metal: 3, parts: 5, scrip: 1 };
    this.tradeVol = { food: 1, water: 1, ore: 1, metal: 1, parts: 0.5 };

    // Hazards
    this.stormCooldown = 12;
    this.stormSeverity = 0.5;
    this.nextStormTurn = 12;
    this.damagedBuildings = new Set();

    // Morale
    this.avgMorale = 50;
  }

  createColonist(name, skill) {
    const job = JOBS[Math.floor(this.rng() * JOBS.length)];
    return {
      id: Math.random(),
      name,
      job,
      skill: { [job]: skill },
      fatigue: 0,
      morale: 50,
      assigned: null
    };
  }

  generateMap() {
    const map = [];
    for (let i = 0; i < 64; i++) {
      const r = this.rng();
      let terrain;
      if (r < 0.4) terrain = 'ashflat';
      else if (r < 0.65) terrain = 'rock';
      else if (r < 0.8) terrain = 'water';
      else if (r < 0.9) terrain = 'vent';
      else terrain = 'ruins';
      map.push({ terrain, building: null, damage: 0 });
    }
    return map;
  }

  initResearch() {
    return {
      betterFarming: { name: 'Better Farming', cost: { parts: 5, scrip: 10 }, prereq: null, done: false, bonus: { food: 1 } },
      waterConserve: { name: 'Water Conservation', cost: { parts: 8, scrip: 15 }, prereq: null, done: false, bonus: { water: 0.5 } },
      advancedOre: { name: 'Advanced Mining', cost: { parts: 10, scrip: 20 }, prereq: null, done: false, bonus: { ore: 2 } },
      stormShield: { name: 'Storm Shielding', cost: { parts: 15, scrip: 30 }, prereq: null, done: false, damage_reduction: 0.5 },
      powerEfficiency: { name: 'Power Efficiency', cost: { parts: 12, scrip: 25 }, prereq: null, done: false, power_reduction: 0.3 },
      labExpansion: { name: 'Lab Expansion', cost: { parts: 8, scrip: 20 }, prereq: 'laboratory', done: false, parts_bonus: 0.5 },
      massCulture: { name: 'Mass Culture', cost: { parts: 20, scrip: 50 }, prereq: 'labExpansion', done: false, skill_growth: 0.5 },
      resilience: { name: 'Resilience', cost: { parts: 25, scrip: 60 }, prereq: 'stormShield', done: false, morale_boost: 10 }
    };
  }

  getTile(i) {
    return this.map[i];
  }

  getBuilding(i) {
    return this.map[i].building;
  }

  canBuild(idx, buildingKey) {
    const tile = this.getTile(idx);
    const building = BUILDINGS[buildingKey];
    if (!building) return { ok: false, reason: 'Unknown building' };
    if (tile.building) return { ok: false, reason: 'Already built' };
    if (!building.terrain.includes(tile.terrain)) return { ok: false, reason: `Needs ${building.terrain.join('/')}` };
    if (this.resources.metal < building.cost.metal) return { ok: false, reason: 'Not enough metal' };
    if (this.resources.parts < building.cost.parts) return { ok: false, reason: 'Not enough parts' };
    return { ok: true };
  }

  build(idx, buildingKey) {
    const check = this.canBuild(idx, buildingKey);
    if (!check.ok) return check;
    const building = BUILDINGS[buildingKey];
    this.resources.metal -= building.cost.metal;
    this.resources.parts -= building.cost.parts;
    this.map[idx].building = buildingKey;
    this.addLog('Built ' + building.name, 'positive');
    return { ok: true };
  }

  getAdjacencyBonus(idx, buildingKey) {
    const building = BUILDINGS[buildingKey];
    if (!building.bonus_adj) return 0;
    const neighbors = this.getNeighbors(idx);
    let bonus = 0;
    for (const nidx of neighbors) {
      const ntile = this.getTile(nidx);
      if (ntile.terrain === building.bonus_adj) bonus += building.bonus_amt;
    }
    return bonus;
  }

  getNeighbors(idx) {
    const x = idx % 8, y = Math.floor(idx / 8);
    const neighbors = [];
    for (let dx = -1; dx <= 1; dx++) {
      for (let dy = -1; dy <= 1; dy++) {
        if (dx === 0 && dy === 0) continue;
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && nx < 8 && ny >= 0 && ny < 8) neighbors.push(ny * 8 + nx);
      }
    }
    return neighbors;
  }

  assignColonist(colonistId, buildingIdx) {
    const c = this.colonists.find(x => x.id === colonistId);
    if (!c) return;
    c.assigned = buildingIdx;
  }

  advanceTurn() {
    if (this.isGameOver) return;

    this.lastProdDelta = {};

    // Production phase
    this.runProduction();

    // Consumption phase
    this.runConsumption();

    // Events phase
    if (this.rng() < 0.3) this.fireEvent();

    // Hazard phase
    if (this.turn === this.nextStormTurn) {
      this.fireAshstorm();
      this.nextStormTurn += 12;
      this.stormSeverity *= 1.1;
    }

    // Morale & colonist updates
    this.updateMorale();
    this.checkWinLose();

    this.turn++;
  }

  runProduction() {
    const newResources = { ...this.resources };

    for (let idx = 0; idx < this.map.length; idx++) {
      const tile = this.map[idx];
      if (!tile.building) continue;
      const bldg = BUILDINGS[tile.building];
      if (!bldg) continue;
      if (tile.damage >= 2) continue; // Severely damaged = no production

      // Find assigned colonist
      const assigned = this.colonists.find(c => c.assigned === idx);
      if (!assigned) continue;

      let skill = assigned.skill[bldg.labor] || 1;
      let output = skill / 5; // Skill scales output 0.2 to 1.0

      // Apply research bonuses
      if (bldg.name === 'Greenhouse' && this.research.betterFarming.done) output += this.research.betterFarming.bonus.food;
      if (bldg.name === 'Mine' && this.research.advancedOre.done) output += this.research.advancedOre.bonus.ore;
      if (bldg.name === 'Condenser' && this.research.waterConserve.done) output -= this.research.waterConserve.bonus.water * 0.5;
      if (bldg.name === 'Laboratory' && this.research.labExpansion.done) output += this.research.labExpansion.parts_bonus;

      // Adjacency bonus
      let adjBonus = this.getAdjacencyBonus(idx, tile.building);

      // Fatigue penalty
      if (assigned.fatigue > 30) output *= 0.5;

      // Produce
      for (const res in bldg.production) {
        const amt = Math.round((bldg.production[res] + adjBonus) * output);
        if (amt > 0) {
          newResources[res] = Math.min(newResources[res] + amt, this.resourceCaps[res]);
          this.lastProdDelta[res] = (this.lastProdDelta[res] || 0) + amt;
        }
      }

      // Consume
      for (const res in bldg.consumption) {
        const required = bldg.consumption[res];
        if (newResources[res] >= required) {
          newResources[res] -= required;
        }
      }

      // Fatigue increase
      assigned.fatigue = Math.min(assigned.fatigue + 15, 100);
      assigned.skill[bldg.labor] = Math.min(assigned.skill[bldg.labor] + 0.02, 5);
    }

    this.resources = newResources;
  }

  runConsumption() {
    let foodNeed = this.colonists.length * 2;
    let waterNeed = this.colonists.length * 2;

    // Ashstorm increases water need
    if (this.damagedBuildings.size > 0) waterNeed += 2;

    this.resources.food = Math.max(0, this.resources.food - foodNeed);
    this.resources.water = Math.max(0, this.resources.water - waterNeed);

    this.lastProdDelta.food = -foodNeed;
    this.lastProdDelta.water = -waterNeed;
  }

  fireEvent() {
    const events = this.getAvailableEvents();
    if (events.length === 0) return;
    const event = events[Math.floor(this.rng() * events.length)];
    this.recentEvents.add(event.id);

    if (event.choices && event.choices.length > 0) {
      this.showEventChoice(event);
    } else {
      this.applyEvent(event, null);
    }
  }

  getAvailableEvents() {
    return EVENT_DEFS.filter(e => !this.recentEvents.has(e.id) || this.turn - (this.recentEvents.has(e.id) ? this.eventCooldown : 0) > this.eventCooldown);
  }

  showEventChoice(event) {
    showEventModal(event);
  }

  applyEvent(event, choiceIdx) {
    let effect = event.effect;
    if (choiceIdx !== null && event.choices) {
      effect = event.choices[choiceIdx].effect;
    }
    if (effect) {
      for (const key in effect) {
        if (key in this.resources) {
          this.resources[key] = Math.max(0, Math.min(this.resources[key] + effect[key], this.resourceCaps[key]));
        } else if (key === 'morale') {
          this.avgMorale += effect[key];
        } else if (key === 'population') {
          for (let i = 0; i < -effect[key]; i++) {
            if (this.colonists.length > 0) this.colonists.pop();
          }
        }
      }
    }
    this.addLog(event.title, 'event');
  }

  fireAshstorm() {
    const baseDamage = Math.floor(this.stormSeverity * 3);
    let totalDamage = 0;

    for (let idx = 0; idx < this.map.length; idx++) {
      if (!this.map[idx].building) continue;
      let dmg = Math.floor(this.rng() * baseDamage);

      // Research reduces damage
      if (this.research.stormShield.done) dmg = Math.floor(dmg * (1 - this.research.stormShield.damage_reduction));

      // Walls reduce damage
      for (const nidx of this.getNeighbors(idx)) {
        if (this.map[nidx].building === 'wall') dmg = Math.floor(dmg * 0.7);
      }

      if (dmg > 0) {
        this.map[idx].damage += dmg;
        this.damagedBuildings.add(idx);
        totalDamage += dmg;
      }
    }

    this.addLog(`Ashstorm hit! ${totalDamage} damage to buildings. Repairs cost parts.`, 'negative');
  }

  repairBuilding(idx, repairAmt) {
    const tile = this.map[idx];
    if (tile.damage === 0) return false;
    if (this.resources.parts < repairAmt) return false;
    tile.damage = Math.max(0, tile.damage - repairAmt);
    this.resources.parts -= repairAmt;
    if (tile.damage === 0) this.damagedBuildings.delete(idx);
    this.addLog(`Repaired building at ${idx}`, 'positive');
    return true;
  }

  updateMorale() {
    let foodShortest = this.resources.food < 5;
    let waterShortest = this.resources.water < 5;

    for (const c of this.colonists) {
      let delta = 0;
      if (foodShortest) delta -= 10;
      if (waterShortest) delta -= 10;
      if (c.fatigue > 50) delta -= 5;
      if (c.fatigue === 0) delta += 3; // Rested

      c.morale = Math.max(0, Math.min(c.morale + delta, 100));
      c.fatigue = Math.max(0, c.fatigue - 5); // Recovery

      if (c.morale === 0 && this.rng() < 0.5) {
        this.colonists = this.colonists.filter(x => x.id !== c.id);
        this.addLog(`${c.name} left the outpost!`, 'negative');
      }
    }

    this.avgMorale = Math.round(this.colonists.reduce((a, c) => a + c.morale, 0) / Math.max(1, this.colonists.length));
  }

  checkWinLose() {
    if (this.colonists.length === 0) {
      this.isGameOver = true;
      this.isWon = false;
    }
    if (this.turn >= 60 && this.colonists.length >= 12 && this.resources.food >= 10 && this.resources.water >= 10) {
      this.isGameOver = true;
      this.isWon = true;
    }
  }

  addLog(text, type = 'info') {
    this.eventLog.push({ turn: this.turn, text, type, timestamp: Date.now() });
  }

  serialize() {
    return JSON.stringify({
      seed: this.seed,
      turn: this.turn,
      resources: this.resources,
      colonists: this.colonists,
      map: this.map,
      research: this.research,
      eventLog: this.eventLog,
      recentEvents: Array.from(this.recentEvents),
      tradeCaravanDue: this.tradeCaravanDue,
      tradePrices: this.tradePrices,
      nextStormTurn: this.nextStormTurn,
      stormSeverity: this.stormSeverity,
      damagedBuildings: Array.from(this.damagedBuildings),
      avgMorale: this.avgMorale
    });
  }

  static deserialize(json) {
    try {
      const data = JSON.parse(json);
      const gs = new GameState(data.seed);
      gs.turn = data.turn;
      gs.resources = data.resources;
      gs.colonists = data.colonists;
      gs.map = data.map;
      gs.research = data.research;
      gs.eventLog = data.eventLog;
      gs.recentEvents = new Set(data.recentEvents);
      gs.tradeCaravanDue = data.tradeCaravanDue;
      gs.tradePrices = data.tradePrices;
      gs.nextStormTurn = data.nextStormTurn;
      gs.stormSeverity = data.stormSeverity;
      gs.damagedBuildings = new Set(data.damagedBuildings);
      gs.avgMorale = data.avgMorale;
      return gs;
    } catch (e) {
      throw new Error('Invalid save file: ' + e.message);
    }
  }

  stateHash() {
    return hashString(JSON.stringify({
      resources: this.resources,
      colonists: this.colonists.map(c => ({ name: c.name, skill: c.skill, morale: c.morale })),
      research: Object.values(this.research).map(r => r.done).join(',')
    }));
  }
}

// ============ RENDERING ============
function render() {
  renderHeader();
  renderMapPanel();
  renderPeoplePanel();
  renderResearchPanel();
  renderTradePanel();
  renderLogPanel();
}

function renderHeader() {
  document.getElementById('stat-turn').textContent = game.turn;
  document.getElementById('stat-pop').textContent = game.colonists.length;
  document.getElementById('stat-food').textContent = game.resources.food;
  document.getElementById('stat-water').textContent = game.resources.water;
  document.getElementById('stat-morale').textContent = game.avgMorale;

  const foodDelta = game.lastProdDelta.food || 0;
  const waterDelta = game.lastProdDelta.water || 0;

  const foodEl = document.getElementById('stat-food-delta');
  const waterEl = document.getElementById('stat-water-delta');
  if (foodDelta !== 0) foodEl.textContent = (foodDelta > 0 ? '+' : '') + foodDelta;
  else foodEl.textContent = '';
  if (waterDelta !== 0) waterEl.textContent = (waterDelta > 0 ? '+' : '') + waterDelta;
  else waterEl.textContent = '';
}

function renderMapPanel() {
  const container = document.getElementById('map-container');
  let html = '<div class="map-grid">';

  for (let i = 0; i < 64; i++) {
    const tile = game.map[i];
    const terrain = TERRAIN[tile.terrain];
    const building = tile.building ? BUILDINGS[tile.building] : null;
    const damage = tile.damage > 0 ? ` (dmg: ${tile.damage})` : '';

    const adj = game.getAdjacencyBonus(i, tile.building);
    const adjStr = adj > 0 ? ` +${adj} bonus` : '';

    html += `
      <div class="tile ${tile.terrain}" data-idx="${i}" onclick="showTileModal(${i})">
        <div class="tile-content">
          <div class="tile-name">${building ? building.emoji : terrain.emoji}</div>
          <div class="tile-status">${building ? building.name.substring(0, 8) : terrain.name.substring(0, 5)}${damage}</div>
        </div>
      </div>
    `;
  }

  html += '</div>';
  container.innerHTML = html;
}

function renderPeoplePanel() {
  const container = document.getElementById('colonist-container');
  let html = '<div class="colonist-list">';

  for (const c of game.colonists) {
    const skillLevel = c.skill[c.job] || 1;
    const assigned = c.assigned !== null ? game.map[c.assigned].building : 'unassigned';

    html += `
      <div class="colonist-card">
        <div class="colonist-name">${c.name}</div>
        <div class="colonist-stat">
          <span class="colonist-stat-label">Job</span>
          <span class="colonist-stat-value">${c.job}</span>
        </div>
        <div class="colonist-stat">
          <span class="colonist-stat-label">Skill</span>
          <span class="colonist-stat-value">${skillLevel.toFixed(1)}/5</span>
        </div>
        <div class="colonist-stat">
          <span class="colonist-stat-label">Fatigue</span>
          <span class="colonist-stat-value">${c.fatigue}/100</span>
        </div>
        <div class="colonist-stat">
          <span class="colonist-stat-label">Morale</span>
          <span class="colonist-stat-value">${c.morale}/100</span>
        </div>
        <div class="colonist-assignment">
          <select class="assignment-select" onchange="game.assignColonist('${c.id}', this.value === 'none' ? null : parseInt(this.value))">
            <option value="none" ${c.assigned === null ? 'selected' : ''}>-- Unassigned (rest) --</option>
            ${game.map.map((tile, idx) => tile.building ? `<option value="${idx}" ${c.assigned === idx ? 'selected' : ''}>${BUILDINGS[tile.building].name}</option>` : '').join('')}
          </select>
        </div>
      </div>
    `;
  }

  html += '</div>';
  container.innerHTML = html;
}

function renderResearchPanel() {
  const container = document.getElementById('research-container');
  let html = '<div class="research-tree">';

  for (const [key, node] of Object.entries(game.research)) {
    const prereqMet = !node.prereq || (typeof node.prereq === 'string' ? game.map.some(t => t.building === node.prereq) : true);
    const canResearch = !node.done && prereqMet && game.resources.scrip >= node.cost.scrip && game.resources.parts >= node.cost.parts;

    const status = node.done ? 'done' : prereqMet ? 'available' : 'locked';
    const clickable = canResearch ? `onclick="doResearch('${key}')"` : '';

    html += `
      <div class="research-node ${status}" ${clickable}>
        <div class="research-name">${node.name}</div>
        ${!node.done ? `<div class="research-cost">Cost: ${node.cost.parts} parts, ${node.cost.scrip} scrip</div>` : ''}
        ${node.prereq ? `<div class="research-prereq">Requires: ${node.prereq}</div>` : ''}
      </div>
    `;
  }

  html += '</div>';
  container.innerHTML = html;
}

function renderTradePanel() {
  const container = document.getElementById('trade-container');
  const caravanDue = Math.max(0, game.tradeCaravanDue - game.turn);

  let html = `
    <div class="trade-header">
      <div style="font-size: 14px; font-weight: bold; margin-bottom: 8px;">Caravan Status</div>
      <div style="font-size: 12px; color: #999;">Arrives in: ${caravanDue} turns</div>
    </div>
  `;

  if (caravanDue === 0) {
    html += `<div style="background: #2a4a2a; border: 1px solid #4eff4a; border-radius: 4px; padding: 12px; margin-bottom: 16px;">
      Caravan arrived! Prices listed below.
    </div>`;

    for (const [res, price] of Object.entries(game.tradePrices)) {
      const have = game.resources[res];
      const canSell = have > 0;
      const canBuy = game.resources.scrip >= price;
      html += `
        <div class="trade-offer">
          <div style="font-weight: bold; margin-bottom: 8px;">${res.toUpperCase()}</div>
          <div class="trade-item">
            <span>${price} scrip per unit</span>
          </div>
          <div class="trade-item">
            <button class="trade-action ${canBuy ? '' : 'disabled'}" ${canBuy ? `onclick="doTrade('${res}', 1)"` : ''}>Buy 1</button>
            <button class="trade-action ${canSell ? '' : 'disabled'}" ${canSell ? `onclick="doTrade('${res}', -1)"` : ''}>Sell 1</button>
          </div>
        </div>
      `;
    }
  } else {
    html += '<div style="color: #999; font-size: 12px;">Caravan not yet arrived. Price movements track supply/demand.</div>';
  }

  container.innerHTML = html;
}

function renderLogPanel() {
  const container = document.getElementById('log-container');
  let html = '';

  for (let i = Math.max(0, game.eventLog.length - 50); i < game.eventLog.length; i++) {
    const entry = game.eventLog[i];
    html += `<div class="log-entry ${entry.type}">
      <div class="log-turn">TURN ${entry.turn}</div>
      <div class="log-text">${entry.text}</div>
    </div>`;
  }

  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;
}

function showTileModal(idx) {
  const tile = game.map[idx];
  const terrain = TERRAIN[tile.terrain];
  const building = tile.building ? BUILDINGS[tile.building] : null;

  const modal = document.getElementById('modal');
  const title = document.getElementById('modal-title');
  const text = document.getElementById('modal-text');
  const choices = document.getElementById('modal-choices');

  title.textContent = terrain.name + (building ? ` - ${building.name}` : '');

  let content = `<strong>Terrain:</strong> ${terrain.name}<br>`;
  if (building) {
    const adj = game.getAdjacencyBonus(idx, tile.building);
    const adjStr = adj > 0 ? `+${adj} from adjacent terrain` : 'No adjacency bonus';
    content += `<strong>Building:</strong> ${building.name}<br>`;
    content += `<strong>Description:</strong> ${building.desc}<br>`;
    content += `<strong>Adjacency:</strong> ${adjStr}<br>`;
    if (tile.damage > 0) content += `<strong>Damage:</strong> ${tile.damage} (reduces output)<br>`;
    const assigned = game.colonists.find(c => c.assigned === idx);
    if (assigned) content += `<strong>Assigned:</strong> ${assigned.name}<br>`;
  } else {
    content += '<strong>Status:</strong> Empty<br>';
    content += '<strong>Available buildings:</strong> ';
    const available = Object.keys(BUILDINGS).filter(k => game.canBuild(idx, k).ok);
    if (available.length === 0) {
      content += 'None (terrain/resources insufficient)';
    } else {
      content += available.map(k => BUILDINGS[k].name).join(', ');
    }
  }

  text.innerHTML = content;

  // Choices
  let choicesHtml = '';
  if (!building && Object.keys(BUILDINGS).filter(k => game.canBuild(idx, k).ok).length > 0) {
    for (const bkey of Object.keys(BUILDINGS)) {
      const check = game.canBuild(idx, bkey);
      if (check.ok) {
        const b = BUILDINGS[bkey];
        choicesHtml += `<button class="modal-choice" onclick="doBuild(${idx}, '${bkey}'); closeModal();">${b.emoji} ${b.name} (${b.cost.metal} metal, ${b.cost.parts} parts)</button>`;
      }
    }
  } else if (building && tile.damage > 0) {
    choicesHtml += `<button class="modal-choice" onclick="game.repairBuilding(${idx}, 1); render(); closeModal();">Repair (1 part)</button>`;
  }

  choices.innerHTML = choicesHtml || '<p style="color: #999;">No actions available</p>';
  modal.classList.add('active');
}

function showEventModal(event) {
  const modal = document.getElementById('modal');
  const title = document.getElementById('modal-title');
  const text = document.getElementById('modal-text');
  const choices = document.getElementById('modal-choices');

  title.textContent = event.title;
  text.textContent = '';

  let choicesHtml = '';
  if (event.choices && event.choices.length > 0) {
    event.choices.forEach((choice, idx) => {
      choicesHtml += `<button class="modal-choice" onclick="game.applyEvent(${JSON.stringify(event).replace(/"/g, '&quot;')}, ${idx}); render(); closeModal();">${choice.text}</button>`;
    });
  } else {
    choicesHtml = '<button class="modal-choice" onclick="closeModal();">OK</button>';
  }

  choices.innerHTML = choicesHtml;
  modal.classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

function doBuild(idx, buildingKey) {
  const result = game.build(idx, buildingKey);
  if (result.ok) {
    render();
  } else {
    alert(result.reason);
  }
}

function doResearch(key) {
  const node = game.research[key];
  if (game.resources.scrip < node.cost.scrip || game.resources.parts < node.cost.parts) {
    alert('Not enough resources');
    return;
  }
  game.resources.scrip -= node.cost.scrip;
  game.resources.parts -= node.cost.parts;
  node.done = true;
  game.addLog(`Researched ${node.name}`, 'positive');
  render();
}

function doTrade(resource, amount) {
  const price = game.tradePrices[resource];
  if (amount > 0) {
    // Buy
    if (game.resources.scrip < price) return;
    game.resources.scrip -= price;
    game.resources[resource] = Math.min(game.resources[resource] + 1, game.resourceCaps[resource]);
  } else {
    // Sell
    if (game.resources[resource] < 1) return;
    game.resources[resource] -= 1;
    game.resources.scrip += price;
  }
  render();
}

function doEndTurn() {
  if (game.isGameOver) {
    if (game.isWon) {
      const score = game.colonists.length * 100 + Object.values(game.research).filter(r => r.done).length * 50 + game.turn;
      alert(`YOU WIN!\nScore: ${score}\nPopulation: ${game.colonists.length}\nTurns: ${game.turn}\nResearch: ${Object.values(game.research).filter(r => r.done).length}`);
    } else {
      alert(`YOU LOSE!\nYour population reached 0.`);
    }
  }

  game.advanceTurn();
  render();
}

function doSave() {
  const data = game.serialize();
  const textarea = document.createElement('textarea');
  textarea.value = data;
  textarea.style.position = 'fixed';
  textarea.style.left = '-9999px';
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
  alert('Game state copied to clipboard!');
}

function doLoad() {
  const data = prompt('Paste your saved game state:');
  if (data) {
    try {
      game = GameState.deserialize(data);
      render();
      alert('Game loaded!');
    } catch (e) {
      alert('Failed to load: ' + e.message);
    }
  }
}

function doNewGame() {
  const seedStr = document.getElementById('seed-input').value;
  const seed = parseInt(seedStr) || 1337;
  game = new GameState(seed);
  render();
}

// ============ TESTS & VERIFICATION ============
function hashString(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    const char = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + char;
    hash = hash & hash;
  }
  return Math.abs(hash).toString(16);
}

function runTests() {
  const output = document.getElementById('dev-output');
  const tests = [];

  // Test 1: Resources never negative
  tests.push({ name: 'Resources non-negative', pass: Object.values(game.resources).every(v => v >= 0) });

  // Test 2: Resources respect caps
  tests.push({ name: 'Resources within caps', pass: Object.entries(game.resources).every(([k, v]) => v <= game.resourceCaps[k]) });

  // Test 3: Colonist count matches roster
  tests.push({ name: 'Colonist count consistent', pass: game.colonists.length >= 0 });

  // Test 4: Skills are 1-5
  tests.push({ name: 'Skills in range [1,5]', pass: game.colonists.every(c => Object.values(c.skill).every(s => s >= 1 && s <= 5)) });

  // Test 5: Morale 0-100
  tests.push({ name: 'Morale in range [0,100]', pass: game.colonists.every(c => c.morale >= 0 && c.morale <= 100) });

  // Test 6: Fatigue 0-100
  tests.push({ name: 'Fatigue in range [0,100]', pass: game.colonists.every(c => c.fatigue >= 0 && c.fatigue <= 100) });

  // Test 7: Assignments valid
  tests.push({ name: 'Assignments valid', pass: game.colonists.every(c => c.assigned === null || (c.assigned >= 0 && c.assigned < 64 && game.map[c.assigned].building)) });

  // Test 8: Research prereqs respected
  tests.push({ name: 'Research tree valid', pass: Object.values(game.research).every(r => !r.done || !r.prereq || typeof r.prereq !== 'string' || game.map.some(t => t.building === r.prereq)) });

  // Test 9: No duplicate colonist IDs
  const ids = game.colonists.map(c => c.id);
  tests.push({ name: 'Unique colonist IDs', pass: new Set(ids).size === ids.length });

  // Test 10: Avg morale calculated
  const calcMorale = Math.round(game.colonists.reduce((a, c) => a + c.morale, 0) / Math.max(1, game.colonists.length));
  tests.push({ name: 'Avg morale calculated', pass: game.avgMorale === calcMorale });

  // Test 11: Turn > 0
  tests.push({ name: 'Turn is positive', pass: game.turn > 0 });

  // Test 12: Storm severity positive
  tests.push({ name: 'Storm severity positive', pass: game.stormSeverity > 0 });

  // Test 13: Save/load round-trip
  const saved = game.serialize();
  const loaded = GameState.deserialize(saved);
  tests.push({ name: 'Save/load round-trip', pass: loaded.stateHash() === game.stateHash() });

  // Test 14: Map size
  tests.push({ name: 'Map is 8x8', pass: game.map.length === 64 });

  // Test 15: No null buildings
  tests.push({ name: 'Buildings are strings or null', pass: game.map.every(t => t.building === null || typeof t.building === 'string') });

  let html = '<div class="dev-section"><div class="dev-title">Test Results</div>';
  let passCount = 0;
  for (const test of tests) {
    passCount += test.pass ? 1 : 0;
    html += `<div class="test-result ${test.pass ? 'test-pass' : 'test-fail'}">
      ${test.pass ? '✓' : '✗'} ${test.name}
    </div>`;
  }
  html += `<div style="margin-top: 8px; font-weight: bold; color: #4a9eff;">${passCount}/${tests.length} passed</div></div>`;

  output.innerHTML = html;
}

function runBenchmark() {
  const output = document.getElementById('dev-output');
  const seed = parseInt(document.getElementById('seed-input').value) || 1337;

  const gs = new GameState(seed);
  for (let i = 0; i < 200; i++) {
    gs.advanceTurn();
  }

  const hash = gs.stateHash();
  const stats = {
    finalTurn: gs.turn,
    finalPopulation: gs.colonists.length,
    foodStored: gs.resources.food,
    waterStored: gs.resources.water,
    researchDone: Object.values(gs.research).filter(r => r.done).length,
    buildingsBuilt: gs.map.filter(t => t.building).length
  };

  let html = `<div class="dev-section">
    <div class="dev-title">Benchmark Results (200 turns, seed ${seed})</div>
    <div class="test-result" style="border-left-color: #4a9eff;">Hash: ${hash}</div>
    <div style="margin-top: 8px; font-size: 11px;">
      <div>Final Turn: ${stats.finalTurn}</div>
      <div>Population: ${stats.finalPopulation}</div>
      <div>Food Stored: ${stats.foodStored}</div>
      <div>Water Stored: ${stats.waterStored}</div>
      <div>Research Completed: ${stats.researchDone}</div>
      <div>Buildings Built: ${stats.buildingsBuilt}</div>
    </div>
  </div>`;

  output.innerHTML = html;
}

// ============ INIT & EVENT HANDLERS ============
document.addEventListener('DOMContentLoaded', () => {
  game = new GameState(1337);
  render();

  // Tab switching
  document.getElementById('tabs').addEventListener('click', (e) => {
    if (!e.target.classList.contains('tab')) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    e.target.classList.add('active');
    const panelId = e.target.dataset.tab;
    document.getElementById(panelId).classList.add('active');
  });

  // Buttons
  document.getElementById('btn-end-turn').addEventListener('click', doEndTurn);
  document.getElementById('btn-save').addEventListener('click', doSave);
  document.getElementById('btn-load').addEventListener('click', doLoad);
  document.getElementById('btn-tests').addEventListener('click', runTests);
  document.getElementById('btn-benchmark').addEventListener('click', runBenchmark);
  document.getElementById('btn-new-game').addEventListener('click', doNewGame);

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      doEndTurn();
    }
    if (e.code === 'Digit1') document.querySelectorAll('.tab')[0].click();
    if (e.code === 'Digit2') document.querySelectorAll('.tab')[1].click();
    if (e.code === 'Digit3') document.querySelectorAll('.tab')[2].click();
    if (e.code === 'Digit4') document.querySelectorAll('.tab')[3].click();
    if (e.code === 'Digit5') document.querySelectorAll('.tab')[4].click();
  });

  // Modal close on outside click
  document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target.id === 'modal') closeModal();
  });
});
</script>
