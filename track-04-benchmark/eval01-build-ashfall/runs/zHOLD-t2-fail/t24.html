<!DOCTYPE html>
<!--
================================================================================
ASHFALL OUTPOST - single-file survival management game
================================================================================
ASSUMPTIONS MADE (no clarifying questions were asked):

1.  The six headline resources (food, water, metal, power, parts, scrip) are
    joined by three intermediate goods (ore, ash, soil) so that real production
    chains exist. They are shown in a secondary resource row.
2.  Power is a stored resource with a cap. Generators fill the pool, consumers
    draw from it. If the pool is short, consumers scale down proportionally
    (a "brownout"), which is logged.
3.  Turn resolution order is fixed and documented in-game (Dev panel + the
    End Turn tooltip): storm -> production stages -> overflow -> consumption ->
    morale -> skill -> attrition -> growth -> market/caravan -> flag decay ->
    event -> end-of-turn checks.
4.  Production stages run in this internal order so chains resolve in one turn:
    power, extract, water, refine, assemble, grow, service.
5.  "All critical needs met" for the win check means: population >= 12,
    non-zero food and water in store, no shortage during the final turn, and
    average morale >= 40.
6.  Losing is population 0. Reaching turn 60 without meeting the win bar is a
    survival (non-win) ending; both show the scored summary.
7.  Colonists at morale 0 refuse to work; two consecutive turns at 0 and they
    leave. Three consecutive turns of unmet food demand kills the lowest-morale
    colonist. Both are recoverable, not instant loss.
8.  Repairs cost parts plus one point of labour. Labour comes from resting
    (unassigned) colonists, one point each per turn, and costs them fatigue.
9.  Benchmark runs with end conditions suspended ("sandbox") so all 200 turns
    always execute and the hash is comparable.
10. The state hash is FNV-1a over a key-sorted canonical JSON of the whole
    state, including the log. Resource values are rounded to 2 decimals at the
    end of every turn so numbers stay stable and readable.
11. No browser storage of any kind is used. Save/load is copy/paste text only.
12. No non-deterministic randomness anywhere: a single serialisable mulberry32
    counter lives inside the state object. The Dev tests assert this by scanning
    the page source.
13. Emoji/box glyphs are used as compact labels, but every state that matters is
    also spelled out in text (e.g. "DMG 2", "LOCKED", "RESTING") so nothing is
    conveyed by colour or glyph alone.
================================================================================
-->

/* mulberry32, but the counter lives in the state object so save/load and the
   headless benchmark reproduce the exact same stream. No engine randomness. */
function rndFrom(o){
  var a = o.rng | 0;
  a = (a + 0x6D2B79F5) | 0;
  var t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  o.rng = a;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rnd(S){ return rndFrom(S); }
function rint(S,n){ return Math.floor(rnd(S)*n); }
function rrange(S,a,b){ return a + Math.floor(rnd(S)*(b-a+1)); }
function pick(S,arr){ return arr[rint(S,arr.length)]; }

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function r2(v){ return Math.round(v*100)/100; }
function fmt(v){ var n = Math.round(v*10)/10; return (Math.abs(n%1)<0.05? String(Math.round(n)) : n.toFixed(1)); }
function sgn(v){ return (v>=0?'+':'') + fmt(v); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function canon(o){
  if(o===null || typeof o!=='object') return JSON.stringify(o);
  if(Array.isArray(o)) return '['+o.map(canon).join(',')+']';
  var k = Object.keys(o).sort(), out = [];
  for(var i=0;i<k.length;i++) out.push(JSON.stringify(k[i])+':'+canon(o[k[i]]));
  return '{'+out.join(',')+'}';
}
function fnv(str){
  var h = 0x811c9dc5;
  for(var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h>>>0).toString(16).padStart(8,'0');
}
function stateHash(S){ return fnv(canon(S)); }
function xy(i){ return {x:i%MAPW, y:Math.floor(i/MAPW)}; }
function neighbors(i){
  var p = xy(i), out = [];
  if(p.x>0) out.push(i-1);
  if(p.x<MAPW-1) out.push(i+1);
  if(p.y>0) out.push(i-MAPW);
  if(p.y<MAPH-1) out.push(i+MAPW);
  return out;
}

function logg(S,msg,kind){
  S.log.push({t:S.turn, m:msg, k:kind||''});
  if(S.log.length>500) S.log.splice(0, S.log.length-500);
}

/* ---- world generation -------------------------------------------------- */
function genMap(seed){
  var g = {rng: seed|0};
  var t = new Array(MAPN);
  var i;
  var h = new Array(MAPN);
  for(i=0;i<MAPN;i++) h[i] = rndFrom(g);
  for(var pass=0;pass<2;pass++){
    var nh = h.slice();
    for(i=0;i<MAPN;i++){
      var ns = neighbors(i), s = h[i], c = 1;
      for(var j=0;j<ns.length;j++){ s += h[ns[j]]; c++; }
      nh[i] = s/c;
    }
    h = nh;
  }
  for(i=0;i<MAPN;i++) t[i] = h[i] > 0.52 ? 'rock' : 'ash';
  function count(k){ var c=0; for(var q=0;q<MAPN;q++) if(t[q]===k) c++; return c; }
  function scatter(kind, n, allow){
    var placed = 0, guard = 0;
    while(placed<n && guard<600){
      guard++;
      var k = rint(g, MAPN);
      if(allow.indexOf(t[k])<0) continue;
      t[k] = kind; placed++;
    }
  }
  scatter('water', rrange(g,4,6), ['ash','rock']);
  scatter('vent',  rrange(g,3,5), ['ash','rock']);
  scatter('ruins', rrange(g,6,9), ['ash','rock']);
  var fix = [['water',4],['vent',3],['ruins',5],['ash',12],['rock',6]];
  for(var f=0; f<fix.length; f++){
    var guard2 = 0;
    while(count(fix[f][0]) < fix[f][1] && guard2 < 400){
      guard2++;
      var k2 = rint(g, MAPN);
      if(t[k2]===fix[f][0]) continue;
      if(count(t[k2]) <= 4) continue;
      t[k2] = fix[f][0];
    }
  }
  var map = [];
  for(i=0;i<MAPN;i++) map.push({t:t[i], b:null, dmg:0, w:[]});
  return map;
}

function makeColonist(S, opts){
  opts = opts||{};
  return {
    id: S.nextId++,
    name: pick(S,FIRSTNAMES)+' '+pick(S,LASTNAMES),
    job: opts.job || pick(S,JOBKEYS),
    skill: clamp(opts.skill!=null ? opts.skill : rrange(S,1,3), 1, 5),
    xp: 0,
    fatigue: opts.fatigue!=null?opts.fatigue:rrange(S,0,12),
    morale: opts.morale!=null?opts.morale:rrange(S,58,72),
    at: null,
    zero: 0
  };
}
function addColonist(S, why, opts){
  var c = makeColonist(S, opts);
  S.pop.push(c);
  S.stats.joined++;
  logg(S, 'JOIN: '+c.name+' ('+JOBS[c.job].n+', skill '+c.skill+') joins the outpost - '+why+'.', 'good');
  return c;
}

function newGame(seed){
  seed = (seed|0) || 1337;
  var S = {
    v: VERSION,
    seed: seed,
    rng: (seed*7919 + 13) | 0,
    turn: 1,
    res: {food:70, water:70, metal:55, power:20, parts:25, scrip:70, ore:15, ash:25, soil:12},
    map: genMap(seed),
    pop: [],
    nextId: 1,
    research: {},
    cooldown: {},
    market: {},
    caravan: {active:false, leaves:0, inv:{}, budget:0, contract:0, next:3},
    log: [],
    ledger: {},
    overflow: {},
    flags: {dust:0, richSeam:0, machine:0, stormWater:0, brownout:0},
    stats: {joined:0, lost:0, storms:0, shortFood:0, shortWater:0, starve:0, built:0, overflowTotal:0, traded:0},
    lastNeeds: {food:0, water:0, foodShort:0, waterShort:0},
    laborUsed: 0,
    pending: null,
    over: null,
    sandbox: false
  };
  for(var i=0;i<TRADEABLE.length;i++) S.market[TRADEABLE[i]] = 1;

  var starters = [
    {job:'farmer',skill:2},{job:'farmer',skill:1},{job:'engineer',skill:2},
    {job:'engineer',skill:1},{job:'scav',skill:2},{job:'medic',skill:1}
  ];
  for(var s=0;s<starters.length;s++) S.pop.push(makeColonist(S, starters[s]));

  placeStart(S,'shelter'); placeStart(S,'shelter');
  placeStart(S,'geo'); placeStart(S,'condenser'); placeStart(S,'sifter');

  logg(S,'The ash stopped falling four days ago. Six of you are still breathing.','hdr');
  logg(S,'Outpost founded on seed '+seed+'. Build, assign, survive to turn '+WIN_TURN+'.','');
  return S;
}
function placeStart(S,key){
  var best = -1, bestScore = -1;
  for(var i=0;i<MAPN;i++){
    if(S.map[i].b) continue;
    if(!terrainOK(S,i,key)) continue;
    var sc = adjInfo(S,i,key).mult*100 - i*0.01;
    if(sc>bestScore){ bestScore = sc; best = i; }
  }
  if(best<0) return false;
  S.map[best].b = key;
  return true;
}

/* ===========================================================================
   SECTION 3 - QUERIES, LEDGER, MODIFIERS
   =========================================================================== */

function countB(S,key){ var c=0; for(var i=0;i<MAPN;i++) if(S.map[i].b===key) c++; return c; }
function capOf(S,k){
  if(k==='scrip') return RESMETA.scrip.cap;
  return RESMETA[k].cap + countB(S,'silo')*60;
}
function led(S,k,src,amt){
  if(!S.ledger[k]) S.ledger[k] = {};
  S.ledger[k][src] = r2((S.ledger[k][src]||0) + amt);
}
function add(S,k,v,src){
  if(!(v>0)) return 0;
  var cap = capOf(S,k), before = S.res[k], after = before + v, lost = 0;
  if(after > cap){ lost = after - cap; after = cap; }
  S.res[k] = after;
  led(S,k,src, after-before);
  if(lost > 0.005){
    led(S,k,'lost to overflow', -lost);
    S.overflow[k] = r2((S.overflow[k]||0) + lost);
    S.stats.overflowTotal = r2(S.stats.overflowTotal + lost);
  }
  return lost;
}
function take(S,k,v,src){
  if(!(v>0)) return 0;
  var got = Math.min(v, S.res[k]);
  S.res[k] = r2(S.res[k] - got);
  if(S.res[k] < 0) S.res[k] = 0;
  led(S,k,src,-got);
  return got;
}
function canPay(S,cost){
  for(var k in cost){ if(S.res[k] < cost[k] - 1e-9) return false; }
  return true;
}
function pay(S,cost,src){
  for(var k in cost) take(S,k,cost[k],src);
}
function costStr(cost){
  var out = [];
  for(var k in cost) out.push(fmt(cost[k])+' '+RESMETA[k].n.toLowerCase());
  return out.join(', ');
}

function terrainOK(S,i,key){
  var b = BLD[key];
  return b.terr.indexOf(S.map[i].t) >= 0;
}
function researchOK(S,key){
  var b = BLD[key];
  return !b.req || !!S.research[b.req];
}

/* Adjacency: returns the multiplier, the storm resistance, and the explanation
   pieces used verbatim by the tooltip so the player can see where it came from. */
function adjInfo(S,i,key){
  var b = BLD[key], mult = 1, storm = 0, parts = [];
  var ns = neighbors(i), r, j, c;
  var rules = b.adj || [];
  for(r=0;r<rules.length;r++){
    var rule = rules[r]; c = 0;
    for(j=0;j<ns.length;j++){
      if(rule.t && S.map[ns[j]].t === rule.t) c++;
      if(rule.b && S.map[ns[j]].b === rule.b) c++;
    }
    var label = rule.t ? TERR[rule.t].n : BLD[rule.b].n;
    parts.push({label:label, count:c, pct:rule.pct, val:c*rule.pct, kind:'out'});
    mult += c*rule.pct;
  }
  var srules = b.stormAdj || [];
  for(r=0;r<srules.length;r++){
    var sr = srules[r]; c = 0;
    for(j=0;j<ns.length;j++){
      if(sr.t && S.map[ns[j]].t === sr.t) c++;
      if(sr.b && S.map[ns[j]].b === sr.b) c++;
    }
    var slabel = sr.t ? TERR[sr.t].n : BLD[sr.b].n;
    parts.push({label:slabel, count:c, pct:sr.pct, val:c*sr.pct, kind:'storm'});
    storm += c*sr.pct;
  }
  /* every building gets local storm cover from neighbouring baffles */
  var bafs = 0;
  for(j=0;j<ns.length;j++) if(S.map[ns[j]].b === 'baffle') bafs++;
  if(bafs){ parts.push({label:'Storm Baffle', count:bafs, pct:0.15, val:bafs*0.15, kind:'storm'}); storm += bafs*0.15; }
  return {mult:mult, storm:storm, parts:parts};
}

/* Research / event multipliers per building, with sources for the tooltip. */
function prodMultInfo(S,key){
  var m = 1, src = [];
  var R = S.research;
  if(S.flags.machine>0){ m *= (1+S.flags.machine); src.push({l:'Restored machine', v:S.flags.machine}); }
  function add2(cond, label, pct){ if(cond){ m *= (1+pct); src.push({l:label, v:pct}); } }
  add2(key==='condenser'  && R.hydrology,  'Deep Hydrology',   0.30);
  add2(key==='composter'  && R.mycoculture,'Mycoculture',      0.40);
  add2(key==='greenhouse' && R.graftstock, 'Graftstock Seeds', 0.35);
  add2(key==='geo'        && R.thermal,    'Thermal Tapping',  0.40);
  add2(key==='forge'      && R.smelting,   'Flux Smelting',    0.40);
  add2(key==='workshop'   && R.precision,  'Precision Tooling',0.50);
  add2(key==='clinic'     && R.medicae,    'Field Medicae',    0.60);
  add2(key==='mine'       && S.flags.richSeam >= S.turn, 'Rich seam (temporary)', 0.50);
  if(key==='solar' && S.flags.dust>0){ m *= 0.55; src.push({l:'Panels dusted by storm', v:-0.45}); }
  return {mult:m, src:src};
}

var DMGMULT = [1, 0.65, 0.30, 0];
function dmgLabel(d){ return ['OK','DMG 1','DMG 2','WRECKED'][d]; }

function colonistById(S,id){
  for(var i=0;i<S.pop.length;i++) if(S.pop[i].id===id) return S.pop[i];
  return null;
}
function workerEffect(S,c,key){
  var b = BLD[key];
  var match = (b.job && c.job === b.job) ? 1 : 0.4;
  var skillF = 0.5 + 0.25*c.skill;
  var moraleF = 0.5 + 0.5*(c.morale/100);
  var fatF = 1 - c.fatigue/200;
  if(c.morale <= 0) return {we:0, match:match, skillF:skillF, moraleF:0, fatF:fatF, refuse:true};
  return {we: match*skillF*moraleF*fatF, match:match, skillF:skillF, moraleF:moraleF, fatF:fatF, refuse:false};
}
/* Total worker-equivalents at a tile, before adjacency/research/damage. */
function tileWE(S,i){
  var tile = S.map[i], sum = 0;
  for(var j=0;j<tile.w.length;j++){
    var c = colonistById(S, tile.w[j]);
    if(c) sum += workerEffect(S,c,tile.b).we;
  }
  return sum;
}
/* Everything the tile would produce/consume this turn, ignoring input scarcity. */
function tileRates(S,i){
  var tile = S.map[i];
  if(!tile.b) return null;
  var b = BLD[tile.b];
  var we = tileWE(S,i);
  var a = adjInfo(S,i,tile.b);
  var pm = prodMultInfo(S,tile.b);
  var dm = DMGMULT[tile.dmg];
  var eff = we * a.mult * pm.mult * dm;
  var out = {}, inp = {}, k;
  for(k in (b.out||{})) out[k] = r2(b.out[k]*eff);
  for(k in (b.inp||{})) inp[k] = r2(b.inp[k]*eff);
  return {we:we, adj:a, pm:pm, dm:dm, eff:eff, out:out, inp:inp};
}

function housing(S){ return countB(S,'shelter')*4; }
function housingFree(S){ return housing(S) - S.pop.length; }
function avgMorale(S){
  if(!S.pop.length) return 0;
  var s=0; for(var i=0;i<S.pop.length;i++) s += S.pop[i].morale;
  return s/S.pop.length;
}
function laborPool(S){
  var n=0;
  for(var i=0;i<S.pop.length;i++) if(S.pop[i].at===null && S.pop[i].morale>0) n++;
  return n;
}
function laborFree(S){ return laborPool(S) - S.laborUsed; }
function repairCost(S){ return S.research.recyc ? 2 : 3; }

/* ===========================================================================
   SECTION 4 - TURN RESOLUTION
   Fixed order, executed top to bottom, every turn:
     1 storm  2 production stages  3 overflow report  4 consumption
     5 morale 6 skill growth  7 attrition  8 population growth
     9 market drift + caravan  10 flag decay  11 event  12 end checks
   =========================================================================== */

var STAGES = ['power','extract','water','refine','assemble','grow','service'];
var STORM_EVERY = 6;

function nextStormTurn(S){
  var t = Math.ceil(S.turn/STORM_EVERY)*STORM_EVERY;
  if(t < S.turn) t += STORM_EVERY;
  return t < STORM_EVERY ? STORM_EVERY : t;
}
function stormSeverity(S,turn){ return 1 + Math.floor(turn/15); }
function globalStormMit(S){
  var m = 0, srcs = [];
  if(S.research.stormglass){ m += 0.35; srcs.push('Stormglass Panels -35%'); }
  var baf = Math.min(5, countB(S,'baffle'));
  if(baf){ m += baf*0.06; srcs.push(baf+' Storm Baffle'+(baf>1?'s':'')+' -'+(baf*6)+'%'); }
  return {m:m, srcs:srcs};
}

function stepStorm(S){
  S.flags.stormWater = 0;
  if(S.turn % STORM_EVERY !== 0) return;
  var sev = stormSeverity(S,S.turn) + (rnd(S) < 0.3 ? 1 : 0);
  S.stats.storms++;
  var gm = globalStormMit(S);
  logg(S,'ASHSTORM (severity '+sev+'). Mitigation: '+(gm.srcs.length?gm.srcs.join(', '):'none')+'.','bad');
  var hit = 0, i;
  for(i=0;i<MAPN;i++){
    var tile = S.map[i];
    if(!tile.b) continue;
    var local = adjInfo(S,i,tile.b).storm;
    var chance = clamp(0.18*sev*(1 - gm.m - local), 0.02, 0.85);
    if(rnd(S) < chance && tile.dmg < 3){
      tile.dmg = clamp(tile.dmg+1, 0, 3);
      hit++;
      logg(S,'  '+BLD[tile.b].n+' at '+coord(i)+' damaged ('+dmgLabel(tile.dmg)+').','bad');
    }
  }
  if(!hit) logg(S,'  Nothing broke. The baffles held.','good');
  var spike = S.pop.length * 0.9 * sev * (S.research.stormglass ? 0.7 : 1);
  S.flags.stormWater = r2(spike);
  S.flags.dust = 2;
  for(i=0;i<S.pop.length;i++){
    S.pop[i].fatigue = clamp(S.pop[i].fatigue + 6, 0, 100);
    S.pop[i].morale = clamp(S.pop[i].morale - 4, 0, 100);
  }
  logg(S,'  Grit in every seal: +'+fmt(spike)+' water demand, +6 fatigue, -4 morale outpost-wide.','warn');
}

function stepProduction(S){
  S.flags.brownout = 0;
  var starved = {};
  for(var s=0;s<STAGES.length;s++){
    var stage = STAGES[s];
    for(var i=0;i<MAPN;i++){
      var tile = S.map[i];
      if(!tile.b) continue;
      var b = BLD[tile.b];
      if(b.stage !== stage) continue;
      if(tile.dmg >= 3) continue;
      var rates = tileRates(S,i);
      if(rates.eff <= 0.0001) continue;

      /* Clinics are a service, not a producer. */
      if(tile.b === 'clinic'){ continue; }

      var ratio = 1, k;
      for(k in rates.inp){
        var need = rates.inp[k];
        if(need > 1e-9) ratio = Math.min(ratio, S.res[k] / need);
      }
      ratio = clamp(ratio, 0, 1);
      if(ratio < 0.999){
        for(k in rates.inp){
          if(rates.inp[k] > 1e-9 && S.res[k] < rates.inp[k]) starved[k] = true;
        }
        if(rates.inp.power) S.flags.brownout = 1;
      }
      for(k in rates.inp) take(S,k, rates.inp[k]*ratio, BLD[tile.b].n+' @'+coord(i));
      for(k in rates.out) add(S,k, rates.out[k]*ratio, BLD[tile.b].n+' @'+coord(i));
    }
  }
  var sk = Object.keys(starved);
  if(sk.length){
    var names = sk.map(function(k){ return RESMETA[k].n; }).join(', ');
    logg(S,'SHORTFALL: production throttled by missing '+names+'.', 'warn');
  }
  /* Clinic service pass: relief applied to everyone. */
  var clinicPower = 0;
  for(var q=0;q<MAPN;q++){
    if(S.map[q].b === 'clinic' && S.map[q].dmg < 3){
      var r = tileRates(S,q);
      clinicPower += r.eff;
    }
  }
  if(clinicPower > 0){
    var relief = Math.min(12, 3.5*clinicPower);
    var lift = Math.min(4, 1.1*clinicPower);
    for(var p=0;p<S.pop.length;p++){
      S.pop[p].fatigue = clamp(S.pop[p].fatigue - relief, 0, 100);
      S.pop[p].morale = clamp(S.pop[p].morale + lift, 0, 100);
    }
    logg(S,'Clinic care: -'+fmt(relief)+' fatigue, +'+fmt(lift)+' morale for everyone.','good');
  }
}

function stepOverflow(S){
  var keys = Object.keys(S.overflow);
  if(!keys.length) return;
  var bits = keys.map(function(k){ return fmt(S.overflow[k])+' '+RESMETA[k].n.toLowerCase(); });
  logg(S,'OVERFLOW: '+bits.join(', ')+' spilled past storage caps and was lost. Build Silos.','warn');
}

function stepConsume(S){
  var waterPer = 1.2 * (S.research.recyc ? 0.75 : 1);
  var foodNeed = r2(S.pop.length * 1.0);
  var waterNeed = r2(S.pop.length * waterPer + S.flags.stormWater);
  var foodGot = take(S,'food',foodNeed,'colonists eat');
  var waterGot = take(S,'water',waterNeed,'colonists drink');
  S.lastNeeds = {
    food: foodNeed, water: waterNeed,
    foodShort: r2(foodNeed - foodGot), waterShort: r2(waterNeed - waterGot)
  };
  if(S.lastNeeds.foodShort > 0.05){
    S.stats.shortFood++;
    S.stats.starve++;
    logg(S,'HUNGER: '+fmt(S.lastNeeds.foodShort)+' food short of demand ('+fmt(foodNeed)+').','bad');
  } else { S.stats.starve = 0; }
  if(S.lastNeeds.waterShort > 0.05){
    S.stats.shortWater++;
    logg(S,'THIRST: '+fmt(S.lastNeeds.waterShort)+' water short of demand ('+fmt(waterNeed)+').','bad');
  }
}

function stepMorale(S){
  var fs = S.lastNeeds.foodShort > 0.05, ws = S.lastNeeds.waterShort > 0.05;
  var unhoused = Math.max(0, S.pop.length - housing(S));
  for(var i=0;i<S.pop.length;i++){
    var c = S.pop[i], d = 0;
    d += (55 - c.morale) * 0.10;                    /* slow drift back to baseline */
    if(fs) d -= 12;
    if(ws) d -= 15;
    if(c.fatigue > 70) d -= 4;
    if(i >= housing(S)) d -= 6;                     /* the last N colonists are the unhoused ones */
    if(c.at !== null){
      var tile = S.map[c.at];
      if(tile && tile.dmg >= 3) d -= 3;             /* pointless work in a wrecked building */
      c.fatigue = clamp(c.fatigue + Math.max(3, 8 - c.skill), 0, 100);
    } else {
      c.fatigue = clamp(c.fatigue - 22, 0, 100);
      d += 2;
    }
    c.morale = clamp(Math.round((c.morale + d)*10)/10, 0, 100);
  }
  if(unhoused > 0) logg(S,'CRAMPED: '+unhoused+' colonist(s) have no bunk (-6 morale each). Build Shelters.','warn');
}

function stepSkill(S){
  for(var i=0;i<S.pop.length;i++){
    var c = S.pop[i];
    if(c.at === null) continue;
    var tile = S.map[c.at];
    if(!tile || !tile.b || tile.dmg >= 3) continue;
    if(BLD[tile.b].job !== c.job) continue;
    if(c.morale <= 0) continue;
    if(c.skill >= 5) continue;
    c.xp = r2(c.xp + 1 + c.morale/100);
    if(c.xp >= 8*c.skill){
      c.xp = 0; c.skill++;
      logg(S,'SKILL: '+c.name+' reaches '+JOBS[c.job].n+' skill '+c.skill+'.','good');
    }
  }
}

function stepAttrition(S){
  var i, c;
  for(i=S.pop.length-1;i>=0;i--){
    c = S.pop[i];
    if(c.morale <= 0){
      c.zero++;
      if(c.at !== null){
        unassign(S,c.id);
        logg(S,'REFUSAL: '+c.name+' will not work (morale 0). Rest them and fix supply.','bad');
      }
      if(c.zero >= 2){
        removeColonist(S,i,'walked out into the ash');
      }
    } else {
      c.zero = 0;
    }
  }
  if(S.stats.starve >= 3 && S.pop.length > 0){
    var worst = 0;
    for(i=1;i<S.pop.length;i++) if(S.pop[i].morale < S.pop[worst].morale) worst = i;
    removeColonist(S,worst,'starved after three turns without enough food');
    S.stats.starve = 1;
  }
}
function removeColonist(S,i,why){
  var c = S.pop[i];
  if(c.at !== null) unassign(S,c.id);
  S.pop.splice(i,1);
  S.stats.lost++;
  logg(S,'LOST: '+c.name+' - '+why+'.','bad');
}

function stepGrowth(S){
  if(S.pop.length === 0) return;
  if(housingFree(S) < 1) return;
  if(avgMorale(S) < 62) return;
  if(S.res.food < 60 || S.res.water < 60) return;
  if(rnd(S) < 0.22){
    addColonist(S,'drawn in by a warm, fed outpost');
  }
}

function stepMarket(S){
  for(var i=0;i<TRADEABLE.length;i++){
    var g = TRADEABLE[i];
    var v = S.market[g];
    v += (rnd(S)-0.5)*0.09;
    v += (1 - v)*0.02;
    S.market[g] = r2(clamp(v, 0.6, 1.6));
  }
  var C = S.caravan;
  if(C.active){
    C.leaves--;
    if(C.leaves <= 0){
      C.active = false; C.inv = {}; C.budget = 0; C.contract = 0;
      C.next = S.turn + (S.research.logistics ? 4 : 5);
      logg(S,'The caravan packs up and rolls east.','');
    }
  } else if(S.turn >= C.next){
    spawnCaravan(S);
  }
}

function stepDecay(S){
  if(S.flags.dust > 0) S.flags.dust--;
}

function finishTurn(S){
  for(var i=0;i<RES.length;i++) S.res[RES[i]] = r2(Math.max(0, S.res[RES[i]]));
  S.laborUsed = 0;
  S.turn++;
  checkEnd(S);
}

function checkEnd(S){
  if(S.over) return;
  if(S.pop.length === 0 && !S.sandbox){
    S.over = endSummary(S,false,'The last colonist is gone. Ashfall Outpost is a ruin like all the others.');
    return;
  }
  if(S.turn > WIN_TURN && !S.sandbox){
    var pop = S.pop.length;
    var needs = S.lastNeeds.foodShort <= 0.05 && S.lastNeeds.waterShort <= 0.05
                && S.res.food > 0 && S.res.water > 0;
    var mor = avgMorale(S) >= WIN_MORALE;
    var win = pop >= WIN_POP && needs && mor;
    var why = win
      ? 'Sixty turns. Twelve mouths fed, tanks wet, morale holding. The outpost is a town now.'
      : 'Sixty turns survived, but the outpost never became self-sustaining.'
        + (pop < WIN_POP ? ' Population '+pop+'/'+WIN_POP+'.' : '')
        + (!needs ? ' Critical needs unmet on the final turn.' : '')
        + (!mor ? ' Average morale '+fmt(avgMorale(S))+' (need '+WIN_MORALE+').' : '');
    S.over = endSummary(S,win,why);
  }
}
function endSummary(S,win,why){
  var researchDone = Object.keys(S.research).length;
  var stock = 0;
  for(var k in BASEPRICE) stock += S.res[k]*BASEPRICE[k];
  stock += S.res.scrip;
  var turns = Math.min(S.turn-1, WIN_TURN);
  var parts = [
    {l:'Population x40',        v: S.pop.length*40},
    {l:'Research nodes x70',    v: researchDone*70},
    {l:'Stockpile value / 6',   v: Math.floor(stock/6)},
    {l:'Turns survived x6',     v: turns*6},
    {l:'Storms weathered x12',  v: S.stats.storms*12},
    {l:'Colonists lost x-25',   v: S.stats.lost*-25},
    {l:win?'VICTORY BONUS':'No victory bonus', v: win?600:0}
  ];
  var total = 0;
  for(var i=0;i<parts.length;i++) total += parts[i].v;
  return {win:win, why:why, parts:parts, score:Math.max(0,Math.round(total)),
          pop:S.pop.length, research:researchDone, turns:turns};
}

function endTurn(S){
  if(S.over || S.pending) return false;
  S.ledger = {}; S.overflow = {};
  logg(S,'--- Turn '+S.turn+' ---','hdr');
  stepStorm(S);
  stepProduction(S);
  stepOverflow(S);
  stepConsume(S);
  stepMorale(S);
  stepSkill(S);
  stepAttrition(S);
  stepGrowth(S);
  stepMarket(S);
  stepDecay(S);
  stepEvent(S);
  if(!S.pending) finishTurn(S);
  return true;
}
function coord(i){ var p = xy(i); return String.fromCharCode(65+p.x)+(p.y+1); }

/* ===========================================================================
   SECTION 5 - PLAYER ACTIONS (all return {ok, msg})
   =========================================================================== */

function buildCheck(S,i,key){
  var b = BLD[key];
  if(!b) return {ok:false,msg:'Unknown building.'};
  if(S.over) return {ok:false,msg:'The run is over.'};
  if(S.map[i].b) return {ok:false,msg:'Tile already has a '+BLD[S.map[i].b].n+'.'};
  if(!terrainOK(S,i,key)) return {ok:false,msg:'Needs '+b.terr.map(function(t){return TERR[t].n;}).join(' / ')+'.'};
  if(!researchOK(S,key)) return {ok:false,msg:'Locked - research '+RESEARCH[b.req].n+'.'};
  if(!canPay(S,b.cost)) return {ok:false,msg:'Cannot afford '+costStr(b.cost)+'.'};
  return {ok:true,msg:'Build here.'};
}
function build(S,i,key){
  var chk = buildCheck(S,i,key);
  if(!chk.ok) return chk;
  pay(S,BLD[key].cost,'built '+BLD[key].n);
  S.map[i].b = key; S.map[i].dmg = 0; S.map[i].w = [];
  S.stats.built++;
  var a = adjInfo(S,i,key);
  logg(S,'BUILT: '+BLD[key].n+' at '+coord(i)+
      (a.mult!==1 ? ' (adjacency x'+a.mult.toFixed(2)+')' : '')+'.','good');
  return {ok:true,msg:'Built.'};
}
function demolish(S,i){
  var tile = S.map[i];
  if(!tile.b) return {ok:false,msg:'Nothing here.'};
  var key = tile.b;
  while(tile.w.length) unassign(S, tile.w[0]);
  var refund = Math.floor((BLD[key].cost.metal||0)*0.25);
  tile.b = null; tile.dmg = 0;
  if(refund>0) add(S,'metal',refund,'salvaged '+BLD[key].n);
  logg(S,'DEMOLISHED: '+BLD[key].n+' at '+coord(i)+'. Recovered '+refund+' metal.','');
  return {ok:true,msg:'Demolished.'};
}
function assign(S,cid,i){
  var c = colonistById(S,cid);
  if(!c) return {ok:false,msg:'No such colonist.'};
  if(c.morale <= 0) return {ok:false,msg:c.name+' refuses to work at morale 0.'};
  var tile = S.map[i];
  if(!tile || !tile.b) return {ok:false,msg:'No building there.'};
  var b = BLD[tile.b];
  if(b.slots <= 0) return {ok:false,msg:b.n+' needs no crew.'};
  if(tile.w.length >= b.slots) return {ok:false,msg:b.n+' is full ('+b.slots+' slots).'};
  if(c.at === i) return {ok:false,msg:'Already assigned there.'};
  if(c.at !== null) unassign(S,cid);
  tile.w.push(cid); c.at = i;
  return {ok:true,msg:c.name+' -> '+b.n+' @'+coord(i)};
}
function unassign(S,cid){
  var c = colonistById(S,cid);
  if(!c) return {ok:false,msg:'No such colonist.'};
  if(c.at === null) return {ok:false,msg:'Already resting.'};
  var tile = S.map[c.at];
  if(tile){
    var k = tile.w.indexOf(cid);
    if(k>=0) tile.w.splice(k,1);
  }
  c.at = null;
  return {ok:true,msg:c.name+' is resting.'};
}
function repair(S,i){
  var tile = S.map[i];
  if(!tile.b) return {ok:false,msg:'Nothing here.'};
  if(tile.dmg <= 0) return {ok:false,msg:'Undamaged.'};
  var cost = repairCost(S);
  if(S.res.parts < cost) return {ok:false,msg:'Needs '+cost+' parts.'};
  if(laborFree(S) < 1) return {ok:false,msg:'No spare labour. Un-assign someone to free a hand.'};
  take(S,'parts',cost,'repairs');
  S.laborUsed++;
  tile.dmg--;
  /* the freshest idle hand pays for it in fatigue */
  var best = -1;
  for(var p=0;p<S.pop.length;p++){
    if(S.pop[p].at !== null || S.pop[p].morale <= 0) continue;
    if(best < 0 || S.pop[p].fatigue < S.pop[best].fatigue) best = p;
  }
  if(best >= 0) S.pop[best].fatigue = clamp(S.pop[best].fatigue + 8, 0, 100);
  logg(S,'REPAIR: '+BLD[tile.b].n+' at '+coord(i)+' -> '+dmgLabel(tile.dmg)+' ('+cost+' parts, 1 labour).','good');
  return {ok:true,msg:'Repaired.'};
}
function researchAvailable(S,key){
  if(S.research[key]) return false;
  var pre = RESEARCH[key].pre;
  for(var i=0;i<pre.length;i++) if(!S.research[pre[i]]) return false;
  return true;
}
function doResearch(S,key){
  if(!RESEARCH[key]) return {ok:false,msg:'Unknown node.'};
  if(S.research[key]) return {ok:false,msg:'Already researched.'};
  if(!researchAvailable(S,key)){
    var miss = RESEARCH[key].pre.filter(function(p){ return !S.research[p]; })
                              .map(function(p){ return RESEARCH[p].n; });
    return {ok:false,msg:'Prerequisite missing: '+miss.join(', ')+'.'};
  }
  if(!canPay(S,RESEARCH[key].cost)) return {ok:false,msg:'Cannot afford '+costStr(RESEARCH[key].cost)+'.'};
  pay(S,RESEARCH[key].cost,'research: '+RESEARCH[key].n);
  S.research[key] = true;
  logg(S,'RESEARCH: '+RESEARCH[key].n+' complete. '+RESEARCH[key].d,'good');
  return {ok:true,msg:'Researched.'};
}

/* ---- trade ------------------------------------------------------------- */
function spawnCaravan(S){
  var C = S.caravan;
  var big = S.research.logistics ? 1.5 : 1;
  C.active = true;
  C.leaves = 2;
  C.inv = {
    food:  Math.round(rrange(S,18,38)*big),
    water: Math.round(rrange(S,18,38)*big),
    metal: Math.round(rrange(S,14,34)*big),
    parts: Math.round(rrange(S,6,18)*big),
    ore:   Math.round(rrange(S,0,20)*big),
    soil:  Math.round(rrange(S,0,16)*big),
    ash:   Math.round(rrange(S,0,24)*big)
  };
  C.budget = Math.round(rrange(S,80,170)*big);
  C.contract = (S.turn >= 8 && rnd(S) < 0.55) ? 1 : 0;
  logg(S,'CARAVAN: traders roll in with '+C.budget+' scrip to spend. They leave in 2 turns.','evt');
  if(C.contract) logg(S,'  They have a worker looking for a berth - buy the contract on the Trade tab.','evt');
}
function localFactor(S,g){
  var ratio = clamp(S.res[g]/capOf(S,g), 0, 1);
  return clamp(1.3 - 0.6*ratio, 0.7, 1.3);
}
function marketBonus(S){ return Math.min(3, countB(S,'market'))*0.05; }
function buyPrice(S,g){
  var p = BASEPRICE[g]*S.market[g]*localFactor(S,g)*1.30*(S.research.logistics?0.92:1);
  return Math.max(1, Math.round(p*10)/10);
}
function sellPrice(S,g){
  var p = BASEPRICE[g]*S.market[g]*localFactor(S,g)*0.72*(1 + marketBonus(S) + (S.research.logistics?0.08:0));
  return Math.max(0.5, Math.round(p*10)/10);
}
function contractPrice(S){ return Math.round(95*clamp(S.market.food,0.7,1.4)); }

function tradeBuy(S,g,qty){
  var C = S.caravan;
  if(!C.active) return {ok:false,msg:'No caravan here.'};
  qty = Math.min(qty, C.inv[g]||0);
  if(qty <= 0) return {ok:false,msg:'Caravan is out of '+RESMETA[g].n.toLowerCase()+'.'};
  var unit = buyPrice(S,g);
  var afford = Math.floor(S.res.scrip/unit);
  qty = Math.min(qty, afford);
  if(qty <= 0) return {ok:false,msg:'Not enough scrip ('+unit+' each).'};
  var room = capOf(S,g) - S.res[g];
  qty = Math.min(qty, Math.floor(room));
  if(qty <= 0) return {ok:false,msg:RESMETA[g].n+' storage is full.'};
  var total = Math.round(unit*qty*10)/10;
  take(S,'scrip',total,'bought '+g);
  add(S,g,qty,'caravan purchase');
  C.inv[g] -= qty; C.budget += total;
  S.stats.traded++;
  logg(S,'TRADE: bought '+qty+' '+RESMETA[g].n.toLowerCase()+' for '+fmt(total)+' scrip ('+unit+' each).','');
  return {ok:true,msg:'Bought '+qty+'.'};
}
function tradeSell(S,g,qty){
  var C = S.caravan;
  if(!C.active) return {ok:false,msg:'No caravan here.'};
  qty = Math.min(qty, Math.floor(S.res[g]));
  if(qty <= 0) return {ok:false,msg:'Nothing to sell.'};
  var unit = sellPrice(S,g);
  var canBuy = Math.floor(C.budget/unit);
  qty = Math.min(qty, canBuy);
  if(qty <= 0) return {ok:false,msg:'Caravan is out of scrip ('+fmt(C.budget)+' left).'};
  var total = Math.round(unit*qty*10)/10;
  take(S,g,qty,'sold to caravan');
  add(S,'scrip',total,'sold '+g);
  C.budget = r2(C.budget - total);
  C.inv[g] = (C.inv[g]||0) + qty;
  S.stats.traded++;
  logg(S,'TRADE: sold '+qty+' '+RESMETA[g].n.toLowerCase()+' for '+fmt(total)+' scrip ('+unit+' each).','');
  return {ok:true,msg:'Sold '+qty+'.'};
}
function tradeContract(S){
  var C = S.caravan;
  if(!C.active || !C.contract) return {ok:false,msg:'No contract on offer.'};
  var price = contractPrice(S);
  if(S.res.scrip < price) return {ok:false,msg:'Needs '+price+' scrip.'};
  if(housingFree(S) < 1) return {ok:false,msg:'No free bunk - build a Shelter first.'};
  take(S,'scrip',price,'worker contract');
  C.contract = 0;
  addColonist(S,'hired off a caravan contract for '+price+' scrip',{skill:rrange(S,2,4)});
  return {ok:true,msg:'Hired.'};
}

function moraleAll(S,d,why){
  for(var i=0;i<S.pop.length;i++) S.pop[i].morale = clamp(S.pop[i].morale + d, 0, 100);
  logg(S,'  Morale '+sgn(d)+' outpost-wide ('+why+').', d>=0?'good':'bad');
}
function fatigueAll(S,d,why){
  for(var i=0;i<S.pop.length;i++) S.pop[i].fatigue = clamp(S.pop[i].fatigue + d, 0, 100);
  logg(S,'  Fatigue '+sgn(d)+' outpost-wide ('+why+').', d>=0?'bad':'good');
}
function builtTiles(S,filter){
  var out = [];
  for(var i=0;i<MAPN;i++) if(S.map[i].b && (!filter || filter(S.map[i],i))) out.push(i);
  return out;
}
function damageTile(S,i,n){
  var t = S.map[i];
  if(!t.b) return;
  t.dmg = clamp(t.dmg + n, 0, 3);
  logg(S,'  '+BLD[t.b].n+' at '+coord(i)+' -> '+dmgLabel(t.dmg)+'.','bad');
}

var EVENTKEYS = Object.keys(EVENTS);

function stepEvent(S){
  var chance = S.turn > 10 ? 0.55 : 0.42;
  if(rnd(S) >= chance) return;
  var pool = [], total = 0, i;
  for(i=0;i<EVENTKEYS.length;i++){
    var k = EVENTKEYS[i], e = EVENTS[k];
    if(S.turn < e.min) continue;
    if((S.cooldown[k]||0) > S.turn) continue;
    pool.push(k); total += e.w;
  }
  if(!pool.length) return;
  var roll = rnd(S)*total, acc = 0, chosen = pool[pool.length-1];
  for(i=0;i<pool.length;i++){
    acc += EVENTS[pool[i]].w;
    if(roll < acc){ chosen = pool[i]; break; }
  }
  var ev = EVENTS[chosen];
  S.cooldown[chosen] = S.turn + ev.cd;
  logg(S,'EVENT: '+ev.n+' - '+ev.text,'evt');
  if(ev.choices){
    S.pending = {id:chosen};
  } else {
    ev.run(S);
  }
}
function resolveChoice(S, ci){
  if(!S.pending) return false;
  var ev = EVENTS[S.pending.id];
  var ch = ev.choices[ci];
  if(!ch) return false;
  logg(S,'  CHOSE: '+ch.l,'evt');
  ch.run(S);
  S.pending = null;
  finishTurn(S);
  return true;
}
function autoChoice(S){
  var ev = EVENTS[S.pending.id];
  var best = 0, bestV = -1;
  for(var i=0;i<ev.choices.length;i++){
    var a = ev.choices[i].auto;
    var v = typeof a === 'function' ? a(S) : a;
    if(v > bestV){ bestV = v; best = i; }
  }
  return best;
}

var tipEl;
function showTip(el, x, y){
  var html = el.getAttribute('data-tip');
  if(!html) return;
  tipEl.innerHTML = html;
  tipEl.hidden = false;
  var r = tipEl.getBoundingClientRect();
  var px = clamp(x + 14, 4, Math.max(4, window.innerWidth - r.width - 6));
  var py = y + 18 + r.height > window.innerHeight ? Math.max(4, y - r.height - 12) : y + 18;
  tipEl.style.left = px+'px';
  tipEl.style.top = py+'px';
}
function hideTip(){ tipEl.hidden = true; }
function wireTips(){
  document.addEventListener('mouseover', function(e){
    var el = e.target.closest ? e.target.closest('[data-tip]') : null;
    if(el && el.getAttribute('data-tip')) showTip(el, e.clientX, e.clientY); else hideTip();
  });
  document.addEventListener('mousemove', function(e){
    if(tipEl.hidden) return;
    var el = e.target.closest ? e.target.closest('[data-tip]') : null;
    if(!el) { hideTip(); return; }
    showTip(el, e.clientX, e.clientY);
  });
  document.addEventListener('mouseout', function(e){
    if(!e.relatedTarget) hideTip();
  });
  document.addEventListener('focusin', function(e){
    var el = e.target.closest ? e.target.closest('[data-tip]') : null;
    if(el){ var r = el.getBoundingClientRect(); showTip(el, r.left, r.bottom - 12); }
  });
  document.addEventListener('focusout', hideTip);
  document.addEventListener('touchstart', function(e){
    var el = e.target.closest ? e.target.closest('[data-tip]') : null;
    if(el && e.touches && e.touches[0]){
      showTip(el, e.touches[0].clientX, e.touches[0].clientY);
      setTimeout(hideTip, 3200);
    } else hideTip();
  }, {passive:true});
  window.addEventListener('scroll', hideTip, true);
}

  }

  if(t.t === 'water'){

/* ===========================================================================
   SECTION 13 - GREEDY POLICY (used by the headless benchmark)
   Entirely deterministic: no calls into the PRNG, no reads of wall time.
   =========================================================================== */

var BUILD_PLAN = [
  ['sifter',1],['condenser',2],['composter',1],['greenhouse',1],['shelter',3],
  ['salvage',1],['geo',2],['greenhouse',2],['condenser',3],['mine',1],['forge',1],
  ['workshop',1],['sifter',2],['composter',2],['shelter',4],['clinic',1],['market',1],
  ['baffle',2],['greenhouse',3],['silo',1],['shelter',5],['condenser',4],['baffle',4],
  ['salvage',2],['silo',2],['shelter',6],['market',2],['workshop',2],['mine',2],
  ['forge',2],['clinic',2],['shelter',7],['greenhouse',4],['silo',3]
];
var RESEARCH_PLAN = ['hydrology','mycoculture','ashcrete','graftstock','thermal','medicae',
                     'logistics','smelting','stormglass','precision','photocell','recyc'];
var ASSIGN_PRIORITY = ['geo','condenser','sifter','composter','greenhouse','salvage','mine',
                       'forge','workshop','solar','clinic','market'];

function bestTileFor(S,key){
  var best = -1, bestScore = -1;
  for(var i=0;i<MAPN;i++){
    if(!buildCheck(S,i,key).ok) continue;
    var sc = adjInfo(S,i,key).mult;
    if(sc > bestScore + 1e-9){ bestScore = sc; best = i; }
  }
  return best;
}
function policyTurn(S){
  var i, j;
  /* 1. repairs first - broken buildings are the biggest output hole */
  var guard = 0;
  while(guard++ < 10){
    var worst = -1;
    for(i=0;i<MAPN;i++) if(S.map[i].dmg > 0 && (worst<0 || S.map[i].dmg > S.map[worst].dmg)) worst = i;
    if(worst < 0) break;
    if(!repair(S,worst).ok) break;
  }
  /* 2. research whatever the plan allows */
  for(i=0;i<RESEARCH_PLAN.length;i++){
    var rk = RESEARCH_PLAN[i];
    if(S.research[rk] || !researchAvailable(S,rk)) continue;
    if(canPay(S,RESEARCH[rk].cost)){ doResearch(S,rk); }
    break;
  }
  /* 3. build up to two structures from the plan (every branch advances or exits) */
  var builds = 0, pi = 0;
  while(pi < BUILD_PLAN.length && builds < 2){
    var key = BUILD_PLAN[pi][0], target = BUILD_PLAN[pi][1];
    if(countB(S,key) >= target || !researchOK(S,key)){ pi++; continue; }
    if(!canPay(S,BLD[key].cost)) break;
    var t = bestTileFor(S,key);
    if(t < 0){ pi++; continue; }
    if(!build(S,t,key).ok){ pi++; continue; }
    builds++;
  }
  /* 4. rest the exhausted, then fill slots by priority */
  for(i=0;i<S.pop.length;i++){
    if(S.pop[i].at !== null && (S.pop[i].fatigue > 82 || S.pop[i].morale <= 0)) unassign(S,S.pop[i].id);
  }
  for(var p=0;p<ASSIGN_PRIORITY.length;p++){
    var bk = ASSIGN_PRIORITY[p];
    for(i=0;i<MAPN;i++){
      var tile = S.map[i];
      if(tile.b !== bk || tile.dmg >= 3) continue;
      var b = BLD[bk];
      while(tile.w.length < b.slots){
        var pickIdx = -1, pickScore = -1;
        for(j=0;j<S.pop.length;j++){
          var c = S.pop[j];
          if(c.at !== null || c.morale <= 0 || c.fatigue > 62) continue;
          var sc = (c.job === b.job ? 100 : 0) + c.skill*10 - c.fatigue*0.1;
          if(sc > pickScore){ pickScore = sc; pickIdx = j; }
        }
        if(pickIdx < 0) break;
        if(!assign(S, S.pop[pickIdx].id, i).ok) break;
      }
    }
  }
  /* 5. trade */
  if(S.caravan.active){
    var surplus = [['ash',0.6],['ore',0.6],['soil',0.6],['metal',0.85],['food',0.9],['water',0.9]];
    for(i=0;i<surplus.length;i++){
      var g = surplus[i][0], lim = surplus[i][1]*capOf(S,g);
      if(S.res[g] > lim) tradeSell(S,g, Math.floor(S.res[g]-lim));
    }
    if(S.res.food < 35 && S.res.scrip > 45) tradeBuy(S,'food', 25);
    if(S.res.water < 35 && S.res.scrip > 45) tradeBuy(S,'water', 25);
    if(S.res.parts < 12 && S.res.scrip > 70) tradeBuy(S,'parts', 10);
    if(S.res.scrip > 150 && housingFree(S) > 0) tradeContract(S);
  }
}
function simulate(seed, turns){
  var S = newGame(seed);
  S.sandbox = true;
  for(var t=0;t<turns;t++){
    policyTurn(S);
    endTurn(S);
    var guard = 0;
    while(S.pending && guard++ < 4) resolveChoice(S, autoChoice(S));
  }
  return S;
}

function runTests(){
  var out = [], pass = 0, fail = 0;
  function ok(name, cond, detail){
    if(cond){ pass++; out.push('PASS  '+name); }
    else { fail++; out.push('FAIL  '+name+(detail?'  <'+detail+'>':'')); }
  }

  /* 1 - PRNG determinism */
  var a = {rng:99}, b = {rng:99}, sa = [], sb = [];
  for(var i=0;i<40;i++){ sa.push(rndFrom(a)); sb.push(rndFrom(b)); }
  ok('01 PRNG is deterministic for a given counter', sa.join(',') === sb.join(','));

  /* 2 - terrain generation determinism */
  ok('02 Terrain generation is seed-deterministic',
     canon(genMap(4242)) === canon(genMap(4242)));
  ok('03 Different seeds give different maps',
     canon(genMap(1)) !== canon(genMap(2)));

  /* 4 - no engine randomness anywhere in the source */
  var src = Array.prototype.map.call(document.scripts, function(s){ return s.textContent; }).join('');
  var banned = 'Math' + '.' + 'random';
  ok('04 Source contains zero uses of engine randomness', src.indexOf(banned) === -1,
     'found at index '+src.indexOf(banned));

  /* 5..8 - simulated run invariants */
  var S = newGame(1337);
  S.sandbox = true;
  for(i=0;i<25;i++){ policyTurn(S); endTurn(S); var g=0; while(S.pending && g++<4) resolveChoice(S, autoChoice(S)); }
  var neg = RES.filter(function(k){ return S.res[k] < -1e-9; });
  ok('05 No resource goes negative over 25 simulated turns', neg.length === 0, neg.join(','));
  var over = RES.filter(function(k){ return S.res[k] > capOf(S,k) + 1e-6; });
  ok('06 Storage caps are never exceeded', over.length === 0, over.join(','));
  var badM = S.pop.filter(function(c){ return c.morale < 0 || c.morale > 100; });
  var badF = S.pop.filter(function(c){ return c.fatigue < 0 || c.fatigue > 100; });
  ok('07 Morale stays inside 0..100', badM.length === 0);
  ok('08 Fatigue stays inside 0..100', badF.length === 0);

  /* 9 - roster and tile worker lists agree in both directions */
  var mismatch = 0, ids = {};
  S.pop.forEach(function(c){ ids[c.id] = c; });
  S.pop.forEach(function(c){
    if(c.at !== null && S.map[c.at].w.indexOf(c.id) < 0) mismatch++;
  });
  var listed = 0;
  S.map.forEach(function(t, ti){
    listed += t.w.length;
    t.w.forEach(function(id){ if(!ids[id] || ids[id].at !== ti) mismatch++; });
  });
  ok('09 Colonist roster matches tile assignment lists', mismatch === 0, 'mismatches '+mismatch);
  ok('10 Assigned count never exceeds population', listed <= S.pop.length, listed+' > '+S.pop.length);

  /* 11 - slot limits */
  var overfull = S.map.filter(function(t){ return t.b && t.w.length > BLD[t.b].slots; });
  ok('11 No building holds more workers than it has slots', overfull.length === 0);

  /* 12 - damage clamped */
  var badDmg = S.map.filter(function(t){ return t.dmg < 0 || t.dmg > 3; });
  ok('12 Building damage stays inside 0..3', badDmg.length === 0);

  /* 13..15 - build rules */
  var T = newGame(1337);
  var waterTile = -1, ashTile = -1;
  for(i=0;i<MAPN;i++){
    if(waterTile<0 && T.map[i].t === 'water') waterTile = i;
    if(ashTile<0 && T.map[i].t === 'ash' && !T.map[i].b) ashTile = i;
  }
  ok('13 Build is rejected on illegal terrain', waterTile >= 0 && !build(T, waterTile, 'greenhouse').ok);
  var poor = newGame(1337); poor.res.metal = 0; poor.res.parts = 0;
  ok('14 Build is rejected when resources are short', !build(poor, ashTile, 'greenhouse').ok);
  var richB = newGame(1337); richB.res.metal = 500; richB.res.parts = 500;
  var beforeMetal = richB.res.metal;
  ok('15 A legal build succeeds and charges the exact metal cost',
     build(richB, ashTile, 'greenhouse').ok && Math.abs((beforeMetal - richB.res.metal) - BLD.greenhouse.cost.metal) < 1e-9);

  /* 16 - research prerequisites and cost */
  var R = newGame(1337); R.res.scrip = 999; R.res.parts = 999;
  ok('16 Research with an unmet prerequisite is refused', !doResearch(R,'graftstock').ok && !R.research.graftstock);
  var sBefore = R.res.scrip, pBefore = R.res.parts;
  var didMyco = doResearch(R,'mycoculture').ok;
  ok('17 Research with met prerequisites succeeds and charges scrip and parts',
     didMyco && Math.abs((sBefore - R.res.scrip) - RESEARCH.mycoculture.cost.scrip) < 1e-9
             && Math.abs((pBefore - R.res.parts) - RESEARCH.mycoculture.cost.parts) < 1e-9);
  ok('18 Unlocking the prerequisite makes the child node available', researchAvailable(R,'graftstock'));

  /* 19 - research measurably changes production */
  var P1 = newGame(1337), P2 = newGame(1337);
  var ci = -1;
  for(i=0;i<MAPN;i++) if(P1.map[i].b === 'condenser'){ ci = i; break; }
  if(ci >= 0){
    P1.map[ci].w = [P1.pop[2].id]; P1.pop[2].at = ci;
    P2.map[ci].w = [P2.pop[2].id]; P2.pop[2].at = ci;
    P2.research.hydrology = true;
    var o1 = tileRates(P1,ci).out.water, o2 = tileRates(P2,ci).out.water;
    ok('19 Deep Hydrology raises Condenser water output by 30%', Math.abs(o2/o1 - 1.30) < 0.02, o1+' -> '+o2);
  } else ok('19 Deep Hydrology raises Condenser water output by 30%', false, 'no starting condenser');

  /* 20 - storage overflow is capped and logged */
  var O = newGame(1337);
  O.res.food = capOf(O,'food') - 1;
  O.ledger = {}; O.overflow = {};
  var lost = add(O,'food',50,'test');
  ok('20 Overflow is clamped to the cap and recorded',
     Math.abs(O.res.food - capOf(O,'food')) < 1e-9 && lost > 48 && O.overflow.food > 48);

  /* 21 - trade moves scrip, goods and caravan stock together */
  var Tr = newGame(1337); Tr.res.scrip = 500;
  spawnCaravan(Tr);
  var invBefore = Tr.caravan.inv.food, scripBefore = Tr.res.scrip, foodBefore = Tr.res.food;
  var bought = tradeBuy(Tr,'food',5).ok;
  ok('21 Buying moves goods from the caravan and scrip from the player',
     bought && Tr.res.food > foodBefore && Tr.res.scrip < scripBefore && Tr.caravan.inv.food === invBefore - 5);
  var broke = newGame(1337); broke.res.scrip = 0; spawnCaravan(broke);
  ok('22 Buying with no scrip is refused', !tradeBuy(broke,'food',5).ok);
  var sellS = newGame(1337); spawnCaravan(sellS);
  var sScrip = sellS.res.scrip, sMetal = sellS.res.metal;
  ok('23 Selling adds scrip and removes the good',
     tradeSell(sellS,'metal',5).ok && sellS.res.scrip > sScrip && Math.abs(sellS.res.metal - (sMetal-5)) < 1e-9);
  ok('24 Sell price is always below buy price (no free arbitrage)',
     TRADEABLE.every(function(g){ return sellPrice(sellS,g) < buyPrice(sellS,g); }));

  /* 25 - assignment rules */
  var A = newGame(1337);
  var gi = -1;
  for(i=0;i<MAPN;i++) if(A.map[i].b === 'geo'){ gi = i; break; }
  var okAssign = assign(A, A.pop[0].id, gi).ok && assign(A, A.pop[1].id, gi).ok;
  ok('25 Assignment fills slots then refuses further workers',
     okAssign && !assign(A, A.pop[2].id, gi).ok && A.map[gi].w.length === BLD.geo.slots);
  ok('26 Re-assigning a colonist removes them from the old tile',
     (function(){
       var si = -1;
       for(var q=0;q<MAPN;q++) if(A.map[q].b === 'sifter'){ si = q; break; }
       if(si < 0) return false;
       var id = A.pop[0].id;
       assign(A, id, si);
       return A.map[gi].w.indexOf(id) < 0 && A.map[si].w.indexOf(id) >= 0 && colonistById(A,id).at === si;
     })());

  /* 27 - population never exceeds housing through natural growth */
  ok('27 Natural growth never overfills housing',
     (function(){
       var H = newGame(1337);
       H.res.food = 200; H.res.water = 200;
       H.pop.forEach(function(c){ c.morale = 90; });
       var before = H.pop.length, cap = housing(H);
       for(var q=0;q<40;q++) stepGrowth(H);
       return H.pop.length <= Math.max(before, cap);
     })());

  /* 28 - event cooldown is respected */
  ok('28 A fired event goes on cooldown', (function(){
       var E = newGame(1337);
       E.turn = 20; E.cooldown = {};
       var fired = null, tries = 0;
       while(!fired && tries++ < 400){ E.rng = (E.rng+1)|0; stepEvent(E);
         var keys = Object.keys(E.cooldown); if(keys.length){ fired = keys[0]; } E.pending = null; }
       return fired !== null && E.cooldown[fired] > E.turn;
     })());

  /* 29 - save / load round trip */
  var SS = newGame(2024); SS.sandbox = true;
  for(i=0;i<12;i++){ policyTurn(SS); endTurn(SS); var g2=0; while(SS.pending && g2++<4) resolveChoice(SS, autoChoice(SS)); }
  var text = JSON.stringify(SS);
  var loaded = loadState(text);
  ok('29 Save text loads without error', loaded.ok, loaded.msg);
  ok('30 Save/load round-trips to an identical state hash',
     loaded.ok && stateHash(loaded.state) === stateHash(SS),
     loaded.ok ? (stateHash(loaded.state)+' vs '+stateHash(SS)) : loaded.msg);
  ok('31 Corrupt save text is rejected with an error', !loadState('{"v":1,"turn":"nope"}').ok);
  ok('32 Non-JSON save text is rejected with an error', !loadState('not json at all').ok);

  /* 33 - benchmark reproducibility (short run, same machinery as the 200-turn one) */
  var h1 = stateHash(simulate(777, 30)), h2 = stateHash(simulate(777, 30));
  ok('33 A 30-turn headless run is reproducible', h1 === h2, h1+' vs '+h2);
  ok('34 A different seed produces a different outcome', stateHash(simulate(778,30)) !== h1);

  /* 35 - the game is losable */
  ok('35 Population 0 ends the run as a loss', (function(){
       var L = newGame(1337);
       L.pop = [];
       checkEnd(L);
       return !!L.over && L.over.win === false;
     })());

  var head = 'ASHFALL OUTPOST - invariant tests\n'+
             pass+' passed, '+fail+' failed, '+(pass+fail)+' assertions\n'+
             '------------------------------------------------------------\n';
  return head + out.join('\n');
}

/* ===========================================================================
   SECTION 15 - BENCHMARK
   =========================================================================== */

function runBenchmark(){
  var seed = G.S.seed;
  var S = simulate(seed, 200);
  var h = stateHash(S);
  var lines = [];
  lines.push('ASHFALL OUTPOST - headless benchmark');
  lines.push('seed '+seed+' | 200 turns | fixed greedy policy | end conditions suspended');
  lines.push('------------------------------------------------------------');
  lines.push('FINAL STATE HASH : '+h);
  lines.push('');
  lines.push('population       : '+S.pop.length+'  (housing '+housing(S)+')');
  lines.push('average morale   : '+fmt(avgMorale(S)));
  lines.push('research done    : '+Object.keys(S.research).length+' / '+RESKEYS.length);
  lines.push('buildings raised : '+S.stats.built+'  (standing '+builtTiles(S).length+')');
  lines.push('colonists joined : '+S.stats.joined+'   lost: '+S.stats.lost);
  lines.push('storms weathered : '+S.stats.storms);
  lines.push('food shortages   : '+S.stats.shortFood+' turns   water: '+S.stats.shortWater+' turns');
  lines.push('overflow wasted  : '+fmt(S.stats.overflowTotal));
  lines.push('trades made      : '+S.stats.traded);
  lines.push('');
  lines.push('stockpiles:');
  for(var i=0;i<RES.length;i++) lines.push('  '+(RESMETA[RES[i]].n+'        ').slice(0,9)+' '+fmt(S.res[RES[i]]));
  lines.push('');
  lines.push('score if scored  : '+endSummary(S, false, '').score);
  lines.push('');
  lines.push('Run this twice on the same seed: the hash above must be identical.');
  return lines.join('\n');
}

/* ===========================================================================
   SECTION 16 - SAVE / LOAD
   =========================================================================== */

function loadState(text){
  var o;
  try { o = JSON.parse(text); }
  catch(e){ return {ok:false, msg:'Not valid JSON: '+e.message}; }
  if(!o || typeof o !== 'object' || Array.isArray(o)) return {ok:false, msg:'Save must be a JSON object.'};
  if(o.v !== VERSION) return {ok:false, msg:'Wrong save version (found '+o.v+', expected '+VERSION+').'};
  if(typeof o.turn !== 'number' || !isFinite(o.turn) || o.turn < 1) return {ok:false, msg:'Field "turn" must be a number >= 1.'};
  if(typeof o.seed !== 'number' || typeof o.rng !== 'number') return {ok:false, msg:'Fields "seed" and "rng" must be numbers.'};
  if(!o.res || typeof o.res !== 'object') return {ok:false, msg:'Missing "res" block.'};
  for(var i=0;i<RES.length;i++){
    var k = RES[i];
    if(typeof o.res[k] !== 'number' || !isFinite(o.res[k]) || o.res[k] < 0)
      return {ok:false, msg:'Resource "'+k+'" must be a non-negative number.'};
  }
  if(!Array.isArray(o.map) || o.map.length !== MAPN) return {ok:false, msg:'Field "map" must be an array of '+MAPN+' tiles.'};
  for(i=0;i<MAPN;i++){
    var t = o.map[i];
    if(!t || !TERR[t.t]) return {ok:false, msg:'Tile '+i+' has unknown terrain.'};
    if(t.b !== null && !BLD[t.b]) return {ok:false, msg:'Tile '+i+' has unknown building "'+t.b+'".'};
    if(typeof t.dmg !== 'number' || t.dmg < 0 || t.dmg > 3) return {ok:false, msg:'Tile '+i+' has invalid damage.'};
    if(!Array.isArray(t.w)) return {ok:false, msg:'Tile '+i+' has an invalid worker list.'};
  }
  if(!Array.isArray(o.pop)) return {ok:false, msg:'Field "pop" must be an array.'};
  for(i=0;i<o.pop.length;i++){
    var c = o.pop[i];
    if(!c || typeof c.id !== 'number' || typeof c.name !== 'string' || !JOBS[c.job])
      return {ok:false, msg:'Colonist '+i+' is malformed.'};
    if(typeof c.skill !== 'number' || c.skill < 1 || c.skill > 5) return {ok:false, msg:'Colonist '+i+' has an invalid skill.'};
    if(typeof c.morale !== 'number' || typeof c.fatigue !== 'number') return {ok:false, msg:'Colonist '+i+' has invalid morale/fatigue.'};
    if(c.at !== null && (typeof c.at !== 'number' || c.at < 0 || c.at >= MAPN)) return {ok:false, msg:'Colonist '+i+' points at a bad tile.'};
  }
  if(!o.research || typeof o.research !== 'object') return {ok:false, msg:'Missing "research" block.'};
  for(var rk in o.research) if(!RESEARCH[rk]) return {ok:false, msg:'Unknown research node "'+rk+'".'};
  if(!o.caravan || typeof o.caravan !== 'object') return {ok:false, msg:'Missing "caravan" block.'};
  if(!Array.isArray(o.log)) return {ok:false, msg:'Missing "log" array.'};
  if(!o.stats || !o.flags || !o.market || !o.lastNeeds) return {ok:false, msg:'Missing one of stats/flags/market/lastNeeds.'};
  return {ok:true, state:o, msg:'Loaded turn '+o.turn+', '+o.pop.length+' colonists.'};
}

/* ===========================================================================
   SECTION 17 - DEV PANEL, MODAL, EVENT WIRING
   =========================================================================== */

function viewDev(S){
  var h = '<div class="card"><h2>Verification</h2>'+
    '<div class="row">'+
    '<button data-act="runtests" data-tip="Run 35 assertions over real invariants: resources, caps, roster integrity, research prerequisites, trade, events, and a save/load hash round-trip.">Run Tests</button>'+
    '<button data-act="runbench" data-tip="Simulate 200 turns headlessly from the current seed with a fixed greedy policy, then print a hash of the final state. Two runs on the same seed print the same hash.">Run Benchmark</button>'+
    '<button data-act="clearout" data-tip="Clear the output box below.">Clear Output</button>'+
    '</div>'+
    '<p class="tiny muted" style="margin:8px 0 6px">Current live state hash: <b class="mono">'+stateHash(S)+'</b></p>'+
    '<pre id="devout">'+esc(G.dev)+'</pre></div>';

  h += '<div class="card"><h2>Save / Load</h2>'+
    '<p class="tiny muted" style="margin:0 0 6px">No browser storage is used. Press Save, copy the text out, keep it anywhere you like. '+
    'Paste it back and press Load.</p>'+
    '<div class="row" style="margin-bottom:6px">'+
    '<button data-act="save" data-tip="Serialise the entire game state into the box below.">Save to box</button>'+
    '<button data-act="load" data-tip="Validate and load the text in the box. Bad input reports a specific error and changes nothing.">Load from box</button>'+
    '<button data-act="selectall" data-tip="Select the whole box so you can copy it.">Select all</button>'+
    '</div>'+
    '<textarea id="savebox" spellcheck="false" placeholder="Save text appears here. Paste a save in and press Load."></textarea>'+
    '<div class="tiny" id="savemsg" style="margin-top:5px">&nbsp;</div></div>';

  h += '<div class="card"><h2>Turn resolution order</h2><ol class="tiny" style="margin:0;padding-left:18px">'+
    '<li>Ashstorm (every '+STORM_EVERY+' turns) - damage, water spike, dust, fatigue</li>'+
    '<li>Production, stage by stage: power, extract, water, refine, assemble, grow, service</li>'+
    '<li>Overflow report (anything past a storage cap is already lost)</li>'+
    '<li>Food and water consumption, including the storm spike</li>'+
    '<li>Morale drift and fatigue change</li>'+
    '<li>Skill growth for matched, working, non-wrecked assignments</li>'+
    '<li>Attrition: refusals, walk-outs, starvation</li>'+
    '<li>Population growth check</li>'+
    '<li>Market index drift, caravan arrival and departure</li>'+
    '<li>Temporary flag decay (panel dust, rich seam)</li>'+
    '<li>Event roll from the weighted deck</li>'+
    '<li>Round resources, advance the turn, check end conditions</li>'+
    '</ol></div>';
  return h;
}

function renderModal(){
  var S = G.S, m = $('modal');
  if(S.pending){
    var ev = EVENTS[S.pending.id];
    var h = '<div class="dialog" role="dialog" aria-modal="true"><h2>'+esc(ev.n)+'</h2>'+
      '<p>'+esc(ev.text)+'</p><hr>';
    for(var i=0;i<ev.choices.length;i++){
      var c = ev.choices[i];
      h += '<button class="choicebtn" data-act="choice" data-i="'+i+'" data-tip="'+attr(esc(c.tip))+'">'+
           '<b>'+esc(c.l)+'</b><span class="tip">'+esc(c.tip)+'</span></button>';
    }
    h += '<div class="tiny muted">The turn finishes once you decide.</div></div>';
    m.innerHTML = h; m.hidden = false;
    return;
  }
  if(S.over){
    var o = S.over;
    var rows = o.parts.map(function(p){
      return '<tr><td>'+esc(p.l)+'</td><td class="num mono">'+(p.v>=0?'+':'')+p.v+'</td></tr>';
    }).join('');
    m.innerHTML = '<div class="dialog" role="dialog" aria-modal="true">'+
      '<h2>'+(o.win?'VICTORY - the outpost holds':'RUN OVER - no victory')+'</h2>'+
      '<p>'+esc(o.why)+'</p>'+
      '<table>'+rows+'<tr><th>FINAL SCORE</th><th class="num mono" style="font-size:15px;color:#f0a35e">'+o.score+'</th></tr></table>'+
      '<div class="tiny muted" style="margin:8px 0">Turns survived '+o.turns+' &middot; population '+o.pop+
      ' &middot; research '+o.research+'/'+RESKEYS.length+'</div>'+
      '<div class="row"><button data-act="newgame2" data-tip="Start again from the seed in the header.">New Game</button>'+
      '<button data-act="keepplaying" data-tip="Dismiss the summary and keep managing the outpost with end conditions suspended.">Keep Playing</button></div>'+
      '</div>';
    m.hidden = false;
    return;
  }
  m.hidden = true; m.innerHTML = '';
}

function doEndTurn(){
  var S = G.S;
  if(S.over || S.pending) return;
  G.toast = '';
  endTurn(S);
  render();
}

function act(el){
  var S = G.S, a = el.getAttribute('data-act'), r;
  if(a === 'tab'){ G.tab = el.getAttribute('data-k'); render(); return; }
  if(a === 'tile'){
    var i = +el.getAttribute('data-i');
    G.sel = (G.sel === i ? null : i);
    render(); return;
  }
  if(a === 'build'){ r = build(S, +el.getAttribute('data-i'), el.getAttribute('data-k')); toast(r.msg); render(); return; }
  if(a === 'demolish'){ r = demolish(S, +el.getAttribute('data-i')); toast(r.msg); render(); return; }
  if(a === 'repair'){ r = repair(S, +el.getAttribute('data-i')); toast(r.msg); render(); return; }
  if(a === 'unassign'){ r = unassign(S, +el.getAttribute('data-c')); toast(r.msg); render(); return; }
  if(a === 'research'){ r = doResearch(S, el.getAttribute('data-k')); toast(r.msg); render(); return; }
  if(a === 'qty'){ var q = el.getAttribute('data-q'); G.qty = (q === 'max' ? 'max' : +q); render(); return; }
  if(a === 'buy' || a === 'sell'){
    var g = el.getAttribute('data-g');
    var n = G.qty === 'max' ? 99999 : G.qty;
    r = (a === 'buy') ? tradeBuy(S,g,n) : tradeSell(S,g,n);
    toast(r.msg); render(); return;
  }
  if(a === 'contract'){ r = tradeContract(S); toast(r.msg); render(); return; }
  if(a === 'choice'){ resolveChoice(S, +el.getAttribute('data-i')); render(); return; }
  if(a === 'newgame' || a === 'newgame2'){
    var seed = parseInt($('seedin').value, 10);
    if(!isFinite(seed)) seed = 1337;
    G.S = newGame(seed); G.sel = null; G.toast = 'New outpost on seed '+seed+'.';
    render(); return;
  }
  if(a === 'keepplaying'){ S.over = null; S.sandbox = true;
    toast('End conditions suspended - the outpost continues.'); render(); return; }
  if(a === 'runtests'){ G.dev = 'Running...'; render(); G.dev = runTests(); render(); return; }
  if(a === 'runbench'){ G.dev = 'Simulating 200 turns...'; render(); G.dev = runBenchmark(); render(); return; }
  if(a === 'clearout'){ G.dev = ''; render(); return; }
  if(a === 'save'){
    var box = $('savebox');
    box.value = JSON.stringify(S);
    $('savemsg').innerHTML = '<span class="pass">Saved '+box.value.length+' characters. Select all and copy it out.</span>';
    return;
  }
  if(a === 'load'){
    var res = loadState($('savebox').value);
    if(!res.ok){ $('savemsg').innerHTML = '<span class="fail">LOAD FAILED: '+esc(res.msg)+'</span>'; return; }
    G.S = res.state; G.sel = null;
    $('seedin').value = G.S.seed;
    render();
    $('savemsg').innerHTML = '<span class="pass">'+esc(res.msg)+'</span>';
    return;
  }
  if(a === 'selectall'){ var b2 = $('savebox'); b2.focus(); b2.select(); return; }
}

function wire(){
  document.addEventListener('click', function(e){
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if(el && !el.disabled){ act(el); }
  });
  document.addEventListener('change', function(e){
    var el = e.target;
    if(!el.getAttribute) return;
    var a = el.getAttribute('data-act');
    var S = G.S, r;
    if(a === 'assignsel'){
      if(!el.value) return;
      r = assign(S, +el.value, +el.getAttribute('data-i'));
      toast(r.msg); render();
    } else if(a === 'assignsel2'){
      var cid = +el.getAttribute('data-c');
      if(el.value === 'rest'){ r = unassign(S, cid); }
      else { r = assign(S, cid, +el.value); }
      toast(r.msg); render();
    }
  });
  $('endturn').addEventListener('click', doEndTurn);
  document.addEventListener('keydown', function(e){
    var tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
    if(tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if(e.key === ' ' || e.code === 'Space'){
      e.preventDefault();
      if(G.S.pending || G.S.over) return;
      doEndTurn();
      return;
    }
    for(var i=0;i<TABS.length;i++){
      if(e.key === TABS[i].key){ G.tab = TABS[i].k; render(); return; }
    }
    if(e.key === 'Escape'){ hideTip(); }
  });
}

/* ===========================================================================
   SECTION 18 - BOOT
   =========================================================================== */
tipEl = $('tip');
wireTips();
wire();
G.S = newGame(1337);
