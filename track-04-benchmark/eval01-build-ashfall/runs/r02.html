<script>
/*
ASHFALL OUTPOST - Complete game implementation
Assumptions:
- 8x8 grid with 5 terrain types (ash, rock, water, vent, ruins)
- 6 resources: food, water, metal, power, parts, scrip
- 4 job types: farming, engineering, mining, research
- Win condition: turn 60, population >= 12, basic needs met
- Lose condition: population = 0
- Ashstorms every 15 turns, escalating severity
- 8 research nodes, 10+ events, production chains, colonist morale system
- All state in memory, seeded PRNG, save/load via JSON
*/

// Mulberry32 PRNG
class PRNG {
    constructor(seed) {
        this.seed = seed >>> 0;
    }

    next() {
        let t = this.seed;
        t |= 0;
        t = t + 0x6d2b79f5 | 0;
        let x = Math.imul(t ^ (t >>> 15), 1 | t);
        x = x + Math.imul(x ^ (x >>> 7), 61 | x) ^ x;
        this.seed = ((x ^ x >>> 14) >>> 0);
        return (this.seed >>> 0) / 4294967296;
    }

    randInt(min, max) {
        return min + Math.floor(this.next() * (max - min + 1));
    }

    choice(arr) {
        return arr[Math.floor(this.next() * arr.length)];
    }
}

// Game state
class GameState {
    constructor(seed = 1337) {
        this.seed = seed;
        this.prng = new PRNG(seed);
        this.turn = 1;
        this.gameOver = false;
        this.gameResult = null;

        // Resources
        this.resources = {
            food: 20,
            water: 20,
            metal: 0,
            power: 0,
            parts: 10,
            scrip: 50
        };

        this.resourceCaps = {
            food: 100,
            water: 100,
            metal: 80,
            power: 60,
            parts: 60,
            scrip: 500
        };

        // Map
        this.map = this.generateMap();
        this.buildings = {};

        // Population
        this.colonists = this.generateColonists(8);
        this.nextColonistId = this.colonists.length;

        // Research
        this.research = this.initializeResearch();

        // Trade
        this.tradeArrival = this.prng.randInt(8, 12);
        this.tradePrices = this.generateTradePrices();

        // Events
        this.eventLog = [];
        this.eventCooldowns = {};

        // Status
        this.lastMoraleCrash = -100;
    }

    generateMap() {
        const map = [];
        const terrainTypes = ['ash', 'rock', 'water', 'vent', 'ruins'];
        const weights = { ash: 0.35, rock: 0.30, water: 0.15, vent: 0.10, ruins: 0.10 };

        for (let i = 0; i < 64; i++) {
            let r = this.prng.next();
            let terrain = 'ash';
            if (r < 0.35) terrain = 'ash';
            else if (r < 0.65) terrain = 'rock';
            else if (r < 0.80) terrain = 'water';
            else if (r < 0.90) terrain = 'vent';
            else terrain = 'ruins';

            map.push({
                x: i % 8,
                y: Math.floor(i / 8),
                terrain: terrain,
                building: null
            });
        }
        return map;
    }

    generateColonists(count) {
        const jobs = ['farming', 'engineering', 'mining', 'research'];
        const names = ['Alex', 'Bailey', 'Casey', 'Dana', 'Ezra', 'Fay', 'Gray', 'Harper',
                      'Iris', 'Jordan', 'Kai', 'Lee', 'Morgan', 'Nash', 'Oscar', 'Parker'];

        const colonists = [];
        for (let i = 0; i < count; i++) {
            colonists.push({
                id: i,
                name: names[i % names.length] + (i >= names.length ? (i - names.length + 1) : ''),
                job: jobs[i % 4],
                skill: 2,
                fatigue: 0,
                morale: 50,
                assigned: null
            });
        }
        return colonists;
    }

    initializeResearch() {
        return {
            efficiency: { done: false, cost: { scrip: 30, parts: 5 }, desc: 'Improve production by 20%', prereq: null },
            vent_tech: { done: false, cost: { scrip: 50, parts: 10 }, desc: 'Unlock forge, geothermal power', prereq: null },
            water_purify: { done: false, cost: { scrip: 40, parts: 8 }, desc: 'Reduce water consumption -20%', prereq: null },
            storm_defense: { done: false, cost: { scrip: 60, parts: 15 }, desc: 'Unlock shield, reduce storm damage -30%', prereq: null },
            population: { done: false, cost: { scrip: 50, parts: 10 }, desc: 'Unlock shelter, morale +15', prereq: 'efficiency' },
            advanced_farm: { done: false, cost: { scrip: 70, parts: 12 }, desc: 'Unlock hydroponic farm, +50% food', prereq: 'water_purify' },
            power_plant: { done: false, cost: { scrip: 80, parts: 20 }, desc: 'Unlock reactor, power gen +100%', prereq: 'vent_tech' },
            final_tech: { done: false, cost: { scrip: 100, parts: 25 }, desc: 'Victory tech - escape ship ready', prereq: 'power_plant' }
        };
    }

    generateTradePrices() {
        const prices = {};
        const base = { food: 5, water: 6, metal: 20, power: 15, parts: 30 };
        for (let k in base) {
            prices[k] = base[k] + this.prng.randInt(-2, 2);
        }
        return prices;
    }

    getTile(x, y) {
        if (x < 0 || x >= 8 || y < 0 || y >= 8) return null;
        return this.map[y * 8 + x];
    }

    canBuild(x, y, buildingType) {
        const tile = this.getTile(x, y);
        if (!tile || tile.building) return false;

        const reqs = {
            greenhouse: { terrain: ['ash', 'ruins'], adj: null },
            condenser: { terrain: ['water', 'ruins'], adj: 'water' },
            forge: { terrain: ['vent', 'rock'], adj: 'vent' },
            generator: { terrain: ['vent', 'rock'], adj: 'vent' },
            solar: { terrain: ['ash', 'rock'], adj: null },
            warehouse: { terrain: ['rock', 'ruins'], adj: null },
            shelter: { terrain: ['ruins', 'rock'], adj: null },
            shield: { terrain: ['rock', 'vent'], adj: 'vent' }
        };

        const req = reqs[buildingType];
        if (!req) return false;
        if (!req.terrain.includes(tile.terrain)) return false;

        if (req.adj) {
            const adj = [
                this.getTile(x - 1, y),
                this.getTile(x + 1, y),
                this.getTile(x, y - 1),
                this.getTile(x, y + 1)
            ];
            if (!adj.some(t => t && t.terrain === req.adj)) return false;
        }

        return true;
    }

    build(x, y, buildingType) {
        if (!this.canBuild(x, y, buildingType)) return false;

        const costs = {
            greenhouse: { metal: 10, parts: 5 },
            condenser: { metal: 15, parts: 8 },
            forge: { metal: 20, parts: 10 },
            generator: { metal: 25, parts: 15 },
            solar: { metal: 15, parts: 8 },
            warehouse: { metal: 10, parts: 5 },
            shelter: { metal: 15, parts: 10 },
            shield: { metal: 30, parts: 20 }
        };

        const cost = costs[buildingType];
        if (!cost) return false;

        for (let k in cost) {
            if ((this.resources[k] || 0) < cost[k]) return false;
        }

        for (let k in cost) {
            this.resources[k] -= cost[k];
        }

        const tile = this.getTile(x, y);
        tile.building = {
            type: buildingType,
            hp: 100,
            assigned: []
        };

        return true;
    }

    getAdjacencyBonus(x, y) {
        const adj = [
            this.getTile(x - 1, y),
            this.getTile(x + 1, y),
            this.getTile(x, y - 1),
            this.getTile(x, y + 1)
        ];

        let bonus = 1;
        for (let t of adj) {
            if (t && t.building) bonus += 0.15;
        }
        return bonus;
    }

    produceResources() {
        const produced = {};

        for (let tile of this.map) {
            if (!tile.building) continue;
            const b = tile.building;
            const assigned = this.colonists.filter(c => c.assigned === b);

            if (assigned.length === 0) continue;

            const avgSkill = assigned.reduce((s, c) => s + c.skill, 0) / assigned.length;
            const avgMorale = assigned.reduce((m, c) => m + c.morale, 0) / assigned.length / 50;
            const baseOutput = avgSkill * avgMorale;
            const bonus = this.getAdjacencyBonus(tile.x, tile.y);
            const output = Math.floor(baseOutput * bonus);

            if (this.research.efficiency.done) output *= 1.2;

            switch (b.type) {
                case 'greenhouse':
                    const waterNeeded = assigned.length * 2;
                    if ((this.resources.water || 0) >= waterNeeded) {
                        this.resources.water -= waterNeeded;
                        produced.food = (produced.food || 0) + output * 4;
                    }
                    break;

                case 'condenser':
                    produced.water = (produced.water || 0) + output * 3;
                    break;

                case 'forge':
                    const powerNeeded = assigned.length * 3;
                    if ((this.resources.power || 0) >= powerNeeded) {
                        this.resources.power -= powerNeeded;
                        produced.metal = (produced.metal || 0) + output * 3;
                    }
                    break;

                case 'generator':
                    produced.power = (produced.power || 0) + output * 5;
                    break;

                case 'solar':
                    produced.power = (produced.power || 0) + output * 3;
                    break;

                case 'warehouse':
                    break;

                case 'shelter':
                    break;
            }
        }

        for (let k in produced) {
            this.resources[k] = Math.min(this.resources[k] + produced[k], this.resourceCaps[k]);
        }
    }

    consumeResources() {
        const foodNeeded = this.colonists.length * 2;
        const waterNeeded = this.colonists.length * 1.5;

        if ((this.resources.food || 0) < foodNeeded) {
            this.colonists.forEach(c => c.morale = Math.max(0, c.morale - 5));
        } else {
            this.resources.food -= foodNeeded;
        }

        if ((this.resources.water || 0) < waterNeeded) {
            this.colonists.forEach(c => c.morale = Math.max(0, c.morale - 3));
        } else {
            this.resources.water -= waterNeeded;
        }
    }

    updateColonists() {
        for (let c of this.colonists) {
            if (c.morale <= 0) {
                const idx = this.colonists.indexOf(c);
                this.colonists.splice(idx, 1);
                continue;
            }

            if (c.assigned) {
                c.fatigue = Math.min(100, c.fatigue + 20);
                if (this.prng.next() < 0.05) c.skill = Math.min(5, c.skill + 1);
                if (c.fatigue > 70) c.morale = Math.max(0, c.morale - 2);
            } else {
                c.fatigue = Math.max(0, c.fatigue - 15);
                c.morale = Math.min(100, c.morale + 2);
            }

            if (this.prng.next() < 0.02) {
                c.morale = Math.max(0, c.morale - 3);
            }
        }
    }

    endTurn() {
        if (this.gameOver) return;

        this.produceResources();
        this.consumeResources();
        this.updateColonists();

        if (this.turn % 15 === 0) {
            this.ashStorm();
        }

        if (this.turn === this.tradeArrival) {
            this.fireEvent('trade_caravan');
            this.tradeArrival = this.turn + this.prng.randInt(8, 15);
            this.tradePrices = this.generateTradePrices();
        }

        if (this.prng.next() < 0.3) {
            const eventList = Object.keys(this.eventDetails).filter(e => !this.eventCooldowns[e] || this.eventCooldowns[e] < this.turn);
            if (eventList.length > 0) {
                this.fireEvent(this.prng.choice(eventList));
            }
        }

        for (let k in this.eventCooldowns) {
            if (this.eventCooldowns[k] < this.turn - 20) delete this.eventCooldowns[k];
        }

        this.turn++;
        this.checkEndConditions();
    }

    ashStorm() {
        const severity = Math.min(100, 20 + (this.turn - 1) / 2);
        let damage = Math.floor(severity * 0.8);

        if (this.research.storm_defense.done) damage *= 0.7;

        for (let tile of this.map) {
            if (tile.building) {
                tile.building.hp = Math.max(0, tile.building.hp - damage);
            }
        }

        this.colonists.forEach(c => c.morale = Math.max(0, c.morale - 10));
        this.resources.water = Math.max(0, this.resources.water - Math.floor(severity * 2));
    }

    fireEvent(eventKey) {
        if (this.eventCooldowns[eventKey] && this.eventCooldowns[eventKey] >= this.turn) return;
        this.eventCooldowns[eventKey] = this.turn;

        const details = this.eventDetails[eventKey];
        if (details) {
            this.pendingEvent = { key: eventKey, details: details };
        }
    }

    eventDetails = {
        trade_caravan: {
            text: 'Caravan arrived with goods!',
            choices: [{ text: 'Browse and trade', effect: () => {} }]
        },
        dust_storm: {
            text: 'Unexpected dust storm damaged the facility!',
            choices: [
                { text: 'Repair now (cost 10 parts)', effect: (gs) => gs.resources.parts -= 10 },
                { text: 'Defer repairs (morale -5)', effect: (gs) => gs.colonists.forEach(c => c.morale -= 5) }
            ]
        },
        new_settler: {
            text: 'A new settler has arrived!',
            choices: [
                { text: 'Recruit (cost 5 scrip)', effect: (gs) => {
                    if (gs.resources.scrip >= 5) {
                        gs.resources.scrip -= 5;
                        const jobs = ['farming', 'engineering', 'mining', 'research'];
                        gs.colonists.push({
                            id: gs.nextColonistId++,
                            name: 'Settler' + gs.nextColonistId,
                            job: gs.prng.choice(jobs),
                            skill: 1,
                            fatigue: 0,
                            morale: 50,
                            assigned: null
                        });
                    }
                } },
                { text: 'Decline', effect: () => {} }
            ]
        },
        morale_boost: {
            text: 'The colonists found an old pre-eruption cache! Spirits lifted!',
            choices: [{ text: 'Everyone is happy', effect: (gs) => gs.colonists.forEach(c => c.morale = Math.min(100, c.morale + 15)) }]
        },
        equipment_failure: {
            text: 'Critical equipment failure detected!',
            choices: [
                { text: 'Spend resources to fix (15 parts)', effect: (gs) => {
                    if (gs.resources.parts >= 15) gs.resources.parts -= 15;
                } },
                { text: 'Jury-rig solution (morale -10)', effect: (gs) => gs.colonists.forEach(c => c.morale = Math.max(0, c.morale - 10)) }
            ]
        },
        resource_found: {
            text: 'A cache of supplies was discovered!',
            choices: [{ text: 'Secure the cache', effect: (gs) => {
                gs.resources.food += 15;
                gs.resources.water += 10;
                gs.resources.parts += 5;
            } }]
        },
        illness: {
            text: 'Illness spreading through the colony!',
            choices: [
                { text: 'Quarantine (productivity -30%)', effect: () => {} },
                { text: 'Risk it (morale -8)', effect: (gs) => gs.colonists.forEach(c => c.morale = Math.max(0, c.morale - 8)) }
            ]
        },
        collapse: {
            text: 'Structural damage discovered!',
            choices: [
                { text: 'Extensive repair (30 parts, 20 turns)', effect: (gs) => {
                    if (gs.resources.parts >= 30) gs.resources.parts -= 30;
                } },
                { text: 'Abandon the damaged section', effect: (gs) => gs.resources.food -= 10 }
            ]
        },
        breakthrough: {
            text: 'A research breakthrough! Knowledge spreads!',
            choices: [{ text: 'Celebrate', effect: (gs) => gs.colonists.forEach(c => c.morale = Math.min(100, c.morale + 10)) }]
        },
        solar_flare: {
            text: 'Solar flare detected!',
            choices: [
                { text: 'Shut down power (safe but -30% production)', effect: () => {} },
                { text: 'Keep running (risk surge damage)', effect: (gs) => {
                    if (gs.prng.next() < 0.4) gs.resources.power = Math.max(0, gs.resources.power - 20);
                } }
            ]
        }
    };

    checkEndConditions() {
        if (this.colonists.length === 0) {
            this.gameOver = true;
            this.gameResult = { win: false, reason: 'population_zero' };
            return;
        }

        if (this.turn >= 60) {
            const criticalNeedsMet = (this.resources.food || 0) >= 20 && (this.resources.water || 0) >= 20;
            if (this.colonists.length >= 12 && criticalNeedsMet) {
                this.gameOver = true;
                this.gameResult = { win: true, reason: 'victory' };
            } else {
                this.gameOver = true;
                this.gameResult = { win: false, reason: 'timeout' };
            }
        }
    }

    getHash() {
        return Math.abs(
            this.turn * 73 +
            (this.resources.food || 0) * 101 +
            (this.resources.water || 0) * 103 +
            (this.resources.metal || 0) * 107 +
            (this.resources.power || 0) * 109 +
            (this.resources.parts || 0) * 113 +
            (this.resources.scrip || 0) * 127 +
            this.colonists.length * 131 +
            Object.values(this.research).filter(r => r.done).length * 137
        ).toString(16);
    }

    serialize() {
        return JSON.stringify({
            seed: this.seed,
            turn: this.turn,
            resources: this.resources,
            colonists: this.colonists,
            research: this.research,
            buildings: this.map.map(t => t.building ? { x: t.x, y: t.y, b: t.building } : null).filter(Boolean),
            tradeArrival: this.tradeArrival,
            tradePrices: this.tradePrices,
            eventCooldowns: this.eventCooldowns
        });
    }

    static deserialize(json) {
        try {
            const data = JSON.parse(json);
            const gs = new GameState(data.seed);
            gs.turn = data.turn;
            gs.resources = data.resources;
            gs.colonists = data.colonists;
            gs.research = data.research;
            gs.tradeArrival = data.tradeArrival;
            gs.tradePrices = data.tradePrices;
            gs.eventCooldowns = data.eventCooldowns;

            for (let bld of data.buildings) {
                const t = gs.getTile(bld.x, bld.y);
                if (t) t.building = bld.b;
            }

            return gs;
        } catch (e) {
            return null;
        }
    }
}

// UI Controller
class Game {
    constructor() {
        this.gs = new GameState(1337);
        this.currentTab = 'map';
        this.eventPending = false;
        this.setupUI();
        this.render();
    }

    setupUI() {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => this.switchTab(e.target.dataset.tab));
        });

        document.getElementById('end-turn-btn').addEventListener('click', () => this.advanceTurn());
        document.getElementById('test-btn').addEventListener('click', () => this.runTests());
        document.getElementById('bench-btn').addEventListener('click', () => this.runBenchmark());
        document.getElementById('save-btn').addEventListener('click', () => this.copySave());
        document.getElementById('load-btn').addEventListener('click', () => this.pasteLoad());
        document.getElementById('confirm-load-btn').addEventListener('click', () => this.confirmLoad());
        document.getElementById('new-game-btn').addEventListener('click', () => this.newGameWithSeed());

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                this.advanceTurn();
            }
            const tabMap = { '1': 'map', '2': 'people', '3': 'research', '4': 'trade', '5': 'log' };
            if (tabMap[e.key]) this.switchTab(tabMap[e.key]);
        });
    }

    switchTab(tab) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tab + '-panel').classList.add('active');
        document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
        this.currentTab = tab;
        this.renderTabContent();
    }

    render() {
        this.updateStats();
        this.renderTabContent();
    }

    renderTabContent() {
        switch (this.currentTab) {
            case 'map': this.renderMap(); break;
            case 'people': this.renderPeople(); break;
            case 'research': this.renderResearch(); break;
            case 'trade': this.renderTrade(); break;
            case 'log': this.renderLog(); break;
            case 'save': this.renderSaveLoad(); break;
        }
    }

    updateStats() {
        document.getElementById('stat-food').textContent = this.gs.resources.food || 0;
        document.getElementById('stat-water').textContent = this.gs.resources.water || 0;
        document.getElementById('stat-metal').textContent = this.gs.resources.metal || 0;
        document.getElementById('stat-power').textContent = this.gs.resources.power || 0;
        document.getElementById('stat-parts').textContent = this.gs.resources.parts || 0;
        document.getElementById('stat-scrip').textContent = this.gs.resources.scrip || 0;
        document.getElementById('turn-display').textContent = 'Turn ' + this.gs.turn;
        document.getElementById('pop-display').textContent = this.gs.colonists.length;
    }

    renderMap() {
        const grid = document.getElementById('map-grid');
        grid.innerHTML = '';

        for (let tile of this.gs.map) {
            const div = document.createElement('div');
            div.className = 'tile ' + tile.terrain;

            const icon = { ash: '▒', rock: '●', water: '≈', vent: '◆', ruins: '⌂' }[tile.terrain];

            if (tile.building) {
                const bIcons = {
                    greenhouse: '🌱',
                    condenser: '💧',
                    forge: '⚒',
                    generator: '⚡',
                    solar: '☀',
                    warehouse: '📦',
                    shelter: '⛺',
                    shield: '🛡'
                };
                div.innerHTML = `<div class="tile-icon">${bIcons[tile.building.type] || '█'}</div>
                               <div class="tile-label">${tile.building.type.substring(0, 3)}</div>`;

                div.addEventListener('mouseenter', (e) => this.showTooltip(e,
                    `${tile.building.type}\nHP: ${tile.building.hp}\nAssigned: ${tile.building.assigned.length}`));
            } else {
                div.innerHTML = `<div class="tile-icon">${icon}</div>`;

                const buildingsAvailable = ['greenhouse', 'condenser', 'forge', 'generator', 'solar', 'warehouse', 'shelter', 'shield'];
                const buildable = buildingsAvailable.filter(b => this.gs.canBuild(tile.x, tile.y, b));

                if (buildable.length > 0) {
                    div.addEventListener('click', () => this.showBuildMenu(tile, buildable));
                    div.addEventListener('mouseenter', (e) => this.showTooltip(e,
                        `${tile.terrain} terrain\nBuildable: ${buildable.join(', ')}`));
                } else {
                    div.addEventListener('mouseenter', (e) => this.showTooltip(e, `${tile.terrain} terrain\nCannot build here`));
                }
            }

            grid.appendChild(div);
        }
    }

    showBuildMenu(tile, buildable) {
        const menu = document.createElement('div');
        menu.style.position = 'fixed';
        menu.style.top = '50%';
        menu.style.left = '50%';
        menu.style.transform = 'translate(-50%, -50%)';
        menu.style.background = '#1a1a1a';
        menu.style.border = '2px solid #ff6b35';
        menu.style.padding = '15px';
        menu.style.zIndex = '2000';
        menu.style.borderRadius = '5px';
        menu.style.minWidth = '250px';

        let html = '<div style="color: #ffb366; font-weight: bold; margin-bottom: 10px;">Select building:</div>';
        for (let b of buildable) {
            const costs = {
                greenhouse: { metal: 10, parts: 5 },
                condenser: { metal: 15, parts: 8 },
                forge: { metal: 20, parts: 10 },
                generator: { metal: 25, parts: 15 },
                solar: { metal: 15, parts: 8 },
                warehouse: { metal: 10, parts: 5 },
                shelter: { metal: 15, parts: 10 },
                shield: { metal: 30, parts: 20 }
            };
            const cost = costs[b];
            const canAfford = (this.gs.resources.metal || 0) >= cost.metal && (this.gs.resources.parts || 0) >= cost.parts;
            html += `<button style="display: block; width: 100%; padding: 6px; margin: 4px 0; background: ${canAfford ? '#333' : '#555'}; border: 1px solid #555; color: ${canAfford ? '#e0e0e0' : '#999'}; cursor: ${canAfford ? 'pointer' : 'not-allowed'}; font-family: 'Courier New', monospace;" onclick="game.build(${tile.x}, ${tile.y}, '${b}')" ${!canAfford ? 'disabled' : ''}>
                ${b} (M:${cost.metal} P:${cost.parts})
            </button>`;
        }
        html += '<button style="display: block; width: 100%; padding: 6px; margin-top: 8px; background: #333; border: 1px solid #555; color: #e0e0e0; cursor: pointer; font-family: \'Courier New\', monospace;" onclick="document.querySelector(\'div[style*=\\\"position: fixed\\\"][style*=\\\"2000\\\"]\').remove()">Cancel</button>';

        menu.innerHTML = html;
        document.body.appendChild(menu);
    }

    build(x, y, buildingType) {
        if (this.gs.build(x, y, buildingType)) {
            this.addLog(`Built ${buildingType} at (${x},${y})`);
        }
        document.querySelectorAll('div[style*="position: fixed"][style*="2000"]').forEach(el => el.remove());
        this.render();
    }

    renderPeople() {
        const list = document.getElementById('people-list');
        list.innerHTML = '';

        const buildings = {};
        for (let tile of this.gs.map) {
            if (tile.building) buildings[tile.building.type] = tile;
        }
        const buildingList = Object.values(buildings);

        for (let c of this.gs.colonists) {
            const card = document.createElement('div');
            card.className = 'colonist-card' + (c.morale < 20 ? ' low-morale' : '');

            let html = `<div class="colonist-name">${c.name}</div>`;
            html += `<div class="colonist-stats">
                <div class="colonist-stat"><span class="colonist-stat-label">Skill:</span><span class="colonist-stat-value">${c.skill}/5</span></div>
                <div class="colonist-stat"><span class="colonist-stat-label">Morale:</span><span class="colonist-stat-value">${c.morale}</span></div>
                <div class="colonist-stat"><span class="colonist-stat-label">Fatigue:</span><span class="colonist-stat-value">${c.fatigue}</span></div>
                <div class="colonist-stat"><span class="colonist-stat-label">Job:</span><span class="colonist-stat-value">${c.job}</span></div>
            </div>`;

            if (c.assigned) {
                html += `<div class="colonist-job">Assigned to: ${c.assigned.type}</div>`;
                html += `<button class="colonist-job" style="background: #444; border: 1px solid #555; cursor: pointer; margin-top: 4px;" onclick="game.unassign(${c.id})">Rest</button>`;
            } else {
                html += `<div class="colonist-job" style="color: #90ee90;">Resting (+morale +fatigue reduction)</div>`;
                if (buildingList.length > 0) {
                    let assignHtml = '<div style="margin-top: 4px;"><select style="width: 100%; padding: 4px; background: #111; border: 1px solid #555; color: #0f0; font-family: \'Courier New\', monospace;" onchange="game.assign(' + c.id + ', this.value)">';
                    assignHtml += '<option value="">Assign to building...</option>';
                    for (let tile of this.gs.map) {
                        if (tile.building) {
                            assignHtml += `<option value="${tile.x}_${tile.y}">${tile.building.type}</option>`;
                        }
                    }
                    assignHtml += '</select></div>';
                    html += assignHtml;
                }
            }

            card.innerHTML = html;
            list.appendChild(card);
        }
    }

    assign(colonistId, buildingStr) {
        if (!buildingStr) return;
        const [x, y] = buildingStr.split('_').map(Number);
        const tile = this.gs.getTile(x, y);
        if (!tile || !tile.building) return;

        const colonist = this.gs.colonists.find(c => c.id === colonistId);
        if (colonist) {
            colonist.assigned = tile.building;
            this.addLog(`${colonist.name} assigned to ${tile.building.type}`);
            this.render();
        }
    }

    unassign(colonistId) {
        const colonist = this.gs.colonists.find(c => c.id === colonistId);
        if (colonist) {
            colonist.assigned = null;
            this.addLog(`${colonist.name} is now resting`);
            this.render();
        }
    }

    renderResearch() {
        const tree = document.getElementById('research-tree');
        tree.innerHTML = '';

        for (let key in this.gs.research) {
            const r = this.gs.research[key];
            const node = document.createElement('div');

            let status = 'locked';
            if (r.done) status = 'done';
            else if (!r.prereq || this.gs.research[r.prereq].done) status = 'available';

            node.className = 'research-node ' + status;

            let html = `<div class="research-name">${key}</div>`;
            html += `<div class="research-desc">${r.desc}</div>`;
            html += `<div class="research-cost">Cost: ${r.cost.scrip} scrip, ${r.cost.parts} parts</div>`;

            if (status === 'done') {
                html += `<div style="color: #90ee90; margin-top: 4px;">✓ Completed</div>`;
            } else if (status === 'available') {
                const canAfford = (this.gs.resources.scrip || 0) >= r.cost.scrip && (this.gs.resources.parts || 0) >= r.cost.parts;
                html += `<button class="research-btn" ${canAfford ? '' : 'disabled'} onclick="game.research('${key}')">Research (${canAfford ? 'Ready' : 'Insufficient'})</button>`;
            } else {
                html += `<div style="color: #aaa; margin-top: 4px;">Requires: ${r.prereq}</div>`;
            }

            node.innerHTML = html;
            tree.appendChild(node);
        }
    }

    research(key) {
        const r = this.gs.research[key];
        if (r.done) return;
        if (r.prereq && !this.gs.research[r.prereq].done) return;
        if ((this.gs.resources.scrip || 0) < r.cost.scrip || (this.gs.resources.parts || 0) < r.cost.parts) return;

        this.gs.resources.scrip -= r.cost.scrip;
        this.gs.resources.parts -= r.cost.parts;
        r.done = true;

        this.addLog(`Completed research: ${key}`);
        this.render();
    }

    renderTrade() {
        const content = document.getElementById('trade-content');
        content.innerHTML = '';

        const section = document.createElement('div');
        section.className = 'trade-caravan';

        if (this.gs.turn < this.gs.tradeArrival) {
            section.innerHTML = `<div class="trade-status">Caravan arrives in ${this.gs.tradeArrival - this.gs.turn} turns</div>`;
        } else {
            section.innerHTML = `<div class="trade-status">Caravan in outpost (${this.gs.tradeArrival - this.gs.turn + 15} turns remain)</div>`;
            section.innerHTML += `<div class="trade-items">`;

            for (let resource of ['food', 'water', 'metal', 'parts']) {
                const price = this.gs.tradePrices[resource];
                const stock = Math.floor(50 - (this.gs.resources[resource] || 0) * 0.1);

                section.innerHTML += `
                <div class="trade-item">
                    <div class="trade-item-name">${resource} (${stock} available)</div>
                    <div class="trade-item-price">${price} scrip each</div>
                    <button class="trade-btn" onclick="game.trade('${resource}', 1)">Buy</button>
                    <button class="trade-btn" onclick="game.trade('${resource}', -1)">Sell</button>
                </div>
                `;
            }

            section.innerHTML += `</div>`;
        }

        content.appendChild(section);
    }

    trade(resource, dir) {
        const price = this.gs.tradePrices[resource];

        if (dir > 0) {
            if ((this.gs.resources.scrip || 0) >= price) {
                this.gs.resources.scrip -= price;
                this.gs.resources[resource] = Math.min(this.gs.resourceCaps[resource], (this.gs.resources[resource] || 0) + 1);
                this.addLog(`Bought ${resource}`);
            }
        } else {
            if ((this.gs.resources[resource] || 0) > 0) {
                this.gs.resources.scrip = Math.min(this.gs.resourceCaps.scrip, (this.gs.resources.scrip || 0) + price);
                this.gs.resources[resource]--;
                this.addLog(`Sold ${resource}`);
            }
        }

        this.render();
    }

    renderLog() {
        const log = document.getElementById('log');
        log.innerHTML = '';

        for (let entry of this.gs.eventLog.slice(-30)) {
            const div = document.createElement('div');
            div.className = 'log-entry ' + (entry.type || 'info');
            div.innerHTML = `<span class="log-turn">[T${entry.turn}]</span> <span class="log-text">${entry.text}</span>`;
            log.appendChild(div);
        }
    }

    renderSaveLoad() {
        const save = this.gs.serialize();
        document.getElementById('save-text').value = save;
    }

    copySave() {
        const text = document.getElementById('save-text');
        text.select();
        document.execCommand('copy');
        alert('State copied to clipboard!');
    }

    pasteLoad() {
        const text = document.getElementById('load-text');
        text.select();
        document.execCommand('paste');
    }

    confirmLoad() {
        const json = document.getElementById('load-text').value;
        const gs = GameState.deserialize(json);
        if (gs) {
            this.gs = gs;
            this.addLog('Game loaded from save', 'info');
            this.render();
        } else {
            alert('Invalid save data');
        }
    }

    newGameWithSeed() {
        const seed = parseInt(document.getElementById('seed-input').value);
        this.gs = new GameState(seed || 1337);
        this.addLog('New game started with seed ' + (seed || 1337), 'success');
        this.render();
    }

    addLog(text, type = 'info') {
        this.gs.eventLog.push({
            turn: this.gs.turn,
            text: text,
            type: type
        });
    }

    showTooltip(e, text) {
        const tooltip = document.createElement('div');
        tooltip.className = 'tooltip';
        tooltip.textContent = text;
        tooltip.style.left = (e.pageX + 10) + 'px';
        tooltip.style.top = (e.pageY + 10) + 'px';
        document.body.appendChild(tooltip);

        const hideTooltip = () => tooltip.remove();
        document.addEventListener('mousemove', hideTooltip, { once: true });
    }

    advanceTurn() {
        if (this.gs.gameOver) return;

        if (this.gs.pendingEvent) {
            this.showEventDialog(this.gs.pendingEvent);
            this.gs.pendingEvent = null;
        } else {
            this.gs.endTurn();
            this.checkGameEnd();
            this.render();
        }
    }

    showEventDialog(event) {
        const overlay = document.createElement('div');
        overlay.className = 'event-overlay';

        const dialog = document.createElement('div');
        dialog.className = 'event-dialog';

        let html = `<div class="event-title">${event.details.text}</div><div class="event-choices">`;

        for (let choice of event.details.choices) {
            html += `<button class="event-btn" onclick="game.chooseEvent('${event.key}', '${choice.text}')">${choice.text}</button>`;
        }

        html += '</div>';
        dialog.innerHTML = html;

        overlay.appendChild(dialog);
        document.body.appendChild(overlay);
    }

    chooseEvent(eventKey, choiceText) {
        const event = this.gs.eventDetails[eventKey];
        const choice = event.choices.find(c => c.text === choiceText);
        if (choice && choice.effect) {
            choice.effect(this.gs);
        }

        this.addLog(event.text + ' → ' + choiceText, 'event');
        document.querySelector('.event-overlay').remove();
        this.gs.endTurn();
        this.checkGameEnd();
        this.render();
    }

    checkGameEnd() {
        if (this.gs.gameOver) {
            this.showEndScreen();
        }
    }

    showEndScreen() {
        const overlay = document.createElement('div');
        overlay.className = 'end-game-screen';

        const content = document.createElement('div');
        content.className = 'end-game-content';

        let scorePopulation = Math.min(this.gs.colonists.length * 5, 60);
        let scoreResearch = Object.values(this.gs.research).filter(r => r.done).length * 10;
        let scoreResources = Math.floor((
            (this.gs.resources.food || 0) * 0.1 +
            (this.gs.resources.water || 0) * 0.1 +
            (this.gs.resources.metal || 0) * 0.15 +
            (this.gs.resources.parts || 0) * 0.2 +
            (this.gs.resources.scrip || 0) * 0.05
        ));
        let scoreTurns = Math.min((this.gs.turn - 1) * 2, 60);
        let totalScore = scorePopulation + scoreResearch + scoreResources + scoreTurns;

        if (!this.gs.gameResult.win) {
            content.innerHTML = `
                <div class="end-game-title">GAME OVER</div>
                <div class="end-game-message">
                    ${this.gs.gameResult.reason === 'population_zero' ? 'All colonists lost.' : 'Time expired without meeting victory conditions.'}
                </div>
                <div class="end-game-score">
                    <div class="end-game-score-line">
                        <span class="end-game-score-label">Final Score:</span>
                        <span class="end-game-score-value">${totalScore}</span>
                    </div>
                </div>
                <button class="end-game-btn" onclick="location.reload()">New Game</button>
            `;
        } else {
            content.innerHTML = `
                <div class="end-game-title">VICTORY!</div>
                <div class="end-game-message">The colony has achieved stability and growth!</div>
                <div class="end-game-score">
                    <div class="end-game-score-line">
                        <span class="end-game-score-label">Population:</span>
                        <span class="end-game-score-value">+${scorePopulation}</span>
                    </div>
                    <div class="end-game-score-line">
                        <span class="end-game-score-label">Research:</span>
                        <span class="end-game-score-value">+${scoreResearch}</span>
                    </div>
                    <div class="end-game-score-line">
                        <span class="end-game-score-label">Resources:</span>
                        <span class="end-game-score-value">+${scoreResources}</span>
                    </div>
                    <div class="end-game-score-line">
                        <span class="end-game-score-label">Survival:</span>
                        <span class="end-game-score-value">+${scoreTurns}</span>
                    </div>
                    <div class="end-game-final">Total: ${totalScore}</div>
                </div>
                <button class="end-game-btn" onclick="location.reload()">Play Again</button>
            `;
        }

        overlay.appendChild(content);
        document.body.appendChild(overlay);
    }

    runTests() {
        const output = document.getElementById('dev-output');
        const tests = [];
        let passed = 0, total = 0;

        const test = (name, assertion) => {
            total++;
            try {
                if (assertion()) {
                    tests.push(`✓ ${name}`);
                    passed++;
                } else {
                    tests.push(`✗ ${name}`);
                }
            } catch (e) {
                tests.push(`✗ ${name} (error: ${e.message})`);
            }
        };

        test('Resources non-negative', () => {
            return Object.values(this.gs.resources).every(r => r >= 0);
        });

        test('Resources within caps', () => {
            return Object.entries(this.gs.resources).every(([k, v]) => v <= this.gs.resourceCaps[k]);
        });

        test('Map is 8x8', () => {
            return this.gs.map.length === 64;
        });

        test('All tiles have terrain', () => {
            return this.gs.map.every(t => ['ash', 'rock', 'water', 'vent', 'ruins'].includes(t.terrain));
        });

        test('Colonist count matches', () => {
            return this.gs.colonists.every(c => c.morale >= 0 && c.morale <= 100);
        });

        test('Research prerequisites enforced', () => {
            const done = Object.entries(this.gs.research).filter(([k, r]) => r.done);
            return done.every(([k, r]) => !r.prereq || this.gs.research[r.prereq].done);
        });

        test('Buildings have valid types', () => {
            const types = new Set();
            this.gs.map.forEach(t => { if (t.building) types.add(t.building.type); });
            const validTypes = ['greenhouse', 'condenser', 'forge', 'generator', 'solar', 'warehouse', 'shelter', 'shield'];
            return Array.from(types).every(t => validTypes.includes(t));
        });

        test('Colonists have valid jobs', () => {
            return this.gs.colonists.every(c => ['farming', 'engineering', 'mining', 'research'].includes(c.job));
        });

        test('Skill levels in range', () => {
            return this.gs.colonists.every(c => c.skill >= 1 && c.skill <= 5);
        });

        test('Fatigue in range', () => {
            return this.gs.colonists.every(c => c.fatigue >= 0 && c.fatigue <= 100);
        });

        test('Morale in range', () => {
            return this.gs.colonists.every(c => c.morale >= 0 && c.morale <= 100);
        });

        test('Save/load round-trip', () => {
            const ser = this.gs.serialize();
            const gs2 = GameState.deserialize(ser);
            return gs2 && gs2.getHash() === this.gs.getHash();
        });

        test('Trade prices exist', () => {
            return ['food', 'water', 'metal', 'parts'].every(r => this.gs.tradePrices[r] > 0);
        });

        test('Event details defined', () => {
            return Object.keys(this.gs.eventDetails).length >= 10;
        });

        test('Map tiles have coordinates', () => {
            return this.gs.map.every((t, i) => t.x === i % 8 && t.y === Math.floor(i / 8));
        });

        output.textContent = tests.join('\n') + '\n\n' + passed + '/' + total + ' PASSED';
    }

    runBenchmark() {
        const output = document.getElementById('dev-output');
        const seed = this.gs.seed;

        const gs = new GameState(seed);
        let turn = 0;

        while (turn < 200) {
            gs.endTurn();
            turn++;
        }

        const hash = gs.getHash();
        const stats = `
Benchmark Results (Seed ${seed}):
Final Turn: ${gs.turn}
Population: ${gs.colonists.length}
Food: ${gs.resources.food}
Water: ${gs.resources.water}
Metal: ${gs.resources.metal}
Power: ${gs.resources.power}
Parts: ${gs.resources.parts}
Scrip: ${gs.resources.scrip}
Research Completed: ${Object.values(gs.research).filter(r => r.done).length}
State Hash: ${hash}
        `;

        output.textContent = stats;
    }
}

let game;
window.addEventListener('DOMContentLoaded', () => {
    game = new Game();
});
</script>

</body>
</html>
