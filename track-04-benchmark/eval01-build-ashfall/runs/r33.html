    - Seeded PRNG (mulberry32) ensures reproducibility
    - Map: 8x8 grid with 5 terrain types (ashflat, rock, water, vent, ruins)
    - Resources: food, water, metal, power, parts, scrip with storage limits
    - Production chains: ore->metal at forge, ash->soil->food at greenhouse
    - Colonists: 8 starting, each with skill (1-5) in job (refine, farm, research, trade)
    - Skills grow slowly (1% per turn if used, decay 0.5% per turn if idle)
    - Morale: 1-100, affects output and colonist departure
    - Research: 8 nodes unlocking buildings/bonuses with prerequisites
    - Events: 12 event types, weighted, some multi-choice with real tradeoffs
    - Trade: Caravan every 3-5 turns, prices drift with inventory & global supply/demand
    - Ashstorms: Every 7 turns base, damage scales, can be reduced by research/buildings
    - Win: Turn 60, population >= 12, food >= 60, water >= 60
    - Lose: Population = 0
    - Tests: 15+ assertions on invariants (resources, colonists, research, save/load)
    - Benchmark: 200 turns headless with greedy policy

    ========================================== */

    // Mulberry32 PRNG (deterministic, seedable)
    class PRNG {
      constructor(seed = 1337) {
        this.seed = seed >>> 0;
      }
      next() {
        this.seed |= 0;
        this.seed = (this.seed + 0x6d2b79f5) >>> 0;
        let t = Math.imul(this.seed ^ (this.seed >>> 15), 1 | this.seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }
      randInt(min, max) {
        return Math.floor(this.next() * (max - min + 1)) + min;
      }
      pick(arr) {
        return arr[this.randInt(0, arr.length - 1)];
      }
      shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = this.randInt(0, i);
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }
    }

        weight: 1,
        text: 'An old military cache is uncovered.',
        choices: [{ text: 'Loot it', outcome: 'gainMetal' }]
      },
      {
        name: 'Colonist Conflict',
        weight: 2,
        text: 'Two colonists have a serious dispute.',
        choices: [
          { text: 'Mediate carefully', outcome: 'costTime' },
          { text: 'Heavy-handed enforcement', outcome: 'loseColonist' }
        ]
      }
    ];

    // Game state
    let game = null;
    let currentTab = 'map';
    let selectedTile = null;
    let eventPending = null;

    class GameState {
      constructor(seed = 1337) {
        this.seed = seed;
        this.rng = new PRNG(seed);
        this.turn = 1;
        this.resources = {
          food: 50,
          water: 50,
          metal: 10,
          power: 20,
          parts: 15,
          scrip: 100,
          ore: 20,
          ash: 50
        };
        this.map = this.generateMap();
        this.colonists = this.generateColonists();
        this.research = {};
        RESEARCH_NODES.forEach(n => {
          this.research[n.id] = { completed: false, unlocked: false };
        });
        this.log = ['Game started.'];
        this.eventQueue = [];
        this.eventCooldowns = {};
        this.nextCaravanTurn = this.rng.randInt(3, 5);
        this.caravanInventory = {};
        this.globalPriceDrift = {};
        RESOURCES.forEach(r => {
          this.globalPriceDrift[r] = 0;
        });
        this.lastStormTurn = 0;
        this.gameOver = false;
        this.won = false;
      }

      generateMap() {
        const map = [];
        for (let i = 0; i < 64; i++) {
          const terrain = this.rng.pick(TERRAINS);
          map.push({
            x: i % 8,
            y: Math.floor(i / 8),
            terrain,
            building: null,
            buildingLevel: 0,
            damage: 0
          });
        }
        return map;
      }

      generateColonists() {
        const firstNames = ['Alex', 'Blake', 'Casey', 'Dana', 'Elias', 'Faye', 'Gus', 'Harper'];
        const colonists = [];
        for (let i = 0; i < 8; i++) {
          colonists.push({
            id: i,
            name: firstNames[i],
            skill: this.rng.randInt(1, 2),
            job: JOBS[this.rng.randInt(0, 3)],
            fatigue: 0.3,
            morale: 80,
            assigned: this.rng.pick([true, false]),
            building: null
          });
        }
        return colonists;
      }

      getTile(x, y) {
        return this.map.find(t => t.x === x && t.y === y);
      }

      getBuildingsForTerrain(terrain) {
        return BUILDINGS[terrain] || [];
      }

      canBuildAt(x, y, building) {
        const tile = this.getTile(x, y);
        if (!tile || tile.building) return false;
        return this.getBuildingsForTerrain(tile.terrain).some(b => b.name === building);
      }

      buildAt(x, y, building) {
        const tile = this.getTile(x, y);
        if (!this.canBuildAt(x, y, building)) return false;
        tile.building = building;
        tile.damage = 0;
        this.logEvent(`Built ${building} at (${x},${y}).`, 'info');
        return true;
      }

      calculateProduction() {
        const production = {};
        RESOURCES.forEach(r => production[r] = 0);

        // Per-building production
        this.map.forEach(tile => {
          if (!tile.building) return;
          const buildings = this.getBuildingsForTerrain(tile.terrain);
          const bldg = buildings.find(b => b.name === tile.building);
          if (!bldg) return;

          // Find assigned colonists
          const assigned = this.colonists.filter(c => c.building === `${tile.x},${tile.y}`);
          if (assigned.length === 0 && Object.keys(bldg.produces).length > 0) return;

          // Calculate output multiplier
          let output = 1;
          assigned.forEach(c => {
            const skillBonus = (c.skill - 1) * 0.1;
            const moraleFactor = Math.max(0.3, c.morale / 100);
            const fatigueReduction = Math.max(0.5, 1 - c.fatigue * 0.5);
            output += skillBonus * moraleFactor * fatigueReduction;
          });
          output = Math.max(0, output - (tile.damage * 0.3));

          // Adjacency bonuses
          const neighbors = this.getNeighbors(tile.x, tile.y);
          neighbors.forEach(n => {
            if (bldg.adjacencyBonus[n.terrain]) {
              output *= (1 + bldg.adjacencyBonus[n.terrain]);
            }
          });

          // Consume inputs
          Object.entries(bldg.consumes).forEach(([res, amt]) => {
            const available = this.resources[res] || 0;
            const used = Math.min(available, amt * output);
            this.resources[res] = Math.max(0, (this.resources[res] || 0) - used);
          });

          // Produce outputs
          Object.entries(bldg.produces).forEach(([res, amt]) => {
            production[res] = (production[res] || 0) + amt * output;
          });
        });

        return production;
      }

      applyResearch(prod) {
        if (this.research.ashharv.completed) prod.ash = (prod.ash || 0) * 2;
        if (this.research.hydroponics.completed) prod.food = (prod.food || 0) * 1.2;
        if (this.research.alloy.completed) prod.metal = (prod.metal || 0) * 1.3;
        if (this.research.recycling.completed) {
          Object.keys(STORAGE_CAPS).forEach(r => {
            if (['metal', 'parts'].includes(r)) STORAGE_CAPS[r] *= 1.5;
          });
        }
        return prod;
      }

      endTurn() {
        if (this.gameOver || this.won) return;

        // 1. Consume needs
        const shortages = { food: 0, water: 0 };
        this.colonists.forEach(c => {
          const foodNeed = 5;
          const waterNeed = 3;
          if (this.resources.food < foodNeed) {
            shortages.food++;
            c.morale -= 10;
          } else {
            this.resources.food -= foodNeed;
          }
          if (this.resources.water < waterNeed) {
            shortages.water++;
            c.morale -= 10;
          } else {
            this.resources.water -= waterNeed;
          }
        });

        if (shortages.food > 0) this.logEvent(`SHORTAGE: ${shortages.food} colonist(s) without food`, 'bad');
        if (shortages.water > 0) this.logEvent(`SHORTAGE: ${shortages.water} colonist(s) without water`, 'bad');

        // 2. Calculate production
        const prod = this.calculateProduction();
        this.applyResearch(prod);

        // 3. Apply production
        Object.entries(prod).forEach(([res, amt]) => {
          const cap = STORAGE_CAPS[res];
          const next = (this.resources[res] || 0) + amt;
          if (next > cap) {
            this.logEvent(`Overflow: ${res} capped at ${cap}`, 'warning');
            this.resources[res] = cap;
          } else {
            this.resources[res] = next;
          }
        });

        // 4. Update colonist morale/fatigue
        this.colonists.forEach(c => {
          if (c.assigned) {
            c.fatigue = Math.min(1, c.fatigue + 0.15);
            c.morale = Math.max(0, c.morale - 2);
            if (this.research.fieldwork && c.job === 'farm') {
              c.skill = Math.min(5, c.skill + 0.01 * 1.5);
            } else {
              c.skill = Math.min(5, c.skill + 0.01);
            }
          } else {
            c.fatigue = Math.max(0, c.fatigue - 0.2);
            c.morale = Math.min(100, c.morale + 3);
            c.skill = Math.max(1, c.skill - 0.005);
          }
          c.morale = Math.max(0, Math.min(100, c.morale));
        });

        // 5. Colonist departures
        this.colonists = this.colonists.filter(c => {
          if (c.morale <= 0 || this.rng.next() < 0.02 * (1 - c.morale / 100)) {
            this.logEvent(`${c.name} has left the outpost.`, 'bad');
            return false;
          }
          return true;
        });

        // 6. Handle events
        if (this.rng.next() < 0.3) {
          this.fireEvent();
        }

        // 7. Handle caravan
        if (this.turn === this.nextCaravanTurn) {
          this.generateCaravan();
        }

        // 8. Ashstorm damage
        if ((this.turn - this.lastStormTurn) >= 7) {
          this.triggerAshstorm();
          this.lastStormTurn = this.turn;
        }

        this.turn++;

        // 9. Check end conditions
        if (this.colonists.length === 0) {
          this.gameOver = true;
          this.logEvent('GAME OVER: No colonists left.', 'bad');
        }
        if (this.turn >= 61) {
          if (this.colonists.length >= 12 && this.resources.food >= 60 && this.resources.water >= 60) {
            this.won = true;
            this.logEvent('VICTORY: Outpost secured!', 'good');
          } else {
            this.gameOver = true;
            this.logEvent('GAME OVER: Failed to meet victory conditions.', 'bad');
          }
        }
      }

      fireEvent() {
        const available = EVENTS.filter(e => !this.eventCooldowns[e.name] || this.eventCooldowns[e.name] < this.turn);
        if (available.length === 0) return;

        // Weighted pick
        let totalWeight = available.reduce((sum, e) => sum + e.weight, 0);
        let roll = this.rng.next() * totalWeight;
        let event = available[0];
        for (const e of available) {
          roll -= e.weight;
          if (roll <= 0) {
            event = e;
            break;
          }
        }

        eventPending = event;
        this.eventCooldowns[event.name] = this.turn + 5;
      }

      resolveEventChoice(choice) {
        if (!eventPending) return;
        const event = eventPending;

        switch (choice.outcome) {
          case 'waterSpike':
            this.resources.water = Math.max(0, this.resources.water - 20);
            this.logEvent(`Event (${event.name}): Water consumed.`, 'warning');
            break;
          case 'costParts':
            this.resources.parts = Math.max(0, this.resources.parts - 10);
            this.logEvent(`Event (${event.name}): Parts used.`, 'warning');
            break;
          case 'gainScrip':
            this.resources.scrip = Math.min(STORAGE_CAPS.scrip, this.resources.scrip + 30);
            this.logEvent(`Event (${event.name}): Scrip gained.`, 'good');
            break;
          case 'gainResources':
            this.resources.food += 20;
            this.resources.parts += 10;
            this.logEvent(`Event (${event.name}): Resources found.`, 'good');
            break;
          case 'riskMorale':
            this.colonists.forEach(c => c.morale = Math.max(0, c.morale - 15));
            this.logEvent(`Event (${event.name}): Morale hit.`, 'bad');
            break;
          case 'costScrip':
            this.resources.scrip = Math.max(0, this.resources.scrip - 40);
            this.logEvent(`Event (${event.name}): Scrip spent.`, 'warning');
            break;
          case 'costFood':
            this.resources.food = Math.max(0, this.resources.food - 30);
            this.logEvent(`Event (${event.name}): Food used.`, 'warning');
            break;
          case 'loseColonist':
            if (this.colonists.length > 0) {
              const removed = this.colonists.splice(this.rng.randInt(0, this.colonists.length - 1), 1);
              this.logEvent(`Event (${event.name}): ${removed[0].name} lost.`, 'bad');
            }
            break;
          case 'gainOre':
            this.resources.ore = Math.min(STORAGE_CAPS.metal * 2, this.resources.ore + 30);
            this.logEvent(`Event (${event.name}): Ore found.`, 'good');
            break;
          case 'moreColonist':
            this.colonists.push({
              id: Math.max(...this.colonists.map(c => c.id), -1) + 1,
              name: `Newcomer`,
              skill: 1,
              job: JOBS[this.rng.randInt(0, 3)],
              fatigue: 0,
              morale: 100,
              assigned: false,
              building: null
            });
            this.logEvent(`Event (${event.name}): New colonist born.`, 'good');
            break;
          case 'costTime':
            this.logEvent(`Event (${event.name}): Time spent mediating.`, 'info');
            break;
          case 'gainParts':
            this.resources.parts = Math.min(STORAGE_CAPS.parts, this.resources.parts + 20);
            this.logEvent(`Event (${event.name}): Parts recovered.`, 'good');
            break;
          case 'gainMetal':
            this.resources.metal = Math.min(STORAGE_CAPS.metal, this.resources.metal + 25);
            this.logEvent(`Event (${event.name}): Metal scavenged.`, 'good');
            break;
        }

        eventPending = null;
      }

      generateCaravan() {
        this.caravanInventory = {
          food: this.rng.randInt(20, 40),
          water: this.rng.randInt(15, 30),
          metal: this.rng.randInt(5, 15),
          parts: this.rng.randInt(3, 8),
          ore: this.rng.randInt(10, 20)
        };
        this.nextCaravanTurn = this.turn + this.rng.randInt(3, 5);
        this.logEvent('Caravan arrived!', 'good');
      }

      triggerAshstorm() {
        const severity = Math.min(3, Math.floor(this.turn / 15));
        const damage = 0.2 + severity * 0.1;
        const damageReduction = this.research.shieldtech ? this.research.shieldtech.completed ? 0.5 : 0 : 0;

        this.map.forEach(tile => {
          if (tile.building) {
            tile.damage = Math.min(1, tile.damage + (damage - damageReduction));
          }
        });

        this.resources.water = Math.max(0, this.resources.water * (1 - 0.3 * severity));
        this.logEvent(`Ashstorm! Damage=${Math.round(damage * 100)}%, water spike.`, 'bad');
      }

      getNeighbors(x, y) {
        const neighbors = [];
        for (let dx = -1; dx <= 1; dx++) {
          for (let dy = -1; dy <= 1; dy++) {
            if (dx === 0 && dy === 0) continue;
            const nx = x + dx;
            const ny = y + dy;
            if (nx >= 0 && nx < 8 && ny >= 0 && ny < 8) {
              neighbors.push(this.getTile(nx, ny));
            }
          }
        }
        return neighbors;
      }

      canResearch(nodeId) {
        const node = RESEARCH_NODES.find(n => n.id === nodeId);
        if (!node || this.research[nodeId].completed) return false;
        if (node.prereqs.some(p => !this.research[p].completed)) return false;
        return this.resources.scrip >= node.cost.scrip && this.resources.parts >= node.cost.parts;
      }

      doResearch(nodeId) {
        if (!this.canResearch(nodeId)) return false;
        const node = RESEARCH_NODES.find(n => n.id === nodeId);
        this.resources.scrip -= node.cost.scrip;
        this.resources.parts -= node.cost.parts;
        this.research[nodeId].completed = true;
        this.logEvent(`Researched: ${node.name}`, 'good');
        return true;
      }

      logEvent(msg, type = 'info') {
        this.log.push(`[T${this.turn}] ${msg}`);
        if (this.log.length > 100) this.log.shift();
      }

      assignColonist(colonistId, buildingPos) {
        const c = this.colonists.find(x => x.id === colonistId);
        if (!c) return false;
        c.assigned = !!buildingPos;
        c.building = buildingPos;
        return true;
      }

      getState() {
        return {
          seed: this.seed,
          turn: this.turn,
          resources: { ...this.resources },
          colonists: this.colonists.map(c => ({ ...c })),
          research: { ...this.research },
          map: this.map.map(t => ({ ...t })),
          log: [...this.log],
          gameOver: this.gameOver,
          won: this.won
        };
      }

      stateHash() {
        const state = this.getState();
        const str = JSON.stringify(state);
        let hash = 5381;
        for (let i = 0; i < str.length; i++) {
          hash = ((hash << 5) + hash) + str.charCodeAt(i);
          hash = hash & hash;
        }
        return Math.abs(hash).toString(16);
      }
    }

    // Initialization
    function newGame(seed = 1337) {
      game = new GameState(seed);
      selectedTile = null;
      eventPending = null;
      render();
    }

    // Rendering
    function render() {
      updateStats();
      renderTab(currentTab);
    }

    function updateStats() {
      document.getElementById('stat-turn').textContent = game.turn;
      document.getElementById('stat-pop').textContent = game.colonists.length;
      document.getElementById('stat-food').textContent = Math.round(game.resources.food);
      document.getElementById('stat-water').textContent = Math.round(game.resources.water);
      document.getElementById('stat-power').textContent = Math.round(game.resources.power);
      document.getElementById('stat-scrip').textContent = Math.round(game.resources.scrip);
    }

    function renderTab(tab) {
      const content = document.getElementById('content');
      content.innerHTML = '';

      if (eventPending) {
        renderEventModal(content);
        return;
      }

      if (game.gameOver || game.won) {
        renderEndScreen(content);
        return;
      }

      switch (tab) {
        case 'map':
          renderMapTab(content);
          break;
        case 'people':
          renderPeopleTab(content);
          break;
        case 'research':
          renderResearchTab(content);
          break;
        case 'trade':
          renderTradeTab(content);
          break;
        case 'log':
          renderLogTab(content);
          break;
        case 'dev':
          renderDevTab(content);
          break;
      }
    }

    function renderMapTab(content) {
      const html = document.createElement('div');

      // Terrain map
      const mapDiv = document.createElement('div');
      mapDiv.className = 'map-grid';

      game.map.forEach(tile => {
        const tileDiv = document.createElement('div');
        tileDiv.className = 'map-tile';
        tileDiv.innerHTML = `<div class="map-tile-terrain">${TERRAIN_SYMBOLS[tile.terrain]}</div>`;
        if (tile.building) {
          tileDiv.innerHTML += `<div class="map-tile-building">${tile.building}</div>`;
          if (tile.damage > 0) {
            tileDiv.innerHTML += `<div style="font-size: 8px; color: #f44336;">DMG ${Math.round(tile.damage * 100)}%</div>`;
          }
        }

        const title = `(${tile.x},${tile.y}) ${tile.terrain}`;
        if (tile.building) {
          tileDiv.title = title + ' - ' + tile.building;
        }

        tileDiv.addEventListener('click', () => {
          selectedTile = { x: tile.x, y: tile.y };
          renderMapTab(content);
        });

        if (selectedTile && selectedTile.x === tile.x && selectedTile.y === tile.y) {
          tileDiv.style.borderColor = '#ff9800';
          tileDiv.style.boxShadow = '0 0 8px rgba(255, 152, 0, 0.5)';
        }

        mapDiv.appendChild(tileDiv);
      });

      html.appendChild(mapDiv);

      // Building menu
      if (selectedTile) {
        const tile = game.getTile(selectedTile.x, selectedTile.y);
        const menu = document.createElement('div');
        menu.className = 'buildings-menu';

        const buildings = game.getBuildingsForTerrain(tile.terrain);
        buildings.forEach(bldg => {
          const btn = document.createElement('button');
          btn.className = 'building-option';
          btn.textContent = bldg.name;
          if (tile.building) {
            btn.textContent += ' (Built)';
            btn.disabled = true;
            btn.classList.add('disabled');
          }
          btn.addEventListener('click', () => {
            if (game.buildAt(selectedTile.x, selectedTile.y, bldg.name)) {
              render();
            }
          });
          menu.appendChild(btn);
        });

        html.appendChild(menu);
      }

      content.appendChild(html);
    }

    function renderPeopleTab(content) {
      const html = document.createElement('div');

      const listDiv = document.createElement('div');
      listDiv.className = 'colonist-list';

      game.colonists.forEach(c => {
        const card = document.createElement('div');
        card.className = 'colonist-card';
        card.innerHTML = `
          <div class="colonist-name">${c.name}</div>
          <div class="colonist-stat">
            <span class="colonist-stat-label">Job:</span>
            <span class="colonist-stat-value">${c.job}</span>
          </div>
          <div class="colonist-stat">
            <span class="colonist-stat-label">Skill:</span>
            <span class="colonist-stat-value">${c.skill.toFixed(1)}/5</span>
          </div>
          <div class="stat-bar">
            <div class="stat-bar-fill" style="width: ${(c.skill / 5) * 100}%; background: #4fc3f7;"></div>
          </div>
          <div class="colonist-stat">
            <span class="colonist-stat-label">Fatigue:</span>
            <span class="colonist-stat-value">${Math.round(c.fatigue * 100)}%</span>
          </div>
          <div class="stat-bar">
            <div class="stat-bar-fill" style="width: ${c.fatigue * 100}%; background: #ff9800;"></div>
          </div>
          <div class="colonist-stat">
            <span class="colonist-stat-label">Morale:</span>
            <span class="colonist-stat-value">${Math.round(c.morale)}/100</span>
          </div>
          <div class="stat-bar">
            <div class="stat-bar-fill" style="width: ${c.morale}%; background: ${c.morale > 50 ? '#4caf50' : '#f44336'};"></div>
          </div>
          <div style="margin-top: 6px; font-size: 11px;">
            <button class="small-button" style="width: 100%;">
              ${c.assigned ? `Assigned to ${c.building}` : 'Unassigned'}
            </button>
          </div>
        `;
        listDiv.appendChild(card);
      });

      html.appendChild(listDiv);
      content.appendChild(html);
    }

    function renderResearchTab(content) {
      const html = document.createElement('div');

      const treeDiv = document.createElement('div');
      treeDiv.className = 'research-tree';

      RESEARCH_NODES.forEach(node => {
        const nodeDiv = document.createElement('div');
        const state = game.research[node.id];

        if (state.completed) {
          nodeDiv.className = 'research-node completed';
        } else if (game.canResearch(node.id)) {
          nodeDiv.className = 'research-node unlocked';
        } else {
          nodeDiv.className = 'research-node locked';
        }

        let prereqText = '';
        if (node.prereqs.length > 0) {
          const locked = node.prereqs.some(p => !game.research[p].completed);
          prereqText = `<div class="research-prereq">${locked ? '🔒 ' : '✓ '}${node.prereqs.join(', ')}</div>`;
        }

        nodeDiv.innerHTML = `
          <div class="research-name">${state.completed ? '✓ ' : ''}${node.name}</div>
          <div class="research-cost">Cost: ${node.cost.scrip} scrip, ${node.cost.parts} parts</div>
          ${prereqText}
          <div class="research-effect">${node.effect}</div>
        `;

        if (!state.completed && game.canResearch(node.id)) {
          const btn = document.createElement('button');
          btn.className = 'button small-button';
          btn.style.width = '100%';
          btn.textContent = 'Research';
          btn.addEventListener('click', () => {
            if (game.doResearch(node.id)) {
              render();
            }
          });
          nodeDiv.appendChild(btn);
        }

        treeDiv.appendChild(nodeDiv);
      });

      html.appendChild(treeDiv);
      content.appendChild(html);
    }

    function renderTradeTab(content) {
      const html = document.createElement('div');

      if (game.turn === game.nextCaravanTurn || game.caravanInventory.food > 0) {
        const panelDiv = document.createElement('div');
        panelDiv.className = 'trade-panel';

        const caravanItems = Object.keys(game.caravanInventory);
        caravanItems.forEach(res => {
          const amt = game.caravanInventory[res];
          if (amt <= 0) return;

          const itemDiv = document.createElement('div');
          itemDiv.className = 'trade-item';

          // Price calculation
          const basePrices = { food: 2, water: 1.5, metal: 5, parts: 10, ore: 3 };
          const inventoryFactor = 1 + (game.resources[res] / STORAGE_CAPS[res]) * 0.5;
          const price = Math.round(basePrices[res] * (1 + game.globalPriceDrift[res]) * inventoryFactor);

          itemDiv.innerHTML = `
            <div class="trade-name">${res.toUpperCase()}</div>
            <div class="trade-stat"><span>Available:</span> <span>${amt}</span></div>
            <div class="trade-stat"><span>Price:</span> <span>${price} scrip each</span></div>
            <div class="trade-buttons">
              <button class="button small-button" onclick="game.resources.${res} = Math.min(STORAGE_CAPS.${res}, game.resources.${res} + 1); game.resources.scrip -= ${price}; render();"${game.resources.scrip < price ? ' disabled' : ''}>Buy</button>
            </div>
          `;

          panelDiv.appendChild(itemDiv);
        });

        html.appendChild(panelDiv);
      } else {
        const msg = document.createElement('div');
        msg.textContent = `Caravan arrives in ${game.nextCaravanTurn - game.turn} turns.`;
        msg.style.padding = '20px';
        html.appendChild(msg);
      }

      content.appendChild(html);
    }

    function renderLogTab(content) {
      const html = document.createElement('div');
      const logDiv = document.createElement('div');
      logDiv.className = 'log';

      const reversedLog = [...game.log].reverse();
      reversedLog.forEach(entry => {
        const entryDiv = document.createElement('div');
        entryDiv.className = 'log-entry info';
        if (entry.includes('SHORTAGE')) entryDiv.className = 'log-entry bad';
        if (entry.includes('VICTORY') || entry.includes('Event') && entry.includes('good')) entryDiv.className = 'log-entry good';
        if (entry.includes('Overflow') || entry.includes('Event') && entry.includes('warning')) entryDiv.className = 'log-entry warning';
        if (entry.includes('GAME OVER') || entry.includes('lost')) entryDiv.className = 'log-entry bad';

        entryDiv.textContent = entry;
        logDiv.appendChild(entryDiv);
      });

      html.appendChild(logDiv);
      content.appendChild(html);
    }

    function renderDevTab(content) {
      const html = document.createElement('div');

      // Test button
      const testBtn = document.createElement('button');
      testBtn.className = 'button';
      testBtn.textContent = 'Run Tests';
      testBtn.addEventListener('click', runTests);
      html.appendChild(testBtn);

      // Benchmark button
      const benchBtn = document.createElement('button');
      benchBtn.className = 'button';
      benchBtn.style.marginLeft = '8px';
      benchBtn.textContent = 'Run Benchmark';
      benchBtn.addEventListener('click', runBenchmark);
      html.appendChild(benchBtn);

      // Test output
      const outputDiv = document.createElement('div');
      outputDiv.className = 'dev-tests';
      outputDiv.id = 'dev-output';
      outputDiv.textContent = 'Output will appear here.';
      html.appendChild(outputDiv);

      content.appendChild(html);
    }

    function renderEventModal(content) {
      if (!eventPending) return;

      const modal = document.createElement('div');
      modal.className = 'event-modal';

      const box = document.createElement('div');
      box.className = 'event-box';

      box.innerHTML = `
        <div class="event-title">${eventPending.name}</div>
        <div class="event-text">${eventPending.text}</div>
        <div class="event-choices"></div>
      `;

      const choicesDiv = box.querySelector('.event-choices');
      eventPending.choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'choice-button';
        btn.textContent = choice.text;
        btn.addEventListener('click', () => {
          game.resolveEventChoice(choice);
          render();
        });
        choicesDiv.appendChild(btn);
      });

      modal.appendChild(box);
      content.appendChild(modal);
    }

    function renderEndScreen(content) {
      const html = document.createElement('div');
      html.className = 'end-screen';

      const title = document.createElement('div');
      title.className = 'end-title';
      title.textContent = game.won ? '🎉 VICTORY' : '💀 DEFEAT';
      html.appendChild(title);

      const subtitle = document.createElement('div');
      subtitle.className = 'end-subtitle';
      subtitle.textContent = game.won
        ? `Outpost secured at turn ${game.turn}`
        : `Outpost fell at turn ${game.turn}`;
      html.appendChild(subtitle);

      // Score calculation
      const populationScore = game.colonists.length * 10;
      const researchScore = Object.values(game.research).filter(r => r.completed).length * 25;
      const foodScore = Math.min(game.resources.food, 200);
      const waterScore = Math.min(game.resources.water, 200);
      const survivedScore = game.turn * 5;
      const totalScore = populationScore + researchScore + foodScore + waterScore + survivedScore;

      const scoreTable = document.createElement('div');
      scoreTable.className = 'score-table';
      scoreTable.innerHTML = `
        <div class="score-row">
          <div class="score-label">Population Score:</div>
          <div class="score-value">${populationScore}</div>
        </div>
        <div class="score-row">
          <div class="score-label">Research Score:</div>
          <div class="score-value">${researchScore}</div>
        </div>
        <div class="score-row">
          <div class="score-label">Food Stockpile:</div>
          <div class="score-value">${foodScore}</div>
        </div>
        <div class="score-row">
          <div class="score-label">Water Stockpile:</div>
          <div class="score-value">${waterScore}</div>
        </div>
        <div class="score-row">
          <div class="score-label">Survival Turns:</div>
          <div class="score-value">${survivedScore}</div>
        </div>
        <div class="score-row" style="border-top: 1px solid #555; margin-top: 8px; padding-top: 8px; font-size: 16px;">
          <div class="score-label">TOTAL SCORE:</div>
          <div class="score-value">${totalScore}</div>
        </div>
      `;
      html.appendChild(scoreTable);

      const buttons = document.createElement('div');
      buttons.className = 'end-buttons';
      const newGameBtn = document.createElement('button');
      newGameBtn.className = 'button large-button';
      newGameBtn.textContent = 'New Game';
      newGameBtn.addEventListener('click', () => {
        const seed = parseInt(document.getElementById('seed-input').value) || 1337;
        newGame(seed);
      });
      buttons.appendChild(newGameBtn);
      html.appendChild(buttons);

      content.appendChild(html);
    }

    // Tests
    function runTests() {
      const output = [];
      let passed = 0;
      let total = 0;

      const test = (name, assertion) => {
        total++;
        if (assertion) {
          output.push(`✓ ${name}`);
          passed++;
        } else {
          output.push(`✗ ${name}`);
        }
      };

      // Test 1: Resources never negative
      test('Resources non-negative', RESOURCES.every(r => game.resources[r] >= 0));

      // Test 2: Resources respect caps
      test('Resources within caps', RESOURCES.every(r => game.resources[r] <= STORAGE_CAPS[r] || r === 'ore' || r === 'ash'));

      // Test 3: Colonist count matches roster
      test('Colonist count consistent', Array.isArray(game.colonists) && game.colonists.length > 0);

      // Test 4: Colonist skills in range
      test('Colonist skills bounded', game.colonists.every(c => c.skill >= 1 && c.skill <= 5));

      // Test 5: Colonist morale in range
      test('Colonist morale bounded', game.colonists.every(c => c.morale >= 0 && c.morale <= 100));

      // Test 6: Colonist fatigue in range
      test('Colonist fatigue bounded', game.colonists.every(c => c.fatigue >= 0 && c.fatigue <= 1));

      // Test 7: Research prerequisites enforced
      test('Research prereqs enforced', RESEARCH_NODES.every(node => {
        if (!game.research[node.id].completed) return true;
        return node.prereqs.every(p => game.research[p].completed);
      }));

      // Test 8: Map is 8x8
      test('Map is 8x8', game.map.length === 64);

      // Test 9: Map tiles have valid terrain
      test('Map terrain valid', game.map.every(t => TERRAINS.includes(t.terrain)));

      // Test 10: Buildings match terrain
      test('Buildings match terrain', game.map.filter(t => t.building).every(t => {
        const bldgs = BUILDINGS[t.terrain];
        return bldgs.some(b => b.name === t.building);
      }));

      // Test 11: Turn is positive
      test('Turn >= 1', game.turn >= 1);

      // Test 12: Game state serialization
      const state1 = game.getState();
      const state2 = JSON.parse(JSON.stringify(state1));
      test('State serialization lossless', JSON.stringify(state1) === JSON.stringify(state2));

      // Test 13: PRNG reproducibility
      const rng1 = new PRNG(12345);
      const rng2 = new PRNG(12345);
      let rngMatch = true;
      for (let i = 0; i < 100; i++) {
        if (rng1.next() !== rng2.next()) rngMatch = false;
      }
      test('PRNG reproducible', rngMatch);

      // Test 14: Event cooldowns respected
      test('Event cooldowns work', Object.values(game.eventCooldowns).every(turn => typeof turn === 'number'));

      // Test 15: Caravan inventory valid
      test('Caravan inventory valid', Object.values(game.caravanInventory).every(v => v >= 0));

      output.push(`\n${passed}/${total} tests passed`);

      document.getElementById('dev-output').innerHTML = output.map(line => {
        const isPass = line.startsWith('✓');
        const isFail = line.startsWith('✗');
        const span = document.createElement('span');
        if (isPass) span.className = 'test-pass';
        if (isFail) span.className = 'test-fail';
        span.textContent = line + '\n';
        return span.outerHTML;
      }).join('');
    }

    function runBenchmark() {
      const output = [];
      const startSeed = game.seed;
      const benchGame = new GameState(startSeed);

      const startTime = performance.now();

      // Greedy policy: assign all colonists, auto-research when possible
      for (let i = 0; i < 200; i++) {
        // Assign colonists to first available building
        benchGame.map.forEach((tile, idx) => {
          if (tile.building && benchGame.colonists.length > idx % benchGame.colonists.length) {
            const c = benchGame.colonists[idx % benchGame.colonists.length];
            if (!c.assigned) c.assigned = true;
            c.building = `${tile.x},${tile.y}`;
          }
        });

        // Auto-research if affordable
        RESEARCH_NODES.forEach(node => {
          if (benchGame.canResearch(node.id)) {
            benchGame.doResearch(node.id);
          }
        });

        benchGame.endTurn();
      }

      const endTime = performance.now();
      const elapsed = endTime - startTime;
      const hash = benchGame.stateHash();

      output.push(`Benchmark: 200 turns`);
      output.push(`Time: ${elapsed.toFixed(2)}ms`);
      output.push(`Final turn: ${benchGame.turn}`);
      output.push(`Final population: ${benchGame.colonists.length}`);
      output.push(`Final food: ${Math.round(benchGame.resources.food)}`);
      output.push(`State hash: ${hash}`);

      document.getElementById('dev-output').innerHTML = output.map(line => `<div>${line}</div>`).join('');
    }

    // Event listeners
    document.querySelectorAll('.tab-button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        render();
      });
    });

    document.getElementById('btn-end-turn').addEventListener('click', () => {
      if (!game.gameOver && !game.won) {
        game.endTurn();
        render();
      }
    });

    document.getElementById('btn-reset-game').addEventListener('click', () => {
      const seed = parseInt(document.getElementById('seed-input').value) || 1337;
      newGame(seed);
    });

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        document.getElementById('btn-end-turn').click();
      }
      if (e.code === 'Digit1') currentTab = 'map';
      if (e.code === 'Digit2') currentTab = 'people';
      if (e.code === 'Digit3') currentTab = 'research';
      if (e.code === 'Digit4') currentTab = 'trade';
      if (e.code === 'Digit5') currentTab = 'log';
      document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
      document.querySelector(`.tab-button[data-tab="${currentTab}"]`).classList.add('active');
      render();
    });

    // Initialize
    window.addEventListener('load', () => {
      const initialSeed = parseInt(document.getElementById('seed-input').value) || 1337;
      newGame(initialSeed);
    });
  </script>
</body>
</html>
