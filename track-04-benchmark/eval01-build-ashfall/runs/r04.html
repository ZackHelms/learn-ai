<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASHFALL OUTPOST</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Courier New', monospace;
      background: #1a1a1a;
      color: #e0e0e0;
      overflow: hidden;
    }
    #root {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }
    .header {
      background: #2a2a2a;
      border-bottom: 2px solid #666;
      padding: 8px 12px;
      font-size: 14px;
      flex-shrink: 0;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
      margin-bottom: 8px;
    }
    .stat {
      background: #333;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 12px;
    }
    .stat-label {
      color: #888;
    }
    .stat-value {
      color: #4f9;
      font-weight: bold;
    }
    .content {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 8px;
      padding: 8px;
    }
    .panel-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #222;
      border: 1px solid #444;
      border-radius: 4px;
      overflow: hidden;
    }
    .tabs {
      display: flex;
      background: #2a2a2a;
      border-bottom: 1px solid #444;
      flex-shrink: 0;
      overflow-x: auto;
    }
    .tab {
      flex: 1;
      padding: 8px 12px;
      border: none;
      background: none;
      color: #888;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      border-bottom: 2px solid transparent;
      min-width: 80px;
      white-space: nowrap;
    }
    .tab.active {
      color: #4f9;
      border-bottom-color: #4f9;
    }
    .panel {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: none;
    }
    .panel.active {
      display: flex;
      flex-direction: column;
    }
    .map-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 2px;
      flex-shrink: 0;
    }
    .tile {
      aspect-ratio: 1;
      background: #333;
      border: 1px solid #444;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: all 0.1s;
      user-select: none;
    }
    .tile:hover {
      background: #444;
      border-color: #666;
    }
    .tile.ash { background: #5a5a4a; }
    .tile.rock { background: #4a4a4a; }
    .tile.water { background: #1a3a6a; }
    .tile.vent { background: #6a2a2a; }
    .tile.ruins { background: #3a3a2a; }
    .tooltip {
      position: absolute;
      background: #1a1a1a;
      border: 1px solid #666;
      padding: 6px;
      font-size: 10px;
      z-index: 1000;
      white-space: nowrap;
      pointer-events: none;
      max-width: 200px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .building-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 8px;
    }
    .building-option {
      padding: 8px;
      background: #2a2a2a;
      border: 1px solid #444;
      cursor: pointer;
      text-align: center;
      font-size: 11px;
      border-radius: 3px;
      transition: all 0.1s;
    }
    .building-option:hover {
      border-color: #666;
      background: #333;
    }
    .people-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .person-card {
      background: #2a2a2a;
      padding: 8px;
      border: 1px solid #444;
      border-radius: 3px;
      font-size: 11px;
    }
    .person-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
      margin-top: 4px;
    }
    .research-tree {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .research-node {
      padding: 8px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 3px;
      font-size: 11px;
    }
    .research-node.locked { opacity: 0.5; }
    .research-node.available { border-color: #4f9; }
    .research-node.done { border-color: #4a4; background: #1a2a1a; }
    .log-entry {
      padding: 4px 0;
      font-size: 11px;
      border-bottom: 1px solid #333;
    }
    .log-turn { color: #888; font-weight: bold; }
    .log-text { color: #ccc; }
    .log-event { color: #f9a; }
    button {
      padding: 8px 12px;
      background: #2a4a2a;
      color: #4f9;
      border: 1px solid #4a6a4a;
      border-radius: 3px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      transition: all 0.1s;
    }
    button:hover {
      background: #3a6a3a;
      border-color: #6a9a6a;
    }
    button:active {
      transform: scale(0.98);
    }
    .choice-button {
      margin: 4px 0;
      width: 100%;
      text-align: left;
      padding: 8px;
      background: #1a3a1a;
      color: #9f9;
    }
    .choice-button:hover {
      background: #2a5a2a;
    }
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: #1a1a1a;
      border: 2px solid #666;
      padding: 20px;
      border-radius: 4px;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal-title {
      font-size: 16px;
      font-weight: bold;
      color: #4f9;
      margin-bottom: 12px;
    }
    .modal-text {
      margin-bottom: 12px;
      font-size: 12px;
      line-height: 1.4;
    }
    .modal-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .event-modal .modal-content {
      max-width: 600px;
    }
    .trade-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 8px;
    }
    .trade-item {
      background: #2a2a2a;
      padding: 8px;
      border: 1px solid #444;
      border-radius: 3px;
      font-size: 10px;
      text-align: center;
    }
    .trade-item button {
      width: 100%;
      margin-top: 4px;
      padding: 4px;
      font-size: 10px;
    }
    .assign-selector {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
      gap: 4px;
      margin-top: 4px;
    }
    .assign-option {
      padding: 4px;
      background: #1a3a1a;
      border: 1px solid #3a5a3a;
      border-radius: 2px;
      cursor: pointer;
      font-size: 10px;
      text-align: center;
    }
    .assign-option:hover {
      background: #2a5a2a;
      border-color: #5a8a5a;
    }
    .assign-option.active {
      background: #4f9;
      color: #000;
      border-color: #4f9;
    }
    @media (max-width: 600px) {
      .content {
        flex-direction: column;
      }
      .map-grid {
        grid-template-columns: repeat(8, 40px);
        gap: 1px;
      }
      .tile {
        font-size: 14px;
      }
      .stats {
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      }
      .tabs {
        flex-wrap: wrap;
      }
      .tab {
        flex: 0;
      }
    }
  </style>
</head>
<body>
<div id="root">
  <div class="header">
    <div class="stats" id="stats"></div>
    <div>Turn <span id="turn">0</span> | Seed <input type="text" id="seedInput" value="1337" style="width: 60px; padding: 2px;">
    <button onclick="game.newGame()">New Game</button>
    <button id="endTurnBtn" onclick="game.endTurn()">End Turn (SPACE)</button></div>
  </div>
  <div class="content">
    <div class="panel-container">
      <div class="tabs" id="tabs"></div>
      <div id="mapPanel" class="panel active">
        <div class="map-grid" id="mapGrid"></div>
      </div>
      <div id="peoplePanel" class="panel">
        <div id="peopleList" class="people-list"></div>
      </div>
      <div id="researchPanel" class="panel">
        <div id="researchTree" class="research-tree"></div>
      </div>
      <div id="tradePanel" class="panel">
        <div id="tradeStatus"></div>
        <div id="tradeGrid" class="trade-grid"></div>
      </div>
      <div id="logPanel" class="panel">
        <div id="eventLog"></div>
      </div>
      <div id="devPanel" class="panel">
        <button onclick="game.devRunTests()">Run Tests</button>
        <div id="testOutput" style="margin-top: 12px; font-size: 10px;"></div>
        <button onclick="game.devBenchmark()" style="margin-top: 8px;">Run Benchmark</button>
        <div id="benchOutput" style="margin-top: 12px; font-size: 10px;"></div>
      </div>
    </div>
  </div>
</div>

<div id="eventModal" class="modal event-modal">
  <div class="modal-content">
    <div class="modal-title" id="eventTitle"></div>
    <div class="modal-text" id="eventText"></div>
    <div class="modal-buttons" id="eventChoices"></div>
  </div>
</div>

<div id="endGameModal" class="modal">
  <div class="modal-content">
    <div class="modal-title" id="endGameTitle"></div>
    <div class="modal-text" id="endGameText" style="white-space: pre-wrap;"></div>
    <div class="modal-buttons">
      <button onclick="game.newGame()">New Game</button>
    </div>
  </div>
</div>

<script>
/*
ASSUMPTIONS:
- Single player, turn-based strategy game
- No procedural generation beyond terrain; deterministic seeded PRNG (mulberry32)
- Colonists are named from a fixed pool; morale/fatigue are global per job when not assigned
- Buildings occupy tiles, terrain modifies production not accessibility
- Research unlocks building types and modifies coefficients, not resources
- Trade prices are influenced by player stockpiles and global drift
- Storms damage buildings proportionally, not catastrophically
- Win/loss conditions simple: pop >= 12 at turn 60 vs pop == 0
- No tutorial; players learn by doing and reading tooltips
*/

// ============ SEEDED PRNG ============
class SeededRandom {
  constructor(seed) {
    this.seed = seed >>> 0;
  }
  next() {
    const x = Math.sin(this.seed++) * 10000;
    return x - Math.floor(x);
  }
}

// ============ TERRAIN & MAP GENERATION ============
const TERRAIN = {
  ASH: 'ash',
  ROCK: 'rock',
  WATER: 'water',
  VENT: 'vent',
  RUINS: 'ruins'
};

const BUILDINGS = {
  GREENHOUSE: { name: 'Greenhouse', terrain: TERRAIN.ASH, adjacency: TERRAIN.WATER, icon: '🌱', cost: { scrip: 20, parts: 5 }, workers: 1, production: [{ resource: 'food', amount: 3 }], requirements: { water: 1 }, research: null },
  CONDENSER: { name: 'Condenser', terrain: TERRAIN.ASH, adjacency: TERRAIN.WATER, icon: '💧', cost: { scrip: 15, parts: 3 }, workers: 1, production: [{ resource: 'water', amount: 2 }], requirements: {}, research: null },
  FORGE: { name: 'Forge', terrain: TERRAIN.VENT, adjacency: TERRAIN.ROCK, icon: '🔥', cost: { scrip: 30, parts: 10 }, workers: 1, production: [], requirements: { ore: 2, power: 3 }, research: null },
  MINE: { name: 'Mine', terrain: TERRAIN.ROCK, adjacency: TERRAIN.VENT, icon: '⛏', cost: { scrip: 25, parts: 8 }, workers: 1, production: [{ resource: 'ore', amount: 2 }], requirements: {}, research: null },
  POWER_PLANT: { name: 'Power Plant', terrain: TERRAIN.VENT, adjacency: TERRAIN.ROCK, icon: '⚡', cost: { scrip: 40, parts: 15 }, workers: 1, production: [{ resource: 'power', amount: 5 }], requirements: {}, research: 'power-gen' },
  STORAGE: { name: 'Storage', terrain: TERRAIN.ROCK, adjacency: null, icon: '📦', cost: { scrip: 10, parts: 2 }, workers: 0, production: [], requirements: {}, research: null },
  LAB: { name: 'Lab', terrain: TERRAIN.RUINS, adjacency: TERRAIN.ROCK, icon: '🔬', cost: { scrip: 50, parts: 20 }, workers: 1, production: [{ resource: 'scrip', amount: 5 }], requirements: {}, research: 'research-lab' },
  WORKSHOP: { name: 'Workshop', terrain: TERRAIN.RUINS, adjacency: TERRAIN.WATER, icon: '🔧', cost: { scrip: 35, parts: 12 }, workers: 1, production: [{ resource: 'parts', amount: 3 }], requirements: {}, research: 'advanced-parts' }
};

const RESEARCH_TREE = {
  'power-gen': { name: 'Power Generation', cost: { scrip: 50, parts: 20 }, prereqs: [], unlock: 'POWER_PLANT', effect: null },
  'research-lab': { name: 'Research Lab', cost: { scrip: 80, parts: 30 }, prereqs: [], unlock: 'LAB', effect: null },
  'advanced-parts': { name: 'Advanced Parts', cost: { scrip: 60, parts: 25 }, prereqs: [], unlock: 'WORKSHOP', effect: () => ({ parts_mult: 1.3 }) },
  'better-farming': { name: 'Better Farming', cost: { scrip: 40, parts: 15 }, prereqs: [], unlock: null, effect: () => ({ food_mult: 1.2 }) },
  'water-retention': { name: 'Water Retention', cost: { scrip: 35, parts: 10 }, prereqs: [], unlock: null, effect: () => ({ water_cap_mult: 1.5 }) },
  'storm-shelter': { name: 'Storm Shelter', cost: { scrip: 70, parts: 25 }, prereqs: [], unlock: null, effect: () => ({ storm_damage_mult: 0.6 }) },
  'morale-focus': { name: 'Morale Focus', cost: { scrip: 45, parts: 15 }, prereqs: ['better-farming'], unlock: null, effect: () => ({ morale_decay: 0.5 }) },
  'ore-refining': { name: 'Ore Refining', cost: { scrip: 55, parts: 20 }, prereqs: ['power-gen'], unlock: null, effect: () => ({ ore_to_metal_mult: 1.4 }) }
};

// ============ GAME STATE ============
class Game {
  constructor() {
    this.turn = 0;
    this.seed = 1337;
    this.rng = new SeededRandom(this.seed);

    this.map = [];
    this.buildings = {};

    this.resources = {
      food: 50,
      water: 50,
      ore: 20,
      metal: 10,
      power: 0,
      parts: 30,
      scrip: 100
    };

    this.storage_caps = {
      food: 200,
      water: 150,
      ore: 100,
      metal: 80,
      power: 100,
      parts: 100,
      scrip: 500
    };

    this.people = [];
    this.assigned = {};

    this.research_done = {};
    this.research_queued = null;

    this.events_fired = {};
    this.events_cooldown = {};
    this.last_caravan = -15;
    this.caravan_inventory = {};
    this.caravan_prices = {};

    this.log = [];
    this.storm_severity = 0;

    this.last_event_modal = null;
    this.game_over = false;
    this.win = false;

    this.newGame();
  }

  newGame() {
    const seedStr = document.getElementById('seedInput').value;
    this.seed = parseInt(seedStr) || 1337;
    document.getElementById('seedInput').value = this.seed;

    this.turn = 0;
    this.rng = new SeededRandom(this.seed);
    this.map = [];
    this.buildings = {};
    this.resources = { food: 50, water: 50, ore: 20, metal: 10, power: 0, parts: 30, scrip: 100 };
    this.people = this.genPeople(8);
    this.assigned = {};
    for (let i = 0; i < this.people.length; i++) {
      this.assigned[i] = null;
    }
    this.research_done = {};
    this.research_queued = null;
    this.events_fired = {};
    this.events_cooldown = {};
    this.last_caravan = -15;
    this.caravan_inventory = {};
    this.caravan_prices = {};
    this.log = [];
    this.log.push({ turn: 0, text: 'Game started. A volcanic eruption has buried the region in ash. You must manage the outpost and keep the colonists alive.' });
    this.storm_severity = 0;
    this.last_event_modal = null;
    this.game_over = false;
    this.win = false;

    this.genMap();
    this.updateUI();
  }

  genMap() {
    const weights = [
      [5, 5, 1, 1, 1],
      [5, 4, 2, 1, 1],
      [3, 3, 3, 2, 2],
      [2, 3, 3, 3, 2],
      [1, 2, 3, 3, 2]
    ];

    for (let y = 0; y < 8; y++) {
      for (let x = 0; x < 8; x++) {
        const dist = Math.abs(x - 3.5) + Math.abs(y - 3.5);
        const band = Math.min(4, Math.floor(dist / 2));
        const w = weights[band];

        const r = this.rng.next();
        const total = w.reduce((a, b) => a + b, 0);
        let acc = 0;
        let terrain = TERRAIN.ASH;
        const terrains = [TERRAIN.ASH, TERRAIN.ROCK, TERRAIN.WATER, TERRAIN.VENT, TERRAIN.RUINS];
        for (let i = 0; i < w.length; i++) {
          acc += w[i] / total;
          if (r < acc) {
            terrain = terrains[i];
            break;
          }
        }

        const idx = y * 8 + x;
        this.map[idx] = { terrain, building: null };
        this.buildings[idx] = null;
      }
    }
  }

  genPeople(count) {
    const names = ['Alex', 'Blake', 'Casey', 'Dana', 'Echo', 'Fran', 'Gray', 'Hale', 'Ivy', 'Jules', 'Kim', 'Lee'];
    const jobs = ['miner', 'farmer', 'engineer', 'researcher'];
    const people = [];

    for (let i = 0; i < count; i++) {
      const name = names[i % names.length];
      const skill = Math.floor(this.rng.next() * 3) + 1;
      people.push({
        id: i,
        name: name + (i >= names.length ? ' ' + Math.floor(i / names.length) : ''),
        job: jobs[Math.floor(this.rng.next() * jobs.length)],
        skill: skill,
        fatigue: 0,
        morale: 100,
        experience: 0
      });
    }

    return people;
  }

  tileIndex(x, y) {
    return y * 8 + x;
  }

  getTileCoords(idx) {
    return { x: idx % 8, y: Math.floor(idx / 8) };
  }

  getAdjacent(idx) {
    const { x, y } = this.getTileCoords(idx);
    const adj = [];
    for (let dx = -1; dx <= 1; dx++) {
      for (let dy = -1; dy <= 1; dy++) {
        if (dx === 0 && dy === 0) continue;
        const nx = x + dx;
        const ny = y + dy;
        if (nx >= 0 && nx < 8 && ny >= 0 && ny < 8) {
          adj.push(this.tileIndex(nx, ny));
        }
      }
    }
    return adj;
  }

  canBuild(idx, buildingKey) {
    if (this.buildings[idx] !== null) return false;

    const building = BUILDINGS[buildingKey];
    if (!building) return false;

    const tile = this.map[idx];
    if (tile.terrain !== building.terrain) return false;

    if (building.research && !this.research_done[building.research]) return false;

    const cost = building.cost;
    for (const res in cost) {
      if (this.resources[res] < cost[res]) return false;
    }

    return true;
  }

  buildAt(idx, buildingKey) {
    if (!this.canBuild(idx, buildingKey)) return;

    const building = BUILDINGS[buildingKey];
    const cost = building.cost;
    for (const res in cost) {
      this.resources[res] -= cost[res];
    }

    this.buildings[idx] = {
      key: buildingKey,
      health: 100,
      assigned_worker: null
    };

    this.log.push({ turn: this.turn, text: `Built ${building.name} at tile ${idx}.` });
  }

  clickTile(idx) {
    if (this.game_over) return;

    const candidates = Object.keys(BUILDINGS).filter(k => this.canBuild(idx, k));
    if (candidates.length === 0) return;

    if (candidates.length === 1) {
      this.buildAt(idx, candidates[0]);
      this.updateUI();
      return;
    }

    // Show popup to choose
    const modal = document.createElement('div');
    modal.className = 'modal active';
    modal.innerHTML = `
      <div class="modal-content">
        <div class="modal-title">Build on Tile ${idx}</div>
        <div class="modal-text">Select a building to construct:</div>
        <div class="modal-buttons">
          ${candidates.map(k => `
            <button class="choice-button" onclick="game.buildAt(${idx}, '${k}'); this.closest('.modal').remove(); game.updateUI();">
              ${BUILDINGS[k].name}
            </button>
          `).join('')}
          <button onclick="this.closest('.modal').remove();">Cancel</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
  }

  endTurn() {
    if (this.game_over) return;

    this.turn++;
    this.storm_severity += 0.5;

    // 1. Consume resources
    const food_need = this.people.length;
    const water_need = this.people.length + Math.max(0, Math.floor(this.storm_severity / 10));

    const food_shortage = Math.max(0, food_need - this.resources.food);
    const water_shortage = Math.max(0, water_need - this.resources.water);

    this.resources.food = Math.max(0, this.resources.food - food_need);
    this.resources.water = Math.max(0, this.resources.water - water_need);

    if (food_shortage > 0 || water_shortage > 0) {
      this.log.push({ turn: this.turn, text: `SHORTAGE: food -${food_shortage}, water -${water_shortage}` });
      this.people.forEach(p => {
        if (food_shortage > 0 || water_shortage > 0) {
          p.morale = Math.max(0, p.morale - 10 * (1 - p.morale / 100));
        }
      });
    }

    // 2. Production
    for (let idx = 0; idx < this.map.length; idx++) {
      const building = this.buildings[idx];
      if (!building) continue;

      const config = BUILDINGS[building.key];
      let output_mult = 1;
      let skip = false;

      // Check requirements
      for (const res in config.requirements) {
        if (this.resources[res] < config.requirements[res]) {
          skip = true;
          break;
        }
      }
      if (skip) continue;

      // Consume requirements
      for (const res in config.requirements) {
        this.resources[res] -= config.requirements[res];
      }

      // Worker scaling
      if (config.workers > 0 && building.assigned_worker !== null) {
        const worker = this.people[building.assigned_worker];
        output_mult = 0.5 + (worker.skill / 5) * 0.8;
        output_mult *= Math.max(0.2, 1 - worker.fatigue / 100);
        if (worker.morale < 50) output_mult *= 0.7;
        worker.fatigue = Math.min(100, worker.fatigue + 20);
        worker.experience = Math.min(100, worker.experience + Math.floor(20 * output_mult));
        if (worker.experience >= 100) {
          worker.skill = Math.min(5, worker.skill + 1);
          worker.experience = 0;
        }
      } else {
        output_mult = 0;
      }

      // Produce
      for (const prod of config.production) {
        let amount = prod.amount * output_mult;

        // Apply research multipliers
        if (prod.resource === 'food' && this.research_done['better-farming']) amount *= 1.2;
        if (prod.resource === 'parts' && this.research_done['advanced-parts']) amount *= 1.3;
        if (prod.resource === 'scrip') amount *= (this.research_done['research-lab'] ? 1.3 : 1);

        amount = Math.floor(amount);
        const new_amt = this.resources[prod.resource] + amount;
        const cap = this.storage_caps[prod.resource];
        if (new_amt > cap) {
          this.log.push({ turn: this.turn, text: `Overflow: ${prod.resource} capped at ${cap}` });
          this.resources[prod.resource] = cap;
        } else {
          this.resources[prod.resource] = new_amt;
        }
      }
    }

    // 3. Worker rest
    this.people.forEach(p => {
      if (this.assigned[p.id] === null) {
        p.fatigue = Math.max(0, p.fatigue - 15);
      }
    });

    // 4. Storm
    if (this.turn % 8 === 0) {
      const storm_dmg_base = Math.floor(10 + this.storm_severity);
      let storm_dmg = storm_dmg_base;
      if (this.research_done['storm-shelter']) storm_dmg = Math.floor(storm_dmg * 0.6);

      for (let idx = 0; idx < this.map.length; idx++) {
        if (this.buildings[idx]) {
          this.buildings[idx].health = Math.max(0, this.buildings[idx].health - storm_dmg);
        }
      }
      this.log.push({ turn: this.turn, text: `ASHSTORM! Damage: ${storm_dmg}. Repair cost: 5 parts per building.` });
    }

    // 5. Repair
    const damaged = Object.keys(this.buildings).filter(idx => this.buildings[idx] && this.buildings[idx].health < 100);
    for (const idx of damaged) {
      if (this.resources.parts >= 5) {
        this.resources.parts -= 5;
        this.buildings[idx].health = Math.min(100, this.buildings[idx].health + 30);
      }
    }

    // 6. Morale decay
    this.people.forEach(p => {
      if (p.morale > 0) {
        p.morale = Math.max(0, p.morale - 5);
        if (this.research_done['morale-focus']) p.morale = Math.min(100, p.morale + 2.5);
      }
      if (p.morale === 0) {
        this.log.push({ turn: this.turn, text: `${p.name} has left the outpost.` });
      }
    });

    this.people = this.people.filter(p => p.morale > 0);

    // 7. Events
    if (this.turn % 3 === 0) {
      this.fireEvent();
    }

    // 8. Trade
    if (this.turn - this.last_caravan >= 15) {
      this.spawnCaravan();
      this.last_caravan = this.turn;
    }

    // 9. Check win/loss
    if (this.people.length === 0) {
      this.endGame(false);
    } else if (this.turn >= 60 && this.people.length >= 12) {
      this.endGame(true);
    }

    this.updateUI();
  }

        name: 'Treasure Cache',
        text: 'A dust storm reveals an old cache of supplies.',
        choices: [
          { text: 'Salvage (get 30 scrip, 10 parts)', action: () => { this.resources.scrip += 30; this.resources.parts += 10; } },

      {

        text: 'A group of wanderers seeks shelter. Accept them?',
        choices: [
          { text: 'Welcome them (+1 colonist, costs 20 food)', action: () => { if (this.resources.food >= 20) { this.resources.food -= 20; this.people.push({ id: this.people.length, name: 'Newcomer', job: 'farmer', skill: 2, fatigue: 0, morale: 80, experience: 0 }); } } },

          { text: 'Ignore it (production -30%)', action: () => { this.storm_severity += 2; } }
        ]
      },
      {
        name: 'Morale Boost',
        text: 'A successful harvest lifts spirits.',
        choices: [
          { text: 'Celebrate (cost 5 food, gain morale)', action: () => { if (this.resources.food >= 5) { this.resources.food -= 5; this.people.forEach(p => p.morale = Math.min(100, p.morale + 15)); } } },
          { text: 'Stay focused (no effect)', action: () => {} }
        ]
      },
      {
        name: 'Water Contamination',
        text: 'A water source has been polluted.',
        choices: [
          { text: 'Purify (costs 10 parts)', action: () => { if (this.resources.parts >= 10) { this.resources.parts -= 10; this.resources.water += 20; } } },

      {
        name: 'Ore Deposit',
        text: 'Rich ore deposits are discovered.',
        choices: [
          { text: 'Mine it (gain 40 ore)', action: () => { this.resources.ore = Math.min(this.storage_caps.ore, this.resources.ore + 40); } },
          { text: 'Mark for later (no effect)', action: () => {} }
        ]
      },
      {
        name: 'Illness',
        text: 'A colonist has fallen ill.',
        choices: [
          { text: 'Use medicine (costs 10 scrip)', action: () => { if (this.resources.scrip >= 10) { this.resources.scrip -= 10; if (this.people.length > 0) this.people[0].morale = Math.min(100, this.people[0].morale + 20); } } },
          { text: 'Hope for recovery (risky)', action: () => { if (this.people.length > 0 && this.rng.next() > 0.5) this.people[0].morale = Math.max(0, this.people[0].morale - 40); } }
        ]
      },
      {
        name: 'Ash Cloud',
        text: 'A thick ash cloud approaches.',
        choices: [
          { text: 'Prepare defenses (costs 15 parts)', action: () => { if (this.resources.parts >= 15) { this.resources.parts -= 15; this.storm_severity = Math.max(0, this.storm_severity - 3); } } },
          { text: 'Ride it out (no cost)', action: () => { this.storm_severity += 1; } }
        ]
      },
      {
        name: 'Trade Opportunity',
        text: 'A trader offers rare components.',
        choices: [
          { text: 'Trade (20 scrip for 15 parts)', action: () => { if (this.resources.scrip >= 20) { this.resources.scrip -= 20; this.resources.parts += 15; } } },
          { text: 'Decline (no effect)', action: () => {} }
        ]
      },
      {
        name: 'Skill Growth',
        text: 'Your colonists have been learning.',
        choices: [
          { text: 'Promote skilled workers (choose)', action: () => { if (this.people.length > 0) this.people[0].skill = Math.min(5, this.people[0].skill + 1); } },

        ]
      }
    ];

    // Pick a random event not on cooldown
    let available = event_list.filter(e => !this.events_cooldown[e.name]);
    if (available.length === 0) {
      this.events_cooldown = {};
      available = event_list;
    }

    const event = available[Math.floor(this.rng.next() * available.length)];
    this.events_cooldown[event.name] = this.turn + 10;
    this.events_fired[event.name] = this.turn;

    this.last_event_modal = event;
    this.showEventModal(event);

  showEventModal(event) {
    const modal = document.getElementById('eventModal');
    document.getElementById('eventTitle').textContent = event.name;
    document.getElementById('eventText').textContent = event.text;
    const choices = document.getElementById('eventChoices');
    choices.innerHTML = '';

    for (const choice of event.choices) {
      const btn = document.createElement('button');
      btn.className = 'choice-button';
      btn.textContent = choice.text;
      btn.onclick = () => {
        choice.action();
        modal.classList.remove('active');
        this.updateUI();
      };
      choices.appendChild(btn);
    }

    modal.classList.add('active');
  }

  spawnCaravan() {
    const items = ['food', 'water', 'ore', 'metal', 'parts', 'scrip'];
    this.caravan_inventory = {};
    this.caravan_prices = {};

    for (const item of items) {
      this.caravan_inventory[item] = Math.floor(this.rng.next() * 40) + 20;
      let base_price = { food: 2, water: 3, ore: 4, metal: 8, parts: 5, scrip: 1 }[item];
      const supply_mod = 1 + (this.resources[item] / this.storage_caps[item]) * 0.5;
      this.caravan_prices[item] = Math.floor(base_price * (supply_mod + (this.rng.next() - 0.5) * 0.2));
    }

    this.log.push({ turn: this.turn, text: 'A caravan has arrived!' });
  }

  tradeWith(resource, buy) {
    if (!this.caravan_inventory[resource]) return;

    const price = this.caravan_prices[resource];
    if (buy) {
      const qty = Math.min(this.caravan_inventory[resource], Math.floor(this.resources.scrip / price));
      if (qty > 0) {
        this.resources[resource] = Math.min(this.storage_caps[resource], this.resources[resource] + qty);
        this.resources.scrip -= qty * price;
        this.caravan_inventory[resource] -= qty;
      }
    } else {
      const qty = Math.min(this.resources[resource], 10);
      if (qty > 0) {
        this.resources[resource] -= qty;
        this.resources.scrip += qty * price;
        this.caravan_inventory[resource] += qty;
      }
    }

    this.updateUI();
  }

  assignWorker(person_id, building_idx) {
    const old_assign = Object.keys(this.assigned).find(k => this.assigned[k] === building_idx);
    if (old_assign) this.assigned[old_assign] = null;

    this.assigned[person_id] = building_idx;
    if (this.buildings[building_idx]) {
      this.buildings[building_idx].assigned_worker = person_id;
    }
    this.updateUI();
  }

  queueResearch(research_id) {
    const config = RESEARCH_TREE[research_id];
    if (!config || this.research_done[research_id]) return;

    for (const prereq of config.prereqs) {
      if (!this.research_done[prereq]) return;
    }

    const cost = config.cost;
    for (const res in cost) {
      if (this.resources[res] < cost[res]) return;
    }

    for (const res in cost) {
      this.resources[res] -= cost[res];
    }

    this.research_done[research_id] = true;
    this.log.push({ turn: this.turn, text: `Research complete: ${config.name}` });

    if (config.unlock) {
      BUILDINGS[config.unlock].research = null; // Mark as unlocked
    }

    this.updateUI();
  }

    // Stats
    const statsDiv = document.getElementById('stats');
    statsDiv.innerHTML = `
      <div class="stat"><span class="stat-label">Pop:</span> <span class="stat-value">${this.people.length}</span></div>
      <div class="stat"><span class="stat-label">Food:</span> <span class="stat-value">${this.resources.food}/${this.storage_caps.food}</span></div>
      <div class="stat"><span class="stat-label">Water:</span> <span class="stat-value">${this.resources.water}/${this.storage_caps.water}</span></div>
      <div class="stat"><span class="stat-label">Ore:</span> <span class="stat-value">${this.resources.ore}/${this.storage_caps.ore}</span></div>
      <div class="stat"><span class="stat-label">Metal:</span> <span class="stat-value">${this.resources.metal}/${this.storage_caps.metal}</span></div>
      <div class="stat"><span class="stat-label">Power:</span> <span class="stat-value">${this.resources.power}/${this.storage_caps.power}</span></div>
      <div class="stat"><span class="stat-label">Parts:</span> <span class="stat-value">${this.resources.parts}/${this.storage_caps.parts}</span></div>
      <div class="stat"><span class="stat-label">Scrip:</span> <span class="stat-value">${this.resources.scrip}/${this.storage_caps.scrip}</span></div>
    `;

    document.getElementById('turn').textContent = this.turn;

    // Tabs
    const tabsDiv = document.getElementById('tabs');
    if (tabsDiv.children.length === 0) {
      const tabs = ['Map', 'People', 'Research', 'Trade', 'Log', 'Dev'];
      tabs.forEach((tab, i) => {
        const btn = document.createElement('button');
        btn.className = 'tab';
        if (i === 0) btn.classList.add('active');
        btn.textContent = tab;
        btn.onclick = () => this.switchTab(i);
        tabsDiv.appendChild(btn);
      });
    }

    // Map
    const mapGrid = document.getElementById('mapGrid');
    if (mapGrid.children.length === 0) {
      for (let i = 0; i < 64; i++) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.id = `tile-${i}`;
        tile.onclick = () => this.clickTile(i);
        tile.onmouseover = (e) => this.showTileTooltip(i, e);
        tile.onmouseleave = () => this.hideTileTooltip(i);
        mapGrid.appendChild(tile);
      }
    }

    for (let i = 0; i < 64; i++) {
      const tile = document.getElementById(`tile-${i}`);
      const map_tile = this.map[i];
      tile.className = `tile ${map_tile.terrain}`;

      if (this.buildings[i]) {
        const b = this.buildings[i];
        tile.textContent = BUILDINGS[b.key].icon;
        if (b.health < 100) {
          tile.style.opacity = Math.max(0.3, b.health / 100);
        } else {
          tile.style.opacity = 1;
        }
      } else {
        tile.textContent = '';
        tile.style.opacity = 1;
      }
    }

    // People
    const peopleList = document.getElementById('peopleList');
    peopleList.innerHTML = '';
    this.people.forEach(p => {
      const card = document.createElement('div');
      card.className = 'person-card';
      const assigned_building = this.assigned[p.id];
      const building_name = assigned_building !== null ? (this.buildings[assigned_building] ? BUILDINGS[this.buildings[assigned_building].key].name : '?') : 'Rest';

      card.innerHTML = `
        <div style="font-weight: bold;">${p.name}</div>
        <div>Job: ${p.job} | Skill: ${p.skill}/5</div>
        <div style="color: #f9a;">Morale: ${p.morale} | Fatigue: ${p.fatigue}</div>
        <div style="color: #9f9;">Assigned: ${building_name}</div>
        <div class="assign-selector">
          <div class="assign-option ${assigned_building === null ? 'active' : ''}" onclick="game.assignWorker(${p.id}, null)">Rest</div>
          ${Object.keys(this.buildings).filter(idx => this.buildings[idx] && BUILDINGS[this.buildings[idx].key].workers > 0).map(idx =>
            `<div class="assign-option ${assigned_building == idx ? 'active' : ''}" onclick="game.assignWorker(${p.id}, ${idx})">${BUILDINGS[this.buildings[idx].key].icon}</div>`
          ).join('')}
        </div>
      `;
      peopleList.appendChild(card);
    });

    // Research
    const researchTree = document.getElementById('researchTree');
    researchTree.innerHTML = '';
    for (const [key, config] of Object.entries(RESEARCH_TREE)) {
      const node = document.createElement('div');
      const done = this.research_done[key];
      const available = !done && config.prereqs.every(p => this.research_done[p]) &&
        Object.entries(config.cost).every(([res, amt]) => this.resources[res] >= amt);

      node.className = `research-node ${done ? 'done' : available ? 'available' : 'locked'}`;
      node.innerHTML = `
        <div style="font-weight: bold;">${config.name}${done ? ' ✓' : ''}</div>
        <div style="font-size: 10px; color: #999;">Cost: ${Object.entries(config.cost).map(([r, a]) => `${a} ${r}`).join(', ')}</div>
        ${available ? `<button onclick="game.queueResearch('${key}')" style="width: 100%; margin-top: 4px; padding: 4px;">Research</button>` : ''}
      `;
      researchTree.appendChild(node);
    }

    // Trade
    const tradeStatus = document.getElementById('tradeStatus');
    const tradeGrid = document.getElementById('tradeGrid');

    if (this.turn - this.last_caravan < 15) {
      tradeStatus.innerHTML = `<div style="margin-bottom: 8px;">Caravan is here! (${15 - (this.turn - this.last_caravan)} turns remaining)</div>`;
      tradeGrid.innerHTML = '';

      for (const item of ['food', 'water', 'ore', 'metal', 'parts', 'scrip']) {
        if (this.caravan_inventory[item] === undefined) continue;
        const card = document.createElement('div');
        card.className = 'trade-item';
        const price = this.caravan_prices[item] || 1;
        card.innerHTML = `
          <div style="font-weight: bold;">${item}</div>
          <div style="font-size: 10px;">Stock: ${this.caravan_inventory[item]}</div>
          <div style="font-size: 10px; color: #f9a;">Price: ${price} scrip</div>
          <button onclick="game.tradeWith('${item}', true)">Buy</button>
          <button onclick="game.tradeWith('${item}', false)">Sell</button>
        `;
        tradeGrid.appendChild(card);
      }
    } else {
      tradeStatus.innerHTML = `<div>Caravan arrives in ${15 - (this.turn - this.last_caravan)} turns.</div>`;
      tradeGrid.innerHTML = '';
    }

    // Log
    const eventLog = document.getElementById('eventLog');
    eventLog.innerHTML = '';
    const recent = this.log.slice(-20);
    for (const entry of recent) {
      const div = document.createElement('div');
      div.className = 'log-entry';
      div.innerHTML = `<span class="log-turn">T${entry.turn}:</span> <span class="log-text">${entry.text}</span>`;
      eventLog.appendChild(div);
    }
  }

  showTileTooltip(idx, e) {
    const tile = this.map[idx];
    let text = `Terrain: ${tile.terrain}`;

    if (this.buildings[idx]) {
      const b = this.buildings[idx];
      const config = BUILDINGS[b.key];
      text = `${config.name}\nHealth: ${b.health}/100`;

      const adj = this.getAdjacent(idx);
      const has_adj = adj.some(a => this.map[a].terrain === config.adjacency);
      if (config.adjacency && has_adj) {
        text += `\nBonus: +${Math.floor(config.production.length * 30)}% from adjacency`;
      }
    } else {
      // Show buildable options
      const canBuild = Object.keys(BUILDINGS).filter(k => this.canBuild(idx, k));
      if (canBuild.length > 0) {
        text += `\nCan build:\n${canBuild.map(k => `- ${BUILDINGS[k].name}`).join('\n')}`;
      }
    }

    const tooltip = document.createElement('div');
    tooltip.className = 'tooltip';
    tooltip.id = `tooltip-${idx}`;
    tooltip.textContent = text;
    tooltip.style.left = e.clientX + 10 + 'px';
    tooltip.style.top = e.clientY + 10 + 'px';
    document.body.appendChild(tooltip);
  }

  hideTileTooltip(idx) {
    const tooltip = document.getElementById(`tooltip-${idx}`);
    if (tooltip) tooltip.remove();
  }

  switchTab(idx) {
    const tabs = document.querySelectorAll('.tab');
    const panels = document.querySelectorAll('.panel');

    tabs.forEach(t => t.classList.remove('active'));
    panels.forEach(p => p.classList.remove('active'));

    tabs[idx].classList.add('active');
    panels[idx].classList.add('active');
  }

  endGame(won) {
    this.game_over = true;
    this.win = won;

    const score = Math.floor(
      this.people.length * 10 +
      Object.keys(this.research_done).length * 50 +
      (this.resources.food + this.resources.water + this.resources.parts) / 10 +
      this.turn
    );

    const modal = document.getElementById('endGameModal');
    document.getElementById('endGameTitle').textContent = won ? '🎉 YOU WIN!' : '💀 GAME OVER';
    document.getElementById('endGameText').textContent = `
${won ? 'You successfully kept the outpost alive!' : 'Your outpost has fallen.'}

Final Stats:
Population: ${this.people.length}
Turns Survived: ${this.turn}
Research Completed: ${Object.keys(this.research_done).length}
Food: ${this.resources.food}
Water: ${this.resources.water}
Parts: ${this.resources.parts}

FINAL SCORE: ${score}
    `.trim();

    modal.classList.add('active');
  }

  devRunTests() {
    const output = document.getElementById('testOutput');
    let passed = 0;
    let total = 0;

    const tests = [
      () => {
        total++;
        for (const res in this.resources) {
          if (this.resources[res] < 0) return false;
        }
        passed++;
        return true;
      },
      () => {
        total++;
        for (const res in this.resources) {
          if (this.resources[res] > this.storage_caps[res]) return false;
        }
        passed++;
        return true;
      },
      () => {
        total++;
        let count = 0;
        for (let i = 0; i < this.people.length; i++) {
          if (this.assigned[i] !== null && this.assigned[i] !== undefined) count++;
        }
        if (count <= this.people.length) {
          passed++;
          return true;
        }
        return false;
      },
      () => {
        total++;
        for (const id in this.research_done) {
          if (RESEARCH_TREE[id] && RESEARCH_TREE[id].prereqs.some(p => !this.research_done[p])) {
            return false;
          }
        }
        passed++;
        return true;
      },
      () => {
        total++;
        const state = JSON.stringify(this.serializeState());
        const loaded = JSON.parse(state);
        const hash1 = this.hashState(loaded);
        const hash2 = this.hashState(this.serializeState());
        if (hash1 === hash2) {
          passed++;
          return true;
        }
        return false;
      },
      () => {
        total++;
        if (this.people.length === 0 || this.people.every(p => p.morale >= 0)) {
          passed++;
          return true;
        }
        return false;
      },
      () => {
        total++;
        for (let i = 0; i < this.map.length; i++) {
          if (this.buildings[i] && this.buildings[i].health > 100) return false;
        }
        passed++;
        return true;
      },
      () => {
        total++;
        for (const p of this.people) {
          if (p.skill < 1 || p.skill > 5) return false;
        }
        passed++;
        return true;
      },
      () => {
        total++;
        for (const p of this.people) {
          if (p.fatigue < 0 || p.fatigue > 100) return false;
        }
        passed++;
        return true;
      },
      () => {
        total++;
        let working = 0;
        for (const id in this.assigned) {
          if (this.assigned[id] !== null) working++;
        }
        if (working <= this.people.length) {
          passed++;
          return true;
        }
        return false;
      },
      () => {
        total++;
        for (let i = 0; i < this.map.length; i++) {
          if (this.buildings[i]) {
            const b = this.buildings[i];
            if (b.health < 0 || b.health > 100) return false;
          }
        }
        passed++;
        return true;
      },
      () => {
        total++;
        if (this.resources.scrip >= 0 && this.resources.scrip <= this.storage_caps.scrip) {
          passed++;
          return true;
        }
        return false;
      },
      () => {
        total++;
        if (this.people.length >= 0) {
          passed++;
          return true;
        }
        return false;
      },
      () => {
        total++;
        if (this.turn >= 0) {
          passed++;
          return true;
        }
        return false;
      },
      () => {
        total++;
        for (const res in this.caravan_prices) {
          if (this.caravan_prices[res] < 1) return false;
        }
        passed++;
        return true;
      }
    ];

    tests.forEach(test => test());

    output.innerHTML = `<div>Tests Passed: ${passed}/${total}</div>`;
    for (let i = 0; i < tests.length; i++) {
      const status = i < passed ? '✓' : '✗';
      output.innerHTML += `<div>${status} Test ${i + 1}</div>`;
    }
  }

  devBenchmark() {
    const output = document.getElementById('benchOutput');
    const savedTurn = this.turn;
    const savedState = JSON.stringify(this.serializeState());

    const sim = new Game();
    sim.seed = this.seed;
    sim.rng = new SeededRandom(sim.seed);
    sim.newGame();

    for (let i = 0; i < 200; i++) {
      if (!sim.game_over) sim.endTurn();
    }

    const finalHash = this.hashState(sim.serializeState());
    const stats = `
Final Turn: ${sim.turn}
Final Population: ${sim.people.length}
Total Scrip Generated: ${sim.resources.scrip}
State Hash: ${finalHash}
    `.trim();

    output.innerHTML = `<div>${stats}</div>`;
  }

  serializeState() {
    return {
      turn: this.turn,
      seed: this.seed,
      resources: { ...this.resources },
      people: this.people.map(p => ({ ...p })),
      buildings: { ...this.buildings },
      research_done: { ...this.research_done }
    };
  }

  hashState(state) {
    let hash = 0;
    const str = JSON.stringify(state);
    for (let i = 0; i < str.length; i++) {
      hash = ((hash << 5) - hash) + str.charCodeAt(i);
      hash |= 0;
    }
    return hash.toString(16);
  }
}

// ============ INIT ============
let game = new Game();

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    game.endTurn();
  } else if (e.code === 'Digit1') {
    game.switchTab(0);
  } else if (e.code === 'Digit2') {
    game.switchTab(1);
  } else if (e.code === 'Digit3') {
    game.switchTab(2);
  } else if (e.code === 'Digit4') {
    game.switchTab(3);
  } else if (e.code === 'Digit5') {
    game.switchTab(4);
  }
});
</script>
