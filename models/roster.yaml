# The model roster for this course.
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH FOR MODELS.
#
# No module prose may hardcode a model name, tag, or size. Tables in the modules
# are generated from this file by scripts/render-roster.py and live between
# <!-- BEGIN GENERATED: ... --> / <!-- END GENERATED: ... --> markers.
#
# To refresh this file against upstream, run /update-models (see
# .claude/commands/update-models.md). Bump `last_verified` when you do.
#
# ---------------------------------------------------------------------------
# HOW MODELS EARN A SLOT
#
# This is a ladder, not a leaderboard. We are not looking for the best small
# models. We are looking for a spread of capability wide enough that you can
# SEE the difference between rungs. Rung 0 exists to fail. Rung 3 exists so
# that "a working agent" is actually reachable. The gap between them is the
# curriculum.
#
# Selection criteria, in priority order:
#   1. Non-Chinese vendor (see docs/decisions/0002-non-chinese-roster.md)
#   2. Runs in <= ~10 GB RAM at Q4-class quantization
#   3. Fills a distinct rung nothing else fills
#   4. Permissive license preferred (Apache-2.0 / MIT), but not required
# ---------------------------------------------------------------------------

schema_version: 1

# Bump when the roster is checked against upstream as a whole.
roster_last_verified: "2026-07-29"

# Where the numbers come from. Anything not measured on YOUR machine is an
# estimate, and this file says so explicitly rather than implying precision.
provenance:
  sizes: >-
    disk_gb and min_ram_gb are ESTIMATES derived from vendor model cards and
    typical Q4_K_M quantization ratios. They have NOT been measured. Run
    scripts/bench.py on your own machine and record the real numbers in the
    module's FIELD-NOTES.md.
  tags: >-
    ollama_tag values follow Ollama's documented naming convention but were NOT
    confirmed against the live registry when this file was written, because the
    authoring environment could not reach ollama.com. Run /update-models from a
    machine with network access to confirm and correct them. Entries carry
    `tag_verified: false` until someone does.

# Budget assumptions for the whole course. Referenced by scripts/check-env.sh.
budget:
  total_ram_gb: 16
  # What is actually free after OS + editor + a browser. This is the number
  # that matters, and it is why only one model is resident at a time.
  usable_ram_gb: 10
  disk_gb: 20

models:
  - id: granite-nano
    rung: 0
    role: control
    display_name: "IBM Granite 4.0 Nano"
    vendor: IBM
    vendor_country: US
    ollama_tag: "granite4:350m"
    tag_verified: false
    params: "350M"
    quant: Q4_K_M
    disk_gb: 0.3
    min_ram_gb: 1.0
    license: Apache-2.0
    native_tool_calling: weak
    why: >-
      The control variable. Small enough to load instantly and dumb enough to
      fail on almost every non-trivial task, which is exactly what makes it
      useful: when your prompt or eval is wrong, this model shows you
      immediately and cheaply. Do not expect it to complete agent tasks.
    source: "https://huggingface.co/blog/ibm-granite/granite-4-nano"

  - id: gemma-e2b
    rung: 1
    role: small
    display_name: "Google Gemma 4 E2B"
    vendor: Google
    vendor_country: US
    ollama_tag: "gemma4:e2b"
    tag_verified: false
    params: "~2B effective"
    quant: Q4_K_M
    disk_gb: 1.6
    min_ram_gb: 3.0
    license: Gemma Terms of Use
    native_tool_calling: partial
    why: >-
      Google's edge-targeted tier. Earns its slot twice over: it is a genuine
      step up from rung 0, and its bespoke license gives you something concrete
      to compare against the Apache-2.0 entries when licensing comes up.
    source: "https://blog.google/innovation-and-ai/technology/developers-tools/gemma-4/"

  - id: phi4-mini
    rung: 2
    role: mid
    display_name: "Microsoft Phi-4-mini"
    vendor: Microsoft
    vendor_country: US
    ollama_tag: "phi4-mini"
    tag_verified: false
    params: "3.8B"
    quant: Q4_K_M
    disk_gb: 2.5
    min_ram_gb: 4.5
    license: MIT
    native_tool_calling: native
    why: >-
      Function calling was an explicit design goal for this model rather than an
      afterthought, which makes it the cheapest place to watch tool calling
      start working. Punches above its size on instruction following.
    source: "https://huggingface.co/microsoft/Phi-4-mini-instruct"

  - id: granite-3b
    rung: 2
    role: mid
    display_name: "IBM Granite 4.1 3B"
    vendor: IBM
    vendor_country: US
    ollama_tag: "granite4.1:3b"
    tag_verified: false
    params: "3B"
    quant: Q4_K_M
    disk_gb: 2.0
    min_ram_gb: 4.0
    license: Apache-2.0
    native_tool_calling: native
    why: >-
      Same family and same post-training pipeline as the 8B, so comparing the
      two isolates the effect of SIZE with everything else held constant. That
      is a controlled experiment you cannot run across vendors.
    source: "https://research.ibm.com/blog/granite-4-1-ai-foundation-models"

  - id: granite-8b
    rung: 3
    role: baseline
    display_name: "IBM Granite 4.1 8B"
    vendor: IBM
    vendor_country: US
    ollama_tag: "granite4.1:8b"
    tag_verified: false
    params: "8B"
    quant: Q4_K_M
    disk_gb: 4.9
    min_ram_gb: 8.0
    license: Apache-2.0
    native_tool_calling: strong
    why: >-
      The "it actually works" baseline. When an exercise is supposed to succeed
      and you need to know whether the problem is your code or the model, this
      is the model you reach for. IBM specifically called out improved tool
      calling in the 4.1 post-training pipeline.
    source: "https://research.ibm.com/blog/granite-4-1-ai-foundation-models"

  - id: gpt-oss-20b
    rung: stretch
    role: stretch
    display_name: "OpenAI gpt-oss-20b"
    vendor: OpenAI
    vendor_country: US
    ollama_tag: "gpt-oss:20b"
    tag_verified: false
    params: "21B total / 3.6B active (MoE)"
    quant: MXFP4
    disk_gb: 12.0
    min_ram_gb: 16.0
    license: Apache-2.0
    native_tool_calling: strong
    optional: true
    why: >-
      OPTIONAL, AND IT MAY NOT FIT ON YOUR MACHINE. OpenAI states it runs in
      16 GB, but that is your entire budget, so expect it to be marginal at
      best next to a desktop session. It is here for one lesson: a
      mixture-of-experts model has the MEMORY footprint of 21B and roughly the
      SPEED of 3.6B. Speed and memory are separate axes. Skip it without guilt.
    source: "https://openai.com/index/introducing-gpt-oss/"

# Models deliberately considered and not included, with reasons. Kept so the
# same debates are not re-litigated every time the roster is refreshed.
excluded:
  - pattern: "Qwen, DeepSeek, GLM, Yi, InternLM, Kimi, MiniMax, Baichuan"
    reason: >-
      Non-Chinese-vendor constraint. This is a stated preference of the repo
      owner, not a technical judgement -- several of these are excellent at
      these sizes. See docs/decisions/0002-non-chinese-roster.md.
  - pattern: "Llama 3.2 1B / 3B"
    reason: >-
      Fine models and a reasonable swap-in for rung 0 or 2, but not
      load-bearing here. At the time of writing, authoritative sources still
      resolved Meta's small lineup to 3.2, and the roster already has better
      tool-calling coverage at those sizes. Revisit on the next refresh.
  - pattern: "Anything above ~8B dense"
    reason: >-
      Does not leave enough headroom under the 10 GB usable budget once KV
      cache and a desktop session are accounted for.
