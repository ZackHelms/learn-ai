<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASHFALL OUTPOST</title>
<style>
:root{
  --bg:#14100e; --bg2:#1d1815; --bg3:#272019; --line:#4a3d31; --line2:#6b5844;
  --ink:#efe4d4; --ink2:#bda98f; --ink3:#8b7a66;
  --hot:#e8823c; --hot2:#ffb066; --good:#7fc98a; --bad:#e8615c; --warn:#e5c04a; --cool:#78b6d6;
  --tap:#3a2f26;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace;font-size:14px;line-height:1.4}
body{padding-bottom:64px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:.06em}
button{font:inherit;color:var(--ink);background:var(--bg3);border:1px solid var(--line2);
  border-radius:3px;padding:5px 9px;cursor:pointer}
button:hover:not(:disabled){background:var(--tap);border-color:var(--hot)}
button:disabled{opacity:.42;cursor:not-allowed}
button.pri{background:#6b3a17;border-color:var(--hot);color:#fff2e2;font-weight:700}
button.pri:hover:not(:disabled){background:#8a4a1c}
input,textarea,select{font:inherit;background:#0e0b09;color:var(--ink);
  border:1px solid var(--line2);border-radius:3px;padding:4px 6px}
textarea{width:100%;min-height:110px;font-size:11px;line-height:1.35;resize:vertical}
.wrap{max-width:1180px;margin:0 auto;padding:8px}

/* ---- header ---- */
header{border-bottom:2px solid var(--line);background:linear-gradient(#241d17,#191411);
  position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:17px;color:var(--hot2)}
.brand .sub{color:var(--ink3);font-size:11px}
.turnbox{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{border:1px solid var(--line2);border-radius:3px;padding:2px 7px;background:#0f0c0a;font-size:12px}

/* ---- resource strip ---- */
.res{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:3px;
  padding:2px 7px;background:#0f0c0a;font-size:12px;cursor:help;white-space:nowrap}
.chip .k{color:var(--ink3);text-transform:uppercase;font-size:10px;letter-spacing:.08em}
.chip .v{font-weight:700}
.chip .d{font-size:10px;min-width:26px;text-align:right}
.chip.full{border-color:var(--warn)}
.chip.low{border-color:var(--bad)}
.up{color:var(--good)} .dn{color:var(--bad)} .flat{color:var(--ink3)}

/* ---- tabs ---- */
nav.tabs{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px}
nav.tabs button{border-bottom-left-radius:0;border-bottom-right-radius:0;padding:5px 11px;font-size:12px}
nav.tabs button[aria-selected="true"]{background:var(--tap);border-color:var(--hot);color:var(--hot2);font-weight:700}
nav.tabs button .kb{color:var(--ink3);font-size:10px}

/* ---- panels ---- */
.panel{display:none} .panel.on{display:block}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media(min-width:820px){.cols{grid-template-columns:minmax(0,1fr) 330px}}
.card{border:1px solid var(--line);border-radius:4px;background:var(--bg2);padding:9px;margin-bottom:9px;
  overflow-x:auto}   /* wide tables (Trade) scroll sideways at 360px instead of clipping */
.card h3{font-size:12px;color:var(--hot2);text-transform:uppercase;margin-bottom:6px;letter-spacing:.1em}
.muted{color:var(--ink3)} .small{font-size:11px} .mono{font-variant-numeric:tabular-nums}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sep{height:1px;background:var(--line);margin:7px 0}

/* ---- map ---- */
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;max-width:560px}
.tile{position:relative;aspect-ratio:1/1;border:1px solid var(--line);border-radius:3px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
  background:var(--bg3);padding:0;overflow:hidden;min-width:0}
.tile:hover{border-color:var(--hot)}
.tile.sel{border-color:var(--hot2);box-shadow:inset 0 0 0 1px var(--hot2)}
.t-ash{background:#3b322a} .t-rock{background:#4a4740} .t-water{background:#22414d}
.t-vent{background:#5a2f22} .t-ruins{background:#43384a}
.tile .ic{font-size:17px;line-height:1}
.tile .tn{font-size:8px;color:var(--ink2);letter-spacing:.04em}
.tile .terr{position:absolute;top:1px;left:2px;font-size:8px;color:#cbb79b;opacity:.85}
.tile .bad{position:absolute;bottom:1px;right:2px;font-size:8px;font-weight:700;color:#ffd7d4;
  background:#7a1f1c;border-radius:2px;padding:0 2px}
.tile .wk{position:absolute;top:1px;right:2px;font-size:8px;color:#dfe9c9}
.tile.off{outline:2px dashed var(--bad);outline-offset:-3px}
.legend{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;font-size:10px}
.legend span{border:1px solid var(--line);border-radius:2px;padding:1px 5px}

/* ---- lists ---- */
.list{display:flex;flex-direction:column;gap:5px}
.item{border:1px solid var(--line);border-radius:3px;background:#100d0b;padding:6px 7px}
.item .hd{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.item .nm{font-weight:700}
.tag{font-size:10px;border:1px solid var(--line2);border-radius:2px;padding:0 4px;color:var(--ink2);white-space:nowrap}
.tag.ok{border-color:var(--good);color:var(--good)}
.tag.no{border-color:var(--bad);color:var(--bad)}
.tag.wn{border-color:var(--warn);color:var(--warn)}
.tag.hl{border-color:var(--hot);color:var(--hot2)}
.bar{height:6px;background:#0a0806;border:1px solid var(--line);border-radius:2px;overflow:hidden;min-width:54px;flex:1}
.bar i{display:block;height:100%}
.bar.mor i{background:var(--good)} .bar.fat i{background:var(--warn)} .bar.int i{background:var(--cool)}
.bar.lo i{background:var(--bad)}

/* ---- research ---- */
.tree{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:7px}
.node{border:1px solid var(--line);border-radius:3px;padding:7px;background:#100d0b}
.node.avail{border-color:var(--hot)} .node.done{border-color:var(--good);background:#0e150e}
.node.lock{opacity:.62}

/* ---- log ---- */
.logbox{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:3px;background:#0c0a08;padding:6px}
.le{display:flex;gap:7px;padding:2px 0;border-bottom:1px dotted #2b241d;font-size:12px}
.le .tn{color:var(--ink3);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.le.k-bad .tx{color:#ffb3b0} .le.k-good .tx{color:#b6e8bd} .le.k-warn .tx{color:#f0dd9a}
.le.k-sys .tx{color:var(--ink3)} .le.k-evt .tx{color:#d8c0ff}

/* ---- footer ---- */
footer{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(#191411,#241d17);
  border-top:2px solid var(--line);z-index:45}
footer .wrap{padding:7px 8px;display:flex;gap:8px;align-items:center}
footer .status{font-size:11px;color:var(--ink2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- modal ---- */
.scrim{position:fixed;inset:0;background:rgba(8,6,5,.86);display:flex;align-items:center;
  justify-content:center;padding:12px;z-index:60}
.scrim[hidden]{display:none}
.modal{max-width:560px;width:100%;max-height:88vh;overflow:auto;border:2px solid var(--hot);
  border-radius:5px;background:var(--bg2);padding:12px}
.modal h2{font-size:14px;color:var(--hot2);margin-bottom:6px}
.choice{width:100%;text-align:left;margin-top:7px;padding:8px;white-space:normal}

/* ---- tooltip ---- */
#tip{position:fixed;z-index:90;max-width:320px;background:#0b0908;border:1px solid var(--hot);
  border-radius:4px;padding:7px 9px;font-size:11.5px;line-height:1.45;pointer-events:none;
  box-shadow:0 6px 22px rgba(0,0,0,.6);white-space:pre-wrap}
#tip[hidden]{display:none}
#tip b{color:var(--hot2)}
[data-tip]{cursor:help}
.ok{color:var(--good)} .no{color:var(--bad)} .wn{color:var(--warn)} .hl{color:var(--hot2)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{text-align:left;padding:3px 5px;border-bottom:1px solid #2b241d}
th{color:var(--ink3);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
pre{white-space:pre-wrap;word-break:break-word;font-size:11px;background:#0c0a08;
  border:1px solid var(--line);border-radius:3px;padding:7px;max-height:46vh;overflow:auto;margin:0}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <h1>ASHFALL OUTPOST</h1>
      <span class="sub">survivor management &mdash; turn-based</span>
      <div class="turnbox">
        <span class="pill" id="hTurn">Turn 1 / 60</span>
        <span class="pill" id="hPop" data-tip="">Pop 0</span>
        <span class="pill" id="hStorm" data-tip="">Storm in ?</span>
      </div>
    </div>
    <div class="res" id="resStrip"></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>

<main class="wrap">
  <section class="panel" id="p-map" role="tabpanel"></section>
  <section class="panel" id="p-people" role="tabpanel"></section>
  <section class="panel" id="p-research" role="tabpanel"></section>
  <section class="panel" id="p-trade" role="tabpanel"></section>
  <section class="panel" id="p-log" role="tabpanel"></section>
  <section class="panel" id="p-dev" role="tabpanel"></section>
</main>

<footer><div class="wrap">
  <button class="pri" id="btnEnd">End Turn <span class="muted">[Space]</span></button>
  <span class="status" id="statusLine">&nbsp;</span>
</div></footer>

<div class="scrim" id="scrim" hidden><div class="modal" id="modal"></div></div>
<div id="tip" hidden></div>

<script>
/* ===========================================================================
   ASHFALL OUTPOST — single-file turn-based survival management game.

   ASSUMPTIONS MADE (no clarifying questions were asked):
   - "Turn" = one week of outpost time. Win check happens at end of turn 60.
   - Ash is an ambient resource: it falls from the sky every turn (rate scales
     with how many Ash Flat tiles the map has) rather than being mined. The
     stated chain ash -> soil -> food is therefore Kiln (ash->soil) then
     Greenhouse (soil+water->food).
   - Power is storable but only in a small buffer (cap 60); surplus beyond the
     cap is lost and logged like any other overflow.
   - Adjacency for building bonuses = the 4 orthogonal neighbours. Windbreak
     storm shielding uses the 8 surrounding tiles (Chebyshev distance 1).
   - A building produces nothing with zero workers (except Shelter, Windbreak
     and Depot, which are passive infrastructure).
   - Colonists below 20 morale refuse to work (output 0) but stay; they only
     leave after two consecutive turns at exactly 0 morale. Losing everyone is
     the only loss condition, so every setback is recoverable.
   - Research completes instantly when purchased (cost is scrip + parts).
   - Buildings are never destroyed, only damaged; damage below 35% integrity
     disables output until repaired. Repair costs parts and one idle colonist.
   - "Critical needs met" for the win = food and water stock each at least the
     population, no starvation in the last 3 turns, average morale >= 50.
   - Trade: caravan visits periodically and stays 2 turns; it has finite goods
     and finite scrip, so you cannot dump unlimited stock on it.
   - Score is computed from population, research, stockpiles and turns; shown
     on the end screen for both wins and losses.
   - No persistence of any kind: state lives in memory only. Save/Load is a
     copy-paste JSON textarea, per the brief.

   TURN RESOLUTION ORDER (fixed; also shown in the Log tab):
     1  advance turn counter
     2  ashfall accumulation
     3  ashstorm check -> building damage + water-demand spike
     4  power generation (Vent Tap, Geothermal Plant)
     5  extraction (Condenser, Ore Mine, Salvage Yard, Market)
     6  refining (Ash Kiln, Forge, Workshop) — power is drawn here
     7  agriculture (Greenhouse)
     8  storage caps applied, overflow logged
     9  colonist consumption (food + water, storm multiplier applies)
    10  morale and fatigue update
    11  skill growth from work performed
    12  departures (two consecutive turns at zero morale)
    13  newcomers (needs housing, surplus and morale)
    14  caravan arrival/departure + market price drift
    15  event deck roll
    16  win / loss evaluation
   =========================================================================== */
(function(){
'use strict';

/* ============================ 1. CONSTANTS =============================== */

var VERSION = 3;
var MAPW = 8, MAPH = 8, MAPN = 64;
var WIN_TURN = 60, WIN_POP = 12;

var GOODS = ['food','water','metal','power','parts','scrip','ore','soil','ash'];
var GOOD_LABEL = {food:'Food',water:'Water',metal:'Metal',power:'Power',parts:'Parts',
  scrip:'Scrip',ore:'Ore',soil:'Soil',ash:'Ash'};
var BASE_CAP = {food:180,water:180,metal:140,power:60,parts:90,scrip:99999,ore:120,soil:120,ash:160};
var TRADE_GOODS = ['food','water','metal','parts','ore','soil','ash'];
var BASE_PRICE = {food:3,water:3,metal:4,parts:9,ore:2,soil:2,ash:1};

var TERR = {
  ash:  {n:'Ash Flat', ab:'ASH', d:'Deep drifts of volcanic ash. Nothing grows unaided.'},
  rock: {n:'Rock',     ab:'RCK', d:'Exposed basalt. Solid footing for heavy industry.'},
  water:{n:'Water',    ab:'WTR', d:'A murky meltwater pool. Cannot be built on.'},
  vent: {n:'Vent',     ab:'VNT', d:'A hissing geothermal vent. Heat and danger.'},
  ruins:{n:'Ruins',    ab:'RUI', d:'The old town, half-buried. Salvage and shelter.'}
};

var JOBS = {
  grow: {n:'Grower',     d:'Kilns and greenhouses.'},
  tech: {n:'Technician', d:'Condensers, power, infirmary, market.'},
  smith:{n:'Smith',      d:'Forges and workshops.'},
  scav: {n:'Scavenger',  d:'Ore mines and salvage yards.'}
};
var JOB_IDS = ['grow','tech','smith','scav'];

/* Buildings. out/conv rates are per unit of worker efficiency (see workerEff).
   adjT = terrain adjacency bonus added to the base rate before efficiency.
   adjB = building adjacency bonus. req = research id required to unlock.     */
var BLD = {
  shelter:{n:'Shelter',ic:'⌂',cost:{metal:6,parts:2},terr:['ash','rock','ruins'],job:null,cap:0,
    house:3,d:'Housing for 3 colonists. Population can never exceed total housing.'},
  condenser:{n:'Condenser',ic:'≈',cost:{metal:8,parts:3},terr:['ash','rock','ruins'],job:'tech',cap:2,
    out:{water:3.4},adjT:{t:'water',per:1.3,max:2,res:'water'},
    d:'Wrings drinkable water out of ash-heavy air.'},
  kiln:{n:'Ash Kiln',ic:'▲',cost:{metal:6,parts:2},terr:['ash','rock'],job:'grow',cap:2,
    conv:{out:{soil:3.6},per:{ash:1.1}},adjT:{t:'vent',per:0.5,max:2,res:'soil'},
    d:'Bakes raw ash into soil that will hold a root.'},
  green:{n:'Greenhouse',ic:'✿',cost:{metal:10,parts:4},terr:['ash','ruins'],job:'grow',cap:3,
    conv:{out:{food:3.8},per:{soil:0.45,water:0.55}},
    adjB:{b:'condenser',waterMul:0.75,label:'Adjacent Condenser: water cost −25%'},
    d:'Grows food under glass from soil and water.'},
  mine:{n:'Ore Mine',ic:'◆',cost:{metal:5,parts:2},terr:['rock','ruins'],job:'scav',cap:2,
    out:{ore:2.4},adjT:{t:'rock',per:0.5,max:3,res:'ore'},
    d:'Digs ore from the buried bedrock.'},
  forge:{n:'Forge',ic:'⚒',cost:{metal:9,parts:4},terr:['rock','ruins'],job:'smith',cap:2,
    conv:{out:{metal:1.6},per:{ore:1.5,power:1.2}},adjT:{t:'vent',per:0.35,max:2,res:'metal'},
    ventCheap:true,d:'Smelts ore into metal. Vent heat cuts the power draw.'},
  works:{n:'Workshop',ic:'⚙',cost:{metal:12,parts:3},terr:['rock','ruins','ash'],job:'smith',cap:2,
    conv:{out:{parts:1.0},per:{metal:1.6,power:0.8}},
    adjB:{b:'forge',outMul:1.25,label:'Adjacent Forge: +25% parts'},
    d:'Machines metal stock into spare parts.'},
  gen:{n:'Vent Tap',ic:'⚡',cost:{metal:8,parts:3},terr:['vent'],job:'tech',cap:2,
    out:{power:3.2},adjT:{t:'vent',per:1.0,max:2,res:'power'},
    d:'Bleeds geothermal heat into a turbine.'},
  salv:{n:'Salvage Yard',ic:'♻',cost:{metal:4,parts:1},terr:['ruins'],job:'scav',cap:2,
    out:{parts:0.6,scrip:1.8,metal:1.0},
    d:'Strips the dead town for parts, metal and tradeable scrip. The only metal source before a Forge runs.'},
  wind:{n:'Windbreak',ic:'≡',cost:{metal:7,parts:2},terr:['ash','rock','ruins','vent'],job:null,cap:0,
    d:'Passive baffle. Cuts ashstorm damage by 45% for every building within 1 tile (including itself).'},
  depot:{n:'Depot',ic:'▣',cost:{metal:10,parts:3},terr:['ash','rock','ruins'],job:null,cap:0,
    d:'Passive. Adds +80 storage capacity to every stored good.'},
  plant:{n:'Geothermal Plant',ic:'✵',cost:{metal:18,parts:8},terr:['vent'],job:'tech',cap:3,req:'venttap',
    out:{power:6.0},adjT:{t:'vent',per:1.5,max:2,res:'power'},
    d:'A deep borehole. Heavy, reliable power.'},
  market:{n:'Market',ic:'$',cost:{metal:12,parts:5},terr:['ash','ruins','rock'],job:'tech',cap:2,req:'compact',
    out:{scrip:2.2},d:'Trade hub. Earns scrip every turn and improves caravan prices by 8%.'},
  infirm:{n:'Infirmary',ic:'✚',cost:{metal:14,parts:6},terr:['ash','rock','ruins'],job:'tech',cap:2,req:'medbay',
    d:'Staffed clinic. Halves fatigue gain outpost-wide and adds +3 morale per turn per staffed Infirmary.'}
};
var BLD_IDS = Object.keys(BLD);

/* Research tree: 12 nodes, prerequisites, scrip + parts costs. */
var RES_TREE = {
  sift:      {n:'Ash Sifting',      pre:[],                  cost:{scrip:25,parts:4},
              d:'Ash Kilns produce +30% soil.'},
  hydro:     {n:'Hydro Mesh',       pre:[],                  cost:{scrip:30,parts:5},
              d:'Condensers produce +30% water.'},
  shutters:  {n:'Storm Shutters',   pre:[],                  cost:{scrip:28,parts:6},
              d:'Ashstorm damage −25%.'},
  compact:   {n:'Trade Compact',    pre:[],                  cost:{scrip:40,parts:5},
              d:'Caravan margins narrow to 5%, caravan stock +50%. Unlocks the Market.'},
  venttap:   {n:'Vent Tapping',     pre:['hydro'],           cost:{scrip:35,parts:6},
              d:'Vent Taps +25% power. Unlocks the Geothermal Plant.'},
  hydroponics:{n:'Hydroponics',     pre:['hydro'],           cost:{scrip:45,parts:8},
              d:'Greenhouse water cost −30%.'},
  furnace:   {n:'Blast Furnace',    pre:['venttap'],         cost:{scrip:50,parts:10},
              d:'Forges +30% metal and −15% ore per metal.'},
  bunkers:   {n:'Deep Bunkers',     pre:['shutters'],        cost:{scrip:60,parts:12},
              d:'Ashstorm damage −25% more, and the storm water spike drops from ×2.2 to ×1.5.'},
  cultures:  {n:'Soil Cultures',    pre:['sift','hydroponics'],cost:{scrip:70,parts:14},
              d:'Greenhouses produce +40% food.'},
  tools:     {n:'Precision Tools',  pre:['furnace'],         cost:{scrip:65,parts:12},
              d:'Workshops produce +50% parts.'},
  silo:      {n:'Silo Engineering', pre:['tools'],           cost:{scrip:75,parts:16},
              d:'All storage caps +40%.'},
  medbay:    {n:'Med Bay',          pre:['bunkers'],         cost:{scrip:80,parts:18},
              d:'Resting recovers 50% more fatigue. Unlocks the Infirmary.'}
};
var RES_IDS = Object.keys(RES_TREE);

var FIRST = ['Mira','Tobin','Asha','Yusuf','Petra','Kwan','Dima','Nell','Ozan','Rue','Sable','Ines',
 'Garen','Hollis','Vex','Juno','Basil','Corin','Wren','Tamsin','Odil','Fenn','Lark','Sten'];
var LAST = ['Vance','Okoro','Brandt','Idris','Kell','Marsh','Nakai','Oduya','Pyne','Rask','Solt',
 'Tarn','Ubell','Vosk','Wier','Zhu'];

/* ====================== 2. PRNG / SMALL UTILITIES ======================== */

/* mulberry32, state lives on the game object so save/load is bit-exact.
   Math.random is never used anywhere in this file. */
function rnd(st){
  st.rng = (st.rng + 0x6D2B79F5) >>> 0;
  var t = st.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function ri(st,a,b){ return a + Math.floor(rnd(st)*(b-a+1)); }
function pick(st,arr){ return arr[Math.floor(rnd(st)*arr.length)]; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function r2(v){ return Math.round(v*100)/100; }
function r3(v){ return Math.round(v*1000)/1000; }
function sum(a){ var s=0; for(var i=0;i<a.length;i++) s+=a[i]; return s; }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmt(v){ return (Math.round(v*10)/10).toString(); }
function sgn(v){ return (v>0?'+':'')+fmt(v); }

/* Canonical JSON (sorted keys) + FNV-1a: used for the state hash. */
function canon(v){
  if(v===null||typeof v!=='object') return JSON.stringify(v===undefined?null:v);
  if(Array.isArray(v)){ var o=[]; for(var i=0;i<v.length;i++) o.push(canon(v[i])); return '['+o.join(',')+']'; }
  var ks=Object.keys(v).sort(), p=[];
  for(var j=0;j<ks.length;j++) p.push(JSON.stringify(ks[j])+':'+canon(v[ks[j]]));
  return '{'+p.join(',')+'}';
}
function fnv(s){
  var h=0x811c9dc5>>>0;
  for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; }
  return ('0000000'+h.toString(16)).slice(-8);
}
function stateHash(st){ return fnv(canon(st)); }

function xy(i){ return {x:i%MAPW, y:Math.floor(i/MAPW)}; }
function idx(x,y){ return y*MAPW+x; }
function inMap(x,y){ return x>=0&&y>=0&&x<MAPW&&y<MAPH; }
function orth(i){                       /* 4 orthogonal neighbours */
  var p=xy(i), o=[], d=[[1,0],[-1,0],[0,1],[0,-1]];
  for(var k=0;k<4;k++){ var nx=p.x+d[k][0], ny=p.y+d[k][1]; if(inMap(nx,ny)) o.push(idx(nx,ny)); }
  return o;
}
function ring8(i){                      /* 8 surrounding tiles */
  var p=xy(i), o=[];
  for(var dy=-1;dy<=1;dy++) for(var dx=-1;dx<=1;dx++){
    if(dx===0&&dy===0) continue;
    if(inMap(p.x+dx,p.y+dy)) o.push(idx(p.x+dx,p.y+dy));
  }
  return o;
}

function log(st,msg,kind){
  st.log.push({t:st.turn, m:msg, k:kind||'sys'});
  if(st.log.length>400) st.log.splice(0, st.log.length-400);
}

/* ========================= 3. MAP GENERATION ============================= */

function genMap(st){
  var t=[], i;
  for(i=0;i<MAPN;i++){
    var r=rnd(st);
    t.push(r<0.46?'ash': r<0.72?'rock': r<0.84?'water': r<0.93?'vent':'ruins');
  }
  /* two smoothing passes turn the noise into believable blobs */
  for(var pass=0; pass<2; pass++){
    var nt=t.slice();
    for(i=0;i<MAPN;i++){
      if(rnd(st)<0.58){
        var nb=orth(i), tally={}, best=t[i], bc=0;
        for(var k=0;k<nb.length;k++){ var q=t[nb[k]]; tally[q]=(tally[q]||0)+1; }
        for(var key in tally){ if(tally[key]>bc){ bc=tally[key]; best=key; } }
        nt[i]=best;
      }
    }
    t=nt;
  }
  /* guarantee the map is playable: minimum counts of each terrain */
  var need={water:2,vent:2,ruins:3,rock:8,ash:14};
  for(var terr in need){
    var have=0;
    for(i=0;i<MAPN;i++) if(t[i]===terr) have++;
    var guard=0;
    while(have<need[terr] && guard++<400){
      var j=ri(st,0,MAPN-1);
      if(t[j]===terr) continue;
      /* never cannibalise a terrain that is already at its own minimum */
      var cnt=0; for(i=0;i<MAPN;i++) if(t[i]===t[j]) cnt++;
      if(cnt<=(need[t[j]]||0)) continue;
      t[j]=terr; have++;
    }
  }
  var map=[];
  for(i=0;i<MAPN;i++) map.push({t:t[i], b:null, hp:100, w:[]});
  return map;
}

/* ========================= 4. STATE CREATION ============================= */

function makeColonist(st,job){
  return {
    id: st.nextId++,
    name: pick(st,FIRST)+' '+pick(st,LAST),
    job: job,
    skill: ri(st,1,3),
    xp: 0,
    fat: ri(st,0,15),
    mor: ri(st,58,75),
    at: null,          /* tile index of assignment, or null = resting */
    zero: 0,           /* consecutive turns at zero morale */
    worked: false
  };
}

function newState(seed){
  var st = {
    version: VERSION,
    seed: seed>>>0,
    rng: seed>>>0,
    turn: 1,
    phase: 'play',        /* play | won | lost */
    endless: false,
    /* Enough metal to reach the first self-sustaining metal chain
       (Condenser + Ore Mine + Vent Tap + Forge = 30 metal, 12 parts). */
    res: {food:55,water:55,metal:42,power:8,parts:18,scrip:40,ore:0,soil:15,ash:25},
    map: null,
    colonists: [],
    nextId: 1,
    done: [],                       /* completed research ids */
    evtCd: {},                      /* event id -> turn it becomes legal again */
    pending: null,                  /* unresolved choice event */
    stormNext: 8,
    stormLast: 0,
    stormSev: 0,
    waterMul: 1,                    /* water demand multiplier this turn */
    market: {},                     /* good -> drifting global price index */
    caravan: null,
    caravanNext: 6,
    laborUsed: 0,
    lastShortF: 0,
    lastShortW: 0,
    log: [],
    flow: {},                       /* last turn's per-good breakdown, for tooltips */
    over: {},                       /* last turn's overflow, for tooltips */
    stats: {overflow:0, starved:0, thirsted:0, left:0, joined:0, peak:6, storms:0, built:0, repairs:0},
    hist: []                        /* recent turns: {t,pop,food,water,mor} */
  };
  st.map = genMap(st);
  var startJobs = ['grow','grow','tech','tech','scav','smith'];
  for(var i=0;i<startJobs.length;i++) st.colonists.push(makeColonist(st,startJobs[i]));
  for(var g=0; g<TRADE_GOODS.length; g++) st.market[TRADE_GOODS[g]] = 1;
  log(st,'Seed '+st.seed+'. Six survivors reach the outpost site. Ash is still falling.','sys');
  log(st,'Build a Condenser and an Ash Kiln early — water and soil gate everything else.','sys');
  return st;
}

/* ======================= 5. DERIVED / MODIFIERS ========================== */

function has(st,id){ return st.done.indexOf(id)>=0; }
function pop(st){ return st.colonists.length; }

function housing(st){
  var h=6;
  for(var i=0;i<MAPN;i++) if(st.map[i].b==='shelter') h+=BLD.shelter.house;
  return h;
}
function countB(st,id){
  var c=0; for(var i=0;i<MAPN;i++) if(st.map[i].b===id) c++; return c;
}
function capOf(st,g){
  if(g==='scrip') return BASE_CAP.scrip;
  var c=BASE_CAP[g] + countB(st,'depot')*80;
  if(has(st,'silo')) c=Math.floor(c*1.4);
  return c;
}
/* Every production multiplier carries its source string so tooltips can say
   exactly where a number came from. */
function bldMods(st,bid){
  var m=[];
  if(bid==='kiln'  && has(st,'sift'))        m.push({v:1.30,s:'Ash Sifting'});
  if(bid==='condenser' && has(st,'hydro'))   m.push({v:1.30,s:'Hydro Mesh'});
  if(bid==='gen'   && has(st,'venttap'))     m.push({v:1.25,s:'Vent Tapping'});
  if(bid==='forge' && has(st,'furnace'))     m.push({v:1.30,s:'Blast Furnace'});
  if(bid==='works' && has(st,'tools'))       m.push({v:1.50,s:'Precision Tools'});
  if(bid==='green' && has(st,'cultures'))    m.push({v:1.40,s:'Soil Cultures'});
  return m;
}
function modProduct(m){ var v=1; for(var i=0;i<m.length;i++) v*=m[i].v; return v; }

/* Terrain adjacency bonus for a building on a tile. */
function adjBonus(st,i,bid){
  var b=BLD[bid];
  if(!b||!b.adjT) return {n:0,v:0,res:null,t:null,max:0,per:0};
  var nb=orth(i), n=0;
  for(var k=0;k<nb.length;k++) if(st.map[nb[k]].t===b.adjT.t) n++;
  var used=Math.min(n,b.adjT.max);
  return {n:n, used:used, v:used*b.adjT.per, res:b.adjT.res, t:b.adjT.t, max:b.adjT.max, per:b.adjT.per};
}
function adjHasB(st,i,bid){
  var nb=orth(i);
  for(var k=0;k<nb.length;k++) if(st.map[nb[k]].b===bid) return true;
  return false;
}
/* Windbreak coverage: itself or any of the 8 neighbours is a Windbreak. */
function shielded(st,i){
  if(st.map[i].b==='wind') return true;
  var nb=ring8(i);
  for(var k=0;k<nb.length;k++) if(st.map[nb[k]].b==='wind') return true;
  return false;
}
function integrityFactor(hp){ return hp<35 ? 0 : hp/100; }
function isDisabled(st,i){ return st.map[i].b && st.map[i].hp<35; }

function colonist(st,id){
  for(var i=0;i<st.colonists.length;i++) if(st.colonists[i].id===id) return st.colonists[i];
  return null;
}
function workersAt(st,i){
  var o=[];
  for(var k=0;k<st.colonists.length;k++) if(st.colonists[k].at===i) o.push(st.colonists[k]);
  return o;
}
function idleColonists(st){
  var o=[];
  for(var k=0;k<st.colonists.length;k++) if(st.colonists[k].at===null) o.push(st.colonists[k]);
  return o;
}
/* Per-worker efficiency, fully decomposed for the tooltip. */
function effParts(c,bid){
  var b=BLD[bid];
  var match = (b && b.job && c.job===b.job) ? 1 : 0.55;
  var skill = 0.55 + 0.22*c.skill;
  var mor   = 0.45 + 0.0055*c.mor;
  var fat   = 1 - 0.005*c.fat;
  var refuse= c.mor < 20;
  return {match:match, skill:skill, mor:mor, fat:fat, refuse:refuse,
          total: refuse ? 0 : match*skill*mor*fat};
}
function workerEff(c,bid){ return effParts(c,bid).total; }

function avgMorale(st){
  if(!st.colonists.length) return 0;
  var s=0; for(var i=0;i<st.colonists.length;i++) s+=st.colonists[i].mor;
  return s/st.colonists.length;
}
function stormDamageMul(st){
  var v=1;
  if(has(st,'shutters')) v*=0.75;
  if(has(st,'bunkers'))  v*=0.75;
  return v;
}
function stormWaterMul(st){ return has(st,'bunkers') ? 1.5 : 2.2; }

/* Can this building be placed here, and why not? */
function canBuild(st,i,bid){
  var b=BLD[bid], tile=st.map[i];
  if(!b) return {ok:false,why:'Unknown building'};
  if(b.req && !has(st,b.req)) return {ok:false,why:'Needs research: '+RES_TREE[b.req].n};
  if(tile.b) return {ok:false,why:'Tile already holds '+BLD[tile.b].n};
  if(b.terr.indexOf(tile.t)<0) return {ok:false,why:'Needs terrain: '+b.terr.map(function(t){return TERR[t].n;}).join(' / ')};
  for(var g in b.cost) if(st.res[g] < b.cost[g])
    return {ok:false,why:'Need '+b.cost[g]+' '+GOOD_LABEL[g]+' (have '+st.res[g]+')'};
  return {ok:true,why:''};
}
function doBuild(st,i,bid){
  var chk=canBuild(st,i,bid);
  if(!chk.ok) return chk;
  for(var g in BLD[bid].cost) st.res[g]-=BLD[bid].cost[g];
  st.map[i].b=bid; st.map[i].hp=100;
  st.stats.built++;
  var p=xy(i);
  log(st,'Built '+BLD[bid].n+' at '+String.fromCharCode(65+p.x)+(p.y+1)+'.','good');
  return {ok:true,why:''};
}
function demolish(st,i){
  var bid=st.map[i].b;
  if(!bid) return false;
  var w=workersAt(st,i);
  for(var k=0;k<w.length;k++) w[k].at=null;
  st.res.metal = Math.min(capOf(st,'metal'), st.res.metal + Math.floor((BLD[bid].cost.metal||0)*0.4));
  st.map[i].b=null; st.map[i].hp=100;
  log(st,'Demolished '+BLD[bid].n+'; 40% of its metal recovered.','warn');
  return true;
}
function repairCost(hp){ return Math.max(1, Math.ceil((100-hp)/25)); }
function doRepair(st,i){
  var tile=st.map[i];
  if(!tile.b) return {ok:false,why:'Nothing here to repair'};
  if(tile.hp>=100) return {ok:false,why:'Already at full integrity'};
  var cost=repairCost(tile.hp);
  if(st.res.parts<cost) return {ok:false,why:'Need '+cost+' parts (have '+st.res.parts+')'};
  var idle=idleColonists(st);
  if(idle.length<=st.laborUsed) return {ok:false,why:'No idle colonist free for labour this turn'};
  st.res.parts-=cost;
  var worker=idle[st.laborUsed];
  st.laborUsed++;
  worker.fat=clamp(worker.fat+8,0,100);
  tile.hp=Math.min(100, tile.hp+40);
  st.stats.repairs++;
  log(st,worker.name+' repairs the '+BLD[tile.b].n+' (−'+cost+' parts, now '+Math.round(tile.hp)+'% integrity).','good');
  return {ok:true,why:''};
}
function assign(st,cid,tileIdx){
  var c=colonist(st,cid);
  if(!c) return {ok:false,why:'No such colonist'};
  if(tileIdx===null){ c.at=null; return {ok:true,why:''}; }
  var tile=st.map[tileIdx];
  if(!tile.b) return {ok:false,why:'No building on that tile'};
  var b=BLD[tile.b];
  if(b.cap<=0) return {ok:false,why:BLD[tile.b].n+' is passive and takes no workers'};
  if(workersAt(st,tileIdx).length >= b.cap && c.at!==tileIdx)
    return {ok:false,why:b.n+' is full ('+b.cap+' slots)'};
  c.at=tileIdx;
  return {ok:true,why:''};
}

/* ========================= 6. PRODUCTION ================================= */

/* Describe one building's output for a given turn. Pure: no state mutation,
   so the UI can call it for tooltips and the engine can call it to resolve. */
function bldReport(st,i){
  var tile=st.map[i], bid=tile.b;
  if(!bid) return null;
  var b=BLD[bid];
  var rep={id:bid, name:b.n, tile:i, hp:tile.hp, disabled:false, passive:(b.cap<=0),
           workers:[], eff:0, mods:bldMods(st,bid), adj:adjBonus(st,i,bid),
           adjB:null, rates:{}, needs:{}, lines:[]};
  if(b.cap>0){
    var w=workersAt(st,i);
    for(var k=0;k<w.length;k++){
      var e=effParts(w[k],bid);
      rep.workers.push({c:w[k], e:e});
      rep.eff+=e.total;
    }
  }
  rep.intF = integrityFactor(tile.hp);
  if(rep.intF===0 && tile.hp<100){ rep.disabled=true; }
  var modV = modProduct(rep.mods);
  var scale = (b.cap>0 ? rep.eff : 1) * modV * rep.intF;

  if(b.out){
    for(var g in b.out){
      var base=b.out[g] + (rep.adj.res===g ? rep.adj.v : 0);
      rep.rates[g]=(rep.rates[g]||0) + base*scale;
    }
  }
  if(b.conv){
    var outG=Object.keys(b.conv.out)[0];
    var baseOut=b.conv.out[outG] + (rep.adj.res===outG ? rep.adj.v : 0);
    var outMul=1, waterMul=1;
    if(b.adjB && adjHasB(st,i,b.adjB.b)){
      rep.adjB=b.adjB;
      if(b.adjB.outMul) outMul=b.adjB.outMul;
      if(b.adjB.waterMul) waterMul=b.adjB.waterMul;
    }
    rep.wantOut = baseOut*scale*outMul;
    rep.outGood = outG;
    for(var ing in b.conv.per){
      var per=b.conv.per[ing];
      if(ing==='water') per*=waterMul;
      if(ing==='water' && bid==='green' && has(st,'hydroponics')) per*=0.70;
      if(ing==='ore'   && bid==='forge' && has(st,'furnace')) per*=0.85;
      if(ing==='power' && bid==='forge' && b.ventCheap && adjBonus(st,i,bid).n>0) per*=0.71;
      rep.needs[ing]=per;
    }
  }
  return rep;
}

/* Groups of buildings resolved in a fixed documented order. */
var PHASE_POWER   = ['gen','plant'];
var PHASE_EXTRACT = ['condenser','mine','salv','market'];
var PHASE_REFINE  = ['kiln','forge','works'];
var PHASE_FARM    = ['green'];

function runPhase(st,pool,ids,flow){
  for(var i=0;i<MAPN;i++){
    var bid=st.map[i].b;
    if(!bid || ids.indexOf(bid)<0) continue;
    var rep=bldReport(st,i);
    if(!rep || rep.intF===0) continue;
    var b=BLD[bid];
    if(b.cap>0 && rep.eff<=0) continue;
    var g;
    if(b.out){
      for(g in rep.rates){
        if(rep.rates[g]<=0) continue;
        pool[g]+=rep.rates[g];
        flow[g]=flow[g]||{};
        flow[g][b.n]=(flow[g][b.n]||0)+rep.rates[g];
      }
    }
    if(b.conv && rep.wantOut>0){
      var out=rep.wantOut;
      for(g in rep.needs){
        var per=rep.needs[g];
        if(per<=0) continue;
        out=Math.min(out, pool[g]/per);
      }
      if(out<=0.0001) continue;
      for(g in rep.needs){
        var used=out*rep.needs[g];
        pool[g]-=used;
        if(pool[g]<0) pool[g]=0;
        flow[g]=flow[g]||{};
        flow[g][b.n]=(flow[g][b.n]||0)-used;
      }
      pool[rep.outGood]+=out;
      flow[rep.outGood]=flow[rep.outGood]||{};
      flow[rep.outGood][b.n]=(flow[rep.outGood][b.n]||0)+out;
      /* record starvation of the chain for the tooltip */
      if(out < rep.wantOut-0.05){
        rep.short=true;
      }
    }
  }
}

/* ========================== 7. HAZARD =================================== */

function resolveStorm(st){
  st.waterMul = 1;
  if(st.turn < st.stormNext) return;
  var sev = 1 + Math.floor(st.turn/14) + (rnd(st)<0.35?1:0);
  st.stormSev = sev; st.stormLast = st.turn; st.stats.storms++;
  st.stormNext = st.turn + 7 + ri(st,0,2);
  st.waterMul = stormWaterMul(st);
  var dmgMul = stormDamageMul(st);
  var hits=0, shieldedN=0, worst=0;
  for(var i=0;i<MAPN;i++){
    if(!st.map[i].b) continue;
    if(rnd(st) >= 0.55) continue;
    var dmg = (12 + sev*9 + ri(st,0,6)) * dmgMul;
    if(shielded(st,i)){ dmg*=0.55; shieldedN++; }
    st.map[i].hp = clamp(Math.round(st.map[i].hp - dmg), 0, 100);
    hits++; worst=Math.max(worst,Math.round(dmg));
  }
  st.res.ash = Math.min(capOf(st,'ash'), st.res.ash + 8 + sev*4);
  for(var k=0;k<st.colonists.length;k++){
    st.colonists[k].mor = clamp(st.colonists[k].mor - (3+sev*2), 0, 100);
  }
  log(st,'ASHSTORM (severity '+sev+'): '+hits+' building'+(hits===1?'':'s')+' damaged'+
    (shieldedN?', '+shieldedN+' shielded by Windbreaks':'')+
    '. Water demand ×'+stormWaterMul(st).toFixed(1)+' this turn. Worst hit −'+worst+'% integrity.','bad');
}

/* ======================= 8. NEEDS / PEOPLE =============================== */

function resolveConsumption(st){
  var n=pop(st);
  var foodNeed=n;
  var waterNeed=Math.round(n*st.waterMul);
  var foodGot=Math.min(st.res.food, foodNeed);
  var waterGot=Math.min(st.res.water, waterNeed);
  st.res.food-=foodGot; st.res.water-=waterGot;
  st.flow.food=st.flow.food||{}; st.flow.food['Colonists']= -foodGot;
  st.flow.water=st.flow.water||{}; st.flow.water['Colonists']= -waterGot;
  var shortF=foodGot<foodNeed, shortW=waterGot<waterNeed;
  st.lastShortF=shortF?1:0; st.lastShortW=shortW?1:0;
  if(shortF){ st.stats.starved++; log(st,'FOOD SHORTAGE: needed '+foodNeed+', had '+foodGot+'. Morale is falling.','bad'); }
  if(shortW){ st.stats.thirsted++; log(st,'WATER SHORTAGE: needed '+waterNeed+', had '+waterGot+'. Morale is falling.','bad'); }
  return {shortF:shortF, shortW:shortW, foodNeed:foodNeed, waterNeed:waterNeed};
}

function resolvePeople(st,need){
  var n=pop(st), i, c;
  var infirmaries=0;
  for(i=0;i<MAPN;i++) if(st.map[i].b==='infirm' && workersAt(st,i).length>0 && !isDisabled(st,i)) infirmaries++;
  var fatGain = infirmaries>0 ? 6 : 12;
  var restBase = has(st,'medbay') ? 27 : 18;
  var crowded = n > housing(st);
  var surplus = st.res.food >= n*3 && st.res.water >= n*3;

  for(i=0;i<st.colonists.length;i++){
    c=st.colonists[i];
    var d=0, working = c.at!==null && st.map[c.at].b && !isDisabled(st,c.at) && c.mor>=20;
    if(working){ c.fat=clamp(c.fat+fatGain,0,100); }
    else { c.fat=clamp(c.fat-restBase,0,100); }

    if(need.shortF) d-=15;
    if(need.shortW) d-=18;
    if(!need.shortF && !need.shortW) d+=3;
    if(surplus) d+=3;
    if(c.fat>70) d-=6;
    if(c.fat<30 && c.at===null) d+=4;
    if(crowded) d-=8;
    if(st.stormLast===st.turn) d-=2;
    d += infirmaries*3;
    /* gentle pull toward a stable middle so runs recover instead of spiralling */
    if(c.mor<45 && d>=0) d+=2;
    c.mor=clamp(Math.round(c.mor+d),0,100);

    /* skill growth: slow, only from actual work */
    if(working && c.skill<5){
      var b=BLD[st.map[c.at].b];
      c.xp = r3(c.xp + (b.job===c.job ? 1 : 0.5));
      var needXp = 8 + c.skill*6;
      if(c.xp>=needXp){
        c.xp=0; c.skill++;
        log(st,c.name+' reaches skill '+c.skill+' as a '+JOBS[c.job].n+'.','good');
      }
    }
    c.worked=working;
  }
  /* departures: two consecutive turns at rock bottom */
  for(i=st.colonists.length-1;i>=0;i--){
    c=st.colonists[i];
    if(c.mor<=0){
      c.zero++;
      if(c.zero>=2){
        st.colonists.splice(i,1);
        st.stats.left++;
        log(st,c.name+' walks out into the ash and does not come back.','bad');
      } else {
        log(st,c.name+' is at zero morale and will leave next turn unless things improve.','warn');
      }
    } else c.zero=0;
  }
  /* newcomers */
  if(pop(st)>0 && pop(st)<housing(st) && avgMorale(st)>=65 &&
     st.res.food>=pop(st)*2.5 && st.res.water>=pop(st)*2.5 && rnd(st)<0.16){
    var nc=makeColonist(st,pick(st,JOB_IDS));
    nc.mor=clamp(nc.mor+8,0,100);
    st.colonists.push(nc);
    st.stats.joined++;
    log(st,'A survivor walks in from the ash: '+nc.name+', '+JOBS[nc.job].n+' (skill '+nc.skill+').','good');
  }
  st.stats.peak=Math.max(st.stats.peak,pop(st));
}

/* =========================== 9. TRADE =================================== */

function tradeMargin(st){ return has(st,'compact') ? 0.05 : 0.15; }
function marketRep(st){
  var m=0;
  for(var i=0;i<MAPN;i++) if(st.map[i].b==='market' && !isDisabled(st,i)) { m=0.08; break; }
  return m;
}
/* Price of one unit. Moves with the global drifting index and with how much
   of the good you are already sitting on. */
function unitPrice(st,g){
  var stock=st.res[g]||0, cap=capOf(st,g);
  var stockF=clamp(1.35 - 0.7*(stock/cap), 0.62, 1.5);
  return BASE_PRICE[g]*st.market[g]*stockF;
}
function buyPrice(st,g){
  return Math.max(1, Math.round(unitPrice(st,g)*(1+tradeMargin(st))*(1-marketRep(st))*10)/10);
}
function sellPrice(st,g){
  return Math.max(0.5, Math.round(unitPrice(st,g)*(1-tradeMargin(st))*(1+marketRep(st))*10)/10);
}
function driftMarket(st){
  for(var k=0;k<TRADE_GOODS.length;k++){
    var g=TRADE_GOODS[k];
    st.market[g]=r3(clamp(st.market[g]*(1+(rnd(st)-0.5)*0.09), 0.6, 1.7));
  }
}
function resolveCaravan(st){
  driftMarket(st);
  if(st.caravan){
    st.caravan.leaves--;
    if(st.caravan.leaves<=0){
      st.caravan=null;
      log(st,'The caravan packs up and rolls out into the grey.','sys');
    }
    return;
  }
  if(st.turn>=st.caravanNext){
    var mul = has(st,'compact')?1.5:1;
    var inv={};
    inv.food =Math.round(ri(st,14,28)*mul);
    inv.water=Math.round(ri(st,14,28)*mul);
    inv.metal=Math.round(ri(st,10,20)*mul);
    inv.parts=Math.round(ri(st,5,12)*mul);
    inv.ore  =Math.round(ri(st,8,16)*mul);
    inv.soil =Math.round(ri(st,8,16)*mul);
    inv.ash  =Math.round(ri(st,6,14)*mul);
    st.caravan={inv:inv, scrip:Math.round(ri(st,90,160)*mul), leaves:2};
    st.caravanNext=st.turn+ri(st,5,8);
    log(st,'A caravan crests the ridge. It stays 2 turns.','good');
  }
}
function doBuy(st,g,qty){
  if(!st.caravan) return {ok:false,why:'No caravan here'};
  qty=Math.floor(qty);
  if(qty<=0) return {ok:false,why:'Quantity must be at least 1'};
  if((st.caravan.inv[g]||0)<qty) return {ok:false,why:'Caravan only has '+(st.caravan.inv[g]||0)+' '+GOOD_LABEL[g]};
  var cost=Math.ceil(buyPrice(st,g)*qty);
  if(st.res.scrip<cost) return {ok:false,why:'Costs '+cost+' scrip, you have '+st.res.scrip};
  if(st.res[g]+qty>capOf(st,g)) return {ok:false,why:'Storage cap for '+GOOD_LABEL[g]+' is '+capOf(st,g)};
  st.res.scrip-=cost; st.res[g]+=qty;
  st.caravan.inv[g]-=qty; st.caravan.scrip+=cost;
  log(st,'Bought '+qty+' '+GOOD_LABEL[g]+' for '+cost+' scrip.','sys');
  return {ok:true,why:''};
}
function doSell(st,g,qty){
  if(!st.caravan) return {ok:false,why:'No caravan here'};
  qty=Math.floor(qty);
  if(qty<=0) return {ok:false,why:'Quantity must be at least 1'};
  if(st.res[g]<qty) return {ok:false,why:'You only have '+st.res[g]+' '+GOOD_LABEL[g]};
  var gain=Math.floor(sellPrice(st,g)*qty);
  if(st.caravan.scrip<gain) return {ok:false,why:'Caravan has only '+st.caravan.scrip+' scrip left'};
  st.res[g]-=qty; st.res.scrip+=gain;
  st.caravan.scrip-=gain; st.caravan.inv[g]=(st.caravan.inv[g]||0)+qty;
  log(st,'Sold '+qty+' '+GOOD_LABEL[g]+' for '+gain+' scrip.','sys');
  return {ok:true,why:''};
}

/* ========================= 10. RESEARCH ================================= */

function resStatus(st,id){
  if(has(st,id)) return 'done';
  var pre=RES_TREE[id].pre;
  for(var i=0;i<pre.length;i++) if(!has(st,pre[i])) return 'locked';
  return 'available';
}
function doResearch(st,id){
  if(!RES_TREE[id]) return {ok:false,why:'Unknown node'};
  if(has(st,id)) return {ok:false,why:'Already researched'};
  var stt=resStatus(st,id);
  if(stt==='locked'){
    var missing=RES_TREE[id].pre.filter(function(p){return !has(st,p);})
      .map(function(p){return RES_TREE[p].n;});
    return {ok:false,why:'Requires: '+missing.join(', ')};
  }
  var c=RES_TREE[id].cost;
  for(var g in c) if(st.res[g]<c[g]) return {ok:false,why:'Need '+c[g]+' '+GOOD_LABEL[g]+' (have '+st.res[g]+')'};
  for(g in c) st.res[g]-=c[g];
  st.done.push(id);
  log(st,'RESEARCH COMPLETE — '+RES_TREE[id].n+': '+RES_TREE[id].d,'good');
  return {ok:true,why:''};
}

/* ========================== 11. EVENTS ================================== */

function give(st,g,n){
  var before=st.res[g];
  st.res[g]=clamp(Math.round(st.res[g]+n),0,capOf(st,g));
  return st.res[g]-before;
}
function moraleAll(st,d){
  for(var i=0;i<st.colonists.length;i++) st.colonists[i].mor=clamp(st.colonists[i].mor+d,0,100);
}
function fatigueAll(st,d){
  for(var i=0;i<st.colonists.length;i++) st.colonists[i].fat=clamp(st.colonists[i].fat+d,0,100);
}
function damageRandom(st,filterIds,amount){
  var cands=[];
  for(var i=0;i<MAPN;i++){
    var b=st.map[i].b;
    if(b && (!filterIds || filterIds.indexOf(b)>=0) && st.map[i].hp>0) cands.push(i);
  }
  if(!cands.length) return null;
  var t=cands[Math.floor(rnd(st)*cands.length)];
  st.map[t].hp=clamp(Math.round(st.map[t].hp-amount),0,100);
  return t;
}
function addColonist(st,job,skill){
  var c=makeColonist(st,job||pick(st,JOB_IDS));
  if(skill) c.skill=skill;
  c.mor=clamp(c.mor+5,0,100);
  st.colonists.push(c); st.stats.joined++;
  return c;
}

var EVT_IDS = Object.keys(EVENTS);

function eventDeck(st){
  var deck=[];
  for(var i=0;i<EVT_IDS.length;i++){
    var id=EVT_IDS[i];
    if((st.evtCd[id]||0) > st.turn) continue;
    deck.push(id);
  }
  return deck;
}
function rollEvent(st){
  if(st.turn<3) return;
  if(rnd(st)>=0.40) return;
  var deck=eventDeck(st);
  if(!deck.length) return;
  var total=0, i;
  for(i=0;i<deck.length;i++) total+=EVENTS[deck[i]].w;
  var roll=rnd(st)*total, id=deck[deck.length-1];
  for(i=0;i<deck.length;i++){ roll-=EVENTS[deck[i]].w; if(roll<=0){ id=deck[i]; break; } }
  var ev=EVENTS[id];
  st.evtCd[id]=st.turn+ev.cd;
  if(ev.opts){
    st.pending={id:id, name:ev.n, text:ev.text,
      opts:ev.opts.map(function(o){ return {t:o.t, d:o.d, ai:o.ai}; })};
    log(st,'EVENT — '+ev.n+' (a decision is required).','evt');
  } else {
    log(st,'EVENT — '+ev.n+': '+ev.run(st),'evt');
  }
}
function resolveChoice(st,optIdx){
  if(!st.pending) return false;
  var ev=EVENTS[st.pending.id];
  var opt=ev.opts[clamp(optIdx,0,ev.opts.length-1)];
  var out=opt.run(st);
  log(st,'CHOICE — '+ev.n+' → "'+opt.t+'": '+out,'evt');
  st.pending=null;
  finishTurn(st);
  return true;
}
function bestAiChoice(st){
  var opts=st.pending.opts, best=0;
  for(var i=1;i<opts.length;i++) if(opts[i].ai>opts[best].ai) best=i;
  return best;
}

/* ======================= 12. TURN ORCHESTRATION ========================== */

function endTurn(st){
  if(st.phase!=='play' || st.pending) return false;
  st.turn++;                                                  /* 1 */
  st.laborUsed=0;
  st.flow={}; st.over={};
  var flow=st.flow, i, g;

  /* 2 ashfall: rate scales with how much ash flat the map has */
  var ashTiles=0;
  for(i=0;i<MAPN;i++) if(st.map[i].t==='ash') ashTiles++;
  var ashGain=Math.round(2 + 0.35*ashTiles);
  flow.ash={'Ashfall':ashGain};

  resolveStorm(st);                                           /* 3 */

  var pool={};
  for(g in st.res) pool[g]=st.res[g];
  pool.ash+=ashGain;

  runPhase(st,pool,PHASE_POWER,flow);                         /* 4 */
  runPhase(st,pool,PHASE_EXTRACT,flow);                       /* 5 */
  runPhase(st,pool,PHASE_REFINE,flow);                        /* 6 */
  runPhase(st,pool,PHASE_FARM,flow);                          /* 7 */

  for(g in pool){                                             /* 8 */
    var v=Math.round(Math.max(0,pool[g]));
    var cap=capOf(st,g);
    if(v>cap){
      st.over[g]=v-cap;
      st.stats.overflow+=v-cap;
      log(st,'Storage overflow: '+(v-cap)+' '+GOOD_LABEL[g]+' lost (cap '+cap+').','warn');
      v=cap;
    }
    st.res[g]=v;
  }

  var need=resolveConsumption(st);                            /* 9 */
  resolvePeople(st,need);                                     /* 10, 11, 12, 13 */
  resolveCaravan(st);                                         /* 14 */
  rollEvent(st);                                              /* 15 */

  if(st.pending) return true;      /* wait for the player's decision */
  finishTurn(st);                                             /* 16 */
  return true;
}

function criticalNeedsMet(st){
  var n=pop(st);
  if(n<=0) return false;
  if(st.res.food<n || st.res.water<n) return false;
  if(avgMorale(st)<50) return false;
  var recent=st.hist.slice(-3);
  for(var i=0;i<recent.length;i++) if(recent[i].sf||recent[i].sw) return false;
  return true;
}
function finishTurn(st){
  var n=pop(st);
  st.hist.push({t:st.turn,pop:n,food:st.res.food,water:st.res.water,
    mor:Math.round(avgMorale(st)), sf:st.lastShortF||0, sw:st.lastShortW||0});
  if(st.hist.length>80) st.hist.splice(0,st.hist.length-80);

  if(n<=0){
    st.phase='lost';
    log(st,'The last of the outpost is gone. Nothing moves but the ash.','bad');
    return;
  }
  if(!st.endless && st.turn>=WIN_TURN){
    if(n>=WIN_POP && criticalNeedsMet(st)){
      st.phase='won';
      log(st,'TURN '+WIN_TURN+': '+n+' survivors, stores full, needs met. The outpost holds.','good');
    } else {
      st.phase='lost';
      var why=[];
      if(n<WIN_POP) why.push('population '+n+' of '+WIN_POP+' needed');
      if(!criticalNeedsMet(st)) why.push('critical needs not met');
      log(st,'TURN '+WIN_TURN+': the relief convoy finds the outpost wanting — '+why.join('; ')+'.','bad');
    }
  }
}

function score(st){
  var n=pop(st);
  var stock=st.res.food+st.res.water+st.res.metal+st.res.parts*2+st.res.scrip;
  var s = n*40 + st.done.length*60 + Math.floor(stock/8) + (st.turn-1)*6
        + st.stats.peak*10 - st.stats.left*15 + (st.phase==='won'?500:0);
  return {
    total: Math.max(0,Math.round(s)),
    parts:[
      ['Population ('+n+' × 40)', n*40],
      ['Research ('+st.done.length+' × 60)', st.done.length*60],
      ['Stockpiles (⌊'+stock+' / 8⌋)', Math.floor(stock/8)],
      ['Turns survived ('+(st.turn-1)+' × 6)', (st.turn-1)*6],
      ['Peak population ('+st.stats.peak+' × 10)', st.stats.peak*10],
      ['Colonists lost ('+st.stats.left+' × −15)', -st.stats.left*15],
      ['Victory bonus', st.phase==='won'?500:0]
    ]
  };
}

/* ========================= 13. SAVE / LOAD ============================== */

function serialize(st){ return JSON.stringify(st); }

function validate(o){
  var e=[];
  if(!o || typeof o!=='object' || Array.isArray(o)) return ['Top level is not an object.'];
  if(o.version!==VERSION) e.push('Wrong save version: expected '+VERSION+', found '+JSON.stringify(o.version)+'.');
  if(typeof o.turn!=='number'||o.turn<1) e.push('"turn" must be a number >= 1.');
  if(typeof o.seed!=='number') e.push('"seed" must be a number.');
  if(typeof o.rng!=='number') e.push('"rng" (PRNG state) must be a number.');
  if(['play','won','lost'].indexOf(o.phase)<0) e.push('"phase" must be play, won or lost.');
  if(!o.res||typeof o.res!=='object') e.push('"res" block missing.');
  else for(var i=0;i<GOODS.length;i++){
    var g=GOODS[i];
    if(typeof o.res[g]!=='number'||!isFinite(o.res[g])) e.push('res.'+g+' is not a finite number.');
    else if(o.res[g]<0) e.push('res.'+g+' is negative.');
  }
  if(!Array.isArray(o.map)||o.map.length!==MAPN) e.push('"map" must be an array of '+MAPN+' tiles.');
  else for(var k=0;k<o.map.length;k++){
    var t=o.map[k];
    if(!t||typeof t!=='object'){ e.push('map['+k+'] is not a tile object.'); break; }
    if(!TERR[t.t]){ e.push('map['+k+'].t is not a known terrain: '+JSON.stringify(t.t)); break; }
    if(t.b!==null && !BLD[t.b]){ e.push('map['+k+'].b is not a known building: '+JSON.stringify(t.b)); break; }
    if(typeof t.hp!=='number'||t.hp<0||t.hp>100){ e.push('map['+k+'].hp must be 0..100.'); break; }
  }
  if(!Array.isArray(o.colonists)) e.push('"colonists" must be an array.');
  else for(var c=0;c<o.colonists.length;c++){
    var p=o.colonists[c];
    if(!p||typeof p!=='object'){ e.push('colonists['+c+'] is not an object.'); break; }
    if(typeof p.name!=='string'||!p.name){ e.push('colonists['+c+'].name missing.'); break; }
    if(!JOBS[p.job]){ e.push('colonists['+c+'].job unknown: '+JSON.stringify(p.job)); break; }
    if(typeof p.skill!=='number'||p.skill<1||p.skill>5){ e.push('colonists['+c+'].skill must be 1..5.'); break; }
    if(typeof p.mor!=='number'||p.mor<0||p.mor>100){ e.push('colonists['+c+'].mor must be 0..100.'); break; }
    if(typeof p.fat!=='number'||p.fat<0||p.fat>100){ e.push('colonists['+c+'].fat must be 0..100.'); break; }
    if(p.at!==null && (typeof p.at!=='number'||p.at<0||p.at>=MAPN)){ e.push('colonists['+c+'].at is out of range.'); break; }
  }
  if(!Array.isArray(o.done)) e.push('"done" (research) must be an array.');
  else for(var r=0;r<o.done.length;r++) if(!RES_TREE[o.done[r]]){ e.push('Unknown research id: '+JSON.stringify(o.done[r])); break; }
  if(!Array.isArray(o.log)) e.push('"log" must be an array.');
  if(!o.market||typeof o.market!=='object') e.push('"market" block missing.');
  if(!o.stats||typeof o.stats!=='object') e.push('"stats" block missing.');
  return e;
}

function deserialize(text){
  var o;
  try { o=JSON.parse(text); }
  catch(err){ return {ok:false, errors:['Not valid JSON: '+err.message]}; }
  var errs=validate(o);
  if(errs.length) return {ok:false, errors:errs};
  /* re-hydrate anything the save may predate, without touching valid fields */
  if(!o.evtCd) o.evtCd={};
  if(o.pending===undefined) o.pending=null;
  if(!o.flow) o.flow={};
  if(!o.over) o.over={};
  if(!o.hist) o.hist=[];
  return {ok:true, state:o, errors:[]};
}

/* ================= 14. GREEDY POLICY / HEADLESS BENCHMARK =============== */

/* Fixed build plan: [building id, target count]. The policy walks it in order
   and builds the first entry it can afford and place. */
var PLAN = [
  ['condenser',1],['kiln',1],['green',1],['salv',1],['shelter',1],['mine',1],
  ['gen',1],['forge',1],['condenser',2],['green',2],['shelter',2],['works',1],
  ['wind',1],['kiln',2],['salv',2],['shelter',3],['condenser',3],['green',3],
  ['mine',2],['gen',2],['depot',1],['wind',2],['shelter',4],['forge',2],
  ['works',2],['plant',1],['market',1],['depot',2],['infirm',1],['wind',3]
];
/* Water and food first, then the metal bootstrap, then heavy industry. */
var ASSIGN_PRIORITY = ['condenser','green','kiln','salv','mine','gen','forge','works','plant','market','infirm'];

/* Best legal tile for a building: highest adjacency bonus, ties by index. */
function bestTile(st,bid){
  var best=-1, bestScore=-1;
  for(var i=0;i<MAPN;i++){
    if(!canBuild(st,i,bid).ok) continue;
    var s=adjBonus(st,i,bid).v*10;
    if(bid==='wind'){                        /* windbreaks want crowded ground */
      var n=0, r=ring8(i);
      for(var k=0;k<r.length;k++) if(st.map[r[k]].b && st.map[r[k]].b!=='wind') n++;
      s=n*10;
    }
    if(s>bestScore){ bestScore=s; best=i; }
  }
  return best;
}

function policyBuild(st){
  for(var p=0;p<PLAN.length;p++){
    var bid=PLAN[p][0], want=PLAN[p][1];
    if(countB(st,bid)>=want) continue;
    var t=bestTile(st,bid);
    if(t<0) continue;                        /* cannot afford or nowhere legal */
    doBuild(st,t,bid);
    return;                                  /* at most one build per turn */
  }
}
function policyAssign(st){
  var i,k,c;
  for(k=0;k<st.colonists.length;k++) st.colonists[k].at=null;
  /* anyone badly fatigued rests this turn */
  var avail=[];
  for(k=0;k<st.colonists.length;k++){
    c=st.colonists[k];
    if(c.fat>78 || c.mor<20) continue;
    avail.push(c);
  }
  for(var pri=0;pri<ASSIGN_PRIORITY.length;pri++){
    var bid=ASSIGN_PRIORITY[pri];
    for(i=0;i<MAPN;i++){
      if(st.map[i].b!==bid || isDisabled(st,i)) continue;
      var cap=BLD[bid].cap, slots=cap-workersAt(st,i).length;
      for(var s=0;s<slots;s++){
        /* pick the best remaining worker: job match first, then skill, then id */
        var bestIdx=-1, bestScore=-1;
        for(k=0;k<avail.length;k++){
          if(avail[k].at!==null) continue;
          var sc=(avail[k].job===BLD[bid].job?100:0)+avail[k].skill*10-avail[k].fat*0.05;
          if(sc>bestScore){ bestScore=sc; bestIdx=k; }
        }
        if(bestIdx<0) return;
        avail[bestIdx].at=i;
      }
    }
  }
}
function policyRepair(st){
  var order=[];
  for(var i=0;i<MAPN;i++) if(st.map[i].b && st.map[i].hp<100) order.push(i);
  order.sort(function(a,b){ return st.map[a].hp-st.map[b].hp || a-b; });
  for(var k=0;k<order.length;k++){
    /* keep a small parts reserve so research is still reachable */
    if(st.res.parts < repairCost(st.map[order[k]].hp)+4) break;
    if(!doRepair(st,order[k]).ok) break;     /* out of idle labour for this turn */
  }
}
function policyResearch(st){
  for(var pass=0;pass<3;pass++){
    var bestId=null, bestCost=1e9;
    for(var i=0;i<RES_IDS.length;i++){
      var id=RES_IDS[i];
      if(resStatus(st,id)!=='available') continue;
      var c=RES_TREE[id].cost;
      if(st.res.scrip<c.scrip+15 || st.res.parts<c.parts+4) continue;
      if(c.scrip<bestCost){ bestCost=c.scrip; bestId=id; }
    }
    if(!bestId) return;
    if(!doResearch(st,bestId).ok) return;
  }
}
function policyTrade(st){
  if(!st.caravan) return;
  var n=pop(st), g, k;
  /* sell surplus raw goods, cheapest-to-hold first */
  var surplus={ash:60, ore:45, soil:45, metal:70};
  for(g in surplus){
    var keep=surplus[g];
    if(st.res[g]<=keep) continue;
    /* never offer more than the caravan can actually pay for */
    var q=Math.min(st.res[g]-keep, Math.floor(st.caravan.scrip/Math.max(0.5,sellPrice(st,g))));
    if(q>0) doSell(st,g,q);
  }
  /* buy the necessities when thin */
  var wants=[['water',n*4],['food',n*4],['parts',14]];
  for(k=0;k<wants.length;k++){
    g=wants[k][0];
    var target=wants[k][1];
    if(st.res[g]>=target) continue;
    var reserve = (g==='parts') ? 60 : 25;
    var afford=Math.floor(Math.max(0,st.res.scrip-reserve)/buyPrice(st,g));
    var qty=Math.min(target-st.res[g], st.caravan.inv[g]||0, afford);
    if(qty>0) doBuy(st,g,qty);
  }
}
/* Order matters: repairs need idle colonists, so everyone is stood down first
   and only re-assigned at the very end of the player phase. */
function policyTurn(st){
  for(var k=0;k<st.colonists.length;k++) st.colonists[k].at=null;
  policyRepair(st);
  policyBuild(st);
  policyResearch(st);
  policyTrade(st);
  policyAssign(st);
}

/* Headless run. Always starts from a fresh state, so the same seed and the
   same turn count must always produce the same hash. */
function benchmark(seed,turns){
  var st=newState(seed);
  st.endless=true;
  var survived=0;
  for(var t=0;t<turns;t++){
    if(st.phase!=='play') break;
    policyTurn(st);
    endTurn(st);
    var guard=0;
    while(st.pending && guard++<8) resolveChoice(st,bestAiChoice(st));
    survived=st.turn-1;
  }
  return {
    state: st,
    hash: stateHash(st),
    turns: survived,
    pop: pop(st),
    research: st.done.length,
    buildings: (function(){ var n=0; for(var i=0;i<MAPN;i++) if(st.map[i].b) n++; return n; })(),
    res: st.res,
    stats: st.stats,
    morale: Math.round(avgMorale(st)),
    alive: st.phase==='play'
  };
}

/* ========================== 15. TEST SUITE ============================== */

function runTests(){
  var out=[];
  function ok(name,cond,detail){ out.push({name:name, pass:!!cond, detail:detail||''}); }
  function near(a,b,eps){ return Math.abs(a-b)<=(eps||1e-9); }
  var i,k,r;

  var c={rng:1338}, cv=[]; for(i=0;i<5;i++) cv.push(rnd(c));

     'metal '+mBefore+'→'+g.res.metal+', parts '+pBefore+'→'+g.res.parts);

  ok('Placement rejected when resources are short', !canBuild(poor,ashTile,'condenser').ok);

  for(k=0;k<GOODS.length;k++){
    if(s.res[GOODS[k]]<0) negs.push(GOODS[k]);

  ok('Colonist roster length matches reported population', pop(s)===s.colonists.length,

  var badMor=0, badFat=0, badSkill=0, badAt=0;

    var p=s.colonists[k];

    if(p.fat<0||p.fat>100) badFat++;

    if(p.at!==null && (!s.map[p.at].b || BLD[s.map[p.at].b].cap<=0)) badAt++;

  ok('Morale stays clamped to 0..100', badMor===0);
  ok('Fatigue stays clamped to 0..100', badFat===0);
  ok('Skill stays clamped to 1..5', badSkill===0);
  ok('Every assignment points at a real staffable building', badAt===0);
  var badHp=0;
  for(k=0;k<MAPN;k++) if(s.map[k].hp<0||s.map[k].hp>100) badHp++;
  ok('Building integrity stays clamped to 0..100', badHp===0);
  ok('Population never exceeds housing', pop(s)<=housing(s), pop(s)+' of '+housing(s)+' beds');
  var dupes=false, seen={};
  for(k=0;k<s.colonists.length;k++){ if(seen[s.colonists[k].id]) dupes=true; seen[s.colonists[k].id]=1; }
  ok('Colonist ids are unique', !dupes);

  var bt=-1; for(i=0;i<MAPN;i++) if(sd.map[i].t==='ash'){ bt=i; break; }
  doBuild(sd,bt,'condenser');
  sd.turn=30; sd.stormNext=30;
  var hpBefore=sd.map[bt].hp;
  var tries=0, damaged=false;
  while(tries++<25 && !damaged){ sd.stormNext=sd.turn; resolveStorm(sd); if(sd.map[bt].hp<hpBefore) damaged=true; sd.turn++; }
  ok('Ashstorms damage buildings', damaged, 'integrity now '+sd.map[bt].hp+'%');
  ok('Storm raises the water demand multiplier', stormWaterMul(sd)>1);
  var hpDmg=sd.map[bt].hp, partsBefore=sd.res.parts;
  sd.laborUsed=0; for(k=0;k<sd.colonists.length;k++) sd.colonists[k].at=null;
  var rep=doRepair(sd,bt);
  ok('Repair restores integrity and consumes parts',
     rep.ok && sd.map[bt].hp>hpDmg && sd.res.parts<partsBefore,
     hpDmg+'% → '+sd.map[bt].hp+'%, parts '+partsBefore+' → '+sd.res.parts);
  ok('Storm Shutters + Deep Bunkers reduce storm damage',
     (function(){ var q=newState(1); var base=stormDamageMul(q);
       q.done.push('shutters'); q.done.push('bunkers'); return stormDamageMul(q)<base; })());

  /* --- trade --- */
  var tr=newState(1337);
  tr.caravan={inv:{food:10,water:10,metal:5,parts:3,ore:5,soil:5,ash:5},scrip:100,leaves:2};
  var scripBefore=tr.res.scrip, foodBefore=tr.res.food;
  var buy=doBuy(tr,'food',5);
  ok('Buying costs scrip and delivers goods',
     buy.ok && tr.res.scrip<scripBefore && tr.res.food===foodBefore+5,
     'scrip '+scripBefore+' → '+tr.res.scrip);
  ok('Buying is limited by caravan inventory', !doBuy(tr,'parts',99).ok, doBuy(tr,'parts',99).why);
  ok('Selling more than you own is rejected', !doSell(tr,'metal',9999).ok);
  ok('Caravan scrip is finite', !doSell(tr,'food',9999).ok || tr.caravan.scrip>=0);
  var pHigh, pLow;
  var t1=newState(1337); t1.res.metal=5;  pHigh=unitPrice(t1,'metal');
  var t2=newState(1337); t2.res.metal=130; pLow=unitPrice(t2,'metal');
  ok('Prices fall as your own stockpile rises', pLow<pHigh,
     pHigh.toFixed(2)+' at 5 metal → '+pLow.toFixed(2)+' at 130 metal');
  ok('Buy price is above sell price (caravan margin)',
     buyPrice(t1,'metal')>sellPrice(t1,'metal'));

    if(ev.log.length>before){ for(var q in ev.evtCd) if(ev.evtCd[q]>ev.turn) fired=q; } }
  ok('Event deck fires events', !!fired, fired?EVENTS[fired].n:'none in 400 rolls');
  if(fired){
    ok('Fired events go on cooldown', ev.evtCd[fired]>ev.turn,

  var choiceCount=0, autoCount=0;

  ok('Deck has at least 10 events, 4+ with choices',

  var ch=newState(1337);

  var popBefore=pop(ch), moraleBefore=avgMorale(ch);

  /* --- needs / morale consequences --- */
  var hun=newState(1337);
  hun.res.food=0; hun.res.water=0;

  hun.waterMul=1;

  ok('Shortages are logged as visible consequences',

  var lv=newState(1337);
  for(k=0;k<lv.colonists.length;k++) lv.colonists[k].mor=0;
  lv.colonists[0].zero=1;
  var beforeN=pop(lv);
  lv.res.food=0; lv.res.water=0;

     beforeN+' → '+pop(lv)+' colonists');
  var refuse=newState(1337);
  refuse.colonists[0].mor=10;
  ok('Colonists below 20 morale refuse to work (zero output)',
     workerEff(refuse.colonists[0],'condenser')===0);

  /* --- storage overflow --- */
  var ov=newState(1337);
  ov.res.ash=capOf(ov,'ash');
  var logBefore=ov.log.length;
  endTurn(ov);
  ok('Overflow is capped and logged',
     ov.res.ash<=capOf(ov,'ash') &&
     ov.log.slice(logBefore).some(function(l){ return l.m.indexOf('overflow')>=0; }),
     'ash '+ov.res.ash+' / '+capOf(ov,'ash'));

  /* --- save / load round trip --- */
  var rt=benchmark(1337,25).state;
  var text=serialize(rt);
  var back=deserialize(text);
  ok('Save/load round-trips to an identical state hash',
     back.ok && stateHash(back.state)===stateHash(rt),
     back.ok ? stateHash(rt) : back.errors.join(' | '));
  ok('Loaded state continues to the same future as the original',
     (function(){
       if(!back.ok) return false;
       var x=JSON.parse(serialize(rt)), y=back.state;
       for(var n=0;n<5;n++){
         policyTurn(x); endTurn(x); while(x.pending) resolveChoice(x,bestAiChoice(x));
         policyTurn(y); endTurn(y); while(y.pending) resolveChoice(y,bestAiChoice(y));
       }
       return stateHash(x)===stateHash(y);
     })());
  ok('Bad JSON is rejected with a clear error',
     !deserialize('{not json').ok && deserialize('{not json').errors[0].indexOf('Not valid JSON')===0,
     deserialize('{not json').errors[0]);
  ok('Structurally invalid save is rejected',
     (function(){ var bad=JSON.parse(text); bad.map=bad.map.slice(0,3);
       var res=deserialize(JSON.stringify(bad)); return !res.ok && res.errors.length>0; })(),
     deserialize(JSON.stringify((function(){var b=JSON.parse(text); b.map=b.map.slice(0,3); return b;})())).errors[0]);
  ok('Negative resources in a save are rejected',
     (function(){ var bad=JSON.parse(text); bad.res.food=-5;
       return !deserialize(JSON.stringify(bad)).ok; })());
  ok('Unknown research id in a save is rejected',
     (function(){ var bad=JSON.parse(text); bad.done=bad.done.concat(['warp_drive']);
       return !deserialize(JSON.stringify(bad)).ok; })());

  /* --- benchmark determinism --- */
  var b1=benchmark(4242,40), b2=benchmark(4242,40);
  ok('Benchmark is reproducible from the same seed', b1.hash===b2.hash, b1.hash+' = '+b2.hash);
  var b3=benchmark(4243,40);
  ok('Benchmark differs across seeds', b1.hash!==b3.hash, b1.hash+' vs '+b3.hash);

  /* --- game is actually winnable and losable --- */
  var loseSt=newState(1337);
  loseSt.colonists=[];
  finishTurn(loseSt);
  ok('Zero population is a loss', loseSt.phase==='lost');
  var winSt=newState(1337);
  winSt.turn=WIN_TURN;
  while(pop(winSt)<WIN_POP) winSt.colonists.push(makeColonist(winSt,'grow'));
  for(k=0;k<winSt.colonists.length;k++) winSt.colonists[k].mor=80;
  winSt.res.food=99; winSt.res.water=99; winSt.hist=[];
  finishTurn(winSt);
  ok('Turn '+WIN_TURN+' with '+WIN_POP+'+ pop and needs met is a win', winSt.phase==='won',
     'phase = '+winSt.phase);

  var passed=out.filter(function(o){return o.pass;}).length;
  return {results:out, passed:passed, total:out.length};
}

/* ---- resource strip ---------------------------------------------------- */
function flowLines(g){
  var f=G.flow[g], lines=[];
  if(f){
    var keys=Object.keys(f).sort();
    for(var i=0;i<keys.length;i++){
      var v=f[keys[i]];
      if(Math.abs(v)<0.05) continue;
      lines.push('  '+(v>0?'+':'')+fmt(v)+'  '+keys[i]);
    }
  }
  if(G.over[g]) lines.push('  −'+G.over[g]+'  lost to overflow');
  return lines;
}
function netFlow(g){
  var f=G.flow[g], n=0;
  if(f) for(var k in f) n+=f[k];
  return n;
}
function renderRes(){
  var strip=$('resStrip');
  strip.innerHTML='';
  for(var i=0;i<GOODS.length;i++){
    var g=GOODS[i], v=G.res[g], cap=capOf(G,g), net=netFlow(g);
    var lines=flowLines(g);
    var tip=GOOD_LABEL[g].toUpperCase()+'\n'+v+' stored'+(g==='scrip'?'':' of '+cap+' capacity')+
      '\n\nLast turn:\n'+(lines.length?lines.join('\n'):'  (no change)')+
      '\n  = net '+sgn(net);
    if(g==='power') tip+='\n\nPower is generated and spent in the same turn.\nOnly '+cap+' can be buffered; the rest is lost.';
    if(g==='ash')   tip+='\n\nAsh falls from the sky every turn.\nAsh Kilns bake it into soil.';
    if(g==='scrip') tip+='\n\nScrip buys research and caravan goods.\nIt has no storage limit.';
    var cls='chip';
    if(g!=='scrip' && v>=cap) cls+=' full';
    if((g==='food'||g==='water') && v<pop(G)*2) cls+=' low';
    var arrow = net>0.05?'▲':(net<-0.05?'▼':'·');
    var acls  = net>0.05?'up':(net<-0.05?'dn':'flat');
    var c=el('div',cls,
      '<span class="k">'+GOOD_LABEL[g]+'</span><span class="v mono">'+v+'</span>'+
      '<span class="d mono '+acls+'">'+arrow+fmt(Math.abs(net))+'</span>');
    c.setAttribute('data-tip',tip);
    strip.appendChild(c);
  }
}

function bldTip(st,i){
  var tile=st.map[i], L=[];
  L.push('TILE '+coord(i)+' — '+TERR[tile.t].n);
  L.push(TERR[tile.t].d);
  if(!tile.b){
    L.push('');
    L.push('Empty. Click to open the build menu.');
    return L.join('\n');
  }
  var b=BLD[tile.b], rep=bldReport(st,i);
  L.push('');
  L.push(b.n.toUpperCase()+'  —  integrity '+Math.round(tile.hp)+'%');
  L.push(b.d);
  if(rep.disabled) L.push('!! DISABLED: integrity below 35%. Repair to restore output.');
  L.push('');
  if(b.cap>0){
    L.push('Workers ('+rep.workers.length+'/'+b.cap+'), preferred job: '+JOBS[b.job].n);
    if(!rep.workers.length) L.push('  none — this building produces nothing');
    rep.workers.forEach(function(w){
      var e=w.e;
      L.push('  '+w.c.name+(e.refuse?' — REFUSING (morale below 20)':''));
      if(!e.refuse) L.push('    skill '+w.c.skill+' ×'+e.skill.toFixed(2)+
        ' · morale '+w.c.mor+' ×'+e.mor.toFixed(2)+
        ' · fatigue '+w.c.fat+' ×'+e.fat.toFixed(2)+
        ' · '+(e.match===1?'job match ×1.00':'wrong job ×0.55')+
        '  = '+e.total.toFixed(2));
    });
    L.push('  total worker efficiency = '+rep.eff.toFixed(2));
  } else {
    L.push('Passive structure — takes no workers.');
    if(tile.b==='shelter') L.push('  +'+b.house+' housing (outpost total '+housing(st)+')');
    if(tile.b==='depot')   L.push('  +80 to every storage cap');
    if(tile.b==='wind')    L.push('  shields '+(function(){var n=0,r=ring8(i);
      for(var q=0;q<r.length;q++) if(st.map[r[q]].b) n++; return n;})()+' neighbouring buildings');
  }
  if(b.adjT){
    L.push('');
    L.push('Adjacency: +'+b.adjT.per+' '+GOOD_LABEL[b.adjT.res]+' per adjacent '+TERR[b.adjT.t].n+
      ' (max '+b.adjT.max+')');
    L.push('  '+rep.adj.n+' adjacent, '+rep.adj.used+' counted = +'+rep.adj.v.toFixed(2)+' base rate');
  }
  if(rep.adjB) L.push('Adjacency: '+rep.adjB.label);
  if(b.ventCheap) L.push('Vent heat: power cost per metal −29% when next to a Vent'+
    (adjBonus(st,i,tile.b).n>0?' (ACTIVE)':' (not adjacent)'));
  if(rep.mods.length){
    L.push('');
    L.push('Research modifiers:');
    rep.mods.forEach(function(m){ L.push('  ×'+m.v.toFixed(2)+'  '+m.s); });
  }
  if(tile.hp<100) L.push('\nIntegrity multiplier ×'+rep.intF.toFixed(2)+
    ' (repair costs '+repairCost(tile.hp)+' parts + 1 idle colonist)');
  var g;
  if(b.out || b.conv){
    L.push('');
    L.push('Output this turn:');
    var any=false;
    for(g in rep.rates){ if(rep.rates[g]>0.001){ L.push('  '+sgn(rep.rates[g])+' '+GOOD_LABEL[g]); any=true; } }
    if(b.conv){
      L.push('  '+sgn(rep.wantOut)+' '+GOOD_LABEL[rep.outGood]+' (if inputs allow)');
      for(g in rep.needs) L.push('    costs '+fmt(rep.needs[g]*rep.wantOut)+' '+GOOD_LABEL[g]);
      any=true;
    }
    if(!any) L.push('  nothing — needs workers or repair');
  }
  return L.join('\n');
}

/* Dry-run projection of next turn's net change, ignoring storms/events. */
function projection(st){
  var pool={}, flow={}, g;
  for(g in st.res) pool[g]=st.res[g];
  var ashTiles=0;
  for(var i=0;i<MAPN;i++) if(st.map[i].t==='ash') ashTiles++;
  pool.ash+=Math.round(2+0.35*ashTiles);
  runPhase(st,pool,PHASE_POWER,flow);
  runPhase(st,pool,PHASE_EXTRACT,flow);
  runPhase(st,pool,PHASE_REFINE,flow);
  runPhase(st,pool,PHASE_FARM,flow);
  pool.food-=pop(st); pool.water-=pop(st);
  var out={};
  for(g in pool) out[g]=Math.min(pool[g],capOf(st,g))-st.res[g];
  return out;
}

  sorted.forEach(function(c){
    var it=el('div','item');
    var where = c.at===null ? 'Resting' : (BLD[G.map[c.at].b].n+' @'+coord(c.at));
    var refuse=c.mor<20;
    var moodWord = c.mor>=75?'steady':(c.mor>=50?'wearing':(c.mor>=20?'bitter':'breaking'));
    var fatWord  = c.fat>=75?'exhausted':(c.fat>=45?'tired':'rested');
    var needXp=8+c.skill*6;
    it.innerHTML=
      '<div class="hd"><span class="nm">'+esc(c.name)+'</span>'+
      '<span class="tag">'+JOBS[c.job].n+'</span>'+
      '<span class="tag" data-tip="Skill '+c.skill+' of 5. Output multiplier ×'+(0.55+0.22*c.skill).toFixed(2)+
        '.\nProgress to next level: '+c.xp+' / '+needXp+' turns of matching work.">skill '+c.skill+'/5</span>'+
      '<span class="tag'+(refuse?' no':'')+'">'+esc(where)+'</span>'+
      (refuse?'<span class="tag no">REFUSING WORK</span>':'')+
      (c.zero>0?'<span class="tag no">LEAVING NEXT TURN</span>':'')+'</div>'+
      '<div class="row small" style="margin-top:4px">'+
        '<span style="min-width:52px">Morale</span>'+
        '<span class="bar mor'+(c.mor<35?' lo':'')+'" data-tip="Morale '+c.mor+'/100 ('+moodWord+').\n'+
          'Output multiplier ×'+(0.45+0.0055*c.mor).toFixed(2)+'.\nShortages −15 food / −18 water per turn.\n'+
          'Below 20 they refuse to work; at 0 for two turns they leave.">'+
          '<i style="width:'+c.mor+'%"></i></span>'+
        '<span class="mono" style="min-width:56px">'+c.mor+' '+esc(moodWord)+'</span>'+
      '</div>'+
      '<div class="row small" style="margin-top:2px">'+
        '<span style="min-width:52px">Fatigue</span>'+
        '<span class="bar fat'+(c.fat>70?' lo':'')+'" data-tip="Fatigue '+c.fat+'/100 ('+fatWord+').\n'+
          'Output multiplier ×'+(1-0.005*c.fat).toFixed(2)+'.\nWorking adds fatigue each turn; resting removes '+
          (has(G,'medbay')?27:18)+'.\nAbove 70 fatigue costs 6 morale a turn.">'+
          '<i style="width:'+c.fat+'%"></i></span>'+
        '<span class="mono" style="min-width:56px">'+c.fat+' '+esc(fatWord)+'</span>'+
      '</div>';
    var row=el('div','row'); row.style.marginTop='5px';
    var sel=el('select');
    sel.innerHTML='<option value="">— Resting —</option>';
    for(var i=0;i<MAPN;i++){
      var bid=G.map[i].b;
      if(!bid || BLD[bid].cap<=0) continue;
      var full=workersAt(G,i).length>=BLD[bid].cap && c.at!==i;
      sel.innerHTML+='<option value="'+i+'"'+(c.at===i?' selected':'')+(full?' disabled':'')+'>'+
        esc(BLD[bid].n)+' @'+coord(i)+' ('+workersAt(G,i).length+'/'+BLD[bid].cap+')'+
        (BLD[bid].job===c.job?' ★':'')+'</option>';
    }
    sel.onchange=function(){
      var v=sel.value===''?null:parseInt(sel.value,10);
      var r=assign(G,c.id,v);
      status(r.ok?'':r.why); render();
    };
    sel.setAttribute('data-tip','Assign '+c.name+' to a building. ★ marks a job match (×1.00 instead of ×0.55).');
    row.appendChild(sel);
    it.appendChild(row);
    list.appendChild(it);
  });
  if(!sorted.length) list.appendChild(el('div','small no','Nobody is left alive at the outpost.'));
  card.appendChild(list);
  p.appendChild(card);

  var jobs=el('div','card');
  jobs.appendChild(el('h3',null,'Jobs'));
  var t='<table><tr><th>Job</th><th>Works</th><th class="n">Count</th></tr>';
  JOB_IDS.forEach(function(j){
    var cnt=G.colonists.filter(function(c){return c.job===j;}).length;
    var blds=BLD_IDS.filter(function(b){return BLD[b].job===j;}).map(function(b){return BLD[b].n;}).join(', ');
    t+='<tr><td>'+JOBS[j].n+'</td><td class="small muted">'+esc(blds)+'</td><td class="n mono">'+cnt+'</td></tr>';
  });
  t+='</table>';
  jobs.appendChild(el('div',null,t));
  jobs.appendChild(el('div','small muted',
    'A colonist working outside their job produces at ×0.55. Skill rises from matching work at double rate.'));
  p.appendChild(jobs);
}

/* ---- research panel ---------------------------------------------------- */
function renderResearch(){
  var p=$('p-research');
  p.innerHTML='';
  var card=el('div','card');
  var doneN=G.done.length;
  card.appendChild(el('h3',null,'Research — '+doneN+' of '+RES_IDS.length+' complete'));
  card.appendChild(el('div','small muted',
    'Nodes complete instantly when bought. Scrip comes from Salvage Yards, Markets and trade; parts come from Workshops.'));
  card.appendChild(el('div','sep'));
  var tree=el('div','tree');
  RES_IDS.forEach(function(id){
    var node=RES_TREE[id], stt=resStatus(G,id);
    var n=el('div','node '+(stt==='done'?'done':stt==='available'?'avail':'lock'));
    var mark = stt==='done'?'✔ DONE':stt==='available'?'▶ AVAILABLE':'🔒 LOCKED';
    var preTxt = node.pre.length ? node.pre.map(function(q){
        return (has(G,q)?'✔ ':'✗ ')+RES_TREE[q].n; }).join(', ') : 'no prerequisites';
    n.innerHTML='<div class="hd"><span class="nm">'+esc(node.n)+'</span>'+
      '<span class="tag '+(stt==='done'?'ok':stt==='available'?'hl':'no')+'">'+mark+'</span></div>'+
      '<div class="small">'+esc(node.d)+'</div>'+
      '<div class="small muted" style="margin-top:3px">Requires: '+esc(preTxt)+'</div>'+
      '<div class="small" style="margin-top:3px">Cost: '+node.cost.scrip+' scrip, '+node.cost.parts+' parts</div>';
    if(stt!=='done'){
      var btn=el('button',null,'Research');
      var afford=G.res.scrip>=node.cost.scrip && G.res.parts>=node.cost.parts;
      btn.disabled = stt!=='available' || !afford;
      var missing=node.pre.filter(function(q){ return !has(G,q); })
                          .map(function(q){ return RES_TREE[q].n; });
      var why = stt==='locked' ? 'Requires: '+missing.join(', ')
              : (!afford ? 'Need '+node.cost.scrip+' scrip and '+node.cost.parts+' parts (have '+
                   G.res.scrip+' scrip, '+G.res.parts+' parts)' : 'Complete '+node.n+' now.');
      btn.setAttribute('data-tip',why+'\n\nEffect: '+node.d);
      btn.onclick=function(){ var r=doResearch(G,id); status(r.ok?('Researched '+node.n+'.'):r.why); render(); };
      var row=el('div','row'); row.style.marginTop='5px'; row.appendChild(btn);
      if(btn.disabled) row.appendChild(el('span','small muted',esc(stt==='locked'?'Prerequisites missing':'Cannot afford')));
      n.appendChild(row);
    }
    tree.appendChild(n);
  });
  card.appendChild(tree);
  p.appendChild(card);

  var eff=el('div','card');
  eff.appendChild(el('h3',null,'Active Effects'));
  if(!G.done.length) eff.appendChild(el('div','small muted','Nothing researched yet.'));
  else {
    var l=el('div','list');
    G.done.forEach(function(id){
      l.appendChild(el('div','item','<span class="nm">✔ '+esc(RES_TREE[id].n)+'</span>'+
        '<div class="small muted">'+esc(RES_TREE[id].d)+'</div>'));
    });
    eff.appendChild(l);
  }
  eff.appendChild(el('div','sep'));
  eff.appendChild(el('div','small',
    'Storm damage multiplier: <b>×'+stormDamageMul(G).toFixed(2)+'</b> · '+
    'Storm water spike: <b>×'+stormWaterMul(G).toFixed(1)+'</b> · '+
    'Food cap: <b>'+capOf(G,'food')+'</b> · Caravan margin: <b>'+Math.round(tradeMargin(G)*100)+'%</b>'));
  p.appendChild(eff);
}

        'Base '+BASE_PRICE[g]+' × index × stockpile factor\n'+
        'You hold '+G.res[g]+' of '+capOf(G,g)+' — the more you hold, the less it is worth.';
      tr.innerHTML='<td>'+GOOD_LABEL[g]+'</td>'+
        '<td class="n mono">'+G.res[g]+'</td>'+
        '<td class="n mono">'+(G.caravan.inv[g]||0)+'</td>'+
        '<td class="n mono" data-tip="'+esc('Buy at '+bp.toFixed(1)+' scrip each.\n'+idxTip)+'">'+bp.toFixed(1)+'</td>'+
        '<td class="n mono" data-tip="'+esc('Sell at '+sp.toFixed(1)+' scrip each.\n'+idxTip)+'">'+sp.toFixed(1)+'</td>';
      var qc=el('td'), inp=el('input');

      var bc=el('td'), row=el('div','row');
      var bb=el('button',null,'Buy'), sb=el('button',null,'Sell');

      sb.setAttribute('data-tip','Sell '+qty+' '+GOOD_LABEL[g]+' for about '+Math.floor(sp*qty)+' scrip.');
      bb.onclick=function(){ var r=doBuy(G,g,UI.tradeQty[g]||5); status(r.ok?'Bought.':r.why); render(); };
      sb.onclick=function(){ var r=doSell(G,g,UI.tradeQty[g]||5); status(r.ok?'Sold.':r.why); render(); };
      row.appendChild(bb); row.appendChild(sb); bc.appendChild(row); tr.appendChild(bc);
      t.appendChild(tr);
    });
    card.appendChild(t);
