  p.appendChild(card);

  var mk=el('div','card');
  mk.appendChild(el('h3',null,'Global Price Index'));
  mk.appendChild(el('div','small muted',
    'The index drifts every turn by up to ±4.5% and can be shocked by events. It is clamped to 0.60–1.70. '+
    'Your own stockpile then scales the price by 1.35 − 0.7 × (stock ÷ cap), clamped to 0.62–1.50.'));
  var mt='<table><tr><th>Good</th><th class="n">Index</th><th class="n">Stock factor</th><th class="n">Unit value</th></tr>';
  TRADE_GOODS.forEach(function(g){
    var sf=clamp(1.35-0.7*(G.res[g]/capOf(G,g)),0.62,1.5);
    var dir=G.market[g]>1.08?'▲ high':(G.market[g]<0.92?'▼ low':'· normal');
    mt+='<tr><td>'+GOOD_LABEL[g]+'</td><td class="n mono">'+G.market[g].toFixed(2)+' '+dir+
      '</td><td class="n mono">'+sf.toFixed(2)+'</td><td class="n mono">'+unitPrice(G,g).toFixed(2)+'</td></tr>';
  });
  mt+='</table>';
  mk.appendChild(el('div',null,mt));
  p.appendChild(mk);
}

/* ---- dev panel --------------------------------------------------------- */
function renderDev(){
  var p=$('p-dev');
  p.innerHTML='';

  var seedCard=el('div','card');
  seedCard.appendChild(el('h3',null,'Seed & New Game'));
  var srow=el('div','row');
  var si=el('input'); si.type='number'; si.value=G.seed; si.style.width='120px'; si.id='seedInput';
  si.setAttribute('data-tip','The PRNG seed. Terrain, storms, events and caravans all derive from it.\nDefault is 1337.');
  var nb=el('button','pri','New Game From Seed');
  nb.setAttribute('data-tip','Discard the current run and generate a fresh outpost from this seed.');
  nb.onclick=function(){
    var v=parseInt(si.value,10);
    if(isNaN(v)){ status('Seed must be a whole number.'); return; }
    G=newState(v>>>0); UI.sel=null; UI.ended=false; status('New game from seed '+(v>>>0)+'.'); render();
  };
  srow.appendChild(el('span','small','Seed'));
  srow.appendChild(si); srow.appendChild(nb);
  seedCard.appendChild(srow);
  seedCard.appendChild(el('div','small muted','Current PRNG cursor: '+G.seed+' → '+G.rng+
    ' · state hash <span class="mono">'+stateHash(G)+'</span>'));
  p.appendChild(seedCard);

  var testCard=el('div','card');
  testCard.appendChild(el('h3',null,'Verification'));
  var trow=el('div','row');
  var tb=el('button','pri','Run Tests');
  tb.setAttribute('data-tip','Runs the invariant suite against freshly simulated states.\nYour live game is never touched.');
  tb.onclick=function(){
    var r=runTests();
    var lines=r.results.map(function(o,i){
      return (o.pass?'PASS':'FAIL')+'  '+String(i+1).padStart(2,'0')+'. '+o.name+(o.detail?'\n         → '+o.detail:'');
    });
    UI.devOut='TEST RESULTS — '+r.passed+' / '+r.total+' passed'+
      (r.passed===r.total?'  (all green)':'  *** '+(r.total-r.passed)+' FAILED ***')+
      '\n'+'-'.repeat(52)+'\n'+lines.join('\n');
    render();
  };
  var bb=el('button','pri','Run Benchmark');
  bb.setAttribute('data-tip','Headless 200-turn simulation from the current seed using the built-in greedy policy.\n'+
    'Prints a state hash; running it twice on the same seed must print the same hash.');
  bb.onclick=function(){
    var t0=(typeof performance!=='undefined'&&performance.now)?performance.now():0;
    var r=benchmark(G.seed,200);
    var t1=(typeof performance!=='undefined'&&performance.now)?performance.now():0;
    var r2=benchmark(G.seed,200);
    var lines=[];
    lines.push('BENCHMARK — greedy policy, 200 turns, seed '+G.seed);
    lines.push('-'.repeat(52));
    lines.push('FINAL STATE HASH : '+r.hash);
    lines.push('REPEAT RUN HASH  : '+r2.hash+'   '+(r.hash===r2.hash?'✔ identical (deterministic)':'✘ MISMATCH'));
    lines.push('');
    lines.push('Turns simulated  : '+r.turns+(r.alive?' (outpost still standing)':' (outpost died out)'));
    lines.push('Population       : '+r.pop+'   peak '+r.stats.peak);
    lines.push('Average morale   : '+r.morale);
    lines.push('Research done    : '+r.research+' / '+RES_IDS.length);
    lines.push('Buildings        : '+r.buildings);
    lines.push('Ashstorms        : '+r.stats.storms+'   repairs '+r.stats.repairs);
    lines.push('Joined / lost    : '+r.stats.joined+' / '+r.stats.left);
    lines.push('Shortage turns   : '+r.stats.starved+' food, '+r.stats.thirsted+' water');
    lines.push('Overflow lost    : '+r.stats.overflow);
    lines.push('');
    lines.push('Final stores     : '+GOODS.map(function(g){return GOOD_LABEL[g]+' '+r.res[g];}).join(', '));
    lines.push('Score            : '+score(r.state).total);
    if(t1>t0) lines.push('Wall clock       : '+Math.round(t1-t0)+' ms per run');
    UI.devOut=lines.join('\n');
    render();
  };
  trow.appendChild(tb); trow.appendChild(bb);
  var cb=el('button',null,'Clear Output');
  cb.setAttribute('data-tip','Clear the output box below.');
  cb.onclick=function(){ UI.devOut=null; render(); };
  trow.appendChild(cb);
  testCard.appendChild(trow);
  if(UI.devOut){
    var pre=el('pre'); pre.textContent=UI.devOut;
    pre.style.marginTop='7px';
    testCard.appendChild(pre);
  } else {
    testCard.appendChild(el('div','small muted',
      'Run Tests checks 60 invariants (resource floors, storage caps, roster integrity, '+
      'research prerequisites, storm and repair behaviour, trade limits, event cooldowns, '+
      'save/load hash round-trip). Run Benchmark simulates 200 turns headlessly, twice, and compares hashes.'));
  }
  p.appendChild(testCard);

  var saveCard=el('div','card');
  saveCard.appendChild(el('h3',null,'Save / Load (copy-paste only — no browser storage)'));
  var ta=el('textarea'); ta.id='saveBox';
  ta.setAttribute('spellcheck','false');
  ta.placeholder='Press "Serialize to Textarea", then copy this text somewhere safe. Paste a save back here and press "Load From Textarea".';
  ta.value=UI.saveText||'';                 /* survives re-renders */
  ta.oninput=function(){ UI.saveText=ta.value; };
  saveCard.appendChild(ta);
  var row=el('div','row'); row.style.marginTop='6px';
  var sv=el('button','pri','Serialize to Textarea');
  sv.setAttribute('data-tip','Write the complete game state into the box above as JSON.');
  sv.onclick=function(){
    UI.saveText=serialize(G);
    UI.loadMsg={ok:true,text:'Serialized '+UI.saveText.length+' characters. State hash '+stateHash(G)+'.'};
    render();
  };
  var ld=el('button','pri','Load From Textarea');
  ld.setAttribute('data-tip','Validate and load the JSON in the box. Bad input is rejected with a reason.');
  ld.onclick=function(){
    UI.saveText=$('saveBox').value;
    var res=deserialize(UI.saveText);
    if(!res.ok){ UI.loadMsg={ok:false,text:'Load failed:\n• '+res.errors.slice(0,6).join('\n• ')}; render(); return; }
    G=res.state; UI.sel=null; UI.ended=false;
    UI.loadMsg={ok:true,text:'Loaded turn '+G.turn+' — '+pop(G)+' colonists. State hash '+stateHash(G)+'.'};
    render();
  };
  var cp=el('button',null,'Select All');
  cp.setAttribute('data-tip','Select the text so you can copy it with Ctrl+C / Cmd+C.');
  cp.onclick=function(){ var b=$('saveBox'); b.focus(); b.select(); };
  row.appendChild(sv); row.appendChild(ld); row.appendChild(cp);
  saveCard.appendChild(row);
  if(UI.loadMsg){
    var m=el('div','small '+(UI.loadMsg.ok?'ok':'no'));
    m.style.whiteSpace='pre-wrap'; m.style.marginTop='6px';
    m.textContent=UI.loadMsg.text;
    saveCard.appendChild(m);
  }
  p.appendChild(saveCard);
}

/* ---- modal / end screen ------------------------------------------------ */
function showModal(html,onClose){
  var s=$('scrim'), m=$('modal');
  m.innerHTML='';
  m.appendChild(html);
  s.hidden=false;
  UI.modalClose=onClose||null;
}
function hideModal(){ $('scrim').hidden=true; UI.modalClose=null; }

function renderPending(){
  if(!G.pending){ if($('scrim').hidden===false && UI.modalKind==='event') hideModal(); return; }
  var box=el('div');
  box.appendChild(el('h2',null,'EVENT — '+esc(G.pending.name)));
  box.appendChild(el('div','small',esc(G.pending.text)));
  box.appendChild(el('div','sep'));
  G.pending.opts.forEach(function(o,i){
    var b=el('button','choice','<b>'+esc(o.t)+'</b><br><span class="small muted">'+esc(o.d)+'</span>');
    b.setAttribute('data-tip',o.d);
    b.onclick=function(){ resolveChoice(G,i); UI.modalKind=null; hideModal(); render(); };
    box.appendChild(b);
  });
  box.appendChild(el('div','small muted','This decision must be made before the next turn can begin.'));
  UI.modalKind='event';
  showModal(box);
}

function renderEnd(){
  if(G.phase==='play' || UI.ended) return;
  UI.ended=true;
  var sc=score(G);
  var box=el('div');
  box.appendChild(el('h2',null, G.phase==='won' ? 'THE OUTPOST HOLDS' : 'THE OUTPOST FAILS'));
  box.appendChild(el('div','small', G.phase==='won'
    ? 'Turn '+G.turn+'. '+pop(G)+' colonists, stores in hand, needs met. The relief convoy finds people, not a ruin.'
    : (pop(G)<=0
        ? 'Turn '+G.turn+'. The last colonist is gone. The ash finishes what it started.'
        : 'Turn '+G.turn+'. The outpost survives, but not on the terms that were set: '+
          (pop(G)<WIN_POP?'population '+pop(G)+' of '+WIN_POP+' required. ':'')+
          (!criticalNeedsMet(G)?'Critical needs were not met (food and water at or above population, average morale 50+, no shortage in the last 3 turns).':''))));
  box.appendChild(el('div','sep'));
  var t='<table><tr><th>Component</th><th class="n">Points</th></tr>';
  sc.parts.forEach(function(p){
    t+='<tr><td>'+esc(p[0])+'</td><td class="n mono '+(p[1]<0?'no':'')+'">'+p[1]+'</td></tr>';
  });
  t+='<tr><th>FINAL SCORE</th><th class="n mono">'+sc.total+'</th></tr></table>';
  box.appendChild(el('div',null,t));
  box.appendChild(el('div','sep'));
  var stats=el('div','small muted');
  stats.innerHTML='Storms weathered '+G.stats.storms+' · buildings raised '+G.stats.built+
    ' · repairs '+G.stats.repairs+' · joined '+G.stats.joined+' · lost '+G.stats.left+
    ' · research '+G.done.length+'/'+RES_IDS.length;
  box.appendChild(stats);
  var row=el('div','row'); row.style.marginTop='9px';
  var again=el('button','pri','New Game (same seed)');
  again.onclick=function(){ G=newState(G.seed); UI.sel=null; UI.ended=false; hideModal(); render(); };
  var next=el('button',null,'New Game (seed +1)');
  next.onclick=function(){ G=newState((G.seed+1)>>>0); UI.sel=null; UI.ended=false; hideModal(); render(); };
  var close=el('button',null,'Review Final State');
  close.onclick=function(){ hideModal(); render(); };
  row.appendChild(again); row.appendChild(next); row.appendChild(close);
  box.appendChild(row);
  UI.modalKind='end';
  showModal(box);
}

/* ---- status line, tooltip, render -------------------------------------- */
/* Handlers call status() then render(); render shows the queued message once
   and then falls back to the standing advisory line. */
function status(msg){ if(msg) UI.msg=msg; }
function defaultStatus(){
  if(G.phase!=='play') return G.phase==='won'?'Victory — turn '+G.turn+'.':'Run over — turn '+G.turn+'.';
  if(G.pending) return 'A decision is waiting.';
  var bits=[];
  var proj=projection(G);
  if(G.res.food+proj.food<0 || G.res.food<pop(G)) bits.push('food is short');
  if(G.res.water+proj.water<0 || G.res.water<pop(G)) bits.push('water is short');
  var dmg=0; for(var i=0;i<MAPN;i++) if(G.map[i].b&&G.map[i].hp<100) dmg++;
  if(dmg) bits.push(dmg+' building'+(dmg===1?'':'s')+' need repair');
  if(pop(G)>=housing(G)) bits.push('no spare beds');
  var idle=idleColonists(G).length;
  if(idle) bits.push(idle+' idle');
  return bits.length ? ('Attention: '+bits.join(', ')+'.') : 'Outpost steady. Space ends the turn.';
}

function setupTooltips(){
  var tip=$('tip'), cur=null;
  function place(x,y){
    tip.hidden=false;
    var r=tip.getBoundingClientRect();
    var nx=x+14, ny=y+16;
    if(nx+r.width>window.innerWidth-6) nx=Math.max(6,window.innerWidth-r.width-6);
    if(ny+r.height>window.innerHeight-6) ny=Math.max(6,y-r.height-12);
    tip.style.left=nx+'px'; tip.style.top=ny+'px';
  }
  function show(target,x,y){
    var txt=target.getAttribute('data-tip');
    if(!txt){ hide(); return; }
    cur=target;
    tip.textContent=txt;
    place(x,y);
  }
  function hide(){ tip.hidden=true; cur=null; }
  document.addEventListener('mouseover',function(e){
    var t=e.target.closest ? e.target.closest('[data-tip]') : null;
    if(t) show(t,e.clientX,e.clientY); else hide();
  });
  document.addEventListener('mousemove',function(e){
    if(cur && cur.isConnected) place(e.clientX,e.clientY); else if(cur) hide();
  });
  document.addEventListener('mouseout',function(e){
    if(cur && !(e.relatedTarget && cur.contains && cur.contains(e.relatedTarget))) hide();
  });
  /* touch: tap a tooltip target to pin it, tap anywhere else to dismiss */
  document.addEventListener('touchstart',function(e){
    var t=e.target.closest ? e.target.closest('[data-tip]') : null;
    if(t){ var to=e.touches[0]; show(t,to.clientX,to.clientY);
      setTimeout(function(){ if(cur===t) hide(); },4500); }
    else hide();
  },{passive:true});
  window.addEventListener('scroll',hide,{passive:true});
  window.addEventListener('resize',hide);
}

function render(){
  renderHeader();
  renderRes();
  renderTabs();
  if(UI.tab==='map') renderMap();
  if(UI.tab==='people') renderPeople();
  if(UI.tab==='research') renderResearch();
  if(UI.tab==='trade') renderTrade();
  if(UI.tab==='log') renderLog();
  if(UI.tab==='dev') renderDev();
  $('btnEnd').disabled = (G.phase!=='play') || !!G.pending;
  $('btnEnd').innerHTML = G.phase!=='play' ? 'Run Over' : 'End Turn <span class="muted">[Space]</span>';
  $('statusLine').textContent = UI.msg || defaultStatus();
  UI.msg=null;
  renderPending();
  renderEnd();
}

function doEndTurn(){
  if(G.phase!=='play' || G.pending) return;
  endTurn(G);
  render();
}

/* ---- boot -------------------------------------------------------------- */
function boot(){
  G=newState(1337);
  setupTooltips();
  $('btnEnd').onclick=doEndTurn;
  $('btnEnd').setAttribute('data-tip','Resolve one turn in the fixed order documented in the Log tab.');
  $('scrim').addEventListener('click',function(e){
    if(e.target===$('scrim') && UI.modalKind!=='event'){ hideModal(); render(); }
  });
  document.addEventListener('keydown',function(e){
    if(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if(e.key===' '||e.code==='Space'){
      e.preventDefault();
      if(!$('scrim').hidden) return;
      doEndTurn();
      return;
    }
    var n=parseInt(e.key,10);
    if(n>=1 && n<=TABS.length){
      if(!$('scrim').hidden && UI.modalKind==='event') return;
      UI.tab=TABS[n-1][0];
      render();
    }
    if(e.key==='Escape' && UI.modalKind!=='event'){ hideModal(); render(); }
  });
  render();
}

if(typeof document!=='undefined'){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
/* Exported so the file can be exercised headlessly by a test runner. */
if(typeof module!=='undefined' && module.exports){
  module.exports={newState:newState, endTurn:endTurn, benchmark:benchmark, runTests:runTests,
    serialize:serialize, deserialize:deserialize, stateHash:stateHash, score:score,
    policyTurn:policyTurn, resolveChoice:resolveChoice, bestAiChoice:bestAiChoice,
    pop:pop, BLD:BLD, RES_TREE:RES_TREE, EVENTS:EVENTS};
}

})();
