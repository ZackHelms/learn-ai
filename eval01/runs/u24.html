<!DOCTYPE html>
<!--
ASHFALL OUTPOST - single-file turn-based colony survival game.

ASSUMPTIONS (made without asking, per instructions):
- "All critical needs met" for the win check means: on the turn checked (turn >= 60),
  there was no food shortage and no water shortage. If conditions are not met at turn 60,
  the game continues and the win check repeats every turn until met (or until loss).
- Turn resolution order (fixed, documented, applied in endTurn()):
    1. Ashstorm check (damage buildings, set water-spike flag)
    2. Production (fixed pass order: geo -> condenser -> sifter -> mine -> soilworks ->
       forge -> greenhouse -> workshop -> scavpost -> infirmary; tiles scanned in index order)
    3. Colonist needs (food/water consumption; storms double water need)
    4. Morale / fatigue / skill growth / departures
    5. Event draw (weighted deck with cooldowns; choice events pause End Turn until answered)
    6. Trade caravan arrival/departure + price drift
    7. Turn increment + win/lose check
- One worker slot per production building. Buildings produce nothing without a worker.
- Colonists at morale 0 refuse to work that turn; after 2 consecutive turns at morale 0
  they leave the outpost (visible in log, recoverable before that by fixing needs).
- Repairs cost 2 parts AND require one idle colonist, who gains +15 fatigue (labor cost).
- Storms hit every 8 turns (8,16,24,...). Severity = 1 + floor(turn/16).
- Caravan arrives at turn 5 and then every 7 turns, staying 2 turns. It trades only
  food, water, metal, parts, and has limited inventory and limited scrip.
- Seeded mulberry32 PRNG; its 32-bit state lives inside the game state so save/load and
  benchmark runs are fully deterministic. Math.random is never used.
- Save/Load lives in the Dev tab (textarea, copy/paste JSON). No browser storage is used.
- Scoring: population*100 + research*60 + floor(scrip/2) + floor((food+water+metal+parts)/4)
  + turnsSurvived*5.
- Keyboard: Space = End Turn (ignored while typing in inputs), 1-5 = tabs Map/People/
  Research/Trade/Log, 6 = Dev tab.
- Unicode glyphs are used as icons (no image files). State is never conveyed by color
  alone: damaged buildings show a "DMG" badge, terrain shows a glyph, shortages show text.
-->
<html lang="en">

<script>
"use strict";
/* ================= PRNG (mulberry32, state stored in game state) ============ */
function rand(S){
  S.rngState = (S.rngState + 0x6D2B79F5) | 0;
  let t = S.rngState;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function randInt(S, lo, hi){ return lo + Math.floor(rand(S) * (hi - lo + 1)); }

/* ================= deterministic hashing / stable stringify ================= */
function stableStringify(v){
  if (v === null || typeof v !== "object") return JSON.stringify(v);
  if (Array.isArray(v)) return "[" + v.map(stableStringify).join(",") + "]";
  return "{" + Object.keys(v).sort().map(k =>
    JSON.stringify(k) + ":" + stableStringify(v[k])).join(",") + "}";
}
function hashState(S){
  const s = stableStringify(S);
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return ("00000000" + h.toString(16)).slice(-8);
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

/* ================= event deck ================================================ */

    fx(S){ spendRes(S,"food",4); addRes(S,"food",3); fatigueSome(S,2,15);
      log(S,"Rat hunt: net -1 food, two colonists worn out."); }},
   {label:"Set poison (-4 food, -2 parts)",
    fx(S){ spendRes(S,"food",4); spendRes(S,"parts",2);
      log(S,"Poison laid. -4 food, -2 parts."); }},
   {label:"Ignore them (-8 food)",
    fx(S){ spendRes(S,"food",8); log(S,"The rats gorged freely. -8 food.","bad"); }}]}
];

/* ================= state helpers ============================================ */
function log(S,msg,cls){ S.log.push({t:S.turn,msg:msg,cls:cls||""});
  if(S.log.length>400) S.log.splice(0,S.log.length-400); }
function capOf(S,res){
  if(res==="scrip") return 1e9;
  const base={food:60,water:60,metal:60,power:20,parts:30,ore:40,soil:40,ash:40}[res];
  let cap=base;
  // storage sheds keep holding goods even while damaged (damage only stops production)
  const nStore=S.map.filter(t=>t.b==="storehouse").length;
  const nTank=S.map.filter(t=>t.b==="tank").length;
  if(["food","metal","parts","ore","soil","ash"].includes(res)) cap+=30*nStore;
  if(res==="water") cap+=40*nTank;
  if(S.research.storage) cap=Math.floor(cap*1.5);
  return cap;
}
function addRes(S,res,amt){
  amt=Math.max(0,Math.round(amt));
  const cap=capOf(S,res), room=Math.max(0,cap-S.res[res]);
  const kept=Math.min(amt,room), lost=amt-kept;
  S.res[res]+=kept;
  if(lost>0){ S.turnLost[res]=(S.turnLost[res]||0)+lost; }
  return kept;
}
function spendRes(S,res,amt){
  amt=Math.max(0,Math.round(amt));
  const used=Math.min(S.res[res],amt);
  S.res[res]-=used;
  return used===amt; // false = shortfall (resource floored at 0, never negative)
}
function canAfford(S,cost){ return Object.keys(cost).every(k=>S.res[k]>=cost[k]); }
function payCost(S,cost){ Object.keys(cost).forEach(k=>{ S.res[k]-=cost[k]; }); }
function costStr(cost){ return Object.keys(cost).map(k=>cost[k]+" "+k).join(", "); }
function neighbors(i){
  const r=Math.floor(i/8), c=i%8, out=[];
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    if(!dr&&!dc) continue;
    const nr=r+dr,nc=c+dc;
    if(nr>=0&&nr<8&&nc>=0&&nc<8) out.push(nr*8+nc);
  }
  return out;
}
function adjHas(S,i,terr){ return neighbors(i).some(n=>S.map[n].t===terr); }
function countB(S,bkey){ let n=0; for(const t of S.map) if(t.b===bkey&&!t.dmg) n++; return n; }
function housingCap(S){ let n=0; for(const t of S.map) if(t.b==="shelter") n+=4; return 4+n; }
function housingFree(S){ return housingCap(S)-S.colonists.length; }
function moraleAll(S,d){ S.colonists.forEach(c=>{ c.morale=Math.max(0,Math.min(100,c.morale+d)); }); }
function fatigueSome(S,n,d){
  const sorted=S.colonists.slice().sort((a,b)=>a.id-b.id);
  for(let k=0;k<Math.min(n,sorted.length);k++)
    sorted[k].fatigue=Math.max(0,Math.min(100,sorted[k].fatigue+d));
}
function colonistAt(S,tileIdx){ return S.colonists.find(c=>c.at===tileIdx)||null; }
function addColonist(S,job,skill){
  let name=NAMES[Math.floor(rand(S)*NAMES.length)];
  let suffix=2;
  while(S.colonists.some(c=>c.name===name)){ name=name.replace(/ .*$/,"")+" "+roman(suffix++); }
  const c={id:S.nextColId++,name:name,
    job:job||JOBS[Math.floor(rand(S)*3)],
    skill:skill||randInt(S,1,2),xp:0,fatigue:randInt(S,0,15),
    morale:randInt(S,55,75),at:null,zeroStreak:0};
  S.colonists.push(c);
  return c;
}
function roman(n){ return ["","II","III","IV","V","VI","VII","VIII","IX","X"][n-1]||("x"+n); }

/* ================= new game / map generation ================================ */
function genMap(S){
  const m=[];
  for(let i=0;i<64;i++) m.push({t:"ash",b:null,dmg:false});
  S.map=m;
  for(let i=0;i<64;i++) if(rand(S)<0.20) m[i].t="rock";
  for(let blob=0;blob<2;blob++){                       // two water pools
    const c=Math.floor(rand(S)*64);
    m[c].t="water";
    neighbors(c).forEach(n=>{ if(rand(S)<0.55) m[n].t="water"; });
  }
  for(let v=0;v<3;v++){                                 // three vents
    const i=Math.floor(rand(S)*64);
    if(m[i].t!=="water") m[i].t="vent";
  }
  for(let r=0;r<4;r++){                                 // ruins
    const i=Math.floor(rand(S)*64);
    if(m[i].t!=="water"&&m[i].t!=="vent") m[i].t="ruins";
  }
  // clear the founding site and pre-build a shelter + sifter
  m[27]={t:"ash",b:"shelter",dmg:false};
  m[28]={t:"ash",b:"sifter",dmg:false};
  // guarantee each terrain exists (deterministic fallback slots, after founding site)
  const ensure=(terr,slot)=>{ if(!m.some(t=>t.t===terr)) m[slot].t=terr; };
  ensure("water",0); ensure("vent",7); ensure("ruins",56); ensure("rock",63);
}
function newGame(seed){
  const S={
    v:1, seed:seed|0, rngState:seed|0, turn:1, gameOver:null,
    res:{food:30,water:30,metal:22,power:4,parts:6,scrip:25,ore:0,soil:0,ash:5},
    map:[], colonists:[], nextColId:1,
    research:{}, eventCd:{}, pendingChoice:null,
    market:{prices:{food:4,water:3,metal:6,parts:9},
            drift:{food:1,water:1,metal:1,parts:1},
            caravan:null, nextArrival:5},
    flags:{shortFood:false,shortWater:false,stormThisTurn:false},
    turnLost:{}, prodReport:[], log:[]
  };
  genMap(S);
  const starters=["Farmer","Farmer","Engineer","Engineer","Scavenger"];
  starters.forEach(j=>{ const c=addColonist(S,j); c.skill=randInt(S,1,3); });
  log(S,"The eruption is over. "+S.colonists.length+" survivors dig in at the outpost.");
  log(S,"Goal: reach turn 60 with 12+ colonists and food & water needs met.");
  log(S,"First ashstorm expected turn 8. Storms repeat every 8 turns.");
  return S;
}

/* ================= player actions =========================================== */
function canBuild(S,i,bkey){
  const t=S.map[i], B=BUILDINGS[bkey];
  if(!B||!t||t.b) return false;
  if(!B.terrain.includes(t.t)) return false;
  if(B.req && !S.research[B.req]) return false;
  return canAfford(S,B.cost);
}
function build(S,i,bkey){
  if(!canBuild(S,i,bkey)) return false;
  payCost(S,BUILDINGS[bkey].cost);
  S.map[i].b=bkey; S.map[i].dmg=false;
  log(S,BUILDINGS[bkey].name+" built at "+tileName(i)+" (-"+costStr(BUILDINGS[bkey].cost)+").");
  return true;
}
function demolish(S,i){
  const t=S.map[i];
  if(!t.b) return false;
  const c=colonistAt(S,i); if(c) c.at=null;
  log(S,BUILDINGS[t.b].name+" at "+tileName(i)+" demolished (+2 metal salvage).");
  t.b=null; t.dmg=false;
  addRes(S,"metal",2);
  return true;
}
function assign(S,colId,tileIdx){
  const c=S.colonists.find(x=>x.id===colId);
  if(!c) return false;
  if(tileIdx===null||tileIdx===undefined||tileIdx<0){ c.at=null; return true; }
  const t=S.map[tileIdx];
  if(!t.b||!BUILDINGS[t.b].job) return false;
  const prev=colonistAt(S,tileIdx); if(prev) prev.at=null; // swap out old worker
  c.at=tileIdx;
  return true;
}
function idleColonists(S){ return S.colonists.filter(c=>c.at===null); }
function repairTile(S,i){
  const t=S.map[i];
  if(!t.b||!t.dmg) return "Nothing to repair.";
  if(S.res.parts<2) return "Repair needs 2 parts.";
  const idle=idleColonists(S).sort((a,b)=>a.id-b.id)[0];
  if(!idle) return "Repair needs one idle colonist for labor.";
  spendRes(S,"parts",2);
  idle.fatigue=Math.min(100,idle.fatigue+15);
  t.dmg=false;
  log(S,BUILDINGS[t.b].name+" repaired by "+idle.name+" (-2 parts, +15 fatigue).","good");
  return null;
}
function canResearch(S,key){
  const R=RESEARCH[key];
  if(!R||S.research[key]) return false;
  if(!R.req.every(r=>S.research[r])) return false;
  return canAfford(S,R.cost);
}
function buyResearch(S,key){
  if(!canResearch(S,key)) return false;
  payCost(S,RESEARCH[key].cost);
  S.research[key]=true;
  log(S,"Research complete: "+RESEARCH[key].name+" — "+RESEARCH[key].effect,"good");
  return true;
}
function tileName(i){ return "r"+(Math.floor(i/8)+1)+"c"+(i%8+1); }

/* ================= production engine ========================================
   Worker output multiplier =
     skill (0.7+0.15*lvl, off-job counts as lvl 1 with an extra x0.75)
     x morale (>=70: x1.1, 30-69: x1.0, 1-29: x0.75, 0: refuses -> x0)
     x fatigue (>=80: x0.5, 60-79: x0.8)
     x Toolmaking research (x1.15)
     x adjacency bonus (building-specific, shown in tooltips)                 */
function skillMult(l){ return 0.7+0.15*l; }
function workerMult(S,c,bkey,i){
  if(c.morale<=0) return {m:0,parts:["refuses to work (morale 0)"]};
  const B=BUILDINGS[bkey], parts=[];
  let m;
  if(c.job===B.job){ m=skillMult(c.skill); parts.push("skill "+c.skill+" x"+m.toFixed(2)); }
  else { m=skillMult(1)*0.75; parts.push("off-job x"+m.toFixed(2)); }
  if(c.morale>=70){ m*=1.1; parts.push("high morale x1.1"); }
  else if(c.morale<30){ m*=0.75; parts.push("low morale x0.75"); }
  if(c.fatigue>=80){ m*=0.5; parts.push("exhausted x0.5"); }
  else if(c.fatigue>=60){ m*=0.8; parts.push("tired x0.8"); }
  if(S.research.toolmaking){ m*=1.15; parts.push("Toolmaking x1.15"); }
  if(B.adjKey && adjHas(S,i,B.adjKey)){
    m*=(1+B.adjBonus); parts.push("adjacent "+B.adjKey+" x"+(1+B.adjBonus));
  }
  return {m:m,parts:parts};
}
/* convert: consume inputs (scaled down if short), emit output*mult */
function convert(S,i,c,bkey,inputs,outRes,outBase,extraMult,note){
  let ratio=1;
  Object.keys(inputs).forEach(k=>{
    ratio=Math.min(ratio, inputs[k]>0 ? S.res[k]/inputs[k] : 1);
  });
  ratio=Math.min(1,Math.max(0,ratio));
  if(ratio<=0) { S.prodReport.push(BUILDINGS[bkey].name+" idle: no "+Object.keys(inputs).join("/")); return; }
  Object.keys(inputs).forEach(k=>{ spendRes(S,k,Math.ceil(inputs[k]*ratio)); });
  const wm=workerMult(S,c,bkey,i);
  const out=Math.round(outBase*ratio*wm.m*(extraMult||1));
  if(out>0){ addRes(S,outRes,out); c.workedThisTurn=true;
    S.prodReport.push(BUILDINGS[bkey].name+" ("+c.name+"): +"+out+" "+outRes+
      (note?" ["+note+"]":"")+" ["+wm.parts.join(", ")+"]");
  } else S.prodReport.push(BUILDINGS[bkey].name+" ("+c.name+"): no output ["+wm.parts.join(", ")+"]");
}
function produceSimple(S,i,c,bkey,outRes,outBase,extraMult,note){
  const wm=workerMult(S,c,bkey,i);
  const out=Math.round(outBase*wm.m*(extraMult||1));
  if(out>0){ addRes(S,outRes,out); c.workedThisTurn=true;
    S.prodReport.push(BUILDINGS[bkey].name+" ("+c.name+"): +"+out+" "+outRes+
      (note?" ["+note+"]":"")+" ["+wm.parts.join(", ")+"]");
  } else S.prodReport.push(BUILDINGS[bkey].name+" ("+c.name+"): no output ["+wm.parts.join(", ")+"]");
}
function runProduction(S){
  S.prodReport=[]; S.turnLost={};
  S.colonists.forEach(c=>{ c.workedThisTurn=false; });
  const passes=["geo","condenser","sifter","mine","soilworks","forge",
                "greenhouse","workshop","scavpost","infirmary"];
  for(const bkey of passes){
    for(let i=0;i<64;i++){
      const t=S.map[i];
      if(t.b!==bkey) continue;
      if(t.dmg){ S.prodReport.push(BUILDINGS[bkey].name+" at "+tileName(i)+": DAMAGED, no output"); continue; }
      const c=colonistAt(S,i);
      if(!c){ S.prodReport.push(BUILDINGS[bkey].name+" at "+tileName(i)+": no worker"); continue; }
      switch(bkey){
        case "geo": produceSimple(S,i,c,bkey,"power",6,S.research.geotap?1.5:1,
          S.research.geotap?"Geothermal Tapping x1.5":""); break;
        case "condenser": produceSimple(S,i,c,bkey,"water",4); break;
        case "sifter": produceSimple(S,i,c,bkey,"ash",5); break;
        case "mine": produceSimple(S,i,c,bkey,"ore",4); break;
        case "soilworks": convert(S,i,c,bkey,{ash:4},"soil",3); break;
        case "forge": convert(S,i,c,bkey,{ore:4,power:2},"metal",3,
          S.research.metallurgy?1.5:1,S.research.metallurgy?"Metallurgy x1.5":""); break;
        case "greenhouse": convert(S,i,c,bkey,
          {soil:3,water:S.research.drip?1:2},"food",5,
          S.research.hydroponics?1.4:1,S.research.hydroponics?"Hydroponics x1.4":""); break;
        case "workshop": convert(S,i,c,bkey,{metal:3,power:1},"parts",2); break;
        case "scavpost": {
          produceSimple(S,i,c,bkey,"scrip",4);
          if(rand(S)<0.2){ addRes(S,"parts",1);
            S.prodReport.push("Scavenger Post: lucky find, +1 parts"); }
          break; }
        case "infirmary": {
          c.workedThisTurn=true;
          S.colonists.forEach(x=>{ x.morale=Math.min(100,x.morale+4);
            x.fatigue=Math.max(0,x.fatigue-5); });
          S.prodReport.push("Infirmary ("+c.name+"): all colonists +4 morale, -5 fatigue");
          break; }
      }
    }
  }
  Object.keys(S.turnLost).forEach(k=>{
    log(S,"Storage full: "+S.turnLost[k]+" "+k+" lost to overflow.","warn");
  });
}

/* ================= needs / morale / fatigue ================================= */
function runNeeds(S){
  const pop=S.colonists.length;
  const foodNeed=pop;
  const waterNeed=S.flags.stormThisTurn?pop*2:pop;
  const gotF=Math.min(S.res.food,foodNeed), gotW=Math.min(S.res.water,waterNeed);
  S.res.food-=gotF; S.res.water-=gotW;
  S.flags.shortFood=gotF<foodNeed;
  S.flags.shortWater=gotW<waterNeed;
  if(S.flags.stormThisTurn)
    log(S,"Storm doubled water need: "+waterNeed+" required.","warn");
  if(S.flags.shortFood){
    log(S,"FOOD SHORTAGE: "+(foodNeed-gotF)+" meals missing. All morale -12.","bad");
    moraleAll(S,-12);
  }
  if(S.flags.shortWater){
    log(S,"WATER SHORTAGE: "+(waterNeed-gotW)+" rations missing. All morale -12.","bad");
    moraleAll(S,-12);
  }
  if(!S.flags.shortFood&&!S.flags.shortWater) moraleAll(S,4);
}
function runMorale(S){
  const leavers=[];
  S.colonists.forEach(c=>{
    if(c.at!==null){
      c.fatigue=Math.min(100,c.fatigue+12);
      if(c.workedThisTurn){
        const t=S.map[c.at];
        if(t&&t.b&&BUILDINGS[t.b].job===c.job){
          c.xp++;
          const need=c.skill*4;      // skill grows slowly with use
          if(c.xp>=need&&c.skill<5){ c.skill++; c.xp=0;
            log(S,c.name+" improved to "+c.job+" skill "+c.skill+".","good"); }
        }
      }
    } else c.fatigue=Math.max(0,c.fatigue-20);
    if(c.morale<=0){
      c.zeroStreak++;
      if(c.zeroStreak===1)
        log(S,c.name+" is at zero morale and refuses to work. One more turn and they leave!","bad");
      else leavers.push(c);
    } else c.zeroStreak=0;
  });
  leavers.forEach(c=>{
    S.colonists=S.colonists.filter(x=>x.id!==c.id);
    log(S,c.name+" packed up and walked into the ash. Population -1.","bad");
  });
}

/* ================= ashstorms ================================================ */
function stormSeverity(turn){ return 1+Math.floor(turn/16); }
function isStormTurn(turn){ return turn%8===0; }
function nextStormTurn(turn){ return Math.ceil((turn+1)/8)*8; }
function runStorm(S){
  S.flags.stormThisTurn=isStormTurn(S.turn);
  if(!S.flags.stormThisTurn){
    if(S.research.forecast && nextStormTurn(S.turn)-S.turn===2)
      log(S,"Forecast: ashstorm arriving on turn "+nextStormTurn(S.turn)+"!","warn");
    return;
  }
  const sev=stormSeverity(S.turn);
  log(S,"ASHSTORM (severity "+sev+") scours the outpost!","bad");
  let chance=0.22+0.06*sev;
  if(S.research.forecast) chance*=0.75;
  let hits=0;
  for(let i=0;i<64;i++){
    const t=S.map[i];
    if(!t.b||t.dmg||t.b==="wall") continue;
    let c2=chance;
    if(neighbors(i).some(n=>S.map[n].b==="wall"&&!S.map[n].dmg)) c2*=0.5;
    if(rand(S)<c2){ t.dmg=true; hits++;
      log(S,BUILDINGS[t.b].name+" at "+tileName(i)+" damaged by the storm.","bad"); }
  }
  if(hits===0) log(S,"The storm passed without structural damage.","good");
  moraleAll(S,-4);
}

/* ================= events =================================================== */
function runEvents(S){
  if(S.turn<3) return;
  if(rand(S)>=0.45) return;
  const avail=EVENTS.filter(e=>!(S.eventCd[e.id]>S.turn));
  if(!avail.length) return;
  const total=avail.reduce((a,e)=>a+e.w,0);
  let r=rand(S)*total, ev=avail[0];
  for(const e of avail){ r-=e.w; if(r<0){ ev=e; break; } }
  S.eventCd[ev.id]=S.turn+ev.cd;
  log(S,"EVENT: "+ev.name+" — "+ev.text);
  if(ev.choices) S.pendingChoice=ev.id;
  else ev.fx(S);
}
function resolveChoice(S,idx){
  if(S.pendingChoice===null) return;
  const ev=EVENTS.find(e=>e.id===S.pendingChoice);
  S.pendingChoice=null;
  if(!ev) return;
  const ch=ev.choices[Math.max(0,Math.min(idx,ev.choices.length-1))];
  ch.fx(S);
}

/* ================= trade ==================================================== */
const TRADE_GOODS=["food","water","metal","parts"];
function priceOf(S,res){
  const m=S.market;
  const stockMult=Math.max(0.6,Math.min(1.5,1.6-S.res[res]/capOf(S,res)));
  return Math.max(1,m.prices[res]*m.drift[res]*stockMult);
}
function buyPrice(S,res){ return Math.max(1,Math.ceil(priceOf(S,res)*(S.research.barter?1.15:1.25))); }
function sellPrice(S,res){ return Math.max(1,Math.floor(priceOf(S,res)*(S.research.barter?0.9:0.8))); }
function runTrade(S){
  const m=S.market;
  TRADE_GOODS.forEach(r=>{                       // global supply/demand drift
    m.drift[r]=Math.max(0.5,Math.min(2,m.drift[r]*(0.94+rand(S)*0.12)));
  });
  if(m.caravan&&S.turn>=m.caravan.leavesAfter){
    m.caravan=null;
    log(S,"The caravan hitched up and left.");
  }
  if(!m.caravan&&S.turn+1>=m.nextArrival){
    m.caravan={
      inv:{food:randInt(S,14,24),water:randInt(S,14,24),
           metal:randInt(S,8,16),parts:randInt(S,4,9)},
      scrip:randInt(S,90,140),
      leavesAfter:S.turn+2   // tradable during the next two player turns
    };
    m.nextArrival=S.turn+8;
    log(S,"A trade caravan has arrived! It stays 2 turns. (Trade tab)","good");
  }
}
function tradeBuy(S,res,qty){
  const cv=S.market.caravan;
  if(!cv||qty<=0) return "No caravan present.";
  qty=Math.min(qty,cv.inv[res]);
  if(qty<=0) return "Caravan is out of "+res+".";
  const cost=buyPrice(S,res)*qty;
  if(S.res.scrip<cost) return "Need "+cost+" scrip.";
  spendRes(S,"scrip",cost);
  cv.inv[res]-=qty; cv.scrip+=cost;
  const kept=addRes(S,res,qty);
  log(S,"Bought "+qty+" "+res+" for "+cost+" scrip."+(kept<qty?" ("+(qty-kept)+" lost: storage full!)":""));
  return null;
}
function tradeSell(S,res,qty){
  const cv=S.market.caravan;
  if(!cv||qty<=0) return "No caravan present.";
  qty=Math.min(qty,S.res[res]);
  if(qty<=0) return "You have no "+res+" to sell.";
  const gain=sellPrice(S,res)*qty;
  const pay=Math.min(gain,cv.scrip);
  if(pay<gain){ qty=Math.floor(cv.scrip/sellPrice(S,res));
    if(qty<=0) return "The caravan is out of scrip.";
  }
  const total=sellPrice(S,res)*qty;
  spendRes(S,res,qty);
  cv.scrip-=total; cv.inv[res]+=qty;
  addRes(S,"scrip",total);
  log(S,"Sold "+qty+" "+res+" for "+total+" scrip.");
  return null;
}

/* ================= turn resolution & end conditions ========================= */
function score(S){
  return S.colonists.length*100
    + Object.keys(S.research).length*60
    + Math.floor(S.res.scrip/2)
    + Math.floor((S.res.food+S.res.water+S.res.metal+S.res.parts)/4)
    + S.turn*5;
}
function endTurn(S){
  if(S.gameOver) return "The game is over. Start a new game.";
  if(S.pendingChoice) return "Answer the event choice first!";
  runStorm(S);        // 1. ashstorm
  runProduction(S);   // 2. production
  runNeeds(S);        // 3. colonist needs
  runMorale(S);       // 4. morale / fatigue / skill / departures
  runEvents(S);       // 5. event draw
  runTrade(S);        // 6. caravan + price drift
  S.turn++;           // 7. advance + end checks
  if(S.colonists.length<=0){
    S.gameOver={win:false,score:score(S),
      why:"Every colonist is gone. The outpost falls silent."};
    log(S,"DEFEAT: population reached zero.","bad");
  } else if(S.turn>60&&S.colonists.length>=12
      &&!S.flags.shortFood&&!S.flags.shortWater){
    S.gameOver={win:true,score:score(S),
      why:"Turn "+S.turn+": "+S.colonists.length+" colonists, needs met. The outpost endures."};
    log(S,"VICTORY! The outpost has survived the ashfall.","good");
  } else if(S.turn===61){
    log(S,"Turn 60 passed without meeting the victory bar (12+ colonists, needs met). Keep going — the check repeats each turn.","warn");
  }
  return null;
}

/* ================= save / load ============================================== */
function saveString(S){ return JSON.stringify(S); }
function loadString(txt){
  let o;
  try { o=JSON.parse(txt); }
  catch(e){ return {err:"Not valid JSON: "+e.message}; }
  if(!o||typeof o!=="object") return {err:"Save must be a JSON object."};
  const needKeys=["v","seed","rngState","turn","res","map","colonists",
                  "research","market","log","eventCd","flags"];
  for(const k of needKeys)
    if(!(k in o)) return {err:"Save is missing required field \""+k+"\"."};
  if(!Array.isArray(o.map)||o.map.length!==64)
    return {err:"Save map must have exactly 64 tiles."};
  if(!Array.isArray(o.colonists)) return {err:"Save colonists must be an array."};
  for(const r of RES_KEYS)
    if(typeof o.res[r]!=="number"||o.res[r]<0)
      return {err:"Save has bad resource value for "+r+"."};
  return {state:o};
}

/* ================= greedy benchmark policy ================================== */
/* Deterministic: fixed priorities, tiles scanned in index order. */
function firstBuildable(S,bkey,pref){
  let fallback=-1;
  for(let i=0;i<64;i++){
    if(!canBuild(S,i,bkey)) continue;
    if(pref&&pref(S,i)) return i;
    if(fallback<0) fallback=i;
  }
  return fallback;
}
function greedyPolicy(S){
  if(S.pendingChoice!==null) resolveChoice(S,0);
  // research in a fixed order
  ["toolmaking","forecast","hydroponics","metallurgy","drip","storage",
   "barter","medicine","geotap","walls"].forEach(k=>{ if(canResearch(S,k)) buyResearch(S,k); });
  // repair anything damaged
  for(let i=0;i<64;i++)
    if(S.map[i].b&&S.map[i].dmg&&S.res.parts>=2&&idleColonists(S).length)
      repairTile(S,i);
  // build order: [type, want count, adjacency preference]
  const plan=[
    ["condenser",1,(S,i)=>adjHas(S,i,"water")],
    ["soilworks",1,null],
    ["greenhouse",1,(S,i)=>adjHas(S,i,"water")],
    ["geo",1,null],
    ["mine",1,null],
    ["forge",1,(S,i)=>adjHas(S,i,"vent")],
    ["condenser",2,(S,i)=>adjHas(S,i,"water")],
    ["scavpost",1,null],
    ["shelter",2,null],
    ["workshop",1,(S,i)=>adjHas(S,i,"ruins")],
    ["greenhouse",2,(S,i)=>adjHas(S,i,"water")],
    ["sifter",2,null],
    ["shelter",3,null],
    ["tank",1,null],
    ["storehouse",1,null],
    ["wall",1,null]
  ];
  for(const [bkey,want,pref] of plan){
    let have=0; for(const t of S.map) if(t.b===bkey) have++;
    if(have>=want) continue;
    const i=firstBuildable(S,bkey,pref);
    if(i>=0) build(S,i,bkey);
  }
  // rest the exhausted, then staff empty buildings (job match first)
  S.colonists.forEach(c=>{ if(c.at!==null&&c.fatigue>=85) c.at=null; });
  const openTiles=[];
  for(let i=0;i<64;i++){
    const t=S.map[i];
    if(t.b&&!t.dmg&&BUILDINGS[t.b].job&&!colonistAt(S,i)) openTiles.push(i);
  }
  const idle=idleColonists(S).filter(c=>c.fatigue<70).sort((a,b)=>a.id-b.id);
  for(const i of openTiles){
    const need=BUILDINGS[S.map[i].b].job;
    let k=idle.findIndex(c=>c.job===need);
    if(k<0) k=idle.length?0:-1;
    if(k>=0){ assign(S,idle[k].id,i); idle.splice(k,1); }
  }
  // trade
  if(S.market.caravan){
    if(S.res.food<S.colonists.length*2) tradeBuy(S,"food",8);
    if(S.res.water<S.colonists.length*2) tradeBuy(S,"water",8);
    if(S.res.metal>45) tradeSell(S,"metal",10);
    if(S.res.food>capOf(S,"food")*0.85) tradeSell(S,"food",8);
    if(S.res.parts<4&&S.res.scrip>60) tradeBuy(S,"parts",3);
  }
}
function simulate(seed,turns){
  const S=newGame(seed);
  for(let t=0;t<turns;t++){
    greedyPolicy(S);
    endTurn(S);
    if(S.pendingChoice!==null) resolveChoice(S,0);
    if(S.gameOver) break;
  }
  return S;
}

/* ================= tests ===================================================== */
function runTests(){
  const out=[]; let pass=0,fail=0;
  function T(name,cond){
    if(cond){ pass++; out.push("PASS  "+name); }
    else { fail++; out.push("FAIL  "+name); }
  }
  // 1-2 PRNG determinism
  {
    const a={rngState:1337},b={rngState:1337};
    let same=true;
    for(let i=0;i<5;i++) if(rand(a)!==rand(b)) same=false;
    T("PRNG: same seed gives identical sequence",same);
    const c={rngState:42};
    T("PRNG: different seed diverges",rand(c)!==rand({rngState:1337}));
  }
  // 3 map determinism
  T("Map: generation is deterministic for a seed",
    stableStringify(newGame(555).map)===stableStringify(newGame(555).map));
  // 4 fresh state sanity
  {
    const S=newGame(1337);
    T("New game: no negative resources",RES_KEYS.every(r=>S.res[r]>=0));
    T("New game: 64 tiles, 5 colonists",S.map.length===64&&S.colonists.length===5);
  }
  // 6-8 caps & overflow
  {
    const S=newGame(1337);
    addRes(S,"food",9999);
    T("Storage: cap respected on overflow",S.res.food===capOf(S,"food"));
    T("Storage: overflow amount recorded",(S.turnLost.food||0)>0);
    spendRes(S,"water",9999);
    T("Spend: resource floors at zero, never negative",S.res.water===0);
  }
  // 9-10 build rules
  {
    const S=newGame(1337);
    const waterTile=S.map.findIndex(t=>t.t==="water");
    T("Build: rejected on invalid terrain",build(S,waterTile,"greenhouse")===false);
    const spot=S.map.findIndex((t,i)=>t.t==="ash"&&!t.b);
    const before=S.res.metal;
    T("Build: cost deducted on success",
      build(S,spot,"soilworks")===true&&S.res.metal===before-5);
  }
  // 11-12 research prereqs
  {
    const S=newGame(1337);
    S.res.scrip=999; S.res.parts=99;
    T("Research: prereq enforced (metallurgy needs toolmaking)",
      buyResearch(S,"metallurgy")===false);
    buyResearch(S,"toolmaking");
    T("Research: unlocks after prereq bought",buyResearch(S,"metallurgy")===true);
  }
  // 13 building unlock gating
  {
    const S=newGame(1337);
    S.res.metal=99; S.res.parts=99;
    const spot=S.map.findIndex(t=>t.t==="ash"&&!t.b);
    T("Build: research-locked building rejected (Storm Wall)",
      build(S,spot,"wall")===false);
  }
  // 14 save/load round trip
  {
    const S=simulate(1337,12);
    const r=loadString(saveString(S));
    T("Save/load: round-trips to identical state hash",
      !r.err&&hashState(r.state)===hashState(S));
    T("Save/load: bad input rejected with error",
      !!loadString("{nope").err&&!!loadString("{\"v\":1}").err);
  }
  // 16-20 simulation invariants
  {
    const S=simulate(1337,30);
    T("Sim 30: no negative resources",RES_KEYS.every(r=>S.res[r]>=0));
    T("Sim 30: all stocks within caps",RES_KEYS.every(r=>S.res[r]<=capOf(S,r)));
    T("Sim 30: morale within 0..100",
      S.colonists.every(c=>c.morale>=0&&c.morale<=100));
    T("Sim 30: fatigue within 0..100",
      S.colonists.every(c=>c.fatigue>=0&&c.fatigue<=100));
    T("Sim 30: worker assignments point at real worked buildings",
      S.colonists.every(c=>c.at===null||
        (S.map[c.at]&&S.map[c.at].b&&BUILDINGS[S.map[c.at].b].job)));
    T("Sim 30: population within housing capacity",
      S.colonists.length<=housingCap(S));
    T("Sim 30: at least one event went on cooldown",
      Object.keys(S.eventCd).length>0);
  }
  // 23 storm water spike
  {
    const A=newGame(777);
    A.flags.stormThisTurn=false; const a0=A.res.water;
    runNeeds(A); const normalUse=a0-A.res.water;
    const B=newGame(777);
    B.flags.stormThisTurn=true; const b0=B.res.water;
    runNeeds(B); const stormUse=b0-B.res.water;
    T("Storm: doubles water consumption",stormUse===normalUse*2);
  }
  // 24 benchmark determinism
  {
    const h1=hashState(simulate(2024,25)), h2=hashState(simulate(2024,25));
    T("Determinism: two 25-turn sims from one seed hash identically",h1===h2);
  }
  // 25 colonist count consistency
  {
    const S=simulate(1337,20);
    const ids=new Set(S.colonists.map(c=>c.id));
    T("Roster: colonist ids unique, count matches roster",
      ids.size===S.colonists.length);
  }
  out.push("");
  out.push(pass+" passed, "+fail+" failed, "+(pass+fail)+" total.");
  return {text:out.join("\n"),pass:pass,fail:fail};
}

/* ================= benchmark ================================================ */
function runBenchmark(seed){
  const S=simulate(seed,200);
  const lines=[];
  lines.push("BENCHMARK — 200-turn headless greedy run, seed "+seed);
  lines.push("state hash : "+hashState(S));
  lines.push("turns run  : "+(S.turn-1)+(S.gameOver?(S.gameOver.win?" (WON)":" (LOST)"):""));
  lines.push("population : "+S.colonists.length+" / housing "+housingCap(S));
  lines.push("research   : "+Object.keys(S.research).length+"/"+Object.keys(RESEARCH).length);
  lines.push("buildings  : "+S.map.filter(t=>t.b).length);
  lines.push("stocks     : "+RES_KEYS.map(r=>r+" "+S.res[r]).join(", "));
  lines.push("score      : "+score(S));
  lines.push("(run again: same seed must print the identical hash)");
  return lines.join("\n");
}

  TRADE_GOODS.forEach(r=>{
    const bp=buyPrice(G,r), sp=sellPrice(G,r);
    const tip="base "+G.market.prices[r]+" x drift "+G.market.drift[r].toFixed(2)+
      " x stock factor "+Math.max(0.6,Math.min(1.5,1.6-G.res[r]/capOf(G,r))).toFixed(2)+
      (G.research.barter?" (Barter Networks applied)":"");
    h+="<tr><td>"+RES_META[r].icon+" "+r+"</td><td>"+cv.inv[r]+"</td>"+
      "<td title='"+esc(tip)+"'>"+bp+"</td><td title='"+esc(tip)+"'>"+sp+"</td><td>"+
      "<button onclick='uiTrade(\"buy\",\""+r+"\",1)'>Buy 1</button> "+
      "<button onclick='uiTrade(\"buy\",\""+r+"\",5)'>x5</button> "+
      "<button onclick='uiTrade(\"sell\",\""+r+"\",1)'>Sell 1</button> "+
      "<button onclick='uiTrade(\"sell\",\""+r+"\",5)'>x5</button></td></tr>";
  });
  h+="</table>";
  box.innerHTML=h;
}
function uiTrade(kind,res,qty){
  const err=kind==="buy"?tradeBuy(G,res,qty):tradeSell(G,res,qty);
  if(err) flash(err);
  renderAll();
}
function renderLog(){
  const box=$("logbox");
  box.innerHTML=G.log.slice().reverse().map(l=>
    "<div class='logline "+(l.cls||"")+"'><span class='lt'>T"+l.t+"</span>"+esc(l.msg)+"</div>"
  ).join("");
}
function renderDev(){
  const box=$("devbox");
  box.innerHTML=
    "<h2>Dev / Save / Verify</h2>"+
    "<h3>Seed & New Game</h3>"+
    "<p><label>Seed <input id='seedin' type='number' value='"+G.seed+"' style='width:110px'></label> "+
    "<button onclick='uiNewGame()'>⟲ New Game with this seed</button></p>"+
    "<h3>Verification</h3>"+
    "<p><button onclick='uiTests()'>▶ Run Tests</button> "+
    "<button onclick='uiBench()'>▶ Run Benchmark (200 turns)</button></p>"+
    "<div id='devout'>"+esc(devText)+"</div>"+
    "<h3>Save / Load (copy-paste JSON, no browser storage)</h3>"+
    "<p><button onclick='uiSave()'>💾 Save to textarea</button> "+
    "<button onclick='uiLoad()'>📂 Load from textarea</button> "+
    "<span id='saveerr' class='bad'></span></p>"+
    "<textarea id='savearea' spellcheck='false' placeholder='Click Save to dump state here; paste a save and click Load to restore.'></textarea>";
}
function uiNewGame(){
  const v=parseInt($("seedin").value,10);
  G=newGame(isNaN(v)?1337:v);
  selTile=-1;
  renderAll();
}
function uiTests(){
  const r=runTests();
  devText=r.text;
  renderDev();
}
function uiBench(){
  devText="Running 200-turn benchmark...";
  renderDev();
  devText=runBenchmark(G.seed);
  renderDev();
}
function uiSave(){
  $("savearea").value=saveString(G);
  $("saveerr").textContent="";
  flash("State saved to textarea — copy it somewhere safe.");
}
function uiLoad(){
  const r=loadString($("savearea").value);
  if(r.err){ $("saveerr").textContent=r.err; return; }
  G=r.state; selTile=-1;
  $("saveerr").textContent="";
  log(G,"Save loaded (hash "+hashState(G)+").");
  renderAll();
}
function renderModal(){
  const m=$("modal"), box=$("modalbox");
  if(G.gameOver){
    const go=G.gameOver;
    box.innerHTML="<h2>"+(go.win?"🏆 VICTORY":"☠ DEFEAT")+"</h2>"+
      "<p>"+esc(go.why)+"</p>"+
      "<table>"+
      "<tr><td>Population</td><td>"+G.colonists.length+" x 100 = "+(G.colonists.length*100)+"</td></tr>"+
      "<tr><td>Research done</td><td>"+Object.keys(G.research).length+" x 60 = "+(Object.keys(G.research).length*60)+"</td></tr>"+
      "<tr><td>Scrip</td><td>"+G.res.scrip+" ÷ 2 = "+Math.floor(G.res.scrip/2)+"</td></tr>"+
      "<tr><td>Stockpiles</td><td>(food+water+metal+parts) ÷ 4 = "+
        Math.floor((G.res.food+G.res.water+G.res.metal+G.res.parts)/4)+"</td></tr>"+
      "<tr><td>Turns survived</td><td>"+G.turn+" x 5 = "+(G.turn*5)+"</td></tr>"+
      "<tr><th>FINAL SCORE</th><th>"+go.score+"</th></tr></table>"+
      "<button onclick='uiNewGameFromModal()'>⟲ Play again (same seed rerolls identically — change it in Dev)</button>";
    m.classList.add("open");
    return;
  }
  if(G.pendingChoice!==null){
    const ev=EVENTS.find(e=>e.id===G.pendingChoice);
    box.innerHTML="<h2>"+esc(ev.name)+"</h2><p>"+esc(ev.text)+"</p>"+
      ev.choices.map((c,idx)=>
        "<button onclick='uiChoice("+idx+")'>"+esc(c.label)+"</button>").join("");
    m.classList.add("open");
    return;
  }
  m.classList.remove("open");
}
function uiChoice(idx){ resolveChoice(G,idx); renderAll(); }
function uiNewGameFromModal(){ G=newGame(G.seed); selTile=-1; renderAll(); }
function uiEndTurn(){
  const err=endTurn(G);
  if(err){ flash(err); renderModal(); return; }
  $("footmsg").textContent="Space = end turn · 1-6 = tabs";
  $("footmsg").className="dim";
  renderAll();
}

/* ================= init ====================================================== */
document.querySelectorAll("#tabs button").forEach(b=>{
  b.onclick=()=>setTab(b.dataset.tab);
});
$("endturn").onclick=uiEndTurn;
document.addEventListener("keydown",e=>{
  const tag=(document.activeElement&&document.activeElement.tagName)||"";
  if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT") return;
  if(e.code==="Space"){ e.preventDefault(); uiEndTurn(); }
  const tabs={Digit1:"map",Digit2:"people",Digit3:"research",Digit4:"trade",
              Digit5:"log",Digit6:"dev"};
  if(tabs[e.code]) setTab(tabs[e.code]);
});
G=newGame(1337);
setTab("map");
</script>
</body>
</html>
