      "Shortfall of " + nf(need - have) + ". Morale will drop for everyone.") + ">" + (ok ? "COVERED" : "SHORT") + "</span></td></tr>";
}

/* ---- research ---- */
function renderResearch(){
  var doneN = Object.keys(S.done).length;
  var html = '<div class="panel"><div class="spread"><h2>RESEARCH — ' + doneN + " of " + TREE.length + " complete</h2>" +
    '<span class="muted"' + tip("Research is paid for in scrip and parts and completes immediately.\nScrip comes from trade and events; parts come from Workshops.") +
    '>scrip ' + nf(S.res.scrip) + " · parts " + nf(S.res.parts) + "</span></div>" +
    (S.discount ? '<p class="ok">Archived cache map: the next node costs ' + Math.round(S.discount * 100) + "% less scrip.</p>" : "") +
    '<div class="cols">';
  for (var i = 0; i < TREE.length; i++){
    var n = TREE[i], st = researchState(S, n.id), c = researchCost(S, n.id);
    var afford = canPay(S, c);
    var pre = n.pre.length ? n.pre.map(function(p){ return TREEBY[p].n + (S.done[p] ? " ✓" : " ✗"); }).join(", ") : "none";
    var label = st === "done" ? "COMPLETE" : st === "avail" ? (afford ? "AVAILABLE" : "TOO COSTLY") : "LOCKED";
    var tp = [n.n, n.e, "", "Cost: " + costStr(c) + (S.discount && st !== "done" ? " (discounted)" : ""),
      "Prerequisites: " + pre, "Status: " + label];
    if (st === "avail" && !afford) tp.push("You need " + nf(Math.max(0, c.scrip - S.res.scrip)) + " more scrip and " +
      nf(Math.max(0, c.parts - S.res.parts)) + " more parts.");
    html += '<div class="node ' + (st === "done" ? "done" : st === "avail" ? "avail" : "lock") + '"' + tip(tp.join("\n")) + ">" +
      '<div class="spread"><b>' + esc(n.n) + '</b><span class="st">' + label + "</span></div>" +
      '<div class="tiny">' + esc(n.e) + "</div>" +
      '<div class="muted tiny">Cost ' + esc(costStr(c)) + " · Needs: " + esc(pre) + "</div>";
    if (st !== "done")
      html += '<button class="btn sm" data-act="research:' + n.id + '" style="margin-top:4px"' +
        (st === "locked" || !afford ? " disabled" : "") + ">RESEARCH</button>";
    html += "</div>";
  }
  html += "</div></div>";
  return html;
}

/* ---- trade ---- */
function renderTrade(){
  var m = tradeMargin(S);
  var html = '<div class="panel"><div class="spread"><h2>CARAVAN</h2><span class="muted">scrip ' + nf(S.res.scrip) + "</span></div>";
  if (!S.trade.caravan){
    html += '<p class="mid">No caravan is here. The next one is roughly <b>' + Math.max(0, S.trade.nextIn) +
      "</b> turn(s) out." + (S.done.charter ? " Your Trade Charter shortens the wait." : "") + "</p>";
  } else {
    var c = S.trade.caravan;
    html += '<p>The caravan leaves in <b>' + c.stay + "</b> turn(s). It has <b>" + nf(c.scrip) +
      "</b> scrip to spend on what you sell.</p>";
    html += '<table><tr><th>Goods</th><th class="num">They have</th><th class="num">Buy</th><th class="num">Sell</th><th>Trade</th></tr>';
    for (var i = 0; i < TRADEABLE.length; i++){
      var k = TRADEABLE[i], pb = priceBuy(S, k), ps = priceSell(S, k);
      var sc = scarcity(S, k);
      var tp = [RESN[k], "Buy at " + nf(pb, 2) + " scrip/unit, sell at " + nf(ps, 2) + " scrip/unit.", "",
        "Base price " + nf(BASEPRICE[k], 2),
        "Global index x" + nf(S.trade.idx[k], 2) + " (drifts every turn)",
        "Your scarcity " + Math.round(sc * 100) + "% (you hold " + nf(S.res[k]) + " of a " + caps(S)[k] + " cap)",
        "  buy multiplier " + nf(0.85 + 0.5 * sc, 2) + " — the emptier your store, the more they charge",
        "  sell multiplier " + nf(0.42 + 0.34 * sc, 2) + " — dumping a full store fetches less"];
      if (m.notes.length) tp.push("Your margin: " + m.notes.join("; "));
      html += "<tr" + tip(tp.join("\n")) + "><td>" + RESN[k] + '</td><td class="num">' + nf(c.stock[k] || 0) +
        '</td><td class="num">' + nf(pb, 2) + '</td><td class="num">' + nf(ps, 2) + "</td><td>" +
        '<button class="btn sm" data-act="buy:' + k + ':1"' + tip("Buy 1 " + RESN[k].toLowerCase() + " for " + nf(pb, 2) + " scrip") + ">+1</button> " +
        '<button class="btn sm" data-act="buy:' + k + ':10"' + tip("Buy 10 (or as many as you can afford / they hold)") + ">+10</button> " +
        '<button class="btn sm" data-act="sell:' + k + ':1"' + tip("Sell 1 " + RESN[k].toLowerCase() + " for " + nf(ps, 2) + " scrip") + ">-1</button> " +
        '<button class="btn sm" data-act="sell:' + k + ':10"' + tip("Sell 10 (or as many as they can pay for)") + ">-10</button> " +
        '<button class="btn sm" data-act="sell:' + k + ':9999"' + tip("Sell everything you can spare of this good") + ">-ALL</button>" +
        "</td></tr>";
    }
    html += "</table>";
  }
  html += "</div>";
  html += '<div class="panel"><h2>MARKET INDEX</h2><p class="muted">Global supply and demand drift each turn as a bounded random walk. ' +
    'Rumour events can shove a price hard in either direction. Prices you see already include your own stockpile pressure.</p><table>' +
    '<tr><th>Goods</th><th class="num">Index</th><th>Trend</th></tr>';
  for (var j = 0; j < TRADEABLE.length; j++){
    var k2 = TRADEABLE[j], v = S.trade.idx[k2];
    html += "<tr><td>" + RESN[k2] + '</td><td class="num">x' + nf(v, 2) + "</td><td>" +
      '<span class="pill ' + (v > 1.15 ? "g" : v < 0.85 ? "b" : "w") + '"' +
      tip(v > 1.15 ? "Sellers' market — good time to sell, expensive to buy." :
        v < 0.85 ? "Glut — cheap to buy, poor returns on selling." : "Steady.") + ">" +
      (v > 1.15 ? "HIGH" : v < 0.85 ? "LOW" : "STEADY") + "</span></td></tr>";
  }
  html += "</table>" + (m.notes.length ? '<p class="ok tiny">' + esc(m.notes.join(" · ")) + "</p>" : "") + "</div>";
  return html;
}

/* ---- log ---- */
function renderLog(){
  var filters = [["all", "All"], ["storm", "Storms"], ["event", "Events"], ["trade", "Trade"], ["bad", "Trouble"], ["res", "Research"]];
  var html = '<div class="panel"><div class="spread"><h2>OUTPOST LOG</h2><div class="row">' +
    filters.map(function(f){
      return '<button class="btn sm' + (UI.logFilter === f[0] ? " on" : "") + '" data-act="filter:' + f[0] + '"' +
        tip("Show only " + f[1].toLowerCase() + " entries") + ">" + f[1] + "</button>";
    }).join("") + "</div></div>";
  html += '<div class="log" id="logbox">';
  var shown = 0;
  for (var i = S.log.length - 1; i >= 0; i--){
    var e = S.log[i];
    if (UI.logFilter !== "all"){
      if (UI.logFilter === "bad" && e.k !== "bad" && e.k !== "warn") continue;
      if (UI.logFilter !== "bad" && e.k !== UI.logFilter) continue;
    }
    shown++;
    html += '<div class="le k-' + e.k + '"><span class="t">T' + e.t + '</span><span class="tag">' +
      e.k.toUpperCase() + '</span><span class="x">' + esc(e.x) + "</span></div>";
  }
  if (!shown) html += '<p class="muted">No entries match this filter yet.</p>';
  html += "</div></div>";
  html += '<div class="panel"><h2>TURN RESOLUTION ORDER</h2><ol class="tiny" style="margin:0;padding-left:18px">' +
    ["Ashstorm check — damage buildings, set this turn's water surge",
     "Production in dependency order: Geothermal → Condenser → Collector → Mine → Composter → Greenhouse → Forge → Workshop",
     "Storage caps applied; overflow is lost and logged",
     "Colonists eat and drink (storm surge applies)",
     "Fatigue, morale, skill growth, refusals and departures",
     "Caravan arrival/departure and global price drift",
     "Event deck draw (cooldowns respected; choice events pause the turn)",
     "Newcomers arrive if housed, fed and content",
     "Storage caps applied again, since events and choices can hand out goods",
     "Turn counter advances and end conditions are checked"]
      .map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("") + "</ol></div>";
  return html;
}

/* ---- dev ---- */
function renderDev(){
  var html = '<div class="panel"><h2>VERIFICATION</h2><div class="row">' +
    '<button class="btn p" data-act="tests"' + tip("Runs " + runTestsCount + "+ assertions over real invariants: resources, caps, roster, prereqs, storms, trade, save/load round-trip and benchmark determinism.") + ">RUN TESTS</button>" +
    '<button class="btn p" data-act="bench"' + tip("Simulates 200 turns headlessly from the current seed with a fixed greedy policy, then prints a state hash and summary. Two runs from one seed must print the same hash.") + ">RUN BENCHMARK</button>" +
    '<button class="btn" data-act="hash"' + tip("FNV-1a over key-sorted canonical JSON of the entire live state.") + ">STATE HASH</button>" +
    "</div>" + (UI.dev ? '<pre class="out">' + esc(UI.dev) + "</pre>" : '<p class="muted">Output appears here.</p>') + "</div>";
  html += '<div class="panel"><h2>SAVE / LOAD</h2><p class="muted">Nothing is stored by the browser. Copy the text below to keep a save; paste one back and press LOAD.</p>' +
    '<div class="row"><button class="btn" data-act="save"' + tip("Serialise the whole game state into the box.") + ">GENERATE SAVE</button>" +
    '<button class="btn" data-act="copy"' + tip("Select the save text so you can copy it.") + ">SELECT ALL</button>" +
    '<button class="btn" data-act="load"' + tip("Replace the current game with the pasted save. The text is validated first and a clear error is shown if it is malformed.") + ">LOAD</button></div>' +
    '<textarea id="savebox" spellcheck="false" placeholder="Paste a save string here…">' + esc(UI.saveText) + "</textarea></div>";
  html += '<div class="panel"><h2>NEW GAME</h2><div class="row">Seed <input type="text" id="seedbox" value="' + S.seed +
    '" size="10"' + tip("Any whole number. The map, storms and event order all follow from it.") + ">" +
    '<button class="btn" data-act="newgame"' + tip("Start over with the seed in the box. The current game is discarded.") + ">START</button></div>" +
    '<p class="muted tiny">Current seed ' + S.seed + " · RNG cursor " + S.rng + " · state hash " + stateHash(S) + "</p></div>";
  return html;
}
var runTestsCount = 29;

/* ---- modal ---- */
function renderModal(){
  var m = $("modal");
  if (S.pending){
    var e = EVBY[S.pending.id];
    var h = '<div class="mbox"><h2>' + esc(e.n) + "</h2><p>" + esc(e.t) + "</p><hr>";
    for (var i = 0; i < e.choices.length; i++){
      var c = e.choices[i];
      h += '<button class="choice" data-act="choice:' + i + '"' + tip(c.d) + "><b>" + esc(c.n) + "</b><span>" + esc(c.d) + "</span></button>";
    }
    h += '<p class="muted tiny">A decision is required before the next turn can be ended.</p></div>';
    m.innerHTML = h; m.classList.remove("hidden");
    return;
  }
  if (S.phase !== "play" && !UI.over){
    var sc = score(S);
    var head = S.outcome === "win" ? "THE OUTPOST ENDURES" : S.outcome === "lost" ? "ASHFALL OUTPOST IS LOST" : "YOU SURVIVED, BUT ONLY JUST";
    var sub = S.outcome === "win"
      ? "Turn " + WIN_TURN + " with " + S.people.length + " colonists, full stores and steady morale. That is a win."
      : S.outcome === "lost"
        ? "The last colonist walked out into the grey on turn " + S.turn + "."
        : "You reached turn " + WIN_TURN + " but fell short of thriving: you need " + WIN_POP +
          "+ colonists, two turns of food and water in store, average morale 50+, and no shortage on the final turn.";
    var h2 = '<div class="mbox"><h2>' + head + "</h2><p>" + esc(sub) + "</p><hr><table>" +
      sc.lines.map(function(l){
        return "<tr" + tip(l.d) + "><td>" + esc(l.k) + '</td><td class="num">' + l.v + "</td></tr>";
      }).join("") +
      '<tr><th>FINAL SCORE</th><th class="num">' + sc.total + "</th></tr></table>" +
      '<p class="tiny muted">Seed ' + S.seed + " · " + S.stats.storms + " storms · " + S.ev.fired + " events · " +
      S.stats.trades + " trades · " + S.stats.repairs + " repairs · " + S.stats.born + " arrivals · " + S.stats.left + " departures · " +
      nf(S.stats.overflow) + " units lost to overflow</p>" +
      '<div class="row"><button class="btn p" data-act="newgame"' + tip("Start a fresh outpost with the seed from the Dev tab.") + ">NEW GAME</button>" +
      '<button class="btn" data-act="closeover"' + tip("Close this and look over the final state of the outpost.") + ">REVIEW OUTPOST</button></div></div>";
    m.innerHTML = h2; m.classList.remove("hidden");
    return;
  }
  m.classList.add("hidden"); m.innerHTML = "";
}

/* ---- main render ---- */
function render(){
  var box = $("logbox"), keep = box ? box.scrollTop : 0;
  renderStatus(); renderRes(); renderTabs(); renderBottom();
  var html = "";
  if (UI.tab === "map") html = renderMap();
  else if (UI.tab === "people") html = renderPeople();
  else if (UI.tab === "research") html = renderResearch();
  else if (UI.tab === "trade") html = renderTrade();
  else if (UI.tab === "log") html = renderLog();
  else html = renderDev();
  $("main").innerHTML = html;
  if (UI.tab === "log"){ var b2 = $("logbox"); if (b2) b2.scrollTop = keep; }
  renderModal();
  hideTip();
}

/* ---- tooltips ---- */
var tipFor = null;
function showTip(el, x, y){
  var t = $("tip");
  if (tipFor !== el){                 /* only re-flow when the target changes */
    t.textContent = el.getAttribute("data-tip");
    t.style.display = "block";
    tipFor = el;
  }
  var r = t.getBoundingClientRect();
  var nx = clamp(x + 14, 4, Math.max(4, window.innerWidth - r.width - 6));
  var ny = y + 18 + r.height > window.innerHeight ? Math.max(4, y - r.height - 12) : y + 18;
  t.style.left = nx + "px"; t.style.top = ny + "px";
}
function hideTip(){ $("tip").style.display = "none"; tipFor = null; }

/* ---- actions ---- */
function act(a, ev){
  var p = a.split(":"), cmd = p[0];
  UI.msg = "";
  if (cmd === "tab"){ UI.tab = p[1]; render(); return; }
  if (cmd === "tile"){ UI.sel = parseInt(p[1], 10); render(); return; }
  if (cmd === "build"){
    var i = parseInt(p[1], 10), k = p[2];
    var why = buildReason(S, i, k);
    if (why) say(why, "bad");
    else { placeBuilding(S, i, k); say(BUILD[k].n + " raised at " + coord(i) + ".", "good"); }
    render(); return;
  }
  if (cmd === "demolish"){ demolish(S, parseInt(p[1], 10)); render(); return; }
  if (cmd === "repair"){
    var err = repair(S, parseInt(p[1], 10));
    if (err) say(err, "bad"); else say("Repaired.", "good");
    render(); return;
  }
  if (cmd === "unassign"){ assign(S, parseInt(p[1], 10), null); render(); return; }
  if (cmd === "retrain"){
    var pid = parseInt(p[1], 10);
    var per = S.people.filter(function(x){ return x.id === pid; })[0];
    if (!per) return;
    if (S.res.scrip < 15){ say("Retraining costs 15 scrip.", "bad"); render(); return; }
    takeRes(S, "scrip", 15, "Retraining");
    var was = JOBS[per.job].n;
    per.job = JOBKEYS[(JOBKEYS.indexOf(per.job) + 1) % 4];
    per.skill = Math.max(1, per.skill - 2); per.xp = 0; per.at = null;
    logf(S, "sys", per.name + " retrained from " + was + " to " + JOBS[per.job].n + " (skill reset to " + per.skill + ").");
    render(); return;
  }
  if (cmd === "research"){
    var e2 = buyResearch(S, p[1]);
    if (e2) say(e2, "bad"); else say(TREEBY[p[1]].n + " completed.", "good");
    render(); return;
  }
  if (cmd === "buy" || cmd === "sell"){
    var err2 = (cmd === "buy" ? doBuy : doSell)(S, p[1], parseInt(p[2], 10));
    if (err2) say(err2, "bad");
    render(); return;
  }
  if (cmd === "choice"){ resolveChoice(S, parseInt(p[1], 10)); render(); return; }
  if (cmd === "filter"){ UI.logFilter = p[1]; render(); return; }
  if (cmd === "endturn"){ doEndTurn(); return; }
  if (cmd === "closeover"){ UI.over = true; render(); return; }
  if (cmd === "newgame"){
    var sb = $("seedbox");
    var seed = sb ? parseInt(sb.value, 10) : S.seed;
    if (!isFinite(seed) || !seed) seed = 1337;
    S = newGame(seed); UI.sel = null; UI.over = false; UI.dev = ""; UI.saveText = "";
    say("New outpost founded with seed " + seed + ".", "good");
    render(); return;
  }
  if (cmd === "tests"){
    var res = runTests();
    var pass = res.filter(function(r){ return r.pass; }).length;
    var lines = ["ASHFALL OUTPOST — INVARIANT TESTS", "=================================",
      res.length + " assertions, " + pass + " passed, " + (res.length - pass) + " failed", ""];
    res.forEach(function(r, n){
      lines.push((r.pass ? "PASS" : "FAIL") + "  " + String(n + 1).padStart(2, "0") + ". " + r.name);
      if (r.detail) lines.push("        " + r.detail);
    });
    lines.push("", pass === res.length ? "ALL ASSERTIONS PASSED." : "SOME ASSERTIONS FAILED — see above.");
    UI.dev = lines.join("\n");
    UI.tab = "dev"; render(); return;
  }
  if (cmd === "bench"){
    var r1 = runBench(S.seed, 200), r2 = runBench(S.seed, 200);
    var L = ["ASHFALL OUTPOST — 200-TURN HEADLESS BENCHMARK", "=============================================",
      "Seed                : " + r1.seed,
      "Policy              : fixed greedy (research order, wish-list builds, need-first crewing, surplus selling)",
      "",
      "RUN 1 STATE HASH    : " + r1.hash,
      "RUN 2 STATE HASH    : " + r2.hash,
      "DETERMINISTIC       : " + (r1.hash === r2.hash ? "YES — identical" : "NO — MISMATCH"),
      "",
      "Population          : " + r1.pop,
      "Research complete   : " + r1.research + "/" + TREE.length,
      "Buildings standing  : " + r1.buildings,
      "Average morale      : " + nf(r1.morale),
      "Storms weathered    : " + r1.storms,
      "Events fired        : " + r1.events,
      "Trades made         : " + r1.trades,
      "Repairs made        : " + r1.repairs,
      "Arrivals/departures : " + r1.born + " / " + r1.left,
      "Lost to overflow    : " + nf(r1.overflow),
      "Final score         : " + r1.score,
      "",
      "Resources at turn " + (r1.turns + 1) + ":"];
    RES.forEach(function(k){ L.push("  " + (RESN[k] + "        ").slice(0, 8) + nf(r1.res[k])); });
    if (r1.at60) L.push("", "At the turn-" + WIN_TURN + " check: population " + r1.at60.pop + ", research " +
      r1.at60.research + ", morale " + nf(r1.at60.morale) + ", outcome '" + r1.at60.outcome + "', score " + r1.at60.score + ".");
    L.push("", "Note: the benchmark keeps simulating past the end check so it always runs the full 200 turns.");
    UI.dev = L.join("\n");
    UI.tab = "dev"; render(); return;
  }
  if (cmd === "hash"){ UI.dev = "Live state hash: " + stateHash(S) + "\nTurn " + S.turn + ", seed " + S.seed + ", RNG cursor " + S.rng; render(); return; }
  if (cmd === "save"){
    UI.saveText = saveString(S);
    var tb = $("savebox"); if (tb) tb.value = UI.saveText;
    say("Save generated (" + UI.saveText.length + " characters). Copy it somewhere safe.", "good");
    render(); return;
  }
  if (cmd === "copy"){
    var tb2 = $("savebox");
    if (tb2){ tb2.focus(); tb2.select(); say("Save text selected — press Ctrl/Cmd+C.", "good"); }
    render(); return;
  }
  if (cmd === "load"){
    var tb3 = $("savebox");
    var txt = tb3 ? tb3.value : "";
    try {
      var loaded = loadString(txt);
      S = loaded; UI.sel = null; UI.over = false; UI.saveText = txt;
      say("Save loaded: turn " + S.turn + ", " + S.people.length + " colonists, seed " + S.seed + ".", "good");
    } catch (e3){
      UI.saveText = txt;
      say("LOAD FAILED — " + e3.message, "bad");
    }
    render(); return;
  }
}
function doEndTurn(){
  if (S.phase !== "play"){ say("The game is over. Start a new one from the Dev tab.", "bad"); render(); return; }
  if (S.pending){ say("Resolve the event decision first.", "bad"); render(); return; }
  endTurn(S);
  var t = S.tick;
  var bits = [];
  if (t.storm) bits.push("storm severity " + nf(t.storm.sev, 2));
  if (t.short.food > 0.001) bits.push("food short");
  if (t.short.water > 0.001) bits.push("water short");
  say("Turn " + (S.turn - 1) + " resolved" + (bits.length ? ": " + bits.join(", ") : "."), bits.length ? "warn" : "good");
  render();
}

/* ---- boot ---- */
function boot(){
  document.addEventListener("click", function(e){
    if (!e.target || !e.target.closest) return;
    var el = e.target.closest("[data-act]");
    if (el && !el.disabled){ act(el.getAttribute("data-act"), e); return; }
    var tp = e.target.closest("[data-tip]");   /* tap-to-explain on touch devices */
    if (tp) showTip(tp, e.clientX, e.clientY); else hideTip();
  });
  document.addEventListener("change", function(e){
    var sel = e.target;
    if (sel.getAttribute && sel.getAttribute("data-sel") === "assign"){
      var pid = parseInt(sel.getAttribute("data-pid"), 10);
      var v = sel.value === "" ? null : parseInt(sel.value, 10);
      var err = assign(S, pid, v);
      if (err) say(err, "bad");
      render();
    } else if (sel.getAttribute && sel.getAttribute("data-sel") === "post"){
      var tile = parseInt(sel.getAttribute("data-tile"), 10);
      if (sel.value !== ""){
        var err2 = assign(S, parseInt(sel.value, 10), tile);
        if (err2) say(err2, "bad");
      }
      render();
    } else if (sel.id === "savebox") UI.saveText = sel.value;
  });
  document.addEventListener("pointerover", function(e){
    if (e.pointerType === "touch") return;
    var el = e.target.closest ? e.target.closest("[data-tip]") : null;
    if (el) showTip(el, e.clientX, e.clientY); else hideTip();
  });
  document.addEventListener("pointermove", function(e){
    if (e.pointerType === "touch") return;
    var el = e.target.closest ? e.target.closest("[data-tip]") : null;
    if (el) showTip(el, e.clientX, e.clientY);
  });
  document.addEventListener("focusin", function(e){
    var el = e.target.closest ? e.target.closest("[data-tip]") : null;
    if (el){
      var r = el.getBoundingClientRect();
      showTip(el, r.left, r.bottom - 12);
    } else hideTip();
  });
  window.addEventListener("scroll", hideTip, true);
  document.addEventListener("keydown", function(e){
    var tag = (e.target && e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select") return;
    if (e.key === " " || e.code === "Space"){ e.preventDefault(); doEndTurn(); return; }
    for (var i = 0; i < TABS.length; i++){
      if (e.key === TABS[i].key){ UI.tab = TABS[i].id; render(); return; }
    }
    if (e.key === "Escape"){ hideTip(); if (!S.pending && S.phase !== "play"){ UI.over = true; render(); } }
  });
  logf(S, "sys", "Keyboard: Space ends the turn, 1-6 switch tabs. Save/Load and the test harness live in the Dev tab.");
  render();
}
if (typeof document !== "undefined" && document.getElementById) boot();
</script>
