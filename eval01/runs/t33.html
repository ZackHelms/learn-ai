      +'\nLast turn:\n  '+(c.mr.length?c.mr.map(m=>(m.v?sgn(m.v)+'  ':'      ')+m.r).join('\n  '):'no changes')
      +(c.morale<=0?'\nAT ZERO: refuses to work. '+(3-c.zero)+' turn(s) before they leave.':'')
      +'\nResting raises morale; food and water shortages sink it.';
    const ftip='Fatigue '+c.fatigue+'/100 for '+c.name
      +'\nAbove 50 output falls: x'+(c.fatigue<=50?1:Math.max(0.55,1-(c.fatigue-50)*0.008)).toFixed(2)
      +'\nAssigned: +'+Math.max(4,10-(S.tech.sealed?3:0))+'/turn.  Resting: -'+(20+(countBld(S,'habitat')?8:0))+'/turn.'
      +'\nAt 100 the colonist collapses and is pulled off duty.';
    const stip='Skill '+c.skill+'/5 as '+JOBS[c.job].n+'\nOutput multiplier x'+(0.6+0.2*c.skill).toFixed(2)
      +'\nExperience '+c.xp+(c.skill<5?' / '+XP_STEPS[c.skill]+' for skill '+(c.skill+1):' (mastered)')
      +'\nGains 2 xp per productive turn (1 if fatigue is 50+).';
    h+='<tr><td><b>'+esc(c.name)+'</b>'
      +(c.sick>0?' <span class="tag no">SICK '+c.sick+'</span>':'')
      +(c.morale<=0?' <span class="tag no">REFUSING</span>':'')+'</td>';
    h+='<td><span class="tag in" data-tip="'+tipAttr(JOBS[c.job].n+'. Working a matching building gives x1.00; any other building x0.60.')+'">'+JOBS[c.job].ab+'</span></td>';
    h+='<td><span class="mono" data-tip="'+tipAttr(stip)+'">'+c.skill+'/5</span></td>';
    h+='<td>'+bar(c.fatigue,100,ftip,true)+'</td>';
    h+='<td>'+bar(c.morale,100,mtip,false)+'</td>';
    h+='<td><select data-post="'+c.id+'"><option value="">Rest</option>';
    for(const tt of S.map){
      if(!tt.b || !BLD[tt.b.id].job) continue;
      const other=workerAt(S,tt.i);
      const bd=BLD[tt.b.id];
      h+='<option value="'+tt.i+'"'+(c.assign===tt.i?' selected':'')+'>'
        +esc(bd.n)+' '+xy(tt.i)+(bd.job===c.job?' *':'')+(tt.b.damaged?' [dmg]':'')
        +(other&&other.id!==c.id?' (swap '+esc(other.name)+')':'')+'</option>';
    }
    h+='</select>'
      +(d?'<div class="sub">'+(d.job===c.job?'matched':'MISMATCH x0.60')+'</div>':'')
      +'</td></tr>';
  }
  h+='</tbody></table></div>';
  h+='<div class="card"><h3>Needs &amp; Growth</h3><div class="sub">'
    +'Each colonist eats <b>1 food</b> and drinks <b>1 water</b> per turn ('
    +(S.tech.sealed?'1.5x':'2x')+' water during a storm).<br>'
    +'Shortages hit morale hard: -6 to -18 for food, -7 to -21 for water.<br>'
    +'New arrivals need average morale 60+, food '+(pop(S)*3)+'+ and water '+(pop(S)*2)+'+ held for several turns.'
    +'</div><div class="hr"></div>'
    +'<div class="row"><span class="sub">Migration progress</span>'
    +bar(S.growth,8,'Growth counter '+S.growth+'/8.\n+1 per turn with average morale 60+, food '+(pop(S)*3)+'+ and water '+(pop(S)*2)+'+.\n+2 per turn at morale 75+.\nDecays by 1 whenever conditions lapse.\nAt 8 a new colonist arrives.',false)
    +'</div></div>';
  return h;
}

/* ---------- research tab ---------- */
function renderResearch(){
  let h='<div class="card"><h3>Research</h3><div class="sub">Paid in scrip and parts. '
    +'Staffed Research Labs discount every node: currently -'+Math.round(labDiscount(S)*100)+'%.</div></div>';
  h+='<div class="rgrid">';
  for(const id of TECH_ORDER){
    const t=TECH[id], st=techState(S,id), c=techCost(S,id);
    const afford=canPay(S,c);
    const label = st==='done'?'✔ DONE':(st==='lock'?'● LOCKED':(afford?'▶ AVAILABLE':'▶ TOO COSTLY'));
    const tag = st==='done'?'ok':(st==='lock'?'no':(afford?'ok':'wa'));
    const pre = t.pre.length?t.pre.map(p=>TECH[p].n+(S.tech[p]?' ✔':' ✗')).join(', '):'none';
    const tip=t.n+'\nEffect: '+t.eff+'\nPrerequisites: '+pre
      +'\nCost: '+costStr(c)+(labDiscount(S)>0?' (base '+costStr(t.cost)+', lab discount -'+Math.round(labDiscount(S)*100)+'%)':'')
      +'\nYou hold: '+S.res.scrip+' scrip, '+S.res.parts+' parts.'
      +'\nStatus: '+label;
    h+='<div class="node '+(st==='done'?'done':(st==='lock'?'lock':'avail'))+'" data-tip="'+tipAttr(tip)+'">'
      +'<div class="row" style="justify-content:space-between"><h4>'+t.n+'</h4><span class="tag '+tag+'">'+label+'</span></div>'
      +'<div class="eff">'+t.eff+'</div>'
      +'<div class="cost">'+costStr(c)+'</div>'
      +'<div class="sub" style="font-size:10.5px">Needs: '+pre+'</div>';
    if(st!=='done') h+='<div style="margin-top:5px"><button class="minibtn'+(st==='avail'&&afford?' go':'')+'" data-tech="'+id+'"'

    h+='</div>';
  }
  h+='</div>';
  return h;
}

/* ---------- trade tab ---------- */

      +'<td>'+RESN[r]+'</td>'
      +'<td class="mono">'+d.toFixed(2)+' '+(d>1.05?'▲':(d<0.95?'▼':'='))+'</td>'
      +'<td class="mono">'+sc.toFixed(2)+'</td>'
      +'<td class="mono">'+buyPrice(S,r)+'</td><td class="mono">'+sellPrice(S,r)+'</td></tr>';
  }
  h+='</tbody></table>';
  h+='<div class="sub" style="margin-top:6px">Scarcity rises as your store empties: an empty store means the caravan charges you 1.5x, and also pays you 1.5x for that good. Sell what you are drowning in.</div>';
  h+='</div></div></div>';
  return h;
}

/* ---------- log tab ---------- */
function renderLog(){
  let h='<div class="card"><h3>Event Log <span class="sub">newest last, '+S.log.length+' entries</span></h3>';
  h+='<div class="logwrap" id="logwrap">';
  for(const e of S.log){
    h+='<div class="le k-'+(e.k||'')+'"><span class="t">'+(e.k==='head'?'':'T'+e.t)+'</span><span>'+esc(e.m)+'</span></div>';
  }
  h+='</div></div>';
  return h;
}

/* ---------- dev tab ---------- */
function renderDev(){
  let h='<div class="grid2"><div>';
  h+='<div class="card"><h3>Verification</h3><div class="row">'
    +'<button class="minibtn go" id="btnTests" data-tip="'+tipAttr('Runs 32 assertions over real invariants: resource floors and caps, roster integrity, research prerequisites, repair costs, trade bookkeeping, storm cadence, save/load hash round-trip and benchmark determinism.')+'">Run Tests</button>'
    +'<button class="minibtn go" id="btnBench" data-tip="'+tipAttr('Simulates 200 turns headlessly from the seed below using a fixed greedy policy, then prints summary stats and a state hash. The same seed must print the same hash every time.')+'">Run Benchmark</button>'
    +'<span class="sub">seed <input class="seedin mono" id="benchSeed" type="number" value="'+S.seed+'"></span>'
    +'</div>';
  h+='<div class="sub" style="margin-top:6px">Turn resolution order (fixed): '
    +'1 storm, 2 repairs, 3 production (by building tier), 4 power decay, 5 consumption, 6 morale and fatigue, '
    +'7 skill growth, 8 departures, 9 growth, 10 market, 11 events, 12 turn advance and end check.</div>';
  if(UI.dev) h+='<div class="hr"></div><pre>'+esc(UI.dev)+'</pre>';
  h+='</div></div><div>';
  h+='<div class="card"><h3>Save / Load</h3>'
    +'<div class="sub">Nothing is stored by the browser. Copy this text somewhere safe.</div>'
    +'<div class="row" style="margin:6px 0">'
    +'<button class="minibtn" id="btnSave" data-tip="'+tipAttr('Serialise the whole game state, including the RNG position, into the box below.')+'">Serialise state</button>'
    +'<button class="minibtn go" id="btnLoad" data-tip="'+tipAttr('Parse and validate the text below, then replace the current game with it.')+'">Load from text</button>'
    +'<button class="minibtn" id="btnCopy">Select all</button></div>'
    +'<textarea id="saveBox" spellcheck="false" placeholder="Paste an Ashfall save here, then press Load from text."></textarea>';
  if(UI.loadMsg) h+='<div class="sub" style="margin-top:5px">'+esc(UI.loadMsg)+'</div>';
  h+='<div class="hr"></div><div class="sub mono">state hash: '+stateHash(S)+'</div>';
  h+='</div>';
  h+='<div class="card"><h3>Rules Reference</h3><div class="sub">'
    +'Victory: reach the end of turn 60 with 12+ colonists, food and water stocks at least equal to population, and average morale 50+.<br>'
    +'Defeat: population reaches 0.<br>'
    +'Score: 40/colonist + 35/research + stockpile/8 + 6/turn survived + 400 for a win.<br>'
    +'Output = base + adjacency + research, times job match (1.00 or 0.60), times skill (0.8-1.6), '
    +'times morale (0.50-1.00), times fatigue (0.55-1.00), times automation (1.15).'
    +'</div></div>';
  h+='</div></div>';
  return h;
}

/* ---------- overlays ---------- */
function renderModal(){
  const m=$('modal');
  if(S.over && !UI.hideOver){
    const sc=score(S);
    m.innerHTML='<div class="ovl"><div class="box">'
      +'<h2>'+(S.over.win?'THE OUTPOST HOLDS':'THE ASH TAKES IT')+'</h2>'
      +'<div class="sub">'+esc(S.over.reason)+'</div><div class="hr"></div>'
      +'<table><tbody>'
      +'<tr><td>Population '+pop(S)+' x40</td><td class="mono">'+sc.pop+'</td></tr>'
      +'<tr><td>Research '+techCount(S)+' x35</td><td class="mono">'+sc.research+'</td></tr>'
      +'<tr><td>Stockpiles / 8</td><td class="mono">'+sc.stock+'</td></tr>'
      +'<tr><td>Turns survived '+Math.min(S.turn-1,WIN_TURN)+' x6</td><td class="mono">'+sc.turns+'</td></tr>'
      +'<tr><td>Victory bonus</td><td class="mono">'+sc.win+'</td></tr>'
      +'<tr><td><b>FINAL SCORE</b></td><td class="mono"><b>'+sc.total+'</b></td></tr>'
      +'</tbody></table><div class="hr"></div>'
      +'<div class="sub">Storms weathered '+S.stats.storms+' &middot; events '+S.stats.events
      +' &middot; buildings raised '+S.stats.built+' &middot; repairs '+S.stats.repairs
      +' &middot; born/joined '+S.stats.born+' &middot; lost '+S.stats.deaths+'</div>'
      +'<div class="row" style="margin-top:10px"><button class="endbtn" id="btnAgain">NEW GAME</button>'
      +'<button class="minibtn" id="btnCloseOver">Dismiss and inspect the final outpost</button></div>'
      +'</div></div>';
    return;
  }
  if(S.pending){
    const e=EVENTS.find(x=>x.id===S.pending.id);
    if(!e){ S.pending=null; m.innerHTML=''; return; }
    let h='<div class="ovl"><div class="box"><h2>'+esc(e.n)+'</h2><div class="sub">'+esc(e.t)+'</div>';
    e.choices.forEach((c,i)=>{
      h+='<button class="choice" data-choice="'+i+'"><b>'+esc(c.l)+'</b><span>'+esc(c.d)+'</span></button>';
    });
    h+='<div class="sub" style="margin-top:8px">You cannot end another turn until you decide.</div></div></div>';
    m.innerHTML=h;
    return;
  }
  m.innerHTML='';
}

/* ---------- master render ---------- */
function render(){
  renderHeader(); renderChips(); renderTabs();
  const p=$('panel');
  if(UI.tab==='map') p.innerHTML=renderMap();
  else if(UI.tab==='people') p.innerHTML=renderPeople();
  else if(UI.tab==='research') p.innerHTML=renderResearch();
  else if(UI.tab==='trade') p.innerHTML=renderTrade();
  else if(UI.tab==='log') p.innerHTML=renderLog();
  else p.innerHTML=renderDev();
  if(UI.tab==='log'){ const w=$('logwrap'); if(w) w.scrollTop=w.scrollHeight; }
  if(UI.tab==='dev'){ const b=$('saveBox'); if(b && UI.saveText!==undefined) b.value=UI.saveText||''; }
  renderModal();
}

/* ---------- events ---------- */
let toastTimer=null;
function flash(msg){
  logMsg(S,msg,'warn');
  const t=$('toast');
  if(!t) return;
  t.textContent=msg;
  t.style.display='block';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ t.style.display='none'; },3200);
}
function boot(){
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-tab],[data-cell],[data-build],[data-demo],[data-repair],[data-tech],[data-buy],[data-sell],[data-choice],#btnTests,#btnBench,#btnSave,#btnLoad,#btnCopy,#btnAgain,#btnCloseOver,#newBtn,#endBtn');
  if(!el) return;
  const d=el.dataset||{};
  if(d.tab){ UI.tab=d.tab; render(); return; }
  if(el.id==='endBtn'){ endTurn(S,false); render(); return; }
  if(el.id==='newBtn'){ const v=parseInt($('seedIn').value,10); S=newGame(isFinite(v)?v:1337);
    UI.sel=null; UI.dev=''; UI.loadMsg=''; UI.saveText=''; UI.hideOver=false; render(); return; }
  if(d.cell!==undefined){ UI.sel=(UI.sel===+d.cell?null:+d.cell); render(); return; }
  if(d.build!==undefined){ const e=build(S,+d.at,d.build); if(e) flash('Cannot build: '+e); render(); return; }
  if(d.demo!==undefined){ demolish(S,+d.demo); render(); return; }
  if(d.repair!==undefined){ queueRepair(S,+d.repair); render(); return; }
  if(d.tech!==undefined){ const e=research(S,d.tech); if(e) flash('Research blocked: '+e); render(); return; }
  if(d.buy!==undefined){ const e=tradeBuy(S,d.buy,+d.q); if(e) flash('Trade failed: '+e); render(); return; }
  if(d.sell!==undefined){ const e=tradeSell(S,d.sell,+d.q); if(e) flash('Trade failed: '+e); render(); return; }
  if(d.choice!==undefined){ resolveChoice(S,S.pending.id,+d.choice); render(); return; }
  if(el.id==='btnTests'){ const r=runTests(); UI.dev=r.lines.join('\n'); render(); return; }
  if(el.id==='btnBench'){
    const sv=parseInt($('benchSeed').value,10);
    const r=runBenchmark(isFinite(sv)?sv:S.seed,200);
    UI.dev=r.lines.join('\n'); render(); return;
  }
  if(el.id==='btnSave'){ UI.saveText=saveString(S); UI.loadMsg='State serialised ('+UI.saveText.length+' characters). Hash '+stateHash(S)+'.'; render(); return; }
  if(el.id==='btnLoad'){
    const txt=$('saveBox').value;
    const r=loadString(txt);
    if(r.err){ UI.loadMsg='LOAD FAILED: '+r.err; }
    else { S=r.state; UI.sel=null; UI.hideOver=false; UI.loadMsg='Loaded successfully. Turn '+S.turn+', population '+pop(S)+', hash '+stateHash(S)+'.'; }
    render(); return;
  }
  if(el.id==='btnCopy'){ const b=$('saveBox'); b.focus(); b.select(); return; }
  if(el.id==='btnAgain'){ S=newGame(S.seed); UI.sel=null; UI.dev=''; UI.saveText=''; UI.hideOver=false; render(); return; }
  if(el.id==='btnCloseOver'){ UI.hideOver=true; render(); return; }
});
document.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.dataset && el.dataset.assign!==undefined){
    const i=+el.dataset.assign;
    const cur=workerAt(S,i);
    if(cur) cur.assign=null;
    if(el.value){
      const e=assign(S,+el.value,i);
      if(e){ if(cur) cur.assign=i; flash('Cannot post: '+e); }
    }
    render(); return;
  }
  if(el.dataset && el.dataset.post!==undefined){
    const cid=+el.dataset.post;
    const e=assign(S,cid, el.value===''?null:+el.value);
    if(e) flash('Cannot post: '+e);
    render(); return;
  }
  if(el.id==='saveBox'){ UI.saveText=el.value; }
});
document.addEventListener('input',ev=>{ if(ev.target.id==='saveBox') UI.saveText=ev.target.value; });

document.addEventListener('keydown',ev=>{
  const tag=(ev.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select') return;
  if(ev.code==='Space'||ev.key===' '){ ev.preventDefault(); if(!S.over&&!S.pending){ endTurn(S,false); render(); } return; }
  const n=parseInt(ev.key,10);
  if(n>=1 && n<=TABS.length){ UI.tab=TABS[n-1][0]; render(); }
});

/* ---------- tooltip ---------- */
const tipEl=()=>$('tip');
let tipTimer=null;
function showTip(el,x,y){
  const t=el.getAttribute('data-tip');
  if(!t) return;
  const e=tipEl();
  e.textContent=t;
  e.style.display='block';
  const w=e.offsetWidth, h=e.offsetHeight;
  let px=x+14, py=y+16;
  if(px+w>window.innerWidth-6) px=Math.max(6,window.innerWidth-w-6);
  if(py+h>window.innerHeight-6) py=Math.max(6,y-h-12);
  e.style.left=px+'px'; e.style.top=py+'px';
}
function hideTip(){ tipEl().style.display='none'; }
document.addEventListener('mousemove',ev=>{
  const el=ev.target.closest?ev.target.closest('[data-tip]'):null;
  if(el) showTip(el,ev.clientX,ev.clientY); else hideTip();
});
document.addEventListener('touchstart',ev=>{
  const el=ev.target.closest?ev.target.closest('[data-tip]'):null;
  if(el){
    const t=ev.touches[0];
    showTip(el,t.clientX,t.clientY);
    clearTimeout(tipTimer);
    tipTimer=setTimeout(hideTip,3500);
  } else hideTip();
},{passive:true});
document.addEventListener('focusin',ev=>{
  const el=ev.target.closest?ev.target.closest('[data-tip]'):null;
  if(el){ const r=el.getBoundingClientRect(); showTip(el,r.left,r.bottom); }
});
document.addEventListener('focusout',hideTip);
document.addEventListener('scroll',hideTip,true);
render();
}

/* ---------- boot / headless export ---------- */
if(typeof document!=='undefined' && document.getElementById && document.getElementById('panel')){
  boot();
} else if(typeof globalThis!=='undefined'){
  globalThis.__ASHFALL__={newGame:newGame,runTests:runTests,runBenchmark:runBenchmark,
    benchHash:benchHash,endTurn:endTurn,botTurn:botTurn,stateHash:stateHash,
    saveString:saveString,loadString:loadString,score:score};
}
</script>
</body>
</html>
