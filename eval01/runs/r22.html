<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASHFALL OUTPOST</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', monospace; background: #1a1a1a; color: #ddd; line-height: 1.3; font-size: 13px; }

        .container { display: flex; height: 100vh; flex-direction: column; }
        .header { background: #2a2a2a; padding: 8px; border-bottom: 1px solid #444; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .header > div:first-child { flex: 1; min-width: 150px; }
        .resources { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 6px; flex: 2; }
        .resource { background: #333; padding: 4px 6px; border-radius: 2px; text-align: center; font-size: 11px; }
        .resource strong { display: block; font-size: 10px; color: #0a7; }
        .resource span { display: block; font-size: 12px; }

        .main { display: flex; flex: 1; overflow: hidden; gap: 0; }
        .tabs { display: flex; flex-direction: column; flex: 1; }
        .tab-buttons { display: flex; background: #2a2a2a; border-bottom: 1px solid #444; border-right: 1px solid #444; flex-wrap: wrap; }
        .tab-btn { padding: 6px 10px; background: #333; border: none; color: #ddd; cursor: pointer; font-size: 11px; border-bottom: 1px solid #444; flex: 0 1 auto; }
        .tab-btn.active { background: #0a7; color: #000; font-weight: bold; }
        .tab-content { flex: 1; overflow-y: auto; padding: 8px; background: #1a1a1a; }

        .map-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; margin-bottom: 8px; }
        .tile { aspect-ratio: 1; border: 1px solid #555; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 9px; text-align: center; background: #333; font-weight: bold; position: relative; }
        .tile:hover { border-color: #0a7; background: #444; }
        .tile.ash { background: #555; } .tile.rock { background: #666; } .tile.water { background: #003366; } .tile.vent { background: #660000; } .tile.ruins { background: #999; }

        .colonist { background: #333; padding: 6px; margin: 3px 0; border-left: 3px solid #0a7; border-radius: 2px; font-size: 11px; }
        .colonist.low { border-left-color: #a00; } .colonist.high { border-left-color: #0a7; }
        .colonist-name { font-weight: bold; color: #0a7; }
        .colonist-job { font-size: 10px; color: #999; }
        .colonist-assign { margin-top: 3px; }
        .colonist-assign select { background: #444; color: #0a7; border: 1px solid #555; padding: 2px 4px; font-size: 10px; font-family: monospace; }

        .research-node { background: #333; padding: 6px; margin: 3px 0; border: 1px solid #555; border-radius: 2px; font-size: 11px; }
        .research-node.locked { opacity: 0.4; }
        .research-node.done { border-left: 3px solid #0a7; }
        .research-node.available { border-left: 3px solid #a70; }
        .research-title { font-weight: bold; color: #0a7; }
        .research-desc { font-size: 10px; color: #999; margin: 2px 0; }
        .research-btn { background: #0a7; color: #000; border: none; padding: 3px 8px; cursor: pointer; font-weight: bold; border-radius: 2px; font-size: 10px; margin-top: 3px; }
        .research-btn:hover { background: #0b8; }
        .research-btn:disabled { background: #555; color: #999; cursor: not-allowed; }

        .log-entry { background: #333; padding: 4px 6px; margin: 2px 0; border-left: 2px solid #666; font-size: 11px; }
        .log-entry.event { border-left-color: #a70; } .log-entry.warning { border-left-color: #a00; } .log-entry.good { border-left-color: #0a7; }

        .end-turn-btn { background: #0a7; color: #000; border: none; padding: 8px 16px; cursor: pointer; font-weight: bold; font-size: 12px; border-radius: 2px; white-space: nowrap; }
        .end-turn-btn:hover { background: #0b8; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: #2a2a2a; padding: 16px; border-radius: 4px; max-width: 700px; max-height: 85vh; overflow-y: auto; border: 2px solid #0a7; }
        .modal-btn { background: #0a7; color: #000; border: none; padding: 6px 12px; margin: 4px 4px 4px 0; cursor: pointer; font-weight: bold; border-radius: 2px; font-size: 11px; }
        .modal-btn:hover { background: #0b8; }
        .modal-title { font-size: 18px; font-weight: bold; color: #0a7; margin-bottom: 8px; }
        textarea { width: 100%; height: 150px; background: #333; color: #0a7; border: 1px solid #555; padding: 6px; font-family: monospace; font-size: 10px; border-radius: 2px; }

        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 6px; margin: 8px 0; }
        .stat { background: #333; padding: 6px; border-radius: 2px; text-align: center; }
        .stat-value { font-size: 18px; font-weight: bold; color: #0a7; }
        .stat-label { font-size: 10px; color: #999; margin-top: 2px; }

        .event-choice { margin: 4px 0; padding: 4px; background: #333; border-left: 2px solid #a70; }
        .event-choice p { margin: 4px 0; font-size: 12px; }
        .trade-offer { background: #333; padding: 6px; margin: 4px 0; border-radius: 2px; font-size: 11px; }
        .trade-offer button { background: #0a7; color: #000; border: none; padding: 2px 6px; margin-top: 2px; cursor: pointer; border-radius: 2px; font-weight: bold; }

        @media (max-width: 900px) {
            .map-grid { grid-template-columns: repeat(6, 1fr); }
            .resources { grid-template-columns: repeat(3, 1fr); }
            .tab-btn { flex: 0 1 50%; }
        }
        @media (max-width: 600px) {
            .map-grid { grid-template-columns: repeat(4, 1fr); }
            .resources { grid-template-columns: repeat(2, 1fr); }
            .header { flex-direction: column; align-items: stretch; }
            .tab-btn { flex: 0 1 33%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div><strong>ASHFALL OUTPOST</strong> Turn <span id="turn">0</span> / 60</div>
            <div class="resources" id="resources"></div>
            <button class="end-turn-btn" id="end-turn-btn" onclick="endTurn()">End Turn [Space]</button>
        </div>

        <div class="main">
            <div class="tabs">
                <div class="tab-buttons">
                    <button class="tab-btn active" data-tab="0" onclick="switchTab(0)">Map</button>
                    <button class="tab-btn" data-tab="1" onclick="switchTab(1)">People</button>
                    <button class="tab-btn" data-tab="2" onclick="switchTab(2)">Research</button>
                    <button class="tab-btn" data-tab="3" onclick="switchTab(3)">Trade</button>
                    <button class="tab-btn" data-tab="4" onclick="switchTab(4)">Log</button>
                    <button class="tab-btn" data-tab="5" onclick="switchTab(5)">Dev</button>
                </div>
                <div class="tab-content" id="tab-0"></div>
                <div class="tab-content" id="tab-1" style="display:none;"></div>
                <div class="tab-content" id="tab-2" style="display:none;"></div>
                <div class="tab-content" id="tab-3" style="display:none;"></div>
                <div class="tab-content" id="tab-4" style="display:none;"></div>
                <div class="tab-content" id="tab-5" style="display:none;"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content" id="modal-content"></div>
    </div>

    <script>
        // ============================================================================
        // ASSUMPTIONS & DESIGN NOTES
        // ============================================================================
        // Seeded deterministic PRNG (mulberry32, default seed 1337)
        // 8x8 map with terrain: ash, rock, water, vent, ruins
        // Colonists: named, 4 job types, skill 1-5 per job, morale & fatigue tracked
        // Economy: 6 resources with caps, production chains (ore->metal, ash->soil->food)
        // Research: 8 nodes in a tree with prerequisites and effects
        // Events: 10+ event types, 4+ have 2-3 branching choices
        // Ashstorms: every ~8 turns, severity escalates
        // Win: turn 60, pop >= 12, food/water needs met
        // Lose: population = 0
        // All state in memory, save/load via JSON textarea, no external resources

        // ============================================================================
        // SEEDED PRNG (mulberry32)
        // ============================================================================
        function mulberry32(a) {
            return function() {
                a |= 0; a = a + 0x6d2b79f5 | 0;
                var t = Math.imul(a ^ a >>> 15, 1 | a);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        // ============================================================================
        // GAME STATE
        // ============================================================================
        let gameState = {
            turn: 0,
            seed: 1337,
            rng: null,
            resources: { food: 50, water: 50, metal: 10, power: 0, parts: 5, scrip: 50 },
            resourceCaps: { food: 500, water: 500, metal: 200, power: 100, parts: 200, scrip: 1000 },
            map: [],
            buildings: {},
            colonists: [],
            research: {},
            log: [],
            eventCooldowns: {},
            nextStormTurn: 8,
            weatherSeverity: 1,
            caravanNextTurn: 15,
            caravanPrice: { food: 1, metal: 2, parts: 5, scrip: 1 }
        };

        // ============================================================================
        // BUILDING DEFINITIONS
        // ============================================================================
        const BUILDINGS = {
            storage: { name: 'Storage', cost: { parts: 8, scrip: 20 }, terrain: ['ash', 'rock'], jobs: [], effect: 'Cap +20%' },
            greenhouse: { name: 'Greenhouse', cost: { parts: 12, scrip: 40 }, terrain: ['ash'], jobs: ['farming'], effect: 'Ash+Water→Food' },
            mine: { name: 'Mine', cost: { parts: 15, scrip: 40 }, terrain: ['rock'], jobs: ['mining'], effect: 'Rock→Metal' },
            forge: { name: 'Forge', cost: { parts: 18, scrip: 50 }, terrain: ['rock'], jobs: ['manufacturing'], effect: 'Metal+Power' },
            ventTap: { name: 'Vent Tap', cost: { parts: 20, scrip: 60 }, terrain: ['vent'], jobs: [], effect: 'Power +20/t' },
            waterWell: { name: 'Water Well', cost: { parts: 10, scrip: 30 }, terrain: ['water'], jobs: ['farming'], effect: 'Water +8/t' },
            condenser: { name: 'Condenser', cost: { parts: 14, scrip: 35 }, terrain: ['water'], jobs: ['farming'], effect: 'Ash→Water' },
            researchLab: { name: 'Lab', cost: { parts: 20, scrip: 80 }, terrain: ['ruins'], jobs: ['research'], effect: 'Tech unlock' },
            market: { name: 'Market', cost: { parts: 15, scrip: 50 }, terrain: ['ruins'], jobs: [], effect: 'Trade access' },
            shelter: { name: 'Shelter', cost: { parts: 8, scrip: 25 }, terrain: ['ash', 'rock'], jobs: [], effect: 'Morale/Storm' }
        };

        // ============================================================================
        // RESEARCH TREE (8 nodes)
        // ============================================================================
        const RESEARCH_NODES = {
            ashRecycling: { name: 'Ash Recycling', cost: { scrip: 30, parts: 8 }, desc: 'Food +20%', prereq: [] },
            advMetallurgy: { name: 'Adv. Metallurgy', cost: { scrip: 50, parts: 15 }, desc: 'Metal +30%', prereq: [] },
            powerGrid: { name: 'Power Grid', cost: { scrip: 60, parts: 20 }, desc: 'Power+20, -cost 20%', prereq: [] },
            stormShield: { name: 'Storm Shield', cost: { scrip: 100, parts: 40 }, desc: 'Storm dmg -50%', prereq: ['powerGrid'] },
            hydroponics: { name: 'Hydroponics', cost: { scrip: 50, parts: 18 }, desc: 'Water+30%', prereq: ['ashRecycling'] },
            autoFarm: { name: 'Auto Farm', cost: { scrip: 90, parts: 35 }, desc: 'Farm -labor 40%', prereq: ['hydroponics', 'powerGrid'] },
            advAgriculture: { name: 'Adv. Agriculture', cost: { scrip: 70, parts: 25 }, desc: 'Food +50%', prereq: ['ashRecycling', 'hydroponics'] },
            climate: { name: 'Climate Sensor', cost: { scrip: 80, parts: 30 }, desc: 'Storm warning +2t', prereq: [] }
        };

        // ============================================================================
        // EVENTS (11 events, 4+ with branching)
        // ============================================================================
        const EVENTS = [
            {
                id: 'dustDevil', name: 'Dust Devil', desc: 'Whirlwind scatters crops.',
                weight: 1.5, choices: [{ text: 'Weather it', fn: () => gameState.resources.food = Math.max(0, gameState.resources.food - 15) }]
            },
            {
                id: 'waterFind', name: 'Water Find', desc: 'Clean spring discovered nearby.',
                weight: 2, choices: [{ text: 'Collect it', fn: () => { gameState.resources.water += 35; clamp(); } }]
            },
            {
                id: 'moraleCrisis', name: 'Morale Crisis', desc: 'Spirits are flagging.',
                weight: 1.5,
                choices: [
                    { text: 'Gathering', fn: () => { gameState.colonists.forEach(c => c.morale = Math.min(100, c.morale + 12)); } },
                    { text: 'Give rations', fn: () => { gameState.resources.food -= 25; gameState.colonists.forEach(c => c.morale = Math.min(100, c.morale + 22)); } }
                ]
            },
            {
                id: 'refugees', name: 'Refugees', desc: 'A group seeks shelter.',
                weight: 1,
                choices: [
                    { text: 'Accept', fn: () => { for (let i = 0; i < 2; i++) addColonist(); } },
                    { text: 'Turn away', fn: () => { gameState.colonists.forEach(c => c.morale -= 8); } }
                ]
            },
            {
                id: 'meteorite', name: 'Meteorite', desc: 'Strike near the outpost.',
                weight: 0.5,
                choices: [
                    { text: 'Harvest metal', fn: () => { gameState.resources.metal += 40; clamp(); } },
                    { text: 'Study for scrip', fn: () => { gameState.resources.scrip += 35; clamp(); } }
                ]
            },
            {
                id: 'ruins', name: 'Ruins Found', desc: 'Old structures nearby.',
                weight: 1.2,
                choices: [
                    { text: 'Scavenge parts', fn: () => { gameState.resources.parts += 20; clamp(); } },
                    { text: 'Search for tech', fn: () => { gameState.resources.scrip += 25; clamp(); } }
                ]
            },
            {
                id: 'sickness', name: 'Illness', desc: 'A colonist falls ill.',
                weight: 1, choices: [{ text: 'Rest them', fn: () => { gameState.colonists[0].morale -= 3; } }]
            },
            {
                id: 'trader', name: 'Trader', desc: 'A wanderer passes by.',
                weight: 1, choices: [{ text: 'Trade', fn: () => { gameState.resources.scrip += 15; } }]
            },
            {
                id: 'foodBlight', name: 'Crop Failure', desc: 'Ash contaminates food.',
                weight: 1.2,
                choices: [
                    { text: 'Discard', fn: () => { gameState.resources.food = Math.max(0, gameState.resources.food - 35); } },
                    { text: 'Salvage', fn: () => { gameState.resources.food = Math.max(0, gameState.resources.food - 12); } }
                ]
            },
            {
                id: 'powerSurge', name: 'Geothermal Surge', desc: 'Vents surge with energy.',
                weight: 0.8, choices: [{ text: 'Harness it', fn: () => { gameState.resources.power += 25; clamp(); } }]
            },
            {
                id: 'innovation', name: 'Innovation', desc: 'A colonist has an idea.',
                weight: 1, choices: [{ text: 'Fund it', fn: () => { gameState.resources.scrip += 20; gameState.resources.parts += 10; clamp(); } }]
            }
        ];

        const COLONIST_NAMES = [
            'Alex', 'Blake', 'Casey', 'Drew', 'Ellis', 'Frey', 'Gray', 'Harper', 'Indy', 'Jace',
            'Kade', 'Lee', 'Morgan', 'Noel', 'Owen', 'Parker', 'Quinn', 'Rowan', 'Sage', 'Taylor'
        ];

        // ============================================================================
        // INITIALIZATION
        // ============================================================================
        function initGame(seed = 1337) {
            gameState.seed = seed;
            gameState.rng = mulberry32(seed);
            gameState.turn = 0;
            gameState.resources = { food: 50, water: 50, metal: 10, power: 0, parts: 5, scrip: 50 };
            gameState.map = [];
            gameState.buildings = {};
            gameState.colonists = [];
            gameState.log = [];
            gameState.eventCooldowns = {};
            gameState.research = {};
            gameState.nextStormTurn = 8;
            gameState.weatherSeverity = 1;
            gameState.caravanNextTurn = 15;

            Object.keys(RESEARCH_NODES).forEach(k => { gameState.research[k] = { done: false }; });

            generateMap();
            for (let i = 0; i < 4; i++) addColonist();

            log('Game started.', 'good');
            render();
        }

        function generateMap() {
            const rng = gameState.rng;
            gameState.map = [];
            const terrains = ['ash', 'rock', 'water', 'vent', 'ruins'];
            const weights = [0.35, 0.30, 0.15, 0.10, 0.10];

            for (let y = 0; y < 8; y++) {
                gameState.map[y] = [];
                for (let x = 0; x < 8; x++) {
                    const r = rng();
                    let cum = 0, terrain = 'ash';
                    for (let i = 0; i < terrains.length; i++) {
                        cum += weights[i];
                        if (r < cum) { terrain = terrains[i]; break; }
                    }
                    gameState.map[y][x] = { terrain };
                }
            }
        }

        function addColonist() {
            const nameIdx = Math.floor(gameState.rng() * COLONIST_NAMES.length);
            const jobs = ['mining', 'farming', 'manufacturing', 'research'];
            gameState.colonists.push({
                id: gameState.colonists.length,
                name: COLONIST_NAMES[nameIdx],
                job: jobs[Math.floor(gameState.rng() * 4)],
                skills: { mining: 1, farming: 1, manufacturing: 1, research: 1 },
                morale: 50,
                fatigue: 0,
                assigned: null
            });
        }

        // ============================================================================
        // PRODUCTION & ECONOMY
        // ============================================================================
        function produce() {
            // Base production from buildings
            Object.entries(gameState.buildings).forEach(([key, btype]) => {
                const c = gameState.colonists.find(x => x.assigned === key);
                if (!c) {
                    if (btype === 'ventTap') gameState.resources.power += 20;
                    return;
                }

                const skill = c.skills[c.job] || 1;
                const moraleMult = Math.max(0.2, c.morale / 100);
                const fatigueMult = Math.max(0.3, 1 - c.fatigue / 100);
                const output = skill * moraleMult * fatigueMult;

                if (btype === 'greenhouse' && gameState.resources.water >= 4) {
                    gameState.resources.water -= 4;
                    gameState.resources.food += 10 * output;
                } else if (btype === 'mine') {
                    gameState.resources.metal += 6 * output;
                } else if (btype === 'forge' && gameState.resources.metal >= 2 && gameState.resources.power >= 1) {
                    gameState.resources.metal -= 2;
                    gameState.resources.power -= 1;
                } else if (btype === 'waterWell') {
                    gameState.resources.water += 8 * output;
                } else if (btype === 'condenser') {
                    gameState.resources.water += 6 * output;
                } else if (btype === 'ventTap') {
                    gameState.resources.power += 20;
                }

                c.fatigue = Math.min(100, c.fatigue + 4);
            });

            clamp();
        }

        function consume() {
            const foodNeed = gameState.colonists.length * 2;
            const waterNeed = gameState.colonists.length * 1.5;

            let foodShort = 0, waterShort = 0;
            if (gameState.resources.food < foodNeed) {
                foodShort = foodNeed - gameState.resources.food;
                gameState.resources.food = 0;
            } else {
                gameState.resources.food -= foodNeed;
            }

            if (gameState.resources.water < waterNeed) {
                waterShort = waterNeed - gameState.resources.water;
                gameState.resources.water = 0;
            } else {
                gameState.resources.water -= waterNeed;
            }

            if (foodShort > 0) {
                gameState.colonists.forEach(c => c.morale -= 5);
                log('Food shortage!', 'warning');
            }
            if (waterShort > 0) {
                gameState.colonists.forEach(c => c.morale -= 5);
                log('Water shortage!', 'warning');
            }
        }

        function clamp() {
            Object.keys(gameState.resources).forEach(res => {
                const cap = gameState.resourceCaps[res];
                if (gameState.resources[res] > cap) {
                    gameState.resources[res] = cap;
                }
                gameState.resources[res] = Math.max(0, gameState.resources[res]);
            });
        }

        // ============================================================================
        // POPULATION
        // ============================================================================
        function updateColonists() {
            gameState.colonists = gameState.colonists.filter(c => {
                if (!c.assigned) {
                    c.fatigue = Math.max(0, c.fatigue - 15);
                    c.morale = Math.min(100, c.morale + 1);
                }
                c.morale = Math.max(-50, c.morale - 1);
                if (c.morale <= 0) {
                    log(c.name + ' left.', 'warning');
                    return false;
                }
                return true;
            });
        }

        // ============================================================================
        // EVENTS
        // ============================================================================
        function fireEvent() {
            const validEvents = EVENTS.filter(e => !gameState.eventCooldowns[e.id] || gameState.eventCooldowns[e.id] < gameState.turn);
            if (validEvents.length === 0) return;

            let wSum = validEvents.reduce((a, e) => a + e.weight, 0);
            let r = gameState.rng() * wSum;
            let chosen = validEvents[0];
            for (const e of validEvents) {
                r -= e.weight;
                if (r <= 0) { chosen = e; break; }
            }

            gameState.eventCooldowns[chosen.id] = gameState.turn + 12;

            if (chosen.choices.length === 1) {
                chosen.choices[0].fn();
                log(chosen.name + ': ' + chosen.desc, 'event');
            } else {
                showEventModal(chosen);
            }
        }

        function showEventModal(event) {
            let html = `<div class="modal-title">${event.name}</div><p>${event.desc}</p>`;
            event.choices.forEach((c, i) => {
                html += `<button class="modal-btn" onclick="resolveEvent(${i})">${c.text}</button>`;
            });
            showModal(html);
            window.pendingEvent = event;
        }

        function resolveEvent(idx) {
            const e = window.pendingEvent;
            e.choices[idx].fn();
            log(e.name + ' resolved', 'event');
            closeModal();
            delete window.pendingEvent;
        }

        // ============================================================================
        // STORM
        // ============================================================================
        function checkStorm() {
            if (gameState.turn >= gameState.nextStormTurn) {
                const dmg = Math.floor(20 * gameState.weatherSeverity);
                gameState.colonists.forEach(c => c.morale -= dmg * 0.2);
                gameState.resources.water -= dmg * 0.5;
                log('ASHSTORM! Damage: ' + dmg, 'warning');
                gameState.weatherSeverity += 0.15;
                gameState.nextStormTurn = gameState.turn + 8;
            }
        }

        // ============================================================================
        // TRADE
        // ============================================================================
        function checkTrade() {
            if (gameState.turn >= gameState.caravanNextTurn) {
                showTradeModal();
                gameState.caravanNextTurn = gameState.turn + 15;
            }
        }

        function showTradeModal() {
            let html = `<div class="modal-title">Caravan Arrived</div>`;
            html += `<p>Prices: Food ${gameState.caravanPrice.food}s, Metal ${gameState.caravanPrice.metal}s, Parts ${gameState.caravanPrice.parts}s</p>`;
            html += `<div class="trade-offer">`;
            html += `<button class="modal-btn" onclick="tradeAction('buyFood', 10)">Buy 10 Food (${10 * gameState.caravanPrice.food}s)</button>`;
            html += `<button class="modal-btn" onclick="tradeAction('buyMetal', 5)">Buy 5 Metal (${5 * gameState.caravanPrice.metal}s)</button>`;
            html += `<button class="modal-btn" onclick="tradeAction('sellFood', 20)">Sell 20 Food (${20 * gameState.caravanPrice.food}s)</button>`;
            html += `<button class="modal-btn" onclick="tradeAction('sellMetal', 10)">Sell 10 Metal (${10 * gameState.caravanPrice.metal}s)</button>`;
            html += `<button class="modal-btn" onclick="closeModal()">Done</button>`;
            html += `</div>`;
            showModal(html);
        }

        function tradeAction(action, qty) {
            const costs = { food: gameState.caravanPrice.food, metal: gameState.caravanPrice.metal, parts: gameState.caravanPrice.parts };
            if (action === 'buyFood') {
                if (gameState.resources.scrip >= qty * costs.food) {
                    gameState.resources.scrip -= qty * costs.food;
                    gameState.resources.food += qty;
                }
            } else if (action === 'buyMetal') {
                if (gameState.resources.scrip >= qty * costs.metal) {
                    gameState.resources.scrip -= qty * costs.metal;
                    gameState.resources.metal += qty;
                }
            } else if (action === 'sellFood') {
                if (gameState.resources.food >= qty) {
                    gameState.resources.food -= qty;
                    gameState.resources.scrip += qty * costs.food;
                }
            } else if (action === 'sellMetal') {
                if (gameState.resources.metal >= qty) {
                    gameState.resources.metal -= qty;
                    gameState.resources.scrip += qty * costs.metal;
                }
            }
            clamp();
        }

        // ============================================================================
        // TURN MANAGEMENT
        // ============================================================================
        function endTurn() {
            produce();
            consume();
            updateColonists();
            checkStorm();
            checkTrade();

            if (gameState.rng() < 0.35) fireEvent();

            gameState.turn++;

            if (gameState.colonists.length === 0) {
                gameOver('DEFEAT', 'Population reached zero.');
                return;
            }

            if (gameState.turn >= 60) {
                const hasPop = gameState.colonists.length >= 12;
                const hasFood = gameState.resources.food >= gameState.colonists.length * 2;
                const hasWater = gameState.resources.water >= gameState.colonists.length * 1.5;

                if (hasPop && hasFood && hasWater) {
                    gameOver('VICTORY', 'Outpost survived the ashfall!');
                } else {
                    gameOver('DEFEAT', hasPop ? 'Failed to maintain resources.' : 'Insufficient population.');
                }
                return;
            }

            clamp();
            render();
        }

        function gameOver(result, msg) {
            const score = calcScore();
            let html = `<div class="modal-title">${result}</div><p>${msg}</p>`;
            html += `<div class="stats">`;
            html += `<div class="stat"><div class="stat-value">${gameState.turn}</div><div class="stat-label">Turns</div></div>`;
            html += `<div class="stat"><div class="stat-value">${gameState.colonists.length}</div><div class="stat-label">Pop</div></div>`;
            html += `<div class="stat"><div class="stat-value">${score}</div><div class="stat-label">Score</div></div>`;
            html += `</div><button class="modal-btn" onclick="initGame(1337)">New Game</button>`;
            showModal(html);
        }

        function calcScore() {
            let s = 0;
            s += gameState.turn * 10;
            s += gameState.colonists.length * 50;
            s += Object.values(gameState.research).filter(r => r.done).length * 100;
            s += Math.floor(gameState.resources.scrip / 10);
            return Math.floor(s);
        }

        // ============================================================================
        // BUILDING & RESEARCH
        // ============================================================================
        function placeBuilding(x, y, btype) {
            const tile = gameState.map[y][x];
            const b = BUILDINGS[btype];
            if (!b.terrain.includes(tile.terrain)) {
                log('Cannot place ' + b.name + ' here.', 'warning');
                return;
            }

            let canBuild = Object.entries(b.cost).every(([r, c]) => gameState.resources[r] >= c);
            if (!canBuild) {
                log('Insufficient resources.', 'warning');
                return;
            }

            Object.entries(b.cost).forEach(([r, c]) => gameState.resources[r] -= c);
            gameState.buildings[x + ',' + y] = btype;
            log('Built ' + b.name, 'good');
            clamp();
            render();
        }

        function doResearch(nodeId) {
            const node = RESEARCH_NODES[nodeId];
            const res = gameState.research[nodeId];
            if (res.done) return;

            if (!node.prereq.every(p => gameState.research[p].done)) {
                log('Missing prerequisites.', 'warning');
                return;
            }

            let canDo = Object.entries(node.cost).every(([r, c]) => gameState.resources[r] >= c);
            if (!canDo) {
                log('Insufficient resources.', 'warning');
                return;
            }

            Object.entries(node.cost).forEach(([r, c]) => gameState.resources[r] -= c);
            res.done = true;
            log('Researched: ' + node.name, 'good');
            clamp();
            render();
        }

        // ============================================================================
        // LOGGING & UI
        // ============================================================================
        function log(msg, type = 'info') {
            gameState.log.push({ turn: gameState.turn, msg, type });
            if (gameState.log.length > 100) gameState.log.shift();
        }

        function render() {
            document.getElementById('turn').textContent = gameState.turn;
            const html = Object.entries(gameState.resources).map(([r, v]) => `
                <div class="resource"><strong>${r}</strong><span>${Math.floor(v)}</span></div>
            `).join('');
            document.getElementById('resources').innerHTML = html;
        }

        function switchTab(idx) {
            document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
            document.querySelectorAll('.tab-content').forEach((c, i) => c.style.display = i === idx ? 'block' : 'none');
            renderTab(idx);
        }

        function renderTab(idx) {
            const sections = [
                () => {
                    let h = '<h3>Map</h3><div class="map-grid">';
                    for (let y = 0; y < 8; y++) {
                        for (let x = 0; x < 8; x++) {
                            const t = gameState.map[y][x];
                            const k = x + ',' + y;
                            const btype = gameState.buildings[k];
                            h += `<div class="tile ${t.terrain}" onclick="showBuildMenu(${x},${y})" title="(${x},${y}) ${t.terrain}">${btype ? BUILDINGS[btype].name[0] : ''}</div>`;
                        }
                    }
                    h += '</div>';
                    return h;
                },
                () => {
                    let h = '<h3>Colonists (' + gameState.colonists.length + ')</h3>';
                    gameState.colonists.forEach(c => {
                        h += `<div class="colonist ${c.morale > 60 ? 'high' : c.morale < 30 ? 'low' : ''}">
                            <div class="colonist-name">${c.name}</div>
                            <div class="colonist-job">${c.job} ${c.skills[c.job]} | Morale: ${Math.floor(c.morale)} | Fatigue: ${Math.floor(c.fatigue)}</div>
                            <div class="colonist-assign">
                                <select onchange="assignColonist(${c.id}, this.value)">
                                    <option value="">Rest</option>
                                    ${Object.entries(gameState.buildings).map(([k, b]) => `<option value="${k}" ${c.assigned === k ? 'selected' : ''}>${BUILDINGS[b].name}</option>`).join('')}
                                </select>
                            </div>
                        </div>`;
                    });
                    return h;
                },
                () => {
                    let h = '<h3>Research</h3>';
                    Object.entries(RESEARCH_NODES).forEach(([id, n]) => {
                        const done = gameState.research[id].done;
                        const prereqMet = n.prereq.every(p => gameState.research[p].done);
                        const canAfford = Object.entries(n.cost).every(([r, c]) => gameState.resources[r] >= c);
                        let cls = done ? 'done' : !prereqMet ? 'locked' : 'available';
                        h += `<div class="research-node ${cls}">
                            <div class="research-title">${n.name}</div>
                            <div class="research-desc">${n.desc}</div>
                            Cost: ${n.cost.scrip}s, ${n.cost.parts}p`;
                        if (n.prereq.length > 0) h += ` | Req: ${n.prereq.map(p => RESEARCH_NODES[p].name).join(', ')}`;
                        if (!done) h += `<br><button class="research-btn" onclick="doResearch('${id}')" ${!canAfford ? 'disabled' : ''}>Research</button>`;
                        else h += `<br><span style="color: #0a7;">✓ Done</span>`;
                        h += `</div>`;
                    });
                    return h;
                },
                () => {
                    let h = '<h3>Trade</h3><p>Caravan next: Turn ' + gameState.caravanNextTurn + '</p>';
                    h += '<p>Prices: Food ' + gameState.caravanPrice.food + 's, Metal ' + gameState.caravanPrice.metal + 's, Parts ' + gameState.caravanPrice.parts + 's</p>';
                    h += '<button class="modal-btn" onclick="checkTrade()">View Caravan</button>';
                    return h;
                },
                () => {
                    let h = '<h3>Log</h3>';
                    [...gameState.log].reverse().slice(0, 50).forEach(e => {
                        h += `<div class="log-entry ${e.type}"><strong>T${e.turn}:</strong> ${e.msg}</div>`;
                    });
                    return h;
                },
                () => {
                    let h = '<h3>Dev Tools</h3>';
                    h += '<button class="modal-btn" onclick="runTests()">Run Tests</button>';
                    h += '<button class="modal-btn" onclick="runBench()">Run Benchmark</button>';
                    h += '<br><br><h3>Save</h3>';
                    h += '<textarea id="save-text" readonly>' + JSON.stringify(gameState, null, 2) + '</textarea>';
                    h += '<button class="modal-btn" onclick="copySave()">Copy</button>';
                    h += '<br><br><h3>Load</h3>';
                    h += '<textarea id="load-text" placeholder="Paste here"></textarea>';
                    h += '<button class="modal-btn" onclick="loadSave()">Load</button>';
                    h += '<br><br><button class="modal-btn" onclick="gameState.resources.scrip+=1000; clamp(); render();">+1000 Scrip</button>';
                    h += '<button class="modal-btn" onclick="addColonist(); render();">+1 Colonist</button>';
                    return h;
                }
            ];

            document.getElementById('tab-' + idx).innerHTML = sections[idx]();
        }

        function showBuildMenu(x, y) {
            const t = gameState.map[y][x];
            const valid = Object.entries(BUILDINGS).filter(([_, b]) => b.terrain.includes(t.terrain));
            let h = `<div class="modal-title">Build at (${x}, ${y}) - ${t.terrain}</div>`;
            valid.forEach(([id, b]) => {
                h += `<div style="background: #333; padding: 6px; margin: 6px 0; border-radius: 2px;">
                    <strong>${b.name}</strong> - ${b.effect}<br>
                    Cost: ${b.cost.parts}p, ${b.cost.scrip}s<br>
                    <button class="modal-btn" onclick="placeBuilding(${x},${y},'${id}'); closeModal();">Build</button>
                </div>`;
            });
            showModal(h);
        }

        function assignColonist(id, key) {
            const c = gameState.colonists.find(x => x.id === id);
            if (c) c.assigned = key || null;
            render();
        }

        function showModal(h) {
            document.getElementById('modal-content').innerHTML = h;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function copySave() {
            const text = document.getElementById('save-text');
            text.select();
            document.execCommand('copy');
            alert('Copied');
        }

        function loadSave() {
            try {
                const data = JSON.parse(document.getElementById('load-text').value);
                Object.assign(gameState, data);
                gameState.rng = mulberry32(gameState.seed);
                render();
                alert('Loaded');
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }

        // ============================================================================
        // TESTING & BENCHMARKING
        // ============================================================================
        function runTests() {
            const tests = [];
            const ok = (c, m) => tests.push({ ok: c, msg: m });

            ok(Object.values(gameState.resources).every(v => v >= 0), 'Resources >= 0');
            ok(Object.entries(gameState.resources).every(([r, v]) => v <= gameState.resourceCaps[r]), 'Caps respected');
            ok(gameState.colonists.length >= 0, 'Pop >= 0');
            ok(Object.entries(gameState.research).every(([id, r]) => !r.done || RESEARCH_NODES[id].prereq.every(p => gameState.research[p].done)), 'Prereqs enforced');
            ok(gameState.map.length === 8 && gameState.map[0].length === 8, 'Map 8x8');
            ok(Object.values(gameState.buildings).every(b => BUILDINGS[b]), 'Buildings valid');
            ok(gameState.colonists.every(c => !c.assigned || gameState.buildings[c.assigned]), 'Assignments valid');
            ok(gameState.colonists.every(c => c.morale >= -100 && c.morale <= 150), 'Morale range');
            ok(gameState.colonists.every(c => c.fatigue >= 0 && c.fatigue <= 100), 'Fatigue range');
            ok(EVENTS.every(e => e.choices.length > 0), 'Events valid');
            ok(Object.values(RESEARCH_NODES).every(n => n.desc && n.cost), 'Research valid');
            ok(Object.values(BUILDINGS).every(b => b.cost.parts > 0 && b.cost.scrip > 0), 'Building costs positive');
            ok(gameState.rng && typeof gameState.rng === 'function', 'RNG exists');

            // Test PRNG determinism
            const rng1 = mulberry32(1337);
            const rng2 = mulberry32(1337);
            ok(rng1() === rng2(), 'RNG deterministic');

            // Test save/load
            const before = JSON.stringify(gameState);
            const loaded = JSON.parse(before);
            ok(JSON.stringify(loaded) === before, 'Save/load roundtrip');

            let h = '<div class="modal-title">Test Results</div>';
            let pass = tests.filter(t => t.ok).length;
            tests.forEach(t => {
                h += `<div style="color: ${t.ok ? '#0a7' : '#a00'}">${t.ok ? '✓' : '✗'} ${t.msg}</div>`;
            });
            h += `<br><strong>${pass}/${tests.length} passed</strong>`;
            showModal(h);
        }

        function runBench() {
            const backup = JSON.parse(JSON.stringify(gameState));
            const seed = gameState.seed;
            initGame(seed);

            for (let i = 0; i < 200; i++) {
                gameState.colonists.forEach((c, idx) => {
                    const keys = Object.keys(gameState.buildings);
                    if (keys.length > 0) c.assigned = keys[idx % keys.length];
                });
                endTurn();
            }

            const hash = hashState();
            let h = `<div class="modal-title">Benchmark Done</div><p>Seed: ${seed}<br>Hash: <code>${hash}</code><br>Pop: ${gameState.colonists.length}<br>Scrip: ${Math.floor(gameState.resources.scrip)}</p>`;
            showModal(h);

            Object.assign(gameState, backup);
            gameState.rng = mulberry32(gameState.seed);
            render();
        }

        function hashState() {
            const s = JSON.stringify({ t: gameState.turn, r: gameState.resources, pc: gameState.colonists.length, bc: Object.keys(gameState.buildings).length });
            let h = 0;
            for (let i = 0; i < s.length; i++) {
                h = ((h << 5) - h) + s.charCodeAt(i);
                h = h & h;
            }
            return Math.abs(h).toString(16);
        }

        // ============================================================================
        // KEYBOARD & INIT
        // ============================================================================
        document.addEventListener('keydown', e => {
            if (e.code === 'Space') {
                e.preventDefault();
                endTurn();
            } else if (e.key >= '1' && e.key <= '6') {
                switchTab(parseInt(e.key) - 1);
            }
        });

        initGame(1337);
    </script>
</body>
</html>
