      for(const c of game.pop){
        if(c.assigned!=null && c.assigned!==i) continue;
        html += `<option value="${c.id}"${worker&&worker.id===c.id?" selected":""}>${esc(c.name)} (${JOBS[c.job].name[0]}${c.skill})</option>`;
      }
      html += `</select></div>`;
      if(!worker && !B.passive) html += `<div class="tag no" style="margin-top:4px">UNSTAFFED — no output</div>`;
    } else if(B.passive){
      const n=adjCount(game,i);
      if(t.bld==="shelter") html += `<div>Housing: <b>${B.housing+n}</b> (base ${B.housing} + ${n} adjacency)</div>`;
      if(t.bld==="windbreak") html += `<div>Storm protection: <b>${B.protect+n}</b></div>`;
      if(t.bld==="cistern") html += `<div>Storage: <b>+${B.storage.water+8*n} water, +${B.storage.food} food</b></div>`;
    }
    html += `<div class="row" style="margin-top:8px">`;
    if(t.dmg) html += `<button id="btnrepair" data-tip="${esc(`Repair to full. Costs ${repairCost(t.dmg).parts} parts + ${repairCost(t.dmg).metal} metal and 15 fatigue on your freshest colonist. Max 2 repairs per turn (${2-game.repairsThisTurn} left).`)}">Repair</button>`;
    html += `<button id="btndemo" data-tip="Tear it down and recover half the build cost.">Demolish</button></div>`;
  } else {
    html += `<div class="sub">Empty tile. Choose a building:</div><table>`;
    for(const k of BLDLIST){
      const B = BUILDINGS[k];
      if(B.terrain.indexOf(t.terrain)<0) continue;
      const err = canBuild(game,i,k);
      const costs = Object.keys(B.cost).map(g=>B.cost[g]+" "+GOODS[g].name).join(", ");
      const save=t.bld; t.bld=k; const n=adjCount(game,i); t.bld=save;
      let tip = `<b>${B.name}</b>\n${B.desc}\nCost: ${costs}`;
      if(B.job) tip += `\nPreferred job: ${JOBS[B.job].name} (other jobs work at 55% rate)`;
      if(B.adj) tip += `\nAdjacency: ${B.adj.label}\nOn this tile that is ${n} matching neighbour(s)` +
        (B.adj.stat==="outmul"?` = ×${r1(1+B.adj.per*n)} output`:` = +${B.adj.per*n}`);
      if(Object.keys(B.inputs||{}).length) tip += `\nConsumes: ${Object.keys(B.inputs).map(g=>B.inputs[g]+" "+GOODS[g].name).join(", ")}/turn`;
      if(Object.keys(B.outputs||{}).length) tip += `\nProduces (base): ${Object.keys(B.outputs).map(g=>B.outputs[g]+" "+GOODS[g].name).join(", ")}/turn`;
      if(err) tip += `\nBLOCKED: ${err}`;
      html += `<tr><td data-tip="${esc(tip)}"><b>${esc(B.name)}</b><br><span class="sub">${esc(costs)}${n&&B.adj?` &middot; adj ${n}`:""}</span></td>
        <td style="width:80px"><button class="bbuild" data-k="${k}" ${err?"disabled":""} data-tip="${esc(err||("Build "+B.name+" here for "+costs))}">Build</button></td></tr>`;
    }
    html += `</table>`;
  }
  html += `<div style="margin-top:6px"><button id="btndesel">Deselect</button></div></div>`;
  el.innerHTML = html;

  const ds=$("btndesel"); if(ds) ds.onclick=()=>{ selectedTile=null; render(); };
  el.querySelectorAll(".bbuild").forEach(b=> b.onclick = ()=>{
    const err = doBuild(game, i, b.dataset.k);
    if(err) flash(err); render();
  });
  const rp=$("btnrepair"); if(rp) rp.onclick=()=>{ const e=doRepair(game,i); if(e) flash(e); render(); };
  const dm=$("btndemo"); if(dm) dm.onclick=()=>{ const e=doDemolish(game,i); if(e) flash(e); render(); };
  const ts=$("tilestaff"); if(ts) ts.onchange=()=>{
    const v = ts.value;
    if(v===""){ if(t.worker!=null){ const c=game.pop.find(p=>p.id===t.worker); if(c) doAssign(game,c.id,null); } }
    else { const e=doAssign(game, +v, i); if(e) flash(e); }
    render();
  };
}

function bar(pct, color){
  return `<div class="bar"><span style="width:${clamp(pct,0,100)}%;background:${color}"></span></div>`;
}

function renderPeople(){
  const el = $("tab-people");
  const posts = game.map.filter(t=>t.bld && !BUILDINGS[t.bld].passive);
  let html = `<div class="card"><h3>ROSTER — ${game.pop.length} colonist(s), housing ${housingCap(game)}</h3>`;
  html += `<div class="sub">Each colonist eats <b>1 food</b> and drinks <b>1 water</b> per turn. Assigned colonists gain
    ${game.research.automation?"5.6":"8"} fatigue/turn and rest off 22/turn when unassigned. Skill rises with matched work.</div>`;
  html += `<table><tr><th>Name</th><th>Job</th><th>Skill</th><th>Fatigue</th><th>Morale</th><th>Assignment</th><th>Output</th></tr>`;
  for(const c of game.pop){
    const t = c.assigned!=null?game.map[c.assigned]:null;
    const eff = t && t.bld ? workerEfficiency(game,c,t.bld) : null;
    const effTip = eff ? `Effectiveness ×${r1(eff.total)}\n• skill ${c.skill} ×${r1(eff.skillMul)}\n• ${c.job===BUILDINGS[t.bld].job?"job match ×1":"job mismatch ×0.55"}\n• morale ${Math.round(c.morale)} ×${r1(eff.moraleMul)}\n• fatigue ${Math.round(c.fatigue)} ×${eff.fatMul}` : "Not assigned — resting (-20 fatigue/turn).";
    const mColor = c.morale>60?"var(--good)":(c.morale>25?"var(--warn)":"var(--bad)");
    const fColor = c.fatigue<50?"var(--good)":(c.fatigue<78?"var(--warn)":"var(--bad)");
    html += `<tr>
      <td>${esc(c.name)}${c.morale<=10?' <span class="tag no">CRITICAL</span>':""}${c.zeroTurns>=1?' <span class="tag no">LEAVING</span>':""}</td>
      <td data-tip="${esc("Job "+JOBS[c.job].name+". Buildings whose preferred job matches get full output; others run at 55%.")}">${JOBS[c.job].name}</td>
      <td class="mono" data-tip="${esc("Skill "+c.skill+"/5 → ×"+r1(0.55+0.15*c.skill)+" output. Progress to next level: "+Math.round((c.xp||0))+"/"+(6+c.skill*4)+" work-points.")}">${c.skill}${"★".repeat(c.skill)}</td>
      <td data-tip="${esc("Fatigue "+Math.round(c.fatigue)+"/100. Above 65 → ×0.70 output; above 90 → ×0.35. Unassign to rest.")}">${Math.round(c.fatigue)} ${bar(c.fatigue,fColor)}</td>
      <td data-tip="${esc("Morale "+Math.round(c.morale)+"/100. Output ×"+r1(0.45+0.55*(c.morale/100))+". At 0 for two turns the colonist leaves.")}">${Math.round(c.morale)} ${bar(c.morale,mColor)}</td>
      <td><select class="asg" data-id="${c.id}"><option value=""${c.assigned===null?" selected":""}>— rest —</option>`;
    for(const p of posts){
      const taken = p.worker!=null && p.worker!==c.id;
      html += `<option value="${p.i}"${c.assigned===p.i?" selected":""}${taken?" disabled":""}>${coordName(p.i)} ${BUILDINGS[p.bld].name}${taken?" (taken)":""}${p.dmg?" [dmg]":""}</option>`;
    }
    html += `</select></td>
      <td class="mono" data-tip="${esc(effTip)}">${eff?"×"+r1(eff.total):"—"}</td></tr>`;
  }
  html += `</table>`;
  if(!game.pop.length) html += `<div class="tag no">The outpost is empty.</div>`;
  html += `</div>`;

  html += `<div class="card"><h3>UNSTAFFED POSTS</h3>`;
  const un = posts.filter(p=>p.worker==null);
  html += un.length ? `<div class="sub">${un.map(p=>coordName(p.i)+" "+BUILDINGS[p.bld].name).join(", ")} — these produce <b>nothing</b> until staffed.</div>`
                    : `<div class="sub">Every post is staffed.</div>`;
  html += `</div>`;
  el.innerHTML = html;
  el.querySelectorAll(".asg").forEach(s=> s.onchange = ()=>{
    const e = doAssign(game, +s.dataset.id, s.value===""?null:+s.value);
    if(e) flash(e); render();
  });
}

function renderResearch(){
  const el = $("tab-research");
  let html = `<div class="card"><h3>RESEARCH — ${RESLIST.filter(k=>game.research[k]).length}/${RESLIST.length} complete</h3>
    <div class="sub">Nodes are paid for with scrip and parts. Effects apply immediately to production, storms or storage.</div>
    <div class="rgrid">`;
  for(const k of RESLIST){
    const R = RESEARCH[k];
    const done = !!game.research[k], avail = researchAvailable(game,k);
    const cost = researchCost(game,k);
    const costStr = Object.keys(cost).map(g=>cost[g]+" "+GOODS[g].name).join(" + ");
    const disc = game.researchDiscount[k];
    let afford = true; for(const g in cost) if(game.res[g]<cost[g]) afford=false;
    const state = done?"done":(avail?"avail":"locked");
    const tag = done?`<span class="tag ok">DONE</span>`:(avail?`<span class="tag mid">AVAILABLE</span>`:`<span class="tag no">LOCKED</span>`);
    const reqStr = R.req.length? R.req.map(r=>`${RESEARCH[r].name}${game.research[r]?" ✓":" ✗"}`).join(", ") : "none";
    html += `<div class="research-node ${state}" data-tip="${esc(`${R.name}\nState: ${state.toUpperCase()}\nPrerequisites: ${reqStr}\nCost: ${costStr}${disc?" (halved by salvaged notes)":""}\nEffect: ${R.eff}`)}">
      <div><b>${esc(R.name)}</b> ${tag}</div>
      <div class="sub">${esc(R.desc)}</div>
      <div class="sub">Requires: ${esc(reqStr)}</div>
      <div class="sub">Cost: ${esc(costStr)}${disc?" <span class='tag mid'>-50%</span>":""}</div>
      ${done?"":`<button class="rbuy" data-k="${k}" ${(!avail||!afford)?"disabled":""} data-tip="${esc(!avail?"Prerequisites not met: "+reqStr:(!afford?"Cannot afford "+costStr:"Research "+R.name+" for "+costStr))}">Research</button>`}
    </div>`;
  }
  html += `</div></div>`;
  el.innerHTML = html;
  el.querySelectorAll(".rbuy").forEach(b=> b.onclick = ()=>{
    const e = doResearch(game, b.dataset.k); if(e) flash(e); render();
  });
}

function renderTrade(){
  const el = $("tab-trade");
  let html = `<div class="card"><h3>TRADE</h3>`;
  const posts = marketPosts(game);
  html += `<div class="sub">Prices = base value &times; global drift &times; your-stockpile modifier &times; caravan margin.
    Trade Posts (${posts}) shift margins ${posts*4}% in your favour${game.research.logistics?"; Logistics reduces the spread by 10%":""}.</div>`;
  if(!game.caravan){
    html += `<div style="margin-top:8px">No caravan present. Next expected around turn <b>${game.nextCaravan}</b>.</div>`;
    html += `<table style="margin-top:8px"><tr><th>Good</th><th>Global drift</th><th>Would buy at</th><th>Would sell at</th></tr>`;
    for(const g of GOODLIST){ if(g==="scrip") continue;
      html += `<tr><td>${GOODS[g].name}</td><td class="mono" data-tip="${esc("Global supply/demand index. Drifts ±0.06 per turn between 0.55 and 1.90, seeded.")}">${r1(game.market[g])}</td>
      <td class="mono">${priceOf(game,g,"buy")}</td><td class="mono">${priceOf(game,g,"sell")}</td></tr>`;
    }
    html += `</table>`;
  } else {
    const C = game.caravan;
    html += `<div style="margin-top:6px">Caravan present. Leaves in <b>${C.turnsLeft}</b> turn(s). It carries <b>${r1(C.scrip)}</b> scrip.</div>`;
    html += `<table style="margin-top:6px"><tr><th>Good</th><th>Stock</th><th>Yours</th><th>Buy @</th><th>Sell @</th><th>Qty</th><th></th></tr>`;
    for(const g of GOODLIST){ if(g==="scrip") continue;
      const have = C.stock[g]||0;
      const bp = priceOf(game,g,"buy"), sp = priceOf(game,g,"sell");
      const caps = storageCaps(game);
      const fill = Math.round(100*game.res[g]/caps[g]);
      const tip = `${GOODS[g].name}\nGlobal drift index ${r1(game.market[g])}\nYour store is ${fill}% full → ${fill>60?"they pay you less":"you pay a little less"}\nBuy ${bp}/unit, Sell ${sp}/unit`;
      html += `<tr data-tip="${esc(tip)}"><td>${GOODS[g].name}</td><td class="mono">${have}</td><td class="mono">${r1(game.res[g])}</td>
        <td class="mono">${bp}</td><td class="mono">${sp}</td>
        <td><input class="qty" data-g="${g}" type="number" min="1" value="1" size="3" style="width:56px"></td>
        <td><button class="tbuy" data-g="${g}" ${have<=0?"disabled":""}>Buy</button>
            <button class="tsell" data-g="${g}" ${game.res[g]<1?"disabled":""}>Sell</button></td></tr>`;
    }
    html += `</table>`;
  }
  html += `</div>`;
  el.innerHTML = html;
  function qty(g){ const i = el.querySelector('.qty[data-g="'+g+'"]'); return i?(+i.value||0):0; }
  el.querySelectorAll(".tbuy").forEach(b=> b.onclick=()=>{ const e=doTrade(game,b.dataset.g,qty(b.dataset.g),"buy"); if(e) flash(e); render(); });
  el.querySelectorAll(".tsell").forEach(b=> b.onclick=()=>{ const e=doTrade(game,b.dataset.g,qty(b.dataset.g),"sell"); if(e) flash(e); render(); });
}

function renderLog(){
  const el = $("log");
  let html="";
  for(let i=game.log.length-1;i>=0;i--){
    const L=game.log[i];
    html += `<div class="logline l-${L.cls}"><span class="t mono">[T${L.t}]</span>${esc(L.text)}</div>`;
  }
  el.innerHTML = html || `<div class="sub">Nothing logged yet.</div>`;
}

function render(){
  $("hdrturn").textContent = `Turn ${game.turn} / 60` + (game.over ? (game.over.win?" — WON":" — LOST") : "");
  $("btnend").disabled = !!(game.over && !game.over.win) ;
  renderResBar();
  if(curTab==="map") renderMap();
  else if(curTab==="people") renderPeople();
  else if(curTab==="research") renderResearch();
  else if(curTab==="trade") renderTrade();
  else if(curTab==="log") renderLog();
}

function flash(msg){
  logE(game, "⚠ "+msg, "warn");
  const el = document.createElement("div");
  el.textContent = msg;
  el.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:#3a2c14;"+
    "border:1px solid var(--acc);color:var(--acc);padding:6px 12px;border-radius:4px;z-index:200;font-size:13px";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}

/* ---- modal ---- */
function openModal(html, onOpen){
  $("modalbox").innerHTML = html;
  $("modal").classList.add("on");
  if(onOpen) onOpen();
}
function closeModal(){ $("modal").classList.remove("on"); $("modalbox").innerHTML=""; }

function presentEvent(e){
  let html = `<h2>${esc(e.title)}</h2><div class="sub" style="margin-bottom:8px">${esc(e.text)}</div>`;
  e.choices.forEach((c,idx)=>{
    html += `<button class="choice ev" data-i="${idx}" data-tip="${esc(c.tip)}"><b>${esc(c.label)}</b><br><span class="sub">${esc(c.tip)}</span></button>`;
  });
  openModal(html, ()=>{
    $("modalbox").querySelectorAll(".ev").forEach(b=> b.onclick = ()=>{
      e.choices[+b.dataset.i].apply(game);
      closeModal();
      checkEnd(game);
      if(game.over && game.scoredAt===null) showSummary();
      render();
    });
  });
}

function showSummary(){
  game.scoredAt = game.turn;
  const s = game.over.score;
  const built = game.map.filter(t=>t.bld).length;
  let html = `<h2>${game.over.win?"OUTPOST HELD — VICTORY":"OUTPOST LOST"}</h2>
    <div class="sub" style="margin-bottom:8px">${esc(game.over.reason)}</div>
    <table>
    <tr><th>Component</th><th>Detail</th><th>Points</th></tr>
    <tr><td>Population</td><td>${game.pop.length} colonists &times; 50</td><td class="mono">${s.popPts}</td></tr>
    <tr><td>Colonist skill</td><td>${game.pop.reduce((a,c)=>a+c.skill,0)} total skill &times; 10</td><td class="mono">${s.skillPts}</td></tr>
    <tr><td>Research</td><td>${RESLIST.filter(k=>game.research[k]).length}/${RESLIST.length} nodes &times; 45</td><td class="mono">${s.resPts}</td></tr>
    <tr><td>Buildings</td><td>${built} standing &times; 12</td><td class="mono">${s.bldPts}</td></tr>
    <tr><td>Stockpiles</td><td>weighted goods total</td><td class="mono">${s.stockPts}</td></tr>
    <tr><td>Turns survived</td><td>${game.turn} &times; 8</td><td class="mono">${s.turnPts}</td></tr>
    <tr><td><b>FINAL SCORE</b></td><td></td><td class="mono"><b>${s.total}</b></td></tr>
    </table>
    <div class="sub" style="margin-top:8px">Storms weathered ${game.stats.storms} &middot; events ${game.stats.eventsFired} &middot;
      arrivals ${game.stats.joined} &middot; departures ${game.stats.left} &middot; ${r1(game.stats.overflow)} goods lost to overflow.</div>
    <div class="row" style="margin-top:10px">
      <button id="mclose">${game.over.win?"Keep playing (endless)":"Close"}</button>
      <button id="mnew" class="primary">New Game</button>
    </div>`;
  openModal(html, ()=>{
    $("mclose").onclick = ()=>{ closeModal(); render(); };
    $("mnew").onclick = ()=>{ closeModal(); startNew(); };
  });
}

function endTurn(){
  if(game.over && !game.over.win) { showSummary(); return; }
  if($("modal").classList.contains("on")) return;
  const pending = resolveTurn(game);
  render();
  if(pending) presentEvent(pending);
  else if(game.over && game.scoredAt===null) showSummary();
}

function startNew(){
  const raw = ($("seedin").value||"").trim();
  let seed = parseInt(raw,10);
  if(!isFinite(seed)){ // allow text seeds by hashing them
    seed = parseInt(hashString(raw||"1337"),16);
  }
  game = newGame(seed>>>0);
  selectedTile=null;
  $("seedin").value = String(game.seed);
  render();
}

/* ---- buttons ---- */
$("btnend").onclick = endTurn;
$("btnnew").onclick = startNew;

$("btnsave").onclick = ()=>{
  const txt = serialize(game);
  $("savebox").value = txt;
  $("saveinfo").textContent = `${txt.length} chars, hash ${hashString(canonical(JSON.parse(txt)))}`;
};
$("btncopy").onclick = ()=>{ $("savebox").focus(); $("savebox").select(); $("saveinfo").textContent="Selected — press Ctrl+C to copy."; };
$("btnload").onclick = ()=>{
  const txt = $("savebox").value.trim();
  if(!txt){ $("saveinfo").innerHTML = `<span class="fail">Nothing to load: the box is empty.</span>`; return; }
  try {
    const S = deserialize(txt);
    game = S; selectedTile=null;
    $("seedin").value = String(game.seed);
    $("saveinfo").innerHTML = `<span class="pass">Loaded — turn ${game.turn}, ${game.pop.length} colonists, hash ${hashString(canonical(JSON.parse(serialize(game))))}</span>`;
    render();
  } catch(err){
    $("saveinfo").innerHTML = `<span class="fail">LOAD FAILED: ${esc(err.message)}</span>`;
  }
};

$("btntests").onclick = ()=>{
  const t0 = perfNow();
  const r = runTests(game);
  let s = `RUNNING INVARIANT SUITE\n${"=".repeat(52)}\n`;
  for(const a of r.out) s += (a.ok?"PASS  ":"FAIL  ") + a.name + (a.detail?"\n         ("+a.detail+")":"") + "\n";
  s += "=".repeat(52)+`\n${r.pass} passed, ${r.fail} failed, ${r.pass+r.fail} assertions in ${Math.round(perfNow()-t0)}ms\n`;
  s += r.fail===0 ? "ALL INVARIANTS HOLD." : "INVARIANT VIOLATIONS PRESENT.";
  const pre = $("devout");
  pre.textContent = s;
  pre.innerHTML = pre.innerHTML.replace(/^PASS/gm,'<span class="pass">PASS</span>').replace(/^FAIL/gm,'<span class="fail">FAIL</span>');
};

$("btnbench").onclick = ()=>{
  const seed = game.seed;
  const t0 = perfNow();
  const a = runBenchmark(seed,200);
  const b = runBenchmark(seed,200);
  const dt = Math.round(perfNow()-t0);
  let s = `HEADLESS BENCHMARK — 200 turns, seed ${seed}, fixed greedy policy\n${"=".repeat(52)}\n`;
  s += `run 1 hash : ${a.hash}\nrun 2 hash : ${b.hash}\ndeterministic: ${a.hash===b.hash?"YES — identical":"NO — MISMATCH"}\n`;
  s += "-".repeat(52)+"\n";
  s += `turns reached  : ${a.turn-1}\noutpost alive  : ${a.alive?"yes":"no (wiped out)"}\n`;
  s += `population     : ${a.pop}\nbuildings      : ${a.buildings} (${a.damaged} damaged)\n`;
  s += `research done  : ${a.research}/${RESLIST.length}\nstorms survived: ${a.storms}\nevents fired   : ${a.stats.eventsFired}\n`;
  s += `arrivals/exits : ${a.stats.joined}/${a.stats.left}\noverflow lost  : ${r1(a.stats.overflow)}\n`;
  s += `final stores   : ${GOODLIST.map(g=>g+" "+r1(a.res[g])).join(", ")}\n`;
  s += `score          : ${a.score}\n`;
  s += "-".repeat(52)+`\ncompleted in ${dt}ms (both runs)`;
  $("devout").textContent = s;
};

$("btnsim10").onclick = ()=>{
  for(let i=0;i<10 && !(game.over&&!game.over.win);i++) greedyStep(game);
  $("devout").textContent = `Auto-played 10 turns with the greedy policy.\nNow turn ${game.turn}, population ${game.pop.length}, ` +
    `research ${RESLIST.filter(k=>game.research[k]).length}/${RESLIST.length}, score ${computeScore(game).total}.`;
  if(game.over && game.scoredAt===null) showSummary();
  render();
};

function perfNow(){ return (typeof performance!=="undefined" && performance.now)?performance.now():0; }

/* ---- boot ---- */
render();
</script>
</body>
</html>
