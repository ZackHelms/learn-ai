<body>
<div id="game"></div>

<script>
/*
ASHFALL OUTPOST - Game Assumptions & Design Notes
===================================================
1. PRNG: Mulberry32 seeded PRNG, seed 1337 default, player-editable.
2. Turn order: resolve ashstorm → consume resources → apply morale/fatigue
              → produce resources → fire events → advance caravan/trade.
3. Production: ore→metal at forge (power cost), ash→soil→food at greenhouse (water cost).
4. Colonists: 4 jobs (miner, farmer, engineer, scientist). Skills 1-5, grow from use.
5. Morale: drops on hunger/thirst, rises on rest/comfort. Zero = colonist leaves.
6. Research: 8 nodes, mostly about production/resilience. Scrip/parts costs.
7. Events: 10+ weighted events, some with 2-3 choices causing real state changes.
8. Trade: caravan every 4 turns with dynamic pricing based on stockpiles.
9. Hazards: ashstorms every 8-12 turns, severity scale(turn). Damages buildings,
           increases water consumption. Repairs cost parts/labor.
10. Save/Load: JSON serialize to textarea, load with validation.
11. Win: Turn 60 + pop >= 12 + needs met. Lose: pop = 0. Score from pop/research/resources/turns.
12. UI: 5 tabs (Map, People, Research, Events, Trade, Dev). Keyboard: Space=endTurn, 1-6=tabs.
13. All state in memory, no storage APIs, no external resources.
*/

// ============================================================================
// PRNG - Mulberry32
// ============================================================================
function mulberry32(a) {
  return function() {
    var t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}

// ============================================================================
// GAME STATE & CONSTANTS
// ============================================================================
const BUILDINGS = {
  QUARTERS: { name: 'Quarters', icon: '🏠', terrain: ['ash', 'rock'], cost: { scrip: 50 }, storage: { capacity: 20 }, production: {}, description: 'Housing for colonists' },
  MINE: { name: 'Mine', icon: '⛏', terrain: ['rock'], cost: { scrip: 80, parts: 10 }, production: { ore: 2 }, requires_power: false, skill: 'miner', description: 'Extracts ore from rock' },
  FORGE: { name: 'Forge', icon: '🔥', terrain: ['ash', 'rock'], cost: { scrip: 100, parts: 20 }, production: {}, requires_power: true, skill: 'engineer', conversions: [{ input: 'ore', output: 'metal', ratio: 2, power_cost: 1 }], description: 'Converts ore→metal (needs power)' },
  GREENHOUSE: { name: 'Greenhouse', icon: '🌱', terrain: ['ash', 'rock'], cost: { scrip: 100, parts: 15 }, production: {}, skill: 'farmer', conversions: [{ input: 'ash', output: 'soil', ratio: 3, water_cost: 1 }, { input: 'soil', output: 'food', ratio: 1, water_cost: 1 }], description: 'Converts ash→soil→food (needs water)' },
  GENERATOR: { name: 'Generator', icon: '⚡', terrain: ['rock', 'vent'], cost: { scrip: 150, parts: 30 }, production: { power: 3 }, requires_water: true, adjacency_bonus: { vent: 2 }, description: 'Generates power (bonus next to vent)' },
  CONDENSER: { name: 'Condenser', icon: '💧', terrain: ['ash', 'rock'], cost: { scrip: 120, parts: 25 }, production: { water: 2 }, adjacency_bonus: { water: 2 }, description: 'Produces water (bonus next to water)' },
  STORAGE: { name: 'Storage', icon: '📦', terrain: ['ash', 'rock'], cost: { scrip: 75, parts: 15 }, storage: { capacity: 50 }, production: {}, description: 'Increases storage capacity' },
  LAB: { name: 'Lab', icon: '🔬', terrain: ['ash', 'rock'], cost: { scrip: 120, parts: 20 }, production: { scrip: 1 }, skill: 'scientist', requires_power: true, description: 'Generates research scrip (needs power)' },
  SHELTER: { name: 'Shelter', icon: '⛑', terrain: ['ash', 'rock'], cost: { scrip: 100, parts: 25 }, production: {}, damage_reduction: 0.3, description: 'Reduces storm damage by 30%' },
};

const JOBS = ['miner', 'farmer', 'engineer', 'scientist'];
const RESOURCES = ['food', 'water', 'metal', 'ore', 'power', 'parts', 'scrip', 'ash', 'soil'];

const RESEARCH_TREE = [
  { id: 'ore_refining', name: 'Ore Refining', cost: { scrip: 100 }, prereqs: [], effect: 'ore_yield +1', description: 'Improve mining output' },
  { id: 'irrigation', name: 'Irrigation', cost: { scrip: 100, parts: 20 }, prereqs: [], effect: 'water_yield +1', description: 'Improve water production' },
  { id: 'power_grid', name: 'Power Grid', cost: { scrip: 120, parts: 30 }, prereqs: [], effect: 'power_yield +1', description: 'Improve power generation' },
  { id: 'advanced_forge', name: 'Advanced Forge', cost: { scrip: 150, parts: 40 }, prereqs: ['ore_refining'], effect: 'ore_efficiency', description: 'Ore→Metal ratio improves' },
  { id: 'soil_science', name: 'Soil Science', cost: { scrip: 150, parts: 35 }, prereqs: ['irrigation'], effect: 'soil_efficiency', description: 'Ash→Soil conversion improves' },
  { id: 'shelter_tech', name: 'Shelter Tech', cost: { scrip: 120, parts: 35 }, prereqs: [], effect: 'shelter_defense +20%', description: 'Storm shelters more effective' },
  { id: 'preservation', name: 'Preservation', cost: { scrip: 100, parts: 25 }, prereqs: [], effect: 'food_storage +25%', description: 'Food storage efficiency' },
  { id: 'advanced_lab', name: 'Advanced Lab', cost: { scrip: 200, parts: 50 }, prereqs: ['power_grid'], effect: 'scrip_yield +2', description: 'Lab production doubled' },
];

const EVENTS = [
  {
    id: 'dust_storm',
    name: 'Dust Storm',
    description: 'A minor dust storm rolls in.',
    weight: 5,
    cooldown: 3,
    fire_turn: 3,
    outcomes: [
      { text: 'Seal the shelters', effect: (g) => { g.resources.water -= 5; }, morale_change: 5 },
    ]
  },
  {
    id: 'ore_vein',
    name: 'Rich Ore Vein',
    description: 'Miners discover an unexpectedly rich ore deposit!',
    weight: 3,
    cooldown: 6,
    outcomes: [
      { text: 'Mine it out', effect: (g) => { g.resources.ore += 40; }, morale_change: 10 },
    ]
  },
  {
    id: 'water_source',
    name: 'Underground Water Found',
    description: 'Drilling crews break through to a water aquifer.',
    weight: 2,
    cooldown: 8,
    outcomes: [
      { text: 'Tap it', effect: (g) => { g.resources.water += 50; }, morale_change: 8 },
    ]
  },
  {
    id: 'settler_arrival',
    name: 'Survivors Arrive',
    description: 'A group of ash-covered travelers approaches the outpost.',
    weight: 4,
    cooldown: 5,
    outcomes: [
      { text: 'Welcome them', effect: (g) => { if (g.colonists.length < 20) { g.addColonist(generateColonist(g.rng)); g.resources.food -= 10; } }, morale_change: 5 },
      { text: 'Turn them away', effect: (g) => {}, morale_change: -8 },
    ]
  },
  {
    id: 'equipment_malfunction',
    name: 'Equipment Malfunction',
    description: 'Critical equipment has failed and needs urgent repair.',
    weight: 3,
    cooldown: 4,
    outcomes: [
      { text: 'Repair immediately', effect: (g) => { g.resources.parts -= 15; }, morale_change: 8 },
      { text: 'Postpone repair', effect: (g) => { g.resources.power -= 5; }, morale_change: -5 },
    ]
  },
  {
    id: 'ash_fall',
    name: 'Heavy Ash Fall',
    description: 'Volcanic ash accumulates rapidly around the outpost.',
    weight: 6,
    cooldown: 3,
    outcomes: [
      { text: 'Collect ash', effect: (g) => { g.resources.ash += 30; }, morale_change: 0 },
    ]
  },
  {
    id: 'morale_crisis',
    name: 'Morale Crisis',
    description: 'Colonists are growing desperate and questioning leadership.',
    weight: 2,
    cooldown: 7,
    outcomes: [
      { text: 'Rally the people', effect: (g) => { g.colonists.forEach(c => c.morale = Math.min(100, c.morale + 20)); }, morale_change: 0 },
      { text: 'Grant rations boost', effect: (g) => { g.resources.food -= 15; g.colonists.forEach(c => c.morale = Math.min(100, c.morale + 15)); }, morale_change: 0 },
    ]
  },
  {
    id: 'trade_surge',
    name: 'Trade Surge',
    description: 'Market demand is unexpectedly high.',
    weight: 3,
    cooldown: 5,
    outcomes: [
      { text: 'Sell metal', effect: (g) => { const amount = Math.min(g.resources.metal, 20); g.resources.metal -= amount; g.resources.scrip += amount * 3; }, morale_change: 3 },
    ]
  },
  {
    id: 'vent_hazard',
    name: 'Volcanic Venting',
    description: 'A nearby vent expels toxic gas unexpectedly.',
    weight: 2,
    cooldown: 6,
    outcomes: [
      { text: 'Evacuate the area', effect: (g) => { g.resources.power -= 10; }, morale_change: -3 },
      { text: 'Harness the heat', effect: (g) => { g.resources.power += 15; }, morale_change: 5 },
    ]
  },
  {
    id: 'tool_cache',
    name: 'Abandoned Tool Cache',
    description: 'An old shelter reveals supplies from before the eruption.',
    weight: 2,
    cooldown: 8,
    outcomes: [
      { text: 'Salvage it', effect: (g) => { g.resources.parts += 25; g.resources.metal += 10; }, morale_change: 8 },
    ]
  },
];

const COLONIST_NAMES = [
  'Alex', 'Bailey', 'Casey', 'Dana', 'Ellis', 'Finley', 'Gale', 'Harper',
  'Indigo', 'Jordan', 'Kai', 'Logan', 'Morgan', 'Noel', 'Oakley', 'Parker',
  'Quinn', 'Riley', 'Sam', 'Taylor', 'Ulysses', 'Vega', 'Wesley', 'Xander',
];

// ============================================================================
// PRNG-BASED GENERATION
// ============================================================================
function generateTerrain(rng, x, y) {
  const v = rng();
  if (v < 0.50) return 'ash';
  if (v < 0.65) return 'rock';
  if (v < 0.75) return 'water';
  if (v < 0.82) return 'ruins';
  return 'vent';
}

function generateColonist(rng) {
  const nameIdx = Math.floor(rng() * COLONIST_NAMES.length);
  const jobIdx = Math.floor(rng() * JOBS.length);
  const skills = {};
  JOBS.forEach(job => {
    skills[job] = Math.floor(rng() * 3) + 1; // 1-3 initial skill
  });
  return {
    name: COLONIST_NAMES[nameIdx],
    job: JOBS[jobIdx],
    skills,
    fatigue: 0,
    morale: 50,
  };
}

// ============================================================================
// GAME OBJECT
// ============================================================================
class Game {
  constructor(seed = 1337) {
    this.seed = seed;
    this.rng = mulberry32(seed);
    this.turn = 0;
    this.game_over = false;
    this.win = false;

    // Resources: food, water, metal, ore, power, parts, scrip, ash, soil
    this.resources = {
      food: 50,
      water: 50,
      metal: 20,
      ore: 10,
      power: 30,
      parts: 40,
      scrip: 200,
      ash: 100,
      soil: 0,
    };
    this.storage_used = 0;
    this.storage_capacity = 100;

    // Map: 8x8
    this.map = [];
    for (let y = 0; y < 8; y++) {
      const row = [];
      for (let x = 0; x < 8; x++) {
        row.push({
          x, y,
          terrain: generateTerrain(this.rng, x, y),
          building: null,
          building_health: 1,
        });
      }
      this.map.push(row);
    }

    // Colonists
    this.colonists = [];
    for (let i = 0; i < 4; i++) {
      this.colonists.push(generateColonist(this.rng));
    }

    // Research
    this.research_done = {};
    RESEARCH_TREE.forEach(r => this.research_done[r.id] = false);

    // Events
    this.event_log = [];
    this.fired_events = {};
    EVENTS.forEach(e => this.fired_events[e.id] = 0);

    // Trade
    this.caravan_timer = 4;
    this.trade_prices = {
      food: 2,
      water: 2,
      metal: 4,
      ore: 2,
      power: 3,
      parts: 5,
    };
    this.trade_supply = {}; // supply/demand drift
    Object.keys(this.trade_prices).forEach(r => this.trade_supply[r] = 0);

    // Hazard
    this.ashstorm_timer = 10;
    this.storm_damage_reduction = 0;

    // Dev
    this.test_output = '';
    this.benchmark_output = '';
  }

  getTile(x, y) {
    return this.map[y] ? this.map[y][x] : null;
  }

  canBuild(building_type, x, y) {
    const tile = this.getTile(x, y);
    if (!tile || tile.building) return false;
    const building = BUILDINGS[building_type];
    if (!building.terrain.includes(tile.terrain)) return false;
    // Check research prereqs
    if (building_type === 'ADVANCED_FORGE' && !this.research_done['advanced_forge']) return false;
    // Check cost
    for (let [r, cost] of Object.entries(building.cost)) {
      if (this.resources[r] < cost) return false;
    }
    return true;
  }

  buildBuilding(building_type, x, y) {
    const tile = this.getTile(x, y);
    if (!this.canBuild(building_type, x, y)) return false;
    const building = BUILDINGS[building_type];
    for (let [r, cost] of Object.entries(building.cost)) {
      this.resources[r] -= cost;
    }
    tile.building = building_type;
    tile.building_health = 1;
    this.log(`[T${this.turn}] Built ${building.name} at (${x}, ${y})`);
    return true;
  }

  addColonist(colonist) {
    this.colonists.push(colonist);
  }

  removeColonist(colonist) {
    const idx = this.colonists.indexOf(colonist);
    if (idx !== -1) this.colonists.splice(idx, 1);
  }

  log(text) {
    this.event_log.push({ turn: this.turn, text });
  }

  endTurn() {
    if (this.game_over) return;

    // TURN ORDER
    // 1. Ashstorm check
    this.ashstorm_timer--;
    if (this.ashstorm_timer <= 0) {
      this.triggerAshstorm();
      this.ashstorm_timer = 8 + Math.floor(this.rng() * 5);
    }

    // 2. Resource consumption (food, water)
    for (let c of this.colonists) {
      this.resources.food -= 1;
      this.resources.water -= 1;
    }

    // 3. Check hunger/thirst, morale changes
    let hungry = false, thirsty = false;
    if (this.resources.food < 0) {
      hungry = true;
      this.resources.food = 0;
      this.colonists.forEach(c => c.morale -= 5);
    }
    if (this.resources.water < 0) {
      thirsty = true;
      this.resources.water = 0;
      this.colonists.forEach(c => c.morale -= 5);
    }
    if (hungry) this.log(`[T${this.turn}] Colonists are hungry!`);
    if (thirsty) this.log(`[T${this.turn}] Water shortage!`);

    // 4. Produce resources from buildings
    this.produceResources();

    // 5. Fire events
    this.fireEvent();

    // 6. Caravan/trade
    this.caravan_timer--;
    if (this.caravan_timer <= 0) {
      this.log(`[T${this.turn}] Caravan has arrived!`);
      this.updateTradeState();
      this.caravan_timer = 4 + Math.floor(this.rng() * 3);
    }

    // 7. Morale/fatigue decay, colonist departures
    for (let c of this.colonists) {
      if (c.morale <= 0) {
        this.removeColonist(c);
        this.log(`[T${this.turn}] ${c.name} has left the outpost.`);
      } else {
        c.morale = Math.max(0, c.morale - 2); // passive decay
        c.fatigue = Math.max(0, c.fatigue - 1); // recovery
      }
    }

    // 8. Check loss condition
    if (this.colonists.length === 0) {
      this.game_over = true;
      this.win = false;
      this.log(`[T${this.turn}] OUTPOST FAILED: No colonists remain.`);
    }

    // 9. Check win condition (turn 60, pop >= 12, resources)
    this.turn++;
    if (this.turn >= 60 && this.colonists.length >= 12 && this.resources.food >= 20 && this.resources.water >= 20) {
      this.game_over = true;
      this.win = true;
      this.log(`[T${this.turn}] OUTPOST STABLE: You have survived!`);
    }

    // 10. Log turn summary
    this.log(`[T${this.turn}] Turn ended. Resources: F${this.resources.food} W${this.resources.water} M${this.resources.metal} P${this.resources.power}`);
  }

  triggerAshstorm() {
    const severity = Math.min(1, this.turn / 60); // scales over game
    this.log(`[T${this.turn}] ASHSTORM! (severity ${(severity * 100).toFixed(0)}%)`);
    this.resources.water -= Math.ceil(5 * (1 + severity));

    // Damage buildings
    for (let y = 0; y < 8; y++) {
      for (let x = 0; x < 8; x++) {
        const tile = this.getTile(x, y);
        if (tile.building) {
          const dmg = Math.max(0.2, 0.7 - this.storm_damage_reduction);
          if (this.rng() < dmg) {
            tile.building_health -= 0.3;
            if (tile.building_health <= 0) tile.building_health = 0.1; // severely damaged
          }
        }
      }
    }
  }

  produceResources() {
    for (let y = 0; y < 8; y++) {
      for (let x = 0; x < 8; x++) {
        const tile = this.getTile(x, y);
        if (!tile.building) continue;
        const building = BUILDINGS[tile.building];
        const health_factor = tile.building_health; // 0-1, damaged = low output

        // Find colonist assigned
        let assigned_colonist = null;
        let skill_bonus = 1;
        for (let c of this.colonists) {
          if (c.job === building.skill || !building.skill) {
            assigned_colonist = c;
            skill_bonus = c.skills[building.skill] || 1;
            break;
          }
        }

        if (!assigned_colonist && building.skill) continue; // no one to work it

        // Check power requirement
        if (building.requires_power) {
          if (this.resources.power < (building.power_cost || 1)) continue;
          this.resources.power -= (building.power_cost || 1);
        }

        // Adjacency bonus
        let adjacency = 1;
        if (building.adjacency_bonus) {
          for (let [terrain, bonus] of Object.entries(building.adjacency_bonus)) {
            for (let dx = -1; dx <= 1; dx++) {
              for (let dy = -1; dy <= 1; dy++) {
                if (dx === 0 && dy === 0) continue;
                const adj = this.getTile(x + dx, y + dy);
                if (adj && adj.terrain === terrain) adjacency += bonus / 10;
              }
            }
          }
        }

        // Direct production
        if (building.production) {
          for (let [res, amount] of Object.entries(building.production)) {
            const produce = amount * skill_bonus * health_factor * adjacency;
            this.resources[res] += produce;
            if (assigned_colonist) {
              assigned_colonist.skills[assigned_colonist.job] += 0.01; // slow skill growth
              assigned_colonist.morale += 2;
              assigned_colonist.fatigue += 1;
            }
          }
        }

        // Conversion chains (greenhouse, forge)
        if (building.conversions) {
          for (let conversion of building.conversions) {
            if (this.resources[conversion.input] >= conversion.ratio) {
              const convert_amount = Math.floor(this.resources[conversion.input] / conversion.ratio);
              this.resources[conversion.input] -= convert_amount * conversion.ratio;
              this.resources[conversion.output] += convert_amount;
              if (assigned_colonist) {
                assigned_colonist.skills[assigned_colonist.job] += 0.01;
                assigned_colonist.morale += 1;
                assigned_colonist.fatigue += 1;
              }
            }
          }
        }
      }
    }

    // Storage cap
    let total = Object.values(this.resources).reduce((a, b) => a + b, 0);
    if (total > this.storage_capacity) {
      const overflow = total - this.storage_capacity;
      this.log(`[T${this.turn}] OVERFLOW: ${overflow} resources lost!`);
      for (let res of RESOURCES) {
        const drop = Math.min(this.resources[res], overflow);
        this.resources[res] -= drop;
      }
    }
  }

  fireEvent() {
    const weights = EVENTS.map(e => {
      const cooldown_done = !this.fired_events[e.id] || (this.turn - this.fired_events[e.id]) >= e.cooldown;
      return cooldown_done ? e.weight : 0;
    });
    const total_weight = weights.reduce((a, b) => a + b, 0);
    if (total_weight === 0) return;

    let pick = this.rng() * total_weight;
    for (let i = 0; i < EVENTS.length; i++) {
      pick -= weights[i];
      if (pick <= 0) {
        const event = EVENTS[i];
        this.fired_events[event.id] = this.turn;
        const outcome = event.outcomes[Math.floor(this.rng() * event.outcomes.length)];
        this.log(`[T${this.turn}] EVENT: ${event.name} - "${outcome.text}"`);
        outcome.effect(this);
        this.colonists.forEach(c => c.morale += outcome.morale_change);
        break;
      }
    }
  }

  updateTradeState() {
    // Dynamic pricing based on stockpiles and supply/demand
    for (let res of ['food', 'water', 'metal', 'ore', 'power', 'parts']) {
      const supply_drift = (this.rng() - 0.5) * 0.2;
      this.trade_supply[res] += supply_drift;
      this.trade_supply[res] = Math.max(-1, Math.min(1, this.trade_supply[res]));
      this.trade_prices[res] = Math.max(1, 2 + this.trade_supply[res] + (this.resources[res] > 200 ? -0.5 : 0));
    }
  }

  calculateScore() {
    let score = 0;
    score += this.colonists.length * 100;
    score += Object.keys(this.research_done).filter(k => this.research_done[k]).length * 150;
    score += this.resources.scrip;
    score += this.turn * 10;
    return score;
  }

  // ========== RESEARCH ==========
  canResearch(research_id) {
    const research = RESEARCH_TREE.find(r => r.id === research_id);
    if (!research) return false;
    if (this.research_done[research_id]) return false;
    // Check prereqs
    for (let prereq of research.prereqs) {
      if (!this.research_done[prereq]) return false;
    }
    // Check cost
    for (let [res, cost] of Object.entries(research.cost)) {
      if (this.resources[res] < cost) return false;
    }
    return true;
  }

  doResearch(research_id) {
    if (!this.canResearch(research_id)) return false;
    const research = RESEARCH_TREE.find(r => r.id === research_id);
    for (let [res, cost] of Object.entries(research.cost)) {
      this.resources[res] -= cost;
    }
    this.research_done[research_id] = true;
    this.log(`[T${this.turn}] Researched: ${research.name}`);
    // Apply effects
    if (research_id === 'ore_refining') this.resources.ore += 5;
    if (research_id === 'irrigation') this.resources.water += 5;
    if (research_id === 'power_grid') this.resources.power += 5;
    if (research_id === 'shelter_tech') this.storm_damage_reduction += 0.2;
    return true;
  }

  // ========== TRADE ==========
  buyResource(res, amount) {
    const cost = amount * this.trade_prices[res];
    if (this.resources.scrip < cost) return false;
    this.resources.scrip -= cost;
    this.resources[res] += amount;
    this.log(`[T${this.turn}] Bought ${amount} ${res} for ${cost} scrip`);
    return true;
  }

  sellResource(res, amount) {
    if (this.resources[res] < amount) return false;
    const scrip_gain = amount * this.trade_prices[res];
    this.resources[res] -= amount;
    this.resources.scrip += scrip_gain;
    this.log(`[T${this.turn}] Sold ${amount} ${res} for ${scrip_gain} scrip`);
    return true;
  }

  // ========== SAVE/LOAD ==========
  serialize() {
    return JSON.stringify({
      seed: this.seed,
      turn: this.turn,
      resources: this.resources,
      colonists: this.colonists,
      research_done: this.research_done,
      storage_capacity: this.storage_capacity,
      game_over: this.game_over,
      win: this.win,
      fired_events: this.fired_events,
      caravan_timer: this.caravan_timer,
      trade_prices: this.trade_prices,
      ashstorm_timer: this.ashstorm_timer,
      storm_damage_reduction: this.storm_damage_reduction,
      map: this.map,
    });
  }

  static deserialize(json) {
    try {
      const data = JSON.parse(json);
      const game = new Game(data.seed);
      game.turn = data.turn;
      game.resources = data.resources;
      game.colonists = data.colonists;
      game.research_done = data.research_done;
      game.storage_capacity = data.storage_capacity;
      game.game_over = data.game_over;
      game.win = data.win;
      game.fired_events = data.fired_events;
      game.caravan_timer = data.caravan_timer;
      game.trade_prices = data.trade_prices;
      game.ashstorm_timer = data.ashstorm_timer;
      game.storm_damage_reduction = data.storm_damage_reduction;
      game.map = data.map;
      game.rng = mulberry32(data.seed); // Restore PRNG state (note: this resets to start)
      return game;
    } catch (e) {
      throw new Error('Invalid save file');
    }
  }

  // ========== TESTS ==========
  runTests() {
    const tests = [
      { name: 'No negative resources', fn: () => Object.values(this.resources).every(v => v >= 0) },
      { name: 'Storage cap respected', fn: () => Object.values(this.resources).reduce((a, b) => a + b, 0) <= this.storage_capacity * 1.1 },
      { name: 'Colonist count >= 0', fn: () => this.colonists.length >= 0 },
      { name: 'Morale 0-100', fn: () => this.colonists.every(c => c.morale >= 0 && c.morale <= 100) },
      { name: 'Fatigue >= 0', fn: () => this.colonists.every(c => c.fatigue >= 0) },
      { name: 'Skills 1-5', fn: () => this.colonists.every(c => Object.values(c.skills).every(s => s >= 1 && s <= 5)) },
      { name: 'Research binary', fn: () => Object.values(this.research_done).every(v => v === true || v === false) },
      { name: 'Map size 8x8', fn: () => this.map.length === 8 && this.map.every(row => row.length === 8) },
      { name: 'All tiles have terrain', fn: () => this.map.every(row => row.every(tile => ['ash', 'rock', 'water', 'vent', 'ruins'].includes(tile.terrain))) },
      { name: 'Turn >= 0', fn: () => this.turn >= 0 },
      { name: 'Building health 0-1', fn: () => this.map.every(row => row.every(tile => tile.building_health === null || (tile.building_health >= 0 && tile.building_health <= 1))) },
      { name: 'Save/load round-trip', fn: () => {
        const s1 = this.serialize();
        const g2 = Game.deserialize(s1);
        return g2.serialize() === s1;
      }},
      { name: 'Event cooldowns respected', fn: () => {
        for (let [id, last_turn] of Object.entries(this.fired_events)) {
          const event = EVENTS.find(e => e.id === id);
          if (last_turn > 0) {
            if ((this.turn - last_turn) < event.cooldown && this.turn > last_turn) {
              return false;
            }
          }
        }
        return true;
      }},
      { name: 'Research prereqs enforced', fn: () => {
        for (let res of RESEARCH_TREE) {
          if (this.research_done[res.id]) {
            for (let prereq of res.prereqs) {
              if (!this.research_done[prereq]) return false;
            }
          }
        }
        return true;
      }},
      { name: 'Colonists have valid jobs', fn: () => this.colonists.every(c => JOBS.includes(c.job)) },
    ];

    let output = 'TESTS:\n';
    let pass = 0, fail = 0;
    for (let test of tests) {
      try {
        const result = test.fn();
        if (result) {
          output += `✓ ${test.name}\n`;
          pass++;
        } else {
          output += `✗ ${test.name}\n`;
          fail++;
        }
      } catch (e) {
        output += `✗ ${test.name} (${e.message})\n`;
        fail++;
      }
    }
    output += `\nPassed: ${pass}/${pass + fail}\n`;
    this.test_output = output;
    return pass;
  }

  // ========== BENCHMARK ==========
  async runBenchmark() {
    const start_state = this.serialize();
    const game = Game.deserialize(start_state);

    // Greedy policy: build quartersif pop<max, else build generators/condensers, else sell excess resources
    for (let i = 0; i < 200; i++) {
      if (game.game_over) break;

      // Simple greedy AI
      if (game.colonists.length < 12) {
        // Try to build Quarters
        for (let y = 0; y < 8; y++) {
          for (let x = 0; x < 8; x++) {
            if (game.canBuild('QUARTERS', x, y)) {
              game.buildBuilding('QUARTERS', x, y);
              break;
            }
          }
        }
      } else {
        // Build infrastructure
        if (game.resources.power < 30) {
          for (let y = 0; y < 8; y++) {
            for (let x = 0; x < 8; x++) {
              if (game.canBuild('GENERATOR', x, y)) {
                game.buildBuilding('GENERATOR', x, y);
                break;
              }
            }
          }
        }
      }

      // Do research if possible
      for (let res of RESEARCH_TREE) {
        if (game.canResearch(res.id)) {
          game.doResearch(res.id);
          break;
        }
      }

      game.endTurn();
    }

    const state_hash = game.turn.toString() + game.colonists.length.toString() + Math.round(game.resources.scrip);
    this.benchmark_output = `Benchmark: ${200} turns simulated\nFinal turn: ${game.turn}\nFinal pop: ${game.colonists.length}\nFinal scrip: ${game.resources.scrip}\nHash: ${state_hash}\n`;
  }
}

          <div class="stat-label">Water</div>

function renderContent() {
  switch (current_tab) {
    case 'map': return renderMapTab();
    case 'people': return renderPeopleTab();
    case 'research': return renderResearchTab();
    case 'events': return renderEventsTab();
    case 'trade': return renderTradeTab();
    case 'dev': return renderDevTab();
    default: return '';
  }
}

function renderMapTab() {

    <div>
      <div class="building-palette">
        ${Object.entries(BUILDINGS).map(([key, building]) => {
          const can_build = game.colonists.length > 0 && Object.entries(building.cost).every(([res, cost]) => game.resources[res] >= cost);
          return `
            <button class="building-btn ${selected_building === key ? 'selected' : ''} ${!can_build ? 'locked' : ''}"
              onclick="selectBuilding('${key}')"
              title="${building.description}">
              ${building.icon} ${building.name}
            </button>
          `;
        }).join('')}
      </div>
      <div class="map-grid" id="map-grid">

          <div class="tile ${tile.terrain} ${tile.building_health < 0.5 ? 'damaged' : ''}"

      </div>
    </div>
  `;
}

function renderResearchTab() {
  return `
    <div class="research-grid">
      ${RESEARCH_TREE.map(research => {
        const is_done = game.research_done[research.id];
        const prereqs_met = research.prereqs.every(p => game.research_done[p]);
        const can_afford = Object.entries(research.cost).every(([res, cost]) => game.resources[res] >= cost);
        const is_available = prereqs_met && !is_done;
        const is_locked = !is_available && !is_done;
        return `
          <div class="research-node ${is_done ? 'done' : is_available ? 'available' : 'locked'}"
            onclick="${is_available ? `doResearch('${research.id}')` : ''}"
            title="${research.description}">
            <div class="research-name">${research.name}</div>
            <div class="research-cost">
              ${is_done ? '✓ DONE' : Object.entries(research.cost).map(([res, cost]) => `${cost} ${res}`).join(', ')}
            </div>
            <div class="research-desc">${research.description}</div>
            ${research.prereqs.length > 0 ? `<div style="color:#888;font-size:8px;margin-top:4px;">Requires: ${research.prereqs.join(', ')}</div>` : ''}
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderEventsTab() {
  return `
    <div class="event-log">
      ${game.event_log.length === 0 ? '<span style="color:#666;">No events yet.</span>' : ''}
      ${game.event_log.slice(-50).map((entry, idx) => `
        <div class="log-entry">
          <div class="log-turn">Turn ${entry.turn}</div>
          <div class="log-text">${entry.text}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderTradeTab() {
  return `
    <div style="margin-bottom:12px;">
      <strong style="font-size:11px;">Caravan arrives in ${Math.max(0, game.caravan_timer)} turns</strong>
    </div>
    <div class="trade-panel">
      <div class="trade-section">
        <h3>BUY</h3>
        ${['food', 'water', 'metal', 'ore', 'power', 'parts'].map(res => `
          <div class="trade-item">
            <span class="trade-item-name">${res}</span>
            <span class="trade-item-price">${game.trade_prices[res].toFixed(2)} scrip</span>
            <button class="trade-btn" onclick="buyResource('${res}', 10)">Buy 10</button>
          </div>
        `).join('')}
      </div>
      <div class="trade-section">
        <h3>SELL</h3>
        ${['food', 'water', 'metal', 'ore', 'power', 'parts'].map(res => `
          <div class="trade-item">
            <span class="trade-item-name">${res}</span>
            <span class="trade-item-price">${game.trade_prices[res].toFixed(2)} scrip</span>
            <button class="trade-btn" onclick="sellResource('${res}', 10)">Sell 10</button>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderDevTab() {
  return `
    <div class="dev-panel">
      <button onclick="runTests()">Run Tests (${game.test_output ? 'done' : 'ready'})</button>
      <button onclick="runBenchmark()">Run Benchmark (${game.benchmark_output ? 'done' : 'ready'})</button>
      ${game.test_output ? `<div class="dev-output">${game.test_output}</div>` : ''}
      ${game.benchmark_output ? `<div class="dev-output">${game.benchmark_output}</div>` : ''}
    </div>
  `;
}

function renderGameOverModal() {
  const score = game.calculateScore();
  return `
    <div class="modal" style="display:none;">
      <div class="modal-content game-over">
        <h2>${game.win ? '🎉 OUTPOST STABLE' : '☠️ OUTPOST FAILED'}</h2>
        <div class="game-over-stats">
          <div class="game-over-stat">
            <span>Final Turn:</span>
            <span>${game.turn}</span>
          </div>
          <div class="game-over-stat">
            <span>Population:</span>
            <span>${game.colonists.length}</span>
          </div>
          <div class="game-over-stat">
            <span>Scrip:</span>
            <span>${game.resources.scrip.toFixed(0)}</span>
          </div>
          <div class="game-over-stat">
            <span>Research Completed:</span>
            <span>${Object.values(game.research_done).filter(v => v).length}/${RESEARCH_TREE.length}</span>
          </div>
        </div>
        <div class="final-score">SCORE: ${score}</div>
        <div style="font-size:10px;color:#888;text-align:left;">
          ${game.win ? 'The ashfall has stabilized, and your outpost has not only survived but thrived. You have secured humanity\'s future in this harsh new world.' : 'Without colonists, the outpost cannot continue. All is lost.'}
        </div>
        <div class="modal-buttons">
          <button onclick="location.reload()">Restart</button>
        </div>
      </div>
    </div>
  `;
}

function endTurn() {
  if (!game.game_over) {
    game.endTurn();
    render();
  }
}

function switchTab(tab) {
  current_tab = tab;
  render();
}

function selectBuilding(building_type) {
  selected_building = selected_building === building_type ? null : building_type;
  render();
}

function buildOnTile(x, y) {
  if (!selected_building) return;
  if (game.buildBuilding(selected_building, x, y)) {
    selected_building = null;
    render();
  }
}

function assignJob(colonist_idx, job) {
  if (colonist_idx < game.colonists.length) {
    game.colonists[colonist_idx].job = job;
    render();
  }
}

function doResearch(research_id) {
  game.doResearch(research_id);
  render();
}

function buyResource(res, amount) {
  game.buyResource(res, amount);
  render();
}

function sellResource(res, amount) {
  game.sellResource(res, amount);
  render();
}

function changeSeed() {
  const new_seed = parseInt(document.getElementById('seed-input').value) || 1337;
  game = new Game(new_seed);
  render();
}

function showSaveModal() {
  const save_data = game.serialize();
  const modal = `
    <div class="modal" style="display:flex;">
      <div class="modal-content">
        <h2>Save Game</h2>
        <p style="font-size:10px;color:#888;margin-bottom:8px;">Copy this text to save your progress:</p>
        <textarea id="save-text" readonly>${save_data}</textarea>
        <div class="modal-buttons">
          <button onclick="copySave()">Copy</button>
          <button onclick="closeSaveModal()">Close</button>
        </div>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', modal);
}

function showLoadModal() {
  const modal = `
    <div class="modal" style="display:flex;">
      <div class="modal-content">
        <h2>Load Game</h2>
        <p style="font-size:10px;color:#888;margin-bottom:8px;">Paste your save data here:</p>
        <textarea id="load-text" placeholder="Paste save data..."></textarea>
        <div class="modal-buttons">
          <button onclick="loadGame()">Load</button>
          <button onclick="closeLoadModal()">Cancel</button>
        </div>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', modal);
}

function copySave() {
  const text = document.getElementById('save-text');
  text.select();
  document.execCommand('copy');
  alert('Saved to clipboard!');
}

function closeSaveModal() {
  document.querySelector('.modal').remove();
}

function closeLoadModal() {
  document.querySelector('.modal').remove();
}

function loadGame() {
  try {
    const save_data = document.getElementById('load-text').value;
    game = Game.deserialize(save_data);
    closeLoadModal();
    render();
  } catch (e) {
    alert('Failed to load: ' + e.message);
  }
}

async function runTests() {
  game.runTests();
  render();
}

async function runBenchmark() {
  await game.runBenchmark();
  render();
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    endTurn();
  }
  if (e.key === '1') switchTab('map');
  if (e.key === '2') switchTab('people');
  if (e.key === '3') switchTab('research');
  if (e.key === '4') switchTab('events');
  if (e.key === '5') switchTab('trade');
  if (e.key === '6') switchTab('dev');
});

// Initial render
render();
</script>
</body>
</html>
