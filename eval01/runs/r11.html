<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASHFALL OUTPOST</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            line-height: 1.4;
            max-width: 1400px;
            margin: 0 auto;
        }
        .container { display: flex; flex-direction: column; height: 100vh; }
        .header {
            background: #2a2a2a;
            border-bottom: 2px solid #444;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .title { font-size: 24px; font-weight: bold; color: #ff8a00; }
        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 13px;
        }
        .stat-item { display: flex; gap: 6px; align-items: center; }
        .stat-label { color: #999; }
        .stat-value { font-weight: bold; color: #fff; }
        .tabs {
            display: flex;
            background: #252525;
            border-bottom: 1px solid #444;
            padding: 0;
            gap: 0;
        }
        .tab-button {
            flex: 1;
            padding: 12px 16px;
            background: transparent;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }
        .tab-button:hover { color: #e0e0e0; }
        .tab-button.active {
            color: #ff8a00;
            border-bottom-color: #ff8a00;
            background: #2a2a2a;
        }
        .content { flex: 1; overflow: auto; display: flex; flex-direction: column; }
        .tab-panel { display: none; flex: 1; overflow: auto; padding: 16px; }
        .tab-panel.active { display: flex; flex-direction: column; }
        .controls {
            background: #2a2a2a;
            padding: 12px 16px;
            border-top: 1px solid #444;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        button {
            padding: 8px 16px;
            background: #3a3a3a;
            color: #e0e0e0;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
        }
        button:hover { background: #4a4a4a; border-color: #666; }
        button:active { transform: scale(0.98); }
        button.primary {
            background: #ff8a00;
            color: #000;
            border-color: #ff8a00;
            font-weight: bold;
        }
        button.primary:hover { background: #ffaa00; }
        button.danger { background: #d32f2f; color: #fff; border-color: #d32f2f; }
        button.danger:hover { background: #f44336; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Map Tab */
        .map-container { display: grid; grid-template-columns: 1fr auto; gap: 16px; flex: 1; }
        .map-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 2px;
            background: #444;
            padding: 8px;
            border-radius: 4px;
            height: fit-content;
        }
        .tile {
            aspect-ratio: 1;
            background: #333;
            border: 1px solid #555;
            border-radius: 3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            position: relative;
            transition: all 0.1s;
            min-width: 40px;
        }
        .tile:hover { transform: scale(1.05); border-color: #777; }
        .tile.selected { border-color: #ff8a00; box-shadow: 0 0 8px #ff8a00; }
        .tile.damaged { filter: brightness(0.7); }
        .tile-tooltip {
            position: absolute;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a;
            border: 1px solid #666;
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .tile:hover .tile-tooltip { opacity: 1; }
        .map-sidebar {
            background: #2a2a2a;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #444;
            min-width: 200px;
            max-height: 500px;
            overflow-y: auto;
        }
        .sidebar-section {
            margin-bottom: 16px;
        }
        .sidebar-title {
            font-size: 12px;
            font-weight: bold;
            color: #ff8a00;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .building-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 12px;
        }
        .building-item {
            background: #333;
            padding: 8px;
            border-radius: 3px;
            border: 1px solid #444;
            cursor: pointer;
            transition: all 0.2s;
        }
        .building-item:hover { background: #3a3a3a; border-color: #555; }
        .building-item.selected { background: #ff8a00; color: #000; font-weight: bold; }
        .building-name { font-weight: bold; }
        .building-cost { font-size: 11px; color: #aaa; margin-top: 2px; }
        .building-item.selected .building-cost { color: #333; }

        /* People Tab */
        .people-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .colonist-card {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 12px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 12px;
            align-items: start;
        }
        .colonist-card > div { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
        .colonist-name { font-weight: bold; font-size: 13px; }
        .colonist-stat { display: flex; justify-content: space-between; }
        .colonist-stat-label { color: #999; }
        .colonist-stat-value { font-weight: bold; }
        .bar {
            background: #1a1a1a;
            height: 4px;
            border-radius: 2px;
            margin-top: 2px;
            overflow: hidden;
        }
        .bar-fill { height: 100%; background: #4caf50; }
        .bar-fill.warning { background: #ff9800; }
        .bar-fill.danger { background: #f44336; }

        /* Research Tab */
        .research-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }
        .research-node {
            background: #2a2a2a;
            border: 2px solid #444;
            border-radius: 4px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
        }
        .research-node.locked {
            opacity: 0.6;
            border-color: #666;
            cursor: not-allowed;
        }
        .research-node.available {
            border-color: #ff8a00;
            background: #333;
        }
        .research-node.done {
            border-color: #4caf50;
            background: #1a3a1a;
        }
        .research-node:hover:not(.locked) { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(255, 138, 0, 0.2); }
        .research-title { font-weight: bold; margin-bottom: 6px; }
        .research-cost { font-size: 11px; color: #aaa; margin-bottom: 4px; }
        .research-desc { font-size: 11px; color: #bbb; }

        /* Trade Tab */
        .trade-container { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .trade-panel {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 12px;
        }
        .trade-title { font-weight: bold; font-size: 13px; margin-bottom: 12px; }
        .trade-items { display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
        .trade-item {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 8px;
            align-items: center;
            background: #333;
            padding: 8px;
            border-radius: 3px;
        }
        .trade-item-name { font-weight: 500; }
        .trade-price { color: #ff8a00; font-weight: bold; }
        .trade-qty { color: #aaa; }

        /* Log Tab */
        .event-log { display: flex; flex-direction: column; gap: 8px; }
        .log-entry {
            background: #2a2a2a;
            border-left: 3px solid #444;
            padding: 8px 12px;
            border-radius: 2px;
            font-size: 12px;
        }
        .log-entry.event { border-left-color: #ff8a00; }
        .log-entry.warning { border-left-color: #ff9800; }
        .log-entry.success { border-left-color: #4caf50; }
        .log-entry.error { border-left-color: #f44336; }
        .log-turn { color: #999; font-weight: bold; }
        .log-text { color: #ccc; }

        /* Dev Panel */
        .dev-section { margin-top: 20px; border-top: 2px solid #444; padding-top: 16px; }
        .dev-title { font-weight: bold; color: #ff8a00; margin-bottom: 12px; }
        .test-results {
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 12px;
            margin-top: 12px;
            font-family: monospace;
            font-size: 11px;
            max-height: 300px;
            overflow-y: auto;
        }
        .test-pass { color: #4caf50; }
        .test-fail { color: #f44336; }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #2a2a2a;
            border: 2px solid #444;
            border-radius: 4px;
            padding: 20px;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
        .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 16px; }
        .modal-text { margin-bottom: 12px; font-size: 13px; line-height: 1.6; }
        .modal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .modal-buttons button { flex: 1; min-width: 100px; }

        .choice-item {
            background: #333;
            border: 1px solid #555;
            border-radius: 3px;
            padding: 8px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .choice-item:hover { background: #3a3a3a; border-color: #666; }
        .choice-title { font-weight: bold; margin-bottom: 4px; }
        .choice-effect { font-size: 11px; color: #aaa; }

        @media (max-width: 768px) {
            .map-container { grid-template-columns: 1fr; }
            .map-sidebar { min-width: 100%; }
            .colonist-card {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .trade-container { grid-template-columns: 1fr; }
        }
        @media (max-width: 480px) {
            .header { padding: 8px; gap: 8px; }
            .title { font-size: 18px; }
            .stats { font-size: 11px; }
            .tile { min-width: 30px; font-size: 16px; }
            .map-grid { gap: 1px; padding: 4px; }
        }
    </style>
</head>
<body>

<!-- ASSUMPTIONS:
    - Game runs for 60 turns. Win condition: turn >= 60, population >= 12, adequate storage.
    - Lose if population hits 0.
    - Seeded PRNG (mulberry32) is always used, never Math.random.
    - Default seed is 1337; player can edit.
    - Resources: food, water, metal, power, parts, scrip.
    - Buildings have production, terrain requirements, adjacency bonuses.
    - Colonists have 4 skills: farming, mining, crafting, research.
    - Ashstorms occur every 8-12 turns, scale in severity over time.
    - Events are weighted, recently-fired events cooldown.
    - Trade prices move with player stockpiles and global supply/demand.
    - Save/Load via textarea JSON with validation.
    - Dev panel includes tests (15+ assertions) and benchmark (200-turn headless run).
-->

<div class="container">
    <div class="header">
        <div class="title">ASHFALL OUTPOST</div>
        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Turn:</span>
                <span class="stat-value" id="turn-display">1</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Pop:</span>
                <span class="stat-value" id="pop-display">5</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Morale:</span>
                <span class="stat-value" id="morale-display">50%</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Food:</span>
                <span class="stat-value" id="food-display">100</span>
            </div>
            <div class="stat-item">

    </div>

        <div class="tab-panel active" id="tab-map">

                <div class="map-sidebar">
                    <div class="sidebar-section">

                    </div>
                    <div class="sidebar-section">

                    </div>
                </div>
            </div>
        </div>

        <div class="tab-panel" id="tab-people">
            <div class="people-list" id="people-list"></div>
        </div>

        <div class="tab-panel" id="tab-research">
            <div class="research-grid" id="research-grid"></div>
        </div>

        <div class="tab-panel" id="tab-trade">
            <div class="trade-container">
                <div class="trade-panel">
                    <div class="trade-title">Available at Caravan</div>
                    <div class="trade-items" id="trade-sell-list"></div>
                </div>
                <div class="trade-panel">
                    <div class="trade-title">Caravan Wants</div>

        <div class="tab-panel" id="tab-dev">
            <div style="font-size: 12px;">
                <div>
                    <strong>Seed:</strong>

                    <strong>Save/Load:</strong>
                </div>

                <div style="margin-top: 6px; display: flex; gap: 6px;">
                    <button onclick="game.saveToTextarea()">Copy Save</button>
                    <button onclick="game.loadFromTextarea()">Load Save</button>
                </div>

                    <button onclick="game.runTests()">Run Tests</button>

        <div class="modal-title" id="build-title"></div>
        <div class="modal-text" id="build-text"></div>
        <div class="modal-buttons">
            <button id="build-confirm" class="primary" onclick="game.confirmBuild()">Build</button>

<div class="modal" id="end-game-modal">
    <div class="modal-content">
        <div class="modal-title" id="end-game-title"></div>
        <div id="end-game-text"></div>
        <div class="modal-buttons">
            <button class="primary" onclick="location.reload()">Play Again</button>
        </div>
    </div>
</div>

<script>
// ============================================================================
// SEEDED PRNG (mulberry32)
// ============================================================================
function mulberry32(seed) {
    return function() {
        seed |= 0;
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

// ============================================================================
// GAME STATE & CORE LOOP
// ============================================================================
const game = {
    // Globals
    seed: 1337,
    rng: null,
    turn: 1,
    gameOver: false,
    winCondition: false,

    // Resources & population
    resources: { food: 100, water: 100, metal: 20, power: 50, parts: 10, scrip: 50 },
    resourceCaps: { food: 500, water: 500, metal: 200, power: 200, parts: 150, scrip: 500 },
    avgMorale: 50,

    // Map & buildings
    map: [],
    buildings: [],
    selectedTile: null,
    selectedBuilding: null,

    // Population
    colonists: [],
    nextColonistId: 100,

    // Research
    research: {},
    researchDone: new Set(),

    // Trade
    caravanPresent: false,
    caravanInventory: {},
    caravanPrices: {},
    globalDemand: {},

    // Events
    eventLog: [],
    eventCooldown: {},

    // Hazard
    lastStormTurn: -20,
    stormDamage: {},

    // --------
    // INIT
    // --------
    init() {
        this.rng = mulberry32(this.seed);
        this.initMap();
        this.initResearch();
        this.initPopulation();
        this.initTrade();
        this.logEvent('Game started');
        this.render();
    },

    // --------
    // MAP GENERATION
    // --------
    initMap() {
        const terrains = ['ash', 'ash', 'ash', 'rock', 'water', 'vent', 'ruins'];
        this.map = [];
        for (let y = 0; y < 8; y++) {
            for (let x = 0; x < 8; x++) {
                const idx = this.rng() < 0.15 ? terrains[6] // 15% ruins
                    : this.rng() < 0.1 ? terrains[5]          // 10% vent
                    : this.rng() < 0.2 ? terrains[4]          // 20% water
                    : this.rng() < 0.3 ? terrains[3]          // 30% rock
                    : terrains[0];                             // 25% ash
                this.map.push({
                    x, y, terrain: idx, building: null, health: 100, workers: 0
                });
            }
        }
    },

    getTile(x, y) {
        if (x < 0 || x >= 8 || y < 0 || y >= 8) return null;
        return this.map[y * 8 + x];
    },

    // --------
    // BUILDINGS
    // --------
    buildingTypes: {
        housing: {
            name: 'Housing', terrain: 'ash', cost: { scrip: 20, parts: 5 }, slots: 2,
            icon: '🏘', production: {}, adjacency: { ash: 0.1 }
        },
        greenhouse: {
            name: 'Greenhouse', terrain: 'ash', cost: { scrip: 30, parts: 10, water: 5 }, slots: 2,
            icon: '🌱', production: { food: 3 }, adjacency: { water: 0.3 }
        },
        well: {
            name: 'Well', terrain: 'water', cost: { scrip: 25, parts: 8 }, slots: 1,
            icon: '💧', production: { water: 4 }, adjacency: { water: 0.2 }
        },
        forge: {
            name: 'Forge', terrain: 'rock', cost: { scrip: 40, parts: 15, metal: 5 }, slots: 2,
            icon: '⚒', production: { metal: 2 }, adjacency: { vent: 0.4, rock: 0.1 }
        },
        vent_tap: {
            name: 'Vent Tap', terrain: 'vent', cost: { scrip: 50, parts: 20 }, slots: 1,
            icon: '⚡', production: { power: 5 }, adjacency: { vent: 0.5 }
        },
        lab: {
            name: 'Lab', terrain: 'ruins', cost: { scrip: 35, parts: 12, metal: 3 }, slots: 1,
            icon: '🔬', production: {}, adjacency: { ruins: 0.2 }
        },
        shelter: {
            name: 'Storm Shelter', terrain: 'rock', cost: { scrip: 45, parts: 18, metal: 2 }, slots: 0,
            icon: '🏚', production: {}, adjacency: { rock: 0.3 }
        },
        storage: {
            name: 'Storage', terrain: 'ash', cost: { scrip: 20, parts: 8 }, slots: 0,
            icon: '📦', production: {}, adjacency: { ash: 0.05 }
        },
        refinery: {
            name: 'Refinery', terrain: 'rock', cost: { scrip: 35, parts: 14, metal: 4, power: 10 }, slots: 1,
            icon: '⚙', production: { parts: 2 }, adjacency: { metal: 0, rock: 0.15 }
        }
    },

    canBuild(type, x, y) {
        if (!this.getTile(x, y)) return false;
        const tile = this.getTile(x, y);
        if (tile.building) return false;
        const btype = this.buildingTypes[type];
        if (tile.terrain !== btype.terrain) return false;
        const cost = btype.cost;
        for (const res in cost) {
            if ((this.resources[res] || 0) < cost[res]) return false;
        }
        return true;
    },

    build(type, x, y) {
        const btype = this.buildingTypes[type];
        const cost = btype.cost;
        for (const res in cost) this.resources[res] = (this.resources[res] || 0) - cost[res];

        const bonus = this.calcAdjacencyBonus(x, y, type);
        const id = this.buildings.length;
        this.buildings.push({
            id, x, y, type, name: btype.name, icon: btype.icon, health: 100,
            workers: [], productivity: 1.0 + bonus, bonusApplied: bonus
        });
        const tile = this.getTile(x, y);
        tile.building = id;
        this.logEvent(`Built ${btype.name} at (${x},${y}) with ${Math.round(bonus * 100)}% adjacency bonus`);
    },

    calcAdjacencyBonus(x, y, type) {
        const btype = this.buildingTypes[type];
        let bonus = 0;
        for (let dx = -1; dx <= 1; dx++) {
            for (let dy = -1; dy <= 1; dy++) {
                if (dx === 0 && dy === 0) continue;
                const neighbor = this.getTile(x + dx, y + dy);
                if (!neighbor) continue;
                const terrain = neighbor.terrain;
                if (terrain in btype.adjacency) bonus += btype.adjacency[terrain];
            }
        }
        return Math.min(bonus, 0.5);
    },

    // --------
    // RESEARCH
    // --------
    initResearch() {
        this.research = {
            farming_1: { name: 'Efficient Farming', prereq: null, cost: { scrip: 20, parts: 5 }, effect: 'food_prod +20%' },
            mining_1: { name: 'Ore Processing', prereq: null, cost: { scrip: 25, parts: 8 }, effect: 'metal_prod +15%' },
            power_1: { name: 'Power Grid', prereq: null, cost: { scrip: 30, parts: 10 }, effect: 'power_cap +100' },
            water_1: { name: 'Water Filtration', prereq: null, cost: { scrip: 20, parts: 5 }, effect: 'water_prod +25%' },
            storm_1: { name: 'Storm Prediction', prereq: null, cost: { scrip: 15, parts: 3 }, effect: 'storm_damage -30%' },
            labor_1: { name: 'Labor Efficiency', prereq: null, cost: { scrip: 20, parts: 5 }, effect: 'colonist_output +10%' },
            storage_1: { name: 'Advanced Storage', prereq: 'farming_1', cost: { scrip: 40, parts: 12 }, effect: 'storage_cap +150' },
            automation: { name: 'Automation', prereq: 'power_1', cost: { scrip: 50, parts: 20 }, effect: 'labor_free +1' }
        };
    },

    canResearch(key) {
        const node = this.research[key];
        if (!node || this.researchDone.has(key)) return false;
        if (node.prereq && !this.researchDone.has(node.prereq)) return false;
        const cost = node.cost;
        for (const res in cost) {
            if ((this.resources[res] || 0) < cost[res]) return false;
        }
        return true;
    },

    doResearch(key) {
        const node = this.research[key];
        const cost = node.cost;
        for (const res in cost) this.resources[res] = (this.resources[res] || 0) - cost[res];
        this.researchDone.add(key);
        this.logEvent(`Research complete: ${node.name}`);
    },

    // --------
    // POPULATION
    // --------
    initPopulation() {
        const names = ['Alex', 'Bailey', 'Casey', 'Dakota', 'Ellis'];
        const skills = ['farming', 'mining', 'crafting', 'research'];
        for (let i = 0; i < names.length; i++) {
            this.colonists.push({
                id: this.nextColonistId++, name: names[i],
                skill: skills[i % skills.length], skillLevel: 1, skillExp: 0,
                fatigue: 0, morale: 50, assigned: false, assignedBuilding: null
            });
        }
    },

    assignColonist(colonistId, buildingId) {
        const c = this.colonists.find(x => x.id === colonistId);
        if (!c) return;
        if (c.assigned && c.assignedBuilding !== null) {
            const oldBldg = this.buildings[c.assignedBuilding];
            if (oldBldg) oldBldg.workers = oldBldg.workers.filter(w => w !== colonistId);
        }
        c.assigned = buildingId !== null;
        c.assignedBuilding = buildingId;
        if (buildingId !== null) {
            const b = this.buildings[buildingId];
            if (b && !b.workers.includes(colonistId)) b.workers.push(colonistId);
        }
    },

    // --------
    // PRODUCTION & CONSUMPTION
    // --------
    updateProduction() {
        // Reset production
        const produced = {};
        for (const res in this.resources) produced[res] = 0;

        // Buildings produce
        for (const b of this.buildings) {
            const btype = this.buildingTypes[b.type];
            let productivity = 0.2; // base idle
            if (b.workers.length > 0) {
                const skillBonus = b.workers.reduce((sum, cid) => {
                    const c = this.colonists.find(x => x.id === cid);
                    return sum + (c ? c.skillLevel : 1);
                }, 0) / b.workers.length;
                productivity = skillBonus / 5; // 1-5 skill -> 0.2-1.0
            }
            productivity *= b.productivity;
            const moraleMult = Math.max(0.3, this.avgMorale / 100);
            productivity *= moraleMult;
            if (b.health < 100) productivity *= b.health / 100;

            for (const res in btype.production) {
                const amount = btype.production[res] * productivity;
                produced[res] = (produced[res] || 0) + amount;
            }

            // Farming chain: ash + water -> soil -> food
            if (b.type === 'greenhouse' && this.researchDone.has('farming_1')) {
                let bonus = btype.production.food * 0.2; // +20% from research
                produced.food = (produced.food || 0) + bonus;
            }

            // Metal refining
            if (b.type === 'forge' && b.health >= 50) {
                if (this.researchDone.has('mining_1')) {
                    produced.metal = (produced.metal || 0) + btype.production.metal * 0.15;
                }
            }

            // Consumption
            if (b.type === 'greenhouse') {
                const waterUsed = Math.max(0, 2 - (this.researchDone.has('water_1') ? 0.5 : 0));
                produced.water = (produced.water || 0) - waterUsed;
            }
        }

        // Consumption: colonists need food & water
        const popConsumption = this.colonists.length;
        produced.food = (produced.food || 0) - popConsumption;
        produced.water = (produced.water || 0) - popConsumption * 0.8;

        // Ashstorm increases water consumption
        if (this.turn - this.lastStormTurn < 3) {
            produced.water = (produced.water || 0) - this.colonists.length * 0.5;
        }

        // Apply production, handle shortages & overflow
        for (const res in produced) {
            const oldVal = this.resources[res] || 0;
            let newVal = oldVal + produced[res];

            // Handle shortage
            if (res === 'food' && newVal < 0) {
                this.handleShortage('food', Math.abs(newVal));
                newVal = 0;
            }
            if (res === 'water' && newVal < 0) {
                this.handleShortage('water', Math.abs(newVal));
                newVal = 0;
            }

            // Handle overflow
            const cap = this.resourceCaps[res] + (this.researchDone.has('storage_1') ? 150 : 0);
            if (newVal > cap) {
                this.logEvent(`${res} overflow: lost ${Math.round(newVal - cap)}`);
                newVal = cap;
            }

            this.resources[res] = newVal;
        }
    },

    handleShortage(resource, amount) {
        const severity = amount / this.colonists.length;
        if (severity > 2) {
            for (const c of this.colonists) {
                c.morale = Math.max(0, c.morale - severity * 3);
            }
            this.logEvent(`SEVERE ${resource} shortage!`, 'warning');
        } else {
            for (const c of this.colonists) {
                c.morale = Math.max(0, c.morale - severity * 1.5);
            }
        }
    },

    // --------
    // COLONIST UPDATES
    // --------
    updateColonists() {
        let totalMorale = 0;
        let survivors = 0;

        for (const c of this.colonists) {
            // Fatigue
            if (c.assigned) {
                c.fatigue = Math.min(100, c.fatigue + 15);
            } else {
                c.fatigue = Math.max(0, c.fatigue - 20);
            }

            // Morale decay
            if (c.morale > 0) {
                if (this.resources.food < this.colonists.length * 0.5) c.morale -= 3;
                if (this.resources.water < this.colonists.length * 0.4) c.morale -= 3;
                if (c.fatigue > 80) c.morale -= 2;
                c.morale = Math.max(0, c.morale);
            }

            // Morale recovery
            if (!c.assigned && c.morale < 100) {
                c.morale += 5;
            }

            // Skill growth
            if (c.assigned) {
                c.skillExp += 2;
                if (c.skillExp >= 30) {
                    c.skillLevel = Math.min(5, c.skillLevel + 1);
                    c.skillExp = 0;
                    this.logEvent(`${c.name} skill increased to ${c.skillLevel}`);
                }
            }

            // Departure on zero morale
            if (c.morale === 0) {
                this.logEvent(`${c.name} left the outpost`, 'error');
                continue;
            }

            totalMorale += c.morale;
            survivors++;
        }

        this.colonists = this.colonists.filter(c => c.morale > 0);
        this.avgMorale = survivors > 0 ? totalMorale / survivors : 0;

        if (this.colonists.length === 0) {
            this.endGame(false, 'Population reached zero');
        }
    },

    // --------
    // TRADE
    // --------
    initTrade() {
        this.globalDemand = { food: 1.0, water: 1.0, metal: 1.0, power: 1.0, parts: 1.0, scrip: 1.0 };
    },

    updateTrade() {
        if (this.turn % 6 !== 0) return;
        this.caravanPresent = true;

        // Drift global demand
        for (const res in this.globalDemand) {
            this.globalDemand[res] += (this.rng() - 0.5) * 0.3;
            this.globalDemand[res] = Math.max(0.5, Math.min(1.5, this.globalDemand[res]));
        }

        // Generate prices based on global demand and player stock
        this.caravanPrices = {};
        for (const res of ['food', 'water', 'metal', 'power', 'parts']) {
            const basePrices = { food: 2, water: 3, metal: 5, power: 4, parts: 8 };
            let price = basePrices[res] * this.globalDemand[res];
            const playerStock = this.resources[res] || 0;
            const stockFactor = Math.max(0.5, 2 - playerStock / 100);
            price *= stockFactor;
            this.caravanPrices[res] = Math.round(price);
        }

        // Inventory: random selection, limited qty
        this.caravanInventory = {};
        for (const res of ['food', 'water', 'metal', 'power', 'parts']) {
            if (this.rng() < 0.8) {
                this.caravanInventory[res] = Math.floor(20 + this.rng() * 40);
            }
        }

        this.logEvent('Caravan has arrived!');
    },

    tradeWithCaravan(resource, quantity, selling) {
        if (!this.caravanPresent) return;
        const price = this.caravanPrices[resource];
        const inv = this.caravanInventory[resource] || 0;

        if (selling) {
            const available = this.resources[resource] || 0;
            const amount = Math.min(quantity, available);
            this.resources[resource] = (this.resources[resource] || 0) - amount;
            this.resources.scrip = (this.resources.scrip || 0) + amount * price;
            this.caravanInventory[resource] = inv + amount;
        } else {
            const amount = Math.min(quantity, inv);
            this.resources.scrip = (this.resources.scrip || 0) - amount * price;
            this.resources[resource] = (this.resources[resource] || 0) + amount;
            this.caravanInventory[resource] = Math.max(0, inv - amount);
        }
    },

    fireEvent() {
        if (this.rng() > 0.35) return; // 35% chance each turn

        const availableEvents = this.eventDeck.filter(e => {
            const cooldownCounter = this.eventCooldown[e.id] || 0;
            return cooldownCounter === 0;
        });

        if (availableEvents.length === 0) return;

        // Weighted random
        let totalWeight = availableEvents.reduce((sum, e) => sum + e.weight, 0);
        let pick = this.rng() * totalWeight;
        let event = availableEvents[0];
        for (const e of availableEvents) {
            pick -= e.weight;
            if (pick <= 0) {
                event = e;
                break;
            }
        }

        // Apply cooldown
        this.eventCooldown[event.id] = event.cooldown;

        // Show event
        this.showEventModal(event);
    },

    showEventModal(event) {
        const modal = document.getElementById('event-modal');
        document.getElementById('event-title').textContent = event.title;
        document.getElementById('event-text').textContent = event.text || '';

        const choicesDiv = document.getElementById('event-choices');
        choicesDiv.innerHTML = '';

        if (event.choices) {
            for (const choice of event.choices) {
                const div = document.createElement('div');
                div.className = 'choice-item';
                div.innerHTML = `<div class="choice-title">${choice.title}</div>`;
                div.onclick = () => {
                    choice.effect();
                    modal.classList.remove('active');
                    this.render();
                };
                choicesDiv.appendChild(div);
            }
        } else {
            if (event.effect) {
                event.effect();
            }
        }

        modal.classList.add('active');
    },

    closeEventModal() {
        document.getElementById('event-modal').classList.remove('active');
    },

    // --------
    // ASHSTORM
    // --------
    checkAshstorm() {
        const stormChance = Math.max(0.05, Math.min(0.5, (this.turn - 10) / 100));
        if (this.rng() > stormChance) return;
        if (this.turn - this.lastStormTurn < 8) return;

        this.lastStormTurn = this.turn;
        const severity = Math.min(40, 20 + (this.turn - 10) * 0.5);
        let damage = severity;

        if (this.researchDone.has('storm_1')) damage *= 0.7;

        // Damage buildings
        for (const b of this.buildings) {
            if (b.type === 'shelter') {
                b.health = Math.max(0, b.health - damage * 0.3);
            } else {
                b.health = Math.max(0, b.health - damage * 0.8);
            }
        }

        this.logEvent(`ASHSTORM! Severity ${Math.round(severity)}. Buildings damaged.`, 'warning');
    },

    repairBuilding(buildingId) {
        const b = this.buildings[buildingId];
        if (!b || b.health >= 100) return;
        const partsCost = Math.round((100 - b.health) * 0.5);
        if (this.resources.parts < partsCost) return;

        this.resources.parts -= partsCost;
        b.health = 100;
        this.logEvent(`Repaired building at (${b.x},${b.y})`);
    },

    // --------
    // COOLDOWNS & BUFFS
    // --------
    updateCooldowns() {
        for (const key in this.eventCooldown) {
            this.eventCooldown[key] = Math.max(0, this.eventCooldown[key] - 1);
        }
    },

    // --------
    // END TURN
    // --------
    endTurn() {
        if (this.gameOver) return;

        this.updateProduction();
        this.updateColonists();
        this.updateCooldowns();
        this.checkAshstorm();
        this.updateTrade();
        this.fireEvent();

        this.turn++;
        this.logEvent(`--- Turn ${this.turn} ---`);

        // Win condition
        if (this.turn >= 60 && this.colonists.length >= 12 && this.resources.food >= 50 && this.resources.water >= 50) {
            this.endGame(true, `Victory! Outpost stabilized.\nFinal Population: ${this.colonists.length}\nResearch Complete: ${this.researchDone.size}`);
        }

        this.render();
    },

    endGame(won, reason) {
        this.gameOver = true;
        const score = (this.colonists.length * 100) + (this.researchDone.size * 50) + Math.round(
            (this.resources.food + this.resources.water + this.resources.metal) * 0.1
        ) + this.turn;

        const modal = document.getElementById('end-game-modal');
        document.getElementById('end-game-title').textContent = won ? 'VICTORY' : 'DEFEAT';
        document.getElementById('end-game-text').innerHTML = `
            <div class="modal-text">
                <strong>${reason}</strong>
                <p style="margin-top: 12px;">
                    Population: ${this.colonists.length}<br>
                    Research Complete: ${this.researchDone.size}<br>
                    Turns Survived: ${this.turn}<br>
                    Final Score: <strong>${score}</strong>
                </p>
            </div>
        `;
        modal.classList.add('active');
    },

    // --------
    // SAVE/LOAD
    // --------
    saveToTextarea() {
        const state = {
            turn: this.turn,
            seed: this.seed,
            resources: this.resources,
            colonists: this.colonists,
            buildings: this.buildings,
            map: this.map,
            researchDone: Array.from(this.researchDone),

            eventCooldown: this.eventCooldown,
            lastStormTurn: this.lastStormTurn,
            caravanPresent: this.caravanPresent,
            caravanPrices: this.caravanPrices,
            globalDemand: this.globalDemand
        };
        const json = JSON.stringify(state, null, 2);
        document.getElementById('save-data').value = json;
    },

    loadFromTextarea() {
        try {
            const json = document.getElementById('save-data').value;
            const state = JSON.parse(json);

            this.turn = state.turn;
            this.seed = state.seed;
            this.resources = state.resources;
            this.colonists = state.colonists;
            this.buildings = state.buildings;
            this.map = state.map;
            this.researchDone = new Set(state.researchDone);
            this.avgMorale = state.avgMorale;
            this.eventCooldown = state.eventCooldown;
            this.lastStormTurn = state.lastStormTurn;
            this.caravanPresent = state.caravanPresent;
            this.caravanPrices = state.caravanPrices;
            this.globalDemand = state.globalDemand;

            // Reinitialize RNG at same seed
            this.rng = mulberry32(this.seed);
            // Burn RNG calls to match original state (approximation)
            for (let i = 0; i < this.turn * 50; i++) this.rng();

            this.logEvent('Game loaded from save');
            this.render();
        } catch (e) {
            alert('Failed to load save: ' + e.message);
        }
    },

    resetWithSeed() {
        const seedStr = document.getElementById('seed-input').value;
        this.seed = parseInt(seedStr) || 1337;
        this.turn = 1;
        this.gameOver = false;
        this.winCondition = false;
        this.resources = { food: 100, water: 100, metal: 20, power: 50, parts: 10, scrip: 50 };
        this.colonists = [];
        this.buildings = [];
        this.map = [];
        this.researchDone = new Set();
        this.eventLog = [];
        this.eventCooldown = {};
        this.caravanPresent = false;
        this.lastStormTurn = -20;

        this.rng = mulberry32(this.seed);
        this.init();
    },

        this.renderHeader();
        this.renderMap();
        this.renderPeople();
        this.renderResearch();
        this.renderTrade();
        this.renderLog();
        this.renderBuildingList();

    renderHeader() {
        document.getElementById('turn-display').textContent = this.turn;
        document.getElementById('pop-display').textContent = this.colonists.length;
        document.getElementById('morale-display').textContent = Math.round(this.avgMorale) + '%';
        document.getElementById('food-display').textContent = Math.round(this.resources.food);
        document.getElementById('water-display').textContent = Math.round(this.resources.water);

    renderMap() {
        const grid = document.getElementById('map-grid');
        grid.innerHTML = '';
        for (let y = 0; y < 8; y++) {
            for (let x = 0; x < 8; x++) {
                const tile = this.getTile(x, y);
                const div = document.createElement('div');
                div.className = 'tile';
                if (this.selectedTile && this.selectedTile.x === x && this.selectedTile.y === y) {
                    div.classList.add('selected');
                }

                let icon = '⬜';
                if (tile.terrain === 'ash') icon = '🩶';
                else if (tile.terrain === 'rock') icon = '🪨';
                else if (tile.terrain === 'water') icon = '💧';
                else if (tile.terrain === 'vent') icon = '🔥';
                else if (tile.terrain === 'ruins') icon = '🏚';

                if (tile.building !== null) {
                    const b = this.buildings[tile.building];
                    icon = b.icon;
                    if (b.health < 100) div.classList.add('damaged');
                }

                div.textContent = icon;

                const tooltip = document.createElement('div');
                tooltip.className = 'tile-tooltip';
                if (tile.building === null) {
                    tooltip.textContent = `${tile.terrain} (${x},${y})`;
                } else {
                    const b = this.buildings[tile.building];
                    const btype = this.buildingTypes[b.type];
                    const adj = Math.round(b.bonusApplied * 100);
                    tooltip.textContent = `${b.name}\nHealth: ${Math.round(b.health)}%\nBonus: +${adj}%`;
                }
                div.appendChild(tooltip);

                div.onclick = () => this.selectTile(x, y);
                grid.appendChild(div);
            }
        }
    },

    selectTile(x, y) {

            div.innerHTML = `
                <div class="building-name">${btype.name} ${btype.icon}</div>
                <div class="building-cost">${costStr}</div>
                <div class="building-cost">Terrain: ${btype.terrain}</div>
            `;

            div.onclick = () => this.selectBuilding(typeKey);
            list.appendChild(div);
        }
    },

    selectBuilding(typeKey) {
        this.selectedBuilding = typeKey;
        if (this.selectedTile) {
            const tile = this.selectedTile;
            const canBuild = this.canBuild(typeKey, tile.x, tile.y);

            if (!canBuild) {
                alert('Cannot build here. Check terrain and resources.');
                return;
            }

            const btype = this.buildingTypes[typeKey];
            document.getElementById('build-title').textContent = `Build ${btype.name}?`;
            let costText = 'Cost: ';
            for (const res in btype.cost) {
                costText += `${res} ${btype.cost[res]} `;
            }
            document.getElementById('build-text').textContent = costText;
            document.getElementById('build-modal').classList.add('active');
            this.pendingBuild = { type: typeKey, x: tile.x, y: tile.y };
        }

        this.render();
    },

    confirmBuild() {
        if (this.pendingBuild) {
            this.build(this.pendingBuild.type, this.pendingBuild.x, this.pendingBuild.y);
            document.getElementById('build-modal').classList.remove('active');
            this.pendingBuild = null;
            this.selectedBuilding = null;
            this.render();
        }
    },

    cancelBuild() {
        document.getElementById('build-modal').classList.remove('active');
        this.pendingBuild = null;
    },

    renderPeople() {
        const list = document.getElementById('people-list');
        list.innerHTML = '';

        for (const c of this.colonists) {
            const div = document.createElement('div');
            div.className = 'colonist-card';

            const fatigueBar = c.fatigue > 80 ? 'danger' : c.fatigue > 50 ? 'warning' : '';
            const moraleBar = c.morale > 70 ? '' : c.morale > 40 ? 'warning' : 'danger';

            let assignmentInfo = 'Idle';
            if (c.assigned && c.assignedBuilding !== null) {
                const b = this.buildings[c.assignedBuilding];
                assignmentInfo = b ? b.name : 'Unknown';
            }

            div.innerHTML = `
                <div>
                    <div class="colonist-name">${c.name}</div>
                    <div class="colonist-stat">
                        <span class="colonist-stat-label">${c.skill}</span>
                        <span class="colonist-stat-value">Lv${c.skillLevel}</span>
                    </div>
                </div>
                <div>
                    <div style="font-weight: bold;">Status</div>
                    <div class="colonist-stat">
                        <span class="colonist-stat-label">Assigned:</span>
                        <span class="colonist-stat-value">${assignmentInfo}</span>
                    </div>
                    <div class="colonist-stat">
                        <span class="colonist-stat-label">Fatigue:</span>
                        <span class="colonist-stat-value">${Math.round(c.fatigue)}%</span>
                    </div>
                    <div class="bar">
                        <div class="bar-fill ${fatigueBar}" style="width: ${c.fatigue}%"></div>
                    </div>
                </div>
                <div>
                    <div style="font-weight: bold;">Morale</div>
                    <div class="colonist-stat">
                        <span class="colonist-stat-value">${Math.round(c.morale)}%</span>
                    </div>
                    <div class="bar">
                        <div class="bar-fill ${moraleBar}" style="width: ${c.morale}%"></div>
                    </div>
                </div>
                <div>
                    <button onclick="game.openAssignmentModal(${c.id})">Assign</button>
                    <button onclick="game.unassignColonist(${c.id})" ${!c.assigned ? 'disabled' : ''}>Unassign</button>
                </div>
            `;

            list.appendChild(div);
        }
    },

    openAssignmentModal(colonistId) {
        const c = this.colonists.find(x => x.id === colonistId);
        const choices = document.getElementById('event-choices');
        choices.innerHTML = '';

        choices.innerHTML += '<div class="choice-title">Assign to building:</div>';

        for (const b of this.buildings) {
            const div = document.createElement('div');
            div.className = 'choice-item';
            div.textContent = b.name;
            div.onclick = () => {
                this.assignColonist(colonistId, b.id);
                document.getElementById('event-modal').classList.remove('active');
                this.render();
            };
            choices.appendChild(div);
        }

        document.getElementById('event-modal').classList.add('active');
    },

    unassignColonist(colonistId) {
        this.assignColonist(colonistId, null);
        this.render();
    },

    renderResearch() {
        const grid = document.getElementById('research-grid');
        grid.innerHTML = '';

        for (const key in this.research) {
            const node = this.research[key];
            const div = document.createElement('div');
            div.className = 'research-node';

            if (this.researchDone.has(key)) {
                div.classList.add('done');
            } else if (this.canResearch(key)) {
                div.classList.add('available');
            } else {
                div.classList.add('locked');
            }

            let costStr = '';
            for (const res in node.cost) {
                costStr += `${res} ${node.cost[res]} `;
            }

            div.innerHTML = `
                <div class="research-title">${node.name}</div>
                <div class="research-cost">${costStr}</div>
                <div class="research-desc">${node.effect}</div>
            `;

            if (!this.researchDone.has(key)) {
                div.onclick = () => {
                    if (this.canResearch(key)) {
                        this.doResearch(key);
                        this.render();
                    }
                };
                div.style.cursor = this.canResearch(key) ? 'pointer' : 'not-allowed';
            }

            grid.appendChild(div);
        }
    },

    renderTrade() {
        if (!this.caravanPresent) {
            document.getElementById('trade-sell-list').innerHTML = '<div style="color: #999;">No caravan in town.</div>';
            document.getElementById('trade-buy-list').innerHTML = '<div style="color: #999;">No caravan in town.</div>';
            return;
        }

        const sellList = document.getElementById('trade-sell-list');
        const buyList = document.getElementById('trade-buy-list');
        sellList.innerHTML = '';
        buyList.innerHTML = '';

        for (const res of ['food', 'water', 'metal', 'power', 'parts']) {
            const price = this.caravanPrices[res];
            const ourQty = this.resources[res] || 0;

            const div1 = document.createElement('div');
            div1.className = 'trade-item';
            div1.innerHTML = `
                <span class="trade-item-name">Sell ${res}</span>
                <span class="trade-qty">We have: ${Math.round(ourQty)}</span>
                <span class="trade-price">${price} scrip</span>
            `;
            div1.onclick = () => this.tradeWithCaravan(res, 10, true);
            sellList.appendChild(div1);

            const carqty = this.caravanInventory[res] || 0;
            const div2 = document.createElement('div');
            div2.className = 'trade-item';
            div2.innerHTML = `
                <span class="trade-item-name">Buy ${res}</span>
                <span class="trade-qty">Available: ${Math.round(carqty)}</span>
                <span class="trade-price">${price} scrip</span>
            `;
            div2.onclick = () => this.tradeWithCaravan(res, 10, false);
            buyList.appendChild(div2);
        }
    },

    renderLog() {
        const log = document.getElementById('event-log');
        log.innerHTML = '';
        for (let i = Math.max(0, this.eventLog.length - 50); i < this.eventLog.length; i++) {
            const entry = this.eventLog[i];
            const div = document.createElement('div');
            div.className = `log-entry ${entry.type || ''}`;
            div.innerHTML = `<span class="log-turn">T${entry.turn}</span> <span class="log-text">${entry.text}</span>`;
            log.appendChild(div);
        }
        log.scrollTop = log.scrollHeight;
    },

    logEvent(text, type = 'event') {
        this.eventLog.push({ turn: this.turn, text, type });
    },

    // --------
    // TESTING & BENCHMARKING
    // --------
    runTests() {
        const results = [];
        let passed = 0, failed = 0;

        // Test 1: No negative resources
        let test = 'No negative resources';
        let pass = Object.values(this.resources).every(v => v >= 0);
        results.push(`[${pass ? '✓' : '✗'}] ${test}`);
        pass ? passed++ : failed++;

        // Test 2: Storage caps enforced
        test = 'Storage caps enforced';
        pass = true;
        for (const res in this.resources) {
            const cap = this.resourceCaps[res] + (this.researchDone.has('storage_1') ? 150 : 0);
            if (this.resources[res] > cap) pass = false;
        }
        results.push(`[${pass ? '✓' : '✗'}] ${test}`);
        pass ? passed++ : failed++;

        // Test 3: Colonist count matches roster
        test = 'Colonist count matches roster';
        pass = this.colonists.length >= 0;
        results.push(`[${pass ? '✓' : '✗'}] ${test}`);
        pass ? passed++ : failed++;

        // Test 4: All morale in range [0, 100]
        test = 'Morale in range [0,100]';
        pass = this.colonists.every(c => c.morale >= 0 && c.morale <= 100) && this.avgMorale >= 0 && this.avgMorale <= 100;
        results.push(`[${pass ? '✓' : '✗'}] ${test}`);
        pass ? passed++ : failed++;

        // Test 5: All fatigue in range [0, 100]
        test = 'Fatigue in range [0,100]';
        pass = this.colonists.every(c => c.fatigue >= 0 && c.fatigue <= 100);
        results.push(`[${pass ? '✓' : '✗'}] ${test}`);
        pass ? passed++ : failed++;

        // Test 6: Skill levels valid
        test = 'Skill levels 1-5';
        pass = this.colonists.every(c => c.skillLevel >= 1 && c.skillLevel <= 5);
        results.push(`[${pass ? '✓' : '✗'}] ${test}`);
        pass ? passed++ : failed++;

        // Test 7: Map has 64 tiles
        test = 'Map has 64 tiles';
        pass = this.map.length === 64;
        results.push(`[${pass ? '✓' : '✗'}] ${test}`);
        pass ? passed++ : failed++;

        // Test 8: No invalid terrain
        test = 'Terrain types valid';
        const validTerrains = ['ash', 'rock', 'water', 'vent', 'ruins'];
        pass = this.map.every(t => validTerrains.includes(t.terrain));
        results.push(`[${pass ? '✓' : '✗'}] ${test}`);
        pass ? passed++ : failed++;

        // Test 9: Research prereqs enforced
        test = 'Research prereqs enforced';
        pass = true;
        for (const key of this.researchDone) {
            const node = this.research[key];
            if (node.prereq && !this.researchDone.has(node.prereq)) pass = false;
        }
        results.push(`[${pass ? '✓' : '✗'}] ${test}`);
        pass ? passed++ : failed++;

        // Test 10: Building coordinates valid
        test = 'Building coords valid';
        pass = this.buildings.every(b => b.x >= 0 && b.x < 8 && b.y >= 0 && b.y < 8);
        results.push(`[${pass ? '✓' : '✗'}] ${test}`);
        pass ? passed++ : failed++;

        // Test 11: Building health in range
        test = 'Building health 0-100';
        pass = this.buildings.every(b => b.health >= 0 && b.health <= 100);
        results.push(`[${pass ? '✓' : '✗'}] ${test}`);
        pass ? passed++ : failed++;

        // Test 12: Assigned workers exist
        test = 'Building workers valid';
        pass = this.buildings.every(b => b.workers.every(wid => this.colonists.find(c => c.id === wid)));
        results.push(`[${pass ? '✓' : '✗'}] ${test}`);
        pass ? passed++ : failed++;

        // Test 13: Event cooldown non-negative
        test = 'Event cooldowns >= 0';
        pass = Object.values(this.eventCooldown).every(v => v >= 0);
        results.push(`[${pass ? '✓' : '✗'}] ${test}`);
        pass ? passed++ : failed++;

        // Test 14: Save/load round-trip
        test = 'Save/load preserves state';
        const oldSeed = this.seed;
        this.saveToTextarea();
        const oldTurn = this.turn;
        const oldPop = this.colonists.length;
        document.getElementById('seed-input').value = oldSeed;
        this.loadFromTextarea();
        pass = this.turn === oldTurn && this.colonists.length === oldPop;
        results.push(`[${pass ? '✓' : '✗'}] ${test}`);
        pass ? passed++ : failed++;

        // Test 15: No colonist works in 2 places
        test = 'Colonist exclusive assignment';
        const colonistBuildings = {};
        for (const b of this.buildings) {
            for (const cid of b.workers) {
                colonistBuildings[cid] = (colonistBuildings[cid] || 0) + 1;
            }
        }
        pass = Object.values(colonistBuildings).every(v => v <= 1);
        results.push(`[${pass ? '✓' : '✗'}] ${test}`);
        pass ? passed++ : failed++;

        const output = `Tests: ${passed} passed, ${failed} failed\n${results.join('\n')}`;
        document.getElementById('test-output').textContent = output;
    },

    runBenchmark() {
        const originalState = {
            turn: this.turn,
            seed: this.seed,
            resources: JSON.parse(JSON.stringify(this.resources)),
            colonists: JSON.parse(JSON.stringify(this.colonists)),
            buildings: JSON.parse(JSON.stringify(this.buildings)),
            map: JSON.parse(JSON.stringify(this.map)),
            researchDone: new Set(this.researchDone),
            avgMorale: this.avgMorale,
            eventCooldown: JSON.parse(JSON.stringify(this.eventCooldown)),
            lastStormTurn: this.lastStormTurn,
            caravanPresent: this.caravanPresent,
            caravanPrices: JSON.parse(JSON.stringify(this.caravanPrices)),
            globalDemand: JSON.parse(JSON.stringify(this.globalDemand))
        };

        const startTurn = this.turn;
        const startTime = Date.now();

        // Simulate 200 turns
        for (let i = 0; i < 200; i++) {
            this.updateProduction();
            this.updateColonists();
            this.updateCooldowns();
            this.checkAshstorm();
            this.updateTrade();
            this.fireEvent();
            this.turn++;

            if (this.colonists.length === 0) break;
        }

        const elapsed = Date.now() - startTime;
        const hash = this.computeStateHash();

        const output = `Benchmark: 200 turns in ${elapsed}ms\nFinal state hash: ${hash}\nFinal population: ${this.colonists.length}\nFinal turn: ${this.turn}`;
        document.getElementById('test-output').textContent = output;

        // Restore state
        this.turn = originalState.turn;
        this.resources = originalState.resources;
        this.colonists = originalState.colonists;
        this.buildings = originalState.buildings;
        this.map = originalState.map;
        this.researchDone = originalState.researchDone;
        this.avgMorale = originalState.avgMorale;
        this.eventCooldown = originalState.eventCooldown;
        this.lastStormTurn = originalState.lastStormTurn;
        this.caravanPresent = originalState.caravanPresent;
        this.caravanPrices = originalState.caravanPrices;
        this.globalDemand = originalState.globalDemand;

        this.render();
    },

    computeStateHash() {
        const state = {
            turn: this.turn,
            pop: this.colonists.length,
            food: Math.round(this.resources.food),
            water: Math.round(this.resources.water),
            metal: Math.round(this.resources.metal),
            researchCount: this.researchDone.size
        };
        const json = JSON.stringify(state);
        let hash = 0;
        for (let i = 0; i < json.length; i++) {
            const char = json.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash = hash & hash;
        }
        return Math.abs(hash).toString(16);
    }
};

// ============================================================================
// UI SETUP
// ============================================================================
document.addEventListener('DOMContentLoaded', () => {
    // Tab switching
    document.querySelectorAll('.tab-button').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const tabName = e.target.getAttribute('data-tab');
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            e.target.classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
        });
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            game.endTurn();
        }
        if (e.key === '1') document.querySelectorAll('.tab-button')[0].click();
        if (e.key === '2') document.querySelectorAll('.tab-button')[1].click();
        if (e.key === '3') document.querySelectorAll('.tab-button')[2].click();
        if (e.key === '4') document.querySelectorAll('.tab-button')[3].click();
        if (e.key === '5') document.querySelectorAll('.tab-button')[4].click();
    });

    game.init();
});
