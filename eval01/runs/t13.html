<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASHFALL OUTPOST</title>
<!--
================================================================================
ASHFALL OUTPOST - single-file turn-based survival management game
================================================================================

ASSUMPTIONS (made without asking, as instructed):

A1.  "Adjacency" means the 4 orthogonal neighbours of a tile (N/E/S/W). Diagonals
     do not count. Adjacency bonuses read the TERRAIN of the neighbour tile, not
     the building on it, so a bonus never changes after the map is generated.
A2.  Resources food/water/metal/power/parts are capped. SCRIP is deliberately
     uncapped: it is an abstract ledger credit, not a physical stockpile. The
     three intermediate goods required by the spec's production chains (ORE, ASH,
     SOIL) are also real, stored, capped resources.
A3.  "Power" is stored in a battery bank (capped) rather than being a per-turn
     flow. Generation happens before consumption inside the same turn.
A4.  Colonists have exactly one of 4 jobs. They may be assigned to any building;
     a job mismatch reduces their effective labour rather than forbidding it.
A5.  Each building has a fixed worker cap. Labour is a continuous quantity
     ("labour units"), derived from skill x morale x fatigue, not a headcount.
A6.  Repairs need parts AND labour: each repair action consumes one currently
     unassigned colonist for the turn (they gain fatigue). So you cannot repair
     more buildings per turn than you have idle people.
A7.  Research is bought instantly with scrip+parts (no per-turn research points).
     Prerequisites are hard-gated.
A8.  A caravan arrives on a schedule and stays 2 turns. Its inventory is finite
     and is consumed by your purchases. Prices = base x global drift index x your
     own scarcity factor, so hoarding a good tanks the price you can sell it at.
A9.  Storms hit on a fixed cadence. Severity grows with turn number. Damage is
     per-building on a 0-3 scale; 3 = fully disabled until repaired.
A10. End of game is evaluated at turn 60. Meeting the win bar wins; not meeting
     it ends the run as "SURVIVED" (still scored). Population 0 loses instantly.
A11. Save/load uses a textarea + copy/paste only. No browser storage of any kind
     is used anywhere in this file (no localStorage/sessionStorage/IDB/cookies).
A12. The benchmark runs with end conditions suppressed so it can always reach
     200 turns; everything else about the simulation is identical.
A13. Math.random() is never called. All randomness comes from a seeded mulberry32
     whose entire state is a single 32-bit integer held inside the game state, so
     saving and loading preserves the exact random stream.

TURN RESOLUTION ORDER (fixed, and also printed in the Log tab):
  1. Turn counter advances
  2. Storm phase        (schedule check, damage roll, water-demand spike)
  3. Labour phase       (per-building labour units computed from colonists)
  4. Production phase   4a power -> 4b extraction -> 4c refining -> 4d finishing
                        (each write is clamped to storage caps, overflow logged)
  5. Consumption phase  (food/water per colonist, building upkeep)
  6. Morale & fatigue phase
  7. Attrition & growth phase (departures, newcomers)
  8. Market phase       (price drift, caravan arrival/departure)
  9. Event phase        (weighted deck, cooldowns)
 10. End-condition check
================================================================================
-->
<style>
:root{
  --bg:#14100e; --bg2:#1d1815; --bg3:#262019; --line:#463a2e;
  --ink:#e8dfd2; --dim:#a8998a; --acc:#e0a54a; --acc2:#7fb0c9;
  --good:#8fbf6a; --bad:#d8705f; --warn:#ddb641;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;
  -webkit-text-size-adjust:100%;
}
#app{max-width:1180px;margin:0 auto;padding:8px;padding-bottom:76px}
h1{font-size:16px;letter-spacing:.22em;margin:0;color:var(--acc)}
h2{font-size:13px;letter-spacing:.14em;margin:0 0 6px;color:var(--acc);text-transform:uppercase}
h3{font-size:12px;margin:10px 0 4px;color:var(--acc2);letter-spacing:.08em}
p{margin:4px 0}
header{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;justify-content:space-between;
  border-bottom:1px solid var(--line);padding-bottom:6px}
.sub{color:var(--dim);font-size:11px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:5px;padding:8px;margin-bottom:8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;align-items:center}
.grow{flex:1 1 160px;min-width:0}
.mono{font-variant-numeric:tabular-nums}
button{
  font:inherit;background:var(--bg3);color:var(--ink);border:1px solid var(--line);
  border-radius:4px;padding:6px 9px;cursor:pointer;min-height:34px;
}
button:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
button:focus-visible{outline:2px solid var(--acc2);outline-offset:1px}
button:disabled{opacity:.42;cursor:not-allowed}
button.pri{background:var(--acc);color:#20180c;border-color:var(--acc);font-weight:700}
button.pri:hover:not(:disabled){background:#f0b55c;color:#20180c}
button.sm{padding:3px 7px;min-height:26px;font-size:12px}
select,input,textarea{
  font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);
  border-radius:4px;padding:5px;min-height:32px;max-width:100%
}
textarea{width:100%;min-height:120px;font-size:11px;line-height:1.35;resize:vertical}
input[type=number]{width:88px}

/* resource bar */
#resbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:4px;margin:6px 0}
.res{background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:4px 5px;cursor:help}
.res .k{font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;display:block}
.res .v{font-size:14px;font-variant-numeric:tabular-nums}
.res .d{font-size:10px;color:var(--dim)}
.res.full{border-color:var(--warn)}
.res.empty{border-color:var(--bad)}
.delta.up{color:var(--good)} .delta.dn{color:var(--bad)}

/* tabs */
#tabs{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
#tabs button{flex:1 1 auto;letter-spacing:.06em}
#tabs button[aria-selected=true]{background:var(--acc);color:#20180c;border-color:var(--acc);font-weight:700}
section.tab{display:none}
section.tab.on{display:block}

/* map */
#mapwrap{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
#grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;flex:1 1 320px;min-width:280px;max-width:520px}
.tile{
  position:relative;aspect-ratio:1/1;border:1px solid var(--line);border-radius:3px;
  background:var(--bg3);padding:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;min-height:0;line-height:1.05;cursor:pointer;
}
.tile .t{font-size:9px;color:var(--dim);letter-spacing:.02em}
.tile .b{font-size:15px;font-weight:700}
.tile .w{font-size:9px;color:var(--acc2)}
.tile.sel{outline:2px solid var(--acc);outline-offset:1px}
.tile.dmg1{border-style:dashed;border-color:var(--warn)}
.tile.dmg2{border-style:dashed;border-color:var(--bad)}
.tile.dmg3{border-style:dotted;border-color:var(--bad);opacity:.72}
.tile .flag{position:absolute;top:1px;right:2px;font-size:9px;color:var(--bad)}
.tile .idle{position:absolute;top:1px;left:2px;font-size:9px;color:var(--warn)}
.t-ash{background:#2b241d} .t-rock{background:#3a3630} .t-water{background:#1d3542}
.t-vent{background:#42251f} .t-ruins{background:#332b36}
#tilepanel{flex:1 1 300px;min-width:260px}

/* lists */
.list{display:flex;flex-direction:column;gap:5px}
.item{background:var(--bg3);border:1px solid var(--line);border-radius:4px;padding:6px}
.item.dim{opacity:.55}
.bar{height:6px;background:#000;border:1px solid var(--line);border-radius:3px;overflow:hidden;min-width:56px;flex:1 1 56px}
.bar i{display:block;height:100%;background:var(--acc2)}
.bar.f i{background:var(--warn)} .bar.m i{background:var(--good)} .bar.m.low i{background:var(--bad)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:10px;color:var(--dim);letter-spacing:.06em}
.tag.ok{color:var(--good);border-color:var(--good)}
.tag.no{color:var(--bad);border-color:var(--bad)}
.tag.mid{color:var(--warn);border-color:var(--warn)}
.tag.on{color:var(--acc2);border-color:var(--acc2)}

/* log */
#logbox{max-height:56vh;overflow-y:auto;border:1px solid var(--line);border-radius:4px;background:var(--bg2);padding:6px}
.le{border-bottom:1px dotted #33291f;padding:3px 0;display:flex;gap:6px}
.le:last-child{border-bottom:0}
.le .tn{color:var(--dim);flex:0 0 46px;font-variant-numeric:tabular-nums}
.le.k-bad .tx{color:var(--bad)} .le.k-good .tx{color:var(--good)}
.le.k-warn .tx{color:var(--warn)} .le.k-big .tx{color:var(--acc);font-weight:700}
.le .tx{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}

/* footer / modal / tooltip */
#foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);
  padding:6px 8px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;z-index:40}
#foot .st{font-size:11px;color:var(--dim);flex:1 1 140px;min-width:0}
#modal{position:fixed;inset:0;background:rgba(8,6,4,.86);display:none;align-items:center;
  justify-content:center;padding:10px;z-index:60;overflow-y:auto}
#modal.on{display:flex}
#modalbox{background:var(--bg2);border:1px solid var(--acc);border-radius:6px;max-width:560px;width:100%;padding:12px;margin:auto}
#tip{position:fixed;z-index:80;max-width:290px;background:#0c0a08;border:1px solid var(--acc);
  border-radius:4px;padding:6px 8px;font-size:11px;line-height:1.4;display:none;pointer-events:none;color:var(--ink)}
#tip.on{display:block}
[data-tip]{cursor:help}
.hint{color:var(--dim);font-size:11px}
.ok{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .acc{color:var(--acc)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:4px 3px;text-align:left}
th{color:var(--dim);font-weight:400;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
pre{background:#0c0a08;border:1px solid var(--line);border-radius:4px;padding:6px;
  overflow-x:auto;font-size:11px;line-height:1.4;margin:4px 0;white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:560px){
  #app{padding:6px;padding-bottom:84px}
  h1{font-size:13px;letter-spacing:.14em}
  #grid{max-width:100%;gap:2px}
  .tile .t{font-size:8px} .tile .b{font-size:13px}
  #tabs button{flex:1 1 30%;padding:6px 4px;font-size:12px}
  #resbar{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>ASHFALL OUTPOST</h1>
      <div class="sub" id="hdrsub">Turn 1 / 60</div>
    </div>

<script>
"use strict";
/* ============================================================================
   0. UTILITIES + SEEDED PRNG
   ==========================================================================*/
const MAPW = 8, MAPH = 8, NTILES = MAPW * MAPH;
const WIN_TURN = 60, WIN_POP = 12;

const clamp = (v, lo, hi) => v < lo ? lo : (v > hi ? hi : v);
const r1 = v => Math.round(v * 10) / 10;
const r2 = v => Math.round(v * 100) / 100;

/* mulberry32. The whole generator state is one int32 held in S.rng, so a saved
   game resumes the exact same random stream. Math.random is never used. */
function rnd(S) {
  S.rng = (S.rng + 0x6D2B79F5) | 0;
  let t = S.rng;
  t = Math.imul(t ^ (t >>> 15), 1 | t);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rint = (S, n) => Math.floor(rnd(S) * n);
const rrange = (S, a, b) => a + Math.floor(rnd(S) * (b - a + 1));
const rpick = (S, arr) => arr[rint(S, arr.length)];

/* Standalone generator used only for map creation, so terrain depends on the
   seed alone and never on how much randomness gameplay has consumed. */
function makeGen(seed) {
  let s = seed | 0;
  return function () {
    s = (s + 0x6D2B79F5) | 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), 1 | t);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* Deterministic, key-sorted JSON, used for the state hash so that key insertion
   order can never change a hash. */
function stableStr(v) {
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(stableStr).join(',') + ']';
  return '{' + Object.keys(v).sort().map(function (k) {
    return JSON.stringify(k) + ':' + stableStr(v[k]);
  }).join(',') + '}';
}
function fnv1a(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return (h >>> 0).toString(16).padStart(8, '0');
}
/* Hash of everything mechanically meaningful. Numbers round to 3dp so float
   noise below gameplay resolution cannot flip a hash. `lastTurn` is excluded:
   it is a derived report for the UI and is not carried by a save file. */
function stateHash(S) {
  function norm(x) {
    if (typeof x === 'number') return Math.round(x * 1000) / 1000;
    if (Array.isArray(x)) return x.map(norm);
    if (x && typeof x === 'object') {
      const o = {};
      const ks = Object.keys(x);
      for (let i = 0; i < ks.length; i++) o[ks[i]] = norm(x[ks[i]]);
      return o;
    }
    return x;
  }
  const shallow = {};
  const ks = Object.keys(S);
  for (let i = 0; i < ks.length; i++) if (ks[i] !== 'lastTurn') shallow[ks[i]] = S[ks[i]];
  return fnv1a(stableStr(norm(shallow)));
}

/* ============================================================================
   1. STATIC DATA
   ==========================================================================*/

  power: { name:'Power', desc:'Battery bank. Made by Geothermal Taps, drawn by Forge, Workshop and Condensers.' },
  parts: { name:'Parts', desc:'Made at the Workshop from metal + power. Pays for advanced builds, repairs and research.' },
  scrip: { name:'Scrip', desc:'Trade credit. Uncapped. Spent on research and caravan purchases.' },

const BASE_CAP = { food:120, water:120, metal:120, power:40, parts:80, scrip:Infinity, ore:90, ash:90, soil:70 };

const TERR = {
  ash:   { name:'Ash Flats', glyph:'~', desc:'Deep drifts of volcanic fall. Buildable; good for sifting and growing.' },
  rock:  { name:'Rock',      glyph:'^', desc:'Exposed bedrock. Required by Mines, favoured by Forges.' },
  water: { name:'Melt Pool', glyph:'=', desc:'Standing meltwater. Cannot be built on, but boosts adjacent Condensers and Greenhouses.' },
  vent:  { name:'Vent',      glyph:'*', desc:'Fumarole. The only terrain a Geothermal Tap can sit on; boosts adjacent Forges.' },

  GROW: { name:'Grower',    desc:'Life support: the Greenhouse.' },
  SCAV: { name:'Scavenger', desc:'Ash Sifter, Salvage Yard and Trade Post.' }

const JOB_IDS = ['ENG','MINE','GROW','SCAV'];

/* Buildings. Yields are stated PER LABOUR UNIT (see labourOf()).
   adj: { t:<terrain>, per:<amount>, res:<resource> } over orthogonal neighbours. */

  },

  },

  },

    detail:'Passive: needs no workers.'
  },
  baffle: {
    name:'Ash Baffle', glyph:'B', job:null, slots:0, stage:null,

  ' 1. Turn counter advances\n' +

/* ============================================================================
   2. STATE CONSTRUCTION + MAP GENERATION
   ==========================================================================*/
function genMap(seed) {
  const g = makeGen((seed ^ 0x9E3779B9) | 0);
  const t = new Array(NTILES).fill('ash');
  const idx = (x, y) => y * MAPW + x;

  // Melt pools: 2-4 blobs that grow from a source cell.
  const pools = 2 + Math.floor(g() * 3);
  for (let p = 0; p < pools; p++) {
    let x = Math.floor(g() * MAPW), y = Math.floor(g() * MAPH);
    const size = 2 + Math.floor(g() * 3);
    for (let s = 0; s < size; s++) {
      t[idx(x, y)] = 'water';
      const d = Math.floor(g() * 4);
      x = clamp(x + (d === 0 ? 1 : d === 1 ? -1 : 0), 0, MAPW - 1);
      y = clamp(y + (d === 2 ? 1 : d === 3 ? -1 : 0), 0, MAPH - 1);
    }
  }
  // Rock ridges: 3-5 short runs.
  const ridges = 3 + Math.floor(g() * 3);
  for (let p = 0; p < ridges; p++) {
    let x = Math.floor(g() * MAPW), y = Math.floor(g() * MAPH);
    const len = 3 + Math.floor(g() * 4);
    const horiz = g() < 0.5;
    for (let s = 0; s < len; s++) {
      if (t[idx(x, y)] === 'ash') t[idx(x, y)] = 'rock';
      if (horiz) x = clamp(x + (g() < 0.75 ? 1 : 0), 0, MAPW - 1);
      else y = clamp(y + (g() < 0.75 ? 1 : 0), 0, MAPH - 1);
    }
  }
  // Vents: 2-3, always placed (overwrite whatever is there) so a Tap is possible.
  const vents = 2 + Math.floor(g() * 2);
  for (let p = 0; p < vents; p++) {
    t[Math.floor(g() * NTILES)] = 'vent';
  }
  // Ruins: 4-7 scattered, never on top of a vent.
  const ruins = 4 + Math.floor(g() * 4);
  for (let p = 0; p < ruins; p++) {
    const i = Math.floor(g() * NTILES);
    if (t[i] !== 'vent') t[i] = 'ruins';
  }
  // Guarantees so no seed is unplayable.
  if (t.indexOf('vent') < 0) t[27] = 'vent';
  if (t.indexOf('rock') < 0) t[18] = 'rock';
  if (t.indexOf('ruins') < 0) t[45] = 'ruins';
  if (t.indexOf('water') < 0) t[36] = 'water';
  let ashCount = 0;
  for (let i = 0; i < NTILES; i++) if (t[i] === 'ash') ashCount++;
  if (ashCount < 12) { for (let i = 0; i < 12 - ashCount; i++) t[(i * 5 + 3) % NTILES] = 'ash'; }

  return t.map(function (terr, i) {
    return { i: i, terr: terr, b: null, dmg: 0 };
  });
}

function makeColonist(S, forceJob) {
  const nm = rpick(S, FIRST_NAMES) + ' ' + rpick(S, LAST_NAMES);
  return {
    id: S.nextId++,
    name: nm,
    job: forceJob || rpick(S, JOB_IDS),
    skill: rrange(S, 1, 3),
    xp: 0,
    fatigue: rrange(S, 0, 15),
    morale: rrange(S, 58, 72),
    zeroTurns: 0,
    at: null           // tile index of assignment, or null = resting
  };
}

function newGame(seed) {
  const S = {
    version: 3,
    seed: seed | 0,
    rng: seed | 0,
    turn: 1,
    nextId: 1,
    over: null,                      // null | {win:bool, reason, score, breakdown}
    noEnd: false,                    // true only for the headless benchmark
    res: { food:48, water:48, metal:40, power:10, parts:14, scrip:40, ore:0, ash:6, soil:0 },
    map: genMap(seed),
    pop: [],
    tech: {},                        // techId -> true
    log: [],
    // storm
    storm: { last: 0, next: 6, severity: 0, activeWater: 1 },
    // market: per-good global index that drifts over time
    market: { idx: {}, caravan: null, nextArrive: 5 },
    events: { cd: {}, lastFired: 0 },
    pending: null,                   // unresolved choice event
    stats: { produced: {}, shortFood: 0, shortWater: 0, died: 0, left: 0, joined: 0, storms: 0, overflow: 0 },
    lastTurn: null                   // per-turn report used by the UI
  };
  for (let i = 0; i < RES.length; i++) { S.market.idx[RES[i]] = 1; S.stats.produced[RES[i]] = 0; }
  // Six founders, one guaranteed of each job so no start is soft-locked.
  for (let j = 0; j < JOB_IDS.length; j++) S.pop.push(makeColonist(S, JOB_IDS[j]));
  S.pop.push(makeColonist(S));
  S.pop.push(makeColonist(S));
  logAdd(S, 'The ash stopped falling long enough to unload the trucks. ' + S.pop.length +
    ' survivors, one valley, sixty turns to make it stick.', 'big');
  logAdd(S, 'Seed ' + S.seed + '. Click a tile on the Map tab to build.', 'plain');
  return S;
}

/* --- logging ------------------------------------------------------------- */
function logAdd(S, text, kind) {
  S.log.push({ t: S.turn, x: text, k: kind || 'plain' });
  if (S.log.length > 400) S.log.splice(0, S.log.length - 400);
}

/* --- storage caps -------------------------------------------------------- */
function caps(S) {
  const c = {};
  for (let i = 0; i < RES.length; i++) c[RES[i]] = BASE_CAP[RES[i]];
  const n = countBld(S);
  c.water += 70 * n.cistern;
  c.food  += 25 * n.cistern;
  const d = 50 * n.depot;
  c.metal += d; c.parts += d; c.ore += d; c.ash += d; c.soil += d;
  return c;
}
function countBld(S) {
  const n = {};
  for (let i = 0; i < BLD_IDS.length; i++) n[BLD_IDS[i]] = 0;
  for (let i = 0; i < S.map.length; i++) if (S.map[i].b) n[S.map[i].b]++;
  return n;
}
/* Single funnel for every resource write, so caps and overflow logging can
   never be bypassed. Returns the amount actually stored. */
function addRes(S, key, amt, C, label) {
  if (amt === 0) return 0;
  const cp = (C || caps(S))[key];
  const before = S.res[key];
  let after = before + amt;
  let over = 0;
  if (after > cp) { over = after - cp; after = cp; }
  if (after < 0) after = 0;           // never negative; callers pre-check inputs
  S.res[key] = after;
  if (over > 0.01) {
    S.stats.overflow += over;
    logAdd(S, 'Storage full: ' + r1(over) + ' ' + RES_INFO[key].name.toLowerCase() +
      ' lost' + (label ? ' from ' + label : '') + ' (cap ' + cp + ').', 'warn');
  }
  return after - before;
}
function spend(S, costObj) {
  const ks = Object.keys(costObj);
  for (let i = 0; i < ks.length; i++) if (S.res[ks[i]] < costObj[ks[i]]) return false;
  for (let i = 0; i < ks.length; i++) S.res[ks[i]] -= costObj[ks[i]];
  return true;
}
function canAfford(S, costObj) {
  const ks = Object.keys(costObj);
  for (let i = 0; i < ks.length; i++) if (S.res[ks[i]] < costObj[ks[i]]) return false;
  return true;
}
function costStr(c) {
  return Object.keys(c).map(function (k) { return c[k] + ' ' + RES_INFO[k].name.toLowerCase(); }).join(', ');
}

/* --- map helpers --------------------------------------------------------- */
function neighbours(i) {
  const x = i % MAPW, y = Math.floor(i / MAPW), out = [];
  if (x > 0) out.push(i - 1);
  if (x < MAPW - 1) out.push(i + 1);
  if (y > 0) out.push(i - MAPW);
  if (y < MAPH - 1) out.push(i + MAPW);
  return out;
}
/* How many orthogonal neighbours have the terrain this building cares about. */
function adjCount(S, i, bid) {
  const spec = BLD[bid].adj;
  if (!spec) return 0;
  const nb = neighbours(i);
  let n = 0;
  for (let k = 0; k < nb.length; k++) if (S.map[nb[k]].terr === spec.t) n++;
  return n;
}
function adjBonus(S, i, bid) {
  const spec = BLD[bid].adj;
  if (!spec) return 0;
  return adjCount(S, i, bid) * spec.per;
}
function adjText(S, i, bid) {
  const spec = BLD[bid].adj;
  if (!spec) return 'No adjacency bonus.';
  const n = adjCount(S, i, bid);
  return n + ' adjacent ' + TERR[spec.t].name + (n === 1 ? '' : 's') + ' x ' + spec.per +
    ' = +' + r1(n * spec.per) + ' ' + RES_INFO[spec.res].name.toLowerCase() + ' per labour unit';
}
function techOK(S, bid) {
  const req = BLD[bid].tech;
  return !req || !!S.tech[req];
}
/* Why this building may or may not go on this tile. */
function buildCheck(S, i, bid) {
  const tile = S.map[i], d = BLD[bid];
  if (tile.b) return { ok:false, why:'Tile already holds a ' + BLD[tile.b].name + '.' };
  if (d.terr.indexOf(tile.terr) < 0) {
    return { ok:false, why:'Needs ' + d.terr.map(function (t) { return TERR[t].name; }).join(' / ') +
      '; this is ' + TERR[tile.terr].name + '.' };
  }
  if (!techOK(S, bid)) return { ok:false, why:'Locked. Research ' + TECH[d.tech].name + ' first.' };
  if (!canAfford(S, d.cost)) return { ok:false, why:'Cannot afford ' + costStr(d.cost) + '.' };
  return { ok:true, why:'' };
}

/* --- colonists ----------------------------------------------------------- */
const XP_STEPS = [0, 10, 26, 50, 84];   // xp needed for level 2,3,4,5 at index-1
function moraleMult(c) {
  if (c.morale <= 0) return 0;                       // refuses to work
  return Math.min(1.1, 0.55 + 0.0055 * c.morale);    // 0 -> .55, 60 -> .88, 100 -> 1.1
}
function fatigueMult(c) { return 1 - 0.0045 * c.fatigue; }   // 100 fatigue -> 0.55
function skillMult(c, bld) {
  const matched = bld.job && c.job === bld.job;
  return matched ? (0.55 + 0.15 * c.skill) : (0.35 + 0.09 * c.skill);
}
/* Labour units one colonist contributes to the building they sit in. */
function labourOf(S, c) {
  if (c.at === null) return 0;
  const tile = S.map[c.at];
  if (!tile || !tile.b) return 0;
  const bld = BLD[tile.b];
  if (!bld.slots) return 0;
  return skillMult(c, bld) * moraleMult(c) * fatigueMult(c);
}
function workersAt(S, i) {
  return S.pop.filter(function (c) { return c.at === i; });
}
function labourAt(S, i) {
  const ws = workersAt(S, i);
  let sum = 0;
  for (let k = 0; k < ws.length; k++) sum += labourOf(S, ws[k]);
  return sum;
}
function housing(S) {
  const n = countBld(S);
  return 4 + n.hab * (S.tech.commons ? 4 : 3);
}
function avgMorale(S) {
  if (!S.pop.length) return 0;
  let m = 0;
  for (let i = 0; i < S.pop.length; i++) m += S.pop[i].morale;
  return m / S.pop.length;
}
/* Damage multiplier: 0 healthy, 3 disabled. */
const DMG_MULT = [1, 0.65, 0.3, 0];
function dmgMult(tile) { return DMG_MULT[clamp(tile.dmg, 0, 3)]; }
function repairCost(S, tile) {
  const base = 3 * tile.dmg;
  return Math.max(1, Math.round(S.tech.repairs ? base / 2 : base));
}
/* ============================================================================
   3. PRODUCTION MODEL
   ----------------------------------------------------------------------------
   runBld() is the single source of truth for what a building does. Called with
   apply=true during the turn (it consumes inputs and banks outputs through
   addRes, respecting caps) and with apply=false by the UI to preview a rate.
   With apply=false, inputs are assumed fully available, which the tooltip says.
   ==========================================================================*/
function runBld(S, i, apply, C) {
  const tile = S.map[i], bid = tile.b;
  const rec = { id: bid, inp: {}, out: {}, eff: 0, ratio: 1, starved: null };
  if (!bid) return rec;
  const d = BLD[bid];
  if (!d.slots) return rec;

  const lab = labourAt(S, i);
  const auto = S.tech.automate ? 1.12 : 1;
  const eff = lab * dmgMult(tile) * auto;
  rec.eff = eff;
  rec.adj = adjBonus(S, i, bid);
  if (eff <= 0) return rec;

  const A = rec.adj;
  const have = function (k) { return apply ? S.res[k] : Infinity; };
  const take = function (k, amt) { rec.inp[k] = (rec.inp[k] || 0) + amt; if (apply) S.res[k] -= amt; };
  const give = function (k, amt) { rec.out[k] = (rec.out[k] || 0) + amt; if (apply) addRes(S, k, amt, C, d.name); };
  // ratio of a chain step that can actually run, given stocks
  const lim = function (wants) {
    let r = 1;
    const ks = Object.keys(wants);
    for (let k = 0; k < ks.length; k++) {
      if (wants[ks[k]] <= 0) continue;
      const rr = have(ks[k]) / wants[ks[k]];
      if (rr < r) { r = rr; if (apply) rec.starved = ks[k]; }
    }
    return clamp(r, 0, 1);
  };

  if (bid === 'tap') {
    give('power', (6.0 + A) * eff);

  } else if (bid === 'sifter') {
    give('ash', (5.0 + A) * eff * (S.tech.sifting ? 1.3 : 1));

  } else if (bid === 'mine') {
    give('ore', (3.4 + A) * eff * (S.tech.bore ? 1.35 : 1));

  } else if (bid === 'cond') {
    const pw = 1.0 * eff;
    const r = lim({ power: pw });
    rec.ratio = r;
    take('power', pw * r);
    give('water', (3.0 + (S.tech.coils ? 2.0 : 0) + A) * eff * r);

  } else if (bid === 'salvage') {
    give('metal', 0.9 * eff);
    give('parts', 0.7 * eff);
    give('scrip', (2.2 + A) * eff);

  } else if (bid === 'forge') {
    const oreW = 3.0 * eff;
    const pwW = 1.5 * eff * (S.tech.refract ? 0.75 : 1);
    const r = lim({ ore: oreW, power: pwW });
    rec.ratio = r;
    take('ore', oreW * r);
    take('power', pwW * r);
    give('metal', (1.9 + A) * eff * r * (S.tech.refract ? 1.3 : 1));

  } else if (bid === 'gh') {
    // step A: ash + water -> soil
    const ashW = 3.5 * eff, watA = 1.5 * eff;
    const rA = lim({ ash: ashW, water: watA });
    take('ash', ashW * rA);
    take('water', watA * rA);
    give('soil', 3.5 * eff * rA);
    // step B: soil + water -> food (soil banked in step A is usable at once)
    const soilW = 3.0 * eff, watB = 1.0 * eff;
    const rB = lim({ soil: soilW, water: watB });
    take('soil', soilW * rB);
    take('water', watB * rB);
    give('food', (3.0 + A) * eff * rB * (S.tech.hydro ? 1.35 : 1));
    rec.ratio = Math.min(rA, rB);

  } else if (bid === 'workshop') {
    const metW = 2.6 * eff, pwW = 1.0 * eff;
    const r = lim({ metal: metW, power: pwW });
    rec.ratio = r;
    take('metal', metW * r);
    take('power', pwW * r);
    give('parts', (1.5 + A) * eff * r);

  } else if (bid === 'tradepost') {
    give('scrip', 3.0 * eff);
  }
  return rec;
}
const STAGE_ORDER = ['power', 'extract', 'refine', 'finish'];

/* ============================================================================
   4. TURN PHASES
   ==========================================================================*/

/* -- phase 2: storms ------------------------------------------------------ */
function stormMitigation(S) {
  const n = countBld(S);
  let cut = Math.min(0.45, 0.09 * n.baffle);
  if (S.tech.shutters) cut += 0.25;
  return Math.min(0.7, cut);
}
function phaseStorm(S, R) {
  S.storm.activeWater = 1;
  if (S.turn < S.storm.next) return;

  S.storm.next = S.turn + 6;
  S.storm.last = S.turn;
  S.stats.storms++;
  const sev = clamp(1 + Math.floor(S.turn / 14) + rint(S, 2), 1, 5);
  S.storm.severity = sev;
  const mit = stormMitigation(S);
  const spike = S.tech.baffles ? 1.35 : 1.9;
  S.storm.activeWater = spike;
  R.storm = { sev: sev, mit: mit, hits: [], spike: spike };

  logAdd(S, 'ASHSTORM, severity ' + sev + '. Water demand x' + spike +
    ' this turn. Mitigation absorbs ' + Math.round(mit * 100) + '% of damage rolls.', 'big');

  const built = [];
  for (let i = 0; i < S.map.length; i++) if (S.map[i].b) built.push(i);
  const rolls = sev + 1;
  for (let k = 0; k < rolls; k++) {
    if (!built.length) break;
    const t = built[rint(S, built.length)];
    if (rnd(S) < mit) continue;                    // absorbed by baffles / shutters
    const tile = S.map[t];
    if (tile.dmg >= 3) continue;
    tile.dmg = clamp(tile.dmg + 1, 0, 3);
    R.storm.hits.push({ i: t, b: tile.b, dmg: tile.dmg });
    logAdd(S, BLD[tile.b].name + ' at ' + coord(t) + ' damaged to level ' + tile.dmg +
      (tile.dmg >= 3 ? ' (DISABLED)' : ' (output ' + Math.round(DMG_MULT[tile.dmg] * 100) + '%)') + '.', 'bad');
  }
  if (!R.storm.hits.length) logAdd(S, 'The baffles held. No structures damaged.', 'good');
  for (let p = 0; p < S.pop.length; p++) S.pop[p].morale -= 4;
}
function coord(i) { return String.fromCharCode(65 + (i % MAPW)) + (Math.floor(i / MAPW) + 1); }

/* -- phase 3+4: labour and production ------------------------------------- */
function phaseProduce(S, R) {
  const C = caps(S);
  const before = {};
  for (let i = 0; i < RES.length; i++) before[RES[i]] = S.res[RES[i]];

  R.bld = [];
  for (let s = 0; s < STAGE_ORDER.length; s++) {
    const stage = STAGE_ORDER[s];
    for (let i = 0; i < S.map.length; i++) {
      const tile = S.map[i];
      if (!tile.b || BLD[tile.b].stage !== stage) continue;
      const rec = runBld(S, i, true, C);
      if (rec.eff > 0) {
        rec.tile = i;
        R.bld.push(rec);
        if (rec.ratio < 0.999 && rec.starved) {
          R.starved = R.starved || [];
          R.starved.push({ i: i, b: tile.b, res: rec.starved, ratio: rec.ratio });
        }
      }
    }
  }
  R.net = {};
  for (let i = 0; i < RES.length; i++) R.net[RES[i]] = S.res[RES[i]] - before[RES[i]];
  for (let i = 0; i < RES.length; i++) S.stats.produced[RES[i]] += Math.max(0, R.net[RES[i]]);

  if (R.starved && R.starved.length) {
    const seen = {};
    for (let k = 0; k < R.starved.length; k++) {
      const st = R.starved[k];
      const key = st.b + '|' + st.res;
      if (seen[key]) continue;
      seen[key] = 1;
      logAdd(S, BLD[st.b].name + ' at ' + coord(st.i) + ' ran at ' + Math.round(st.ratio * 100) +
        '%: not enough ' + RES_INFO[st.res].name.toLowerCase() + '.', 'warn');
    }
  }
}

/* -- phase 5: consumption ------------------------------------------------- */
function phaseConsume(S, R) {
  const n = countBld(S);
  const pop = S.pop.length;
  const foodNeed = pop * 1 + n.commons * 1;
  const waterNeed = pop * 1 * S.storm.activeWater + n.commons * 1;

  const foodGot = Math.min(S.res.food, foodNeed);
  S.res.food -= foodGot;
  const waterGot = Math.min(S.res.water, waterNeed);
  S.res.water -= waterGot;

  R.need = { food: foodNeed, water: waterNeed, foodGot: foodGot, waterGot: waterGot };
  R.foodShort = foodNeed - foodGot;
  R.waterShort = waterNeed - waterGot;

  if (R.foodShort > 0.01) {
    S.stats.shortFood++;
    logAdd(S, 'FOOD SHORTAGE: ' + r1(R.foodShort) + ' short of ' + r1(foodNeed) +
      ' needed. Everyone loses morale.', 'bad');
  }
  if (R.waterShort > 0.01) {
    S.stats.shortWater++;
    logAdd(S, 'WATER SHORTAGE: ' + r1(R.waterShort) + ' short of ' + r1(waterNeed) +
      ' needed' + (S.storm.activeWater > 1 ? ' (storm demand x' + S.storm.activeWater + ')' : '') +
      '. Everyone loses morale.', 'bad');
  }
}

/* -- phase 6: morale and fatigue ------------------------------------------ */
function phaseMorale(S, R) {
  const n = countBld(S);
  const house = housing(S);
  const crowd = Math.max(0, S.pop.length - house);
  const surplusOK = R.foodShort <= 0.01 && R.waterShort <= 0.01 &&
                    S.res.food > S.pop.length * 2 && S.res.water > S.pop.length * 2;
  R.moraleParts = [];
  const push = function (label, v) { if (v) R.moraleParts.push({ label: label, v: v }); };
  push('drift toward 60', 0);
  push('food shortage', R.foodShort > 0.01 ? -9 : 0);
  push('water shortage', R.waterShort > 0.01 ? -11 : 0);
  push('overcrowding (' + crowd + ' over ' + house + ' beds)', crowd > 0 ? -Math.min(12, 3 * crowd) : 0);
  push('Commons x' + n.commons, n.commons ? 3 * Math.min(2, n.commons) : 0);
  push('healthy surplus', surplusOK ? 3 : 0);
  push('storm this turn', R.storm ? -4 : 0);   // already applied in phaseStorm

  let delta = 0;
  for (let k = 0; k < R.moraleParts.length; k++) {
    if (R.moraleParts[k].label !== 'storm this turn') delta += R.moraleParts[k].v;
  }

  const fatGain = S.tech.automate ? 9 : 12;
  for (let p = 0; p < S.pop.length; p++) {
    const c = S.pop[p];
    const working = c.at !== null && S.map[c.at].b && BLD[S.map[c.at].b].slots > 0;
    // drift toward 60 when nothing else is happening
    const drift = c.morale < 60 ? 1 : (c.morale > 60 ? -1 : 0);
    c.morale = clamp(c.morale + delta + drift, 0, 100);
    if (working && c.fatigue > 78) c.morale = clamp(c.morale - 3, 0, 100);

    if (working) {
      c.fatigue = clamp(c.fatigue + fatGain, 0, 100);
      // skill grows slowly, faster in a matching job
      c.xp += (BLD[S.map[c.at].b].job === c.job) ? 1.5 : 0.75;
      if (c.skill < 5 && c.xp >= XP_STEPS[c.skill]) {
        c.skill++;
        logAdd(S, c.name + ' reached ' + JOBS[c.job].name + ' skill ' + c.skill + '.', 'good');
      }
    } else {
      c.fatigue = clamp(c.fatigue - 20, 0, 100);
      c.morale = clamp(c.morale + 2, 0, 100);
    }
    c.zeroTurns = c.morale <= 0 ? c.zeroTurns + 1 : 0;
  }
  R.moraleDelta = delta;
}

/* -- phase 7: attrition and growth ---------------------------------------- */
function phaseGrowth(S, R) {
  // Refusals and departures. A colonist at zero morale refuses to work; after
  // two consecutive turns at zero they walk out into the ash.
  for (let p = S.pop.length - 1; p >= 0; p--) {
    const c = S.pop[p];
    if (c.morale <= 0 && c.zeroTurns === 1) {
      logAdd(S, c.name + ' has stopped working. Morale is at zero. Fix food, water or crowding.', 'bad');
    }
    if (c.zeroTurns >= 2) {
      unassign(S, c);
      S.pop.splice(p, 1);
      S.stats.left++;
      logAdd(S, c.name + ' walked out of the outpost. Population ' + S.pop.length + '.', 'bad');
    }
  }
  // Newcomers: only with room, decent morale and real surplus.
  const house = housing(S);
  if (S.pop.length < house && avgMorale(S) > 62 &&
      S.res.food > S.pop.length * 2.5 && S.res.water > S.pop.length * 2.5) {
    if (rnd(S) < 0.18) {
      const c = makeColonist(S);
      c.morale = 60;
      S.pop.push(c);
      S.stats.joined++;
      logAdd(S, c.name + ' walked in off the flats and asked to stay. ' + JOBS[c.job].name +
        ', skill ' + c.skill + '. Population ' + S.pop.length + '.', 'good');
    }
  }
  // Anyone assigned to a destroyed or worker-less building is sent to rest.
  for (let p = 0; p < S.pop.length; p++) {
    const c = S.pop[p];
    if (c.at !== null && (!S.map[c.at].b || BLD[S.map[c.at].b].slots === 0)) unassign(S, c);
  }
}
function unassign(S, c) { c.at = null; }
/* ============================================================================
   5. MARKET AND CARAVAN  (phase 8)
   ----------------------------------------------------------------------------
   price = base x global index x your scarcity factor x side margin.
   The global index drifts every turn (supply and demand outside the valley).
   The scarcity factor reads YOUR stockpile: a full warehouse crashes the price
   you can sell at, an empty one makes buying expensive.
   ==========================================================================*/
const BASE_PRICE = { food:4, water:3, metal:5, parts:9, ore:2, ash:1.2, soil:2, power:3 };
const TRADE_RES = ['food','water','metal','parts','ore','ash','soil','power'];

function scarcity(S, res) {
  const cp = caps(S)[res];
  const frac = clamp(S.res[res] / cp, 0, 1);
  return clamp(1.35 - 0.7 * frac, 0.65, 1.35);
}
function postMult(S) {
  const n = countBld(S).tradepost;
  return { buy: Math.pow(0.92, n), sell: 1 + 0.12 * n, stock: 1 + 0.4 * n };
}
function priceBuy(S, res) {
  const p = postMult(S);
  return Math.max(1, Math.ceil(BASE_PRICE[res] * S.market.idx[res] * scarcity(S, res) * 1.2 * p.buy));
}
function priceSell(S, res) {
  const p = postMult(S);
  return Math.max(1, Math.floor(BASE_PRICE[res] * S.market.idx[res] * scarcity(S, res) * 0.8 * p.sell));
}
function phaseMarket(S, R) {
  for (let i = 0; i < TRADE_RES.length; i++) {
    const k = TRADE_RES[i];
    S.market.idx[k] = clamp(S.market.idx[k] + (rnd(S) * 0.12 - 0.06), 0.6, 1.6);
  }
  if (S.market.caravan) {
    S.market.caravan.turns--;
    if (S.market.caravan.turns <= 0) {
      logAdd(S, 'The ' + S.market.caravan.name + ' packed up and moved on.', 'plain');
      S.market.caravan = null;
      S.market.nextArrive = S.turn + rrange(S, 4, 6);
    }
  } else if (S.turn >= S.market.nextArrive) {
    const p = postMult(S);
    const nGoods = 4 + (S.tech.charter ? 1 : 0);
    const pool = TRADE_RES.slice();
    const goods = [];
    for (let g = 0; g < nGoods && pool.length; g++) {
      const res = pool.splice(rint(S, pool.length), 1)[0];
      goods.push({ res: res, qty: Math.round(rrange(S, 10, 28) * p.stock) });
    }
    const names = ['Kettle Road caravan','Slate Company train','Ninefold traders','Rime Coast convoy','Ashline pedlars'];
    S.market.caravan = {
      name: rpick(S, names),
      goods: goods,
      budget: rrange(S, 60, 140) + S.turn * 2,
      turns: 2
    };
    logAdd(S, 'A ' + S.market.caravan.name + ' rolled in. Two turns to trade. Scrip on hand: ' +
      S.market.caravan.budget + '.', 'big');
  }
}
function tradeBuy(S, res, qty) {
  const car = S.market.caravan;
  if (!car) return 'No caravan here.';
  const g = car.goods.filter(function (x) { return x.res === res; })[0];
  if (!g) return 'They are not carrying that.';
  qty = Math.min(qty, g.qty);
  if (qty <= 0) return 'They are sold out of that.';
  const unit = priceBuy(S, res);
  const total = unit * qty;
  if (S.res.scrip < total) return 'Not enough scrip (' + total + ' needed).';
  S.res.scrip -= total;
  g.qty -= qty;
  car.budget += total;
  const got = addRes(S, res, qty, caps(S), 'caravan purchase');
  logAdd(S, 'Bought ' + qty + ' ' + RES_INFO[res].name.toLowerCase() + ' for ' + total +
    ' scrip (' + unit + '/unit).' + (got < qty - 0.01 ? ' Some was lost to full storage.' : ''), 'plain');
  return null;
}
function tradeSell(S, res, qty) {
  const car = S.market.caravan;
  if (!car) return 'No caravan here.';
  qty = Math.min(qty, Math.floor(S.res[res]));
  if (qty <= 0) return 'You have none to sell.';
  const unit = priceSell(S, res);
  let total = unit * qty;
  if (total > car.budget) {
    qty = Math.floor(car.budget / unit);
    total = unit * qty;
    if (qty <= 0) return 'The caravan is out of scrip.';
  }
  S.res[res] -= qty;
  car.budget -= total;
  addRes(S, 'scrip', total, caps(S), 'trade');
  const g = car.goods.filter(function (x) { return x.res === res; })[0];
  if (g) g.qty += qty; else car.goods.push({ res: res, qty: qty });
  logAdd(S, 'Sold ' + qty + ' ' + RES_INFO[res].name.toLowerCase() + ' for ' + total +
    ' scrip (' + unit + '/unit).', 'plain');
  return null;
}

/* ============================================================================
   6. EVENT DECK  (phase 9)
   ----------------------------------------------------------------------------
   Weighted draw. Every fired event goes on cooldown for `cd` turns. Choice
   events park in S.pending and block End Turn until answered.
   ==========================================================================*/
function anyBuilt(S, filter) {
  const out = [];
  for (let i = 0; i < S.map.length; i++) {
    if (S.map[i].b && (!filter || filter(S.map[i]))) out.push(i);
  }
  return out;
}
function damageRandom(S, amount, why) {
  const list = anyBuilt(S, function (t) { return t.dmg < 3; });
  if (!list.length) return false;
  const i = list[rint(S, list.length)];
  S.map[i].dmg = clamp(S.map[i].dmg + amount, 0, 3);
  logAdd(S, BLD[S.map[i].b].name + ' at ' + coord(i) + ' damaged to level ' + S.map[i].dmg +
    ' (' + why + ').', 'bad');
  return true;
}
function moraleAll(S, v) {
  for (let i = 0; i < S.pop.length; i++) S.pop[i].morale = clamp(S.pop[i].morale + v, 0, 100);
}
function gainRes(S, k, v) { addRes(S, k, v, caps(S), 'event'); }
function loseRes(S, k, v) { S.res[k] = Math.max(0, S.res[k] - v); }

function phaseEvent(S, R) {

  phaseConsume(S, R);             // 5.
  phaseMorale(S, R);              // 6.

  let skillSum = 0;
  for (let i = 0; i < S.pop.length; i++) skillSum += S.pop[i].skill;

    'Stockpiles x1': Math.round(stock),
    'Scrip x0.5': Math.round(S.res.scrip * 0.5),
    'Turns survived x10': (S.turn - 1) * 10,
    'Buildings standing x6': anyBuilt(S).length * 6

  const ks = Object.keys(b);
  for (let i = 0; i < ks.length; i++) total += b[ks[i]];

  } else if (S.turn > WIN_TURN) {
    if (S.pop.length >= WIN_POP && needsMet(S)) {
      S.over = { win: true, reason: 'Turn ' + WIN_TURN + ' reached with ' + S.pop.length +
        ' colonists, full stores and no unmet needs. The outpost is permanent.' };
    } else {
      const why = [];
      if (S.pop.length < WIN_POP) why.push('population ' + S.pop.length + ' of ' + WIN_POP + ' required');
      if (!needsMet(S)) why.push('critical needs were not met on the final turn');
      S.over = { win: false, reason: 'Turn ' + WIN_TURN + ' came and went. You survived, but: ' +

    S.over.breakdown = sc.breakdown;

  if (!chk.ok) return chk.why;

  S.map[i].b = bid;
  S.map[i].dmg = 0;
  logAdd(S, 'Built a ' + BLD[bid].name + ' at ' + coord(i) + ' for ' + costStr(BLD[bid].cost) + '.', 'good');
  return null;
}
function actDemolish(S, i) {
  const tile = S.map[i];
  if (!tile.b) return 'Nothing there.';
  const nm = BLD[tile.b].name;
  const back = Math.floor((BLD[tile.b].cost.metal || 0) * 0.4);
  const ws = workersAt(S, i);
  for (let k = 0; k < ws.length; k++) ws[k].at = null;
  tile.b = null; tile.dmg = 0;
  addRes(S, 'metal', back, caps(S), 'demolition');

  if (!tile.dmg) return 'That building is undamaged.';
  const cost = repairCost(S, tile);
  if (S.res.parts < cost) return 'Repair needs ' + cost + ' parts; you have ' + Math.floor(S.res.parts) + '.';
  // Labour: one currently unassigned colonist does the work and is spent for the turn.
  const idle = S.pop.filter(function (c) { return c.at === null && c.morale > 0; });

  const worker = idle[0];

  worker.fatigue = clamp(worker.fatigue + 18, 0, 100);
  tile.dmg = 0;

}
function actAssign(S, colonistId, tileIdx) {

  if (!c) return 'No such colonist.';
  if (tileIdx === null) { c.at = null; return null; }
  const tile = S.map[tileIdx];
  if (!tile || !tile.b) return 'Nothing built there.';
  const d = BLD[tile.b];
  if (!d.slots) return d.name + ' does not take workers.';
  const here = workersAt(S, tileIdx).filter(function (x) { return x.id !== c.id; });

  if (st === 'locked') {
    const missing = TECH[id].pre.filter(function (p) { return !S.tech[p]; })
      .map(function (p) { return TECH[p].name; });
    return 'Prerequisite not met: ' + missing.join(', ') + '.';
  }
  if (!canAfford(S, TECH[id].cost)) return 'Cannot afford ' + costStr(TECH[id].cost) + '.';
  spend(S, TECH[id].cost);
  S.tech[id] = true;
  logAdd(S, 'RESEARCH COMPLETE: ' + TECH[id].name + '. ' + TECH[id].desc, 'good');
  return null;
}

  if (o.version !== 3) return { err: 'Wrong save version (found ' + o.version + ', expected 3).' };
  if (typeof o.turn !== 'number' || o.turn < 1) return { err: 'Field "turn" is missing or invalid.' };
  if (typeof o.rng !== 'number') return { err: 'Field "rng" (generator state) is missing.' };
  if (!Array.isArray(o.map) || o.map.length !== NTILES) return { err: 'Field "map" must hold exactly ' + NTILES + ' tiles.' };
  for (let i = 0; i < o.map.length; i++) {

  if (!o.tech || typeof o.tech !== 'object') return { err: 'Field "tech" is missing.' };

const GREEDY_BUILD = [
  { b:'sifter', n:1 }, { b:'gh', n:1 }, { b:'cond', n:1 }, { b:'tap', n:1 },
  { b:'mine', n:1 }, { b:'forge', n:1 }, { b:'salvage', n:1 }, { b:'hab', n:1 },
  { b:'gh', n:2 }, { b:'cond', n:2 }, { b:'sifter', n:2 }, { b:'workshop', n:1 },
  { b:'hab', n:2 }, { b:'tap', n:2 }, { b:'cistern', n:1 }, { b:'commons', n:1 },
  { b:'gh', n:3 }, { b:'cond', n:3 }, { b:'mine', n:2 }, { b:'baffle', n:1 },
  { b:'hab', n:3 }, { b:'forge', n:2 }, { b:'sifter', n:3 }, { b:'depot', n:1 },
  { b:'tradepost', n:1 }, { b:'baffle', n:2 }, { b:'gh', n:4 }, { b:'cond', n:4 },
  { b:'hab', n:4 }, { b:'commons', n:2 }, { b:'baffle', n:3 }

const GREEDY_TECH = ['salvage','sifting','coils','hydro','shutters','bore','repairs',
                     'baffles','charter','refract','commons','automate'];

function greedyTurn(S) {
  // (a) answer any pending event choice
  if (S.pending) resolveChoice(S, rint(S, EVENTS.filter(function (e) { return e.id === S.pending.id; })[0].choices.length));

  // (b) repair the worst damage first (stable order: damage desc, then index)
  for (let pass = 0; pass < 3; pass++) {
    let best = -1, bestD = 0;
    for (let i = 0; i < S.map.length; i++) {
      if (S.map[i].b && S.map[i].dmg > bestD) { bestD = S.map[i].dmg; best = i; }
    }
    if (best < 0 || actRepair(S, best)) break;
  }

  // (c) research, in a fixed priority order
  for (let i = 0; i < GREEDY_TECH.length; i++) {
    if (techState(S, GREEDY_TECH[i]) === 'available' && canAfford(S, TECH[GREEDY_TECH[i]].cost)) {
      actResearch(S, GREEDY_TECH[i]);
      break;                       // at most one purchase per turn
    }
  }

  // (d) build the first unmet item on the wishlist, on the best-bonus legal tile
  const have = countBld(S);
  for (let w = 0; w < GREEDY_BUILD.length; w++) {
    const want = GREEDY_BUILD[w];
    if (have[want.b] >= want.n) continue;
    if (!techOK(S, want.b) || !canAfford(S, BLD[want.b].cost)) continue;
    let best = -1, bestScore = -1;
    for (let i = 0; i < S.map.length; i++) {
      if (!buildCheck(S, i, want.b).ok) continue;
      const sc = adjBonus(S, i, want.b);
      if (sc > bestScore) { bestScore = sc; best = i; }
    }
    // Only stop once something was actually placed. If no legal tile exists for
    // this entry (e.g. no free ruins for a Salvage Yard), fall through to the
    // next wish rather than stalling on it forever.
    if (best >= 0) { actBuild(S, best, want.b); break; }
  }

  // (e) staffing: rest the exhausted, then fill slots by building priority,
  //     preferring colonists whose job matches
  for (let p = 0; p < S.pop.length; p++) {
    if (S.pop[p].fatigue > 82 || S.pop[p].morale <= 0) S.pop[p].at = null;
  }
  for (let g = 0; g < GREEDY_STAFF.length; g++) {
    const bid = GREEDY_STAFF[g];
    for (let i = 0; i < S.map.length; i++) {
      if (S.map[i].b !== bid || S.map[i].dmg >= 3) continue;
      let free = BLD[bid].slots - workersAt(S, i).length;
      while (free > 0) {
        let cand = null;
        for (let p = 0; p < S.pop.length; p++) {
          const c = S.pop[p];

          if (!cand) cand = c;

        cand.at = i;
        free--;

    }

  if (S.market.caravan) {
    const C = caps(S);
    const dump = ['ore','ash','soil','metal','power'];
    for (let i = 0; i < dump.length; i++) {
      const k = dump[i];
      if (S.res[k] > C[k] * 0.75) tradeSell(S, k, Math.floor(S.res[k] - C[k] * 0.5));
    }
    const pop = S.pop.length;
    if (S.res.food < pop * 3 && S.res.scrip > 40) tradeBuy(S, 'food', Math.min(20, Math.floor(S.res.scrip / (priceBuy(S, 'food') * 2))));
    if (S.res.water < pop * 3 && S.res.scrip > 40) tradeBuy(S, 'water', Math.min(20, Math.floor(S.res.scrip / (priceBuy(S, 'water') * 2))));
  }

  endTurn(S);
  if (S.pending) resolveChoice(S, rint(S, EVENTS.filter(function (e) { return e.id === S.pending.id; })[0].choices.length));
}

function runBenchmark(seed, turns) {
  const S = newGame(seed);
  S.noEnd = true;                  // suppress win/lose so 200 turns always run
  let peakPop = S.pop.length, starves = 0;
  for (let t = 0; t < turns; t++) {

    if (S.lastTurn && (S.lastTurn.foodShort > 0.01 || S.lastTurn.waterShort > 0.01)) starves++;
  }
  const sc = scoreOf(S);
  return {
    hash: stateHash(S),
    turns: turns,
    pop: S.pop.length,
    peakPop: peakPop,
    tech: sc.techDone,
    score: sc.total,
    buildings: anyBuilt(S).length,
    starveTurns: starves,
    storms: S.stats.storms,
    joined: S.stats.joined,
    left: S.stats.left,
    died: S.stats.died,
    overflow: Math.round(S.stats.overflow),
    res: RES.map(function (k) { return k + ' ' + Math.round(S.res[k]); }).join(', '),
    avgMorale: Math.round(avgMorale(S)),

}

    for (let i = 0; i < S.map.length; i++) if (S.map[i].terr === 'ash') { ash = i; break; }

    if (S.res.metal !== 1) return 'resources changed on a failed build';

  T('Locked buildings cannot be placed before their research', function () {
    const S = newGame(8);

    if (S.market.caravan.budget < 0) return 'the caravan budget went negative';

  T('Save/load round-trips to an identical state hash', function () {
    const S = newGame(31337); S.noEnd = true;
    for (let t = 0; t < 12; t++) greedyTurn(S);

    const txt = serialize(S);
    const res = deserialize(txt);
    if (res.err) return 'load rejected a valid save: ' + res.err;
    const h2 = stateHash(res.state);
    if (h1 !== h2) return 'hash ' + h1 + ' became ' + h2;
    // and the reloaded state must continue the same random stream
    const a = res.state, b = JSON.parse(serialize(S));

  T('Bad save text is rejected with a clear error and no state change', function () {

  });

  T('Benchmark is reproducible: same seed, same hash', function () {
    const a = runBenchmark(2468, 25);

  T('The game is losable: an unfed outpost empties out', function () {
    const S = newGame(99);

    if (S.over.win) return 'a starving colony reported a victory';
    if (typeof S.over.score !== 'number') return 'no score was produced';
  });

}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* --- floating tooltip, works on hover, focus and tap --------------------- */
(function () {
  const el = $('tip');
  let shown = null;
  function show(target) {
    const t = target.getAttribute('data-tip');
    if (!t) return;
    el.textContent = t;
    el.classList.add('on');
    const r = target.getBoundingClientRect();
    const w = el.offsetWidth, h = el.offsetHeight;
    let x = r.left, y = r.bottom + 6;
    if (x + w > window.innerWidth - 6) x = Math.max(6, window.innerWidth - w - 6);
    if (y + h > window.innerHeight - 6) y = Math.max(6, r.top - h - 6);
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    shown = target;
  }
  function hide() { el.classList.remove('on'); shown = null; }
  document.addEventListener('mouseover', function (e) {
    const t = e.target.closest ? e.target.closest('[data-tip]') : null;
    if (t) show(t); else if (shown) hide();
  });
  document.addEventListener('focusin', function (e) {
    const t = e.target.closest ? e.target.closest('[data-tip]') : null;
    if (t) show(t); else hide();
  });
  document.addEventListener('focusout', hide);
  document.addEventListener('touchstart', function (e) {
    const t = e.target.closest ? e.target.closest('[data-tip]') : null;
    if (t) { show(t); } else hide();
  }, { passive: true });
  window.addEventListener('scroll', hide, true);
  window.addEventListener('resize', hide);
})();

/* --- number formatting --------------------------------------------------- */
function num(v) { return (Math.round(v * 10) / 10).toString(); }
function signed(v) { return (v > 0 ? '+' : '') + num(v); }

/* --- resource bar -------------------------------------------------------- */
function renderRes() {
  const C = caps(S);
  const net = S.lastTurn ? S.lastTurn.net : null;
  const need = S.lastTurn ? S.lastTurn.need : null;
  let h = '';
  for (let i = 0; i < RES.length; i++) {
    const k = RES[i], v = S.res[k], cp = C[k];
    const capped = cp !== Infinity;
    const pct = capped ? v / cp : 0;
    const cls = capped && pct > 0.98 ? ' full' : (v < 1 ? ' empty' : '');
    let d = '';
    if (net && Math.abs(net[k]) > 0.05) {
      d = '<span class="delta ' + (net[k] > 0 ? 'up' : 'dn') + '">' + signed(net[k]) + '</span>';
    }
    let tp = RES_INFO[k].name + ': ' + num(v) + (capped ? ' of ' + cp + ' storage' : ' (uncapped)') + '. ' + RES_INFO[k].desc;
    if (net) tp += ' Last turn production minus building inputs: ' + signed(net[k]) + '.';
    if (k === 'food' && need) tp += ' Colonist demand: ' + num(need.food) + ' per turn.';
    if (k === 'water' && need) {
      tp += ' Colonist and greenhouse demand: ' + num(need.water) + ' per turn' +
        (S.storm.activeWater > 1 ? ' (storm multiplier x' + S.storm.activeWater + ' applied)' : '') + '.';
    }
    if (capped && pct > 0.98) tp += ' STORAGE FULL - further output is being lost.';
    h += '<div class="res' + cls + '"' + tip(tp) + '>' +
      '<span class="k">' + RES_INFO[k].name + (capped && pct > 0.98 ? ' [FULL]' : '') + '</span>' +
      '<span class="v mono">' + num(v) + '</span> ' + d +
      '<span class="d">' + (capped ? '/ ' + cp : 'no cap') + '</span></div>';
  }
  $('resbar').innerHTML = h;
}

function tileTip(i) {
  const t = S.map[i];
  let s = coord(i) + ' - ' + TERR[t.terr].name + '. ' + TERR[t.terr].desc;
  if (t.b) {
    const d = BLD[t.b];
    s += ' || ' + d.name + '.';
    if (t.dmg) s += ' DAMAGE LEVEL ' + t.dmg + ' of 3 - output x' + DMG_MULT[t.dmg] +
      '. Repair costs ' + repairCost(S, t) + ' parts and one idle colonist.';
    if (d.slots) {
      const ws = workersAt(S, i);
      s += ' Workers ' + ws.length + '/' + d.slots + ' (' + JOBS[d.job].name + ' preferred).';
      s += ' Labour ' + r2(labourAt(S, i)) + ' units.';
      const rec = runBld(S, i, false);
      const outs = Object.keys(rec.out);
      if (outs.length) {
        s += ' Output at full inputs: ' + outs.map(function (k) {
          return signed(rec.out[k]) + ' ' + RES_INFO[k].name.toLowerCase();
        }).join(', ') + '.';
      }
      const ins = Object.keys(rec.inp);
      if (ins.length) {
        s += ' Draws: ' + ins.map(function (k) {
          return num(rec.inp[k]) + ' ' + RES_INFO[k].name.toLowerCase();
        }).join(', ') + '.';
      }
      if (d.adj) s += ' Adjacency: ' + adjText(S, i, t.b) + '.';
    } else {
      s += ' ' + d.desc;
    }
  } else {
    s += ' Empty - click to open the build list.';
  }
  return s;
}

  s += 'Morale ' + Math.round(c.morale) + '/100 (output x' + r2(moraleMult(c)) + '). ';
  s += 'Fatigue ' + Math.round(c.fatigue) + '/100 (output x' + r2(fatigueMult(c)) + '). ';
  if (c.at !== null && S.map[c.at].b) {
    const d = BLD[S.map[c.at].b];
    const matched = d.job === c.job;
    s += 'Working the ' + d.name + ' at ' + coord(c.at) + ': skill factor x' + r2(skillMult(c, d)) +
      (matched ? ' (job matches)' : ' (job mismatch, reduced)') + '. ';
    s += 'Total labour ' + r2(labourOf(S, c)) + ' units. ';
    s += 'Gains ' + (S.tech.automate ? 9 : 12) + ' fatigue per turn worked.';
  } else {
    s += 'Resting: loses 20 fatigue and gains 2 morale per turn, and can be called on for repairs.';
  }
  const nxt = c.skill < 5 ? XP_STEPS[c.skill] : null;
  if (nxt !== null) s += ' Experience ' + r1(c.xp) + '/' + nxt + ' toward skill ' + (c.skill + 1) + '.';
  return s;
}
function bar(v, cls, tp) {

}

/* --- input wiring -------------------------------------------------------- */
document.addEventListener('click', function (e) {
  const el = e.target.closest ? e.target.closest('[data-tab],[data-tile],[data-build],[data-tech],[data-buy],[data-sell],' +
    '[data-repair],[data-demolish],[data-unassign],[data-choice],#assignbtn,#autostaff,#endturn,#newgame,' +
    '#btntests,#btnbench,#btnexport,#btnimport,#btnhash,#againsame,#againnext,#keeplooking') : null;
  if (!el) return;
  const a = function (n) { return el.getAttribute(n); };
  let err = null;

  if (a('data-tab')) { UI.tab = a('data-tab'); render(); return; }

  if (el.hasAttribute('data-tile')) {
    const i = +a('data-tile');
    UI.sel = (UI.sel === i) ? null : i;
    render(); return;
  }
  if (el.hasAttribute('data-build')) err = actBuild(S, +a('data-at'), a('data-build'));
  else if (el.hasAttribute('data-repair')) err = actRepair(S, +a('data-repair'));
  else if (el.hasAttribute('data-demolish')) err = actDemolish(S, +a('data-demolish'));
  else if (el.hasAttribute('data-unassign')) err = actAssign(S, +a('data-unassign'), null);
  else if (el.hasAttribute('data-tech')) err = actResearch(S, a('data-tech'));
  else if (el.hasAttribute('data-choice')) { resolveChoice(S, +a('data-choice')); }
  else if (el.id === 'assignbtn') {
    const sel = $('assignsel');
    if (sel) err = actAssign(S, +sel.value, UI.sel);
  }
  else if (el.id === 'autostaff') {
    for (let p = 0; p < S.pop.length; p++) if (S.pop[p].fatigue > 82 || S.pop[p].morale <= 0) S.pop[p].at = null;
    for (let g = 0; g < GREEDY_STAFF.length; g++) {
      const bid = GREEDY_STAFF[g];
      for (let i = 0; i < S.map.length; i++) {
        if (S.map[i].b !== bid || S.map[i].dmg >= 3) continue;
        let free = BLD[bid].slots - workersAt(S, i).length;
        while (free > 0) {
          let cand = null;
          for (let p = 0; p < S.pop.length; p++) {
            const c = S.pop[p];
            if (c.at !== null || c.fatigue > 82 || c.morale <= 0) continue;
            if (!cand) cand = c;
            else {
              const cm = c.job === BLD[bid].job, om = cand.job === BLD[bid].job;
              if ((cm && !om) || (cm === om && c.skill > cand.skill)) cand = c;
            }
          }
          if (!cand) break;
          cand.at = i; free--;
        }
      }
    }
    logAdd(S, 'Shift roster rewritten by the foreman.', 'plain');
  }
  else if (el.hasAttribute('data-buy') || el.hasAttribute('data-sell')) {
    const res = a('data-buy') || a('data-sell');
    const qi = document.querySelector('[data-qty="' + res + '"]');
    const qty = Math.max(1, Math.floor(+(qi ? qi.value : 5) || 1));
    UI.tradeMsg = el.hasAttribute('data-buy') ? tradeBuy(S, res, qty) : tradeSell(S, res, qty);
  }
  else if (el.id === 'endturn') { doEndTurn(); return; }
  else if (el.id === 'newgame') { startGame(+$('seedin').value | 0); return; }
  else if (el.id === 'btntests') {
    UI.tests = runTests();
    const pass = UI.tests.filter(function (t) { return t.pass; }).length;
    logAdd(S, 'Test suite: ' + pass + '/' + UI.tests.length + ' assertions passed.', pass === UI.tests.length ? 'good' : 'bad');
  }
  else if (el.id === 'btnbench') {
    const t0 = (window.performance && performance.now) ? performance.now() : 0;
    const b = runBenchmark(S.seed, 200);
    const b2 = runBenchmark(S.seed, 200);
    const t1 = (window.performance && performance.now) ? performance.now() : 0;
    b.seed = S.seed; b.hash2 = b2.hash; b.ms = Math.round(t1 - t0);
    UI.bench = b;
    logAdd(S, 'Benchmark: 200 turns on seed ' + S.seed + ', final hash ' + b.hash +
      ' (repeat run ' + (b.hash === b2.hash ? 'matched' : 'DIFFERED') + ').', b.hash === b2.hash ? 'good' : 'bad');
  }
  else if (el.id === 'btnexport') {
    UI.saveText = serialize(S);
    const box = $('savebox');
    if (box) { box.value = UI.saveText; box.select(); }
    flash('Exported ' + UI.saveText.length + ' characters. Hash ' + stateHash(S) + '. Copy it out now.', true);
    return;
  }
  else if (el.id === 'btnimport') {
    const box = $('savebox');
    const res = deserialize(box ? box.value : '');
    if (res.err) { flash('Import failed: ' + res.err, false); return; }
    S = res.state;
    UI.sel = null; UI.saveText = box.value;
    logAdd(S, 'Save imported. Turn ' + S.turn + ', hash ' + stateHash(S) + '.', 'big');
    flash('Import succeeded. Turn ' + S.turn + ', hash ' + stateHash(S) + '.', true);
    return;
  }
  else if (el.id === 'btnhash') {
    const box = $('savebox');
    const res = deserialize(box ? box.value : '');
    flash(res.err ? 'Cannot hash: ' + res.err : 'Box hash ' + stateHash(res.state) +
      '  ·  live state hash ' + stateHash(S) +
      (stateHash(res.state) === stateHash(S) ? '  ·  identical' : '  ·  they differ'), !res.err);
    return;
  }
  else if (el.id === 'againsame') { startGame(S.seed); return; }
  else if (el.id === 'againnext') { startGame(S.seed + 1); return; }
  else if (el.id === 'keeplooking') { S.over.dismissed = true; render(); return; }

  if (err) logAdd(S, 'Cannot do that: ' + err, 'warn');
  render();
});

document.addEventListener('input', function (e) {
  if (e.target && e.target.id === 'savebox') UI.saveText = e.target.value;
});

document.addEventListener('change', function (e) {
  const el = e.target;
  if (el && el.hasAttribute && el.hasAttribute('data-assignfor')) {
    const id = +el.getAttribute('data-assignfor');
    const err = actAssign(S, id, el.value === 'rest' ? null : +el.value);
    if (err) logAdd(S, 'Cannot do that: ' + err, 'warn');
    render();
  }
});

document.addEventListener('keydown', function (e) {
  const t = e.target;
  const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT');
  if (typing) return;
  if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); doEndTurn(); return; }
  const map = { '1':'map', '2':'people', '3':'research', '4':'trade', '5':'log', '6':'dev' };
  if (map[e.key]) { UI.tab = map[e.key]; render(); }
});

function doEndTurn() {
  if (S.over) { S.over.dismissed = false; render(); return; }   // reopen the summary
  if (S.pending) { logAdd(S, 'Answer the pending decision first.', 'warn'); render(); return; }
  UI.tradeMsg = null;
  endTurn(S);
  render();
  const lb = $('logbox');
  if (lb) lb.scrollTop = 0;
}

function startGame(seed) {
  if (!isFinite(seed)) seed = 1337;
  S = newGame(seed | 0);
  UI.sel = null; UI.tradeMsg = null; UI.loadMsg = null; UI.saveText = '';
  $('seedin').value = S.seed;
  render();
}
startGame(1337);

</script>
</body>
