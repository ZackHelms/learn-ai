/* ---------------------------- SAVE / LOAD -------------------------------- */

function serialize(s){
  const c = deepClone(s);
  delete c.ui;
  return JSON.stringify(c);
}
function validateSave(obj){
  if (obj === null || typeof obj !== "object" || Array.isArray(obj)) return "top level is not an object";
  if (obj.version !== VERSION) return "save version " + obj.version + " does not match this build (" + VERSION + ")";
  if (typeof obj.turn !== "number" || obj.turn < 0) return "turn is missing or invalid";
  if (typeof obj.rngState !== "number") return "rngState is missing";
  if (!Array.isArray(obj.tiles) || obj.tiles.length !== GRID * GRID) return "tiles must be an array of " + (GRID*GRID) + " entries";
  for (const t of obj.tiles){
    if (!TERRAIN[t.t]) return "unknown terrain type '" + t.t + "'";
    if (t.b && !BT[t.b.id]) return "unknown building id '" + t.b.id + "'";
  }
  if (!Array.isArray(obj.colonists)) return "colonists must be an array";
  for (const c of obj.colonists){
    if (typeof c.name !== "string" || JOBS.indexOf(c.job) < 0) return "a colonist has an invalid name or job";
    if (!(c.skill >= 1 && c.skill <= 5)) return "a colonist has skill outside 1-5";
  }
  if (!obj.res || typeof obj.res !== "object") return "res block is missing";
  for (const k of RES) if (typeof obj.res[k] !== "number" || obj.res[k] < 0) return "resource '" + k + "' is missing or negative";
  if (!obj.tech || typeof obj.tech !== "object") return "tech block is missing";
  for (const k of Object.keys(obj.tech)) if (!TECH[k]) return "unknown technology '" + k + "'";
  if (!Array.isArray(obj.log)) return "log must be an array";
  return null;
}
function loadFrom(text){
  let obj;
  try { obj = JSON.parse(text); }
  catch (e){ return "Not valid JSON: " + e.message; }
  const err = validateSave(obj);
  if (err) return "Invalid save: " + err;
  const ui = S.ui;
  S = obj;
  S.ui = ui;
  S.ui.selTile = null;
  // Rebuild worker lists from colonist assignments so the two can never disagree.
  S.tiles.forEach(t => { if (t.b) t.b.workers = []; });
  S.colonists.forEach(c => {
    if (c.at !== null && c.at !== undefined){
      const t = S.tiles[c.at];
      if (t && t.b && BT[t.b.id].slots > t.b.workers.length) t.b.workers.push(c.id);
      else c.at = null;
    }
  });
  return null;
}

/* ---------------------------- GREEDY POLICY (benchmark) ------------------ */

const BUILD_PRIORITY = ["gen","cond","soil","green","scav","forge","hab","shop","wind","cist","depot","market"];
const STAFF_PRIORITY = ["gen","cond","soil","green","scav","forge","shop","clinic"];

function greedyPolicy(s){
  // 1. Repair anything meaningfully damaged.
  s.tiles.forEach(t => {
    if (t.b && t.b.integrity < 70 && s.res.parts >= repairCost(s, t) + 2) doRepair(s, t);
  });
  // 2. Rest the spent, staff the rest.
  s.colonists.forEach(c => { if (c.fatigue > 85 && c.at !== null && c.at !== undefined) assign(s, c, null); });
  const idle = () => s.colonists.filter(c => (c.at === null || c.at === undefined) && c.fatigue < 70 && c.morale > 0);
  STAFF_PRIORITY.forEach(id => {
    s.tiles.forEach((t, i) => {
      if (!t.b || t.b.id !== id || t.b.integrity < 30) return;
      const bt = BT[id];
      while (t.b.workers.length < bt.slots){
        const pool = idle();
        if (!pool.length) return;
        let pickC = pool.find(c => c.job === bt.job) || pool[0];
        if (assign(s, pickC, i)) return;
      }
    });
  });
  // 3. Build the single most-needed thing we can afford.
  const pop = s.colonists.length;
  const want = [];
  if (countB(s, "gen") < 1 || s.res.power < 8) want.push("gen");
  if (s.res.water < pop * 4) want.push("cond");
  if (s.res.soil < 12) want.push("soil");
  if (s.res.food < pop * 5) want.push("green");
  if (s.res.ore < 15) want.push("scav");
  if (s.res.metal < 25) want.push("forge");
  if (pop >= popCap(s) - 1) want.push("hab");
  if (s.res.parts < 12) want.push("shop");
  if (s.turn > 6 && countB(s, "wind") < 3) want.push("wind");
  BUILD_PRIORITY.forEach(id => want.push(id));
  for (const id of want){
    const bt = BT[id];
    if (!isUnlocked(s, bt)) continue;
    if (id === "hab" && countB(s, "hab") > 4) continue;
    if (id === "wind" && countB(s, "wind") >= 4) continue;
    if (["cist","depot","market"].indexOf(id) >= 0 && countB(s, id) >= 1) continue;
    // Never add a second unstaffed copy of a worker building - labour is the
    // real constraint, and idle buildings only soak up metal.
    if (bt.slots > 0 && s.tiles.some((t, i) => t.b && t.b.id === id && t.b.workers.length < bt.slots)) continue;
    let done = false;
    for (let i = 0; i < s.tiles.length && !done; i++){
      if (!canBuild(s, s.tiles[i], bt)){ doBuild(s, s.tiles[i], bt); done = true; }
    }
    if (done) break;
  }
  // 4. Research the first affordable available node.
  for (const t of TECHS){
    if (techState(s, t) === "avail" && canAfford(s, t.cost)){ doResearch(s, t); break; }
  }
  // 5. Trade: dump surplus, cover shortfalls.
  if (s.market.caravan){
    const c = caps(s);
    [["metal", 45], ["ore", 60], ["soil", 55], ["food", pop * 9]].forEach(([k, keep]) => {
      const extra = Math.floor(s.res[k] - keep);
      if (extra > 0) doSell(s, k, Math.min(extra, 30));
    });
    if (s.res.food < pop * 4 && s.res.scrip > 25) doBuy(s, "food", Math.min(15, Math.floor((c.food - s.res.food))));
    if (s.res.parts < 8 && s.res.scrip > 60) doBuy(s, "parts", 5);
  }
}

function runBenchmark(seed, turns){
  const s = newState(seed);
  s.auto = true; s.bench = true;
  for (let i = 0; i < turns; i++){
    greedyPolicy(s);
    const r = runTurn(s);
    if (r === "PAUSE"){ resolvePending(s, 0); runTurn(s); }
    if (s.colonists.length === 0) { /* keep simulating; the outpost is simply dead */ }
  }
  return s;
}

/* ---------------------------- DEV TESTS ---------------------------------- */

function runTests(){
  const out = [];
  let pass = 0, fail = 0;
  const ok = (name, cond, detail) => {
    if (cond) { pass++; out.push("PASS  " + name); }
    else { fail++; out.push("FAIL  " + name + (detail ? "  -> " + detail : "")); }
  };

  // 1 - PRNG determinism
  (() => {
    const a = { rngState: 1337 }, b = { rngState: 1337 };
    const seqA = [], seqB = [];
    for (let i = 0; i < 20; i++){ seqA.push(nextRand(a)); seqB.push(nextRand(b)); }
    ok("1. PRNG is deterministic for a given seed", seqA.join(",") === seqB.join(","));
    const c = { rngState: 1338 }; const seqC = [];
    for (let i = 0; i < 20; i++) seqC.push(nextRand(c));
    ok("2. Different seeds give different streams", seqA.join(",") !== seqC.join(","));
  })();

  // 3 - map shape and playability
  (() => {
    const s = newState(1337);
    ok("3. Map is exactly " + (GRID*GRID) + " tiles", s.tiles.length === GRID * GRID, "got " + s.tiles.length);
    const vents = s.tiles.filter(t => t.t === "vent").length;
    const water = s.tiles.filter(t => t.t === "water").length;
    ok("4. Generated map has >=2 vents and >=2 water tiles", vents >= 2 && water >= 2, "vents=" + vents + " water=" + water);
    ok("5. Every tile has a known terrain type", s.tiles.every(t => !!TERRAIN[t.t]));
  })();

  // 6 - terrain requirement enforced
  (() => {
    const s = newState(1337);
    s.res.metal = 999; s.res.parts = 999;
    const ashTile = s.tiles.find(t => t.t === "ash" && !t.b);
    const err = canBuild(s, ashTile, BT.gen);
    ok("6. Terrain requirement blocks a Vent Tap on ash flats", !!err, err || "no error returned");
    const ventTile = s.tiles.find(t => t.t === "vent" && !t.b);
    ok("7. The same Vent Tap is legal on a Vent tile", canBuild(s, ventTile, BT.gen) === null);
  })();

  // 8 - build cost actually deducted, no negatives
  (() => {
    const s = newState(1337);
    const before = s.res.metal;
    const tile = s.tiles.find(t => (t.t === "ash" || t.t === "rock") && !t.b);
    doBuild(s, tile, BT.hab);
    ok("8. Building deducts its metal cost", Math.abs(before - s.res.metal - buildCostOf(s, BT.hab).metal) < 1e-6,
       "before=" + before + " after=" + s.res.metal);
    ok("9. A tile that is already built on rejects a second building", canBuild(s, tile, BT.hab) !== null);
  })();

  // 10 - research prerequisites enforced
  (() => {
    const s = newState(1337);
    s.res.scrip = 999; s.res.parts = 999;
    const err = doResearch(s, TECH.arcology);
    ok("10. Research prerequisites are enforced", err !== null && !s.tech.arcology, err || "arcology bought with no prereqs");
    doResearch(s, TECH.sifting);
    ok("11. A root node with no prerequisites can be researched", s.tech.sifting === true);
    const s2 = newState(1337);
    ok("12. Research cannot be bought without scrip", (s2.res.scrip = 0, doResearch(s2, TECH.sifting) !== null));
  })();

  // 13 - research effect is measurable in production
  (() => {
    const a = newState(1337);
    const tile = a.tiles.find(t => t.t === "ash" && !t.b);
    a.res.metal = 999; doBuild(a, tile, BT.soil);
    const ti = a.tiles.indexOf(tile);
    assign(a, a.colonists.find(c => c.job === "farmer"), ti);
    const before = buildingIO(a, tile).out.soil;
    a.tech.sifting = true;
    const after = buildingIO(a, tile).out.soil;
    ok("13. Ash Sifting measurably raises Soil Works output",
       after > before * 1.3 - 1e-9, "before=" + fmt(before) + " after=" + fmt(after));
  })();

  // 14 - adjacency bonus measurable
  (() => {
    const s = newState(1337);
    s.res.metal = 999; s.res.parts = 999;
    const withWater = s.tiles.find(t => (t.t === "ash" || t.t === "rock") && !t.b && neighbours(s, t).some(n => n.t === "water"));
    const without = s.tiles.find(t => (t.t === "ash" || t.t === "rock") && !t.b && !neighbours(s, t).some(n => n.t === "water"));
    if (withWater && without){
      doBuild(s, withWater, BT.cond); doBuild(s, without, BT.cond);
      const c1 = s.colonists[0], c2 = s.colonists[1];
      c1.skill = c2.skill = 3; c1.job = c2.job = "engineer";
      c1.morale = c2.morale = 70; c1.fatigue = c2.fatigue = 10;
      assign(s, c1, s.tiles.indexOf(withWater));
      assign(s, c2, s.tiles.indexOf(without));
      const a = buildingIO(s, withWater).out.water, b = buildingIO(s, without).out.water;
      ok("14. Condenser beside meltwater out-produces one that is not", a > b, "adjacent=" + fmt(a) + " isolated=" + fmt(b));
    } else ok("14. Condenser adjacency comparison", true, "skipped: no suitable pair on this map");
  })();

  // 15 - assignment respects slots and stays consistent
  (() => {
    const s = newState(1337);
    s.res.metal = 999;
    const tile = s.tiles.find(t => t.t === "ash" && !t.b);
    doBuild(s, tile, BT.soil);
    const ti = s.tiles.indexOf(tile);
    const errs = s.colonists.map(c => assign(s, c, ti));
    const filled = errs.filter(e => e === null).length;
    ok("15. A 2-slot building accepts exactly 2 workers", filled === 2 && tile.b.workers.length === 2,
       "filled=" + filled + " workers=" + tile.b.workers.length);
    ok("16. Worker list and colonist.at agree after assignment",
       tile.b.workers.every(id => s.colonists.find(c => c.id === id).at === ti) &&
       s.colonists.filter(c => c.at === ti).length === tile.b.workers.length);
  })();

  // 17 - simulate and check global invariants
  (() => {
    const s = newState(1337);
    s.auto = true; s.bench = true;
    let negative = null, overCap = null;
    for (let i = 0; i < 40; i++){
      greedyPolicy(s);
      const r = runTurn(s);
      if (r === "PAUSE"){ resolvePending(s, 0); runTurn(s); }
      const c = caps(s);
      RES.forEach(k => {
        if (s.res[k] < -1e-9) negative = negative || (k + "=" + s.res[k] + " at turn " + s.turn);
        if (s.res[k] > c[k] + 1e-6) overCap = overCap || (k + "=" + s.res[k] + ">" + c[k] + " at turn " + s.turn);
      });
    }
    ok("17. No resource ever goes negative over 40 simulated turns", negative === null, negative);
    ok("18. Storage caps are never exceeded over 40 simulated turns", overCap === null, overCap);
    ok("19. Colonist roster length matches every building's worker list",
       s.tiles.every(t => !t.b || t.b.workers.every(id => !!s.colonists.find(c => c.id === id))) &&
       s.colonists.filter(c => c.at !== null && c.at !== undefined)
        .every(c => s.tiles[c.at] && s.tiles[c.at].b && s.tiles[c.at].b.workers.indexOf(c.id) >= 0));
    ok("20. Every colonist has skill 1-5 and morale/fatigue clamped to 0-100",
       s.colonists.every(c => c.skill >= 1 && c.skill <= 5 && c.morale >= 0 && c.morale <= 100 && c.fatigue >= 0 && c.fatigue <= 100));
    ok("21. Every researched node's prerequisites are also researched",
       Object.keys(s.tech).every(id => TECH[id].req.every(r => s.tech[r])));
    ok("22. Turn counter advanced exactly 40 turns", s.turn === 40, "turn=" + s.turn);
    ok("23. Building integrity stays within 0-100", s.tiles.every(t => !t.b || (t.b.integrity >= 0 && t.b.integrity <= 100)));
  })();

  // 24 - overflow is logged, not silent
  (() => {
    const s = newState(1337);
    s.auto = true;
    s.res.metal = caps(s).metal + 40;
    runTurn(s);
    ok("24. Overflow above a storage cap is clamped and logged",
       s.res.metal <= caps(s).metal + 1e-9 && s.log.some(l => /Overflow/.test(l.text)) && s.stats.overflowLost > 0);
  })();

  // 25 - event cooldown
  (() => {
    const s = newState(1337);
    s.auto = true;
    for (let i = 0; i < 25; i++){ greedyPolicy(s); runTurn(s); }
    const bad = Object.keys(s.events.cd).filter(id => s.events.cd[id] > EVENTS.find(e => e.id === id).cd);
    ok("25. No event's cooldown exceeds its declared value", bad.length === 0, bad.join(","));
    ok("26. At least one event fired within 25 turns", s.events.fired > 0, "fired=" + s.events.fired);
  })();

  // 27 - storm damages, repair restores and costs parts
  (() => {
    const s = newState(1337);
    s.auto = true; s.res.metal = 9999; s.res.parts = 999;
    for (let i = 0; i < 6; i++){
      const t = s.tiles.find(t2 => (t2.t === "ash" || t2.t === "rock") && !t2.b);
      if (t) doBuild(s, t, BT.hab);
    }
    const before = builtTiles(s).reduce((a, t) => a + t.b.integrity, 0);
    s.turn = 30;
    for (let k = 0; k < 3; k++){ s.storm.nextIn = 1; stepStorm(s); }
    const after = builtTiles(s).reduce((a, t) => a + t.b.integrity, 0);
    ok("27. Three ashstorms measurably damage standing buildings",
       after < before && s.stats.stormsWeathered === 3, "integrity " + fmt(before) + " -> " + fmt(after));
    const hurt = builtTiles(s).find(t => t.b.integrity < 100);
    if (hurt){
      const pBefore = s.res.parts;
      const e = doRepair(s, hurt);
      ok("28. Repair restores integrity to 100 and consumes parts",
         e === null && hurt.b.integrity === 100 && s.res.parts < pBefore,
         "err=" + e + " parts " + pBefore + " -> " + s.res.parts);
    } else ok("28. Repair restores integrity to 100 and consumes parts", false, "no building took damage");
    const mit = stormMitigation(s);
    s.tech.shutters = true; s.tech.frames = true;
    ok("29. Research measurably increases storm mitigation", stormMitigation(s).value > mit.value);
  })();

  // 30 - trade cannot overdraw scrip, stock or the caravan purse
  (() => {
    const s = newState(1337);
    s.market.caravan = { name:"Test Line", stay:2, inv:{food:10,water:10,metal:10,parts:10,ore:10,soil:10}, purse:5 };
    s.res.scrip = 1;
    const e1 = doBuy(s, "parts", 10);
    ok("30. Buying beyond your scrip is refused", e1 !== null && s.res.scrip >= 0, e1 || "purchase went through");
    s.res.metal = 5;
    const e2 = doSell(s, "metal", 40);
    ok("31. Selling more than you hold is refused", e2 !== null && /only have/.test(e2), e2 || "sale went through");
    s.res.metal = 100;
    const e3 = doSell(s, "metal", 100);
    ok("32. Selling beyond the caravan's purse is refused", e3 !== null, e3 || "sale went through");
  })();

  // 33 - price responds to stockpile
  (() => {
    const s = newState(1337);
    s.res.metal = 1;
    const low = priceOf(s, "metal", "sell");
    s.res.metal = caps(s).metal;
    const high = priceOf(s, "metal", "sell");
    ok("33. Sell price falls as your own stockpile fills", low > high, "empty=" + low + " full=" + high);
  })();

  // 34 - save/load round trip
  (() => {
    const s = newState(1337);
    s.auto = true;
    for (let i = 0; i < 12; i++){ greedyPolicy(s); const r = runTurn(s); if (r === "PAUSE"){ resolvePending(s,0); runTurn(s); } }
    const h1 = stateHash(s);
    const text = serialize(s);
    const keep = S; const keepUi = S.ui;
    S = s;
    const err = loadFrom(text);
    const h2 = stateHash(S);
    S = keep; S.ui = keepUi;
    ok("34. Save/load round-trips to an identical state hash", err === null && h1 === h2, "err=" + err + " " + h1 + " vs " + h2);
  })();

  // 35 - load validation rejects rubbish with a clear message
  (() => {
    const keep = S;
    const e1 = loadFrom("this is not json at all");
    const e2 = loadFrom('{"version":1,"turn":0}');
    const e3 = loadFrom(JSON.stringify({ version: VERSION, turn: 0, rngState: 1, tiles: [], colonists: [], res:{}, tech:{}, log:[] }));
    S = keep;
    ok("35. Bad JSON is rejected with a message", typeof e1 === "string" && /JSON/.test(e1));
    ok("36. A wrong-version save is rejected", typeof e2 === "string" && /version/.test(e2));
    ok("37. A structurally wrong save is rejected", typeof e3 === "string" && /tiles/.test(e3));
  })();

  // 38 - benchmark reproducibility
  (() => {
    const a = runBenchmark(4242, 30), b = runBenchmark(4242, 30);
    ok("38. Two benchmark runs from one seed give the identical hash", stateHash(a) === stateHash(b),
       stateHash(a) + " vs " + stateHash(b));
    const c = runBenchmark(4243, 30);
    ok("39. A different seed gives a different benchmark hash", stateHash(a) !== stateHash(c));
  })();

  // 40 - the engine RNG is never used anywhere in this file
  (() => {
    const needle = "Math" + "." + "ran" + "dom";
    const src = document.documentElement.innerHTML;
    ok("40. No engine RNG call appears anywhere in the page source", src.indexOf(needle) < 0);
  })();

  // 41 - losing is reachable, winning is not automatic
  (() => {
    const s = newState(1337);
    s.auto = true; s.colonists = []; s.tiles.forEach(t => { if (t.b) t.b.workers = []; });
    runTurn(s);
    ok("41. Population zero ends the run as a loss", s.over === "lose" && s.score && s.score.total >= 0);
  })();

  const head = (fail === 0 ? "ALL TESTS PASSED" : fail + " TEST(S) FAILED") +
    "  (" + pass + " passed, " + fail + " failed, " + (pass + fail) + " assertions)";
  return head + "\n" + "=".repeat(head.length) + "\n" + out.join("\n");
}

/* ---------------------------- DEV VIEW ----------------------------------- */

function viewDev(){
  let h = '<div class="panel"><h2>Seed &amp; Run</h2><div class="row">' +
    '<div class="grow">Seed <input type="number" id="seedInput" value="' + S.seed + '"' +
      tipAttr("The PRNG seed. It drives terrain, events, storm severity rolls, market drift and arrivals. Press New Outpost to restart from it.") + '></div>' +
    '<button class="pri" id="reseed"' + tipAttr("Abandon this run and generate a fresh outpost from the seed above.") + '>New Outpost</button>' +
    '<span class="tag"' + tipAttr("FNV-1a hash of the whole game state with UI fields stripped. Two identical states always hash the same.") + '>hash ' + stateHash(S) + '</span>' +
    '</div></div>';

  h += '<div class="panel"><h2>Verification</h2><div class="row">' +
    '<button class="pri" id="runTests"' + tipAttr("Run 41 assertions over real invariants: no negative resources, storage caps, roster consistency, research prerequisites, storm and repair behaviour, trade limits, and a save/load hash round trip.") + '>Run Tests</button>' +
    '<button class="pri" id="runBench"' + tipAttr("Headless 200-turn simulation from the seed above using the built-in greedy policy, then print a state hash and summary. Two runs from the same seed must print the same hash.") + '>Run Benchmark (200 turns)</button>' +
    '<button id="clearOut"' + tipAttr("Clear the output box below.") + '>Clear Output</button>' +
    '</div><div class="pre" id="devOut">' + (S.ui.devOut ? esc(S.ui.devOut) : "No output yet. Run the tests or the benchmark.") + '</div></div>';

  h += '<div class="panel"><h2>Save / Load</h2>' +
    '<div class="tiny muted">No browser storage is used anywhere. Copy the text out to keep a save; paste one back and press Load.</div>' +
    '<div class="row" style="margin:6px 0">' +
    '<button id="doSave"' + tipAttr("Serialize the full game state into the box below, ready to select and copy.") + '>Serialize to box</button>' +
    '<button id="doLoad"' + tipAttr("Parse and validate the box contents, then replace the running game with it. A bad paste is rejected with a specific reason.") + '>Load from box</button>' +
    '<button id="copySave"' + tipAttr("Select the whole save text so you can copy it with your keyboard.") + '>Select all</button>' +
    '</div>' +
    '<textarea id="saveBox" spellcheck="false" placeholder="Paste a save here, or press Serialize to box.">' + esc(S.ui.saveText) + '</textarea>' +
    (S.ui.loadMsg ? '<div class="tiny" style="margin-top:5px"><span class="tag ' + (/^Loaded/.test(S.ui.loadMsg) ? "ok" : "no") + '">' +
      esc(S.ui.loadMsg) + '</span></div>' : "") +
    '</div>';

  h += '<div class="panel"><h2>Turn Resolution Order</h2><table><tr><th>#</th><th>Step</th><th>What it does</th></tr>' +
    [["Advance","Increment the turn, tick down the Ash Blight timer, clear the storm flag."],
     ["Ashfall","Free ash accrues (6 a turn) as the raw input for the Soil Works."],
     ["Ashstorm","Every 5 turns: roll severity, damage buildings after mitigation, raise ash, cut morale, add fatigue, flag the water spike."],
     ["Production","Buildings run in a fixed order (power, water, ore, soil, metal, parts, food, care) so upstream output is available downstream. Skill grows here."],
     ["Needs","Colonists eat and drink. Shortfalls fall on the most fatigued first and flag them hungry or thirsty."],
     ["Morale & Fatigue","Apply hunger, thirst, fatigue, overcrowding and Clinic care, then drift toward the equilibrium and update work fatigue."],
     ["Event","Roll the weighted deck against cooldowns. A choice event pauses resolution until you answer."],
     ["Market & Caravan","Drift every global price index, then move the caravan in or out."],
     ["Storage Caps","Clamp every resource, log any overflow as lost, and round for a stable state hash."],
     ["Departures & Arrivals","Colonists at zero morale for 3 turns leave; a well-fed, high-morale outpost with spare bunks attracts newcomers."],
     ["End Check","Population 0 is a loss. At turn " + WIN_TURN + " the win conditions are scored."]
    ].map((r, i) => '<tr><td>' + (i+1) + '</td><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>').join("") +
    '</table></div>';
  return h;
}

function wireDev(){
  const rs = $("#reseed");
  if (rs) rs.onclick = () => {
    const v = parseInt($("#seedInput").value, 10);
    S = newState(isFinite(v) ? v : 1337);
    S.ui.tab = "dev";
    render();
  };
  const rt = $("#runTests");
  if (rt) rt.onclick = () => {
    S.ui.devOut = runTests();
    render();
    const el = $("#devOut"); if (el) el.scrollTop = 0;
  };
  const rb = $("#runBench");
  if (rb) rb.onclick = () => {
    const seed = parseInt($("#seedInput").value, 10);
    const useSeed = isFinite(seed) ? seed : 1337;
    const s = runBenchmark(useSeed, 200);
    const w = winCheck(s);
    const lines = [
      "BENCHMARK - 200 turns, seed " + useSeed + ", built-in greedy policy",
      "=".repeat(56),
      "FINAL STATE HASH : " + stateHash(s),
      "",
      "Turns simulated  : " + s.turn,
      "Population       : " + s.colonists.length + " / cap " + popCap(s),
      "Average morale   : " + fmt(avgMorale(s)) + "   average fatigue: " + fmt(avgFatigue(s)),
      "Total skill      : " + s.colonists.reduce((a,c)=>a+c.skill,0),
      "Buildings        : " + builtTiles(s).length + "  (" +
        BUILDINGS.map(b => countB(s, b.id) ? b.glyph + " x" + countB(s, b.id) : null).filter(Boolean).join(", ") + ")",
      "Damaged/offline  : " + builtTiles(s).filter(t => t.b.integrity < 100).length + " / " +
        builtTiles(s).filter(t => t.b.integrity < 30).length,
      "Research done    : " + Object.keys(s.tech).length + "/" + TECHS.length + "  (" + Object.keys(s.tech).sort().join(", ") + ")",
      "Resources        : " + RES.map(k => RES_META[k].glyph + " " + fmt(s.res[k])).join("  "),
      "Storms weathered : " + s.stats.stormsWeathered + "   repairs: " + s.stats.repairs,
      "Caravan visits   : " + s.market.visits + "   events fired: " + s.events.fired,
      "Food shortages   : " + s.stats.starveTurns + " turns   water shortages: " + s.stats.thirstTurns + " turns",
      "Arrived/departed : " + s.stats.born + " / " + s.stats.departed,
      "Overflow lost    : " + fmt(s.stats.overflowLost),
      "Win check now    : " + (w.win ? "WOULD WIN" : "would not win"),
      "  " + w.reasons.join("\n  "),
      "Score            : " + scoreOf(s).total,
      "",
      "Run this twice with the same seed: the hash must match exactly."
    ];
    S.ui.devOut = lines.join("\n");
    render();
  };
  const co = $("#clearOut");
  if (co) co.onclick = () => { S.ui.devOut = ""; render(); };
  const ds = $("#doSave");
  if (ds) ds.onclick = () => {
    S.ui.saveText = serialize(S);
    S.ui.loadMsg = "Serialized " + S.ui.saveText.length + " characters. Select all and copy.";
    render();
  };
  const dl = $("#doLoad");
  if (dl) dl.onclick = () => {
    const text = $("#saveBox").value;
    const keepTab = S.ui.tab;
    const err = loadFrom(text);
    S.ui.tab = keepTab;
    S.ui.saveText = text;
    S.ui.loadMsg = err ? err : "Loaded successfully: turn " + S.turn + ", " + S.colonists.length + " colonists, hash " + stateHash(S) + ".";
    render();
  };
  const cs = $("#copySave");
  if (cs) cs.onclick = () => { const b = $("#saveBox"); b.focus(); b.select(); };
  const sb = $("#saveBox");
  if (sb) sb.oninput = () => { S.ui.saveText = sb.value; };
}

/* ---------------------------- MODALS + TOASTS ---------------------------- */

function renderModal(){
  const host = $("#modalHost");
  if (S.pending){
    const ev = EVENTS.find(e => e.id === S.pending.id);
    host.innerHTML = '<div class="modal"><div class="box"><h2>' + esc(ev.name) + '</h2>' +
      '<div class="tiny">' + esc(ev.text) + '</div>' +
      '<div class="mini" style="margin-top:6px">Turn resolution is paused at step 7 of 11. Pick one - each option changes state, not just text.</div>' +
      '<div class="opts">' + ev.opts.map((o, i) =>
        '<button data-opt="' + i + '"' + tipAttr(o.tip) + '>' + esc(o.label) + '<br><span class="mini">' + esc(o.tip) + '</span></button>').join("") +
      '</div></div></div>';
    host.querySelectorAll("[data-opt]").forEach(b => {
      b.onclick = () => {
        resolvePending(S, parseInt(b.dataset.opt, 10));
        continueTurn(S);
        render();
      };
    });
    return;
  }
  if (S.over){
    const w = winCheck(S);
    const sc = S.score || scoreOf(S);
    host.innerHTML = '<div class="modal"><div class="box"><h2>' +
      (S.over === "win" ? "OUTPOST HELD &mdash; VICTORY" : "OUTPOST LOST") + '</h2>' +
      '<div class="tiny">' + (S.over === "win"
        ? "Sixty turns under the ashfall, and the lights are still on."
        : (S.colonists.length === 0 ? "The last colonist walked into the grey and did not come back."
           : "Turn " + WIN_TURN + " arrived and the outpost did not meet its conditions.")) + '</div>' +
      '<div class="hr"></div><h3>Win conditions</h3><table>' +
      w.checks.map(c => '<tr><td>' + (c.ok ? '<span class="tag ok">[OK]</span>' : '<span class="tag no">[FAIL]</span>') +
        '</td><td>' + esc(c.txt) + '</td></tr>').join("") + '</table>' +
      '<div class="hr"></div><h3>Score</h3><table class="scoretab"><tr><th>Component</th><th>Count</th><th>Each</th><th>Points</th></tr>' +
      sc.rows.map(r => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td><td>' + r[3] + '</td></tr>').join("") +
      '<tr><th>TOTAL</th><th></th><th></th><th>' + sc.total + '</th></tr></table>' +
      '<div class="mini" style="margin-top:6px">Final state hash ' + stateHash(S) + ' &middot; seed ' + S.seed + '</div>' +
      '<div class="opts"><button class="pri" id="againBtn">New outpost, same seed (' + S.seed + ')</button>' +
      '<button id="nextSeedBtn">New outpost, seed ' + (S.seed + 1) + '</button>' +
      '<button id="reviewBtn">Close and review the final state</button></div></div></div>';
    const ag = $("#againBtn"); if (ag) ag.onclick = () => { S = newState(S.seed); render(); };
    const ns = $("#nextSeedBtn"); if (ns) ns.onclick = () => { S = newState(S.seed + 1); render(); };
    const rv = $("#reviewBtn"); if (rv) rv.onclick = () => { S.reviewed = true; render(); };
    if (S.reviewed) host.innerHTML = '';
    return;
  }
  host.innerHTML = "";
}

let toastTimer = null;
function flash(msg){
  let el = document.getElementById("toast");
  if (!el){
    el = document.createElement("div");
    el.id = "toast";
    el.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:120;" +
      "background:#3a1f1a;border:1px solid #d9614c;color:#ffd9d0;padding:6px 12px;border-radius:4px;" +
      "font-size:12px;max-width:92vw;text-align:center";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = "block";
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = "none"; }, 2600);
}

/* ---------------------------- TOOLTIPS ----------------------------------- */

const tipEl = $("#tip");
let tipTarget = null;
function showTip(el, x, y){
  tipEl.textContent = el.getAttribute("data-tip");
  tipEl.style.display = "block";
  const r = tipEl.getBoundingClientRect();
  let left = x + 14, top = y + 16;
  if (left + r.width > window.innerWidth - 6) left = Math.max(4, window.innerWidth - r.width - 6);
  if (top + r.height > window.innerHeight - 6) top = Math.max(4, y - r.height - 12);
  tipEl.style.left = left + "px";
  tipEl.style.top = top + "px";
}
function hideTip(){ tipEl.style.display = "none"; tipTarget = null; }
document.addEventListener("mousemove", e => {
  const el = e.target.closest ? e.target.closest("[data-tip]") : null;
  if (el){ tipTarget = el; showTip(el, e.clientX, e.clientY); }
  else hideTip();
});
document.addEventListener("click", e => {
  // Tap-to-tip on touch devices: tapping a help element toggles its tooltip.
  const el = e.target.closest ? e.target.closest("[data-tip]") : null;
  if (el && !el.matches("button, select, input, [data-tile]")){
    if (tipTarget === el) hideTip();
    else { tipTarget = el; showTip(el, e.clientX, e.clientY); }
  }
});
document.addEventListener("scroll", hideTip, true);
window.addEventListener("blur", hideTip);

/* ---------------------------- INPUT + BOOT ------------------------------- */

function onEndTurn(){
  if (S.over || S.pending) return;
  const r = runTurn(S);
  if (r === "OVER") return;
  render();
}
document.addEventListener("keydown", e => {
  const tag = (e.target && e.target.tagName) || "";
  if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
  // A focused map tile handles its own Space (select); don't also end the turn.
  if ((e.key === " " || e.code === "Space") && e.target && e.target.hasAttribute && e.target.hasAttribute("data-tile")) return;
  if (e.key === " " || e.code === "Space"){
    e.preventDefault();
    if (!S.pending && !S.over) onEndTurn();
    return;
  }
  const t = TABS.find(x => x.key === e.key);
  if (t){ e.preventDefault(); S.ui.tab = t.id; render(); }
});

function wireAll(){
  const t = S.ui.tab;
  if (t === "map") wireMap();
  else if (t === "people") wirePeople();
  else if (t === "research") wireResearch();
  else if (t === "trade") wireTrade();
  else if (t === "dev") wireDev();
}

render();
