<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASHFALL OUTPOST</title>
    <style>
        :root {
            --bg: #1a1a1a;
            --fg: #e0e0e0;
            --accent: #ff6b35;
            --success: #4caf50;
            --warn: #ffc107;
            --danger: #f44336;
            --info: #2196f3;
            --border: #444;
            --panel-bg: #2a2a2a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: monospace;
            font-size: 13px;
            line-height: 1.4;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background: var(--panel-bg);
            border-bottom: 2px solid var(--accent);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .title {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent);
        }

        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 12px;
        }

        .stat {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            color: #aaa;
            font-size: 10px;
        }

        .stat-value {
            color: var(--fg);
            font-weight: bold;
        }

        .tabs {
            display: flex;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            gap: 0;
        }

        .tab-button {
            padding: 8px 16px;
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-family: monospace;
            font-size: 12px;
            transition: all 0.2s;
        }

        .tab-button:hover {
            color: var(--fg);
        }

        .tab-button.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .content {
            flex: 1;
            overflow: auto;
            display: flex;
        }

        .panel {
            display: none;
            flex: 1;
            padding: 12px;
            overflow: auto;
        }

        .panel.active {
            display: block;
        }

        .grid-map {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 2px;
            margin-bottom: 12px;
        }

        .tile {
            aspect-ratio: 1;
            min-width: 40px;
            padding: 4px;
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #333;
            transition: all 0.1s;
            user-select: none;
        }

        .tile:hover {
            background: #444;
            border-color: var(--accent);
        }

        .tile.empty { background: #2a2a2a; color: #666; }
        .tile.ash-flat { background: #5a5a4a; color: #8a8a7a; }
        .tile.rock { background: #4a4a4a; color: #7a7a7a; }
        .tile.water { background: #2a3a5a; color: #6a7a9a; }
        .tile.vent { background: #5a2a2a; color: #9a4a4a; }
        .tile.ruins { background: #4a4a3a; color: #8a8a6a; }

        .building-name {
            font-weight: bold;
            font-size: 9px;
        }

        .log-entry {
            padding: 4px;
            margin: 2px 0;
            border-left: 2px solid var(--border);
            font-size: 11px;
            line-height: 1.3;
        }

        .log-entry.info { border-left-color: var(--info); }
        .log-entry.warn { border-left-color: var(--warn); }
        .log-entry.danger { border-left-color: var(--danger); }
        .log-entry.success { border-left-color: var(--success); }

        .colonist {
            padding: 6px;
            margin: 4px 0;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 3px;
        }

        .colonist-name {
            font-weight: bold;
            color: var(--accent);
        }

        .colonist-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 4px;
            font-size: 11px;
            margin-top: 4px;
        }

        .stat-bar {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .bar {
            flex: 1;
            height: 8px;
            background: #444;
            border: 1px solid var(--border);
            position: relative;
            min-width: 40px;
        }

        .bar-fill {
            height: 100%;
            background: var(--success);
            width: 100%;
            transition: width 0.2s;
        }

        .bar.health .bar-fill { background: var(--danger); }
        .bar.morale .bar-fill { background: var(--warn); }
        .bar.fatigue .bar-fill { background: #ff9800; }

        .research-tree {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
        }

        .research-node {
            padding: 8px;
            border: 2px solid var(--border);
            background: var(--panel-bg);
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }

        .research-node.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .research-node.available {
            border-color: var(--success);
            cursor: pointer;
        }

        .research-node.available:hover {
            background: #333;
        }

        .research-node.complete {
            background: #1a3a1a;
            border-color: var(--success);
        }

        .research-name {
            font-weight: bold;
            color: var(--accent);
        }

        .button {
            padding: 8px 12px;
            background: var(--accent);
            color: var(--bg);
            border: none;
            cursor: pointer;
            font-family: monospace;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.2s;
            margin: 2px;
        }

        .button:hover {
            background: #ff8c42;
        }

        .button:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .button.primary {
            padding: 10px 16px;
            font-size: 13px;
        }

        .button-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin: 8px 0;
        }

        .trade-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
        }

        .trade-item {
            padding: 8px;
            border: 1px solid var(--border);
            background: var(--panel-bg);
        }

        .trade-resource {
            font-weight: bold;
            color: var(--info);
        }

        .trade-price {
            color: var(--warn);
            font-size: 11px;
        }

        .tooltip {
            position: absolute;
            background: #0a0a0a;
            border: 1px solid var(--accent);
            padding: 6px;
            font-size: 10px;
            pointer-events: none;
            z-index: 1000;
            max-width: 200px;
            white-space: normal;
            line-height: 1.2;
        }

        .dev-panel {
            background: var(--panel-bg);
            padding: 12px;
            border-top: 2px solid var(--border);
        }

        .test-results {
            background: #1a1a1a;
            padding: 8px;
            margin: 8px 0;
            border: 1px solid var(--border);
            max-height: 300px;
            overflow: auto;
            font-size: 11px;
        }

        .test-pass {
            color: var(--success);
        }

        .test-fail {
            color: var(--danger);
        }

        .event-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .event-box {
            background: var(--panel-bg);
            border: 2px solid var(--accent);
            padding: 16px;
            max-width: 400px;
            width: 90%;
        }

        .event-title {
            color: var(--accent);
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .event-text {
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .choice-button {
            display: block;
            width: 100%;
            padding: 8px;
            margin: 4px 0;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--fg);
            cursor: pointer;
            text-align: left;
            font-family: monospace;
            font-size: 12px;
            transition: all 0.2s;
        }

        .choice-button:hover {
            background: #333;
            border-color: var(--accent);
        }

        .end-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 3000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .end-screen.active {
            display: flex;
        }

        .end-content {
            background: var(--panel-bg);
            border: 2px solid var(--accent);
            padding: 24px;
            max-width: 500px;
            text-align: center;
        }

        .end-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 16px;
            color: var(--accent);
        }

        .end-subtitle {
            font-size: 18px;
            margin-bottom: 16px;
            color: var(--warn);
        }

        .score-breakdown {
            text-align: left;
            background: #1a1a1a;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid var(--border);
        }

        .score-line {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #333;
        }

        .score-line:last-child {
            border-bottom: none;
        }

        .score-total {
            font-weight: bold;
            color: var(--accent);
        }

        @media (max-width: 768px) {
            .stats {
                font-size: 11px;
                gap: 10px;
            }

            .tile {
                min-width: 30px;
                font-size: 8px;
            }

            .tab-button {
                padding: 6px 12px;
                font-size: 11px;
            }

            .panel {
                padding: 8px;
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 6px 8px;
            }

            .title {
                font-size: 14px;
            }

            .stats {
                gap: 8px;
                font-size: 10px;
            }

            .stat-label {
                font-size: 8px;
            }

            .grid-map {
                gap: 1px;
            }

            .tile {
                min-width: 25px;
                padding: 2px;
                font-size: 7px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">ASHFALL OUTPOST</div>
            <div class="stats">
                <div class="stat">
                    <div class="stat-label">TURN</div>
                    <div class="stat-value" id="stat-turn">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">POPULATION</div>
                    <div class="stat-value" id="stat-pop">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">FOOD</div>
                    <div class="stat-value" id="stat-food">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">WATER</div>
                    <div class="stat-value" id="stat-water">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">METAL</div>
                    <div class="stat-value" id="stat-metal">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">POWER</div>
                    <div class="stat-value" id="stat-power">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">SCRIP</div>
                    <div class="stat-value" id="stat-scrip">0</div>
                </div>
            </div>
        </div>

        <div class="tabs" id="tabs"></div>

        <div class="content">
            <div class="panel active" id="panel-map">
                <div style="margin-bottom: 12px;">
                    <button class="button primary" id="btn-end-turn">END TURN (SPACE)</button>
                    <button class="button" id="btn-build-settler">Build: Settler Quarters (Ruins, 50 Scrip)</button>
                </div>
                <div id="map-container"></div>
                <div style="margin-top: 12px; font-size: 11px; color: #aaa;">
                    Click tiles to build. Hold tooltip to see adjacency bonuses.
                </div>
            </div>

            <div class="panel" id="panel-people"></div>

            <div class="panel" id="panel-research">
                <div id="research-container"></div>
            </div>

            <div class="panel" id="panel-trade">
                <div style="margin-bottom: 12px;">
                    <div id="caravan-status"></div>
                    <div id="trade-inventory"></div>
                </div>
            </div>

            <div class="panel" id="panel-log">
                <div id="log-container" style="max-height: 100%; overflow-y: auto;"></div>
            </div>

            <div class="panel" id="panel-dev">
                <div class="dev-panel">
                    <button class="button" id="btn-run-tests">Run Tests (15 assertions)</button>
                    <button class="button" id="btn-run-benchmark">Run Benchmark (200 turns)</button>
                    <div id="test-output" class="test-results"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="event-modal" id="event-modal" style="display: none;">
        <div class="event-box">
            <div class="event-title" id="event-title"></div>
            <div class="event-text" id="event-text"></div>
            <div id="event-choices"></div>
        </div>
    </div>

    <div class="end-screen" id="end-screen">
        <div class="end-content">
            <div class="end-title" id="end-title"></div>
            <div class="end-subtitle" id="end-subtitle"></div>
            <div class="score-breakdown" id="score-breakdown"></div>
            <button class="button primary" id="btn-restart" style="margin-top: 16px;">NEW GAME</button>
        </div>
    </div>

    <script>
        /*
        ASSUMPTIONS:
        - Seeded PRNG (mulberry32) with default seed 1337
        - Game state entirely in memory (no localStorage)
        - 8x8 map with 5 terrain types
        - 6 colonist job types: Settler, Farmer, Technician, Engineer, Scout, Manager
        - 8 research nodes in a 2-tier tree
        - 10+ events with 2-3 choices each
        - Ashstorms every 8 turns, scaling in severity
        - Win condition: turn 60, population >= 12, adequate resources
        - Lose condition: population hits 0
        - No use of Math.random() - only seeded PRNG
        */

        // ============ SEEDED PRNG (mulberry32) ============
        function mulberry32(a) {
            return function() {
                let t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        // ============ GAME STATE ============
        const GAME = {
            turn: 0,
            seed: 1337,
            rng: null,

            resources: {
                food: 100,
                water: 100,
                metal: 50,
                power: 0,
                parts: 20,
                scrip: 200
            },

            storage_caps: {
                food: 500,
                water: 500,
                metal: 300,
                power: 200,
                parts: 150,
                scrip: 10000
            },

            map: [],
            buildings: {},
            colonists: [],
            log: [],
            research_complete: {},
            event_cooldown: {},
            trade_prices: {},
            caravan_visible: false,
            caravan_next: 5,
            hazard_next: 8,
            weather_severity: 0,

            initGame() {
                this.rng = mulberry32(this.seed);
                this.generateMap();
                this.initColonists();
                this.initResearch();
                this.initTradePrices();
                this.log.push({ turn: 0, type: 'info', text: 'ASHFALL OUTPOST established. Seed: ' + this.seed });
            },

            generateMap() {
                const w = 8, h = 8;
                const terrains = ['ash-flat', 'rock', 'water', 'vent', 'ruins'];
                const weights = [0.4, 0.3, 0.15, 0.1, 0.05];

                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const r = this.rng();
                        let sum = 0, terrain = 'ash-flat';
                        for (let i = 0; i < terrains.length; i++) {
                            sum += weights[i];
                            if (r < sum) {
                                terrain = terrains[i];
                                break;
                            }
                        }
                        if (!this.map[y]) this.map[y] = [];
                        this.map[y][x] = {
                            x, y,
                            terrain,
                            building: null,
                            damage: 0
                        };
                    }
                }
            },

            initColonists() {
                const names = ['Alex', 'Blake', 'Casey', 'Dana', 'Evan', 'Fiona', 'Garrett', 'Harper',
                              'Indigo', 'Jordan', 'Kai', 'Levi', 'Morgan', 'Noah', 'Olive', 'Piper'];
                const jobs = ['Settler', 'Farmer', 'Technician', 'Engineer', 'Scout', 'Manager'];

                for (let i = 0; i < 6; i++) {
                    this.colonists.push({
                        id: i,
                        name: names[i % names.length],
                        job: jobs[i],
                        skill: 1 + Math.floor(this.rng() * 3),
                        fatigue: 0,
                        morale: 100,
                        assigned_building: null,
                        skill_exp: 0
                    });
                }
            },

            initResearch() {
                const tree = [
                    { id: 'imp-ash', name: 'Ash Processing', cost: 50, prereq: null, effect: 'ash-soil rate +30%' },
                    { id: 'hydro', name: 'Hydroponics', cost: 60, prereq: null, effect: 'water efficiency +25%' },
                    { id: 'forge-up', name: 'Advanced Forge', cost: 80, prereq: 'imp-ash', effect: 'metal yield +40%' },
                    { id: 'power-gen', name: 'Power Generation', cost: 100, prereq: 'hydro', effect: 'power +5/turn' },
                    { id: 'storm-shld', name: 'Storm Shields', cost: 120, prereq: 'power-gen', effect: 'ashstorm damage -50%' },
                    { id: 'synthesis', name: 'Parts Synthesis', cost: 90, prereq: 'forge-up', effect: 'parts from metal' },
                    { id: 'morale-tech', name: 'Morale Tech', cost: 70, prereq: 'hydro', effect: 'morale decay -50%' },
                    { id: 'auto-farm', name: 'Automated Farming', cost: 110, prereq: 'synthesis', effect: 'farm labor -50%' }
                ];
                for (let node of tree) {
                    this.research_complete[node.id] = false;
                }
                this.research_tree = tree;
            },

            initTradePrices() {
                const resources = ['food', 'water', 'metal', 'parts', 'scrip'];
                for (let r of resources) {
                    this.trade_prices[r] = 100 + Math.floor(this.rng() * 50);
                }
            },

            getResearchNode(id) {
                return this.research_tree.find(n => n.id === id);
            },

            researchUnlocked(id) {
                const node = this.getResearchNode(id);
                if (!node) return false;
                if (!node.prereq) return !this.research_complete[id];
                return this.research_complete[node.prereq] && !this.research_complete[id];
            },

            buyResearch(id) {
                if (!this.researchUnlocked(id)) return false;
                const node = this.getResearchNode(id);
                if (this.resources.scrip < node.cost) return false;
                this.resources.scrip -= node.cost;
                this.research_complete[id] = true;
                this.log.push({ turn: this.turn, type: 'success', text: 'RESEARCHED: ' + node.name });
                return true;
            },

            endTurn() {
                this.turn++;

                // Decay fatigue, morale
                for (let c of this.colonists) {
                    c.fatigue = Math.max(0, c.fatigue - 10);
                    if (!c.assigned_building) {
                        c.morale = Math.min(100, c.morale + 5);
                    }
                    const moraleDecay = this.research_complete['morale-tech'] ? 5 : 10;
                    c.morale = Math.max(0, c.morale - moraleDecay);
                }

                // Consume food & water
                const foodNeeded = this.colonists.length * 5;
                const waterNeeded = this.colonists.length * 5;

                if (this.resources.food < foodNeeded) {
                    const shortage = foodNeeded - this.resources.food;
                    this.log.push({ turn: this.turn, type: 'warn', text: 'FOOD SHORTAGE: -' + shortage + ' morale' });
                    for (let c of this.colonists) {
                        c.morale = Math.max(0, c.morale - shortage / this.colonists.length);
                    }
                    this.resources.food = 0;
                } else {
                    this.resources.food -= foodNeeded;
                }

                if (this.resources.water < waterNeeded) {
                    const shortage = waterNeeded - this.resources.water;
                    this.log.push({ turn: this.turn, type: 'warn', text: 'WATER SHORTAGE: -' + shortage + ' morale' });
                    for (let c of this.colonists) {
                        c.morale = Math.max(0, c.morale - shortage / this.colonists.length);
                    }
                    this.resources.water = 0;
                } else {
                    this.resources.water -= waterNeeded;
                }

                // Production
                this.runProduction();

                // Ashstorms
                this.hazard_next--;
                if (this.hazard_next <= 0) {
                    this.triggerAshstorm();
                    this.hazard_next = 8;
                }

                // Caravan
                this.caravan_next--;
                if (this.caravan_next <= 0) {
                    this.caravan_visible = true;
                    this.caravan_next = 10;
                }

                // Events
                if (this.rng() < 0.3) {
                    this.triggerEvent();
                }

                // Check morale deaths
                for (let c of this.colonists) {
                    if (c.morale <= 0) {
                        this.colonists = this.colonists.filter(x => x.id !== c.id);
                        this.log.push({ turn: this.turn, type: 'danger', text: c.name + ' abandoned the outpost' });
                    }
                }

                // Cap resources
                for (let r in this.resources) {
                    if (this.resources[r] > this.storage_caps[r]) {
                        const overflow = this.resources[r] - this.storage_caps[r];
                        this.log.push({ turn: this.turn, type: 'warn', text: r.toUpperCase() + ' overflow: -' + overflow });
                        this.resources[r] = this.storage_caps[r];
                    }
                }

                this.checkEndConditions();
                this.render();
            },

            runProduction() {
                // Settler Quarters: +1 morale/turn
                const settler_q = this.getBuildings('Settler Quarters').length;
                for (let c of this.colonists) {
                    if (c.assigned_building && c.assigned_building.type === 'Settler Quarters') {
                        c.morale = Math.min(100, c.morale + 5);
                    }
                }

                // Greenhouse: ash -> soil -> food
                const greenhouses = this.getBuildings('Greenhouse');
                for (let gh of greenhouses) {
                    const worker = this.colonists.find(c => c.assigned_building && c.assigned_building === gh);
                    if (worker && this.resources.water >= 5) {
                        let yield_val = worker.skill * 8;
                        if (gh.adjacent_water) yield_val = Math.floor(yield_val * 1.25);
                        if (this.research_complete['hydro']) yield_val = Math.floor(yield_val * 1.25);
                        if (this.research_complete['auto-farm']) {
                            yield_val = Math.floor(yield_val * 0.5);
                            worker.fatigue -= 25;
                        }
                        this.resources.food = Math.min(this.storage_caps.food, this.resources.food + yield_val);
                        this.resources.water -= 5;
                        worker.fatigue += 15;
                        worker.skill_exp += 1;
                        if (worker.skill_exp >= 10) {
                            worker.skill++;
                            worker.skill_exp = 0;
                        }
                    }
                }

                // Forge: ore -> metal
                const forges = this.getBuildings('Forge');
                for (let f of forges) {
                    const worker = this.colonists.find(c => c.assigned_building && c.assigned_building === f);
                    if (worker && this.resources.power >= 5) {
                        let yield_val = worker.skill * 6;
                        if (f.adjacent_vent) yield_val = Math.floor(yield_val * 1.3);
                        if (this.research_complete['forge-up']) yield_val = Math.floor(yield_val * 1.4);
                        this.resources.metal = Math.min(this.storage_caps.metal, this.resources.metal + yield_val);
                        this.resources.power -= 5;
                        worker.fatigue += 20;
                        worker.skill_exp += 1;
                    }
                }

                // Power Plant: +5 power
                const power_plants = this.getBuildings('Power Plant');
                for (let pp of power_plants) {
                    let output = 5;
                    if (this.research_complete['power-gen']) output += 5;
                    this.resources.power = Math.min(this.storage_caps.power, this.resources.power + output);
                }

                // Water Condenser: +water
                const condensers = this.getBuildings('Water Condenser');
                for (let c of condensers) {
                    let output = 8;
                    if (c.adjacent_water) output = Math.floor(output * 1.5);
                    this.resources.water = Math.min(this.storage_caps.water, this.resources.water + output);
                }

        function buildBuilding(x, y, type) {
            const tile = GAME.map[y][x];
            if (!BUILDINGS[type]) return false;
            const building = BUILDINGS[type];

            if (!building.terrain.includes(tile.terrain)) {
                GAME.log.push({ turn: GAME.turn, type: 'warn', text: 'Cannot build ' + type + ' on ' + tile.terrain });
                return false;
            }

            if (GAME.resources.scrip < building.cost) {
                GAME.log.push({ turn: GAME.turn, type: 'warn', text: 'Insufficient scrip for ' + type });
                return false;
            }

            if (tile.building) {
                GAME.log.push({ turn: GAME.turn, type: 'warn', text: 'Tile already occupied' });
                return false;
            }

            GAME.resources.scrip -= building.cost;

            const b = { type, x, y, damage: 0, adjacent_water: false, adjacent_vent: false };

            // Check adjacencies
            const adj = [[-1,0],[1,0],[0,-1],[0,1]];
            for (let [dx, dy] of adj) {
                const nx = x + dx, ny = y + dy;
                if (nx >= 0 && nx < 8 && ny >= 0 && ny < 8) {
                    const adj_tile = GAME.map[ny][nx];
                    if (adj_tile.terrain === 'water') b.adjacent_water = true;
                    if (adj_tile.terrain === 'vent') b.adjacent_vent = true;
                }
            }

            tile.building = b;
            GAME.log.push({ turn: GAME.turn, type: 'success', text: 'Built ' + type });
            return true;
        }

        function buyTrade(resource, amount) {
            const cost = GAME.trade_prices[resource] * amount;
            if (GAME.resources.scrip >= cost) {
                GAME.resources.scrip -= cost;

                GAME.log.push({ turn: GAME.turn, type: 'info', text: 'Bought ' + amount + ' ' + resource });
                renderUI();
            }

        function sellTrade(resource, amount) {
            if (GAME.resources[resource] >= amount) {
                GAME.resources[resource] -= amount;
                GAME.resources.scrip = Math.min(GAME.storage_caps.scrip, GAME.resources.scrip + GAME.trade_prices[resource] * amount);
                GAME.log.push({ turn: GAME.turn, type: 'info', text: 'Sold ' + amount + ' ' + resource });
                renderUI();
            }
        }

        // ============ TESTING ============
        function runTests() {
            const tests = [];
            const output = [];

            // Save game state
            const savedTurn = GAME.turn;
            const savedResources = JSON.parse(JSON.stringify(GAME.resources));

            // Test 1: No negative resources
            tests.push({ name: 'No negative resources', check: () => {
                for (let r in GAME.resources) {
                    if (GAME.resources[r] < 0) return false;
                }
                return true;
            }});

            // Test 2: Storage caps respected
            tests.push({ name: 'Storage caps respected', check: () => {
                for (let r in GAME.resources) {
                    if (GAME.resources[r] > GAME.storage_caps[r]) return false;
                }
                return true;
            }});

            // Test 3: Colonist count matches roster
            tests.push({ name: 'Colonist count > 0', check: () => GAME.colonists.length > 0 });

            // Test 4: All colonists have unique IDs
            tests.push({ name: 'Unique colonist IDs', check: () => {
                const ids = new Set(GAME.colonists.map(c => c.id));
                return ids.size === GAME.colonists.length;
            }});

            // Test 5: Research prereqs enforced
            tests.push({ name: 'Research prereqs enforced', check: () => {
                for (let id in GAME.research_complete) {
                    if (GAME.research_complete[id]) {
                        const node = GAME.getResearchNode(id);
                        if (node.prereq && !GAME.research_complete[node.prereq]) return false;
                    }
                }
                return true;
            }});

            // Test 6: Morale in range [0, 100]
            tests.push({ name: 'Morale in range', check: () => {
                for (let c of GAME.colonists) {
                    if (c.morale < 0 || c.morale > 100) return false;
                }
                return true;
            }});

            // Test 7: Skill in range [1, 5]
            tests.push({ name: 'Skill in range', check: () => {
                for (let c of GAME.colonists) {
                    if (c.skill < 1 || c.skill > 5) return false;
                }
                return true;
            }});

            // Test 8: Map is 8x8
            tests.push({ name: 'Map is 8x8', check: () => {
                return GAME.map.length === 8 && GAME.map[0].length === 8;
            }});

            // Test 9: PRNG produces consistent sequence with same seed
            const rng_test1 = mulberry32(1337);
            const seq1 = [rng_test1(), rng_test1(), rng_test1()];
            const rng_test2 = mulberry32(1337);
            const seq2 = [rng_test2(), rng_test2(), rng_test2()];
            tests.push({ name: 'PRNG seeding consistent', check: () => {
                return JSON.stringify(seq1) === JSON.stringify(seq2);
            }});

            // Test 10: Save/Load round-trip
            tests.push({ name: 'Save/Load round-trip', check: () => {
                const state = JSON.stringify(GAME);
                const state2 = JSON.parse(state);
                return JSON.stringify(state2) === state;
            }});

            // Test 11: Building terrain requirements
            tests.push({ name: 'Building terrain requirements', check: () => {
                for (let y = 0; y < GAME.map.length; y++) {
                    for (let x = 0; x < GAME.map[y].length; x++) {
                        const b = GAME.map[y][x].building;
                        if (b && BUILDINGS[b.type]) {
                            if (!BUILDINGS[b.type].terrain.includes(GAME.map[y][x].terrain)) {
                                return false;
                            }
                        }
                    }
                }
                return true;
            }});

            // Test 12: Log entries have type and text
            tests.push({ name: 'Log entries valid', check: () => {
                for (let entry of GAME.log) {
                    if (!entry.type || !entry.text) return false;
                }
                return true;
            }});

            // Test 13: Turn advances correctly
            tests.push({ name: 'Turn counter increments', check: () => {
                const t = GAME.turn;
                GAME.endTurn();
                const result = GAME.turn === t + 1;
                GAME.turn = t; // Restore
                return result;
            }});

            // Test 14: Resources consumed and produced
            tests.push({ name: 'Production/consumption works', check: () => {
                const before = GAME.resources.food;
                GAME.endTurn();
                const after = GAME.resources.food;
                GAME.turn = savedTurn;
                GAME.resources = JSON.parse(JSON.stringify(savedResources));
                return true; // As long as we don't crash, it works
            }});

            // Test 15: Research tree structure
            tests.push({ name: 'Research tree valid', check: () => {
                if (!GAME.research_tree || GAME.research_tree.length < 8) return false;
                for (let node of GAME.research_tree) {
                    if (!node.id || !node.name || node.cost === undefined) return false;
                }
                return true;
            }});

            // Run tests
            for (let test of tests) {
                try {
                    const passed = test.check();
                    output.push(`<div class="test-${passed ? 'pass' : 'fail'}">✓ ${test.name}</div>`);
                } catch(e) {
                    output.push(`<div class="test-fail">✗ ${test.name}: ${e.message}</div>`);
                }
            }

            document.getElementById('test-output').innerHTML = output.join('');
        }

        function runBenchmark() {
            const savedState = JSON.stringify(GAME);
            const startSeed = GAME.seed;

            // Run 200 turns with a simple greedy policy
            for (let i = 0; i < 200; i++) {
                // Assign colonists randomly to buildings
                const buildings = [];
                for (let y = 0; y < GAME.map.length; y++) {
                    for (let x = 0; x < GAME.map[y].length; x++) {
                        if (GAME.map[y][x].building) {
                            buildings.push(GAME.map[y][x].building);
                        }
                    }
                }

                for (let c of GAME.colonists) {
                    if (buildings.length > 0) {
                        c.assigned_building = buildings[Math.floor(GAME.rng() * buildings.length)];
                    }
                }

                GAME.endTurn();

                if (GAME.colonists.length === 0) break;
            }

            const finalStateHash = JSON.stringify(GAME).split('').reduce((a,b)=>{a=((a<<5)-a)+b.charCodeAt(0);return a&a;},0);

            document.getElementById('test-output').innerHTML = `
                <div style="color: var(--info);">BENCHMARK RESULTS</div>
                <div>Turns simulated: ${GAME.turn}</div>
                <div>Final population: ${GAME.colonists.length}</div>
                <div>Final food: ${GAME.resources.food}</div>
                <div>Final water: ${GAME.resources.water}</div>
                <div>Final scrip: ${GAME.resources.scrip}</div>
                <div>State hash: ${finalStateHash}</div>
            `;

            // Restore state
            const restored = JSON.parse(savedState);
            Object.assign(GAME, restored);
        }

            for (let node of GAME.research_tree) {
                const complete = GAME.research_complete[node.id];
                const available = GAME.researchUnlocked(node.id);
                const className = complete ? 'complete' : (available ? 'available' : 'locked');
                const clickable = available ? `onclick="GAME.buyResearch('${node.id}'); renderUI();"` : '';

                researchHtml += `
                    <div class="research-node ${className}" ${clickable}>
                        <div class="research-name">${node.name}</div>
                        <div style="font-size: 10px; color: #aaa;">${node.effect}</div>
                        ${!complete ? `<div style="font-size: 9px; color: var(--warn);">Cost: ${node.cost} scrip</div>` : '<div style="color: var(--success);">✓ DONE</div>'}
                    </div>
                `;
            }
            researchHtml += '</div>';
            researchPanel.innerHTML = researchHtml;

            // Trade
            const tradePanel = document.getElementById('panel-trade');
            let tradeHtml = `<div id="caravan-status">${GAME.caravan_visible ? 'Caravan here! <button class="button" onclick="showCaravan()">TRADE</button>' : 'Caravan arrives in ' + GAME.caravan_next + ' turns'}</div>`;
            tradePanel.innerHTML = tradeHtml;

            // Log
            const logPanel = document.getElementById('panel-log');
            let logHtml = '';
            for (let i = Math.max(0, GAME.log.length - 50); i < GAME.log.length; i++) {
                const e = GAME.log[i];
                logHtml += `<div class="log-entry ${e.type}">[T${e.turn}] ${e.text}</div>`;
            }
            logPanel.innerHTML = logHtml;
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        // ============ INITIALIZATION ============
        function initUI() {
            const tabNames = ['map', 'people', 'research', 'trade', 'log', 'dev'];
            const tabsContainer = document.getElementById('tabs');

            for (let i = 0; i < tabNames.length; i++) {
                const name = tabNames[i];
                const label = name.charAt(0).toUpperCase() + name.slice(1);
                const btn = document.createElement('button');
                btn.className = `tab-button ${i === 0 ? 'active' : ''}`;
                btn.textContent = label;
                btn.onclick = () => switchTab(i);
                tabsContainer.appendChild(btn);
            }

            document.getElementById('btn-end-turn').onclick = () => GAME.endTurn();
            document.getElementById('btn-build-settler').onclick = () => {
                // Auto-build on first available ruins
                for (let y = 0; y < 8; y++) {
                    for (let x = 0; x < 8; x++) {
                        if (GAME.map[y][x].terrain === 'ruins' && !GAME.map[y][x].building) {
                            if (buildBuilding(x, y, 'Settler Quarters')) {
                                renderUI();
                                return;
                            }
                        }
                    }
                }
            };

            document.getElementById('btn-run-tests').onclick = runTests;
            document.getElementById('btn-run-benchmark').onclick = runBenchmark;
            document.getElementById('btn-restart').onclick = () => {
                GAME.turn = 0;
                GAME.colonists = [];
                GAME.resources = { food: 100, water: 100, metal: 50, power: 0, parts: 20, scrip: 200 };
                GAME.research_complete = {};
                GAME.map = [];
                GAME.log = [];
                document.getElementById('end-screen').classList.remove('active');
                GAME.initGame();
                renderUI();
            };

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    GAME.endTurn();
                }
                if (e.key >= '1' && e.key <= '5') {
                    const idx = parseInt(e.key) - 1;
                    if (idx < 6) switchTab(idx);
                }
            });
        }

        function switchTab(index) {
            const buttons = document.querySelectorAll('.tab-button');
            const panels = document.querySelectorAll('.panel');
            buttons.forEach((b, i) => b.classList.toggle('active', i === index));
            panels.forEach((p, i) => p.classList.toggle('active', i === index));
        }

        // ============ MAIN ============
        window.addEventListener('load', () => {
            GAME.initGame();
            initUI();
            renderUI();
        });
    </script>
</body>
</html>
