function runTests(){
  const out = []; let pass = 0, fail = 0;
  const t = (name, fn) => {
    let r;
    try { r = fn(); } catch(e){ r = "threw: " + e.message; }
    if (r === true || r === undefined){ out.push("PASS  " + name); pass++; }
    else { out.push("FAIL  " + name + "\n        -> " + r); fail++; }
  };
  const need = (cond, msg) => cond === true ? true : msg;

  const S25 = simulate(1337, 25);

  t("1. No resource is ever negative after 25 simulated turns", () => {
    for (const k of RES) if (!(S25.res[k] >= 0)) return k + " = " + S25.res[k];
    return true;
  });
  t("2. Every resource respects its storage cap", () => {
    for (const k of RES) if (S25.res[k] > capOf(S25,k) + 1e-9) return k + " = " + S25.res[k] + " > cap " + capOf(S25,k);
    return true;
  });
  t("3. Colonist count matches the roster and ids are unique", () => {
    const ids = new Set(S25.col.map(c => c.id));
    if (ids.size !== S25.col.length) return "duplicate colonist ids";
    if (pop(S25) !== S25.col.length) return "pop() disagrees with roster length";
    return need(digest(S25).col.length === S25.col.length, "digest roster length mismatch");
  });
  t("4. No building is over-crewed and no colonist works an empty tile", () => {
    for (const c of S25.col){
      if (c.at === -1) continue;
      if (c.at < 0 || c.at >= TILES) return c.name + " assigned out of range";
      if (!S25.map[c.at].b) return c.name + " assigned to empty tile " + coord(c.at);
    }
    for (let i = 0; i < TILES; i++){
      const b = S25.map[i].b; if (!b || !BLD[b].job) continue;
      if (slotsUsed(S25,i) > BLD[b].slots) return coord(i) + " has " + slotsUsed(S25,i) + " of " + BLD[b].slots + " slots";
    }
    return true;
  });
  t("5. Research prerequisites are enforced", () => {
    const g = newGame(1337); g.res.scrip = 999; g.res.parts = 99;
    const r = doResearch(g,"automation");
    if (r.ok) return "bought Automation without Fabrication or a Lab";
    if (has(g,"automation")) return "node was added despite failure";
    return need(researchState(g,"automation").s === "locked", "state should be locked");
  });
  t("6. Tier-2 research requires a built Lab, and cost is deducted exactly", () => {
    const g = newGame(1337); g.res.scrip = 200; g.res.parts = 60;
    doResearch(g,"metallurgy");
    if (doResearch(g,"fabrication").ok) return "bought a tier-2 node with no Lab built";
    const i = bestTileFor(g,"lab"); if (i < 0) return "no legal lab tile on seed 1337";
    g.map[i].b = "lab"; g.map[i].hp = 100;
    const before = { s:g.res.scrip, p:g.res.parts }, cost = researchCost(g,"fabrication");
    if (!doResearch(g,"fabrication").ok) return "still blocked after building a Lab";
    if (r2(before.s - cost.scrip) !== g.res.scrip) return "scrip not deducted exactly";
    return need(r2(before.p - cost.parts) === g.res.parts, "parts not deducted exactly");
  });
  t("7. Save/load round-trips to an identical state hash", () => {
    const a = simulate(2024, 12);
    const res = loadText(saveText(a));
    if (!res.ok) return "load failed: " + res.err;
    if (stateHash(res.G) !== stateHash(a)) return "hash mismatch " + stateHash(res.G) + " vs " + stateHash(a);
    return need(canon(digest(res.G)) === canon(digest(a)), "canonical digests differ");
  });
  t("8. Loading malformed JSON is rejected with a message", () => {
    const r = loadText("{not json,,,");
    return need(r.ok === false && typeof r.err === "string" && r.err.length > 0, "bad JSON was accepted");
  });
  t("9. Loading structurally wrong JSON is rejected", () => {
    if (loadText(JSON.stringify({ v:VERSION })).ok) return "object missing every field was accepted";
    if (loadText(JSON.stringify([1,2,3])).ok) return "array was accepted";
    const g = JSON.parse(saveText(newGame(7))); g.res.food = -5;
    if (loadText(JSON.stringify(g)).ok) return "negative resource was accepted";
    const g2 = JSON.parse(saveText(newGame(7))); g2.map[0].t = "lava";
    if (loadText(JSON.stringify(g2)).ok) return "unknown terrain was accepted";
    const g3 = JSON.parse(saveText(newGame(7))); g3.research = ["teleportation"];
    return need(loadText(JSON.stringify(g3)).ok === false, "unknown research node was accepted");
  });
  t("10. Same seed reproduces the same map and the same 10-turn history", () => {
    const a = newGame(4242), b = newGame(4242);
    if (fnv(canon(a.map)) !== fnv(canon(b.map))) return "map differs";
    return need(stateHash(simulate(4242,10)) === stateHash(simulate(4242,10)), "10-turn hashes differ");
  });
  t("11. Different seeds produce different terrain", () => {
    const a = newGame(1337).map.map(x => x.t).join(""), b = newGame(90210).map.map(x => x.t).join("");
    return need(a !== b, "seeds 1337 and 90210 produced identical terrain");
  });
  t("12. Terrain requirements block illegal builds", () => {
    const g = newGame(1337); g.res.metal = 999; g.res.parts = 999;
    const w = g.map.findIndex(x => x.t === "water");
    if (w < 0) return "seed produced no water";
    if (canBuild(g,w,"green").ok) return "Greenhouse allowed on water";
    if (doBuild(g,w,"green").ok) return "build on water succeeded";
    const v = g.map.findIndex(x => x.t === "vent" && !x.b);
    return need(v < 0 || canBuild(g,v,"scraper").ok === false, "Ash Scraper allowed on a vent");
  });
  t("13. Adjacency bonus measurably raises output", () => {
    const g = newGame(1337);
    let near = -1, far = -1;
    for (let i = 0; i < TILES; i++){
      if (BLD.condenser.terr.indexOf(g.map[i].t) < 0) continue;
      if (countAdj(g,i,"water") > 0 && near < 0) near = i;
      if (countAdj(g,i,"water") === 0 && far < 0) far = i;
    }
    if (near < 0 || far < 0) return "could not find both a water-adjacent and an inland tile";
    const mNear = adjInfo(g,near,"condenser").mult, mFar = adjInfo(g,far,"condenser").mult;
    if (!(mNear > mFar)) return "adjacency multiplier " + mNear + " not greater than " + mFar;
    g.map[near].b = "condenser"; g.map[far].b = "condenser";
    g.col[0].at = near; g.col[1].at = far; g.col[0].job = g.col[1].job = "tech";
    g.col[0].skill = g.col[1].skill = 3; g.col[0].fat = g.col[1].fat = 0; g.col[0].mor = g.col[1].mor = 70;
    const plan = productionPlan(g);
    const a = plan.items.find(x => x.i === near).out.water, b = plan.items.find(x => x.i === far).out.water;
    return need(a > b, "projected water " + a + " not greater than " + b);
  });
  t("14. Overflow above the storage cap is discarded and logged", () => {
    const g = newGame(1337), cap = capOf(g,"ash"), rep = [];
    g.res.ash = cap;
    const got = gain(g,"ash",10,"test",rep);
    if (g.res.ash !== cap) return "stock moved past the cap to " + g.res.ash;
    if (got !== 0) return "gain reported " + got + " accepted";
    return need(rep.some(r => /Overflow/.test(r.m)), "overflow was not logged");
  });
  t("15. Ashstorms damage buildings and integrity stays within 0-100", () => {
    const g = newGame(1337);
    g.turn = g.stormEvery * 3;
    const before = g.map.map(x => x.hp), rep = [];
    doWeather(g, rep);
    let dropped = false;
    for (let i = 0; i < TILES; i++){
      if (g.map[i].hp < 0 || g.map[i].hp > 100) return "integrity out of range at " + coord(i);
      if (g.map[i].b && g.map[i].hp < before[i]) dropped = true;
    }
    if (!dropped) return "no building took damage";
    if (!(g.waterSpike > 1)) return "storm did not raise water demand";
    return need(rep.some(r => r.k === "storm"), "storm was not reported");
  });
  t("16. Mitigation research reduces storm damage", () => {
    const dmgFor = (extra) => {
      const g = newGame(1337); g.turn = g.stormEvery * 4;
      for (const k of extra) g.research.push(k);
      const i0 = bestTileFor(g,"wind"); if (i0 >= 0) g.map[i0].b = "wind";
      const before = g.map.reduce((s,x) => s + (x.b ? x.hp : 0), 0);
      doWeather(g, []);
      return r2(before - g.map.reduce((s,x) => s + (x.b ? x.hp : 0), 0));
    };
    const plain = dmgFor([]), armored = dmgFor(["shelter","forecast","lattice"]);
    return need(armored < plain, "damage " + armored + " with mitigation was not below " + plain);
  });
  t("17. Repairs cost parts and labour, and fail without them", () => {
    const g = newGame(1337);
    const i = g.map.findIndex(x => x.b);
    g.map[i].hp = 40; g.res.parts = 0; g.labor = 3;
    if (repair(g,i).ok) return "repaired with no parts";
    g.res.parts = 5; g.labor = 0;
    if (repair(g,i).ok) return "repaired with no labour";
    g.labor = 2;
    const before = g.res.parts, r = repair(g,i);
    if (!r.ok) return "repair failed: " + r.err;
    if (g.res.parts !== r2(before - 2)) return "parts not charged";
    if (g.labor !== 1) return "labour not consumed";
    return need(g.map[i].hp === 75, "integrity is " + g.map[i].hp + ", expected 75");
  });
  t("18. A colonist at zero morale produces nothing and leaves after 3 turns", () => {
    const g = newGame(1337), c = g.col[0];
    c.mor = 0;
    const i = g.map.findIndex(x => x.b && BLD[x.b].job);
    if (colEff(g,c,g.map[i].b).eff !== 0) return "broken colonist still produces";
    const start = pop(g);
    for (let n = 0; n < 3; n++){ c.mor = 0; doAttrition(g, []); }
    return need(pop(g) === start - 1, "colonist did not leave after 3 turns at zero morale");
  });
  t("19. Skill grows with use, is clamped to 1-5, and raises output", () => {
    const g = newGame(1337);
    const i = g.map.findIndex(x => x.b && BLD[x.b].job);
    const c = g.col[0];
    c.job = BLD[g.map[i].b].job; c.skill = 1; c.prog = 0; c.at = i;
    const e0 = colEff(g,c,g.map[i].b).eff;
    for (let n = 0; n < 40; n++){ c.fat = 0; c.mor = 80; doWellbeing(g, []); }
    if (!(c.skill > 1)) return "skill never grew";
    if (c.skill > 5) return "skill exceeded 5";
    for (const x of g.col) if (x.skill < 1 || x.skill > 5) return "a colonist is outside skill 1-5";
    c.fat = 0; c.mor = 80;
    return need(colEff(g,c,g.map[i].b).eff > e0, "higher skill did not raise effectiveness");
  });
  t("20. Population can never exceed housing via the refugee event", () => {
    const g = newGame(1337);
    while (pop(g) < housing(g)) g.col.push(makeColonist(g,"digger"));
    const before = pop(g);
    EVENTBYKEY.refugees.choices[0].apply(g);
    if (pop(g) !== before) return "roster grew past housing " + housing(g);
    return need(pop(g) <= housing(g), "population " + pop(g) + " over housing " + housing(g));
  });
  t("21. Trading moves scrip, stock and caravan purse consistently, and is bounded", () => {
    const g = newGame(1337);
    g.caravan = { stay:3, stock:{ food:10, water:10, metal:10, parts:10, ore:10, ash:10, soil:10 }, scrip:100 };
    g.res.scrip = 100; g.res.food = 0;
    if (tradeBuy(g,"food",99).ok) return "bought more than the caravan stocked";
    const price = priceOf(g,"food").buy, r = tradeBuy(g,"food",4);
    if (!r.ok) return "legal buy failed: " + r.err;
    if (g.res.food !== 4) return "goods not delivered";
    if (g.res.scrip !== r2(100 - price*4)) return "scrip not charged correctly";
    if (g.caravan.stock.food !== 6) return "caravan stock not reduced";
    g.res.metal = 5;
    if (tradeSell(g,"metal",50).ok) return "sold more metal than held";
    const sp = priceOf(g,"metal").sell, before = g.res.scrip;
    if (!tradeSell(g,"metal",5).ok) return "legal sale failed";
    if (g.res.metal !== 0) return "goods not handed over";
    if (g.res.scrip !== r2(before + sp*5)) return "sale proceeds wrong";
    return need(priceOf(g,"metal").buy > priceOf(g,"metal").sell, "buy price is not above sell price");
  });
  t("22. Prices react to stockpiles and stay inside the market band", () => {
    const g = newGame(1337);
    g.res.metal = 0; const low = priceOf(g,"metal");
    g.res.metal = capOf(g,"metal"); const high = priceOf(g,"metal");
    if (!(low.buy > high.buy)) return "buy price did not fall as stores filled";
    if (!(low.sell > high.sell)) return "sell price did not fall as stores filled";
    for (let n = 0; n < 200; n++) doTrade(g, []);
    for (const k of TRADABLE) if (g.market[k] < .6 - 1e-9 || g.market[k] > 1.6 + 1e-9) return k + " index drifted to " + g.market[k];
    return true;
  });
  t("23. A research unlock measurably increases production", () => {
    const mk = (withNode) => {
      const g = newGame(1337);
      const i = bestTileFor(g,"condenser");
      g.map[i].b = "condenser"; g.map[i].hp = 100;
      const c = g.col[0]; c.job = "tech"; c.skill = 3; c.fat = 0; c.mor = 80; c.at = i;
      for (const o of g.col) if (o !== c) o.at = -1;
      if (withNode) g.research.push("hydro");
      return productionPlan(g).items.find(x => x.i === i).out.water;
    };
    const base = mk(false), boosted = mk(true);
    return need(boosted > base, "Hydrology Basics gave " + boosted + " vs base " + base);
  });
  t("24. Benchmark policy is deterministic over 40 turns", () => {
    const a = stateHash(simulate(555,40)), b = stateHash(simulate(555,40));
    return need(a === b, a + " vs " + b);
  });
  t("25. All randomness comes from the seeded PRNG (page source check)", () => {
    const needle = "Math" + String.fromCharCode(46) + "random";
    const n = document.documentElement.outerHTML.split(needle).length - 1;
    return need(n === 0, "found " + n + " use(s) of the built-in generator");
  });

  UI.devOut = "TEST RESULTS  " + pass + " passed, " + fail + " failed\n" +
    "----------------------------------------------------------\n" + out.join("\n");
  render();
}

function runBenchmark(){
  const seed = G.seed, T0 = performance.now();
  const a = simulate(seed, 200);
  const t1 = performance.now() - T0;
  const b = simulate(seed, 200);
  const ha = stateHash(a), hb = stateHash(b);
  const jobs = {}; for (const c of a.col) jobs[c.job] = (jobs[c.job] || 0) + 1;
  const blds = {}; for (const t of a.map) if (t.b) blds[t.b] = (blds[t.b] || 0) + 1;
  UI.devOut =
    "BENCHMARK  200 headless turns, seed " + seed + ", built-in greedy policy\n" +
    "----------------------------------------------------------\n" +
    "STATE HASH (run 1) : " + ha + "\n" +
    "STATE HASH (run 2) : " + hb + "\n" +
    "DETERMINISTIC      : " + (ha === hb ? "YES - identical" : "NO - MISMATCH") + "\n" +
    "elapsed (run 1)    : " + t1.toFixed(1) + " ms\n" +
    "----------------------------------------------------------\n" +
    "turns simulated    : " + a.turn + "\n" +
    "population         : " + pop(a) + " / housing " + housing(a) + "\n" +
    "average morale     : " + avgMorale(a) + "\n" +
    "average fatigue    : " + (a.col.length ? r2(a.col.reduce((s,c) => s + c.fat, 0) / a.col.length) : 0) + "\n" +
    "average skill      : " + (a.col.length ? r2(a.col.reduce((s,c) => s + c.skill, 0) / a.col.length) : 0) + "\n" +
    "jobs               : " + (Object.keys(jobs).map(k => JOBS[k].n + " " + jobs[k]).join(", ") || "none") + "\n" +
    "research completed : " + a.research.length + "/" + RESKEYS.length + " [" + a.research.join(", ") + "]\n" +
    "buildings          : " + Object.keys(blds).map(k => BLD[k].n + " x" + blds[k]).join(", ") + "\n" +
    "storms weathered   : " + a.stormsSeen + "\n" +
    "clean-need streak  : " + a.needStreak + "\n" +
    "stockpiles         : " + RES.map(k => RESINFO[k].n + " " + fmt(a.res[k])).join(", ") + "\n" +
    "score              : " + scoreOf(a).total + "\n" +
    "log entries        : " + a.log.length;
  render();
}

function renderDev(){
  let h = '<div class="card"><div class="spread"><h3>DEV &amp; VERIFICATION</h3><div class="row">' +
    '<button id="testbtn" ' + tipAttr("Run 25 assertions over real game invariants.") + '>Run Tests</button>' +
    '<button id="benchbtn" ' + tipAttr("Simulate 200 turns headlessly from the current seed with the built-in greedy policy, twice, and compare the state hashes.") + '>Run Benchmark</button>' +
    '<button id="stephbtn" ' + tipAttr("Apply one turn of the greedy policy to the live game: repair, build, research, trade, assign, then end the turn.") + '>Auto-play 1 turn</button>' +
    '</div></div>' +
    '<div class="tiny muted">Current state hash: <b>' + stateHash(G) + '</b> &middot; seed ' + G.seed + ' &middot; turn ' + G.turn + '</div></div>';
  if (UI.devOut) h += '<div class="card"><div class="pre">' + esc(UI.devOut) + '</div></div>';

  h += '<div class="card"><h3>SAVE / LOAD</h3>' +
    '<div class="tiny muted">Nothing is written to your browser. Copy the text below to keep a save; paste one back and press Load.</div>' +
    '<div class="row" style="margin:5px 0"><button id="savebtn">Serialise current game</button>' +
    '<button id="loadbtn">Load from textarea</button><button id="copybtn">Select all</button></div>' +
    (UI.saveMsg ? '<div class="tiny ' + (UI.saveOk ? "good" : "bad") + '">' + esc(UI.saveMsg) + '</div>' : "") +
    '<textarea id="savebox" spellcheck="false" placeholder="Press Serialise, or paste a saved game here and press Load.">' + esc(UI.saveText || "") + '</textarea></div>';

  h += '<div class="card"><h3 class="tiny acc">TURN ORDER (as executed)</h3><div class="tiny muted">' +
    ["1 bookkeeping (cooldowns, labour pool, flag timers)","2 weather (ashstorm, damage, water spike)",
     "3 labour (effectiveness from skill, speciality, fatigue, morale, integrity)","4 power generation",
     "5 extraction (scrapers, mines, condensers, pumps, salvage, labs)","6 processing I (compost, forges)",
     "7 processing II (workshops, greenhouses)","8 storage (power leak, caps, overflow)",
     "9 needs (food and water consumption)","10 wellbeing (morale, fatigue, skill)",
     "11 attrition and arrivals","12 trade (market drift, caravan)","13 events","14 endgame check"]
     .map(s => "&bull; " + s).join("<br>") + '</div></div>';
  $("panel-dev").innerHTML = h;
}

/* every panel root is a permanent element, so its listeners are wired exactly
   once at boot; re-attaching them per render would fire a click N times over. */
function wireEvents(){
  $("panel-map").addEventListener("click", e => {
    const bt = e.target.closest("button");
    if (bt){
      if (bt.hasAttribute("data-build")) act(doBuild(G, UI.sel, bt.getAttribute("data-build")));
      else if (bt.hasAttribute("data-unassign")){ assign(G, +bt.getAttribute("data-unassign"), -1); render(); }
      else if (bt.id === "assignbtn") act(assign(G, +$("assignsel").value, UI.sel));
      else if (bt.id === "repairbtn") act(repair(G, UI.sel));
      else if (bt.id === "demobtn") act(doDemolish(G, UI.sel));
      return;
    }
    const el = e.target.closest("[data-tile]");
    if (el){ UI.sel = +el.getAttribute("data-tile"); render(); }
  });
  $("panel-map").addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const el = e.target.closest("[data-tile]"); if (!el) return;
    e.preventDefault(); e.stopPropagation();
    UI.sel = +el.getAttribute("data-tile"); render();
  });

  $("panel-people").addEventListener("change", ev => {
    const s = ev.target.closest("[data-col]"); if (!s) return;
    act(assign(G, +s.getAttribute("data-col"), +s.value));
  });
  $("panel-people").addEventListener("click", ev => {
    const b = ev.target.closest("button"); if (!b) return;
    if (b.id === "autoassign"){ policyAssign(G); flash("Crew auto-assigned by the greedy policy."); render(); }
    if (b.id === "restall"){ for (const c of G.col) c.at = -1; render(); }
  });

  $("panel-research").addEventListener("click", e => {
    const b = e.target.closest("[data-res]"); if (!b) return;
    act(doResearch(G, b.getAttribute("data-res")));
  });

  $("panel-trade").addEventListener("input", e => {
    const el = e.target.closest("[data-qty]"); if (!el) return;
    UI.tradeQty[el.getAttribute("data-qty")] = el.value;
  });
  $("panel-trade").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const buy = b.getAttribute("data-buy"), sell = b.getAttribute("data-sell");
    const k = buy || sell; if (!k) return;
    const qty = parseInt(UI.tradeQty[k] === undefined ? 5 : UI.tradeQty[k], 10);
    act(buy ? tradeBuy(G,k,qty) : tradeSell(G,k,qty));
  });

  $("panel-log").addEventListener("click", e => {
    const b = e.target.closest("[data-lf]"); if (!b) return;
    UI.logFilter = b.getAttribute("data-lf"); render();
  });

  $("panel-dev").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "testbtn") runTests();
    else if (b.id === "benchbtn") runBenchmark();
    else if (b.id === "stephbtn"){
      if (G.pending){ flash("Resolve the pending decision first."); return; }
      if (G.over && !G.sandbox){ flash("The game is over. Start a new one."); return; }
      policyTurn(G); afterTurn();
    }
    else if (b.id === "savebtn"){ UI.saveText = saveText(G); UI.saveOk = true;
      UI.saveMsg = "Serialised " + UI.saveText.length + " characters. Hash " + stateHash(G) + "."; render(); }
    else if (b.id === "loadbtn"){
      const txt = $("savebox").value;
      const r = loadText(txt);
      if (!r.ok){ UI.saveOk = false; UI.saveMsg = "LOAD FAILED: " + r.err; render(); return; }
      G = r.G; UI.sel = -1; UI.saveOk = true;
      UI.saveMsg = "Loaded turn " + G.turn + ", seed " + G.seed + ", hash " + stateHash(G) + ".";
      $("seedin").value = G.seed;
      render();
    }
    else if (b.id === "copybtn"){ const ta = $("savebox"); ta.focus(); ta.select(); }
  });
  $("panel-dev").addEventListener("input", e => { if (e.target.id === "savebox") UI.saveText = e.target.value; });
}
/* =============================================================================
   SECTION 14 - MODALS, RENDER LOOP, INPUT, BOOT
   ========================================================================== */
function renderModal(){
  const host = $("modalhost");
  if (G.pending){
    const ev = EVENTBYKEY[G.pending.key];
    host.innerHTML = '<div class="ovl"><div class="modal" role="dialog" aria-modal="true">' +
      '<h3 class="acc">EVENT &middot; ' + esc(ev.n) + '</h3>' +
      '<div class="tiny" style="margin:6px 0">' + esc(ev.text) + '</div>' +
      '<div class="tiny muted">Turn ' + G.turn + '. This decision changes the outpost state; there is no neutral option.</div>' +
      ev.choices.map((c,i) => '<button class="choice" data-choice="' + i + '"><b>' + esc(c.label) + '</b>' +
        '<div class="tiny muted">' + esc(c.hint) + '</div></button>').join("") +
      '</div></div>';
    host.querySelector(".modal").addEventListener("click", e => {
      const b = e.target.closest("[data-choice]"); if (!b) return;
      resolvePending(G, +b.getAttribute("data-choice"));
      finishTurn(G);
      render();
    });
    const first = host.querySelector("[data-choice]"); if (first) first.focus();
    return;
  }
  if (G.over && !UI.dismissed){
    const s = scoreOf(G);
    const title = G.outcome === "win" ? "VICTORY" : G.outcome === "defeat" ? "OUTPOST LOST" : "SURVIVED, BUT NOT SECURED";
    const blurb = G.outcome === "win"
      ? "Turn " + G.turn + ". " + pop(G) + " colonists, fed and watered, with the storms accounted for. The ash keeps falling; the outpost keeps standing."
      : G.outcome === "defeat"
      ? "The last colonist is gone by turn " + G.turn + ". The wind will have the buildings inside a season."
      : "You reached turn " + WIN_TURN + " with " + pop(G) + " colonists (needed " + WIN_POP + ") and a clean-needs streak of " + G.needStreak + " (needed 3).";
    host.innerHTML = '<div class="ovl"><div class="modal" role="dialog" aria-modal="true">' +
      '<h3 class="' + (G.outcome === "win" ? "good" : G.outcome === "defeat" ? "bad" : "warn") + '">' + title + '</h3>' +
      '<div class="tiny" style="margin:6px 0">' + esc(blurb) + '</div>' +
      '<table><tbody>' +
      '<tr><td>Population ' + pop(G) + ' x40</td><td>' + s.pop + '</td></tr>' +
      '<tr><td>Research ' + G.research.length + '/' + RESKEYS.length + ' x70</td><td>' + s.research + '</td></tr>' +
      '<tr><td>Stockpiles (food, water, metal, parts, scrip)</td><td>' + s.stock + '</td></tr>' +
      '<tr><td>Turns survived ' + G.turn + ' x6</td><td>' + s.turns + '</td></tr>' +
      '<tr><td>Victory bonus</td><td>' + s.winBonus + '</td></tr>' +
      '<tr><td><b>FINAL SCORE</b></td><td><b>' + s.total + '</b></td></tr>' +
      '</tbody></table>' +
      '<div class="tiny muted" style="margin-top:6px">Storms weathered: ' + G.stormsSeen +
        ' &middot; Buildings standing: ' + G.map.filter(t => t.b).length +
        ' &middot; State hash: ' + stateHash(G) + '</div>' +
      '<div class="row" style="margin-top:8px">' +
      '<button id="againbtn">New game (seed ' + G.seed + ')</button>' +
      '<button id="sandbtn">Keep playing (sandbox)</button>' +
      '<button id="closebtn">Close summary</button></div>' +
      '</div></div>';
    host.querySelector(".modal").addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.id === "againbtn") startNew(G.seed);
      else if (b.id === "sandbtn"){ G.sandbox = true; G.over = false; UI.dismissed = true; render(); }
      else { UI.dismissed = true; render(); }
    });
    return;
  }
  host.innerHTML = "";
}

function render(){
  renderHeader();
  const tabs = { map:renderMap, people:renderPeople, research:renderResearch, trade:renderTrade, log:renderLog, dev:renderDev };
  for (const k in tabs){
    const el = $("panel-" + k);
    if (k === UI.tab){ el.hidden = false; tabs[k](); } else { el.hidden = true; el.innerHTML = ""; }
  }
  for (const b of document.querySelectorAll(".tab")) b.setAttribute("aria-selected", b.getAttribute("data-tab") === UI.tab ? "true" : "false");
  let banner = document.getElementById("flashbar");
  if (UI.flashMsg){
    if (!banner){
      banner = document.createElement("div");
      banner.id = "flashbar";
      banner.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:10px;z-index:80;" +
        "background:#2b1f14;border:1px solid var(--acc);border-radius:4px;padding:6px 10px;font-size:12px;max-width:92vw";
      document.body.appendChild(banner);
    }
    banner.textContent = UI.flashMsg;
  } else if (banner) banner.remove();
  renderModal();
}

function afterTurn(){
  UI.dismissed = false;
  render();
}
function endTurn(){
  if (G.pending){ flash("Resolve the pending event decision first."); return; }
  if (G.over && !G.sandbox){ flash("The run is over - start a new game or switch to sandbox."); return; }
  stepTurn(G, null);
  afterTurn();
}
function startNew(seed){
  G = newGame(seed);
  UI = { tab:UI.tab, sel:-1, logFilter:"all", devOut:"", saveMsg:"", tradeQty:{}, saveText:"" };
  $("seedin").value = G.seed;
  render();
}

$("endbtn").addEventListener("click", endTurn);
$("newbtn").addEventListener("click", () => {
  const v = parseInt($("seedin").value, 10);
  startNew(isFinite(v) ? v : 1337);
});
$("tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  UI.tab = b.getAttribute("data-tab"); render();
});
document.addEventListener("keydown", e => {
  // never hijack typing, and let Space activate a focused button natively
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || tag === "select" || tag === "button") return;
  const order = ["map","people","research","trade","log","dev"];
  if (e.code === "Space"){ e.preventDefault(); if (!G.pending) endTurn(); return; }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 6){ UI.tab = order[n-1]; render(); }
  if (e.key === "Escape"){ hideTip(); if (G.over) { UI.dismissed = true; render(); } }
});

/* boot */
wireEvents();
render();

</script>
